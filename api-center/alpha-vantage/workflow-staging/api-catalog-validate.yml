name: Validate GPTs API Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/baostock/requirements.txt
            api-center/eodhd/requirements.txt
            api-center/data-commons/requirements.txt
            api-center/qweather/requirements.txt
            api-center/miaoxiang-mcp/requirements.txt
            api-center/browserless/requirements.txt
            api-center/east-asia-econ/requirements.txt
            api-center/alpha-vantage/requirements.txt

      - name: Install isolated API dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/baostock/requirements.txt \
            -r api-center/eodhd/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/qweather/requirements.txt \
            -r api-center/miaoxiang-mcp/requirements.txt \
            -r api-center/browserless/requirements.txt \
            -r api-center/east-asia-econ/requirements.txt \
            -r api-center/alpha-vantage/requirements.txt
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Rebuild and run API-center tests
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_config.py \
            api-center/build_catalog.py \
            api-center/build_catalog_market_search.py \
            api-center/baostock/baostock_task.py \
            api-center/eodhd/eodhd_task.py \
            api-center/data-commons/data_commons_task.py \
            api-center/qweather/qweather_task.py \
            api-center/miaoxiang-mcp/miaoxiang_mcp_task.py \
            api-center/browserless/browserless_task.py \
            api-center/east-asia-econ/east_asia_econ_task.py \
            api-center/alpha-vantage/alpha_vantage_task.py \
            api-center/tests/*.py \
            api-center/browserless/tests/*.py \
            api-center/east-asia-econ/tests/*.py \
            api-center/alpha-vantage/tests/*.py
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/eodhd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/data-commons/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/qweather/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/miaoxiang-mcp/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/browserless/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/east-asia-econ/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/alpha-vantage/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v

      - name: Verify deterministic contracts and provider invariants
        run: |
          set -euo pipefail
          cmp /tmp/committed-api-catalog.json api-center/api-catalog.json
          cmp /tmp/committed-api-catalog.md api-center/api-catalog.md
          cmp /tmp/committed-connector-manifest.json api-center/connector-manifest.json
          cmp /tmp/committed-krakend.validation.json api-center/krakend.validation.json
          cmp /tmp/committed-krakend.tmpl api-center/krakend.tmpl
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}

          assert catalog['schema_version'] == 'api-catalog-v3'
          assert manifest['connector_count'] == manifest['enabled_connector_count'] == 68
          assert catalog['managed_provider_count'] == len(providers) == 25
          assert catalog['enabled_managed_provider_count'] == 25
          assert catalog['managed_operation_count'] == sum(
              len(row['operations']) for row in providers.values()
          ) == 306
          assert catalog['secret_values_exposed'] is False
          assert all(row['enabled'] is True for row in providers.values())
          assert all(row['secret_value_exposed'] is False for row in providers.values())
          assert set(catalog['managed_provider_catalog_files']) == {
              'google-cloud/provider-catalog.json',
              'akshare/provider-catalog.json',
              'aifin-market/provider-catalog.json',
              'yuandian/provider-catalog.json',
              'company-intelligence/provider-catalog.json',
              'web-retrieval/provider-catalog.json',
              'market-search/provider-catalog.json',
              'tushare/provider-catalog.json',
              'baostock/provider-catalog.json',
              'eodhd/provider-catalog.json',
              'data-commons/provider-catalog.json',
              'qweather/provider-catalog.json',
              'miaoxiang-mcp/provider-catalog.json',
              'east-asia-econ/provider-catalog.json',
              'alpha-vantage/provider-catalog.json',
              'knowledge-tools/provider-catalog.json',
          }

          browserless = providers['browserless']
          assert browserless['ticket_prefix'] == '[api-browserless]'
          assert browserless['required_secret_environment_variable_name'] == 'BROWSERLESS_TOKEN'
          assert len(browserless['operations']) == 8
          assert {row['operation_id'] for row in browserless['operations']} == {
              'catalog-capabilities', 'content', 'scrape', 'screenshot',
              'pdf', 'performance', 'search', 'map'
          }
          limits = browserless['limits']
          assert limits['fixed_api_host'] == 'production-sfo.browserless.io'
          for key in (
              'arbitrary_api_hosts_allowed',
              'arbitrary_code_allowed',
              'websocket_sessions_allowed',
              'profiles_allowed',
              'custom_headers_allowed',
              'cookies_allowed',
              'proxy_configuration_allowed',
              'captcha_or_unblock_allowed',
              'write_operations_allowed',
          ):
              assert limits[key] is False

          east_asia = providers['east-asia-econ']
          assert east_asia['ticket_prefix'] == '[api-east-asia-econ]'
          assert east_asia['required_secret_environment_variable_name'] == 'EAST_ASIA_ECON_API_KEY'
          assert len(east_asia['operations']) == 6
          assert {row['operation_id'] for row in east_asia['operations']} == {
              'catalog-capabilities', 'search-series', 'series-info',
              'database-stats', 'series-data', 'usage'
          }
          east_limits = east_asia['limits']
          assert east_limits['fixed_api_host'] == 'data-api.eastasiaecon.com'
          assert east_limits['requests_per_ticket_max'] == 1
          for key in (
              'arbitrary_urls_allowed',
              'arbitrary_hosts_allowed',
              'arbitrary_paths_allowed',
              'arbitrary_headers_allowed',
              'client_supplied_api_key_allowed',
              'redirects_allowed',
              'write_operations_allowed',
              'personal_data_allowed',
          ):
              assert east_limits[key] is False

          alpha_vantage = providers['alpha-vantage']
          assert alpha_vantage['ticket_prefix'] == '[api-alpha-vantage]'
          assert alpha_vantage['required_secret_environment_variable_name'] == 'ALPHA_VANTAGE_API_KEY'
          assert len(alpha_vantage['operations']) == 66
          alpha_limits = alpha_vantage['limits']
          assert alpha_limits['fixed_api_host'] == 'www.alphavantage.co'
          assert alpha_limits['requests_per_ticket_max'] == 1
          assert alpha_limits['provider_concurrency_max'] == 1
          for key in (
              'arbitrary_functions_allowed',
              'arbitrary_urls_allowed',
              'arbitrary_headers_allowed',
              'client_supplied_api_key_allowed',
              'redirects_allowed',
              'write_operations_allowed',
              'trading_or_order_execution_allowed',
          ):
              assert alpha_limits[key] is False

          assert providers['data-commons']['required_secret_environment_variable_name'] == 'GOOGLE_DATA_COMMONS_API_KEY'
          assert providers['qweather']['limits']['fixed_api_host'] == 'ka6r72kcc3.re.qweatherapi.com'
          assert providers['miaoxiang-mcp']['required_secret_environment_variable_name'] == 'EM_API_KEY'
          assert providers['baostock']['required_secret_environment_variable_name'] == ''
          assert providers['eodhd']['required_secret_environment_variable_name'] == 'EODHD_API_TOKEN'

          print(json.dumps({
              'status': 'PASS',
              'connectors': 68,
              'managed_providers': 25,
              'managed_operations': 306,
              'browserless_operations': 8,
              'east_asia_econ_operations': 6,
              'alpha_vantage_operations': 66,
          }))
          PY
          git diff --check

      - name: Upload safe catalog and generated gateway evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpts-api-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/catalog-metadata.json
            api-center/connector-manifest.json
            api-center/krakend.tmpl
            api-center/krakend.validation.json
            api-center/google-cloud/provider-catalog.json
            api-center/data-commons/provider-catalog.json
            api-center/qweather/provider-catalog.json
            api-center/miaoxiang-mcp/provider-catalog.json
            api-center/browserless/ticket.schema.json
            api-center/east-asia-econ/provider-catalog.json
            api-center/east-asia-econ/ticket.schema.json
            api-center/alpha-vantage/provider-catalog.json
            api-center/alpha-vantage/ticket.schema.json
            api-center/web-retrieval/provider-catalog.json
            api-center/market-search/provider-catalog.json
            api-center/tushare/provider-catalog.json
            api-center/baostock/provider-catalog.json
            api-center/eodhd/provider-catalog.json
            api-center/knowledge-tools/provider-catalog.json
          if-no-files-found: error
          retention-days: 30
