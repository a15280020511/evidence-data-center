services:
  api-center:
    build:
      context: .
      dockerfile: Dockerfile
    image: independent-api-center:2.13.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FC_ENABLE: "1"
      AMAP_API_KEY: "${AMAP_API_KEY:?AMAP_API_KEY is required}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
