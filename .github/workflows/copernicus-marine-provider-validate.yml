name: Validate Copernicus Marine Provider

on:
  pull_request:
    paths:
      - "api-center/copernicus-marine/**"
      - ".github/workflows/copernicus-marine-*.yml"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.*"
  push:
    branches: [main]
    paths:
      - "api-center/copernicus-marine/**"
      - ".github/workflows/copernicus-marine-*.yml"

permissions:
  contents: read

concurrency:
  group: copernicus-marine-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/copernicus-marine/requirements.txt
      - name: Install pinned Toolbox
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/copernicus-marine/requirements.txt
          python -m pip check
      - name: Compile and test
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/copernicus-marine/copernicus_marine_task.py
          python -m unittest discover -s api-center/copernicus-marine/tests -p 'test_*.py' -v
          python - <<'PY'
          import copernicusmarine
          assert copernicusmarine.__version__ == '2.4.1'
          print({'status': 'PASS', 'copernicusmarine_version': copernicusmarine.__version__})
          PY
          git diff --check
