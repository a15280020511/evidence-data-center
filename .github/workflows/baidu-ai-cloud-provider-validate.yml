name: Validate Baidu AI Cloud Provider

on:
  pull_request:
    paths:
      - 'api-center/baidu-ai-cloud/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - 'api-center/tests/test_capability_maximization.py'
      - '.github/workflows/baidu-ai-cloud-*.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/baidu-ai-cloud/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - 'api-center/tests/test_capability_maximization.py'
      - '.github/workflows/baidu-ai-cloud-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-baidu-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/baidu-ai-cloud/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baidu-ai-cloud/requirements.txt
          python -m pip check
      - name: Regenerate and compare frozen Baidu contracts
        run: |
          python api-center/baidu-ai-cloud/build_free_catalog.py
          git diff --exit-code -- \
            api-center/baidu-ai-cloud/provider-catalog.json \
            api-center/baidu-ai-cloud/ticket.schema.json \
            api-center/baidu-ai-cloud/free-quota-policy.json
      - name: Compile and unit test provider
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/baidu-ai-cloud/build_free_catalog.py \
            api-center/baidu-ai-cloud/baidu_ai_cloud_task.py
          PYTHONPATH=api-center python -m unittest discover \
            -s api-center/baidu-ai-cloud/tests \
            -p 'test_*.py'
      - name: Validate bounded free search and Baike contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider=json.loads(Path('api-center/baidu-ai-cloud/provider-catalog.json').read_text())['providers'][0]
          quota=json.loads(Path('api-center/baidu-ai-cloud/free-quota-policy.json').read_text())
          operation_ids={row['operation_id'] for row in provider['operations']}
          expected={
              'catalog-capabilities','quota-policy','web-search','web-summary',
              'baike-lemma-list','baike-lemma-content',
              'baike-starmap-list','baike-starmap-detail',
          }
          assert provider['provider_id']=='baidu-ai-cloud'
          assert provider['enabled'] is True
          assert operation_ids==expected
          assert len(provider['operations'])==8
          limits=provider['limits']
          assert limits['requests_per_ticket_max']==1
          assert limits['fixed_api_hosts']==['qianfan.baidubce.com','appbuilder.baidu.com']
          assert limits['fixed_paths']==[
              '/v2/ai_search/web_search','/v2/ai_search/web_summary',
              '/v2/baike/lemma/get_list_by_title','/v2/baike/lemma/get_content',
              '/v2/tools/baike/starmap/get_starmap_by_title',
              '/v2/tools/baike/starmap/get_starmap_by_id',
          ]
          assert limits['paid_fallback_authorized'] is False
          assert limits['generative_model_chat_allowed'] is False
          assert limits['generative_search_summary_allowed'] is True
          assert limits['model_calls_per_web_summary']==1
          assert limits['baike_structured_read_allowed'] is True
          assert limits['baike_video_allowed'] is False
          assert limits['nlp_operations_allowed'] is False
          assert limits['ocr_operations_allowed'] is False
          assert limits['image_recognition_operations_allowed'] is False
          assert limits['arbitrary_urls_allowed'] is False
          assert limits['automatic_pagination_allowed'] is False
          assert limits['automatic_retries_allowed'] is False
          assert limits['write_operations_allowed'] is False
          assert limits['secret_values_exposed'] is False
          assert quota['policy']['free_only'] is True
          assert quota['policy']['paid_fallback_authorized'] is False
          families={row['family']:row for row in quota['families']}
          assert families['baidu-ai-search']['operations']==['web-search','web-summary']
          assert families['baidu-baike']['operations']==[
              'baike-lemma-list','baike-lemma-content',
              'baike-starmap-list','baike-starmap-detail',
          ]
          assert families['baidu-baike']['verified_with_current_key'] is True
          PY
          git diff --check
      - name: Generate authoritative aggregate catalog artifact
        run: |
          mkdir -p baidu-ai-catalog-artifact
          python api-center/build_catalog_market_search.py \
            --json-output baidu-ai-catalog-artifact/api-catalog.json \
            --markdown-output baidu-ai-catalog-artifact/api-catalog.md
          python - <<'PY'
          import json
          from pathlib import Path

          catalog=json.loads(Path('baidu-ai-catalog-artifact/api-catalog.json').read_text())
          rows={row['provider_id']:row for row in catalog['managed_providers']}
          assert rows['baidu-ai-cloud']['operation_count']==8
          assert rows['baidu-ai-cloud']['secret_value_exposed'] is False
          assert catalog['managed_provider_count']==len(rows)
          assert catalog['managed_operation_count']==sum(row['operation_count'] for row in rows.values())
          assert catalog['direct_center_to_center_calls_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          PY
      - name: Upload generated catalog
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baidu-ai-generated-catalog-${{ github.run_id }}
          path: baidu-ai-catalog-artifact/
          if-no-files-found: warn
          retention-days: 30
