name: Validate Baidu AI Cloud Provider

on:
  pull_request:
    paths:
      - 'api-center/baidu-ai-cloud/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/baidu-ai-cloud-*.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/baidu-ai-cloud/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/baidu-ai-cloud-*.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-baidu-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/baidu-ai-cloud/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baidu-ai-cloud/requirements.txt
          python -m pip check
      - name: Generate frozen Baidu contracts
        run: python api-center/baidu-ai-cloud/build_free_catalog.py
      - name: Compile and unit test provider
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/baidu-ai-cloud/build_free_catalog.py \
            api-center/baidu-ai-cloud/baidu_ai_cloud_task.py
          PYTHONPATH=api-center python -m unittest discover \
            -s api-center/baidu-ai-cloud/tests \
            -p 'test_*.py'
      - name: Validate catalog and quota policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider=json.loads(Path('api-center/baidu-ai-cloud/provider-catalog.json').read_text())['providers'][0]
          quota=json.loads(Path('api-center/baidu-ai-cloud/free-quota-policy.json').read_text())
          assert provider['provider_id']=='baidu-ai-cloud'
          assert provider['enabled'] is True
          assert len(provider['operations'])==41
          assert provider['limits']['requests_per_ticket_max']==1
          assert provider['limits']['max_deep_search_queries']==3
          assert provider['limits']['paid_fallback_authorized'] is False
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['arbitrary_headers_allowed'] is False
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['automatic_retries_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['face_or_biometric_operations_allowed'] is False
          assert provider['limits']['identity_document_ocr_allowed'] is False
          assert provider['limits']['speech_operations_allowed'] is False
          assert provider['limits']['secret_values_exposed'] is False
          assert quota['policy']['free_only'] is True
          assert quota['policy']['paid_fallback_authorized'] is False
          PY
          git diff --check
      - name: Generate authoritative aggregate catalog artifact
        run: |
          mkdir -p baidu-ai-catalog-artifact
          python api-center/build_catalog_market_search.py \
            --json-output baidu-ai-catalog-artifact/api-catalog.json \
            --markdown-output baidu-ai-catalog-artifact/api-catalog.md
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('baidu-ai-catalog-artifact/api-catalog.json').read_text())
          rows={row['provider_id']:row for row in catalog['managed_providers']}
          assert rows['baidu-ai-cloud']['operation_count']==41
          assert rows['baidu-ai-cloud']['secret_value_exposed'] is False
          assert catalog['managed_provider_count']==62
          assert catalog['managed_operation_count']==715
          assert catalog['managed_operation_count']==sum(row['operation_count'] for row in rows.values())
          PY
      - name: Upload generated catalog
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baidu-ai-generated-catalog-${{ github.run_id }}
          path: baidu-ai-catalog-artifact/
          if-no-files-found: warn
          retention-days: 30
