name: Finalize Open Toolkit Contract Counts

on:
  push:
    branches: [feat/open-intelligence-toolkit-20260804]
    paths:
      - .github/workflows/finalize-open-toolkit-contract-counts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-open-toolkit-contract-counts
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/open-intelligence-toolkit-20260804
      - name: Patch exact frozen assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/api-catalog-validate.yml')
          text=path.read_text(encoding='utf-8')
          replacements={
              "== 758":"== 756",
              "'open-intelligence-toolkit': 22":"'open-intelligence-toolkit': 20",
          }
          for old,new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'missing expected contract: {old}')
              text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          assert '== 758' not in text
          assert "'open-intelligence-toolkit': 22" not in text
          assert '== 756' in text
          assert "'open-intelligence-toolkit': 20" in text
          PY
          git diff --check
      - name: Commit final count contracts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/api-catalog-validate.yml
          if git diff --cached --quiet; then
            echo 'Counts already synchronized'
            exit 0
          fi
          git commit -m 'test: finalize toolkit provider and operation counts'
          git push origin HEAD:feat/open-intelligence-toolkit-20260804
