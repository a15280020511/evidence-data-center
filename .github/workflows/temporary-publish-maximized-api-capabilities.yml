name: Temporary publish maximized API capabilities

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  PATCH_SOURCE_ISSUE: 31
  PATCH_B64_LENGTH: 85592
  PATCH_SHA256: 0000fab8f91e3a4c4d44c54b8ea4fb2958d92e43e1981f8bca3e7b236045f261
  REPLACE_POSITION: 5849
  REPLACE_CHARACTER: E
  INSERT_POSITION: 8779
  INSERT_CHARACTER: n

jobs:
  publish:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-publish-maximized-api-capabilities]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: api-capability-publisher
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
      API_CENTER_SECRETS_JSON: ${{ secrets.API_CENTER_SECRETS_JSON }}

    steps:
      - name: Report start
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="MAXIMIZED_API_RELEASE_RUN_ID=${GITHUB_RUN_ID}\nSTATUS=started"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Reconstruct and verify audited capability archive
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PATCH_SOURCE_ISSUE}/comments?per_page=100" > /tmp/source-comments.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          raw = Path('/tmp/source-comments.json').read_text(encoding='utf-8')
          try:
              rows = json.loads(raw)
          except json.JSONDecodeError:
              decoder = json.JSONDecoder()
              rows = []
              offset = 0
              while offset < len(raw):
                  while offset < len(raw) and raw[offset].isspace():
                      offset += 1
                  if offset >= len(raw):
                      break
                  value, offset = decoder.raw_decode(raw, offset)
                  rows.extend(value if isinstance(value, list) else [value])

          chunks = {}
          pattern = re.compile(
              r'PATCH_CHUNK_(\d{3})\s*\n(.*?)(?=PATCH_CHUNK_\d{3}\s*\n|\Z)',
              re.DOTALL,
          )
          for row in rows:
              body = str(row.get('body') or '')
              for match in pattern.finditer(body):
                  index = int(match.group(1))
                  payload = re.sub(r'[^A-Za-z0-9+/=]', '', match.group(2))
                  if payload:
                      chunks[index] = payload

          if sorted(chunks) != list(range(1, 9)):
              raise SystemExit(f'invalid source chunk set: {sorted(chunks)}')
          joined = ''.join(chunks[index] for index in range(1, 9))
          if len(joined) != int(os.environ['PATCH_B64_LENGTH']) - 1:
              raise SystemExit(f'invalid damaged source length: {len(joined)}')

          replace_position = int(os.environ['REPLACE_POSITION'])
          insert_position = int(os.environ['INSERT_POSITION'])
          replace_character = os.environ['REPLACE_CHARACTER']
          insert_character = os.environ['INSERT_CHARACTER']
          corrected = (
              joined[:replace_position]
              + replace_character
              + joined[replace_position + 1:]
          )
          repaired = corrected[:insert_position] + insert_character + corrected[insert_position:]
          if len(repaired) != int(os.environ['PATCH_B64_LENGTH']):
              raise SystemExit(f'invalid repaired length: {len(repaired)}')
          archive = base64.b64decode(repaired, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != os.environ['PATCH_SHA256']:
              raise SystemExit(f'archive SHA-256 mismatch: {digest}')
          Path('/tmp/capability-patch.tar.gz').write_bytes(archive)
          print(json.dumps({
              'status': 'ARCHIVE_RECOVERED',
              'bytes': len(archive),
              'sha256': digest,
              'replace_position': replace_position,
              'insert_position': insert_position,
          }))
          PY
          tar -tzf /tmp/capability-patch.tar.gz >/tmp/capability-patch-files.txt
          test "$(wc -l </tmp/capability-patch-files.txt)" -ge 70

      - name: Apply capability archive and deterministic corrections
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/capability-patch.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('api-center/tests/test_api_catalog.py'): [
                  ("assert catalog['schema_version'] == 'api-catalog-v2'", "assert catalog['schema_version'] == 'api-catalog-v3'"),
              ],
              Path('.github/workflows/api-catalog-validate.yml'): [
                  ("assert catalog['schema_version'] == 'api-catalog-v2'", "assert catalog['schema_version'] == 'api-catalog-v3'"),
                  ("assert sum(len(row['operations']) for row in catalog['managed_providers']) == 31", "assert sum(len(row['operations']) for row in catalog['managed_providers']) == 53"),
                  ("'managed_operations': 31", "'managed_operations': 53"),
              ],
          }
          for path, rows in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in rows:
                  if old not in text and new not in text:
                      raise SystemExit(f'expected contract text missing in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Rebuild and assert complete capability contracts
        shell: bash
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          wind = json.loads(Path('api-center/aifin-market/provider-catalog.json').read_text(encoding='utf-8'))
          facts = {
              'schema': catalog['schema_version'],
              'connectors': manifest['connector_count'],
              'enabled_connectors': manifest['enabled_connector_count'],
              'managed_providers': catalog['managed_provider_count'],
              'enabled_managed_providers': catalog['enabled_managed_provider_count'],
              'managed_operations': sum(len(row['operations']) for row in catalog['managed_providers']),
              'exposed_parameters': catalog['exposed_parameter_count'],
              'wind_operations': len(wind['providers'][0]['operations']),
          }
          assert facts == {
              'schema': 'api-catalog-v3',
              'connectors': 69,
              'enabled_connectors': 69,
              'managed_providers': 6,
              'enabled_managed_providers': 6,
              'managed_operations': 53,
              'exposed_parameters': 530,
              'wind_operations': 17,
          }, facts
          assert catalog['secret_values_exposed'] is False
          print(json.dumps(facts, ensure_ascii=False))
          PY

      - name: Install all locked provider dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/akshare/requirements.txt
          python -m pip check

      - name: Run complete zero-write test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q api-center
          python -m unittest discover -s api-center/tests -v
          python -m unittest discover -s api-center/google-cloud/tests -v
          python -m unittest discover -s api-center/data-commons/tests -v
          python -m unittest discover -s api-center/aifin-market/tests -v
          python -m unittest discover -s api-center/akshare/tests -v

      - name: Resolve Wind credential without exposing value
        shell: bash
        run: |
          set -euo pipefail
          resolved="${WIND_API_KEY:-}"
          if [[ -z "${resolved}" && -n "${API_CENTER_SECRETS_JSON:-}" ]]; then
            resolved="$(python - <<'PY'
          import json
          import os
          try:
              value = json.loads(os.environ.get('API_CENTER_SECRETS_JSON') or '{}').get('WIND_API_KEY') or ''
          except Exception:
              value = ''
          print(str(value), end='')
          PY
            )"
          fi
          [[ -n "${resolved}" ]] || { echo 'WIND_API_KEY missing'; exit 1; }
          echo "WIND_API_KEY=${resolved}" >> "$GITHUB_ENV"

      - name: Real Wind expanded capability smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wind-smoke && mkdir -p /tmp/wind-smoke
          cat > /tmp/wind-ticket.json <<'JSON'
          {
            "task_id": "maximized-api-wind-basicinfo-20260731",
            "objective": "Verify expanded Wind company basic information operation",
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "operation": "stock-basicinfo",
            "parameters": {"windcode": "600519.SH"}
          }
          JSON
          success=false
          for attempt in 1 2 3; do
            rm -rf /tmp/wind-smoke/*
            if python api-center/aifin-market/aifin_task.py execute --ticket /tmp/wind-ticket.json --output-dir /tmp/wind-smoke; then
              success=true
              break
            fi
            sleep $((attempt * 5))
          done
          [[ "${success}" == true ]]
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/wind-smoke/aifin-snapshot.json').read_text(encoding='utf-8'))
          assert row['status'] == 'API_AIFIN_COMPLETED', row
          assert row.get('upstream_called') is True, row
          assert row.get('result') not in (None, {}, [], ''), row
          print('WIND_EXPANDED_SMOKE_OK')
          PY

      - name: Real AKShare expanded capability smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/akshare-smoke && mkdir -p /tmp/akshare-smoke
          cat > /tmp/akshare-ticket.json <<'JSON'
          {
            "task_id": "maximized-api-akshare-gdp-20260731",
            "objective": "Verify expanded AKShare China GDP operation",
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "operation": "macro-china-gdp",
            "parameters": {}
          }
          JSON
          success=false
          for attempt in 1 2 3; do
            rm -rf /tmp/akshare-smoke/*
            if python api-center/akshare/akshare_task.py execute --ticket /tmp/akshare-ticket.json --output-dir /tmp/akshare-smoke; then
              success=true
              break
            fi
            sleep $((attempt * 5))
          done
          [[ "${success}" == true ]]
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/akshare-smoke/akshare-snapshot.json').read_text(encoding='utf-8'))
          assert row['status'] == 'API_AKSHARE_COMPLETED', row
          assert row.get('upstream_called') is True, row
          assert row.get('result') not in (None, {}, [], ''), row
          print('AKSHARE_EXPANDED_SMOKE_OK')
          PY

      - name: Remove all temporary transfer and publisher workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/temporary-apply-capability-patch.yml \
            .github/workflows/temporary-apply-capability-patch-v2.yml \
            .github/workflows/temporary-robust-capability-applicator.yml \
            .github/workflows/temporary-finalize-capabilities.yml \
            .github/workflows/temporary-finalize-capabilities-v2.yml \
            .github/workflows/temporary-finalize-capabilities-v3.yml \
            .github/workflows/temporary-finalize-capabilities-v4.yml \
            .github/workflows/temporary-finalize-capabilities-v5.yml \
            .github/workflows/temporary-export-capability-sources.yml \
            .github/workflows/temporary-publish-maximized-api-capabilities.yml
          git diff --check

      - name: Publish validated capability release to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: maximize safe read-only API capabilities"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish completion receipt
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=completed\nMAIN_SHA=${{ steps.publish.outputs.sha }}\nCATALOG_SCHEMA=api-catalog-v3\nCONNECTORS=69/69\nMANAGED_PROVIDERS=6/6\nMANAGED_OPERATIONS=53\nEXPOSED_PARAMETERS=530\nWIND_OPERATIONS=17\nWIND_REAL_SMOKE=passed\nAKSHARE_REAL_SMOKE=passed\nSECRET_VALUES_EXPOSED=false\nTEMPORARY_WORKFLOWS_REMOVED=true"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" \
            -f state=closed -f state_reason=completed >/dev/null

      - name: Publish structured failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=failed\nRUN_ID=${GITHUB_RUN_ID}\nNo capability payload was published by this failed run."
