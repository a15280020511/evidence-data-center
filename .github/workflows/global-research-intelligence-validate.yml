name: Validate Global Research Intelligence

on:
  pull_request:
    paths:
      - "api-center/global-research-intelligence/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/**"
      - ".github/workflows/global-research-intelligence-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/global-research-intelligence/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/**"
      - ".github/workflows/global-research-intelligence-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-global-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        operation:
          - catalog-capabilities
          - source-inventory
          - think-tank-source-catalog
          - search-arxiv
          - get-arxiv-entry
          - identify-un-digital-library
          - list-un-digital-library-records
          - get-un-digital-library-record
          - get-sec-submissions
          - get-sec-company-facts
          - get-sec-xbrl-frame
          - list-congress-bills
          - list-congress-hearings
          - get-congress-crs-report
          - search-courtlistener
          - get-courtlistener-opinion
          - search-nasdaq-data-link
          - get-nasdaq-dataset
          - finnhub-company-news
          - finnhub-transcripts-list
          - finnhub-transcript
          - scopus-search
          - scopus-abstract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-research-intelligence/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-research-intelligence/requirements.txt
          python -m pip check
      - name: Compile and execute zero-network fixture
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-research-intelligence/global_research_intelligence_task.py \
            api-center/global-research-intelligence/validate_global_research_intelligence.py
          mkdir -p global-research-validation
          python api-center/global-research-intelligence/validate_global_research_intelligence.py \
            --operation "${{ matrix.operation }}" \
            --output "global-research-validation/${{ matrix.operation }}.json"
      - name: Verify governance receipt
        env:
          OPERATION: ${{ matrix.operation }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          operation = os.environ['OPERATION']
          row = json.loads((Path('global-research-validation') / f'{operation}.json').read_text(encoding='utf-8'))
          assert row['status'] == 'PASS'
          assert row['operation'] == operation
          assert row['network_used'] is False
          assert row['fixture_mode'] is True
          assert row['secret_values_exposed'] is False
          assert row['model_calls'] == 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-research-${{ matrix.operation }}-${{ github.run_id }}
          path: global-research-validation/
          if-no-files-found: warn
          retention-days: 30

  catalog-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install core dependency
        run: python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
      - name: Verify provider, source inventory and aggregate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider = json.loads(Path('api-center/global-research-intelligence/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          schema = json.loads(Path('api-center/global-research-intelligence/ticket.schema.json').read_text(encoding='utf-8'))
          inventory = json.loads(Path('api-center/global-research-intelligence/source-inventory.json').read_text(encoding='utf-8'))
          think_tanks = json.loads(Path('api-center/global-research-intelligence/think-tank-sources.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          operations = [row['operation_id'] for row in provider['operations']]
          assert provider['provider_id'] == 'global-research-intelligence'
          assert provider['ticket_prefix'] == '[intel-global-research]'
          assert len(operations) == len(set(operations)) == 23
          assert set(operations) == set(schema['properties']['operation']['enum'])
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['trading_or_order_execution_allowed'] is False
          assert inventory['summary']['new_direct_source_families']
          assert len(think_tanks['sources']) >= 20
          rows = {row['provider_id']: row for row in catalog['managed_providers']}
          assert rows['global-research-intelligence']['operation_count'] == 23
          assert catalog['managed_provider_count'] == len(rows)
          assert sum(row['operation_count'] for row in rows.values()) == catalog['managed_operation_count']
          assert catalog['direct_center_to_center_calls_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          PY
          git diff --check
