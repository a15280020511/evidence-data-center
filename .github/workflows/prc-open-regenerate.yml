name: PRC Open Intelligence Regenerate

on:
  push:
    branches: [feat/prc-free-intelligence-suite]
    paths:
      - ".github/workflows/prc-open-regenerate.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout synced feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/prc-free-intelligence-suite

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input -r api-center/prc-open-intelligence/requirements.txt

      - name: Validate feature contracts
        run: |
          python -m unittest discover -s api-center/prc-open-intelligence/tests -p 'test_*.py' -v
          python api-center/prc-open-intelligence/validate_registry.py

      - name: Rebuild current catalog
        run: python api-center/build_catalog.py

      - name: Commit generated catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md
          if git diff --cached --quiet; then
            echo "Catalog already current."
            exit 0
          fi
          git commit -m "chore(prc-intel): regenerate synced API catalog"
          git push origin HEAD:feat/prc-free-intelligence-suite
