name: Temporary Remove FAOSTAT Provider

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/remove_faostat.py"
      - ".github/workflows/remove-faostat-migration.yml"

permissions:
  contents: write

concurrency:
  group: remove-faostat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout removal branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remove/faostat-20260802
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply deterministic removal
        run: python tools/remove_faostat.py
      - name: Validate affected runtime and catalog
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/wto/requirements.txt \
            -r api-center/imf/requirements.txt
          python -m pip check
          python -m py_compile \
            api-center/build_catalog_market_search.py \
            api-center/international-statistics/provider_task.py \
            api-center/international-statistics/tests/test_international_statistics.py \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py
          python -m unittest discover -s api-center/international-statistics/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          python api-center/build_catalog_market_search.py
          git diff --check
          ! grep -Rni --exclude='*.pyc' --exclude-dir='__pycache__' 'faostat' api-center
      - name: Commit API-center removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "chore: remove FAOSTAT from intelligence center"
          git push origin HEAD:remove/faostat-20260802
