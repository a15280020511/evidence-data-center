name: Refresh Tushare Catalog Contracts

on:
  push:
    branches:
      - feat/replace-tianditu-with-tushare
    paths:
      - ".github/workflows/tushare-catalog-refresh.yml"
      - "api-center/tushare/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tushare-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository_owner == 'a15280020511'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/replace-tianditu-with-tushare

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Generate deterministic contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py

      - name: Commit generated catalog only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- api-center/api-catalog.json api-center/api-catalog.md; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md
          git commit -m "chore(catalog): regenerate after Tushare replacement"
          git push origin HEAD:feat/replace-tianditu-with-tushare
