name: Google runtime repair v2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] repair-google-runtime-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: fix/google-provider-runtime-reliability-20260801
    steps:
      - name: Publish start receipt
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="GOOGLE_RUNTIME_REPAIR_STARTED run=${GITHUB_RUN_ID} branch=${TARGET_BRANCH} model_calls=0"

      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/google-cloud/requirements.txt
            api-center/data-commons/requirements.txt

      - name: Apply repair
        run: python maintenance/google_runtime_repair.py

      - name: Install dependencies and run tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/data-commons/requirements.txt
          python -m pip check
          python -m py_compile \
            api-center/google-cloud/google_cloud_task.py \
            api-center/data-commons/data_commons_task.py \
            api-center/google-cloud/tests/test_google_runtime_repair.py \
            api-center/data-commons/tests/test_data_commons_key_validation.py
          python -m unittest discover -s api-center/google-cloud/tests -v
          python -m unittest discover -s api-center/data-commons/tests -v

      - name: Commit repair
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-center/google-cloud api-center/data-commons
          git diff --cached --check
          git commit -m 'fix(api-center): harden Google provider runtimes'
          git push origin HEAD:${TARGET_BRANCH}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish completion receipt
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="GOOGLE_RUNTIME_REPAIR_COMPLETED commit=${{ steps.commit.outputs.sha }} branch=${TARGET_BRANCH} tests=passed model_calls=0"
