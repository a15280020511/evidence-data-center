name: Temporary generate YuanDian catalog

on:
  push:
    branches: [feat/yuandian-legal-api]

permissions:
  contents: write

concurrency:
  group: temporary-yuandian-generate
  cancel-in-progress: false

jobs:
  generate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/google-cloud/requirements.txt
            api-center/data-commons/requirements.txt
            api-center/akshare/requirements.txt
            api-center/yuandian/requirements.txt

      - name: Assemble deterministic source and provider contracts
        run: |
          set -euo pipefail
          cat \
            api-center/yuandian/_task-part-0.frag \
            api-center/yuandian/_task-part-1.frag \
            api-center/yuandian/_task-part-2.frag \
            > api-center/yuandian/yuandian_task.py
          rm api-center/yuandian/_task-part-*.frag
          python api-center/yuandian/build_snapshot.py
          python api-center/yuandian/build_provider_catalog.py
          python - <<'PY'
          from pathlib import Path
          path = Path('api-center/build_catalog.py')
          text = path.read_text(encoding='utf-8')
          provider_anchor = '    HERE / "aifin-market/provider-catalog.json",\n'
          provider_line = '    HERE / "yuandian/provider-catalog.json",\n'
          if provider_line not in text:
              if provider_anchor not in text:
                  raise SystemExit('provider catalog anchor missing')
              text = text.replace(provider_anchor, provider_anchor + provider_line, 1)
          detail_anchor = '            "aifin-market/readonly-tools.snapshot.json",\n'
          detail_lines = (
              '            "yuandian/provider-catalog.json",\n'
              '            "yuandian/readonly-apis.snapshot.json",\n'
          )
          if detail_lines not in text:
              if detail_anchor not in text:
                  raise SystemExit('detail file anchor missing')
              text = text.replace(detail_anchor, detail_anchor + detail_lines, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install all locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/akshare/requirements.txt \
            -r api-center/yuandian/requirements.txt
          python -m pip check

      - name: Generate contracts and run all tests
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog.py
          python -m compileall -q api-center
          python -m unittest discover -s api-center/tests -v
          python -m unittest discover -s api-center/google-cloud/tests -v
          python -m unittest discover -s api-center/data-commons/tests -v
          python -m unittest discover -s api-center/aifin-market/tests -v
          python -m unittest discover -s api-center/akshare/tests -v
          python -m unittest discover -s api-center/yuandian/tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          facts = {
              'schema': catalog['schema_version'],
              'connectors': catalog['connector_count'],
              'enabled_connectors': catalog['enabled_connector_count'],
              'providers': catalog['managed_provider_count'],
              'enabled_providers': catalog['enabled_managed_provider_count'],
              'operations': catalog['managed_operation_count'],
              'parameters': catalog['exposed_parameter_count'],
              'secret_values_exposed': catalog['secret_values_exposed'],
          }
          assert facts == {
              'schema': 'api-catalog-v3',
              'connectors': 69,
              'enabled_connectors': 69,
              'providers': 7,
              'enabled_providers': 7,
              'operations': 93,
              'parameters': 647,
              'secret_values_exposed': False,
          }, facts
          print(json.dumps(facts, ensure_ascii=False))
          PY
          git diff --check

      - name: Commit deterministic assembled and generated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api-center/build_catalog.py api-center/api-catalog.json api-center/api-catalog.md api-center/yuandian
          if git diff --cached --quiet; then
            echo "Generated catalog already current"
          else
            git commit -m "chore: generate YuanDian provider contracts"
            git push origin HEAD:feat/yuandian-legal-api
          fi
