name: Apply Reality Final Extensions V2

on:
  push:
    branches: [feat/reality-observation-final-extensions-v2]
    paths:
      - "api-center/extend_reality_final.py"
      - "api-center/fix_reality_catalog_tail.py"
      - ".github/workflows/reality-final-extension-apply-v2.yml"
      - "api-center/copernicus-marine/**"
  pull_request:
    paths:
      - "api-center/extend_reality_final.py"
      - "api-center/fix_reality_catalog_tail.py"
      - ".github/workflows/reality-final-extension-apply-v2.yml"
      - "api-center/copernicus-marine/**"

permissions:
  contents: write

concurrency:
  group: reality-final-extension-apply-v2
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout extension branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/reality-observation-final-extensions-v2
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/reality-observation/requirements.txt
          python -m pip check
      - name: Apply deterministic source patches
        run: |
          python api-center/extend_reality_final.py
          python api-center/fix_reality_catalog_tail.py
      - name: Rebuild deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m py_compile \
            api-center/reality-observation/reality_observation_task.py \
            api-center/copernicus-marine/copernicus_marine_task.py
          python -m unittest discover -s api-center/reality-observation/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/copernicus-marine/tests -p 'test_*.py' -v
          python -m unittest api-center.tests.test_api_catalog -v
          git diff --check
      - name: Commit non-workflow source and generated contracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-center/reality-observation \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/catalog-metadata.json \
            api-center/connector-manifest.json \
            api-center/krakend.validation.json \
            api-center/krakend.tmpl
          if git diff --cached --quiet; then
            echo "No extension changes remain"
            exit 0
          fi
          git commit -m "feat: add Mapillary and classified transport activity"
          git push origin HEAD:feat/reality-observation-final-extensions-v2
