name: Validate NASA Provider

on:
  pull_request:
    paths:
      - "api-center/nasa/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/nasa-provider-validate.yml"
      - ".github/workflows/nasa-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/nasa/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/nasa-provider-validate.yml"
      - ".github/workflows/nasa-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/nasa/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/nasa/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/nasa/nasa_task.py api-center/nasa/tests/*.py
          python -m unittest discover -s api-center/nasa/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/nasa')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'nasa'
          assert provider['ticket_prefix'] == '[intel-nasa]'
          assert provider['required_secret_environment_variable'] == 'NASA_API_KEY'
          assert len(ids) == 25
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['transient_retry_max'] == 0
          assert provider['limits']['neo_feed_span_days_max'] == 7
          assert provider['limits']['donki_date_span_days_max'] == 31
          assert provider['limits']['gibs_tiles_per_ticket_max'] == 1
          assert provider['limits']['bulk_download_allowed'] is False
          assert provider['limits']['archived_earth_api_allowed'] is False
          assert provider['limits']['archived_mars_rover_api_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert {'apod','neo-feed','donki-cme','epic-natural','nasa-images-search','gibs-tile'} <= ids
          assert not ({'earth-imagery','earth-assets','mars-rover-photos'} & ids)
          print(json.dumps({'status':'PASS','operations':len(ids),'archived_apis_exposed':False}))
          PY
          git diff --check
