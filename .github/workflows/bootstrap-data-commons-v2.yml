name: Bootstrap Data Commons V2 reintegration

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-data-commons-v2
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] readd-data-commons-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: feat/data-commons-v2-20260801
      LEGACY_SOURCE: 8605517083de4eaebc7eae1476802c891a56261c
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Restore reviewed REST V2 runtime sources
        run: |
          set -euo pipefail
          git checkout "${LEGACY_SOURCE}" -- api-center/data-commons

      - name: Apply standalone credential and catalog migration
        run: python maintenance/readd_data_commons_v2.py

      - name: Correct generated snapshot regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api-center/data-commons/tests/test_data_commons_task.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '(out / "snapshot.json").read_text(encoding="utf-8")',
              '(out / "data-commons-snapshot.json").read_text(encoding="utf-8")',
          )
          text = text.replace(
              'self.assertNotIn("api_key", json.dumps(snap).lower())',
              'self.assertFalse(snap["security"]["secret_values_included"])\n            self.assertFalse(snap["security"]["api_key_recorded"])',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/data-commons/requirements.txt \
            -r api-center/baostock/requirements.txt \
            -r api-center/eodhd/requirements.txt \
            -r api-center/requirements.txt \
            -r requirements-dev.txt
          python -m pip check

      - name: Generate deterministic API catalog
        run: python api-center/build_catalog_market_search.py

      - name: Run static and unit validation
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/data-commons/data_commons_task.py \
            api-center/data-commons/tests/test_data_commons_task.py \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py
          python -m unittest discover -s api-center/data-commons/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/eodhd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          test ! -e maintenance/readd_data_commons_v2.py
          git diff --check

      - name: Commit core integration
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m 'feat(api-center): readd standalone Data Commons REST V2 provider'
          git push origin HEAD:${TARGET_BRANCH}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish integration receipt
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DATA_COMMONS_V2_CORE_COMPLETED branch=${TARGET_BRANCH} commit=${{ steps.commit.outputs.sha }} operations=5 secret=GOOGLE_DATA_COMMONS_API_KEY auth=X-API-Key unit_tests=passed catalog_generated=true workflow_files=pending_connector_write model_calls=0"

      - name: Publish failure receipt
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DATA_COMMONS_V2_INTEGRATION_FAILED branch=${TARGET_BRANCH} run=${GITHUB_RUN_ID} model_calls=0"
