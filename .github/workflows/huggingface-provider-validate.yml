name: Validate Hugging Face Hub Provider

on:
  pull_request:
    paths:
      - "api-center/huggingface/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/huggingface-provider-validate.yml"
      - ".github/workflows/huggingface-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/huggingface-provider-validate.yml"
      - ".github/workflows/huggingface-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-huggingface-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-huggingface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/huggingface/requirements.txt
            api-center/huggingface/requirements-numeric-baseline.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/huggingface/requirements.txt \
            -r api-center/huggingface/requirements-numeric-baseline.txt
          python -m pip check

      - name: Compile and run provider regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/huggingface/huggingface_task.py \
            api-center/huggingface/numeric_baseline_store.py \
            api-center/huggingface/tests/test_huggingface.py \
            api-center/huggingface/tests/test_numeric_baseline_store.py
          python -m unittest discover -s api-center/huggingface/tests -p 'test_*.py' -v

      - name: Verify provider and catalog invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path('api-center/huggingface/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          schema = json.loads(Path('api-center/huggingface/ticket.schema.json').read_text(encoding='utf-8'))
          operation_ids = [row['operation_id'] for row in provider['operations']]
          assert provider['provider_id'] == 'huggingface-hub'
          assert provider['ticket_prefix'] == '[intel-huggingface]'
          assert provider['required_secret_environment_variable'] == ''
          assert len(operation_ids) == len(set(operation_ids)) == 11
          assert set(operation_ids) == set(schema['properties']['operation']['enum'])
          limits = provider['limits']
          assert limits['fixed_api_host'] == 'huggingface.co'
          assert limits['public_repositories_only'] is True
          assert limits['authentication_used'] is False
          assert limits['private_repositories_allowed'] is False
          assert limits['inference_allowed'] is False
          assert limits['training_or_jobs_allowed'] is False
          assert limits['space_invocation_allowed'] is False
          assert limits['file_download_allowed'] is False
          assert limits['write_operations_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in provider['operations'])
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          rows = {row['provider_id']: row for row in catalog['managed_providers']}
          assert rows['huggingface-hub']['operation_count'] == 11
          print(json.dumps({'status':'PASS','provider':'huggingface-hub','operations':11,'public_only':True}))
          PY
          git diff --check
