name: Baidu Post-Merge Full Smoke

on:
  push:
    branches: [feat/baidu-ai-cloud-intelligence]
    paths:
      - '.github/workflows/baidu-post-merge-full-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/baidu-post-merge-full-smoke.yml'

permissions:
  contents: read

concurrency:
  group: baidu-post-merge-full-smoke
  cancel-in-progress: false

jobs:
  test-all-retained-capabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BAIDU_AI_CLOUD_API_KEY: ${{ secrets.BAIDU_AI_CLOUD_API_KEY }}
    steps:
      - name: Checkout merged production code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/baidu-ai-cloud-intelligence
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-center/baidu-ai-cloud/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baidu-ai-cloud/requirements.txt
          python -m pip check
      - name: Build three production tickets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = {
              'provider': 'baidu-ai-cloud',
              'data_policy': {
                  'classification': 'public',
                  'contains_personal_data': False,
                  'contains_confidential_data': False,
              },
          }
          tickets = {
              'catalog': {
                  **base,
                  'task_id': 'baidu-post-merge-catalog',
                  'operation': 'catalog-capabilities',
                  'objective': 'Validate retained capability catalog.',
                  'parameters': {},
                  'acceptance': {'timeout_seconds': 30, 'max_response_bytes': 200000, 'max_rows': 20},
              },
              'quota': {
                  **base,
                  'task_id': 'baidu-post-merge-quota',
                  'operation': 'quota-policy',
                  'objective': 'Validate free quota and zero-paid-fallback policy.',
                  'parameters': {},
                  'acceptance': {'timeout_seconds': 30, 'max_response_bytes': 200000, 'max_rows': 20},
              },
              'search': {
                  **base,
                  'task_id': 'baidu-post-merge-search',
                  'operation': 'web-search',
                  'objective': 'Validate the current key and Baidu AI Search V2 production path.',
                  'parameters': {
                      'query': '福州市人民政府 2026 政务公开',
                      'top_k': 3,
                      'edition': 'lite',
                      'recency': 'year',
                  },
                  'acceptance': {'timeout_seconds': 90, 'max_response_bytes': 500000, 'max_rows': 3},
              },
          }
          root = Path('baidu-post-merge-evidence')
          root.mkdir()
          for name, ticket in tickets.items():
              path = root / name / 'ticket.json'
              path.parent.mkdir(parents=True)
              path.write_text(json.dumps(ticket, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Execute retained local catalog
        run: python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py execute --ticket baidu-post-merge-evidence/catalog/ticket.json --output-dir baidu-post-merge-evidence/catalog
      - name: Execute retained local quota policy
        run: python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py execute --ticket baidu-post-merge-evidence/quota/ticket.json --output-dir baidu-post-merge-evidence/quota
      - name: Execute one real Baidu web search
        run: python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py execute --ticket baidu-post-merge-evidence/search/ticket.json --output-dir baidu-post-merge-evidence/search
      - name: Verify all functions, result evidence, and secret hygiene
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('baidu-post-merge-evidence')
          secret = os.environ.get('BAIDU_AI_CLOUD_API_KEY', '')
          assert secret, 'repository secret is missing'

          summary = {'schema_version': 'baidu-post-merge-smoke-v1', 'tests': {}}
          for name in ('catalog', 'quota', 'search'):
              folder = root / name
              diagnostics = json.loads((folder / 'diagnostics.json').read_text(encoding='utf-8'))
              manifest = json.loads((folder / 'manifest.json').read_text(encoding='utf-8'))
              snapshot = json.loads((folder / 'snapshot.json').read_text(encoding='utf-8'))
              assert diagnostics['status'] == 'INTEL_BAIDU_AI_COMPLETED'
              assert diagnostics['failure'] is None
              assert diagnostics['model_calls'] == 0
              assert diagnostics['secret_values_exposed'] is False
              assert manifest['status'] == 'INTEL_BAIDU_AI_COMPLETED'
              assert manifest['model_calls'] == 0
              assert manifest['secret_values_exposed'] is False
              metadata = diagnostics['metadata']
              assert metadata['paid_fallback_authorized'] is False
              assert metadata['automatic_retries_allowed'] is False
              assert metadata['automatic_pagination_allowed'] is False
              summary['tests'][name] = {
                  'status': diagnostics['status'],
                  'operation': diagnostics['operation'],
                  'duration_ms': diagnostics['duration_ms'],
                  'upstream_called': metadata['upstream_called'],
                  'model_calls': diagnostics['model_calls'],
                  'paid_fallback_authorized': metadata['paid_fallback_authorized'],
              }
              if name == 'catalog':
                  provider = snapshot['provider']
                  assert provider['enabled'] is True
                  assert [row['operation_id'] for row in provider['operations']] == [
                      'catalog-capabilities', 'quota-policy', 'web-search'
                  ]
                  assert provider['limits']['paid_fallback_authorized'] is False
              elif name == 'quota':
                  assert snapshot['policy']['free_only'] is True
                  assert snapshot['policy']['paid_fallback_authorized'] is False
              else:
                  assert metadata['upstream_called'] is True
                  assert metadata['http_status'] == 200
                  assert metadata['requests_per_ticket'] == 1
                  assert metadata['request_origin'] == 'qianfan.baidubce.com'
                  assert metadata['request_path'] == '/v2/ai_search/web_search'
                  data = snapshot['data']
                  assert isinstance(data, dict) and data
                  encoded = json.dumps(data, ensure_ascii=False)
                  assert len(encoded) > 100
                  assert any(token in encoded.lower() for token in ('http', 'title', 'url', 'reference', 'result'))
                  summary['tests'][name]['http_status'] = metadata['http_status']
                  summary['tests'][name]['response_bytes'] = metadata['response_bytes']

          for path in root.rglob('*'):
              if path.is_file():
                  raw = path.read_bytes()
                  assert secret.encode() not in raw, f'secret leaked in {path}'

          summary['all_passed'] = True
          summary['secret_values_exposed'] = False
          summary['retained_operation_count'] = 3
          (root / 'summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY
      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baidu-post-merge-full-smoke-${{ github.run_id }}
          path: baidu-post-merge-evidence/
          if-no-files-found: error
          retention-days: 30
