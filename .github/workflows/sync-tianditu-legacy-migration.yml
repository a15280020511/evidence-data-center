name: Sync Tianditu Legacy Migration

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/migrate_tianditu_legacy.py"
      - ".github/workflows/sync-tianditu-legacy-migration.yml"

permissions:
  contents: write

concurrency:
  group: sync-tianditu-legacy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  migrate-tianditu:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feat/tianditu-provider'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check

      - name: Migrate legacy Tianditu connector
        run: python tools/migrate_tianditu_legacy.py

      - name: Commit migrated API contracts
        run: |
          set -euo pipefail
          git add -A api-center
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(api-center): replace legacy Tianditu connector"
          git push origin HEAD:${GITHUB_HEAD_REF}
