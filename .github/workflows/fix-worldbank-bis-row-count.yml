name: Temporary Fix World Bank and BIS Row Counts

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/fix_worldbank_bis_row_count.py"
      - ".github/workflows/fix-worldbank-bis-row-count.yml"

permissions:
  contents: write

concurrency:
  group: fix-worldbank-bis-row-count-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/worldbank-bis-row-count
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply deterministic correction
        run: python tools/fix_worldbank_bis_row_count.py
      - name: Install and test
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/worldbank-documents/requirements.txt \
            -r api-center/bis/requirements.txt
          python -m pip check
          python -m py_compile \
            api-center/worldbank-documents/worldbank_documents_task.py \
            api-center/bis/bis_task.py
          python -m unittest discover -s api-center/worldbank-documents/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/bis/tests -p 'test_*.py' -v
          git diff --check
      - name: Commit corrected runtime and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "fix: correct World Bank and BIS result counts"
          git push origin HEAD:fix/worldbank-bis-row-count
