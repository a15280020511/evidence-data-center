name: Temporary Catalog Contract Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "api-center/build_catalog_market_search.py"
      - "api-center/global-sensor-backbone/provider-catalog.json"
      - ".github/workflows/temporary-catalog-contract-refresh.yml"

permissions:
  contents: write

concurrency:
  group: temporary-catalog-refresh-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  refresh-generated-catalog:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/register-global-sensor-catalog-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Rebuild deterministic intelligence catalog
        run: |
          set -euo pipefail
          python api-center/build_catalog_market_search.py
          git diff --check

      - name: Commit generated contracts when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- api-center/api-catalog.json api-center/api-catalog.md; then
            echo "Generated catalog contracts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md
          git commit -m "chore: refresh deterministic intelligence catalog [skip catalog-refresh]"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
