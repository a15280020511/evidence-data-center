name: Publish Evidence Data Center Image

on:
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-center-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-evidence-data-center-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Resolve immutable KrakenD base image from Dockerfile
        id: base_image
        shell: bash
        run: |
          set -euo pipefail
          image="$(awk 'toupper($1) == "FROM" {print $2; exit}' api-center/Dockerfile)"
          [[ "$image" =~ ^krakend:[^@]+@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image" > api-center-base-image.txt

      - name: Verify generated configuration before publishing
        env:
          KRAKEND_IMAGE: ${{ steps.base_image.outputs.image }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m unittest discover -s api-center/tests -v
          python api-center/build_config.py
          git diff --exit-code -- \
            api-center/krakend.tmpl \
            api-center/krakend.validation.json \
            api-center/connector-manifest.json
          docker pull "$KRAKEND_IMAGE"
          docker run --rm -v "$PWD/api-center:/etc/krakend:ro" \
            "$KRAKEND_IMAGE" check -tnc /etc/krakend/krakend.validation.json

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/evidence-data-center
          KRAKEND_IMAGE: ${{ steps.base_image.outputs.image }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          docker build --pull \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:stable" \
            api-center
          push_output="$(docker push "$image:$GITHUB_SHA" 2>&1 | tee /dev/stderr)"
          digest="$(awk '/digest:/ {print $2}' <<<"$push_output" | tail -n 1)"
          test -n "$digest"
          docker push "$image:stable"
          printf '{"image":"%s","sha":"%s","digest":"%s","base_image":"%s"}\n' \
            "$image" "$GITHUB_SHA" "$digest" "$KRAKEND_IMAGE" > api-center-image.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-data-center-image-${{ github.run_id }}
          path: |
            api-center-image.json
            api-center-base-image.txt
            api-center/connector-manifest.json
          if-no-files-found: error
          retention-days: 30
