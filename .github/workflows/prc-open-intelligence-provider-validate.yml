name: Validate PRC Open Intelligence Providers

on:
  pull_request:
    paths:
      - "api-center/prc-open-intelligence/**"
      - ".github/workflows/prc-open-intelligence-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/prc-open-intelligence/**"
      - ".github/workflows/prc-open-intelligence-*.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-prc-open-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/prc-open-intelligence/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/prc-open-intelligence/requirements.txt
          python -m pip check

      - name: Compile provider and validators
        run: |
          python -m py_compile \
            api-center/prc-open-intelligence/prc_open_intelligence_task.py \
            api-center/prc-open-intelligence/validate_registry.py

      - name: Run deterministic unit tests
        run: |
          python -m unittest discover \
            -s api-center/prc-open-intelligence/tests \
            -p 'test_*.py' -v

      - name: Enforce free-only lifecycle registry
        run: python api-center/prc-open-intelligence/validate_registry.py

      - name: Validate local provider catalog is self-contained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('api-center/prc-open-intelligence/provider-catalog.json')
          catalog = json.loads(path.read_text(encoding='utf-8'))
          assert catalog['secret_values_exposed'] is False
          providers = catalog['providers']
          assert {row['provider_id'] for row in providers if row['enabled']} == {'china-check', 'sinofacts'}
          assert all(not row.get('required_secret_environment_variable') for row in providers)
          print(json.dumps({'status':'PASS','providers':[row['provider_id'] for row in providers]}, ensure_ascii=False))
          PY

      - name: Run live zero-key provider health
        run: |
          python api-center/prc-open-intelligence/prc_open_intelligence_task.py health \
            --live --output-dir prc-open-health

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prc-open-intelligence-health-${{ github.run_id }}
          path: prc-open-health/
          if-no-files-found: warn
          retention-days: 30
