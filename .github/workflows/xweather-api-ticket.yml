name: Managed Xweather API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-xweather-global
  cancel-in-progress: false

jobs:
  execute-xweather-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-xweather]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      XWEATHER_CLIENT_ID: ${{ vars.XWEATHER_CLIENT_ID }}
      XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/xweather/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/xweather/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/xweather/xweather_task.py

      - name: Parse and authorize Xweather ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/xweather/xweather_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir xweather-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/xweather/xweather_task.py render --output-dir xweather-artifacts --phase accepted > xweather-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@xweather-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/xweather/xweather_task.py render --output-dir xweather-artifacts --phase rejected > xweather-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@xweather-comment.md

      - name: Execute one bounded read-only Xweather operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/xweather/xweather_task.py execute --ticket xweather-artifacts/ticket.json --output-dir xweather-artifacts

      - name: Upload Xweather evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xweather-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: xweather-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/xweather/xweather_task.py render --output-dir xweather-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > xweather-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@xweather-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_XWEATHER_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Xweather API ticket did not complete successfully."
          exit 1
