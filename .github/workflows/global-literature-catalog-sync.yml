name: Sync Global Literature Catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-global-literature-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'feat/global-literature-libraries-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/global-literature-libraries-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Register provider and replace brittle aggregate counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('api-center/build_catalog_market_search.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              'GNEWS_CATALOG = HERE / "gnews/provider-catalog.json"\n',
              'GNEWS_CATALOG = HERE / "gnews/provider-catalog.json"\nGLOBAL_LITERATURE_LIBRARIES_CATALOG = HERE / "global-literature-libraries/provider-catalog.json"\n',
          )
          text=text.replace(
              '    "gnews": 3,\n}',
              '    "gnews": 3,\n    "global-literature-libraries": 10,\n}',
          )
          text=text.replace(
              '    GNEWS_CATALOG,\n)',
              '    GNEWS_CATALOG,\n    GLOBAL_LITERATURE_LIBRARIES_CATALOG,\n)',
          )
          text=text.replace(
              '        "gnews/provider-catalog.json",\n    ):',
              '        "gnews/provider-catalog.json",\n        "global-literature-libraries/provider-catalog.json",\n    ):',
          )
          path.write_text(text,encoding='utf-8')

          path=Path('api-center/tests/test_api_catalog.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              '    "gnews": 3,\n}',
              '    "gnews": 3,\n    "global-literature-libraries": 10,\n}',
          )
          text=text.replace(
              '        self.assertEqual(catalog["managed_provider_count"], 58)\n        self.assertEqual(catalog["enabled_managed_provider_count"], 58)\n        self.assertEqual(catalog["managed_operation_count"], 646)\n',
              '        self.assertEqual(catalog["managed_provider_count"], len(EXPECTED_OPERATION_COUNTS))\n        self.assertEqual(catalog["enabled_managed_provider_count"], len(EXPECTED_OPERATION_COUNTS))\n        self.assertEqual(catalog["managed_operation_count"], sum(EXPECTED_OPERATION_COUNTS.values()))\n',
          )
          path.write_text(text,encoding='utf-8')

          inventory_path=Path('api-center/global-research-intelligence/source-inventory.json')
          inventory=json.loads(inventory_path.read_text(encoding='utf-8'))
          items=inventory.get('items') or []
          if not any(row.get('requested_name')=='global-literature-libraries' for row in items):
              items.append({
                  'requested_name':'global-literature-libraries',
                  'classification':'governed global open literature, repository, library, archive and patent aggregation layer',
                  'decision':'integrate-new',
                  'implementation':'26 fixed HTTPS sources through 10 bounded read-only operations; existing OpenAlex, Crossref, arXiv, PubMed, Internet Archive and institutional providers are mapped rather than duplicated',
              })
              inventory['items']=items
              inventory_path.write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Rebuild and verify authoritative catalog
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_*.py'
          git diff --check
      - name: Commit non-workflow generated contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/global-research-intelligence/source-inventory.json
          if git diff --cached --quiet; then
            echo 'Catalog already synchronized'
            exit 0
          fi
          git commit -m 'feat: register global literature libraries in authoritative catalog'
          git push origin HEAD:feat/global-literature-libraries-20260803
