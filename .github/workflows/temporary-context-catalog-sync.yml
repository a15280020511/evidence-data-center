name: Temporary Context Catalog Sync

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/temporary-context-catalog-sync.yml"

permissions:
  contents: write

concurrency:
  group: temporary-context-catalog-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-generated-catalog:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/maintenance-build-tavily-firecrawl'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Install catalog dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check

      - name: Regenerate deterministic API catalog
        run: python api-center/build_catalog.py

      - name: Commit generated catalog only
        run: |
          set -euo pipefail
          git add api-center/api-catalog.json api-center/api-catalog.md
          if git diff --cached --quiet; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh Tavily and Firecrawl API catalog"
          git push origin "HEAD:${{ github.head_ref }}"
