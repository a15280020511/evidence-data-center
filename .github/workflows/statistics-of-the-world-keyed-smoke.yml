name: Statistics of the World Keyed Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/statistics-of-the-world-keyed-smoke.yml"
      - ".github/statistics-of-the-world-keyed-smoke.once"

permissions:
  contents: read

jobs:
  keyed-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOTW_API_KEY: ${{ secrets.SOTW_API_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/statistics-of-the-world/requirements.txt
          python -m pip check

      - name: Execute keyed live request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sotw-keyed-evidence
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          provider_dir = Path('api-center/statistics-of-the-world').resolve()
          sys.path.insert(0, str(provider_dir))
          import statistics_of_the_world_task as task

          raw_secret = os.getenv('SOTW_API_KEY', '')
          secret_present = bool(raw_secret.strip())
          if not secret_present:
              raise RuntimeError('SOTW_API_KEY repository secret is missing')
          normalized_secret = ''.join(raw_secret.split())
          whitespace_normalization_applied = normalized_secret != raw_secret.strip()
          if not normalized_secret:
              raise RuntimeError('SOTW_API_KEY is empty after diagnostic normalization')
          os.environ['SOTW_API_KEY'] = normalized_secret

          payload, metadata = task.query_sotw(
              'list-countries', {}, timeout=20, max_bytes=2_000_000, max_rows=500
          )
          data = payload.get('data') if isinstance(payload, dict) else None
          tier = str(metadata.get('rate_limit_tier') or '').strip().lower()
          summary = {
              'provider': 'statistics-of-the-world',
              'operation': 'list-countries',
              'status': 'PASS',
              'real_upstream_request_attempted': True,
              'secret_present': secret_present,
              'configured_secret_had_internal_whitespace': whitespace_normalization_applied,
              'diagnostic_whitespace_normalization_applied': whitespace_normalization_applied,
              'api_key_configured': bool(metadata.get('api_key_configured')),
              'authentication_mode': 'x-api-key-backend-only',
              'http_status': metadata.get('http_status'),
              'returned_rows': len(data) if isinstance(data, list) else metadata.get('row_count'),
              'rate_limit_limit': metadata.get('rate_limit_limit'),
              'rate_limit_remaining': metadata.get('rate_limit_remaining'),
              'rate_limit_tier': metadata.get('rate_limit_tier'),
              'request_origin': metadata.get('request_origin'),
              'secret_value_exposed': False,
          }
          assert summary['api_key_configured'] is True
          assert summary['http_status'] == 200
          assert isinstance(summary['returned_rows'], int) and summary['returned_rows'] >= 200
          assert tier and tier not in {'anonymous', 'anon'}
          Path('sotw-keyed-evidence/summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statistics-of-the-world-keyed-smoke-${{ github.run_id }}
          path: sotw-keyed-evidence/summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify no credential material was written
        run: |
          test -n "${SOTW_API_KEY:-}"
          ! grep -R --fixed-strings -- "${SOTW_API_KEY}" sotw-keyed-evidence
          git diff --check
