name: Live Yonghui Provider Matrix PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/live-yonghui-agent-toolbelt-gapup-pr.yml

permissions:
  contents: read

concurrency:
  group: live-yonghui-provider-matrix-pr
  cancel-in-progress: true

jobs:
  matrix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AGENT_TOOLBELT_KEY: ${{ secrets.AGENT_TOOLBELT_KEY }}
      GAPUP_API_KEY: ${{ secrets.GAPUP_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/agent-toolbelt/requirements.txt \
            -r api-center/gapup-mcp/requirements.txt
          python -m pip check
      - name: Run complete bounded matrix
        shell: bash
        run: |
          set +x
          mkdir -p yonghui-matrix
          python - <<'PY'
          from __future__ import annotations
          import importlib.util, json, os, re, time
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any
          import jsonschema, requests

          R=Path.cwd(); O=R/'yonghui-matrix'
          COMPANY='Yonghui Superstores Co., Ltd. (永辉超市)'; TICKER='601933.SH'
          CONTEXT=(f'{COMPANY}, Shanghai Stock Exchange {TICKER}, is a public Chinese supermarket and omnichannel retailer. '
                   'Use only public non-personal information for bounded read-only capability testing; no trading or investment execution.')
          URL='https://www.yonghui.com.cn/'
          PNG='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII='

          def module(name,path):
            s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          at=module('at',R/'api-center/agent-toolbelt/agent_toolbelt_task.py')
          gp=module('gp',R/'api-center/gapup-mcp/gapup_mcp_task.py')
          def ops(path): return json.loads(path.read_text())['providers'][0]['operations']

          def enum_value(field, vals):
            prefs=['CN','CHN','China','CNY','SSE','zh-CN','zh','1d','daily','json','markdown','both','summary','standard']
            for p in prefs:
              for v in vals:
                if str(v).lower()==p.lower(): return v
            return vals[0]

          def string_value(field,op,sch):
            k=field.lower().replace('-','_')
            if sch.get('format')=='date': v='2025-12-31'
            elif sch.get('format')=='date-time': v='2025-12-31T00:00:00Z'
            elif sch.get('format') in ('uri','url') or 'url' in k or 'website' in k: v=URL
            elif 'ticker' in k or 'symbol' in k: v=TICKER
            elif k in ('company','company_name','brand','brand_name','organization','organisation','account_name','target_company'): v=COMPANY
            elif 'country_code' in k: v='CN'
            elif k=='country' or k.endswith('_country'): v='China'
            elif 'currency' in k: v='CNY'
            elif 'exchange' in k: v='SSE'
            elif 'industry' in k or 'sector' in k: v='Supermarket retail and omnichannel grocery'
            elif 'address' in k: v='Fuzhou, Fujian, China public retail test address'
            elif 'cron' in k: v='0 9 * * 1-5'
            elif 'timezone' in k: v='Asia/Shanghai'
            elif 'csv' in k: v='date,revenue_cny,store_count\n2024-12-31,67500000000,775\n2025-12-31,70000000000,760'
            elif 'markdown' in k: v='# Yonghui Superstores\n\n- Ticker: 601933.SH\n- Public read-only test'
            elif 'html' in k: v='<h1>Yonghui Superstores</h1><p>601933.SH public read-only test.</p>'
            elif 'contract' in k or 'agreement' in k: v='Public fictional supplier agreement: payment in 30 days, termination on 30 days notice, no personal or confidential data.'
            elif any(x in k for x in ('meeting','minutes','transcript')): v='Public test meeting: review Yonghui store efficiency and supply-chain cost. Action: analyst checks public filings by Friday.'
            elif 'prompt' in k: v='Analyze public evidence on Yonghui 601933.SH, competition, operations and risks; state uncertainty.'
            elif 'regex' in k or 'pattern' in k: v='Match an A-share ticker such as 601933.SH'
            elif any(x in k for x in ('image','base64')): v=PNG
            elif 'filename' in k or 'file_name' in k: v='yonghui-public-test.png'
            elif any(x in k for x in ('package_json','manifest','dependencies','lockfile')): v='{"dependencies":{"requests":"2.32.4"}}'
            elif 'schema' in k: v='{"type":"object","properties":{"ticker":{"type":"string"}},"required":["ticker"]}'
            elif 'color' in k: v='#D71920'
            elif 'query' in k or 'search' in k: v='Yonghui Superstores 601933.SH public filings competition supply chain risk'
            elif 'start' in k and 'date' in k: v='2024-01-01'
            elif 'end' in k and 'date' in k: v='2025-12-31'
            elif 'date' in k: v='2025-12-31'
            else: v=CONTEXT
            mn=int(sch.get('minLength',0) or 0); mx=int(sch.get('maxLength',max(len(v),1)) or max(len(v),1))
            if len(v)<mn: v=(v+' '+CONTEXT*((mn//max(len(CONTEXT),1))+2))[:mn]
            v=v[:mx]
            pat=sch.get('pattern')
            if pat:
              try:
                if not re.fullmatch(pat,v):
                  for c in [TICKER,'601933','CN','CNY','SSE','Yonghui','public-test','1d','zh-CN']:
                    if re.fullmatch(pat,c): v=c; break
              except re.error: pass
            return v

          def value(sch,field,op,index=0):
            if 'const' in sch: return sch['const']
            if 'default' in sch: return sch['default']
            if sch.get('enum'): return enum_value(field,sch['enum'])
            for key in ('oneOf','anyOf'):
              if sch.get(key):
                b=next((x for x in sch[key] if x.get('type')!='null'),sch[key][0]); merged={k:v for k,v in sch.items() if k!=key}; merged.update(b); return value(merged,field,op,index)
            t=sch.get('type'); t=next((x for x in t if x!='null'),'string') if isinstance(t,list) else t
            if t=='object' or 'properties' in sch:
              p=sch.get('properties',{}); return {n:value(p[n],n,op) for n in sch.get('required',[]) if n in p}
            if t=='array':
              n=max(1,int(sch.get('minItems',1) or 1)); item=sch.get('items',{'type':'string'}); arr=[value(item,field,op,i) for i in range(n)]
              if sch.get('uniqueItems'):
                for i in range(1,len(arr)):
                  if isinstance(arr[i],str): arr[i]=(arr[i]+str(i))[:int(item.get('maxLength',len(arr[i])+1) or len(arr[i])+1)]
              return arr
            if t=='boolean': return False
            if t=='integer':
              lo=sch.get('minimum',sch.get('exclusiveMinimum',0)); x=int(lo or 0)+(1 if 'exclusiveMinimum' in sch else 0); x=x or 1
              return min(x,int(sch.get('maximum',x)))
            if t=='number':
              lo=sch.get('minimum',sch.get('exclusiveMinimum',0)); x=float(lo or 0)+(1 if 'exclusiveMinimum' in sch else 0); x=x or 1.0
              return min(x,float(sch.get('maximum',x)))
            return string_value(field,op,sch)

          def params(row):
            s=row.get('parameter_schema',{'type':'object','properties':{}}); p=s.get('properties',{}); out={n:value(p[n],n,row['operation_id']) for n in s.get('required',[]) if n in p}
            useful={'ticker','symbol','company','company_name','brand','country','country_code','exchange','market','currency','url','website','language','locale','format','mode','focus','strict','deduplicate','models','extractors','delimiter','output_format','start_date','end_date'}
            for n,x in p.items():
              if n not in out and n.lower().replace('-','_') in useful:
                try: out[n]=value(x,n,row['operation_id'])
                except Exception: pass
            jsonschema.validate(out,s); return out

          def count(rows,key):
            d={}
            for r in rows: d[str(r.get(key,'UNKNOWN'))]=d.get(str(r.get(key,'UNKNOWN')),0)+1
            return dict(sorted(d.items()))

          agent_ops=ops(R/'api-center/agent-toolbelt/provider-catalog.json'); gap_ops=ops(R/'api-center/gapup-mcp/provider-catalog.json')
          ak=os.getenv('AGENT_TOOLBELT_KEY','').strip(); gk=os.getenv('GAPUP_API_KEY','').strip()
          agent=[]
          for row in agent_ops:
            op=row['operation_id']; rec={'operation':op}
            if row.get('execution',{}).get('local') is True: rec.update(structural='PASS',live='LOCAL_PASS'); agent.append(rec); continue
            try:
              pa=params(row); at.validate_payload_shape(pa)
              if op in at.URL_OPERATIONS: at.validate_public_https_url(str(pa['url']))
              rec['structural']='PASS'; rec['parameter_names']=sorted(pa)
            except Exception as e: rec.update(structural='FAIL',live='NOT_RUN',error_type=type(e).__name__,error=str(e)[:500]); agent.append(rec); continue
            if not ak.startswith('atb_'): rec.update(live='SKIPPED_CREDENTIAL',error='AGENT_TOOLBELT_KEY missing/invalid'); agent.append(rec); continue
            try:
              payload,meta=at.query_agent_toolbelt(op,pa,timeout=120,max_bytes=10_000_000)
              rec.update(live='PASS',http_status=meta.get('http_status'),response_bytes=meta.get('response_bytes'),payload_type=type(payload).__name__)
            except Exception as e: rec.update(live='FAIL',error_type=type(e).__name__,error_code=getattr(e,'code','AGENT_TOOLBELT_ERROR'),error=str(e)[:500].replace(ak,'[REDACTED]'))
            agent.append(rec); time.sleep(6.2)

          removed=['stock-thesis','earnings-analysis','insider-signal','valuation-snapshot','bear-vs-bull','compare-stocks','moat-analysis','watchlist-scan']
          agent_ids={x['operation_id'] for x in agent_ops}; stock_boundary={'status':'PASS' if not(set(removed)&agent_ids) else 'FAIL','unexpected_present':sorted(set(removed)&agent_ids)}

          structural=[]; cache={}
          for row in gap_ops:
            op=row['operation_id']
            if row.get('execution',{}).get('local') is True: structural.append({'operation':op,'status':'LOCAL_PASS'}); continue
            try:
              pa=params(row); gp.validate_public_parameters(pa); cache[op]=pa; structural.append({'operation':op,'status':'PASS','parameter_names':sorted(pa)})
            except Exception as e: structural.append({'operation':op,'status':'FAIL','error_type':type(e).__name__,'error':str(e)[:500]})

          try:
            rr=requests.post(gp.MCP_URL,json={'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}},headers={'Accept':'application/json, text/event-stream','Content-Type':'application/json','User-Agent':'yonghui-matrix/1'},timeout=60,allow_redirects=False)
            parsed=gp.parse_mcp_payload(rr.content,rr.headers.get('Content-Type','')); tools=((parsed.get('result') or {}).get('tools') or []) if isinstance(parsed,dict) else []
            probe={'status':'PASS' if rr.status_code==200 and isinstance(tools,list) else 'FAIL','http_status':rr.status_code,'official_tool_count':len(tools) if isinstance(tools,list) else None}
          except Exception as e: probe={'status':'FAIL','error_type':type(e).__name__,'error':str(e)[:500]}

          targets=['industry_classifier_naics_sic','china_market_data','historical_price_series','earnings_reviewer','financial_model_3statement','monte_carlo_portfolio','competitive_deep_dive','competitor_intel','competitor_moves','market_research_brief','market_sizing','sentiment_news_pulse','web_search_multilang','corporate_registry_lookup','china_ecommerce_intel','esg_audit_multi','supply_chain_fx_exposure_dashboard','weather_climate_intel','patent_landscape','strategic_options_analyzer']
          gap_ids={x['operation_id'] for x in gap_ops}; live=[]; stop=None
          for op in targets:
            if op not in gap_ids: live.append({'operation':op,'live':'NOT_IN_CATALOG'}); continue
            if stop: live.append({'operation':op,'live':'SKIPPED_PROVIDER_LIMIT','reason':stop}); continue
            if op not in cache: live.append({'operation':op,'live':'SKIPPED_STRUCTURAL_FAILURE'}); continue
            if not gk.startswith('gpk_'): live.append({'operation':op,'live':'SKIPPED_CREDENTIAL'}); stop='credential_missing_or_invalid'; continue
            try:
              payload,meta=gp.query_gapup(op,cache[op],timeout=120,max_bytes=10_000_000)
              live.append({'operation':op,'live':'PASS','http_status':meta.get('http_status'),'response_bytes':meta.get('response_bytes'),'payload_type':type(payload).__name__})
            except Exception as e:
              code=getattr(e,'code','GAPUP_MCP_ERROR'); live.append({'operation':op,'live':'FAIL','error_type':type(e).__name__,'error_code':code,'error':str(e)[:700].replace(gk,'[REDACTED]')})
              if code in {'GAPUP_API_KEY_MISSING','GAPUP_API_KEY_INVALID','GAPUP_MCP_CREDENTIAL_DENIED','GAPUP_MCP_PAYMENT_REQUIRED','GAPUP_MCP_RATE_LIMITED'}: stop=code
            time.sleep(1)

          agent_doc={'provider':'agent-toolbelt','catalog_operation_count':len(agent_ops),'credential_present':bool(ak),'credential_prefix_valid':ak.startswith('atb_'),'structural_counts':count(agent,'structural'),'live_counts':count(agent,'live'),'stock_boundary':stock_boundary,'results':agent}
          gap_doc={'provider':'gapup-mcp','catalog_operation_count':len(gap_ops),'credential_present':bool(gk),'credential_prefix_valid':gk.startswith('gpk_'),'tools_list_probe':probe,'structural_counts':count(structural,'status'),'structural_results':structural,'live_target_count':len(targets),'live_counts':count(live,'live'),'live_results':live,'stop_reason':stop}
          summary={'schema_version':'yonghui-provider-matrix-v1','tested_at':datetime.now(timezone.utc).isoformat(),'subject':{'company':COMPANY,'ticker':TICKER,'market':'SSE A-share'},'policy':{'agent_toolbelt':'all 21 current operations','gapup':'all 209 operations structurally plus 20 relevant live calls','automatic_payment':False,'secret_values_exposed':False},'agent_toolbelt':{'catalog_operation_count':len(agent_ops),'structural_counts':count(agent,'structural'),'live_counts':count(agent,'live'),'stock_boundary':stock_boundary['status']},'gapup':{'catalog_operation_count':len(gap_ops),'tools_list_probe':probe,'structural_counts':count(structural,'status'),'live_counts':count(live,'live'),'stop_reason':stop}}
          (O/'agent-toolbelt-results.json').write_text(json.dumps(agent_doc,ensure_ascii=False,indent=2)+'\n')
          (O/'gapup-results.json').write_text(json.dumps(gap_doc,ensure_ascii=False,indent=2)+'\n')
          (O/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Check credential redaction
        if: always()
        shell: bash
        run: |
          set +x
          test -f yonghui-matrix/summary.json
          for s in "${AGENT_TOOLBELT_KEY:-}" "${GAPUP_API_KEY:-}"; do
            if [ -n "$s" ] && grep -R -Fq -- "$s" yonghui-matrix; then exit 1; fi
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yonghui-provider-matrix-${{ github.run_id }}
          path: yonghui-matrix/
          if-no-files-found: error
          retention-days: 7
