name: Temporary deterministic API capability finalizer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-finalize-capabilities]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PATCH_SOURCE_ISSUE: 34
      PATCH2_COMMENT_ID: 5139759259
      PATCH_B64_LENGTH: 85592
      PATCH_SHA256: 0000fab8f91e3a4c4d44c54b8ea4fb2958d92e43e1981f8bca3e7b236045f261
      WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
      API_CENTER_SECRETS_JSON: ${{ secrets.API_CENTER_SECRETS_JSON }}
    steps:
      - name: Report start
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="FINALIZER_RUN_ID=${GITHUB_RUN_ID}\nFINALIZER_STATUS=started"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Detect current capability state
        id: detect
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('api-center/aifin-market/provider-catalog.json').read_text(encoding='utf-8'))
          operation_count = len(catalog['providers'][0]['operations'])
          expanded = int(manifest.get('connector_count', 0)) >= 69 and operation_count >= 17
          print(f"expanded={'true' if expanded else 'false'}")
          print(f"connector_count={manifest.get('connector_count', 0)}")
          print(f"wind_operation_count={operation_count}")
          PY

      - name: Reassemble and verify reviewed patch archive
        if: steps.detect.outputs.expanded != 'true'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PATCH_SOURCE_ISSUE}/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          rows = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          chunks = {}
          special_id = int(os.environ['PATCH2_COMMENT_ID'])
          special_body = None
          for row in rows:
              body = str(row.get('body') or '')
              match = re.fullmatch(r'PATCH2_CHUNK_(\d{3})\n([A-Za-z0-9+/=]+)', body, re.DOTALL)
              if match:
                  chunks[int(match.group(1))] = match.group(2)
              if int(row.get('id') or 0) == special_id:
                  special_body = body
          if special_body is None:
              raise SystemExit(f'chunk 2 source comment {special_id} not found')
          payload = special_body.split('\n', 1)[1] if '\n' in special_body else special_body
          chunks[2] = re.sub(r'[^A-Za-z0-9+/=]', '', payload)
          expected = list(range(1, 10))
          if sorted(chunks) != expected:
              raise SystemExit(f'invalid chunks: {sorted(chunks)}')
          for index in range(1, 9):
              if len(chunks[index]) != 10000:
                  raise SystemExit(f'chunk {index} length={len(chunks[index])}, expected=10000')
          if len(chunks[9]) != 5592:
              raise SystemExit(f'chunk 9 length={len(chunks[9])}, expected=5592')
          joined = ''.join(chunks[index] for index in expected)
          expected_length = int(os.environ['PATCH_B64_LENGTH'])
          if len(joined) != expected_length:
              raise SystemExit(f'joined length={len(joined)}, expected={expected_length}')
          Path('/tmp/patch.b64').write_text(joined, encoding='ascii')
          PY
          base64 --decode /tmp/patch.b64 > /tmp/capability-patch.tar.gz
          echo "${PATCH_SHA256}  /tmp/capability-patch.tar.gz" | sha256sum --check --strict

      - name: Apply reviewed patch when required
        if: steps.detect.outputs.expanded != 'true'
        run: |
          set -euo pipefail
          tar -xzf /tmp/capability-patch.tar.gz -C .

      - name: Regenerate deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          wind = json.loads(Path('api-center/aifin-market/provider-catalog.json').read_text(encoding='utf-8'))
          assert manifest['connector_count'] == 69, manifest['connector_count']
          assert catalog['connector_count'] == 69, catalog['connector_count']
          assert catalog['managed_provider_count'] == 6, catalog['managed_provider_count']
          assert sum(len(row['operations']) for row in catalog['managed_providers']) == 53
          assert len(wind['providers'][0]['operations']) == 17
          print('CONTRACT_COUNTS_OK')
          PY

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          if [[ -f api-center/akshare/requirements.txt ]]; then
            python -m pip install --disable-pip-version-check --no-input -r api-center/akshare/requirements.txt
          fi
          python -m pip check

      - name: Run full zero-write validation
        run: |
          set -euo pipefail
          python -m compileall -q api-center
          python -m unittest discover -s api-center/tests -v
          python -m unittest discover -s api-center/aifin-market/tests -v
          python -m unittest discover -s api-center/akshare/tests -v
          python -m unittest discover -s api-center/ashare/tests -v

      - name: Resolve Wind key without exposing it
        run: |
          set -euo pipefail
          if [[ -z "${WIND_API_KEY:-}" && -n "${API_CENTER_SECRETS_JSON:-}" ]]; then
            wind_api_key="$(python - <<'PY'
          import json, os
          try:
              print(str(json.loads(os.environ.get('API_CENTER_SECRETS_JSON') or '{}').get('WIND_API_KEY') or ''), end='')
          except Exception:
              print('', end='')
          PY
            )"
            echo "WIND_API_KEY=${wind_api_key}" >> "$GITHUB_ENV"
          fi
          [[ -n "${WIND_API_KEY:-${wind_api_key:-}}" ]] || { echo 'WIND_API_KEY missing'; exit 1; }

      - name: Real Wind expanded-operation smoke test
        run: |
          set -euo pipefail
          rm -rf /tmp/wind-smoke
          mkdir -p /tmp/wind-smoke
          cat > /tmp/wind-ticket.json <<'JSON'
          {
            "task_id": "finalizer-wind-basicinfo-20260731",
            "objective": "Verify expanded Wind company basic-information operation",
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "operation": "stock-basicinfo",
            "parameters": {"windcode": "600519.SH"}
          }
          JSON
          python api-center/aifin-market/aifin_task.py execute \
            --ticket /tmp/wind-ticket.json --output-dir /tmp/wind-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/wind-smoke/aifin-snapshot.json').read_text(encoding='utf-8'))
          assert row['status'] == 'API_AIFIN_COMPLETED', row
          assert row.get('upstream_called') is True, row
          assert row.get('result') not in (None, {}, [], ''), row
          print('WIND_EXPANDED_SMOKE_OK')
          PY

      - name: Real AKShare expanded-operation smoke test
        run: |
          set -euo pipefail
          rm -rf /tmp/akshare-smoke
          mkdir -p /tmp/akshare-smoke
          cat > /tmp/akshare-ticket.json <<'JSON'
          {
            "task_id": "finalizer-akshare-gdp-20260731",
            "objective": "Verify expanded AKShare China GDP operation",
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "operation": "macro-china-gdp",
            "parameters": {}
          }
          JSON
          python api-center/akshare/akshare_task.py execute \
            --ticket /tmp/akshare-ticket.json --output-dir /tmp/akshare-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/akshare-smoke/akshare-snapshot.json').read_text(encoding='utf-8'))
          assert row['status'] == 'API_AKSHARE_COMPLETED', row
          assert row.get('upstream_called') is True, row
          assert row.get('result') not in (None, {}, [], ''), row
          print('AKSHARE_EXPANDED_SMOKE_OK')
          PY

      - name: Remove all temporary applicators
        run: |
          rm -f \
            .github/workflows/temporary-apply-capability-patch.yml \
            .github/workflows/temporary-apply-capability-patch-v2.yml \
            .github/workflows/temporary-finalize-capabilities.yml
          git diff --check

      - name: Commit validated state to main
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add --all
          if git diff --cached --quiet; then
            sha="$(git rev-parse HEAD)"
          else
            git commit -m "feat: maximize safe read-only API capabilities"
            git push origin HEAD:main
            sha="$(git rev-parse HEAD)"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Close superseded open PR and publish receipt
        run: |
          set -euo pipefail
          state="$(gh pr view 38 --json state --jq .state 2>/dev/null || true)"
          if [[ "${state}" == "OPEN" ]]; then
            gh pr close 38 --comment "Superseded by the deterministic finalizer after full tests and real upstream smoke checks."
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="FINALIZER_STATUS=completed\nMAIN_SHA=${{ steps.publish.outputs.sha }}\nCONNECTORS=69\nMANAGED_PROVIDERS=6\nMANAGED_OPERATIONS=53\nWIND_EXPANDED_SMOKE=passed\nAKSHARE_EXPANDED_SMOKE=passed\nTEMPORARY_WORKFLOWS_REMOVED=true"

      - name: Report structured failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="FINALIZER_RUN_ID=${GITHUB_RUN_ID}\nFINALIZER_STATUS=failed\nNo validated main commit was published by this run."
