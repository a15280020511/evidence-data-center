name: Managed WolframAlpha and LlamaParse API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: knowledge-document-api-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-knowledge-document-api:
    if: >-
      github.actor == github.repository_owner &&
      (startsWith(github.event.issue.title, '[api-wolframalpha]') ||
       startsWith(github.event.issue.title, '[api-llamaparse]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/knowledge-document/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/knowledge-document/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: |
          python -m py_compile api-center/knowledge-document/provider_task.py

      - name: Parse and authorize managed ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/knowledge-document/provider_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir knowledge-document-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/knowledge-document/provider_task.py render \
            --output-dir knowledge-document-artifacts --phase accepted > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/knowledge-document/provider_task.py render \
            --output-dir knowledge-document-artifacts --phase rejected > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Execute bounded WolframAlpha operation
        id: execute_wolframalpha
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.prepare.outputs.provider == 'wolframalpha'
        continue-on-error: true
        env:
          WOLFRAMALPHA_APP_ID: ${{ secrets.WOLFRAMALPHA_APP_ID }}
        run: |
          python api-center/knowledge-document/provider_task.py execute \
            --ticket knowledge-document-artifacts/ticket.json \
            --output-dir knowledge-document-artifacts

      - name: Execute bounded LlamaParse operation
        id: execute_llamaparse
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.prepare.outputs.provider == 'llamaparse'
        continue-on-error: true
        env:
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
        run: |
          python api-center/knowledge-document/provider_task.py execute \
            --ticket knowledge-document-artifacts/ticket.json \
            --output-dir knowledge-document-artifacts

      - name: Upload structured provider evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-document-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: knowledge-document-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/knowledge-document/provider_task.py render \
            --output-dir knowledge-document-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > provider-comment.md || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           (steps.prepare.outputs.provider == 'wolframalpha' &&
            steps.execute_wolframalpha.outputs.status != 'API_WOLFRAMALPHA_COMPLETED') ||
           (steps.prepare.outputs.provider == 'llamaparse' &&
            steps.execute_llamaparse.outputs.status != 'API_LLAMAPARSE_COMPLETED') ||
           steps.upload.outcome != 'success')
        run: |
          echo "Managed knowledge/document API ticket did not complete successfully."
          exit 1
