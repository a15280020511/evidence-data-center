name: Bootstrap Market Search Feature Branch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  TARGET_BRANCH: feat/tickflow-serpapi

jobs:
  bootstrap:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[bootstrap-market-search]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/tickflow-serpapi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/market-search/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/market-search/requirements.txt
          python -m pip check

      - name: Integrate providers and regenerate contracts
        run: python tools/bootstrap_tickflow_serpapi.py

      - name: Commit feature integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center .github/workflows/api-catalog-validate.yml
          git diff --cached --check
          git commit -m "feat(api-center): register TickFlow and SerpAPI providers"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Comment success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "MARKET_SEARCH_BOOTSTRAP_COMPLETED"
