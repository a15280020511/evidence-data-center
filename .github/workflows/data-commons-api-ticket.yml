name: Managed Google Data Commons API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-dc-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-data-commons-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-dc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/data-commons/requirements.txt

      - name: Install pinned Data Commons dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/data-commons/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: |
          python -m py_compile \
            api-center/data-commons/data_commons_task.py \
            api-center/data-commons/duplicate_guard.py \
            api-center/google-cloud/unified_google_credentials.py

      - name: Parse and authorize Data Commons ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/data-commons/data_commons_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir data-commons-artifacts

      - name: Reject duplicate task or ticket
        id: duplicate
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/data-commons/duplicate_guard.py \
            --ticket data-commons-artifacts/ticket.json \
            --status data-commons-artifacts/ticket-status.json

      - name: Comment accepted ticket
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success'
        run: |
          python api-center/data-commons/data_commons_task.py render \
            --output-dir data-commons-artifacts \
            --phase accepted > data-commons-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@data-commons-comment.md

      - name: Comment rejected ticket
        if: >-
          steps.prepare.outputs.accepted != 'true' ||
          steps.duplicate.outcome != 'success'
        run: |
          python api-center/data-commons/data_commons_task.py render \
            --output-dir data-commons-artifacts \
            --phase rejected > data-commons-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@data-commons-comment.md

      - name: Validate and expand unified Google credentials
        id: credentials
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success'
        continue-on-error: true
        run: python api-center/google-cloud/unified_google_credentials.py

      - name: Create structured unified credential block
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success' &&
          steps.credentials.outcome != 'success'
        run: |
          python api-center/google-cloud/unified_google_credentials.py \
            --blocked-target data-commons \
            --ticket data-commons-artifacts/ticket.json \
            --output-dir data-commons-artifacts

      - name: Execute read-only Data Commons operation
        id: execute
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success' &&
          steps.credentials.outcome == 'success'
        continue-on-error: true
        run: |
          python api-center/data-commons/data_commons_task.py execute \
            --ticket data-commons-artifacts/ticket.json \
            --output-dir data-commons-artifacts

      - name: Upload Data Commons evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-commons-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: data-commons-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: >-
          always() &&
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/data-commons/data_commons_task.py render \
            --output-dir data-commons-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > data-commons-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@data-commons-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.duplicate.outcome != 'success' ||
           steps.credentials.outcome != 'success' ||
           steps.execute.outputs.status != 'API_DATA_COMMONS_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Data Commons API ticket did not complete successfully."
          exit 1
