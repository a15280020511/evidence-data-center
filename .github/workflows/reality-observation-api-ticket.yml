name: Managed Reality Observation Intelligence Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-reality-observation-global
  cancel-in-progress: false

jobs:
  execute-reality-observation:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-reality-observation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/reality-observation/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/reality-observation/requirements.txt
          python -m pip check

      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/reality-observation/reality_observation_task.py

      - name: Reject duplicate accepted task ID on the same issue
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          task_id="$(jq -r '.issue.body | fromjson | .task_id // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          if [[ -z "$task_id" ]]; then
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments_file="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --jq '.[].body' > "$comments_file"
          accepted_needle="Reality Observation API ticket accepted: \`${task_id}\` /"
          completed_needle="Reality Observation API result: \`INTEL_REALITY_OBSERVATION_COMPLETED\`"
          if grep -Fq "$accepted_needle" "$comments_file" || grep -Fq "$completed_needle" "$comments_file"; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            {
              echo 'Reality Observation API admission: `ADMISSION_REJECTED_DUPLICATE`'
              echo
              echo "- Task ID: \`${task_id}\`"
              echo '- Reason: this issue already contains an accepted or completed reality-observation receipt.'
              echo '- New upstream request executed: `false`'
              echo '- Secret values exposed: `false`'
            } > duplicate-comment.md
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@duplicate-comment.md
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse and authorize reality observation ticket
        id: prepare
        if: steps.admission.outputs.duplicate != 'true'
        continue-on-error: true
        run: python api-center/reality-observation/reality_observation_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir reality-observation-artifacts

      - name: Comment accepted ticket
        if: steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/reality-observation/reality_observation_task.py render --output-dir reality-observation-artifacts --phase accepted > reality-observation-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@reality-observation-comment.md

      - name: Comment rejected ticket
        if: steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/reality-observation/reality_observation_task.py render --output-dir reality-observation-artifacts --phase rejected > reality-observation-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@reality-observation-comment.md

      - name: Execute one bounded reality observation request
        id: execute
        if: steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/reality-observation/reality_observation_task.py execute --ticket reality-observation-artifacts/ticket.json --output-dir reality-observation-artifacts

      - name: Upload reality observation evidence
        id: upload
        if: always() && steps.admission.outputs.duplicate != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-observation-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: reality-observation-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/reality-observation/reality_observation_task.py render --output-dir reality-observation-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > reality-observation-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@reality-observation-comment.md

      - name: Mark duplicate admission rejected
        if: always() && steps.admission.outputs.duplicate == 'true'
        run: exit 1

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          steps.admission.outputs.duplicate != 'true' &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_REALITY_OBSERVATION_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
