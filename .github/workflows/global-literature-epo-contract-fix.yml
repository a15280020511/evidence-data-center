name: Fix EPO Publication Contract

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/global-literature-libraries-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/global-literature-libraries-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Correct bounded EPO publication-number grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('api-center/global-literature-libraries/global_literature_task.py')
          text=path.read_text(encoding='utf-8').replace(
              'r"EP[0-9]{6,10}N[A-Z][0-9]"',
              'r"EP[0-9]{6,10}N[A-Z]{1,3}[0-9]"',
          )
          path.write_text(text,encoding='utf-8')

          path=Path('api-center/global-literature-libraries/provider-catalog.json')
          text=path.read_text(encoding='utf-8').replace(
              '^EP[0-9]{6,10}N[A-Z][0-9]$',
              '^EP[0-9]{6,10}N[A-Z]{1,3}[0-9]$',
          )
          path.write_text(text,encoding='utf-8')
          PY
      - name: Rebuild catalog and validate all builders
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-literature-libraries/requirements.txt
          python api-center/build_catalog_market_search.py
          PYTHONPATH=api-center/global-literature-libraries:api-center \
            python api-center/global-literature-libraries/validate_global_literature.py \
              --output /tmp/global-literature-registry.json
          python api-center/tests/test_api_catalog.py
          git diff --check
      - name: Commit non-workflow contract files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/global-literature-libraries/global_literature_task.py \
            api-center/global-literature-libraries/provider-catalog.json \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m 'fix: accept bounded EPO multi-letter publication kind codes'
          git push origin HEAD:feat/global-literature-libraries-20260803
