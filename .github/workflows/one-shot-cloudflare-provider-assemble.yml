name: One Shot Cloudflare Provider Assembly

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: one-shot-cloudflare-provider-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-cloudflare-assemble]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FEATURE_BRANCH: feat/cloudflare-intelligence-provider-20260803
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/cloudflare-intelligence-provider-20260803
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Assemble catalog registration
        run: python .maintenance/assemble_cloudflare_provider.py

      - name: Install bounded dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/cloudflare/requirements.txt
          python -m pip check

      - name: Compile and test Cloudflare provider
        run: |
          set -euo pipefail
          python -m py_compile api-center/managed_provider_runtime.py api-center/cloudflare/cloudflare_task.py api-center/cloudflare/tests/test_cloudflare.py
          python -m unittest discover -s api-center/cloudflare/tests -p 'test_*.py' -v

      - name: Regenerate deterministic intelligence catalog
        run: |
          set -euo pipefail
          python api-center/build_catalog_market_search.py
          python -m unittest api-center/tests/test_api_catalog.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          cloudflare = providers['cloudflare']
          assert catalog['managed_provider_count'] == 49
          assert catalog['managed_operation_count'] == 544
          assert len(cloudflare['operations']) == 22
          assert cloudflare['ticket_prefix'] == '[intel-cloudflare]'
          assert cloudflare['required_secret_environment_variable_name'] == 'CLOUDFLARE_API_TOKEN'
          assert cloudflare['limits']['write_operations_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in cloudflare['operations'])
          print(json.dumps({'status':'PASS','providers':49,'operations':544,'cloudflare_operations':22}))
          PY
          git diff --check

      - name: Commit assembled provider
        run: |
          set -euo pipefail
          rm -rf .maintenance
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: register Cloudflare intelligence provider"
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Report success
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CLOUDFLARE_PROVIDER_ASSEMBLY_PASS"

      - name: Report failure
        if: failure()
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CLOUDFLARE_PROVIDER_ASSEMBLY_FAILED run=${GITHUB_RUN_ID}"
