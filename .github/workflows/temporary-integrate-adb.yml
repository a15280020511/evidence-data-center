name: Temporary Integrate ADB Provider

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/temporary_integrate_adb.py"
      - ".github/workflows/temporary-integrate-adb.yml"

permissions:
  contents: write

concurrency:
  group: temporary-integrate-adb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ADB branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/adb-kidb-provider
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Generate catalog integration
        run: python tools/temporary_integrate_adb.py
      - name: Install and validate
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/adb/requirements.txt
          python -m pip check
          python -m py_compile \
            api-center/adb/adb_task.py \
            api-center/adb/tests/test_adb_task.py \
            api-center/tests/test_api_catalog.py
          python -m unittest discover -s api-center/adb/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python api-center/build_catalog_market_search.py
          git diff --check
      - name: Commit generated API-center integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "feat: integrate ADB into unified intelligence catalog"
          git push origin HEAD:feat/adb-kidb-provider

# The formal api-catalog validation workflow is updated separately through the GitHub connector.
