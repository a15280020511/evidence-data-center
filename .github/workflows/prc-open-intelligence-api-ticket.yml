name: PRC Open Intelligence Direct-Route Cleanup

on:
  push:
    branches: [feat/prc-free-intelligence-suite]
    paths:
      - ".github/workflows/prc-open-intelligence-api-ticket.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/prc-free-intelligence-suite

      - name: Replace direct-route documentation with governance route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('api-center/prc-open-intelligence/provider-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          catalog['ticket_prefix'] = '[api]'
          catalog['execution_surface'] = 'generic-api-local-bridge'
          catalog['direct_issue_route_enabled'] = False
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('api-center/prc-open-intelligence/README.md')
          text = readme.read_text(encoding='utf-8')
          start = text.index('## 票据')
          end = text.index('## 稳定性机制')
          section = '\n'.join([
              '## 正式治理入口',
              '',
              '本模块不提供独立 Issue 执行入口。网页 GPT 与其他上层调用者必须继续使用治理仓既有 `intelligence` 路由；治理仓会创建标准 `[api]` 子 Issue，由情报中心通用 API Center 校验后进入 `local-prc-open` 本地只读模式。',
              '',
              '允许的 4 个固定连接器：',
              '',
              '- `prc-china-check-company-search`',
              '- `prc-china-check-company-snapshot`',
              '- `prc-sinofacts-company-search`',
              '- `prc-sinofacts-company-profile`',
              '',
              '示例子票据（由治理仓生成 `task_id` 后派发）：',
              '',
              '```json',
              '{',
              '  "task_id": "gov-123-intelligence",',
              '  "objective": "核验公开企业基础登记信息",',
              '  "data_policy": {"classification": "public", "contains_personal_data": false},',
              '  "requests": [',
              '    {',
              '      "request_id": "company-1",',
              '      "connector_id": "prc-china-check-company-search",',
              '      "parameters": {"query": "示例公司", "language": "zh"}',
              '    }',
              '  ],',
              '  "acceptance": {"require_all": true, "minimum_successful_requests": 1}',
              '}',
              '```',
              '',
              'PRC 本地连接器不得与普通网关连接器混装在同一张 `[api]` 票据中；它们不启动 KrakenD 网关、不读取 Repository Secret，也不允许在上游拒绝后改用代理、身份或付费服务。',
              '',
          ])
          readme.write_text(text[:start] + section + text[end:], encoding='utf-8')
          PY

      - name: Remove direct Issue workflow and commit cleanup
        run: |
          set -euo pipefail
          git rm .github/workflows/prc-open-intelligence-api-ticket.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/prc-open-intelligence/provider-catalog.json api-center/prc-open-intelligence/README.md
          git commit -m "fix(prc-intel): enforce governance-only execution path"
          git push origin HEAD:feat/prc-free-intelligence-suite
