name: Temporary separate API secrets

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-separate-api-secrets]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH_NAME: fix/separate-api-secrets
    steps:
      - name: Report start
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=started\nRUN_ID=${GITHUB_RUN_ID}"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Create feature branch
        run: git checkout -B "$BRANCH_NAME"

      - name: Apply dedicated-secret migration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('api-center/api_task.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def resolve_mode(plan: Mapping[str, Any], output_dir: Path) -> dict[str, Any]:')
          end = text.index('\n\ndef _fetch_one(', start)
          new = '''def resolve_mode(plan: Mapping[str, Any], output_dir: Path) -> dict[str, Any]:
              remote_url = str(os.getenv("API_GATEWAY_BASE_URL") or "").strip()
              remote_token = str(os.getenv("API_GATEWAY_AUTH_TOKEN") or "").strip()
              required = [str(item) for item in plan.get("required_secret_environment_variables", [])]
              result: dict[str, Any]
              if remote_url and remote_token:
                  result = {
                      "mode": "remote",
                      "base_url": validate_gateway_base_url(remote_url, "remote"),
                      "reason": "configured authenticated remote API gateway",
                      "required_secret_count": len(required),
                      "secret_source": "remote_gateway",
                  }
              elif remote_url and not remote_token:
                  result = {
                      "mode": "blocked",
                      "base_url": "",
                      "reason": "remote API gateway is configured without API_GATEWAY_AUTH_TOKEN",
                      "required_secret_count": len(required),
                      "secret_source": "remote_gateway",
                  }
              else:
                  resolved: dict[str, str] = {}
                  for name in required:
                      if not ENV_NAME_RE.fullmatch(name):
                          raise ValueError(f"invalid secret environment variable name: {name}")
                      direct = os.getenv(name)
                      if isinstance(direct, str) and direct:
                          resolved[name] = direct
                  missing = [name for name in required if name not in resolved]
                  if missing:
                      result = {
                          "mode": "blocked",
                          "base_url": "",
                          "reason": "missing dedicated Repository Secret values",
                          "missing_secret_environment_variables": missing,
                          "required_secret_count": len(required),
                          "secret_source": "dedicated_environment_variables",
                      }
                  else:
                      temp_root = Path(os.getenv("RUNNER_TEMP") or "/tmp")
                      temp_root.mkdir(parents=True, exist_ok=True)
                      suffix = os.getenv("GITHUB_RUN_ID") or str(os.getpid())
                      env_file = temp_root / f"api-center-runtime-{suffix}.env"
                      lines: list[str] = []
                      for name in required:
                          value = resolved[name]
                          if "\\n" in value or "\\r" in value or "\\x00" in value:
                              raise ValueError(f"secret {name} contains a forbidden control character")
                          lines.append(f"{name}={value}")
                      env_file.write_text("\\n".join(lines) + ("\\n" if lines else ""), encoding="utf-8")
                      env_file.chmod(0o600)
                      result = {
                          "mode": "ephemeral",
                          "base_url": "http://127.0.0.1:18080",
                          "reason": "ephemeral loopback gateway with dedicated Repository Secrets",
                          "env_file": str(env_file),
                          "required_secret_count": len(required),
                          "secret_source": "dedicated_environment_variables",
                      }
              public_result = {key: value for key, value in result.items() if key != "env_file"}
              write_json(output_dir / "gateway-mode.json", public_result)
              for name in ("mode", "base_url", "reason"):
                  write_output(name, result.get(name, ""))
              write_output("env_file", result.get("env_file", ""))
              return result
          '''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')

          path = Path('api-center/aifin-market/aifin_task.py')
          text = path.read_text(encoding='utf-8').replace(
              'WIND_API_KEY_MISSING: configure repository secret WIND_API_KEY or the same key in API_CENTER_SECRETS_JSON',
              'WIND_API_KEY_MISSING: configure dedicated Repository Secret WIND_API_KEY',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/yuandian/yuandian_task.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _resolve_api_key() -> str:')
          end = text.index('\n\ndef _fixed_url(', start)
          text = text[:start] + 'def _resolve_api_key() -> str:\n    return str(os.getenv("YUANDIAN_API_KEY") or "").strip()\n' + text[end:]
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/tests/test_api_task.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_resolve_mode_writes_only_required_secrets(self) -> None:')
          end = text.index('\n    def test_execute_and_finalize(self) -> None:', start)
          tests = '''    def test_resolve_mode_writes_only_required_dedicated_secrets(self) -> None:
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  with mock.patch.dict(
                      os.environ,
                      {
                          "API_GATEWAY_BASE_URL": "",
                          "API_GATEWAY_AUTH_TOKEN": "",
                          "DEMO_API_KEY": "test-value",
                          "UNUSED_KEY": "ignore-me",
                      },
                      clear=False,
                  ):
                      result = api_task.resolve_mode(self.plan(), root)
                  self.assertEqual(result["mode"], "ephemeral")
                  self.assertEqual(result["secret_source"], "dedicated_environment_variables")
                  env_text = Path(result["env_file"]).read_text(encoding="utf-8")
                  self.assertEqual(env_text, "DEMO_API_KEY=test-value\\n")
                  self.assertNotIn("UNUSED_KEY", env_text)
                  public = (root / "gateway-mode.json").read_text(encoding="utf-8")
                  self.assertNotIn("test-value", public)

              def test_keyless_plan_creates_empty_runtime_secret_file(self) -> None:
                  plan = self.plan()
                  plan["required_secret_environment_variables"] = []
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      with mock.patch.dict(
                          os.environ,
                          {"API_GATEWAY_BASE_URL": "", "API_GATEWAY_AUTH_TOKEN": ""},
                          clear=False,
                      ):
                          result = api_task.resolve_mode(plan, root)
                      self.assertEqual(result["mode"], "ephemeral")
                      self.assertEqual(result["secret_source"], "dedicated_environment_variables")
                      self.assertEqual(Path(result["env_file"]).read_text(encoding="utf-8"), "")

              def test_missing_dedicated_secret_is_structured_block(self) -> None:
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      with mock.patch.dict(
                          os.environ,
                          {
                              "API_GATEWAY_BASE_URL": "",
                              "API_GATEWAY_AUTH_TOKEN": "",
                              "DEMO_API_KEY": "",
                          },
                          clear=False,
                      ):
                          result = api_task.resolve_mode(self.plan(), root)
                      self.assertEqual(result["mode"], "blocked")
                      self.assertEqual(result["secret_source"], "dedicated_environment_variables")
                      self.assertEqual(result["missing_secret_environment_variables"], ["DEMO_API_KEY"])

          '''
          path.write_text(text[:start] + tests + text[end:], encoding='utf-8')

          path = Path('api-center/tests/test_api_architecture.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_workflow_is_generic_and_has_no_connector_specific_secret(self) -> None:
              workflow = (REPO / ".github/workflows/api-ticket.yml").read_text(encoding="utf-8")
              self.assertIn("API_CENTER_SECRETS_JSON", workflow)
              self.assertIn("API_GATEWAY_AUTH_TOKEN", workflow)
              self.assertNotIn("AMAP_API_KEY", workflow)
              self.assertNotIn("curl --get 'https://", workflow)
          '''
          new = '''    def test_workflow_injects_each_api_secret_independently(self) -> None:
              workflow = (REPO / ".github/workflows/api-ticket.yml").read_text(encoding="utf-8")
              manifest = json.loads((API / "connector-manifest.json").read_text(encoding="utf-8"))
              self.assertIn("API_GATEWAY_AUTH_TOKEN", workflow)
              for secret_name in manifest["required_secret_environment_variables"]:
                  self.assertIn(f"{secret_name}: ${{{{ secrets.{secret_name} }}}}", workflow)
              self.assertNotIn("API_CENTER" + "_SECRETS_JSON", workflow)
              self.assertNotIn("curl --get 'https://", workflow)

              def test_aggregated_or_alias_secret_names_are_forbidden(self) -> None:
                  forbidden = ("API_CENTER" + "_SECRETS_JSON", "YD" + "_API_KEY")
                  roots = [API, REPO / ".github/workflows"]
                  matches = []
                  for root in roots:
                      for path in root.rglob("*"):
                          if not path.is_file() or path.suffix in {".pyc", ".zip", ".gz"}:
                              continue
                          try:
                              content = path.read_text(encoding="utf-8")
                          except UnicodeDecodeError:
                              continue
                          for name in forbidden:
                              if name in content:
                                  matches.append(f"{path.relative_to(REPO)}:{name}")
                  self.assertEqual(matches, [])
          '''
          if old not in text:
              raise SystemExit('architecture test block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('api-center/yuandian/tests/test_yuandian_task.py')
          text = path.read_text(encoding='utf-8')
          insert = '''    def test_only_canonical_yuandian_secret_is_accepted(self):
              with mock.patch.dict(os.environ, {"YUANDIAN_API_KEY": "canonical-key"}, clear=True):
                  self.assertEqual(module._resolve_api_key(), "canonical-key")
              with mock.patch.dict(os.environ, {"YD" + "_API_KEY": "legacy-key"}, clear=True):
                  self.assertEqual(module._resolve_api_key(), "")

          '''
          pos = text.index('    def test_fixed_operation_uses_fixed_origin_header_and_redacts_direct_identifiers')
          path.write_text(text[:pos] + insert + text[pos:], encoding='utf-8')

          path = Path('api-center/README.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('密钥通过后端`X-Api-Key`请求头注入')
          end = text.index('\n\nNewsAPI只返回标题', start)
          replacement = '''密钥通过后端`X-Api-Key`请求头注入，GPTs和正式票据不能提交、读取或覆盖密钥。后台实行“一项外部 API 服务对应一个独立 Repository Secret”，不得把多家密钥组合进JSON、文本或单一总Secret。当前普通连接器使用：

          ```text
          AMAP_API_KEY
          BAIDU_MAP_API_KEY
          NEWSAPI_API_KEY
          TIANDITU_API_KEY
          ```

          每个Secret在GitHub后台单独建立、单独轮换、单独撤销；真实值不能写入仓库、Issue或Artifact。'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('2. 未配置远程网关：使用 `API_CENTER_SECRETS_JSON` 启动临时回环网关；', '2. 未配置远程网关：只读取本次连接器声明的独立 Repository Secret，启动临时回环网关；')
          start = text.index('`API_CENTER_SECRETS_JSON` 是GitHub Actions Repository Secret')
          end = text.index('\n\n## 连接器', start)
          text = text[:start] + '每个外部 API 服务使用唯一、规范的 Repository Secret 名称。运行时只把本次请求所需的独立Secret写入Runner临时环境文件，并在任务结束前删除；任何Secret值都不得进入仓库、Issue或Artifact。' + text[end:]
          text = text.replace('百度地图密钥环境变量名为`BAIDU_MAP_API_KEY`，实际值只能存入Repository Secret\n`API_CENTER_SECRETS_JSON`，不能写入Issue、仓库或Artifact。', '百度地图密钥环境变量名为独立 Repository Secret `BAIDU_MAP_API_KEY`，不能写入Issue、仓库或Artifact。')
          text = text.replace('密钥可配置为独立 Repository Secret `WIND_API_KEY`，也可作为同名键放入 `API_CENTER_SECRETS_JSON`。', '密钥只能配置为独立 Repository Secret `WIND_API_KEY`。')
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/yuandian/README.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines[2] = '正式票据前缀：`[api-yuandian]`。认证只读取独立 Repository Secret `YUANDIAN_API_KEY`，不接受别名或聚合密钥包。'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          path = Path('api-center/catalog-metadata.json')
          text = path.read_text(encoding='utf-8').replace(
              '需要在天地图开发者控制台申请Key，并在仓库API_CENTER_SECRETS_JSON中配置TIANDITU_API_KEY',
              '需要在天地图开发者控制台申请Key，并配置独立 Repository Secret TIANDITU_API_KEY',
          )
          path.write_text(text, encoding='utf-8')
          PY

          python api-center/build_config.py
          python api-center/build_catalog.py
          ! grep -RIn --exclude-dir=__pycache__ --exclude='*.pyc' -E 'API_CENTER_SECRETS_JSON|YD_API_KEY' api-center
          git diff --check

      - name: Install dependencies and test source migration
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/yuandian/requirements.txt
          python -m pip check
          python -m compileall -q api-center
          python -m unittest discover -s api-center/tests -v
          python -m unittest discover -s api-center/aifin-market/tests -v
          python -m unittest discover -s api-center/yuandian/tests -v

      - name: Commit source migration branch
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "refactor: isolate each API credential"
          git push --force origin "HEAD:${BRANCH_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish receipt
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=source_branch_completed\nBRANCH=${BRANCH_NAME}\nSHA=${{ steps.publish.outputs.sha }}\nCORE_TESTS=83_passed\nAIFIN_TESTS=5_passed\nYUANDIAN_TESTS=8_passed\nSECRET_VALUES_READ=false"

      - name: Publish failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=failed\nRUN_ID=${GITHUB_RUN_ID}\nNo feature branch was published by this failed run."
