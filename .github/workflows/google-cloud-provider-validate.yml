name: Validate BigQuery and Earth Engine Providers

on:
  pull_request:
    paths:
      - "api-center/google-cloud/**"
      - "api-center/data-commons/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/google-cloud-api-ticket.yml"
      - ".github/workflows/data-commons-api-ticket.yml"
      - ".github/workflows/google-cloud-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/google-cloud/**"
      - "api-center/data-commons/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/google-cloud-api-ticket.yml"
      - ".github/workflows/data-commons-api-ticket.yml"
      - ".github/workflows/google-cloud-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-google-cloud-providers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-google-cloud-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api-center/google-cloud/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements-dev.txt \
            -r api-center/google-cloud/requirements.txt
          python -m pip check

      - name: Audit managed provider dependencies
        run: python -m pip_audit -r api-center/google-cloud/requirements.txt

      - name: Compile and run managed provider tests with coverage
        run: |
          python -m py_compile \
            api-center/google-cloud/google_cloud_task.py \
            api-center/google-cloud/unified_google_credentials.py \
            api-center/google-cloud/tests/*.py
          coverage erase
          coverage run --source=api-center/google-cloud -m unittest discover \
            -s api-center/google-cloud/tests \
            -p 'test_*.py' -v
          coverage report --skip-empty
          coverage json -o google-cloud-coverage.json

      - name: Validate schemas and unified provider catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/google-cloud')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          dc_catalog = json.loads(Path('api-center/data-commons/provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert catalog['schema_version'] == 'google-cloud-provider-catalog-v3'
          assert catalog['required_secret_environment_variables'] == ['GOOGLE_CREDENTIALS_JSON']
          assert catalog['required_secret_environment_variable'] == 'GOOGLE_CREDENTIALS_JSON'
          assert catalog['credential_bundle_contract']['required'] == ['service_account', 'data_commons_api_key']
          assert catalog['secret_values_exposed'] is False
          providers = {row['provider_id']: row for row in catalog['providers']}
          assert set(providers) == {'bigquery', 'earth-engine', 'data-commons'}
          assert all(row['enabled'] is True for row in providers.values())
          assert all(row['required_secret_environment_variable'] == 'GOOGLE_CREDENTIALS_JSON' for row in providers.values())
          assert len(providers['bigquery']['operations']) == 7
          assert len(providers['earth-engine']['operations']) == 6
          assert len(providers['data-commons']['operations']) == 5
          assert dc_catalog['required_secret_environment_variable'] == 'GOOGLE_CREDENTIALS_JSON'
          assert dc_catalog['credential_bundle_field'] == 'data_commons_api_key'
          assert 'patents-public-data' in providers['bigquery']['default_public_projects']
          assert {row['connector_id'] for row in catalog['replaced_legacy_connectors']} == {
              'gdelt-doc-articles', 'nasa-black-marble-granules', 'worldpop-population-stats'
          }
          print(json.dumps({'status': 'PASS', 'managed_providers': 3, 'operations': 18, 'secrets': 1}))
          PY

      - name: Verify legacy Google secrets and credential material are absent
        run: |
          set -euo pipefail
          for legacy in BIGQUERY_SERVICE_ACCOUNT_JSON EARTH_ENGINE_SERVICE_ACCOUNT_JSON GOOGLE_DATA_COMMONS_API_KEY; do
            if grep -R --line-number --fixed-strings "$legacy: ${{ '${{' }} secrets.$legacy {{ '}}' }}" .github/workflows; then
              echo "legacy repository secret binding found: $legacy" >&2
              exit 1
            fi
          done
          if grep -R --line-number --extended-regexp -- '-----BEGIN (RSA )?PRIVATE KEY-----' api-center/google-cloud api-center/data-commons; then
            echo "private key material found in repository files" >&2
            exit 1
          fi
          if grep -R --line-number --extended-regexp 'ya29\.[A-Za-z0-9._-]+' api-center/google-cloud api-center/data-commons; then
            echo "OAuth access token found in repository files" >&2
            exit 1
          fi

      - name: Upload managed provider validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-cloud-provider-validation-${{ github.run_id }}
          path: |
            google-cloud-coverage.json
            api-center/google-cloud/provider-catalog.json
            api-center/google-cloud/ticket.schema.json
            api-center/data-commons/provider-catalog.json
          if-no-files-found: warn
          retention-days: 30
