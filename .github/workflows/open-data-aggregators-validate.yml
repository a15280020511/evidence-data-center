name: Validate Open Data Aggregators

on:
  pull_request:
    paths:
      - 'api-center/open-data-aggregators/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - '.github/workflows/open-data-aggregators-*.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/open-data-aggregators/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - '.github/workflows/open-data-aggregators-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-open-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        operation:
          - catalog-capabilities
          - source-access-matrix
          - gleif-search
          - gdelt-search
          - sdmx-eurostat-data
          - mobility-search
          - openalex-search
          - datacite-search
          - opencitations-citations
          - unpaywall-get
          - usaspending-search
          - transitland-search
          - china-data-get
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/open-data-aggregators/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/open-data-aggregators/requirements.txt
          python -m pip check
      - name: Compile and execute zero-network fixture
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/open-data-aggregators/open_data_aggregators_task.py api-center/open-data-aggregators/validate_open_data_aggregators.py
          mkdir -p open-data-validation
          PYTHONPATH=api-center/open-data-aggregators:api-center python api-center/open-data-aggregators/validate_open_data_aggregators.py --operation '${{ matrix.operation }}' --output 'open-data-validation/${{ matrix.operation }}.json'
      - name: Verify receipt
        env:
          OPERATION: ${{ matrix.operation }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads((Path('open-data-validation')/f"{os.environ['OPERATION']}.json").read_text())
          assert row['status']=='PASS'
          assert row['network_used'] is False
          assert row['model_calls']==0
          assert row['secret_values_exposed'] is False
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: open-data-${{ matrix.operation }}-${{ github.run_id }}
          path: open-data-validation/
          if-no-files-found: warn
          retention-days: 30

  catalog-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify fixed catalog boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider=json.loads(Path('api-center/open-data-aggregators/provider-catalog.json').read_text())['providers'][0]
          matrix=json.loads(Path('api-center/open-data-aggregators/source-access-matrix.json').read_text())
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          assert provider['provider_id']=='open-data-aggregators'
          assert len(provider['operations'])==13
          assert len(matrix['sources'])==11
          assert provider['limits']['arbitrary_hosts_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          rows={row['provider_id']:row for row in catalog['managed_providers']}
          assert rows['open-data-aggregators']['operation_count']==13
          assert catalog['managed_provider_count']==len(rows)
          assert catalog['managed_operation_count']==sum(row['operation_count'] for row in rows.values())
          assert catalog['direct_center_to_center_calls_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          PY
          git diff --check
