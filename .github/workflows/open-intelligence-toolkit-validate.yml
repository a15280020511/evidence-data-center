name: Validate Open Intelligence Toolkit

on:
  pull_request:
    paths:
      - api-center/open-intelligence-toolkit/**
      - api-center/build_catalog_market_search.py
      - api-center/api-catalog.json
      - api-center/api-catalog.md
      - .github/workflows/open-intelligence-toolkit-*.yml
  push:
    branches: [main]
    paths:
      - api-center/open-intelligence-toolkit/**
      - api-center/build_catalog_market_search.py
      - api-center/api-catalog.json
      - api-center/api-catalog.md
      - .github/workflows/open-intelligence-toolkit-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/open-intelligence-toolkit/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/open-intelligence-toolkit/requirements.txt
          python -m pip check
      - name: Compile and run unit tests
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/open-intelligence-toolkit/open_intelligence_toolkit_task.py api-center/open-intelligence-toolkit/validate_open_intelligence_toolkit.py
          python -m unittest discover -s api-center/open-intelligence-toolkit/tests -p 'test_*.py' -v
      - name: Validate all 22 operation contracts without network
        run: |
          mkdir -p open-toolkit-validation
          for operation in $(python - <<'PY'
          import json
          rows=json.load(open('api-center/open-intelligence-toolkit/provider-catalog.json'))['providers'][0]['operations']
          assert len(rows)==22
          print(' '.join(row['operation_id'] for row in rows))
          PY
          ); do
            python api-center/open-intelligence-toolkit/validate_open_intelligence_toolkit.py \
              --operation "$operation" \
              --output "open-toolkit-validation/${operation}.json"
          done
      - name: Run bounded real no-key smoke checks
        run: |
          python - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          samples={
            'common-crawl-collinfo':{},
            'sec-submissions':{'cik':'0000320193'},
            'hackernews-item':{'item_id':8863},
            'ror-search':{'query':'Massachusetts Institute of Technology','limit':2},
            'wikimedia-pageviews':{'project':'en.wikipedia.org','article':'Artificial_intelligence','start':'20260701','end':'20260702'},
          }
          results=[]
          for index,(operation,parameters) in enumerate(samples.items(),1):
              with tempfile.TemporaryDirectory() as tmp:
                  root=Path(tmp);ticket=root/'ticket.json';out=root/'out'
                  ticket.write_text(json.dumps({
                      'task_id':f'live-open-toolkit-{index}-20260804',
                      'provider':'open-intelligence-toolkit','operation':operation,
                      'objective':'bounded real no-key validation','parameters':parameters,
                      'data_policy':{'classification':'public','contains_personal_data':False},
                      'acceptance':{'timeout_seconds':45,'max_response_bytes':5000000},
                  }),encoding='utf-8')
                  proc=subprocess.run(['python','api-center/open-intelligence-toolkit/open_intelligence_toolkit_task.py','execute','--ticket',str(ticket),'--output-dir',str(out)],check=False)
                  assert proc.returncode==0,operation
                  diagnostics=json.loads((out/'diagnostics.json').read_text())
                  assert diagnostics['status']=='INTEL_OPEN_TOOLKIT_COMPLETED',diagnostics
                  assert diagnostics['metadata']['network_used'] is True
                  assert diagnostics['metadata']['request_count']==1
                  assert diagnostics['model_calls']==0
                  results.append({'operation':operation,'status':'PASS','response_sha256':diagnostics['metadata']['response_sha256']})
          Path('open-toolkit-validation/live-smoke.json').write_text(json.dumps({'status':'PASS','sources':results,'model_calls':0},indent=2)+'\n')
          PY
      - name: Verify deterministic aggregate catalog
        run: |
          cp api-center/api-catalog.json /tmp/api-catalog.json
          cp api-center/api-catalog.md /tmp/api-catalog.md
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          cmp /tmp/api-catalog.json api-center/api-catalog.json
          cmp /tmp/api-catalog.md api-center/api-catalog.md
          python - <<'PY'
          import json
          c=json.load(open('api-center/api-catalog.json'))
          p={row['provider_id']:row for row in c['managed_providers']}['open-intelligence-toolkit']
          assert p['operation_count']==22
          assert p['required_secret_environment_variable_name']==''
          assert p['secret_value_exposed'] is False
          assert c['managed_provider_count']==68
          assert c['managed_operation_count']==758
          print(json.dumps({'status':'PASS','provider_count':68,'operation_count':758,'toolkit_operations':22}))
          PY
          git diff --check
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-intelligence-toolkit-validation-${{ github.run_id }}
          path: open-toolkit-validation/
          if-no-files-found: error
          retention-days: 30
