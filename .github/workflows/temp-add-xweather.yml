name: One-shot Add Xweather Provider

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/scripts/add_xweather_provider.py"
      - ".github/workflows/temp-add-xweather.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-add-xweather-pr
  cancel-in-progress: true

jobs:
  migrate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/add-overture-oecd-alphafeed
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply deterministic Xweather migration
        run: python .github/scripts/add_xweather_provider.py

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/xweather/requirements.txt
          python -m pip check

      - name: Compile and test Xweather
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/xweather/xweather_task.py \
            api-center/xweather/tests/*.py
          python -m unittest discover -s api-center/xweather/tests -p 'test_*.py' -v

      - name: Rebuild deterministic API catalog
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          git diff --check

      - name: Commit verified non-workflow implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "feat: add Xweather to API center"
          git push origin HEAD:feat/add-overture-oecd-alphafeed
