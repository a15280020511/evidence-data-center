name: Bootstrap MET Norway Geosatellite Contracts

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "api-center/metno-geosatellite/**"
      - "api-center/build_catalog_market_search.py"
      - ".github/workflows/metno-geosatellite-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: metno-geosatellite-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Patch central contracts and rebuild catalog
        run: python api-center/metno-geosatellite/bootstrap_patch.py

      - name: Verify generated state
        run: |
          python -m py_compile api-center/metno-geosatellite/metno_geosatellite_task.py api-center/metno-geosatellite/bootstrap_patch.py
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          metno = providers['metno-geosatellite']
          assert catalog['managed_provider_count'] == 37
          assert catalog['managed_operation_count'] == 413
          assert metno['operation_count'] == 4
          assert metno['required_secret_environment_variable_name'] == ''
          assert metno['limits']['fixed_api_host'] == 'api.met.no'
          print(json.dumps({'status':'PASS','provider':'metno-geosatellite','operations':4}))
          PY
          git diff --check

      - name: Commit deterministic outputs and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm api-center/metno-geosatellite/bootstrap_patch.py
          git rm .github/workflows/metno-geosatellite-bootstrap.yml
          git add api-center/README.md api-center/api-catalog.json api-center/api-catalog.md .github/workflows/api-catalog-validate.yml
          git commit -m "chore: generate MET Norway Geosatellite contracts"
          git push origin HEAD:${{ github.head_ref }}
