name: Temporary Integrate Marketstack

on:
  push:
    branches: [feat/add-marketstack]
    paths:
      - "api-center/marketstack/integrate_marketstack.py"
      - ".github/workflows/temporary-integrate-marketstack.yml"
  pull_request:
    branches: [main]
    paths:
      - "api-center/marketstack/**"
      - ".github/workflows/temporary-integrate-marketstack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-integrate-marketstack
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/add-marketstack
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/marketstack/requirements.txt

      - name: Install integration dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/marketstack/requirements.txt
          python -m pip check

      - name: Apply deterministic integration and rebuild catalogs
        run: python api-center/marketstack/integrate_marketstack.py

      - name: Freeze validated patch bundle
        run: |
          set -euo pipefail
          mkdir -p marketstack-integration-patch/api-center/tests
          mkdir -p marketstack-integration-patch/api-center
          mkdir -p marketstack-integration-patch/.github/workflows
          cp api-center/build_catalog_market_search.py marketstack-integration-patch/api-center/
          cp api-center/tests/test_api_catalog.py marketstack-integration-patch/api-center/tests/
          cp api-center/tests/test_capability_maximization.py marketstack-integration-patch/api-center/tests/
          cp .github/workflows/api-catalog-validate.yml marketstack-integration-patch/.github/workflows/
          cp api-center/README.md marketstack-integration-patch/api-center/
          cp api-center/SECRET_ISOLATION_POLICY.md marketstack-integration-patch/api-center/
          cp api-center/api-catalog.json marketstack-integration-patch/api-center/
          cp api-center/api-catalog.md marketstack-integration-patch/api-center/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('marketstack-integration-patch')
          files = {}
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              files[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'validated-patch-manifest.json').write_text(
              json.dumps({
                  'schema_version': 'marketstack-validated-patch-v1',
                  'managed_provider_count': 35,
                  'managed_operation_count': 384,
                  'marketstack_operations': 11,
                  'tests_passed': True,
                  'files': files,
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload validated integration patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketstack-validated-integration-${{ github.run_id }}
          path: marketstack-integration-patch/
          if-no-files-found: error
          retention-days: 7
