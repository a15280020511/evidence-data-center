name: One Shot Cloudflare Count Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: one-shot-cloudflare-count-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-cloudflare-count-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FEATURE_BRANCH: feat/cloudflare-intelligence-provider-20260803
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/cloudflare-intelligence-provider-20260803
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Repair capability count contract
        run: python .maintenance/fix_cloudflare_capability_count.py

      - name: Validate repaired catalog tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m unittest \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py -v
          git diff --check

      - name: Commit repaired test contract
        run: |
          set -euo pipefail
          rm -rf .maintenance
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align Cloudflare capability count"
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Report success
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CLOUDFLARE_COUNT_REPAIR_PASS"

      - name: Report failure
        if: failure()
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CLOUDFLARE_COUNT_REPAIR_FAILED run=${GITHUB_RUN_ID}"
