name: Validate Miaoxiang MCP Provider

on:
  pull_request:
    paths:
      - "api-center/miaoxiang-mcp/**"
      - ".github/workflows/miaoxiang-mcp-api-ticket.yml"
      - ".github/workflows/miaoxiang-mcp-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/miaoxiang-mcp/**"
      - ".github/workflows/miaoxiang-mcp-api-ticket.yml"
      - ".github/workflows/miaoxiang-mcp-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-miaoxiang-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/miaoxiang-mcp/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/miaoxiang-mcp/requirements.txt
          python -m pip check

      - name: Compile and test
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/miaoxiang-mcp/miaoxiang_mcp_task.py \
            api-center/miaoxiang-mcp/tests/test_miaoxiang_mcp_task.py
          python -m unittest discover \
            -s api-center/miaoxiang-mcp/tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('api-center/miaoxiang-mcp')
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          snapshot = json.loads((root / 'tool-discovery-snapshot.json').read_text(encoding='utf-8'))
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'miaoxiang-mcp'
          assert provider['required_secret_environment_variable'] == 'EM_API_KEY'
          assert provider['official_endpoint'] == 'https://mxapi.eastmoney.com/mxds/mcp'
          assert provider['mcp_protocol_version'] == '2025-11-25'
          assert provider['limits']['fixed_mcp_tool_count'] == 11
          assert len(provider['operations']) == 13
          assert snapshot['tool_count'] == 11
          assert snapshot['credential_value_exposed'] is False
          assert provider['limits']['arbitrary_jsonrpc_methods_allowed'] is False
          assert provider['limits']['arbitrary_mcp_tool_names_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['trading_or_order_execution_allowed'] is False
          serialized = json.dumps(catalog, ensure_ascii=False)
          assert 'em_ZNW1' not in serialized
          assert 'MX_APIKEY' not in serialized
          print(json.dumps({
              'status': 'PASS',
              'operations': 13,
              'mcp_tools': 11,
              'model_calls': 0,
          }))
          PY
          git diff --check

      - name: Upload safe validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miaoxiang-mcp-validation-${{ github.run_id }}
          path: |
            api-center/miaoxiang-mcp/provider-catalog.json
            api-center/miaoxiang-mcp/ticket.schema.json
            api-center/miaoxiang-mcp/tool-discovery-snapshot.json
          if-no-files-found: error
          retention-days: 30
