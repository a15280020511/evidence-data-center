name: Validate Marketstack Provider

on:
  pull_request:
    paths:
      - "api-center/marketstack/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/marketstack-provider-validate.yml"
      - ".github/workflows/marketstack-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/marketstack/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/marketstack-provider-validate.yml"
      - ".github/workflows/marketstack-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/marketstack/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/marketstack/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/marketstack/marketstack_task.py api-center/marketstack/tests/*.py
          python -m unittest discover -s api-center/marketstack/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/marketstack')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'marketstack'
          assert provider['ticket_prefix'] == '[intel-marketstack]'
          assert provider['required_secret_environment_variable'] == 'MARKETSTACK_ACCESS_KEY'
          assert len(ids) == 11
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['transient_retry_max'] == 0
          assert provider['limits']['symbols_per_ticket_max'] == 5
          assert provider['limits']['historical_span_days_max'] == 366
          assert provider['limits']['free_plan_requests_per_month'] == 100
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['intraday_or_realtime_operations_allowed'] is False
          assert provider['limits']['paid_plan_only_operations_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['trading_or_order_execution_allowed'] is False
          assert not ({'intraday','realtime','bonds','commodities','edgar'} & ids)
          print(json.dumps({'status':'PASS','operations':len(ids),'plan':'free'}))
          PY
          git diff --check
