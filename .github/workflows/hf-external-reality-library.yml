name: Validate External Reality Control Library

on:
  pull_request:
    paths:
      - "api-center/huggingface/external_reality_store.py"
      - "api-center/huggingface/external-reality-library/**"
      - "api-center/huggingface/tests/test_external_reality_store.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/hf-external-reality-library.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/external_reality_store.py"
      - "api-center/huggingface/external-reality-library/**"
      - "api-center/huggingface/tests/test_external_reality_store.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/hf-external-reality-library.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-external-reality-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-control-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ""
      HF_EXTERNAL_REALITY_DATASET_REPO: ""
      HF_DOMAIN_BENCHMARK_DATASET_REPO: ""
      HF_CLOUDFLARE_DATASET_REPO: ""
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements.txt

      - name: Install pinned dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/huggingface/requirements.txt
          python -m pip check

      - name: Compile and run deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile api-center/huggingface/external_reality_store.py
          python -m unittest api-center/huggingface/tests/test_external_reality_store.py -v
          python api-center/huggingface/external_reality_store.py validate \
            --output-dir external-reality-validation
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('external-reality-validation/bundle-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 'external-reality-control-bundle-v1'
          assert manifest['file_count'] == 256
          assert manifest['domain_count'] == 18
          assert manifest['collection_layer_count'] == 13
          assert manifest['directories_per_domain'] == 13
          assert len(manifest['bundle_sha256']) == 64
          assert manifest['secret_values_exposed'] is False
          assert manifest['model_calls'] == 0
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-reality-control-validation-${{ github.run_id }}
          path: external-reality-validation/
          if-no-files-found: error
          retention-days: 30
