name: NOAA Live Validation And Rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-rebuild:
    if: github.head_ref == 'feat/noaa-official-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Align catalog metadata with verified NOAA parameters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('api-center/catalog-metadata.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          ncei = doc['connectors']['noaa-ncei-data-search']
          ncei['parameter_notes']['bbox'] = ncei['parameter_notes'].pop('boundingBox')
          alerts = doc['connectors']['noaa-nws-alerts-active']
          alerts['parameter_notes'].pop('limit', None)
          alerts['example_parameters'].pop('limit', None)
          if 'NWS 建议活动警报请求频率不超过每 30 秒一次' not in alerts['limitations']:
              alerts['limitations'].append('NWS 建议活动警报请求频率不超过每 30 秒一次')
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Rebuild deterministic contracts and run NOAA tests
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_noaa_connectors.py' -v
          git diff --check

      - name: Probe supported official NOAA requests
        shell: bash
        run: |
          set -euo pipefail
          ua='decision-system-intelligence-center/1.0 (https://github.com/a15280020511/evidence-data-center)'
          mkdir -p noaa-live
          probe() {
            name="$1"
            url="$2"
            accept="$3"
            code="$(curl -L --max-time 30 -A "$ua" -H "Accept: $accept" -sS -o "noaa-live/${name}.json" -w '%{http_code}' "$url")"
            printf '%s=%s\n' "$name" "$code" | tee -a noaa-live/status.txt
            test "$code" = '200'
            python -m json.tool "noaa-live/${name}.json" >/dev/null
          }
          probe points 'https://api.weather.gov/points/39.7456,-97.0892' 'application/geo+json'
          probe alerts 'https://api.weather.gov/alerts/active?area=KS' 'application/geo+json'
          probe ncei_basic 'https://www.ncei.noaa.gov/access/services/search/v1/data?dataset=daily-summaries&startDate=2024-01-01&endDate=2024-01-02' 'application/json'
          probe ncei_station 'https://www.ncei.noaa.gov/access/services/search/v1/data?dataset=daily-summaries&startDate=2024-01-01&endDate=2024-01-02&stations=USW00094728&limit=1' 'application/json'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: noaa-live-validation-${{ github.run_id }}
          path: noaa-live
          if-no-files-found: error
          retention-days: 30

      - name: Commit regenerated NOAA contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'fix: align NOAA contracts with verified live endpoints'
            git push origin HEAD:feat/noaa-official-data
          fi
