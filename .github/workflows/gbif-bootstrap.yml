name: Bootstrap GBIF Integration

on:
  push:
    branches: [feat/gbif]
    paths:
      - "tools/bootstrap_gbif.py"
      - "api-center/gbif/**"
      - ".github/workflows/gbif-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/gbif
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/gbif/requirements.txt

      - name: Patch deterministic registry and generated catalog
        run: python tools/bootstrap_gbif.py

      - name: Validate GBIF and unified catalog
        run: |
          python -m py_compile api-center/gbif/gbif_task.py tools/bootstrap_gbif.py
          python -m unittest discover -s api-center/gbif/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          git diff --check

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/build_catalog_market_search.py api-center/README.md \
            api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py \
            api-center/api-catalog.json api-center/api-catalog.md
          git commit -m "chore: register GBIF in intelligence catalog"
          git push origin HEAD:feat/gbif
