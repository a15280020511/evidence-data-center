name: One-shot Fix Xweather History Pagination

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/scripts/fix_xweather_history_plimit.py"
      - ".github/workflows/temp-fix-xweather-history-plimit.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-fix-xweather-history-pagination
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/add-overture-oecd-alphafeed
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply deterministic patch
        run: python .github/scripts/fix_xweather_history_plimit.py

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/xweather/requirements.txt
          python -m pip check

      - name: Rebuild and validate contracts
        run: |
          set -euo pipefail
          python -m py_compile api-center/xweather/xweather_task.py api-center/xweather/tests/test_xweather_task.py
          python -m unittest discover -s api-center/xweather/tests -p 'test_*.py' -v
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          git diff --check

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center .github/scripts/live_smoke_xweather_alphafeed.py
          git commit -m "fix: use plimit for Xweather historical periods"
          git push origin HEAD:feat/add-overture-oecd-alphafeed
