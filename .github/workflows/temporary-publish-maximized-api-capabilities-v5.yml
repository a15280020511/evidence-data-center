name: Temporary publish maximized API capabilities v5

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  SUPPLEMENT_SHA256: 008eeef743b1b1ad2d144d0cbd99827ddc5842aac683ebd6212b1dac54300a13
  PATCH_SOURCE_ISSUE: 31
  PATCH_SHA256: 0000fab8f91e3a4c4d44c54b8ea4fb2958d92e43e1981f8bca3e7b236045f261
  EXPECTED_CATALOG_SHA256: 844ab799ec02b8bf7b3865d1a5b76dde9d348b342612b0d01b099407555d42e7

jobs:
  publish:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-publish-maximized-api-capabilities-v5]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: api-capability-publisher-v5
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
      API_CENTER_SECRETS_JSON: ${{ secrets.API_CENTER_SECRETS_JSON }}

    steps:
      - name: Report start
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="MAXIMIZED_API_RELEASE_V5_RUN_ID=${GITHUB_RUN_ID}\nSTATUS=started"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Reconstruct exact previously validated API tree
        shell: bash
        run: |
          set -euo pipefail
          cat .maintenance/api-baseline-supplement.part-{01,02,03}.b64 > /tmp/supplement.b64
          test "$(wc -c < /tmp/supplement.b64)" -eq 23244
          base64 --decode /tmp/supplement.b64 > /tmp/supplement.tar.gz
          echo "${SUPPLEMENT_SHA256}  /tmp/supplement.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/supplement.tar.gz -C .
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PATCH_SOURCE_ISSUE}/comments?per_page=100" > /tmp/source-comments.json
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          raw = Path('/tmp/source-comments.json').read_text(encoding='utf-8')
          try:
              rows = json.loads(raw)
          except json.JSONDecodeError:
              decoder = json.JSONDecoder(); rows = []; offset = 0
              while offset < len(raw):
                  while offset < len(raw) and raw[offset].isspace(): offset += 1
                  if offset >= len(raw): break
                  value, offset = decoder.raw_decode(raw, offset)
                  rows.extend(value if isinstance(value, list) else [value])
          pattern = re.compile(r'PATCH_CHUNK_(\d{3})\s*\n(.*?)(?=PATCH_CHUNK_\d{3}\s*\n|\Z)', re.DOTALL)
          chunks = {}
          for row in rows:
              for match in pattern.finditer(str(row.get('body') or '')):
                  payload = re.sub(r'[^A-Za-z0-9+/=]', '', match.group(2))
                  if payload: chunks[int(match.group(1))] = payload
          assert sorted(chunks) == list(range(1, 9)), sorted(chunks)
          damaged = ''.join(chunks[index] for index in range(1, 9))
          assert len(damaged) == 85591
          corrected = damaged[:5849] + 'E' + damaged[5850:]
          repaired = corrected[:8779] + 'n' + corrected[8779:]
          archive = base64.b64decode(repaired, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          assert digest == os.environ['PATCH_SHA256'], digest
          Path('/tmp/capability-patch.tar.gz').write_bytes(archive)
          PY
          tar -xzf /tmp/capability-patch.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('api-center/tests/test_api_catalog.py')
          text = path.read_text(encoding='utf-8').replace('api-catalog-v2', 'api-catalog-v3')
          assert 'api-catalog-v2' not in text
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Rebuild and verify deterministic capability identity
        shell: bash
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog.py
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          catalog_path = Path('api-center/api-catalog.json')
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          wind = json.loads(Path('api-center/aifin-market/provider-catalog.json').read_text(encoding='utf-8'))
          digest = hashlib.sha256(catalog_path.read_bytes()).hexdigest()
          assert digest == os.environ['EXPECTED_CATALOG_SHA256'], digest
          assert catalog['schema_version'] == 'api-catalog-v3'
          assert manifest['connector_count'] == manifest['enabled_connector_count'] == 69
          assert catalog['managed_provider_count'] == catalog['enabled_managed_provider_count'] == 6
          assert sum(len(row['operations']) for row in catalog['managed_providers']) == 53
          assert catalog['exposed_parameter_count'] == 530
          assert len(wind['providers'][0]['operations']) == 17
          assert catalog['secret_values_exposed'] is False
          print(json.dumps({'catalog_sha256': digest, 'connectors': 69, 'operations': 53, 'parameters': 530}))
          PY

      - name: Install locked dependencies and rerun implementation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/akshare/requirements.txt
          python -m pip check
          python -m compileall -q api-center
          python -m unittest discover -s api-center/tests -v
          python -m unittest discover -s api-center/google-cloud/tests -v
          python -m unittest discover -s api-center/data-commons/tests -v
          python -m unittest discover -s api-center/aifin-market/tests -v
          python -m unittest discover -s api-center/akshare/tests -v

      - name: Resolve Wind credential without exposing value
        shell: bash
        run: |
          set -euo pipefail
          resolved="${WIND_API_KEY:-}"
          if [[ -z "${resolved}" && -n "${API_CENTER_SECRETS_JSON:-}" ]]; then
            resolved="$(python - <<'PY'
          import json, os
          try: print(str(json.loads(os.environ.get('API_CENTER_SECRETS_JSON') or '{}').get('WIND_API_KEY') or ''), end='')
          except Exception: print('', end='')
          PY
            )"
          fi
          [[ -n "${resolved}" ]] || { echo 'WIND_API_KEY missing'; exit 1; }
          echo "WIND_API_KEY=${resolved}" >> "$GITHUB_ENV"

      - name: Reconfirm real Wind read
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wind-smoke && mkdir -p /tmp/wind-smoke
          cat > /tmp/wind-ticket.json <<'JSON'
          {"task_id":"max-api-v5-wind-20260731","objective":"Verify Wind read","data_policy":{"classification":"public","contains_personal_data":false},"operation":"stock-basicinfo","parameters":{"question":"贵州茅台基本档案"}}
          JSON
          python api-center/aifin-market/aifin_task.py execute --ticket /tmp/wind-ticket.json --output-dir /tmp/wind-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/wind-smoke/aifin-snapshot.json').read_text(encoding='utf-8'))
          assert row['status'] == 'API_AIFIN_COMPLETED', row
          assert row.get('upstream_called') is True, row
          assert row.get('result') not in (None, {}, [], ''), row
          assert row.get('tool_name') == 'get_stock_basicinfo', row
          print('WIND_REAL_READ_OK')
          PY

      - name: Real AKShare read with complete formal ticket
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/akshare-smoke && mkdir -p /tmp/akshare-smoke
          cat > /tmp/akshare-ticket.json <<'JSON'
          {
            "task_id": "max-api-v5-akshare-20260731",
            "provider": "akshare",
            "operation": "macro-china-gdp",
            "objective": "Verify expanded AKShare China GDP",
            "parameters": {"max_rows": 50},
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "acceptance": {"timeout_seconds": 120, "max_response_bytes": 5000000}
          }
          JSON
          ok=false
          for attempt in 1 2 3; do
            rm -rf /tmp/akshare-smoke/*
            if python api-center/akshare/akshare_task.py execute --ticket /tmp/akshare-ticket.json --output-dir /tmp/akshare-smoke; then ok=true; break; fi
            cat /tmp/akshare-smoke/akshare-snapshot.json || true
            sleep $((attempt * 5))
          done
          [[ "${ok}" == true ]]
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/akshare-smoke/akshare-snapshot.json').read_text(encoding='utf-8'))
          assert row['status'] == 'API_AKSHARE_COMPLETED', row
          assert row['provider'] == 'akshare', row
          assert row['operation'] == 'macro-china-gdp', row
          assert row.get('data', {}).get('row_count', 0) > 0, row
          assert row.get('data', {}).get('rows'), row
          print('AKSHARE_REAL_READ_OK')
          PY

      - name: Publish tested API payload to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "feat: maximize safe read-only API capabilities"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish completion receipt
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=api_payload_completed\nMAIN_SHA=${{ steps.publish.outputs.sha }}\nCATALOG_SHA256=${EXPECTED_CATALOG_SHA256}\nCATALOG_SCHEMA=api-catalog-v3\nCONNECTORS=69/69\nMANAGED_PROVIDERS=6/6\nMANAGED_OPERATIONS=53\nEXPOSED_PARAMETERS=530\nWIND_OPERATIONS=17\nWIND_REAL_SMOKE=passed\nAKSHARE_REAL_SMOKE=passed\nSECRET_VALUES_EXPOSED=false\nWORKFLOW_SYNC_REQUIRED=true"

      - name: Publish structured failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=failed\nRUN_ID=${GITHUB_RUN_ID}\nNo API capability payload was published by this failed run."
