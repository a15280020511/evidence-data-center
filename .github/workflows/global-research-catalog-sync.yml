name: Sync Global Research Catalog Contracts

on:
  push:
    branches:
      - feat/global-research-intelligence-20260803

permissions:
  contents: write

concurrency:
  group: sync-global-research-catalog
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Synchronize aggregate test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          api_test = Path('api-center/tests/test_api_catalog.py')
          text = api_test.read_text(encoding='utf-8')
          text = text.replace(
              '    "evidence-standardization": 8,\n}',
              '    "evidence-standardization": 8,\n    "global-research-intelligence": 23,\n}',
          )
          text = text.replace(
              'self.assertEqual(catalog["managed_provider_count"], 52)',
              'self.assertEqual(catalog["managed_provider_count"], 53)',
          )
          text = text.replace(
              'self.assertEqual(catalog["enabled_managed_provider_count"], 52)',
              'self.assertEqual(catalog["enabled_managed_provider_count"], 53)',
          )
          text = text.replace(
              'self.assertEqual(catalog["managed_operation_count"], 588)',
              'self.assertEqual(catalog["managed_operation_count"], 611)',
          )
          api_test.write_text(text, encoding='utf-8')

          maximum_test = Path('api-center/tests/test_capability_maximization.py')
          text = maximum_test.read_text(encoding='utf-8')
          text = text.replace(
              '            588,\n        )',
              '            611,\n        )',
              1,
          )
          text = text.replace(
              '            "evidence-standardization": 8,\n        }',
              '            "evidence-standardization": 8,\n            "global-research-intelligence": 23,\n        }',
          )
          maximum_test.write_text(text, encoding='utf-8')
          PY
      - name: Generate authoritative API catalog
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_catalog_market_search.py
      - name: Commit synchronized contracts
        run: |
          if git diff --quiet; then
            echo "Catalog already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py
          git commit -m "chore: synchronize global research catalog"
          git push origin HEAD:feat/global-research-intelligence-20260803
