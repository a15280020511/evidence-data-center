name: Diagnose Tianyancha HTTP 418

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-tianyancha-http-418
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] diagnose-tianyancha-418'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TIANYANCHA_API_TOKEN: ${{ secrets.TIANYANCHA_API_TOKEN }}
    steps:
      - name: Extract sanitized visible message from Tianyancha block page
        run: |
          set -euo pipefail
          test -n "${TIANYANCHA_API_TOKEN:-}"
          mkdir -p tyc-diagnostic
          python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          token = os.environ['TIANYANCHA_API_TOKEN'].strip()
          url = 'https://open.api.tianyancha.com/services/open/ic/baseinfoV2/2.0?keyword=%E8%85%BE%E8%AE%AF%E7%A7%91%E6%8A%80%EF%BC%88%E6%B7%B1%E5%9C%B3%EF%BC%89%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8'
          body_path = Path('/tmp/tyc-body.html')
          headers_path = Path('/tmp/tyc-headers.txt')
          command = [
              'curl', '--silent', '--show-error', '--http1.1',
              '--connect-timeout', '10', '--max-time', '30',
              '--output', str(body_path), '--dump-header', str(headers_path),
              '--write-out', '%{http_code}',
              '--header', f'Authorization: {token}',
              '--header', 'Accept: application/json',
              '--header', 'User-Agent:',
              url,
          ]
          completed = subprocess.run(command, text=True, capture_output=True, check=False)
          raw = body_path.read_bytes() if body_path.exists() else b''
          decoded = raw.decode('utf-8', errors='replace').replace(token, '[REDACTED]')
          cleaned = re.sub(r'(?is)<(style|script|svg).*?>.*?</\1>', ' ', decoded)
          cleaned = re.sub(r'(?is)<!--.*?-->', ' ', cleaned)
          cleaned = re.sub(r'(?is)<[^>]+>', ' ', cleaned)
          visible_text = ' '.join(html.unescape(cleaned).split())[:3000]
          headers_text = headers_path.read_text(encoding='utf-8', errors='replace') if headers_path.exists() else ''
          safe_headers = {}
          for line in headers_text.splitlines():
              if ':' not in line:
                  continue
              name, value = line.split(':', 1)
              if name.strip().lower() in {'content-type', 'content-length', 'server', 'date', 'via', 'x-cache', 'x-request-id', 'x-trace-id'}:
                  safe_headers[name.strip().lower()] = value.strip()[:500]
          result = {
              'schema_version': 'tianyancha-418-visible-message-v1',
              'endpoint_path': '/services/open/ic/baseinfoV2/2.0',
              'http_status': int(completed.stdout.strip() or 0),
              'curl_exit_code': completed.returncode,
              'response_bytes': len(raw),
              'body_sha256': hashlib.sha256(raw).hexdigest(),
              'safe_response_headers': safe_headers,
              'visible_text': visible_text,
              'credential_present': True,
              'credential_value_exposed': False,
              'model_calls': 0,
          }
          serialized = json.dumps(result, ensure_ascii=False)
          if token in serialized:
              raise SystemExit('token leakage detected')
          Path('tyc-diagnostic/diagnostic.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(serialized)
          PY

      - name: Upload sanitized diagnostic evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tianyancha-418-visible-message-${{ github.run_id }}
          path: tyc-diagnostic/diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish receipt
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="TIANYANCHA_418_MESSAGE_EXTRACTED artifact=${ARTIFACT_URL} credential_value_exposed=false model_calls=0"
