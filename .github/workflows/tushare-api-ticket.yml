name: Managed Tushare API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-tushare-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-tushare-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-tushare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TUSHARE_API_TOKEN: ${{ secrets.TUSHARE_API_TOKEN }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/tushare/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/tushare/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: python -m py_compile api-center/tushare/tushare_task.py

      - name: Parse and authorize Tushare ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/tushare/tushare_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir tushare-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/tushare/tushare_task.py render \
            --output-dir tushare-artifacts --phase accepted > tushare-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@tushare-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/tushare/tushare_task.py render \
            --output-dir tushare-artifacts --phase rejected > tushare-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@tushare-comment.md

      - name: Execute bounded read-only Tushare operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/tushare/tushare_task.py execute \
            --ticket tushare-artifacts/ticket.json \
            --output-dir tushare-artifacts

      - name: Upload Tushare evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tushare-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: tushare-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/tushare/tushare_task.py render \
            --output-dir tushare-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > tushare-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@tushare-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_TUSHARE_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Tushare API ticket did not complete successfully."
          exit 1
