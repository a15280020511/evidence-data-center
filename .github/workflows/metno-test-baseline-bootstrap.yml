name: Bootstrap MET Norway Geosatellite Test Baselines

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "api-center/metno-geosatellite/**"
      - ".github/workflows/metno-test-baseline-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: metno-test-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update-baselines:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Update exact catalog baselines
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog_test = Path('api-center/tests/test_api_catalog.py')
          text = catalog_test.read_text(encoding='utf-8')
          replacements = [
              ('    "nasa": 25,\n    "wolfram-alpha": 4,', '    "nasa": 25,\n    "metno-geosatellite": 4,\n    "wolfram-alpha": 4,'),
              ('catalog["managed_provider_count"], 36', 'catalog["managed_provider_count"], 37'),
              ('catalog["enabled_managed_provider_count"], 36', 'catalog["enabled_managed_provider_count"], 37'),
              ('catalog["managed_operation_count"], 409', 'catalog["managed_operation_count"], 413'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'test_api_catalog marker count {count}: {old}')
              text = text.replace(old, new, 1)
          catalog_test.write_text(text, encoding='utf-8')

          capability_test = Path('api-center/tests/test_capability_maximization.py')
          text = capability_test.read_text(encoding='utf-8')
          replacements = [
              ('            409,\n', '            413,\n'),
              ('            "nasa": 25,\n            "wolfram-alpha": 4,', '            "nasa": 25,\n            "metno-geosatellite": 4,\n            "wolfram-alpha": 4,'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'test_capability marker count {count}: {old}')
              text = text.replace(old, new, 1)
          capability_test.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted regressions
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m unittest api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py -v
          git diff --check

      - name: Commit baseline updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py
          git commit -m "test: register MET Norway Geosatellite baselines"
          git push origin HEAD:${{ github.head_ref }}
