name: Bootstrap knowledge-document generated catalog

on:
  push:
    branches:
      - feat/api-center-wolframalpha-llamaparse
    paths:
      - "api-center/knowledge-document/**"
      - "api-center/build_catalog_market_search.py"
      - ".github/workflows/bootstrap-knowledge-document-catalog.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-knowledge-document-catalog
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/api-center-wolframalpha-llamaparse
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/knowledge-document/requirements.txt
          python -m pip check

      - name: Validate provider and regenerate deterministic catalog
        run: |
          set -euo pipefail
          python -m py_compile api-center/knowledge-document/provider_task.py
          python -m unittest discover -s api-center/knowledge-document/tests -p 'test_*.py' -v
          python api-center/build_catalog_market_search.py

      - name: Commit generated contracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md
          if git diff --cached --quiet; then
            echo "Generated contracts already current."
            exit 0
          fi
          git commit -m "chore(api-center): regenerate WolframAlpha and LlamaParse catalog"
          git push origin HEAD:feat/api-center-wolframalpha-llamaparse
