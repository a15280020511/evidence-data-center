name: One-shot Hugging Face Provider Assembly

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-huggingface-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-huggingface-assemble]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: feat/huggingface-hub-provider-20260803
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/huggingface/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/huggingface/requirements.txt
          python -m pip check

      - name: Normalize provider schemas and global invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          repo_id = {"type":"string","minLength":1,"maxLength":193,"pattern":"^[A-Za-z0-9][A-Za-z0-9._-]{0,95}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,95})?$"}
          repo_type = {"type":"string","enum":["model","dataset","space"]}
          revision = {"type":"string","minLength":1,"maxLength":100,"pattern":"^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$"}
          path_optional = {"type":"string","maxLength":300,"pattern":"^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))[^\\x00-\\x1f\\x7f]*$"}
          path_required = {"type":"string","minLength":1,"maxLength":300,"pattern":"^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))[^\\x00-\\x1f\\x7f]+$"}
          catalog_path = Path('api-center/huggingface/provider-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          provider = catalog['providers'][0]
          for row in provider['operations']:
              op = row['operation_id']
              if op in {'model-info','model-security','dataset-info','space-info'}:
                  row['parameter_schema'] = {
                      'type':'object','additionalProperties':False,'required':['repo_id'],
                      'properties':{'repo_id':repo_id,'revision':revision},'maxProperties':2,
                  }
              elif op == 'repo-tree':
                  row['parameter_schema'] = {
                      'type':'object','additionalProperties':False,'required':['repo_id','repo_type'],
                      'properties':{'repo_id':repo_id,'repo_type':repo_type,'revision':revision,'path':path_optional,'limit':{'type':'integer','minimum':1,'maximum':100,'default':100}},
                      'maxProperties':5,
                  }
              elif op == 'repo-refs':
                  row['parameter_schema'] = {
                      'type':'object','additionalProperties':False,'required':['repo_id','repo_type'],
                      'properties':{'repo_id':repo_id,'repo_type':repo_type},'maxProperties':2,
                  }
              elif op == 'repo-paths-info':
                  row['parameter_schema'] = {
                      'type':'object','additionalProperties':False,'required':['repo_id','repo_type','paths'],
                      'properties':{'repo_id':repo_id,'repo_type':repo_type,'revision':revision,'paths':{'type':'array','minItems':1,'maxItems':20,'uniqueItems':True,'items':path_required},'expand':{'type':'boolean','default':False}},
                      'maxProperties':5,
                  }
          provider.pop('$defs', None)
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = Path('api-center/build_catalog_market_search.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('FRED_CATALOG = HERE / "fred/provider-catalog.json"\n', 'FRED_CATALOG = HERE / "fred/provider-catalog.json"\nHUGGINGFACE_CATALOG = HERE / "huggingface/provider-catalog.json"\n', 1)
          text = text.replace('    "fred": 25,\n}', '    "fred": 25,\n    "huggingface-hub": 11,\n}', 1)
          text = text.replace('    FRED_CATALOG,\n)', '    FRED_CATALOG,\n    HUGGINGFACE_CATALOG,\n)', 1)
          text = text.replace('        "fred/provider-catalog.json",\n', '        "fred/provider-catalog.json",\n        "huggingface/provider-catalog.json",\n', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/tests/test_api_catalog.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    "fred": 25,\n}', '    "fred": 25,\n    "huggingface-hub": 11,\n}', 1)
          text = text.replace('self.assertEqual(catalog["managed_provider_count"], 50)', 'self.assertEqual(catalog["managed_provider_count"], 51)', 1)
          text = text.replace('self.assertEqual(catalog["enabled_managed_provider_count"], 50)', 'self.assertEqual(catalog["enabled_managed_provider_count"], 51)', 1)
          text = text.replace('self.assertEqual(catalog["managed_operation_count"], 569)', 'self.assertEqual(catalog["managed_operation_count"], 580)', 1)
          anchor = '        cloudflare = providers["cloudflare"]\n'
          block = '''        huggingface = providers["huggingface-hub"]\n        self.assertEqual(huggingface["ticket_prefix"], "[intel-huggingface]")\n        self.assertEqual(huggingface["required_secret_environment_variable_name"], "")\n        self.assertEqual(len(huggingface["operations"]), 11)\n        self.assertEqual(huggingface["limits"]["fixed_api_host"], "huggingface.co")\n        self.assertTrue(huggingface["limits"]["public_repositories_only"])\n        self.assertFalse(huggingface["limits"]["authentication_used"])\n        self.assertFalse(huggingface["limits"]["inference_allowed"])\n        self.assertFalse(huggingface["limits"]["training_or_jobs_allowed"])\n        self.assertFalse(huggingface["limits"]["write_operations_allowed"])\n\n'''
          if block not in text:
              text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/tests/test_capability_maximization.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('            569,\n', '            580,\n', 1)
          text = text.replace('            "fred": 25,\n', '            "fred": 25,\n            "huggingface-hub": 11,\n', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/README.md')
          text = path.read_text(encoding='utf-8')
          if '## Hugging Face Hub 公共模型与数据情报' not in text:
              text += '''\n## Hugging Face Hub 公共模型与数据情报\n\n`api-center/huggingface/` 使用固定官方 Hub API 与 `huggingface_hub==1.24.0`：\n\n```text\n[intel-huggingface]\n无需 Repository Secret\n```\n\n固定开放11项公共只读能力，覆盖模型、数据集、Spaces 搜索与详情，以及非递归仓库目录、分支/标签和指定路径元数据。执行器强制匿名 `token=False`，不读取私有仓库；不开放推理、训练、Jobs、Space调用、文件下载、仓库克隆、自动翻页或写入。\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate deterministic catalogs
        run: |
          set -euo pipefail
          python api-center/build_catalog_market_search.py

      - name: Run provider and global regressions
        run: |
          set -euo pipefail
          python -m py_compile api-center/managed_provider_runtime.py api-center/huggingface/huggingface_task.py api-center/huggingface/tests/test_huggingface.py
          python -m unittest discover -s api-center/huggingface/tests -p 'test_*.py' -v
          python -m unittest api-center/tests/test_api_catalog.py -v
          python -m unittest api-center/tests/test_capability_maximization.py -v
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'api-center')
          from managed_provider_runtime import validate_ticket
          ticket = {
              'task_id':'hf-schema-check-20260803',
              'provider':'huggingface-hub',
              'operation':'model-info',
              'parameters':{'repo_id':'openai-community/gpt2'},
              'data_policy':{'classification':'public','contains_personal_data':False},
              'acceptance':{'timeout_seconds':30,'max_response_bytes':1000000},
          }
          validate_ticket(ticket, schema_path=Path('api-center/huggingface/ticket.schema.json'), catalog_path=Path('api-center/huggingface/provider-catalog.json'))
          print(json.dumps({'status':'PASS','ticket_schema':'validated'}))
          PY
          git diff --check

      - name: Commit assembled provider
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-center
          if git diff --cached --quiet; then
            echo 'No assembly changes to commit'
          else
            git commit -m 'feat(huggingface): integrate public Hub catalog'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Publish PASS
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'HUGGINGFACE_PROVIDER_ASSEMBLY_PASS: public-only Hugging Face Hub provider assembled on `feat/huggingface-hub-provider-20260803`; deterministic catalog regenerated to 51 providers / 580 operations; provider and global catalog regressions passed.'
