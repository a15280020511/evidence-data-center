name: Bootstrap GNews Provider

on:
  push:
    branches:
      - feat/gnews-provider-20260803
    paths:
      - ".github/workflows/bootstrap-gnews-provider.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-gnews-provider
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/gnews-provider-20260803
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Materialize governed provider files
        run: |
          base64 --decode .bootstrap/gnews.bundle.b64 > /tmp/gnews-provider.tar.gz
          python - <<'PY'
          import tarfile
          with tarfile.open('/tmp/gnews-provider.tar.gz', 'r:gz') as archive:
              for member in archive.getmembers():
                  if member.name.startswith('/') or '..' in member.name.split('/'):
                      raise SystemExit('unsafe archive path')
              archive.extractall('.')
          PY
          python _bootstrap/patch_catalog.py
          rm -rf _bootstrap
      - name: Install validation runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/gnews/requirements.txt
          python -m pip check
      - name: Rebuild deterministic aggregate catalog
        run: python api-center/build_catalog_market_search.py
      - name: Validate provider and aggregate invariants
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/gnews/gnews_task.py api-center/gnews/tests/test_gnews_task.py
          python api-center/gnews/tests/test_gnews_task.py
          python api-center/tests/test_api_catalog.py
          git diff --check
      - name: Commit generated registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/gnews api-center/build_catalog_market_search.py api-center/tests/test_api_catalog.py api-center/api-catalog.json api-center/api-catalog.md
          git commit -m "feat: register GNews provider in intelligence catalog"
          git push origin HEAD:feat/gnews-provider-20260803
