name: Temporary Google Books Key Custom Search Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tmp-google-books-key-custom-search-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Execute one sanitized Custom Search request
        run: |
          python - <<'PY'
          import json
          import os
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          key = os.environ.get("GOOGLE_API_KEY", "")
          receipt = {
              "status": "FAIL",
              "secret_name": "GOOGLE_API_KEY",
              "secret_present": bool(key),
              "endpoint": "https://customsearch.googleapis.com/customsearch/v1",
              "cx_source": "google-official-documentation-sample",
              "query": "OpenAI",
              "request_count": 0,
              "http_status": None,
              "api_access": "unknown",
              "search_completed": False,
              "result_count": 0,
              "secret_values_exposed": False,
              "model_calls": 0,
          }
          if not key:
              receipt["api_access"] = "secret_missing"
              Path("google-custom-search-probe.json").write_text(json.dumps(receipt, indent=2))
              print(json.dumps(receipt))
              raise SystemExit(1)

          params = urllib.parse.urlencode({
              "key": key,
              "cx": "017576662512468239146:omuauf_lfve",
              "q": "OpenAI",
              "num": 1,
          })
          url = "https://customsearch.googleapis.com/customsearch/v1?" + params
          request = urllib.request.Request(url, method="GET", headers={"Accept": "application/json"})
          receipt["request_count"] = 1
          try:
              with urllib.request.urlopen(request, timeout=60, context=ssl.create_default_context()) as response:
                  body = response.read(2_000_000)
                  receipt["http_status"] = response.status
                  payload = json.loads(body.decode("utf-8"))
                  items = payload.get("items") or []
                  receipt["result_count"] = len(items)
                  receipt["search_completed"] = response.status == 200 and len(items) > 0
                  receipt["api_access"] = "enabled_and_key_accepted" if receipt["search_completed"] else "enabled_but_empty"
                  receipt["status"] = "PASS" if receipt["search_completed"] else "FAIL"
          except urllib.error.HTTPError as exc:
              receipt["http_status"] = exc.code
              raw = exc.read(1_000_000)
              try:
                  payload = json.loads(raw.decode("utf-8"))
              except Exception:
                  payload = {}
              error = payload.get("error") or {}
              receipt["google_error_status"] = error.get("status")
              errors = error.get("errors") or []
              reason = errors[0].get("reason") if errors else None
              receipt["google_error_reason"] = reason
              message = str(error.get("message") or "")
              lowered = message.lower()
              if "has not been used in project" in lowered or "is disabled" in lowered or reason in {"accessNotConfigured", "serviceDisabled"}:
                  receipt["api_access"] = "custom_search_api_not_enabled"
              elif "api key not valid" in lowered or reason == "keyInvalid":
                  receipt["api_access"] = "key_invalid"
              elif "requests from referer" in lowered or "api key restrictions" in lowered or reason in {"forbidden", "ipRefererBlocked"}:
                  receipt["api_access"] = "key_restriction_blocks_custom_search"
              elif "invalid value" in lowered and "cx" in lowered:
                  receipt["api_access"] = "key_accepted_but_sample_cx_rejected"
              else:
                  receipt["api_access"] = "request_rejected_other"
          except Exception as exc:
              receipt["api_access"] = "network_or_runtime_error"
              receipt["error_type"] = type(exc).__name__

          Path("google-custom-search-probe.json").write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt))
          if receipt["status"] != "PASS":
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: google-custom-search-key-probe-${{ github.run_id }}
          path: google-custom-search-probe.json
          if-no-files-found: error
          retention-days: 7
