name: Normalize NOAA Catalog Metadata

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'feat/noaa-official-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore base ordering and append NOAA metadata
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('api-center/catalog-metadata.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          noaa = {
              key: value
              for key, value in current['connectors'].items()
              if key.startswith('noaa-')
          }
          if len(noaa) != 7:
              raise SystemExit(f'expected 7 NOAA metadata entries, found {len(noaa)}')
          base_raw = subprocess.check_output(
              ['git', 'show', 'origin/main:api-center/catalog-metadata.json'],
              text=True,
          )
          base = json.loads(base_raw)
          base['version'] = max(int(base.get('version', 0)), 6)
          base['connectors'].update(noaa)
          path.write_text(
              json.dumps(base, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Rebuild and verify deterministic contracts
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_noaa_connectors.py' -v
          git diff --check

      - name: Commit normalized generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center/catalog-metadata.json api-center/api-catalog.json api-center/api-catalog.md
          git commit -m 'chore: preserve existing catalog metadata ordering'
          git push origin HEAD:feat/noaa-official-data
