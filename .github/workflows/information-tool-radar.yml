name: Information Tool Radar

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      catalog_query:
        description: "Metadata-only catalog search query"
        required: false
        default: "孙子兵法"
        type: string
  pull_request:
    paths:
      - "api-center/information-tool-radar/**"
      - "api-center/connector-manifest.json"
      - "api-center/connectors/**"
      - "api-center/*/provider-catalog.json"
      - "api-center/*/*_task.py"
      - ".github/workflows/information-tool-radar.yml"
  push:
    branches: [main]
    paths:
      - "api-center/information-tool-radar/**"
      - "api-center/connector-manifest.json"
      - "api-center/connectors/**"
      - "api-center/*/provider-catalog.json"
      - "api-center/*/*_task.py"
      - ".github/workflows/information-tool-radar.yml"

permissions:
  contents: read

concurrency:
  group: information-tool-radar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CATALOG_QUERY: ${{ github.event.inputs.catalog_query || '孙子兵法' }}
    steps:
      - name: Checkout current ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile isolated radar
        run: |
          python -m py_compile \
            api-center/information-tool-radar/radar.py \
            api-center/information-tool-radar/radar_v2.py \
            api-center/information-tool-radar/radar_v3.py \
            api-center/information-tool-radar/radar_v4.py \
            api-center/information-tool-radar/radar_v5.py \
            api-center/information-tool-radar/incumbent_inventory.py \
            api-center/information-tool-radar/incumbent_audit.py \
            api-center/information-tool-radar/incumbent_watch.py \
            api-center/information-tool-radar/catalog_web_search.py \
            api-center/information-tool-radar/test_radar.py \
            api-center/information-tool-radar/test_incumbent_inventory.py \
            api-center/information-tool-radar/test_incumbent_watch.py \
            api-center/information-tool-radar/test_catalog_web_search.py

      - name: Run deterministic radar tests
        working-directory: api-center/information-tool-radar
        run: |
          set -o pipefail
          python test_radar.py | tee ../../information-tool-radar-unit.json

      - name: Run deterministic incumbent inventory tests
        working-directory: api-center/information-tool-radar
        run: |
          set -o pipefail
          python test_incumbent_inventory.py | tee ../../incumbent-inventory-unit.json

      - name: Run deterministic incumbent watch tests
        working-directory: api-center/information-tool-radar
        run: |
          set -o pipefail
          python test_incumbent_watch.py | tee ../../incumbent-watch-unit.json

      - name: Run deterministic catalog web search tests
        working-directory: api-center/information-tool-radar
        run: |
          set -o pipefail
          python test_catalog_web_search.py | tee ../../catalog-web-search-unit.json

      - name: Run bounded live coverage test
        run: |
          set -o pipefail
          rm -rf information-tool-radar-artifact
          python api-center/information-tool-radar/radar_v5.py \
            --config api-center/information-tool-radar/config.json \
            --output-dir information-tool-radar-artifact \
            --enforce-thresholds | tee information-tool-radar-run.json

      - name: Run controlled catalog web search
        run: |
          set -o pipefail
          python api-center/information-tool-radar/catalog_web_search.py \
            --registry api-center/information-tool-radar/catalog-domains.json \
            --query "$CATALOG_QUERY" \
            --output information-tool-radar-artifact/catalog-web-search-report.json \
            --enforce | tee catalog-web-search-run.json

      - name: Audit generic rediscovery of incumbent tools
        run: |
          set -o pipefail
          python api-center/information-tool-radar/incumbent_audit.py \
            --repo-root . \
            --candidates information-tool-radar-artifact/candidates.jsonl \
            --output-dir information-tool-radar-artifact \
            --enforce | tee incumbent-audit-run.json

      - name: Seed and monitor every incumbent tool
        run: |
          set -o pipefail
          python api-center/information-tool-radar/incumbent_watch.py \
            --repo-root . \
            --global-candidates information-tool-radar-artifact/candidates.jsonl \
            --baseline api-center/information-tool-radar/incumbent-fingerprint-baseline.json \
            --output-dir information-tool-radar-artifact \
            --enforce | tee incumbent-watch-run.json

      - name: Validate artifacts
        run: |
          python -m json.tool api-center/information-tool-radar/config.json >/dev/null
          python -m json.tool api-center/information-tool-radar/candidate.schema.json >/dev/null
          python -m json.tool api-center/information-tool-radar/catalog-domains.json >/dev/null
          python -m json.tool information-tool-radar-unit.json >/dev/null
          python -m json.tool incumbent-inventory-unit.json >/dev/null
          python -m json.tool incumbent-watch-unit.json >/dev/null
          python -m json.tool catalog-web-search-unit.json >/dev/null
          python -m json.tool information-tool-radar-run.json >/dev/null
          python -m json.tool catalog-web-search-run.json >/dev/null
          python -m json.tool incumbent-audit-run.json >/dev/null
          python -m json.tool incumbent-watch-run.json >/dev/null
          python -m json.tool information-tool-radar-artifact/coverage-report.json >/dev/null
          python -m json.tool information-tool-radar-artifact/manifest.json >/dev/null
          python -m json.tool information-tool-radar-artifact/catalog-web-search-report.json >/dev/null
          python -m json.tool information-tool-radar-artifact/incumbent-inventory.json >/dev/null
          python -m json.tool information-tool-radar-artifact/incumbent-audit-report.json >/dev/null
          python -m json.tool information-tool-radar-artifact/incumbent-watch-report.json >/dev/null
          python -m json.tool information-tool-radar-artifact/incumbent-watch-plan.json >/dev/null
          python -m json.tool information-tool-radar-artifact/incumbent-fingerprint-state.json >/dev/null
          test -s information-tool-radar-artifact/coverage-report.md
          test -s information-tool-radar-artifact/candidates.jsonl
          test -s information-tool-radar-artifact/catalog-web-search-report.json
          test -s information-tool-radar-artifact/incumbent-audit-report.md
          test -s information-tool-radar-artifact/incumbent-watch-report.md
          test -s information-tool-radar-artifact/incumbent-candidates.jsonl
          test -s information-tool-radar-artifact/combined-candidates.jsonl

      - name: Upload radar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: information-tool-radar-${{ github.run_id }}
          path: |
            information-tool-radar-unit.json
            incumbent-inventory-unit.json
            incumbent-watch-unit.json
            catalog-web-search-unit.json
            information-tool-radar-run.json
            catalog-web-search-run.json
            incumbent-audit-run.json
            incumbent-watch-run.json
            information-tool-radar-artifact/
          if-no-files-found: warn
          retention-days: 30
