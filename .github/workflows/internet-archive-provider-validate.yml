name: Validate Internet Archive Provider

on:
  pull_request:
    paths:
      - "api-center/internet-archive/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/internet-archive-provider-validate.yml"
      - ".github/workflows/internet-archive-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/internet-archive/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/internet-archive-provider-validate.yml"
      - ".github/workflows/internet-archive-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/internet-archive/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/internet-archive/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/internet-archive/internet_archive_task.py api-center/internet-archive/tests/*.py
          python -m unittest discover -s api-center/internet-archive/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/internet-archive')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'internet-archive'
          assert provider['ticket_prefix'] == '[intel-internet-archive]'
          assert provider['required_secret_environment_variable'] == ''
          assert len(ids) == 6
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['file_downloads_allowed'] is False
          assert provider['limits']['archived_page_body_fetching_allowed'] is False
          assert provider['limits']['bulk_collection_download_allowed'] is False
          assert provider['limits']['uploads_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['automatic_pagination_allowed'] is False
          print(json.dumps({'status':'PASS','operations':len(ids),'authentication':'none'}))
          PY
          git diff --check
