name: One-shot Hugging Face Token Check

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-huggingface-token-check
  cancel-in-progress: false

jobs:
  check-token:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-hf-token-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned Hugging Face client
        run: |
          python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.24.0
          python -m pip check

      - name: Validate backend HF_TOKEN without exposing it
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN', '').strip()
          if not token:
              raise RuntimeError('HF_TOKEN is not configured')

          info = HfApi(endpoint='https://huggingface.co', token=False).whoami(token=token)
          auth = info.get('auth') if isinstance(info, dict) else None
          access = auth.get('accessToken') if isinstance(auth, dict) else None
          role = access.get('role') if isinstance(access, dict) else None
          orgs = info.get('orgs') if isinstance(info, dict) else None
          safe = {
              'status': 'HF_TOKEN_CHECK_PASS',
              'authenticated': True,
              'account_name': info.get('name') if isinstance(info, dict) else None,
              'account_type': info.get('type') if isinstance(info, dict) else None,
              'token_role': role,
              'organization_count': len(orgs) if isinstance(orgs, list) else 0,
              'secret_value_exposed': False,
          }
          Path('/tmp/hf-token-safe.json').write_text(json.dumps(safe, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Publish redacted PASS
        if: success()
        run: |
          python - <<'PY' > /tmp/hf-token-comment.md
          import json
          data = json.load(open('/tmp/hf-token-safe.json', encoding='utf-8'))
          print('Hugging Face token result: `HF_TOKEN_CHECK_PASS`')
          print()
          print(f"- Account: `{data.get('account_name') or 'unknown'}`")
          print(f"- Account type: `{data.get('account_type') or 'unknown'}`")
          print(f"- Token role: `{data.get('token_role') or 'not-reported'}`")
          print(f"- Organizations: `{data.get('organization_count', 0)}`")
          print('- Secret values exposed: `false`')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@/tmp/hf-token-comment.md

      - name: Publish structured failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body='Hugging Face token result: `HF_TOKEN_CHECK_FAILED`. The token is missing, invalid, expired, or rejected by the upstream authentication endpoint. Secret values exposed: `false`.'
