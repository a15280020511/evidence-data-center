name: Managed Discovered Source

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-discovered-source
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-discovered-source]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile runtime
        run: python -m py_compile api-center/discovery/discovered_source_task.py

      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/discovery/discovered_source_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir discovered-source-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/discovery/discovered_source_task.py render \
            --output-dir discovered-source-artifacts --phase accepted > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/discovery/discovered_source_task.py render \
            --output-dir discovered-source-artifacts --phase rejected > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md

      - name: Execute one bounded request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/discovery/discovered_source_task.py execute \
            --ticket discovered-source-artifacts/ticket.json \
            --output-dir discovered-source-artifacts

      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovered-source-${{ github.event.issue.number }}-${{ github.run_id }}
          path: discovered-source-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish result
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/discovery/discovered_source_task.py render \
            --output-dir discovered-source-artifacts --phase completed \
            --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md

      - name: Enforce success
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_DISCOVERED_SOURCE_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
