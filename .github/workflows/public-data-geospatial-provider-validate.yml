name: Public Data Geospatial Provider Validation
on:
  pull_request:
    paths:
      - "api-center/public-data-geospatial/**"
      - "api-center/build_catalog*.py"
      - "api-center/api-catalog.*"
      - ".github/workflows/public-data-geospatial-*.yml"
  push:
    branches: [main, production]
    paths:
      - "api-center/public-data-geospatial/**"
      - "api-center/build_catalog*.py"
      - "api-center/api-catalog.*"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/public-data-geospatial/requirements.txt
      - run: python -m py_compile api-center/public-data-geospatial/public_data_geospatial_task.py
      - run: python -m unittest discover -s api-center/public-data-geospatial/tests -p 'test_*.py'
      - run: python api-center/build_catalog_market_search.py --check
