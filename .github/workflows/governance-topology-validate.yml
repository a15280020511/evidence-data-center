name: Validate Governance 4.x Intelligence Topology

on:
  pull_request:
    paths:
      - "CONTROL_TOPOLOGY.md"
      - "README.md"
      - "SECURITY.md"
      - "governance-compatibility.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "CONTROL_TOPOLOGY.md"
      - "README.md"
      - "SECURITY.md"
      - "governance-compatibility.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-governance-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate governance-only control topology
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          row = json.loads((root / 'governance-compatibility.json').read_text(encoding='utf-8'))
          expected = {
              'schema_version': 'governance-compatibility-v2',
              'status': 'production-control',
              'compatible_governance_versions': '>=4.1.0,<5.0.0',
              'external_controller': 'a15280020511/decision-system-governance',
              'gpts_direct_control_allowed': False,
              'sole_cross_repository_relay': 'a15280020511/decision-system-governance',
              'direct_center_to_center_calls_allowed': False,
              'runtime_cross_repository_read': False,
              'shared_business_workflows': False,
              'shared_business_secrets': False,
              'bounded_external_data_network_allowed': True,
              'public_huggingface_provider_allowed': True,
              'private_huggingface_storage_allowed': False,
              'hf_private_token_allowed': False,
              'compute_artifact_access_allowed': False,
              'expert_artifact_access_allowed': False,
              'storage_gateway_owner': 'a15280020511/decision-system-governance',
          }
          bad = [key for key, value in expected.items() if row.get(key) != value]
          assert not bad, bad
          assert row['governance_contract_sha256'] == 'a57f5cd754517a40e13bd7d15c45bc088651599dbc69e1113153e0372b73fc63'

          documents = '\n'.join(
              (root / path).read_text(encoding='utf-8')
              for path in ('README.md', 'SECURITY.md', 'CONTROL_TOPOLOGY.md')
          )
          for marker in (
              '网页 GPTs 不得直接控制本仓库',
              'a15280020511/decision-system-governance',
              '唯一外部控制器',
              '不得直接调用计算中心或专家中心',
              '私有 Hugging Face 基准库存储归治理仓库',
          ):
              assert marker in documents, marker

          violations = []
          for path in (root / '.github/workflows').glob('*.yml'):
              if path.name == 'governance-topology-validate.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              for pattern in (
                  'repository_dispatch:',
                  'uses: a15280020511/compute-simulation-center',
                  'uses: a15280020511/expert-assessment-center',
              ):
                  if pattern in text:
                      violations.append(f'{path}:{pattern}')
          assert not violations, violations

          print(json.dumps({
              'status': 'INTELLIGENCE_GOVERNANCE_TOPOLOGY_VALIDATED',
              'external_controller': row['external_controller'],
              'gpts_direct_control_allowed': False,
              'direct_center_to_center_calls_allowed': False,
              'bounded_external_data_network_allowed': True,
              'private_huggingface_storage_allowed': False,
              'public_huggingface_provider_allowed': True,
              'secret_values_exposed': False,
              'model_calls': 0,
          }, ensure_ascii=False, sort_keys=True))
          PY
          git diff --check
