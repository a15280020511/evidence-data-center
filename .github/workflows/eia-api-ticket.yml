name: Managed EIA Intelligence Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-eia-global
  cancel-in-progress: false

jobs:
  execute-eia:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-eia]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/eia/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/eia/requirements.txt
          python -m pip check

      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/eia/eia_task.py

      - name: Parse and authorize EIA ticket
        id: prepare
        continue-on-error: true
        run: python api-center/eia/eia_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir eia-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/eia/eia_task.py render --output-dir eia-artifacts --phase accepted > eia-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@eia-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/eia/eia_task.py render --output-dir eia-artifacts --phase rejected > eia-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@eia-comment.md

      - name: Execute one bounded EIA request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python api-center/eia/eia_task.py execute --ticket eia-artifacts/ticket.json --output-dir eia-artifacts

      - name: Upload EIA evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eia-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: eia-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/eia/eia_task.py render --output-dir eia-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > eia-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@eia-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_EIA_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
