name: Temporary UN Comtrade PR Integrator

on:
  pull_request:
    branches: [main]
    paths:
      - "api-center/un-comtrade/**"
      - "api-center/build_catalog_market_search.py"
      - ".github/workflows/un-comtrade-integration-pr-temp.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/un-comtrade-provider

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/un-comtrade/requirements.txt
          python -m pip check

      - name: Patch and validate integration
        run: |
          python api-center/un-comtrade/integrate_temp.py
          python -m py_compile api-center/managed_provider_runtime.py api-center/un-comtrade/un_comtrade_task.py api-center/un-comtrade/tests/*.py
          python -m unittest discover -s api-center/un-comtrade/tests -p 'test_*.py' -v
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          git diff --check

      - name: Commit non-workflow integration outputs
        run: |
          git restore .github/workflows/api-catalog-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-center/un-comtrade/un_comtrade_task.py \
            api-center/un-comtrade/provider-catalog.json \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/connector-manifest.json \
            api-center/krakend.validation.json \
            api-center/krakend.tmpl
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: integrate UN Comtrade catalog contracts"
            git push origin HEAD:feat/un-comtrade-provider
          fi
