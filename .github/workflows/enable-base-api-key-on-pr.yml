name: Enable BASE API key on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: >-
      github.event.pull_request.head.ref == 'fix/base-api-key-auth-20260804' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/base-api-key-auth-20260804
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply BASE key patch
        run: python .github/scripts/enable_base_api_key.py
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-literature-libraries/requirements.txt \
            pytest
          python -m pip check
      - name: Validate runtime and catalog
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-literature-libraries/global_literature_task.py \
            api-center/global-literature-libraries/validate_global_literature.py
          mkdir -p /tmp/base-key-validation
          PYTHONPATH=api-center/global-literature-libraries:api-center \
            python api-center/global-literature-libraries/validate_global_literature.py \
              --output /tmp/base-key-validation/registry.json
          python api-center/build_catalog_market_search.py
          python -m pytest -q api-center/tests/test_api_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          matrix=json.loads(Path('api-center/global-literature-libraries/source-access-matrix.json').read_text())
          provider=json.loads(Path('api-center/global-literature-libraries/provider-catalog.json').read_text())['providers'][0]
          receipt=json.loads(Path('/tmp/base-key-validation/registry.json').read_text())
          base=next(row for row in matrix['sources'] if row['source_id']=='base')
          assert base['credential_mode']=='required_free_key'
          assert base['credential_env']=='BASE_API_KEY'
          assert 'access_control' not in base
          assert 'BASE_API_KEY' in provider['optional_secret_environment_variables']
          base_case=next(row for row in receipt['rows'] if row['source_id']=='base')
          assert base_case['credential_names']==['BASE_API_KEY']
          assert 'apikey' in base_case['query_names']
          assert receipt['status']=='PASS'
          assert receipt['model_calls']==0
          assert receipt['network_used'] is False
          assert receipt['secret_values_exposed'] is False
          PY
          git diff --check
      - name: Commit validated non-workflow changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/global-literature-libraries/SCHOLARLY_INDEX_ACCESS.md \
            api-center/global-literature-libraries/global_literature_task.py \
            api-center/global-literature-libraries/provider-catalog.json \
            api-center/global-literature-libraries/source-access-matrix.json \
            api-center/global-literature-libraries/validate_global_literature.py
          git commit -m "fix: authenticate BASE with API key"
          git push origin HEAD:fix/base-api-key-auth-20260804
