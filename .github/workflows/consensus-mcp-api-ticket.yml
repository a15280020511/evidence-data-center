name: Managed Consensus MCP API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-consensus-mcp-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-consensus-mcp:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-consensus-mcp]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CONSENSUS_MCP_BEARER_TOKEN: ${{ secrets.CONSENSUS_MCP_BEARER_TOKEN }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/consensus-mcp/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/consensus-mcp/requirements.txt
          python -m pip check

      - name: Compile managed MCP control plane
        run: python -m py_compile api-center/consensus-mcp/consensus_mcp_task.py

      - name: Parse and authorize Consensus MCP ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/consensus-mcp/consensus_mcp_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir consensus-mcp-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/consensus-mcp/consensus_mcp_task.py render \
            --output-dir consensus-mcp-artifacts --phase accepted > consensus-mcp-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@consensus-mcp-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/consensus-mcp/consensus_mcp_task.py render \
            --output-dir consensus-mcp-artifacts --phase rejected > consensus-mcp-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@consensus-mcp-comment.md

      - name: Execute bounded read-only MCP operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/consensus-mcp/consensus_mcp_task.py execute \
            --ticket consensus-mcp-artifacts/ticket.json \
            --output-dir consensus-mcp-artifacts

      - name: Upload Consensus MCP evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consensus-mcp-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: consensus-mcp-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/consensus-mcp/consensus_mcp_task.py render \
            --output-dir consensus-mcp-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > consensus-mcp-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@consensus-mcp-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_CONSENSUS_MCP_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Consensus MCP ticket did not complete successfully."
          exit 1
