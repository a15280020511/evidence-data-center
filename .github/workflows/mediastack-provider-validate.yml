name: Validate Mediastack Provider

on:
  pull_request:
    paths:
      - "api-center/mediastack/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/mediastack-provider-validate.yml"
      - ".github/workflows/mediastack-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/mediastack/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/mediastack-provider-validate.yml"
      - ".github/workflows/mediastack-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/mediastack/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/mediastack/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/mediastack/mediastack_task.py api-center/mediastack/tests/*.py
          python -m unittest discover -s api-center/mediastack/tests -p 'test_*.py' -v

      - name: Validate fixed read-only contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/mediastack')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'mediastack'
          assert provider['required_secret_environment_variable'] == 'MEDIASTACK_API_KEY'
          assert len(provider['operations']) == 5
          assert provider['limits']['fixed_api_host'] == 'api.mediastack.com'
          assert provider['limits']['free_plan_requests_per_month'] == 100
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['article_body_fetching_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['secret_values_exposed'] is False
          print(json.dumps({'status': 'PASS', 'operations': 5}))
          PY

      - name: Update remaining catalog regression constants once
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('api-center/tests/test_capability_maximization.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '            577,\n        )\n        self.assertNotIn("qichacha", providers)',
              '            582,\n        )\n        self.assertNotIn("qichacha", providers)',
              1,
          )
          if '            "mediastack": 5,\n' not in text:
              anchor = '            "who-gho-odata": 8,\n'
              if anchor not in text:
                  raise SystemExit('Mediastack expected-count anchor missing')
              text = text.replace(anchor, anchor + '            "mediastack": 5,\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          git diff --check
          git config user.name "a15280020511"
          git config user.email "270211234+a15280020511@users.noreply.github.com"
          git add api-center/tests/test_capability_maximization.py
          if ! git diff --cached --quiet; then
            git commit -m "test: include Mediastack in capability totals"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify repository contains no credential material
        run: git diff --check
