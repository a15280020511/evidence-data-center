name: One-shot Hugging Face SDK Compatibility Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-huggingface-sdk-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-huggingface-sdk-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: fix/huggingface-list-models-sdk-20260803
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/huggingface/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/huggingface/requirements.txt
          python -m pip check

      - name: Patch actual SDK signature compatibility
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('api-center/huggingface/huggingface_task.py')
          text = path.read_text(encoding='utf-8')
          old = '''            result = list(\n                islice(\n                    api.list_models(\n                        search=text(parameters, "query", 100),\n                        author=text(parameters, "author", 96),\n                        pipeline_tag=text(parameters, "task", 80),\n                        library=text(parameters, "library", 80),\n                        sort=optional_sort(parameters, SORT_MODELS),\n                        limit=limit,\n                        gated=parameters.get("gated") if isinstance(parameters.get("gated"), bool) else None,\n                        token=False,\n                    ),\n                    limit,\n                )\n            )\n'''
          new = '''            model_kwargs = {\n                "search": text(parameters, "query", 100),\n                "author": text(parameters, "author", 96),\n                "pipeline_tag": text(parameters, "task", 80),\n                "filter": text(parameters, "library", 80),\n                "sort": optional_sort(parameters, SORT_MODELS),\n                "limit": limit,\n                "gated": parameters.get("gated")\n                if isinstance(parameters.get("gated"), bool)\n                else None,\n                "token": False,\n            }\n            result = list(\n                islice(\n                    api.list_models(\n                        **{key: value for key, value in model_kwargs.items() if value is not None}\n                    ),\n                    limit,\n                )\n            )\n'''
          if old not in text:
              raise SystemExit('expected list_models block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('api-center/huggingface/tests/test_huggingface.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nclass HuggingFaceProviderTests(unittest.TestCase):\n'
          strict = '''\n\nclass StrictModelApi:\n    def __init__(self) -> None:\n        self.kwargs = None\n\n    def list_models(\n        self,\n        *,\n        search=None,\n        author=None,\n        pipeline_tag=None,\n        filter=None,\n        sort=None,\n        limit=None,\n        gated=None,\n        token=None,\n    ):\n        self.kwargs = {\n            "search": search,\n            "author": author,\n            "pipeline_tag": pipeline_tag,\n            "filter": filter,\n            "sort": sort,\n            "limit": limit,\n            "gated": gated,\n            "token": token,\n        }\n        return iter([{"id": "open/model", "private": False}])\n'''
          if 'class StrictModelApi:' not in text:
              text = text.replace(marker, strict + marker, 1)
          anchor = '''    def test_security_operation_is_anonymous(self) -> None:\n'''
          test = '''    def test_model_library_maps_to_supported_filter_parameter(self) -> None:\n        api = StrictModelApi()\n        result, method = module.execute_operation(\n            api,\n            "models-search",\n            {"query": "bert", "library": "transformers", "limit": 1},\n            5,\n        )\n        self.assertEqual(method, "list_models")\n        self.assertEqual(len(result), 1)\n        self.assertEqual(api.kwargs["filter"], "transformers")\n        self.assertIs(api.kwargs["token"], False)\n\n'''
          if 'test_model_library_maps_to_supported_filter_parameter' not in text:
              text = text.replace(anchor, test + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify installed SDK signature and regressions
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          from huggingface_hub import HfApi
          parameters = inspect.signature(HfApi.list_models).parameters
          assert 'filter' in parameters
          assert 'library' not in parameters
          print({'status':'PASS','list_models_parameters':sorted(parameters)})
          PY
          python -m py_compile api-center/huggingface/huggingface_task.py api-center/huggingface/tests/test_huggingface.py
          python -m unittest discover -s api-center/huggingface/tests -p 'test_*.py' -v
          git diff --check

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-center/huggingface/huggingface_task.py api-center/huggingface/tests/test_huggingface.py
          git commit -m 'fix(huggingface): map model library to SDK filter'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Publish PASS
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'HUGGINGFACE_SDK_REPAIR_PASS: mapped the catalog library filter to the installed SDK `filter` parameter, omitted null optional arguments, added explicit-signature regression coverage, and passed provider tests.'
