name: Full Public-Domain Book Text Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api-center/information-tool-radar/catalog-domains.json"
      - "api-center/information-tool-radar/full_book_text_probe.py"
      - "api-center/information-tool-radar/test_full_book_text_probe.py"
      - "api-center/information-tool-radar/lawful_book_reader.py"
      - "api-center/information-tool-radar/lawful-book-sources.json"
      - ".github/workflows/full-book-text-smoke.yml"
  push:
    branches: [main]
    paths:
      - "api-center/information-tool-radar/catalog-domains.json"
      - "api-center/information-tool-radar/full_book_text_probe.py"
      - "api-center/information-tool-radar/test_full_book_text_probe.py"
      - "api-center/information-tool-radar/lawful_book_reader.py"
      - "api-center/information-tool-radar/lawful-book-sources.json"
      - ".github/workflows/full-book-text-smoke.yml"

permissions:
  contents: read

concurrency:
  group: full-public-domain-text-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: alice
            title: "Alice's Adventures in Wonderland"
            url: "https://www.gutenberg.org/cache/epub/11/pg11.txt"
          - slug: art-of-war
            title: "The Art of War"
            url: "https://www.gutenberg.org/cache/epub/132/pg132.txt"
          - slug: the-prince
            title: "The Prince"
            url: "https://www.gutenberg.org/cache/epub/1232/pg1232.txt"
    steps:
      - name: Checkout current ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile and unit test
        working-directory: api-center/information-tool-radar
        run: |
          set -o pipefail
          python -m py_compile lawful_book_reader.py full_book_text_probe.py test_full_book_text_probe.py
          python test_full_book_text_probe.py | tee ../../full-book-unit-${{ matrix.slug }}.json

      - name: Download and fully extract public-domain text
        run: |
          set -o pipefail
          out="full-book-${{ matrix.slug }}"
          mkdir -p "$out"
          python api-center/information-tool-radar/full_book_text_probe.py \
            --registry api-center/information-tool-radar/lawful-book-sources.json \
            --url "${{ matrix.url }}" \
            --rights-basis public-domain \
            --rights-note "Project Gutenberg public-domain edition: ${{ matrix.title }}" \
            --text-output "$out/full-text.txt" \
            --report-output "$out/report.json" \
            --max-chars 5000000 \
            --enforce | tee "$out/run.json"

      - name: Verify complete-text evidence
        env:
          REPORT: full-book-${{ matrix.slug }}/report.json
          TEXT: full-book-${{ matrix.slug }}/full-text.txt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT']).read_text(encoding='utf-8'))
          text = Path(os.environ['TEXT']).read_text(encoding='utf-8')
          assert report['status'] == 'pass', report
          assert report['content_complete'] is True, report
          assert report['content_truncated'] is False, report
          assert report['content_chars'] == len(text), (report['content_chars'], len(text))
          assert len(text) > 10000, len(text)
          assert report['content_sha256']
          PY

      - name: Upload complete public-domain text evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-public-domain-text-${{ matrix.slug }}-${{ github.run_id }}
          path: |
            full-book-unit-${{ matrix.slug }}.json
            full-book-${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 7
