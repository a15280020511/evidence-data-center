name: Validate Global Knowledge Archives

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/global-knowledge-archives-validate.yml'

permissions:
  contents: read

concurrency:
  group: validate-global-knowledge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-generated-catalogs:
    if: github.event.pull_request.number == 743
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/retain-google-books-bhl-only
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-center/requirements.txt
      - name: Regenerate and commit aggregate catalogs
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check
          python api-center/build_catalog_market_search.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-center/api-catalog.json api-center/api-catalog.md
          if git diff --cached --quiet; then
            echo 'No generated catalog changes detected.'
            exit 0
          fi
          git commit -m 'chore: regenerate API catalog after source reduction'
          git push origin HEAD:fix/retain-google-books-bhl-only
