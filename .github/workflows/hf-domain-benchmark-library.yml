name: Validate Domain Benchmark Control Library

on:
  pull_request:
    paths:
      - "api-center/huggingface/domain_benchmark_store.py"
      - "api-center/huggingface/domain-benchmark-library/**"
      - "api-center/huggingface/tests/test_domain_benchmark_store.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/hf-domain-benchmark-library.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/domain_benchmark_store.py"
      - "api-center/huggingface/domain-benchmark-library/**"
      - "api-center/huggingface/tests/test_domain_benchmark_store.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/hf-domain-benchmark-library.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-domain-benchmark-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-control-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_TOKEN: ""
      HF_DOMAIN_BENCHMARK_DATASET_REPO: ""
      HF_CLOUDFLARE_DATASET_REPO: ""
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements.txt

      - name: Install pinned dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/huggingface/requirements.txt
          python -m pip check

      - name: Compile and run deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile api-center/huggingface/domain_benchmark_store.py
          python -m unittest api-center/huggingface/tests/test_domain_benchmark_store.py -v
          python api-center/huggingface/domain_benchmark_store.py validate \
            --output-dir domain-benchmark-validation
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('domain-benchmark-validation/bundle-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 'domain-benchmark-control-bundle-v2'
          assert manifest['file_count'] == 120
          assert manifest['domain_count'] == 8
          assert manifest['asset_library_count'] == 12
          assert manifest['material_directories_per_domain'] == 12
          assert len(manifest['bundle_sha256']) == 64
          assert manifest['secret_values_exposed'] is False
          assert manifest['model_calls'] == 0
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: domain-benchmark-control-validation-${{ github.run_id }}
          path: domain-benchmark-validation/
          if-no-files-found: error
          retention-days: 30
