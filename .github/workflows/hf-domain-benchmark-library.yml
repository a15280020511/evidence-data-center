name: Validate and Sync HF Domain Benchmark Library

on:
  pull_request:
    paths:
      - "api-center/huggingface/domain_benchmark_store.py"
      - "api-center/huggingface/domain-benchmark-library/**"
      - "api-center/huggingface/tests/test_domain_benchmark_store.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/hf-domain-benchmark-library.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/domain_benchmark_store.py"
      - "api-center/huggingface/domain-benchmark-library/**"
      - "api-center/huggingface/tests/test_domain_benchmark_store.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/hf-domain-benchmark-library.yml"
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hf-domain-benchmark-library-${{ github.event_name }}-${{ github.ref }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-control-plane:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, '[sync-hf-domain-benchmark]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements.txt

      - name: Install pinned dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/huggingface/requirements.txt
          python -m pip check

      - name: Compile and run deterministic validation
        run: |
          set -euo pipefail
          python -m py_compile api-center/huggingface/domain_benchmark_store.py
          python -m unittest api-center/huggingface/tests/test_domain_benchmark_store.py -v
          python api-center/huggingface/domain_benchmark_store.py validate --output-dir domain-benchmark-validation
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('domain-benchmark-validation/bundle-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 'domain-benchmark-control-bundle-v1'
          assert manifest['file_count'] == 19
          assert len(manifest['bundle_sha256']) == 64
          assert manifest['secret_values_exposed'] is False
          assert manifest['model_calls'] == 0
          PY

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-domain-benchmark-validation-${{ github.run_id }}
          path: domain-benchmark-validation/
          if-no-files-found: error
          retention-days: 30

  sync-private-library:
    if: >-
      always() &&
      needs.validate-control-plane.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.actor == github.repository_owner &&
        startsWith(github.event.issue.title, '[sync-hf-domain-benchmark]')))
    needs: [validate-control-plane]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DOMAIN_BENCHMARK_DATASET_REPO: ${{ vars.HF_DOMAIN_BENCHMARK_DATASET_REPO }}
      HF_CLOUDFLARE_DATASET_REPO: ${{ vars.HF_CLOUDFLARE_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements.txt

      - name: Install pinned dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/huggingface/requirements.txt
          python -m pip check

      - name: Synchronize private domain benchmark control plane
        id: sync
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python api-center/huggingface/domain_benchmark_store.py sync --output-dir hf-domain-benchmark-receipt

      - name: Render connection receipt
        if: always()
        run: |
          python api-center/huggingface/domain_benchmark_store.py render --output-dir hf-domain-benchmark-receipt > hf-domain-benchmark-comment.md || true
          cat hf-domain-benchmark-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish issue connection receipt
        if: always() && github.event_name == 'issues'
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@hf-domain-benchmark-comment.md

      - name: Upload connection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-domain-benchmark-connection-${{ github.run_id }}
          path: hf-domain-benchmark-receipt/
          if-no-files-found: error
          retention-days: 90

      - name: Mark synchronization failure
        if: always() && steps.sync.outcome != 'success'
        run: exit 1
