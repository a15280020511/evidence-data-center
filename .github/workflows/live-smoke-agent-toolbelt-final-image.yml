name: Live Smoke Agent Toolbelt Final Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/live-smoke-agent-toolbelt-final-image.yml"

permissions:
  contents: read

concurrency:
  group: live-smoke-agent-toolbelt-final-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-image:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENT_TOOLBELT_KEY: ${{ secrets.AGENT_TOOLBELT_KEY }}
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test metadata stripping with generated RGB PNG
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +x
          mkdir -p agent-toolbelt-final-image
          python - <<'PY'
          import base64, binascii, hashlib, json, os, struct, sys, time, urllib.error, urllib.request, zlib
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = 'https://www.agenttoolbelt.live'
          KEY = os.environ.get('AGENT_TOOLBELT_KEY', '').strip()
          OUT = Path('agent-toolbelt-final-image')

          def png_chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          width = height = 2
          raw_rows = b''.join([b'\x00' + bytes([255, 0, 0]) * width for _ in range(height)])
          png = (
              b'\x89PNG\r\n\x1a\n'
              + png_chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              + png_chunk(b'IDAT', zlib.compress(raw_rows))
              + png_chunk(b'IEND', b'')
          )
          png_b64 = base64.b64encode(png).decode('ascii')
          body = {'image': png_b64, 'format': 'png', 'quality': 90}

          report = {
              'schema_version': 'agent-toolbelt-final-image-live-v1',
              'tested_at': datetime.now(timezone.utc).isoformat(),
              'credential_present': bool(KEY),
              'credential_prefix_valid': KEY.startswith('atb_'),
              'secret_values_exposed': False,
              'generated_input': {
                  'format': 'png',
                  'width': width,
                  'height': height,
                  'color_type': 'RGB',
                  'size_bytes': len(png),
                  'sha256': hashlib.sha256(png).hexdigest(),
              },
          }

          if not KEY:
              report.update({'status': 'FAIL', 'safe_error': 'missing AGENT_TOOLBELT_KEY'})
              OUT.joinpath('summary.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              sys.exit(1)

          time.sleep(65)
          data = json.dumps(body, separators=(',', ':')).encode('utf-8')
          req = urllib.request.Request(
              f'{BASE}/api/tools/image-metadata-stripper',
              data=data,
              method='POST',
              headers={
                  'Authorization': f'Bearer {KEY}',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'evidence-data-center-agent-toolbelt-final-image/1.0',
              },
          )
          started = time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  raw = response.read(20_000_000)
                  status = response.status
                  payload = json.loads(raw.decode('utf-8'))
          except urllib.error.HTTPError as exc:
              raw = exc.read(1_000_000)
              status = exc.code
              try:
                  payload = json.loads(raw.decode('utf-8', errors='replace'))
              except Exception:
                  payload = {'error': raw.decode('utf-8', errors='replace')[:1000]}
          elapsed_ms = round((time.monotonic() - started) * 1000)

          success = status == 200 and isinstance(payload, dict) and payload.get('success') is True
          result = payload.get('result') if isinstance(payload, dict) else None
          original = result.get('original') if isinstance(result, dict) else {}
          output = result.get('output') if isinstance(result, dict) else {}
          report.update({
              'http_status': status,
              'success': success,
              'elapsed_ms': elapsed_ms,
              'reported_duration_ms': payload.get('durationMs') if isinstance(payload, dict) else None,
              'cached': payload.get('cached') if isinstance(payload, dict) else None,
              'version': payload.get('version') if isinstance(payload, dict) else None,
              'response_bytes': len(raw),
              'result_keys': sorted(result.keys()) if isinstance(result, dict) else [],
              'original_format': original.get('format') if isinstance(original, dict) else None,
              'original_width': original.get('width') if isinstance(original, dict) else None,
              'original_height': original.get('height') if isinstance(original, dict) else None,
              'output_format': result.get('outputFormat') if isinstance(result, dict) else None,
              'output_size_bytes': output.get('sizeBytes') if isinstance(output, dict) else None,
              'metadata_stripped': result.get('metadataStripped') if isinstance(result, dict) else None,
              'stripped_field_count': len(result.get('strippedFields') or []) if isinstance(result, dict) else None,
              'safe_error': None if success else str((payload.get('message') or payload.get('error') or 'request failed') if isinstance(payload, dict) else 'invalid response')[:1000],
              'status': 'PASS' if success else 'FAIL',
          })
          OUT.joinpath('summary.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, allow_nan=False) + '\n', encoding='utf-8')
          print(json.dumps({'status': report['status'], 'http_status': status, 'original_format': report['original_format'], 'output_format': report['output_format'], 'secret_values_exposed': False}))
          sys.exit(0 if success else 1)
          PY

      - name: Verify no credential entered evidence
        if: always()
        shell: bash
        run: |
          set +x
          test -f agent-toolbelt-final-image/summary.json
          if [ -n "${AGENT_TOOLBELT_KEY:-}" ] && grep -R -Fq -- "$AGENT_TOOLBELT_KEY" agent-toolbelt-final-image; then
            echo "Credential value found in evidence"
            exit 1
          fi

      - name: Upload final image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-toolbelt-final-image-${{ github.run_id }}
          path: agent-toolbelt-final-image/
          if-no-files-found: error
          retention-days: 7

      - name: Mark failed final image test
        if: steps.test.outcome != 'success'
        run: exit 1
