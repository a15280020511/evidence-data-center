name: Validate Agent Toolbelt Provider

on:
  pull_request:
    paths:
      - "api-center/agent-toolbelt/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/agent-toolbelt-provider-validate.yml"
      - ".github/workflows/agent-toolbelt-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/agent-toolbelt/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/agent-toolbelt-provider-validate.yml"
      - ".github/workflows/agent-toolbelt-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/agent-toolbelt/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/agent-toolbelt/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/build_catalog.py api-center/managed_provider_runtime.py api-center/agent-toolbelt/agent_toolbelt_task.py api-center/agent-toolbelt/tests/*.py
          python -m unittest discover -s api-center/agent-toolbelt/tests -p 'test_*.py' -v

      - name: Validate fixed contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          removed_stock_tools = {
              'stock-thesis',
              'earnings-analysis',
              'insider-signal',
              'valuation-snapshot',
              'bear-vs-bull',
              'compare-stocks',
              'moat-analysis',
              'watchlist-scan',
          }
          root = Path('api-center/agent-toolbelt')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          operation_ids = {row['operation_id'] for row in provider['operations']}
          schema_ids = set(schema['properties']['operation']['enum'])
          assert provider['provider_id'] == 'agent-toolbelt'
          assert provider['required_secret_environment_variable'] == 'AGENT_TOOLBELT_KEY'
          assert len(operation_ids) == 21
          assert operation_ids == schema_ids
          assert not removed_stock_tools.intersection(operation_ids)
          assert 'token-counter' in operation_ids
          assert 'web-summarizer' in operation_ids
          assert 'context-window-packer' in operation_ids
          assert 'create-watchlist' not in operation_ids
          assert provider['limits']['fixed_api_host'] == 'www.agenttoolbelt.live'
          assert provider['limits']['fixed_upstream_tool_count'] == 20
          assert provider['limits']['stock_research_tools_allowed'] is False
          assert provider['limits']['us_equity_research_allowed'] is False
          assert provider['limits']['arbitrary_tool_names_allowed'] is False
          assert provider['limits']['watchlist_crud_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['trading_or_order_execution_allowed'] is False
          assert provider['limits']['secret_values_exposed'] is False
          print(json.dumps({
              'status': 'PASS',
              'operations': len(operation_ids),
              'upstream_tools': provider['limits']['fixed_upstream_tool_count'],
              'removed_stock_tools': sorted(removed_stock_tools),
          }))
          PY

      - name: Verify repository contains no credential material
        run: |
          git diff --check
          ! git grep -nE 'atb_[A-Za-z0-9_-]{12,}' -- ':!api-center/agent-toolbelt/tests/**'
