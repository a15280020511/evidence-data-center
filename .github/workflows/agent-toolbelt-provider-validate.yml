name: Migrate Agent Toolbelt General Tools Only

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - ".github/workflows/agent-toolbelt-provider-validate.yml"
      - ".github/scripts/remove_agent_toolbelt_stock_tools.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install migration and validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/agent-toolbelt/requirements.txt
          python -m pip check

      - name: Remove unsupported stock tools and rebuild contracts
        run: |
          set -euo pipefail
          python .github/scripts/remove_agent_toolbelt_stock_tools.py
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py

      - name: Validate migrated contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_catalog.py \
            api-center/build_catalog_market_search.py \
            api-center/managed_provider_runtime.py \
            api-center/agent-toolbelt/agent_toolbelt_task.py \
            api-center/agent-toolbelt/tests/*.py \
            api-center/tests/*.py
          python -m unittest discover -s api-center/agent-toolbelt/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          git diff --check

      - name: Commit API contracts only
        run: |
          set -euo pipefail
          git config user.name "a15280020511"
          git config user.email "270211234+a15280020511@users.noreply.github.com"
          git add api-center
          git commit -m "refactor: remove unsupported Agent Toolbelt stock tools"
          git push origin HEAD:${{ github.head_ref }}
