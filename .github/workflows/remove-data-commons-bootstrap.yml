name: Bootstrap retired provider removal

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-retired-provider-removal
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] remove-data-commons'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: remove/data-commons-20260801
    steps:
      - name: Checkout removal branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Apply removal and validate
        shell: bash
        run: |
          set -euo pipefail
          python maintenance/remove_data_commons.py
          python - <<'PY'
          from pathlib import Path

          capability_test = Path('api-center/tests/test_capability_maximization.py')
          text = capability_test.read_text(encoding='utf-8')
          old = '            150,\n'
          if text.count(old) != 1:
              raise SystemExit('managed operation count anchor not found exactly once')
          capability_test.write_text(
              text.replace(old, '            145,\n', 1),
              encoding='utf-8',
          )

          workflow = Path('.github/workflows/google-cloud-api-ticket.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '          service_account.pop("data_commons_api_key", None)\n'
          if text.count(old) != 1:
              raise SystemExit('retired credential cleanup anchor not found exactly once')
          workflow.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/google-cloud/requirements.txt \
            -r requirements-dev.txt
          python -m pip check
          python api-center/build_catalog_market_search.py
          python -m py_compile \
            api-center/google-cloud/google_cloud_task.py \
            api-center/google-cloud/unified_google_credentials.py \
            api-center/google-cloud/tests/*.py \
            api-center/tests/*.py
          python -m unittest discover -s api-center/google-cloud/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          test ! -e api-center/data-commons
          test ! -e .github/workflows/data-commons-api-ticket.yml
          test ! -e .github/workflows/data-commons-provider-validate.yml
          if git grep -n -i -E 'data[ _-]*commons|GOOGLE_DATA_COMMONS_API_KEY' -- ':!*.lock'; then
            echo 'retired provider reference remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit removal branch
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(api-center): remove Data Commons provider'
          git push origin HEAD:${TARGET_BRANCH}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish receipt
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DATA_COMMONS_REMOVAL_COMPLETED branch=${TARGET_BRANCH} commit=${{ steps.commit.outputs.sha }} tests=passed model_calls=0"

      - name: Publish failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DATA_COMMONS_REMOVAL_FAILED branch=${TARGET_BRANCH} run=${GITHUB_RUN_ID} model_calls=0"
