name: One-shot Probe Free Search Capabilities

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-probe-free-search-capabilities.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      BAIDU_AI_CLOUD_API_KEY: ${{ secrets.BAIDU_AI_CLOUD_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe bounded read-only endpoints
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          serp = os.environ.get("SERPAPI_API_KEY", "").strip()
          baidu = os.environ.get("BAIDU_AI_CLOUD_API_KEY", "").strip()
          if not serp or not baidu:
              raise SystemExit("required repository Secrets are missing")

          def request_json(url: str, query: dict[str, object], headers: dict[str, str]) -> tuple[dict, dict]:
              encoded = urllib.parse.urlencode(query)
              req = urllib.request.Request(
                  f"{url}?{encoded}" if encoded else url,
                  headers={"Accept": "application/json", "User-Agent": "evidence-center-free-capability-probe/1", **headers},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status = int(response.status)
                      raw = response.read(2_000_001)
              except urllib.error.HTTPError as exc:
                  status = int(exc.code)
                  raw = exc.read(2_000_001)
              if len(raw) > 2_000_000:
                  raise RuntimeError("response too large")
              try:
                  payload = json.loads(raw.decode("utf-8"))
              except Exception as exc:
                  raise RuntimeError(f"invalid JSON from {urllib.parse.urlsplit(url).netloc}: {type(exc).__name__}") from exc
              if not 200 <= status < 300:
                  message = str(payload.get("error") or payload.get("message") or payload)[:300]
                  raise RuntimeError(f"HTTP {status} from {urllib.parse.urlsplit(url).netloc}: {message}")
              if isinstance(payload, dict) and str(payload.get("code", "0")) not in {"0", "", "None"}:
                  raise RuntimeError(f"business error from {urllib.parse.urlsplit(url).netloc}: {str(payload.get('message'))[:300]}")
              return payload, {
                  "host": urllib.parse.urlsplit(url).netloc,
                  "path": urllib.parse.urlsplit(url).path,
                  "http_status": status,
                  "response_bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }

          receipt: dict[str, object] = {
              "schema_version": "free-search-capability-probe-v1",
              "secret_values_exposed": False,
              "model_calls": 0,
              "paid_fallback_authorized": False,
              "probes": {},
          }

          google_web, meta = request_json(
              "https://serpapi.com/search",
              {"engine": "google", "q": "福州市人民政府 政务公开", "hl": "zh-cn", "gl": "cn", "location": "Fuzhou, Fujian, China", "output": "json", "async": "false", "api_key": serp},
              {},
          )
          if str((google_web.get("search_metadata") or {}).get("status", "")).lower() != "success":
              raise RuntimeError("SerpAPI Google web status is not Success")
          receipt["probes"]["serpapi-google-web-zh-cn"] = {**meta, "result_count": len(google_web.get("organic_results") or [])}

          google_news, meta = request_json(
              "https://serpapi.com/search",
              {"engine": "google_news", "q": "福州 政务", "hl": "zh-cn", "gl": "cn", "output": "json", "async": "false", "api_key": serp},
              {},
          )
          if str((google_news.get("search_metadata") or {}).get("status", "")).lower() != "success":
              raise RuntimeError("SerpAPI Google News status is not Success")
          receipt["probes"]["serpapi-google-news-zh-cn"] = {**meta, "result_count": len(google_news.get("news_results") or [])}

          bearer = {"Authorization": f"Bearer {baidu}"}
          lemma_list, meta = request_json(
              "https://appbuilder.baidu.com/v2/baike/lemma/get_list_by_title",
              {"lemma_title": "福州", "top_k": 3},
              bearer,
          )
          rows = lemma_list.get("result") if isinstance(lemma_list, dict) else None
          if not isinstance(rows, list) or not rows:
              raise RuntimeError("Baidu Baike lemma list is empty")
          receipt["probes"]["baidu-baike-lemma-list"] = {**meta, "result_count": len(rows)}

          lemma_content, meta = request_json(
              "https://appbuilder.baidu.com/v2/baike/lemma/get_content",
              {"search_type": "lemmaTitle", "search_key": "福州"},
              bearer,
          )
          result = lemma_content.get("result") if isinstance(lemma_content, dict) else None
          if not isinstance(result, dict) or not result.get("lemma_title"):
              raise RuntimeError("Baidu Baike content result is invalid")
          receipt["probes"]["baidu-baike-content"] = {**meta, "lemma_id_present": bool(result.get("lemma_id"))}

          starmaps, meta = request_json(
              "https://qianfan.baidubce.com/v2/tools/baike/starmap/get_starmap_by_title",
              {"starmap_title": "节日", "page": 1},
              bearer,
          )
          maps = starmaps.get("list") if isinstance(starmaps, dict) else None
          if not isinstance(maps, list) or not maps or not maps[0].get("encodeId"):
              raise RuntimeError("Baidu Baike starmap list is empty")
          receipt["probes"]["baidu-baike-starmap-list"] = {**meta, "result_count": len(maps)}

          _, detail_meta = request_json(
              "https://qianfan.baidubce.com/v2/tools/baike/starmap/get_starmap_by_id",
              {"starmap_id": str(maps[0]["encodeId"]), "page": 1},
              bearer,
          )
          receipt["probes"]["baidu-baike-starmap-detail"] = detail_meta

          Path("probe-artifact").mkdir(exist_ok=True)
          Path("probe-artifact/receipt.json").write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status": "PASS", "probe_count": len(receipt["probes"]), "secret_values_exposed": False}))
          PY
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: free-search-capability-probe-${{ github.run_id }}
          path: probe-artifact/
          if-no-files-found: error
          retention-days: 14
