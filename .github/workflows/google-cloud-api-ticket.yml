name: Managed BigQuery and Earth Engine API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-gcp-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-google-cloud-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-gcp]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
      BIGQUERY_ALLOWED_PUBLIC_PROJECTS: ${{ vars.BIGQUERY_ALLOWED_PUBLIC_PROJECTS }},patents-public-data
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/google-cloud/requirements.txt

      - name: Install pinned Google Cloud dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/google-cloud/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: |
          python -m py_compile \
            api-center/google-cloud/google_cloud_task.py \
            api-center/google-cloud/unified_google_credentials.py \
            api-center/google-cloud/duplicate_guard.py

      - name: Parse and authorize Google Cloud ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/google-cloud/google_cloud_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir gcp-artifacts

      - name: Reject duplicate task or ticket
        id: duplicate
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/google-cloud/duplicate_guard.py \
            --ticket gcp-artifacts/ticket.json \
            --status gcp-artifacts/ticket-status.json

      - name: Comment accepted ticket
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success'
        run: |
          python api-center/google-cloud/google_cloud_task.py render \
            --output-dir gcp-artifacts \
            --phase accepted > gcp-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@gcp-comment.md

      - name: Comment rejected ticket
        if: >-
          steps.prepare.outputs.accepted != 'true' ||
          steps.duplicate.outcome != 'success'
        run: |
          python api-center/google-cloud/google_cloud_task.py render \
            --output-dir gcp-artifacts \
            --phase rejected > gcp-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@gcp-comment.md

      - name: Validate and expand shared Google service account
        id: credentials
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from collections.abc import Mapping
          from pathlib import Path

          secret_name = "GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON"
          raw = str(os.getenv(secret_name) or "").strip()
          if not raw:
              raise RuntimeError(f"missing repository Secret {secret_name}")
          try:
              value = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise RuntimeError(f"{secret_name} is not valid JSON") from exc
          if not isinstance(value, Mapping):
              raise RuntimeError(f"{secret_name} must contain a JSON object")
          nested = value.get("service_account")
          service_account = dict(nested) if isinstance(nested, Mapping) else dict(value)
          required = {
              "type", "project_id", "private_key_id", "private_key",
              "client_email", "token_uri",
          }
          missing = sorted(required - set(service_account))
          if missing:
              raise RuntimeError(f"{secret_name} is missing service-account fields: {missing}")
          if str(service_account.get("type") or "") != "service_account":
              raise RuntimeError(f"{secret_name}.type must be service_account")
          encoded = json.dumps(service_account, ensure_ascii=False, separators=(",", ":"))
          github_env = Path(os.environ["GITHUB_ENV"])
          for name in ("BIGQUERY_SERVICE_ACCOUNT_JSON", "EARTH_ENGINE_SERVICE_ACCOUNT_JSON"):
              marker = f"GOOGLE_SERVICE_ACCOUNT_{name}_EOF"
              with github_env.open("a", encoding="utf-8") as handle:
                  handle.write(f"{name}<<{marker}\n{encoded}\n{marker}\n")
          PY

      - name: Create structured unified credential block
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success' &&
          steps.credentials.outcome != 'success'
        run: |
          python api-center/google-cloud/unified_google_credentials.py \
            --blocked-target gcp \
            --ticket gcp-artifacts/ticket.json \
            --output-dir gcp-artifacts

      - name: Execute read-only managed provider operation
        id: execute
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success' &&
          steps.credentials.outcome == 'success'
        continue-on-error: true
        run: |
          python api-center/google-cloud/google_cloud_task.py execute \
            --ticket gcp-artifacts/ticket.json \
            --output-dir gcp-artifacts

      - name: Upload Google Cloud API evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: google-cloud-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: gcp-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: >-
          always() &&
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/google-cloud/google_cloud_task.py render \
            --output-dir gcp-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > gcp-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@gcp-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.duplicate.outcome != 'success' ||
           steps.credentials.outcome != 'success' ||
           steps.execute.outputs.status != 'API_GCP_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Google Cloud API ticket did not complete successfully."
          exit 1
