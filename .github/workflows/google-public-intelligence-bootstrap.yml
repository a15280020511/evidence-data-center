name: Google Public Intelligence Bootstrap

on:
  pull_request:
    paths:
      - '.bootstrap/apply_google_public_intelligence.py'
      - '.github/workflows/google-public-intelligence-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: google-public-intelligence-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/google-public-intelligence
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/google-public-intelligence/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/google-public-intelligence/requirements.txt
          python -m pip check
      - name: Apply integration and regenerate authoritative catalogs
        run: python .bootstrap/apply_google_public_intelligence.py
      - name: Verify source and contracts
        run: |
          python -m py_compile api-center/google-public-intelligence/google_public_intelligence_task.py
          PYTHONPATH=api-center/google-public-intelligence:api-center python -m unittest discover -s api-center/google-public-intelligence/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          git diff --check
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrate Google public intelligence APIs'
          git push origin HEAD:feat/google-public-intelligence
