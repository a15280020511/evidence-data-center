name: Validate China Enterprise Social Controls

on:
  pull_request:
    paths:
      - "api-center/huggingface/numeric-baseline-library/china-enterprise-soe-operational-domain-requirements.json"
      - "api-center/huggingface/numeric-baseline-library/china-social-intelligence-codebook.json"
      - "api-center/cloudflare/numeric-compiler/china-social-platform-access-policy.json"
      - "api-center/cloudflare/numeric-compiler/cloudflare-ai-routing-policy.json"
      - "api-center/cloudflare/numeric-compiler/cloudflare-daily-harvest-policy.json"
      - "api-center/cloudflare/numeric-compiler/china_intelligence_controls.py"
      - "api-center/cloudflare/numeric-compiler/china_intelligence_quota_consistency.py"
      - "api-center/cloudflare/numeric-compiler/tests/test_china_intelligence_controls.py"
      - "api-center/cloudflare/numeric-compiler/tests/test_china_intelligence_quota_consistency.py"
      - ".github/workflows/china-enterprise-social-controls.yml"
      - ".github/workflows/cloudflare-cn-daily-harvest.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/numeric-baseline-library/china-enterprise-soe-operational-domain-requirements.json"
      - "api-center/huggingface/numeric-baseline-library/china-social-intelligence-codebook.json"
      - "api-center/cloudflare/numeric-compiler/china-social-platform-access-policy.json"
      - "api-center/cloudflare/numeric-compiler/cloudflare-ai-routing-policy.json"
      - "api-center/cloudflare/numeric-compiler/cloudflare-daily-harvest-policy.json"
      - "api-center/cloudflare/numeric-compiler/china_intelligence_controls.py"
      - "api-center/cloudflare/numeric-compiler/china_intelligence_quota_consistency.py"
      - "api-center/cloudflare/numeric-compiler/tests/test_china_intelligence_controls.py"
      - "api-center/cloudflare/numeric-compiler/tests/test_china_intelligence_quota_consistency.py"
      - ".github/workflows/china-enterprise-social-controls.yml"
      - ".github/workflows/cloudflare-cn-daily-harvest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-enterprise-social-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile and run control tests
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/cloudflare/numeric-compiler/china_intelligence_controls.py \
            api-center/cloudflare/numeric-compiler/china_intelligence_quota_consistency.py \
            api-center/cloudflare/numeric-compiler/tests/test_china_intelligence_controls.py \
            api-center/cloudflare/numeric-compiler/tests/test_china_intelligence_quota_consistency.py
          python -m unittest discover \
            -s api-center/cloudflare/numeric-compiler/tests \
            -p 'test_china_intelligence_*.py' -v
          python api-center/cloudflare/numeric-compiler/china_intelligence_controls.py \
            validate --output-dir china-enterprise-social-validation
          python api-center/cloudflare/numeric-compiler/china_intelligence_quota_consistency.py \
            validate --output-dir china-enterprise-social-validation
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('china-enterprise-social-validation/validation-receipt.json').read_text(encoding='utf-8')
          )
          quota = json.loads(
              Path('china-enterprise-social-validation/quota-consistency-receipt.json').read_text(encoding='utf-8')
          )
          assert receipt['status'] == 'CHINA_ENTERPRISE_SOCIAL_DAILY_CONTROLS_VALIDATED'
          assert receipt['enterprise_domain_count'] == 21
          assert receipt['social_platform_count'] == 5
          assert receipt['social_metric_count'] == 70
          assert receipt['daily_neuron_budget'] == 9800
          assert receipt['daily_browser_second_budget'] == 570
          assert receipt['model_calls'] == 0
          assert receipt['paid_calls'] == 0
          assert receipt['raw_text_persisted'] is False
          assert receipt['numeric_huggingface_payload_only'] is True
          assert receipt['direct_center_connection_allowed'] is False
          assert quota['status'] == 'CLOUDFLARE_DAILY_QUOTA_POLICIES_CONSISTENT'
          assert quota['utilization_soft_stop'] == 0.98
          assert quota['hard_stop_on_429'] is True
          assert quota['next_day_resume'] is True
          assert quota['external_model_enabled_by_default'] is False
          assert quota['automatic_paid_fallback_allowed'] is False
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: china-enterprise-social-controls-${{ github.run_id }}
          path: china-enterprise-social-validation/
          if-no-files-found: error
          retention-days: 30
