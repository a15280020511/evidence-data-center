name: Managed Evidence Standardization

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-evidence-standardization-global
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-evidence-standardize]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt
      - name: Install pinned core dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check
      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/evidence-standardization/evidence_standardization_task.py
      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: python api-center/evidence-standardization/evidence_standardization_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir evidence-standardization-artifacts
      - name: Publish acceptance or rejection
        if: always()
        run: |
          phase=rejected
          if [[ "${{ steps.prepare.outputs.accepted }}" == "true" ]]; then phase=accepted; fi
          python api-center/evidence-standardization/evidence_standardization_task.py render --output-dir evidence-standardization-artifacts --phase "$phase" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Execute one bounded local operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/evidence-standardization/evidence_standardization_task.py execute --ticket evidence-standardization-artifacts/ticket.json --output-dir evidence-standardization-artifacts
      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-standardization-${{ github.event.issue.number }}-${{ github.run_id }}
          path: evidence-standardization-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified result
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/evidence-standardization/evidence_standardization_task.py render --output-dir evidence-standardization-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Fail closed
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_EVIDENCE_STANDARDIZATION_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
