name: Validate AISstream Provider

on:
  pull_request:
    paths:
      - "api-center/aisstream/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/aisstream-provider-validate.yml"
      - ".github/workflows/aisstream-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/aisstream/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/aisstream-provider-validate.yml"
      - ".github/workflows/aisstream-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/aisstream/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/aisstream/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/aisstream/aisstream_task.py api-center/aisstream/tests/*.py
          python -m unittest discover -s api-center/aisstream/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/aisstream')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'aisstream'
          assert provider['ticket_prefix'] == '[intel-aisstream]'
          assert provider['required_secret_environment_variable'] == 'AISSTREAM_API_KEY'
          assert len(ids) == 4
          assert provider['limits']['fixed_api_host'] == 'stream.aisstream.io'
          assert provider['limits']['connections_per_ticket_max'] == 1
          assert provider['limits']['stream_duration_seconds_max'] == 30
          assert provider['limits']['worldwide_subscription_allowed'] is False
          assert provider['limits']['client_supplied_credentials_allowed'] is False
          assert provider['limits']['background_streaming_allowed'] is False
          assert provider['limits']['stream_relay_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          print(json.dumps({'status':'PASS','operations':len(ids),'authentication':'AISSTREAM_API_KEY'}))
          PY
          git diff --check
