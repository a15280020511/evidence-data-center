name: Sync Open Data Aggregator Catalog

on:
  push:
    branches: [feat/open-data-aggregators-20260803]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-open-data-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch catalog registry and extensible contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('api-center/build_catalog_market_search.py')
          text=path.read_text()
          text=text.replace('OPENBB_FREE_CATALOG = HERE / "openbb-free/provider-catalog.json"\n','OPENBB_FREE_CATALOG = HERE / "openbb-free/provider-catalog.json"\nOPEN_DATA_AGGREGATORS_CATALOG = HERE / "open-data-aggregators/provider-catalog.json"\n')
          text=text.replace('    "openbb-free": 7,\n','    "openbb-free": 7,\n    "open-data-aggregators": 13,\n')
          text=text.replace('    OPENBB_FREE_CATALOG,\n)','    OPENBB_FREE_CATALOG,\n    OPEN_DATA_AGGREGATORS_CATALOG,\n)')
          text=text.replace('        "openbb-free/provider-catalog.json",\n','        "openbb-free/provider-catalog.json",\n        "open-data-aggregators/provider-catalog.json",\n')
          path.write_text(text)

          path=Path('api-center/tests/test_api_catalog.py')
          text=path.read_text()
          text=text.replace('    "openbb-free": 7,\n','    "openbb-free": 7,\n    "open-data-aggregators": 13,\n')
          text=text.replace('catalog["managed_provider_count"], 54','catalog["managed_provider_count"], 55')
          text=text.replace('catalog["enabled_managed_provider_count"], 54','catalog["enabled_managed_provider_count"], 55')
          text=text.replace('catalog["managed_operation_count"], 618','catalog["managed_operation_count"], 631')
          path.write_text(text)

          path=Path('.github/workflows/openbb-free-validate.yml')
          text=path.read_text()
          text=text.replace("          assert catalog['managed_provider_count'] == 54\n          assert catalog['managed_operation_count'] == 618\n","          assert catalog['managed_provider_count'] == len(rows)\n          assert sum(row['operation_count'] for row in rows.values()) == catalog['managed_operation_count']\n")
          path.write_text(text)
          PY
      - name: Rebuild authoritative catalogs
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_*.py'
          git diff --check
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/open-data-catalog-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: register open data aggregators in authoritative catalog'
          git push origin HEAD:feat/open-data-aggregators-20260803
