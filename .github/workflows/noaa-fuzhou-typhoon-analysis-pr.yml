name: NOAA Fuzhou Typhoon Probability PR Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/noaa_fuzhou_typhoon_model.py"
      - ".github/workflows/noaa-fuzhou-typhoon-analysis-pr.yml"

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5

      - name: Run NOAA model
        run: python analysis/noaa_fuzhou_typhoon_model.py

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noaa-fuzhou-typhoon-model-${{ github.run_id }}
          path: noaa-fuzhou-typhoon-model.json
          if-no-files-found: error
          retention-days: 30
