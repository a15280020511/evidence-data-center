name: Bootstrap Copernicus Integration Contracts

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "api-center/copernicus/**"
      - "api-center/build_catalog_market_search.py"
      - ".github/workflows/copernicus-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: copernicus-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Generate integration contracts
        run: python api-center/copernicus/bootstrap_patch.py

      - name: Verify generated state
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/copernicus/requirements.txt
          python -m py_compile api-center/copernicus/copernicus_task.py
          python -m unittest discover -s api-center/copernicus/tests -p 'test_*.py' -v
          python -m unittest api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          provider = providers['copernicus-cdse']
          assert catalog['managed_provider_count'] == 38
          assert catalog['managed_operation_count'] == 420
          assert provider['operation_count'] == 7
          assert provider['required_secret_environment_variable_name'] == 'COPERNICUS_CLIENT_SECRET'
          assert provider['required_repository_variable'] == 'COPERNICUS_CLIENT_ID'
          print(json.dumps({'status':'PASS','provider':'copernicus-cdse','operations':7}))
          PY
          git diff --check

      - name: Commit generated non-workflow outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm api-center/copernicus/bootstrap_patch.py
          git add api-center/copernicus/provider-catalog.json \
            api-center/build_catalog_market_search.py \
            api-center/README.md \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m "chore: generate Copernicus integration contracts"
          git push origin HEAD:${{ github.head_ref }}
