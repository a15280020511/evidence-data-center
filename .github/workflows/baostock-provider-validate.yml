name: Validate BaoStock Provider

on:
  pull_request:
    paths:
      - "api-center/baostock/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/baostock-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/baostock/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/baostock-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-baostock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/baostock/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baostock/requirements.txt
          python -m pip check

      - name: Compile and test
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/baostock/baostock_task.py \
            api-center/baostock/baostock_quota.py \
            api-center/baostock/tests/test_baostock_task.py \
            api-center/baostock/tests/test_baostock_quota.py
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('api-center/baostock/quota-policy.json').read_text(encoding='utf-8'))
          workflow = Path('.github/workflows/baostock-api-ticket.yml').read_text(encoding='utf-8')
          assert policy['daily_request_limit'] == 50000
          assert policy['max_parallel_connections'] == 1
          assert policy['timezone'] == 'Asia/Shanghai'
          assert policy['ledger_fail_closed'] is True
          assert policy['catalog_operations_consume_quota'] is False
          assert policy['concurrency_group'] == 'api-baostock-global-single-connection'
          assert 'group: api-baostock-global-single-connection' in workflow
          assert 'cancel-in-progress: false' in workflow
          assert 'Reserve one BaoStock daily request' in workflow
          assert "steps.quota.outputs.allowed == 'true'" in workflow
          assert 'baostock_quota.py finalize-manifest' in workflow
          assert 'api-baostock-ticket-${{ github.event.issue.number }}' not in workflow
          print(json.dumps({
              'status': 'PASS',
              'daily_limit': 50000,
              'max_parallel_connections': 1,
              'blacklist_control': True,
              'fail_closed': True,
              'model_calls': 0,
          }))
          PY
          python api-center/build_catalog_market_search.py
          git diff --exit-code -- api-center/api-catalog.json api-center/api-catalog.md
          git diff --check
