name: Managed YuanDian Legal API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-yuandian-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-yuandian-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-yuandian]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/yuandian/requirements.txt

      - name: Install pinned adapter dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/yuandian/requirements.txt
          python -m pip check

      - name: Compile and test fixed adapter
        run: |
          set -euo pipefail
          python -m py_compile api-center/yuandian/*.py
          python -m unittest discover -s api-center/yuandian/tests -v

      - name: Parse and authorize managed YuanDian ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/yuandian/yuandian_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" --output-dir yuandian-artifacts

      - name: Reject duplicate task or ticket
        id: duplicate
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/yuandian/duplicate_guard.py \
            --ticket yuandian-artifacts/ticket.json \
            --status yuandian-artifacts/ticket-status.json

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true' && steps.duplicate.outcome == 'success'
        run: |
          python api-center/yuandian/yuandian_task.py render \
            --output-dir yuandian-artifacts --phase accepted > yuandian-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@yuandian-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true' || steps.duplicate.outcome != 'success'
        run: |
          python api-center/yuandian/yuandian_task.py render \
            --output-dir yuandian-artifacts --phase rejected > yuandian-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@yuandian-comment.md

      - name: Execute one fixed read-only YuanDian operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true' && steps.duplicate.outcome == 'success'
        continue-on-error: true
        env:
          YUANDIAN_API_KEY: ${{ secrets.YUANDIAN_API_KEY }}
        run: |
          python api-center/yuandian/yuandian_task.py execute \
            --ticket yuandian-artifacts/ticket.json \
            --output-dir yuandian-artifacts

      - name: Upload YuanDian evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yuandian-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: yuandian-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true' && steps.duplicate.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/yuandian/yuandian_task.py render \
            --output-dir yuandian-artifacts --phase completed \
            --artifact-url "$ARTIFACT_URL" > yuandian-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@yuandian-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.duplicate.outcome != 'success' ||
           steps.execute.outputs.status != 'API_YUANDIAN_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1

  integrate-web-retrieval:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-integrate-web-v2]')
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH_NAME: feat/jina-exa-web-retrieval
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          persist-credentials: true
          fetch-depth: 0

      - name: Publish started receipt
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="STATUS=started RUN_ID=${GITHUB_RUN_ID}"

      - name: Verify and decode fixed bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path

          parts = sorted(Path('.integration').glob('web-retrieval.bundle.part*'))
          expected = [f'web-retrieval.bundle.part{i:02d}' for i in range(6)]
          if [item.name for item in parts] != expected:
              raise SystemExit('bundle parts are incomplete')
          encoded = ''.join(item.read_text(encoding='utf-8').strip() for item in parts)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          if digest != '656b7868284471c501d221abcef14ef73fc561e3b5df85808b929b102700388f':
              raise SystemExit(f'bundle digest mismatch: {digest}')
          target = Path('/tmp/web-retrieval-bundle.zip')
          target.write_bytes(raw)
          with zipfile.ZipFile(target) as archive:
              for member in archive.infolist():
                  path = Path(member.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('unsafe archive path')
              archive.extractall('.')
          PY
          python integrate.py
          rm -f integrate.py
          rm -rf .integration

      - name: Install and validate implementation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/web-retrieval/requirements.txt
          python -m pip check
          python api-center/build_catalog.py
          python -m compileall -q api-center
          python -m unittest discover -s api-center/web-retrieval/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          assert catalog['managed_provider_count'] == 11
          assert catalog['enabled_managed_provider_count'] == 11
          assert catalog['managed_operation_count'] == 104
          assert providers['jina-reader']['optional_secret_environment_variable_name'] == 'JINA_API_KEY'
          assert providers['exa']['required_secret_environment_variable_name'] == 'EXA_API_KEY'
          Path('/tmp/web-result.txt').write_text(
              f"PROVIDERS={catalog['managed_provider_count']} OPERATIONS={catalog['managed_operation_count']} PARAMETERS={catalog['exposed_parameter_count']}",
              encoding='utf-8',
          )
          PY

      - name: Commit feature branch
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Jina Reader and Exa web retrieval providers"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish completion receipt
        run: |
          result=$(cat /tmp/web-result.txt)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="STATUS=completed SHA=${{ steps.commit.outputs.sha }} ${result} JINA_OPTIONAL_SECRET=JINA_API_KEY EXA_SECRET=EXA_API_KEY SECRET_VALUES_READ=false"

      - name: Publish failure receipt
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="STATUS=failed RUN_ID=${GITHUB_RUN_ID}"
