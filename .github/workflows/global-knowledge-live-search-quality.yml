name: Global Knowledge Live Search Quality

on:
  pull_request:
    paths:
      - 'api-center/information-tool-radar/global-knowledge-sources.json'
      - 'api-center/information-tool-radar/global_knowledge_registry.py'
      - 'api-center/information-tool-radar/global_knowledge_search.py'
      - 'api-center/information-tool-radar/test_global_knowledge_search.py'
      - 'api-center/information-tool-radar/GLOBAL_KNOWLEDGE_LIVE_SEARCH.md'
      - '.github/workflows/global-knowledge-live-search-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile search layer
        run: |
          python -m py_compile \
            api-center/information-tool-radar/global_knowledge_registry.py \
            api-center/information-tool-radar/global_knowledge_search.py \
            api-center/information-tool-radar/test_global_knowledge_search.py
      - name: Run deterministic parser and boundary tests
        working-directory: api-center/information-tool-radar
        run: python test_global_knowledge_search.py
      - name: Run bounded official-source canary
        run: |
          python api-center/information-tool-radar/global_knowledge_search.py \
            --registry api-center/information-tool-radar/global-knowledge-sources.json \
            --query 'causal inference' \
            --source open-library \
            --source crossref \
            --source europe-pmc \
            --limit 1 \
            --timeout 20 \
            --max-bytes 1500000 \
            --output /tmp/global-knowledge-live-canary.json \
            --enforce
          python - <<'PY'
          import json
          with open('/tmp/global-knowledge-live-canary.json', encoding='utf-8') as fh:
              report = json.load(fh)
          assert report['source_count'] == 3, report
          assert report['successful_source_count'] >= 2, report
          assert report['safety']['result_files_fetched'] is False, report
          assert report['safety']['shadow_sources_live_searched'] is False, report
          print({
              'source_count': report['source_count'],
              'successful_source_count': report['successful_source_count'],
              'failed_source_count': report['failed_source_count'],
              'result_count': report['result_count'],
          })
          PY
