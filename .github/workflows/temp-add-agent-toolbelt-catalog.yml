name: One-shot Register Agent Toolbelt Catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/scripts/patch_agent_toolbelt_catalog.py"
      - ".github/workflows/temp-add-agent-toolbelt-catalog.yml"
      - "api-center/agent-toolbelt/**"

permissions:
  contents: write

concurrency:
  group: one-shot-register-agent-toolbelt-catalog
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/add-overture-oecd-alphafeed
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply deterministic catalog patch
        run: python .github/scripts/patch_agent_toolbelt_catalog.py

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/agent-toolbelt/requirements.txt
          python -m pip check

      - name: Validate implementation and generated catalog
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_catalog.py \
            api-center/managed_provider_runtime.py \
            api-center/agent-toolbelt/agent_toolbelt_task.py \
            api-center/agent-toolbelt/tests/*.py
          python -m unittest discover -s api-center/agent-toolbelt/tests -p 'test_*.py' -v
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          git diff --check

      - name: Commit verified catalog registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "feat: register Agent Toolbelt in unified API catalog"
          git push origin HEAD:feat/add-overture-oecd-alphafeed
