name: Independent API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Install isolated API-center dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check

      - name: Compile API task control plane
        run: python -m py_compile api-center/build_config.py api-center/api_ticket.py api-center/api_task.py

      - name: Parse, authorize, validate, and de-duplicate API ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/api_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir api-artifacts

      - name: Comment API ticket accepted
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/api_ticket.py render \
            --phase accepted \
            --output-dir api-artifacts \
            --run-url "$RUN_URL" > api-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@api-comment.md

      - name: Comment API ticket rejected
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/api_ticket.py render \
            --phase rejected \
            --output-dir api-artifacts \
            --run-url "$RUN_URL" > api-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@api-comment.md

      - name: Resolve remote or ephemeral gateway mode
        id: gateway
        if: steps.prepare.outputs.accepted == 'true'
        env:
          API_GATEWAY_BASE_URL: ${{ secrets.API_GATEWAY_BASE_URL }}
          API_GATEWAY_AUTH_TOKEN: ${{ secrets.API_GATEWAY_AUTH_TOKEN }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          BAIDU_MAP_API_KEY: ${{ secrets.BAIDU_MAP_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          TIANDITU_API_KEY: ${{ secrets.TIANDITU_API_KEY }}
        run: |
          python api-center/api_task.py resolve-mode \
            --plan api-artifacts/request-plan.json \
            --output-dir api-artifacts

      - name: Build and start ephemeral allowlisted gateway
        id: ephemeral
        if: steps.prepare.outputs.accepted == 'true' && steps.gateway.outputs.mode == 'ephemeral'
        continue-on-error: true
        env:
          ENV_FILE: ${{ steps.gateway.outputs.env_file }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ENV_FILE"
          docker build --pull --tag "api-ticket-gateway:${GITHUB_SHA}" api-center
          container_id="$(docker run -d \
            --env-file "$ENV_FILE" \
            -p 127.0.0.1:18080:8080 \
            --health-interval=1s \
            --health-timeout=3s \
            --health-start-period=1s \
            --health-retries=5 \
            "api-ticket-gateway:${GITHUB_SHA}")"
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/__health > api-artifacts/api-gateway-health.json; then
              health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [[ "$health" == 'healthy' ]]; then
                echo "health=$health" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "health=unhealthy" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Execute allowlisted API request plan
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        env:
          API_GATEWAY_MODE: ${{ steps.gateway.outputs.mode }}
          API_GATEWAY_BASE_URL: ${{ steps.gateway.outputs.base_url }}
          API_GATEWAY_AUTH_TOKEN: ${{ secrets.API_GATEWAY_AUTH_TOKEN }}
          API_GATEWAY_BLOCK_REASON: ${{ steps.gateway.outputs.reason }}
        shell: bash
        run: |
          set -o pipefail
          if [[ "$API_GATEWAY_MODE" == 'ephemeral' && "${{ steps.ephemeral.outcome }}" != 'success' ]]; then
            export API_GATEWAY_MODE=blocked
            export API_GATEWAY_BLOCK_REASON='ephemeral API gateway failed to become healthy'
          fi
          python api-center/api_task.py execute \
            --plan api-artifacts/request-plan.json \
            --output-dir api-artifacts \
            2>&1 | tee api-artifacts/api-console.log

      - name: Capture API gateway runtime evidence
        if: always() && steps.prepare.outputs.accepted == 'true'
        shell: bash
        env:
          MODE: ${{ steps.gateway.outputs.mode }}
          CONTAINER_ID: ${{ steps.ephemeral.outputs.container_id }}
          HEALTH: ${{ steps.ephemeral.outputs.health }}
        run: |
          set -uo pipefail
          if [[ "$MODE" == 'ephemeral' && -n "$CONTAINER_ID" ]]; then
            docker inspect "$CONTAINER_ID" > api-artifacts/api-gateway-container-inspect.json 2>&1 || true
            docker logs "$CONTAINER_ID" > api-artifacts/api-gateway-runtime.log 2>&1 || true
          else
            printf '%s\n' "gateway mode: ${MODE:-unknown}; no local container" \
              > api-artifacts/api-gateway-runtime.log
            printf '%s\n' '[]' > api-artifacts/api-gateway-container-inspect.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("api-artifacts/api-gateway-runtime-status.json").write_text(
              json.dumps({
                  "mode": os.environ.get("MODE") or "unknown",
                  "health": os.environ.get("HEALTH") or "not-local",
                  "container_present": bool(os.environ.get("CONTAINER_ID")),
                  "secret_values_included": False,
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Stop ephemeral gateway and delete runtime Secret file
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          CONTAINER_ID: ${{ steps.ephemeral.outputs.container_id }}
          ENV_FILE: ${{ steps.gateway.outputs.env_file }}
        run: |
          if [[ -n "$CONTAINER_ID" ]]; then
            docker rm -f "$CONTAINER_ID" || true
          fi
          if [[ -n "$ENV_FILE" ]]; then
            rm -f "$ENV_FILE"
          fi

      - name: Finalize API Artifact manifest
        id: finalize
        if: always() && steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/api_task.py finalize --output-dir api-artifacts

      - name: Upload independent API Artifact
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: api-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified API snapshot and public fallback
        id: publish_success
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.execute.outcome == 'success' &&
          steps.finalize.outcome == 'success' &&
          steps.upload.outcome == 'success' &&
          steps.upload.outputs['artifact-id'] != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_URL: ${{ steps.upload.outputs['artifact-url'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf api-public-comments
          mkdir -p api-public-comments
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          snapshot = json.loads(Path("api-artifacts/api-snapshot.json").read_text(encoding="utf-8"))
          if snapshot["status"] not in {"API_COMPLETED", "API_PARTIAL"}:
              raise SystemExit(f"non-publishable API status: {snapshot['status']}")
          payload = json.dumps(snapshot, ensure_ascii=False, indent=2)
          public_digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          limit = 45000
          chunks = [payload[index:index + limit] for index in range(0, len(payload), limit)] or [""]
          run_id = os.environ["GITHUB_RUN_ID"]
          files = []
          for index, chunk in enumerate(chunks, 1):
              marker = f"<!-- api-snapshot-run:{run_id}:part:{index:03d} -->"
              body = "\n".join([
                  marker,
                  f"## {snapshot['status']} {index}/{len(chunks)}",
                  "",
                  f"- Task ID: `{snapshot['task_id']}`",
                  f"- Requests: `{snapshot['request_count']}`",
                  f"- Successful: `{snapshot['successful_request_count']}`",
                  f"- Snapshot SHA256: `{snapshot['snapshot_sha256']}`",
                  f"- Public payload SHA256: `{public_digest}`",
                  f"- Artifact ID: `{os.environ['ARTIFACT_ID']}`",
                  f"- Artifact digest: `{os.environ.get('ARTIFACT_DIGEST') or 'unknown'}`",
                  f"- Artifact: {os.environ.get('ARTIFACT_URL') or 'unavailable'}",
                  "- Data policy: `public, non-personal only`",
                  "- Model calls: `0`",
                  "",
                  "```json",
                  chunk,
                  "```",
              ])
              path = Path("api-public-comments") / f"api-snapshot-{index:03d}.md"
              path.write_text(body, encoding="utf-8")
              files.append(path.name)
          Path("api-public-comments/manifest.json").write_text(
              json.dumps({
                  "version": 1,
                  "snapshot_sha256": snapshot["snapshot_sha256"],
                  "public_payload_sha256": public_digest,
                  "comment_count": len(chunks),
                  "files": files,
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            > /tmp/trusted-api-comments.txt
          while IFS= read -r comment_file; do
            marker="$(head -n 1 "api-public-comments/$comment_file")"
            if grep -Fqx "$marker" /tmp/trusted-api-comments.txt; then
              continue
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -F body=@"api-public-comments/$comment_file"
          done < <(jq -r '.files[]' api-public-comments/manifest.json)

      - name: Publish structured API failure
        id: publish_failure
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          (steps.execute.outcome != 'success' ||
           steps.finalize.outcome != 'success' ||
           steps.upload.outcome != 'success' ||
           steps.upload.outputs['artifact-id'] == '')
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs['artifact-url'] }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnostics_path = Path("api-artifacts/api-diagnostics.json")
          diagnostics = json.loads(diagnostics_path.read_text(encoding="utf-8")) if diagnostics_path.exists() else {}
          failure = diagnostics.get("primary_failure") or {}
          status = diagnostics.get("status") or "API_FAILED"
          body = "\n".join([
              f"## {status}",
              "",
              f"- Error code: `{failure.get('code') or 'API_DELIVERY_FAILED'}`",
              f"- Stage: `{failure.get('stage') or 'delivery'}`",
              f"- Message: `{str(failure.get('message') or 'API execution or evidence delivery did not complete')[:4000]}`",
              f"- Retryable: `{str(bool(failure.get('retryable'))).lower()}`",
              f"- Execute outcome: `{os.environ['EXECUTE_OUTCOME']}`",
              f"- Manifest outcome: `{os.environ['FINALIZE_OUTCOME']}`",
              f"- Artifact upload outcome: `{os.environ['UPLOAD_OUTCOME']}`",
              "- Model calls: `0`",
              f"- Artifact: {os.environ.get('ARTIFACT_URL') or 'unavailable'}",
          ])
          Path("api-final-comment.md").write_text(body, encoding="utf-8")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@api-final-comment.md

      - name: Mark rejected or failed API execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outcome != 'success' ||
           steps.finalize.outcome != 'success' ||
           steps.upload.outcome != 'success' ||
           steps.upload.outputs['artifact-id'] == '' ||
           (steps.prepare.outputs.accepted == 'true' && steps.publish_success.outcome != 'success'))
        run: exit 1
