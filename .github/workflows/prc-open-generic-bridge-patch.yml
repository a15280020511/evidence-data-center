name: PRC Open Generic Bridge Patch

on:
  push:
    branches: [feat/prc-free-intelligence-suite]
    paths:
      - ".github/workflows/prc-open-generic-bridge-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/prc-free-intelligence-suite

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply deterministic bridge patch
        run: python api-center/prc-open-intelligence/_patch_generic_bridge.py

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt

      - name: Compile and run API-center regressions
        run: |
          python -m py_compile \
            api-center/api_ticket.py \
            api-center/api_task.py \
            api-center/prc-open-intelligence/generic_bridge.py
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/prc-open-intelligence/tests -p 'test_*.py' -v
          python api-center/prc-open-intelligence/validate_registry.py

      - name: Commit bridge changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api_ticket.py api-center/api_task.py api-center/tests/test_prc_open_generic_bridge.py
          git commit -m "feat(prc-intel): bridge governance API route to free local providers"
          git push origin HEAD:feat/prc-free-intelligence-suite
