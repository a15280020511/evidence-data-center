name: Probe official Miaoxiang MCP server

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: probe-miaoxiang-mcp
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] probe-miaoxiang-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MIGRATION_EM_API_KEY: ${{ secrets.MX_APIKEY }}
    steps:
      - name: Initialize and list tools without exposing the key
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p miaoxiang-mcp-probe
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          OUT = Path('miaoxiang-mcp-probe')
          ENDPOINT = 'https://mxapi.eastmoney.com/mxds/mcp'
          KEY = (os.environ.get('MIGRATION_EM_API_KEY') or '').strip()

          def write(name, value):
              (OUT / name).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def parse_payload(raw: bytes, content_type: str):
              text = raw.decode('utf-8', errors='strict') if raw else ''
              if 'text/event-stream' in content_type.lower() or text.lstrip().startswith(('event:', 'data:')):
                  events = []
                  data_lines = []
                  for line in text.splitlines():
                      if line.startswith('data:'):
                          data_lines.append(line[5:].lstrip())
                      elif not line.strip() and data_lines:
                          data = '\n'.join(data_lines)
                          data_lines = []
                          if data and data != '[DONE]':
                              events.append(json.loads(data))
                  if data_lines:
                      data = '\n'.join(data_lines)
                      if data and data != '[DONE]':
                          events.append(json.loads(data))
                  if not events:
                      raise RuntimeError('empty SSE response')
                  return events[-1]
              return json.loads(text) if text else {}

          def post(payload, session_id=None):
              body = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              headers = {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json, text/event-stream',
                  'User-Agent': 'evidence-data-center-miaoxiang-mcp-probe/1',
                  'em_api_key': KEY,
              }
              if session_id:
                  headers['Mcp-Session-Id'] = session_id
              request = urllib.request.Request(ENDPOINT, data=body, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read(5_000_001)
                      status = int(response.status)
                      response_headers = response.headers
              except urllib.error.HTTPError as exc:
                  raw = exc.read(5_000_001)
                  status = int(exc.code)
                  response_headers = exc.headers
              if len(raw) > 5_000_000:
                  raise RuntimeError('response exceeded 5 MB')
              content_type = str(response_headers.get('Content-Type') or '') if response_headers else ''
              parsed = parse_payload(raw, content_type)
              metadata = {
                  'http_status': status,
                  'content_type': content_type,
                  'session_id_present': bool(response_headers.get('Mcp-Session-Id')) if response_headers else False,
              }
              if not 200 <= status < 300:
                  raise RuntimeError(f'HTTP {status}: {parsed}')
              return parsed, metadata, (response_headers.get('Mcp-Session-Id') if response_headers else None)

          summary = {
              'endpoint': ENDPOINT,
              'credential_source': 'repository Secret MX_APIKEY used only for migration probe',
              'credential_value_exposed': False,
              'model_calls': 0,
          }
          try:
              if not KEY:
                  raise RuntimeError('repository Secret MX_APIKEY is missing')
              initialize_request = {
                  'jsonrpc': '2.0',
                  'id': 1,
                  'method': 'initialize',
                  'params': {
                      'protocolVersion': '2025-11-25',
                      'capabilities': {},
                      'clientInfo': {'name': 'evidence-data-center', 'version': '1.0.0'},
                  },
              }
              initialize, init_meta, session_id = post(initialize_request)
              write('initialize.json', initialize)
              if isinstance(initialize, dict) and initialize.get('error'):
                  raise RuntimeError(f"initialize error: {initialize['error']}")
              initialized_request = {
                  'jsonrpc': '2.0',
                  'method': 'notifications/initialized',
                  'params': {},
              }
              try:
                  post(initialized_request, session_id=session_id)
              except Exception as notification_error:
                  summary['initialized_notification_warning'] = str(notification_error)
              tools_request = {
                  'jsonrpc': '2.0',
                  'id': 2,
                  'method': 'tools/list',
                  'params': {},
              }
              tools_payload, tools_meta, tools_session = post(tools_request, session_id=session_id)
              write('tools-list.json', tools_payload)
              if isinstance(tools_payload, dict) and tools_payload.get('error'):
                  raise RuntimeError(f"tools/list error: {tools_payload['error']}")
              result = tools_payload.get('result') if isinstance(tools_payload, dict) else None
              tools = result.get('tools') if isinstance(result, dict) else None
              if not isinstance(tools, list):
                  raise RuntimeError('tools/list response did not contain result.tools')
              tool_index = []
              for tool in tools:
                  if isinstance(tool, dict):
                      tool_index.append({
                          'name': tool.get('name'),
                          'description': tool.get('description'),
                          'inputSchema': tool.get('inputSchema'),
                          'annotations': tool.get('annotations'),
                      })
              write('tool-index.json', tool_index)
              server_info = ((initialize.get('result') or {}).get('serverInfo') if isinstance(initialize, dict) else None)
              protocol_version = ((initialize.get('result') or {}).get('protocolVersion') if isinstance(initialize, dict) else None)
              summary.update({
                  'status': 'MIAOXIANG_MCP_PROBE_COMPLETED',
                  'protocol_version': protocol_version,
                  'server_info': server_info,
                  'initialize_http': init_meta,
                  'tools_list_http': tools_meta,
                  'session_id_present': bool(session_id or tools_session),
                  'tool_count': len(tool_index),
                  'tool_names': [item.get('name') for item in tool_index],
              })
              serialized = json.dumps({'initialize': initialize, 'tools': tools_payload, 'summary': summary}, ensure_ascii=False)
              if KEY and KEY in serialized:
                  raise RuntimeError('credential leakage detected in response artifacts')
              write('probe-summary.json', summary)
              print(f"status={summary['status']}")
              print(f"tool_count={summary['tool_count']}")
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
                  handle.write(f"status={summary['status']}\n")
                  handle.write(f"tool_count={summary['tool_count']}\n")
              sys.exit(0)
          except Exception as exc:
              summary.update({'status': 'MIAOXIANG_MCP_PROBE_FAILED', 'error': str(exc)})
              write('probe-summary.json', summary)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
                  handle.write('status=MIAOXIANG_MCP_PROBE_FAILED\n')
                  handle.write('tool_count=0\n')
              print(str(exc), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload sanitized probe evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miaoxiang-mcp-probe-${{ github.run_id }}
          path: miaoxiang-mcp-probe/
          if-no-files-found: error
          retention-days: 30

      - name: Publish result
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${{ steps.probe.outputs.status || 'MIAOXIANG_MCP_PROBE_FAILED' }} endpoint=https://mxapi.eastmoney.com/mxds/mcp tools=${{ steps.probe.outputs.tool_count || '0' }} artifact=${ARTIFACT_URL} credential_value_exposed=false model_calls=0"

      - name: Mark failed probe
        if: steps.probe.outcome != 'success'
        run: exit 1
