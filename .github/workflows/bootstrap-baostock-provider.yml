name: Bootstrap BaoStock provider integration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-baostock-provider
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] add-baostock'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: feat/baostock-provider-20260801
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate provider implementation
        run: python maintenance/add_baostock_provider.py

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/baostock/requirements.txt \
            -r requirements-dev.txt
          python -m pip check

      - name: Generate deterministic API catalog
        run: python api-center/build_catalog_market_search.py

      - name: Run static and unit validation
        run: |
          python -m py_compile \
            api-center/baostock/baostock_task.py \
            api-center/baostock/tests/test_baostock_task.py \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          test ! -e maintenance/add_baostock_provider.py
          git diff --check

      - name: Commit integration
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(api-center): add BaoStock managed provider'
          git push origin HEAD:${TARGET_BRANCH}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish integration receipt
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="BAOSTOCK_INTEGRATION_COMPLETED branch=${TARGET_BRANCH} commit=${{ steps.commit.outputs.sha }} unit_tests=passed catalog_generated=true credentials_required=false model_calls=0"

      - name: Publish failure receipt
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="BAOSTOCK_INTEGRATION_FAILED branch=${TARGET_BRANCH} run=${GITHUB_RUN_ID} model_calls=0"
