name: Managed GNews Intelligence

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-gnews-global
  cancel-in-progress: false

jobs:
  execute-gnews:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-gnews]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/gnews/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/gnews/requirements.txt
          python -m pip check
      - name: Compile GNews control plane
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/gnews/gnews_task.py
      - name: Parse and authorize GNews ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/gnews/gnews_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir gnews-artifacts
      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/gnews/gnews_task.py render --output-dir gnews-artifacts --phase accepted > gnews-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@gnews-comment.md
      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/gnews/gnews_task.py render --output-dir gnews-artifacts --phase rejected > gnews-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@gnews-comment.md
      - name: Execute one bounded read-only GNews operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/gnews/gnews_task.py execute --ticket gnews-artifacts/ticket.json --output-dir gnews-artifacts
      - name: Upload GNews evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnews-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: gnews-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/gnews/gnews_task.py render --output-dir gnews-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > gnews-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@gnews-comment.md
      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_GNEWS_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "GNews ticket did not complete successfully."
          exit 1
