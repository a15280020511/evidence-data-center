name: Fix NOAA Composite Paths

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-build-validate:
    if: github.head_ref == 'feat/noaa-official-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Separate composite public path parameters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          changes = {
              'noaa-nws-points': (
                  '/data/noaa/nws/points/{latitude},{longitude}',
                  '/data/noaa/nws/points/{latitude}/{longitude}',
              ),
              'noaa-nws-forecast': (
                  '/data/noaa/nws/gridpoints/{office}/{grid_x},{grid_y}/forecast',
                  '/data/noaa/nws/gridpoints/{office}/{grid_x}/{grid_y}/forecast',
              ),
              'noaa-nws-forecast-hourly': (
                  '/data/noaa/nws/gridpoints/{office}/{grid_x},{grid_y}/forecast/hourly',
                  '/data/noaa/nws/gridpoints/{office}/{grid_x}/{grid_y}/forecast/hourly',
              ),
              'noaa-nws-gridpoint-stations': (
                  '/data/noaa/nws/gridpoints/{office}/{grid_x},{grid_y}/stations',
                  '/data/noaa/nws/gridpoints/{office}/{grid_x}/{grid_y}/stations',
              ),
          }
          root = Path('api-center/connectors')
          for connector_id, (old, new) in changes.items():
              path = root / f'{connector_id}.connector.json'
              doc = json.loads(path.read_text(encoding='utf-8'))
              if doc['endpoint'] == old:
                  doc['endpoint'] = new
              elif doc['endpoint'] != new:
                  raise SystemExit(f'unexpected endpoint for {connector_id}: {doc["endpoint"]}')
              path.write_text(
                  json.dumps(doc, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Rebuild deterministic contracts and run tests
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_noaa_connectors.py' -v
          python -m unittest api-center.tests.test_api_catalog -v
          git diff --check

      - name: Validate generated KrakenD configuration
        run: |
          image="$(awk 'toupper($1) == "FROM" {print $2; exit}' api-center/Dockerfile)"
          docker pull "$image"
          docker run --rm \
            -v "$PWD/api-center:/etc/krakend:ro" \
            "$image" check -tnc /etc/krakend/krakend.validation.json

      - name: Commit corrected NOAA routes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center
          if git diff --cached --quiet; then
            echo 'Composite paths already normalized.'
          else
            git commit -m 'fix: expose NOAA composite coordinates as separate path segments'
            git push origin HEAD:feat/noaa-official-data
          fi
