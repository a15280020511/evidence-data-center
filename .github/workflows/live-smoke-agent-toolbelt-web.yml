name: Live Smoke Agent Toolbelt Web Summarizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/live-smoke-agent-toolbelt-web.yml"

permissions:
  contents: read

concurrency:
  group: live-smoke-agent-toolbelt-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENT_TOOLBELT_KEY: ${{ secrets.AGENT_TOOLBELT_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Call web-summarizer through Agent Toolbelt
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +x
          mkdir -p agent-toolbelt-web-artifacts
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          key = os.environ.get('AGENT_TOOLBELT_KEY', '').strip()
          body = json.dumps({
              'url': 'https://example.com',
              'mode': 'both',
              'focus': 'What is this page for?',
              'maxContentLength': 5000,
              'timeout': 20000,
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://www.agenttoolbelt.live/api/tools/web-summarizer',
              data=body,
              method='POST',
              headers={
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'evidence-data-center-agent-toolbelt-web-smoke/1.0',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  status = response.status
                  payload = json.loads(response.read(2_000_000).decode('utf-8'))
          except urllib.error.HTTPError as exc:
              status = exc.code
              raw = exc.read(100_000).decode('utf-8', errors='replace')
              try:
                  payload = json.loads(raw)
              except Exception:
                  payload = {'error': raw[:1000]}

          result = payload.get('result', {}) if isinstance(payload, dict) else {}
          summary = result.get('summary', {}) if isinstance(result, dict) else {}
          report = {
              'schema_version': 'agent-toolbelt-web-smoke-v1',
              'tested_at': datetime.now(timezone.utc).isoformat(),
              'credential_present': bool(key),
              'credential_prefix_valid': key.startswith('atb_'),
              'secret_values_exposed': False,
              'http_status': status,
              'success': payload.get('success') if isinstance(payload, dict) else None,
              'tool': payload.get('tool') if isinstance(payload, dict) else None,
              'version': payload.get('version') if isinstance(payload, dict) else None,
              'duration_ms': payload.get('durationMs') if isinstance(payload, dict) else None,
              'requested_url': result.get('url') if isinstance(result, dict) else None,
              'final_url': result.get('finalUrl') if isinstance(result, dict) else None,
              'upstream_status_code': result.get('statusCode') if isinstance(result, dict) else None,
              'character_count': result.get('characterCount') if isinstance(result, dict) else None,
              'truncated': result.get('truncated') if isinstance(result, dict) else None,
              'content_excerpt': str(result.get('content') or '')[:500],
              'summary_title': summary.get('title') if isinstance(summary, dict) else None,
              'summary_text': summary.get('summary') if isinstance(summary, dict) else None,
              'key_points': summary.get('keyPoints') if isinstance(summary, dict) else None,
              'safe_error': (payload.get('message') or payload.get('error')) if isinstance(payload, dict) and status != 200 else None,
          }
          report['status'] = 'PASS' if status == 200 and payload.get('success') is True and result.get('statusCode') == 200 else 'FAIL'
          Path('agent-toolbelt-web-artifacts/summary.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'status': report['status'], 'http_status': status, 'upstream_status_code': result.get('statusCode'), 'secret_values_exposed': False}))
          sys.exit(0 if report['status'] == 'PASS' else 1)
          PY

      - name: Verify no key in evidence
        if: always()
        shell: bash
        run: |
          set +x
          test -f agent-toolbelt-web-artifacts/summary.json
          if [ -n "${AGENT_TOOLBELT_KEY:-}" ] && grep -Fq -- "$AGENT_TOOLBELT_KEY" agent-toolbelt-web-artifacts/summary.json; then
            exit 1
          fi

      - name: Upload web evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-toolbelt-web-smoke-${{ github.run_id }}
          path: agent-toolbelt-web-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Mark failed smoke
        if: steps.smoke.outcome != 'success'
        run: exit 1
