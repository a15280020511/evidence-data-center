name: Validate MET Norway Geosatellite Provider

on:
  pull_request:
    paths:
      - "api-center/metno-geosatellite/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/metno-geosatellite-provider-validate.yml"
      - ".github/workflows/metno-geosatellite-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/metno-geosatellite/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/metno-geosatellite-provider-validate.yml"
      - ".github/workflows/metno-geosatellite-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/metno-geosatellite/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/metno-geosatellite/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/metno-geosatellite/metno_geosatellite_task.py api-center/metno-geosatellite/tests/*.py
          python -m unittest discover -s api-center/metno-geosatellite/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/metno-geosatellite')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'metno-geosatellite'
          assert provider['ticket_prefix'] == '[intel-metno-geosatellite]'
          assert provider['required_secret_environment_variable'] == ''
          assert len(ids) == 4
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['fixed_api_host'] == 'api.met.no'
          assert provider['limits']['small_size_images_allowed'] is False
          assert provider['limits']['unfiltered_availability_listing_allowed'] is False
          assert provider['limits']['bulk_download_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert {'catalog-capabilities','get-static-image','get-europe-animation','list-available'} == ids
          print(json.dumps({'status':'PASS','operations':len(ids),'secret_required':False}))
          PY
          git diff --check
