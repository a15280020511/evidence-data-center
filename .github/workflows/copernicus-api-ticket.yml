name: Managed Copernicus Intelligence Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-copernicus-global
  cancel-in-progress: false

jobs:
  execute-copernicus:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-copernicus]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COPERNICUS_CLIENT_ID: ${{ vars.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/copernicus/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/copernicus/requirements.txt
          python -m pip check

      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/copernicus/copernicus_task.py

      - name: Parse and authorize Copernicus ticket
        id: prepare
        continue-on-error: true
        run: python api-center/copernicus/copernicus_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir copernicus-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/copernicus/copernicus_task.py render --output-dir copernicus-artifacts --phase accepted > copernicus-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@copernicus-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/copernicus/copernicus_task.py render --output-dir copernicus-artifacts --phase rejected > copernicus-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@copernicus-comment.md

      - name: Execute one bounded Copernicus request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/copernicus/copernicus_task.py execute --ticket copernicus-artifacts/ticket.json --output-dir copernicus-artifacts

      - name: Upload Copernicus evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copernicus-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: copernicus-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/copernicus/copernicus_task.py render --output-dir copernicus-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > copernicus-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@copernicus-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_COPERNICUS_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
