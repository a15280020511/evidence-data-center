name: Managed Wind AIFin Market API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-aifin-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-aifin-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-aifin]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Install pinned validation dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check

      - name: Compile and test fixed AIFin adapter
        run: |
          python -m py_compile api-center/prc_legal_risk_audit.py api-center/aifin-market/aifin_task.py
          python -m unittest discover -s api-center/aifin-market/tests -v

      - name: Parse and authorize AIFin ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/aifin-market/aifin_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" --output-dir aifin-artifacts

      - name: Audit PRC attributable legal risk before secret injection
        id: legal_audit
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/prc_legal_risk_audit.py preflight \
            --workflow-id ".github/workflows/aifin-api-ticket.yml" \
            --ticket aifin-artifacts/ticket.json \
            --output-dir aifin-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true' && steps.legal_audit.outputs.accepted == 'true'
        run: |
          python api-center/aifin-market/aifin_task.py render \
            --output-dir aifin-artifacts --phase accepted > aifin-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@aifin-comment.md

      - name: Comment legal-risk audit block
        if: steps.prepare.outputs.accepted == 'true' && steps.legal_audit.outputs.accepted != 'true'
        run: |
          python api-center/prc_legal_risk_audit.py render \
            --audit aifin-artifacts/prc-legal-risk-audit.json > aifin-audit-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@aifin-audit-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/aifin-market/aifin_task.py render \
            --output-dir aifin-artifacts --phase rejected > aifin-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@aifin-comment.md

      - name: Execute fixed read-only AIFin operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true' && steps.legal_audit.outputs.accepted == 'true'
        continue-on-error: true
        env:
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
        run: |
          python api-center/aifin-market/aifin_task.py execute \
            --ticket aifin-artifacts/ticket.json --output-dir aifin-artifacts

      - name: Upload AIFin evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aifin-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: aifin-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: >-
          always() &&
          steps.prepare.outputs.accepted == 'true' &&
          steps.legal_audit.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/aifin-market/aifin_task.py render \
            --output-dir aifin-artifacts --phase completed \
            --artifact-url "$ARTIFACT_URL" > aifin-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@aifin-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.legal_audit.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_AIFIN_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
