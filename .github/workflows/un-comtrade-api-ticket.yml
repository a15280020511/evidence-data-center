name: Managed UN Comtrade Intelligence Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-un-comtrade-global
  cancel-in-progress: false

jobs:
  execute-un-comtrade:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-un-comtrade]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/un-comtrade/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/un-comtrade/requirements.txt
          python -m pip check

      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/un-comtrade/un_comtrade_task.py

      - name: Parse and authorize UN Comtrade ticket
        id: prepare
        continue-on-error: true
        run: python api-center/un-comtrade/un_comtrade_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir un-comtrade-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/un-comtrade/un_comtrade_task.py render --output-dir un-comtrade-artifacts --phase accepted > un-comtrade-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@un-comtrade-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/un-comtrade/un_comtrade_task.py render --output-dir un-comtrade-artifacts --phase rejected > un-comtrade-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@un-comtrade-comment.md

      - name: Execute one bounded UN Comtrade request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        env:
          UN_COMTRADE_API_KEY: ${{ secrets.UN_COMTRADE_API_KEY }}
        run: python api-center/un-comtrade/un_comtrade_task.py execute --ticket un-comtrade-artifacts/ticket.json --output-dir un-comtrade-artifacts

      - name: Upload UN Comtrade evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: un-comtrade-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: un-comtrade-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/un-comtrade/un_comtrade_task.py render --output-dir un-comtrade-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > un-comtrade-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@un-comtrade-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_UN_COMTRADE_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
