name: Sync Open Intelligence Contracts

on:
  push:
    branches: [feat/open-intelligence-toolkit-20260804]
    paths:
      - maintenance/sync_open_intelligence_contracts.py
      - .github/workflows/sync-open-intelligence-contracts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-open-intelligence-contracts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/open-intelligence-toolkit-20260804
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python maintenance/sync_open_intelligence_contracts.py
      - name: Commit synchronized contracts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center/tests/test_api_catalog.py
          if git diff --cached --quiet; then
            echo 'No contract changes generated'
            exit 0
          fi
          git commit -m 'test: register open intelligence toolkit contract'
          git push origin HEAD:feat/open-intelligence-toolkit-20260804
