name: Global Open and Shadow Library Discovery Quality

on:
  pull_request:
    paths:
      - 'api-center/information-tool-radar/global-knowledge-sources.json'
      - 'api-center/information-tool-radar/global_knowledge_registry.py'
      - 'api-center/information-tool-radar/global-open-library-discovery-sources.json'
      - 'api-center/information-tool-radar/global_open_library_discovery.py'
      - 'api-center/information-tool-radar/test_global_open_library_discovery.py'
      - 'api-center/information-tool-radar/shadow-library-wikimedia-sources.json'
      - 'api-center/information-tool-radar/shadow_library_wikimedia_discovery.py'
      - 'api-center/information-tool-radar/test_shadow_library_wikimedia_discovery.py'
      - 'api-center/information-tool-radar/test_global_knowledge_registry.py'
      - '.github/workflows/shadow-library-wikimedia-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile discovery layer
        run: |
          python -m py_compile \
            api-center/information-tool-radar/global_knowledge_registry.py \
            api-center/information-tool-radar/global_open_library_discovery.py \
            api-center/information-tool-radar/shadow_library_wikimedia_discovery.py \
            api-center/information-tool-radar/test_global_knowledge_registry.py \
            api-center/information-tool-radar/test_global_open_library_discovery.py \
            api-center/information-tool-radar/test_shadow_library_wikimedia_discovery.py
      - name: Run deterministic policy tests
        working-directory: api-center/information-tool-radar
        run: |
          python test_global_knowledge_registry.py
          python test_global_open_library_discovery.py
          python test_shadow_library_wikimedia_discovery.py
      - name: Enforce open-library discovery backbone
        run: |
          python api-center/information-tool-radar/global_open_library_discovery.py \
            --registry api-center/information-tool-radar/global-open-library-discovery-sources.json \
            --output /tmp/open-library-discovery.json \
            --enforce
          python - <<'PY'
          import json
          with open('/tmp/open-library-discovery.json', encoding='utf-8') as fh:
              report = json.load(fh)
          assert report['status'] == 'pass', report
          assert report['discovery_source_count'] >= 15, report
          assert report['governance']['automatic_child_endpoint_promotion'] is False, report
          assert report['governance']['child_verification_required'] is True, report
          PY
      - name: Run bounded Wikimedia canary
        run: |
          python api-center/information-tool-radar/shadow_library_wikimedia_discovery.py \
            --registry api-center/information-tool-radar/shadow-library-wikimedia-sources.json \
            --source annas-archive \
            --source library-genesis \
            --source sci-hub \
            --source z-library \
            --timeout 20 \
            --output /tmp/shadow-wikimedia-canary.json \
            --enforce
          python - <<'PY'
          import json
          with open('/tmp/shadow-wikimedia-canary.json', encoding='utf-8') as fh:
              report = json.load(fh)
          assert report['status'] == 'pass', report
          assert report['source_count'] == 4, report
          assert sum(row['status'] != 'wikimedia-unavailable' for row in report['sources']) >= 2, report
          assert report['safety']['discovery_via_wikipedia_wikidata_only'] is True, report
          assert report['safety']['shadow_domains_persisted'] is False, report
          assert report['safety']['shadow_domains_exposed_in_report'] is False, report
          assert report['safety']['shadow_detail_pages_followed'] is False, report
          assert report['safety']['shadow_download_links_followed'] is False, report
          assert report['safety']['shadow_files_retrieved'] is False, report
          rendered = json.dumps(report, ensure_ascii=False)
          assert 'https://' not in rendered and 'http://' not in rendered, report
          print({
              'source_count': report['source_count'],
              'resolved_source_count': report['resolved_source_count'],
              'wikimedia_reachable_count': sum(row['status'] != 'wikimedia-unavailable' for row in report['sources']),
          })
          PY
