name: Remove retired provider

on:
  push:
    branches: [remove/data-commons-20260801]
    paths:
      - maintenance/remove-provider-trigger.txt

permissions:
  contents: write

concurrency:
  group: remove-retired-provider
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout removal branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: remove/data-commons-20260801
          persist-credentials: true
          fetch-depth: 0

      - name: Apply complete provider removal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import re
          import shutil
          from pathlib import Path
          from typing import Any

          TOKEN = re.compile(r"data[ _-]*commons|GOOGLE_DATA_COMMONS_API_KEY", re.IGNORECASE)

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")

          def strip_markdown_sections(path: Path) -> None:
              if not path.exists():
                  return
              lines = path.read_text(encoding="utf-8").splitlines()
              out: list[str] = []
              skip_level: int | None = None
              for line in lines:
                  heading = re.match(r"^(#{1,6})\s+", line)
                  if skip_level is not None:
                      if heading and len(heading.group(1)) <= skip_level:
                          skip_level = None
                      else:
                          continue
                  if TOKEN.search(line):
                      if heading:
                          skip_level = len(heading.group(1))
                      continue
                  out.append(line)
              path.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8")

          def contains_token(value: Any) -> bool:
              if isinstance(value, str):
                  return bool(TOKEN.search(value))
              if isinstance(value, dict):
                  return any(contains_token(k) or contains_token(v) for k, v in value.items())
              if isinstance(value, list):
                  return any(contains_token(item) for item in value)
              return False

          def prune_json(value: Any) -> Any:
              if isinstance(value, dict):
                  result = {}
                  for key, item in value.items():
                      if contains_token(key) or (isinstance(item, str) and contains_token(item)):
                          continue
                      result[key] = prune_json(item)
                  return result
              if isinstance(value, list):
                  return [prune_json(item) for item in value if not contains_token(item)]
              return value

          shutil.rmtree("api-center/data-commons", ignore_errors=True)
          for path in (
              ".github/workflows/data-commons-api-ticket.yml",
              ".github/workflows/data-commons-provider-validate.yml",
          ):
              Path(path).unlink(missing_ok=True)

          catalog_path = Path("api-center/google-cloud/provider-catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          contract = catalog["credential_bundle_contract"]
          contract["required"] = ["service_account"]
          contract["properties"] = {
              "service_account": {
                  "type": "object",
                  "description": "One Google service-account JSON object shared by BigQuery and Earth Engine.",
              }
          }
          contract["additionalProperties"] = True
          catalog["topic_catalog_files"] = [
              item for item in catalog.get("topic_catalog_files", []) if not TOKEN.search(str(item))
          ]
          catalog["providers"] = [
              row for row in catalog["providers"] if row.get("provider_id") != "data-commons"
          ]
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          write(
              "api-center/google-cloud/unified_google_credentials.py",
              '''#!/usr/bin/env python3
"""Validate one Google service-account bundle and export ephemeral runtime credentials."""
from __future__ import annotations

import argparse
import hashlib
import json
import os
from datetime import datetime, timezone
from pathlib import Path
from typing import Any, Mapping

BUNDLE_ENV = "GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON"


def utc_now() -> str:
    return datetime.now(timezone.utc).isoformat()


def canonical_sha(value: Any) -> str:
    raw = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8")
    return hashlib.sha256(raw).hexdigest()


def write_json(path: Path, value: Any) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\\n", encoding="utf-8")


def parse_bundle(raw: str) -> dict[str, Any]:
    text = raw.strip()
    if not text:
        raise RuntimeError(f"missing repository Secret {BUNDLE_ENV}")
    try:
        value = json.loads(text)
    except json.JSONDecodeError as exc:
        raise RuntimeError(f"{BUNDLE_ENV} is not valid JSON") from exc
    if not isinstance(value, Mapping):
        raise RuntimeError(f"{BUNDLE_ENV} must contain a JSON object")
    nested = value.get("service_account")
    service_account = dict(nested) if isinstance(nested, Mapping) else dict(value)
    required = {"type", "project_id", "private_key_id", "private_key", "client_email", "token_uri"}
    missing = sorted(required - set(service_account))
    if missing:
        raise RuntimeError(f"{BUNDLE_ENV} service account is missing fields: {missing}")
    if str(service_account.get("type") or "") != "service_account":
        raise RuntimeError(f"{BUNDLE_ENV}.type must be service_account")
    return service_account


def append_multiline(path: Path, name: str, value: str) -> None:
    delimiter = f"GOOGLE_BUNDLE_{name}_EOF"
    with path.open("a", encoding="utf-8") as handle:
        handle.write(f"{name}<<{delimiter}\\n{value}\\n{delimiter}\\n")


def export_runtime(raw: str, github_env: Path) -> None:
    encoded = json.dumps(parse_bundle(raw), ensure_ascii=False, separators=(",", ":"))
    append_multiline(github_env, "BIGQUERY_SERVICE_ACCOUNT_JSON", encoded)
    append_multiline(github_env, "EARTH_ENGINE_SERVICE_ACCOUNT_JSON", encoded)


def bundle_failure_message(raw: str) -> str:
    try:
        parse_bundle(raw)
    except RuntimeError as exc:
        return str(exc)
    return f"failed to expand repository Secret {BUNDLE_ENV}"


def generate_blocked_artifact(*, ticket_path: Path, output_dir: Path, raw_bundle: str) -> None:
    ticket = json.loads(ticket_path.read_text(encoding="utf-8"))
    if not isinstance(ticket, Mapping):
        raise ValueError("ticket must contain a JSON object")
    output_dir.mkdir(parents=True, exist_ok=True)
    message = bundle_failure_message(raw_bundle)
    failure = {"code": "GOOGLE_CREDENTIALS_BUNDLE_INVALID", "message": message, "retryable": False}
    snapshot: dict[str, Any] = {
        "schema_version": "google-cloud-api-snapshot-v1",
        "status": "API_GCP_BLOCKED",
        "created_at": utc_now(),
        "started_at": utc_now(),
        "elapsed_seconds": 0.0,
        "task_id": str(ticket["task_id"]),
        "provider": str(ticket["provider"]),
        "operation": str(ticket["operation"]),
        "objective": str(ticket.get("objective") or ""),
        "ticket_sha256": canonical_sha(ticket),
        "parameters": dict(ticket.get("parameters") or {}),
        "data_policy": dict(ticket["data_policy"]),
        "data": None,
        "upstream_metadata": {},
        "failure": failure,
        "security": {
            "secret_values_included": False,
            "authorization_header_recorded": False,
            "public_non_personal_data_only": True,
            "bigquery_write_allowed": False,
            "earth_engine_export_or_asset_write_allowed": False,
        },
        "model_calls": 0,
    }
    snapshot["snapshot_sha256"] = canonical_sha(snapshot)
    diagnostics = {
        "schema_version": "google-cloud-api-diagnostics-v1",
        "status": snapshot["status"],
        "provider": snapshot["provider"],
        "operation": snapshot["operation"],
        "failure": failure,
        "credential_secret_name": BUNDLE_ENV,
        "credential_secret_value_exposed": False,
    }
    summary = "\\n".join([
        "# API_GCP_BLOCKED", "", f"- Task ID: `{snapshot['task_id']}`",
        f"- Provider: `{snapshot['provider']}`", f"- Operation: `{snapshot['operation']}`",
        f"- Snapshot SHA256: `{snapshot['snapshot_sha256']}`", "- Model calls: `0`",
        f"- Error code: `{failure['code']}`", f"- Message: {message}", "",
    ])
    write_json(output_dir / "gcp-snapshot.json", snapshot)
    write_json(output_dir / "gcp-diagnostics.json", diagnostics)
    (output_dir / "gcp-summary.md").write_text(summary, encoding="utf-8")
    write_json(output_dir / "artifact-manifest.json", {
        "schema_version": "google-cloud-artifact-manifest-v1",
        "files": ["ticket.json", "ticket-status.json", "gcp-snapshot.json", "gcp-diagnostics.json", "gcp-summary.md"],
        "snapshot_sha256": snapshot["snapshot_sha256"],
        "secret_values_included": False,
    })


def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--blocked-target", choices=["gcp"])
    parser.add_argument("--ticket")
    parser.add_argument("--output-dir")
    args = parser.parse_args()
    raw = str(os.getenv(BUNDLE_ENV) or "")
    if args.blocked_target:
        if not args.ticket or not args.output_dir:
            parser.error("--ticket and --output-dir are required with --blocked-target")
        generate_blocked_artifact(ticket_path=Path(args.ticket), output_dir=Path(args.output_dir), raw_bundle=raw)
        return 0
    github_env = str(os.getenv("GITHUB_ENV") or "").strip()
    if not github_env:
        raise RuntimeError("GITHUB_ENV is required")
    export_runtime(raw, Path(github_env))
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''',
          )

          write(
