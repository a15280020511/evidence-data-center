              '''name: Validate BigQuery and Earth Engine Providers

on:
  pull_request:
    paths:
      - "api-center/google-cloud/**"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/google-cloud-api-ticket.yml"
      - ".github/workflows/google-cloud-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/google-cloud/**"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/google-cloud-api-ticket.yml"
      - ".github/workflows/google-cloud-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-google-cloud-providers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-google-cloud-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api-center/google-cloud/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt -r api-center/google-cloud/requirements.txt
          python -m pip check
      - name: Audit managed provider dependencies
        run: python -m pip_audit -r api-center/google-cloud/requirements.txt
      - name: Compile and run managed provider tests with coverage
        run: |
          python -m py_compile api-center/google-cloud/google_cloud_task.py api-center/google-cloud/unified_google_credentials.py api-center/google-cloud/tests/*.py
          coverage erase
          coverage run --source=api-center/google-cloud -m unittest discover -s api-center/google-cloud/tests -p 'test_*.py' -v
          coverage report --skip-empty
          coverage json -o google-cloud-coverage.json
      - name: Validate provider catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/google-cloud')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert catalog['required_secret_environment_variables'] == ['GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON']
          assert catalog['credential_bundle_contract']['required'] == ['service_account']
          providers = {row['provider_id']: row for row in catalog['providers']}
          assert set(providers) == {'bigquery', 'earth-engine'}
          assert len(providers['bigquery']['operations']) == 7
          assert len(providers['earth-engine']['operations']) == 6
          assert all(row['required_secret_environment_variable'] == 'GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON' for row in providers.values())
          print(json.dumps({'status': 'PASS', 'managed_providers': 2, 'operations': 13, 'repository_secrets': 1}))
          PY
      - name: Verify secret bindings and credential material
        run: |
          set -euo pipefail
          count=$(grep -R --line-number --fixed-strings 'secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON' .github/workflows/google-cloud-api-ticket.yml | wc -l)
          test "$count" -eq 1
          if grep -R --line-number --extended-regexp -- '-----BEGIN (RSA )?PRIVATE KEY-----' api-center/google-cloud; then exit 1; fi
          if grep -R --line-number --extended-regexp 'ya29\\.[A-Za-z0-9._-]+' api-center/google-cloud; then exit 1; fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
