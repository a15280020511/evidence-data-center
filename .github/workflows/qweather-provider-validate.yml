name: Validate QWeather Provider

on:
  pull_request:
    paths:
      - "api-center/qweather/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/qweather-api-ticket.yml"
      - ".github/workflows/qweather-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/qweather/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/qweather-api-ticket.yml"
      - ".github/workflows/qweather-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-qweather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/qweather/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/qweather/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/qweather/qweather_task.py \
            api-center/qweather/tests/*.py
          python -m unittest discover -s api-center/qweather/tests -p 'test_*.py' -v

      - name: Validate fixed Host and security contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/qweather')
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'qweather'
          assert provider['ticket_prefix'] == '[api-qweather]'
          assert provider['required_secret_environment_variable'] == 'QWEATHER_API_KEY'
          assert provider['official_origin'] == 'https://ka6r72kcc3.re.qweatherapi.com'
          assert len(provider['operations']) == 18
          limits = provider['limits']
          assert limits['fixed_api_host'] == 'ka6r72kcc3.re.qweatherapi.com'
          for key in (
              'arbitrary_urls_allowed', 'arbitrary_hosts_allowed',
              'arbitrary_paths_allowed', 'arbitrary_headers_allowed',
              'client_supplied_api_key_allowed', 'redirects_allowed',
              'write_operations_allowed', 'personal_data_allowed',
              'secret_values_exposed',
          ):
              assert limits[key] is False, key
          assert limits['requests_per_ticket_max'] == 2
          serialized = json.dumps(catalog, ensure_ascii=False)
          assert 'api.qweather.com' not in serialized
          assert 'devapi.qweather.com' not in serialized
          assert 'geoapi.qweather.com' not in serialized
          print(json.dumps({
              'status': 'PASS',
              'provider': 'qweather',
              'operations': 18,
              'host': limits['fixed_api_host'],
              'secret': 'QWEATHER_API_KEY',
          }))
          PY
          git diff --check
