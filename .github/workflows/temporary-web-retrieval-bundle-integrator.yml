name: Temporary Web Retrieval Bundle Integrator

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-build-web-retrieval]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/jina-exa-web-retrieval
          persist-credentials: true
          fetch-depth: 0

      - name: Verify and decode reviewed bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path

          parts = sorted(Path('.integration').glob('web-retrieval.bundle.part*'))
          if [path.name for path in parts] != [f'web-retrieval.bundle.part{i:02d}' for i in range(6)]:
              raise SystemExit('expected six ordered bundle parts')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          if digest != '656b7868284471c501d221abcef14ef73fc561e3b5df85808b929b102700388f':
              raise SystemExit(f'bundle SHA256 mismatch: {digest}')
          bundle = Path('/tmp/web-retrieval-bundle.zip')
          bundle.write_bytes(raw)
          with zipfile.ZipFile(bundle) as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('unsafe bundle path')
              archive.extractall('.')
          PY
          python integrate.py
          rm -f integrate.py
          rm -rf .integration

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/web-retrieval/requirements.txt
          python -m pip check

      - name: Generate catalog and validate
        run: |
          set -euo pipefail
          python api-center/build_catalog.py
          python -m compileall -q api-center
          python -m unittest discover -s api-center/web-retrieval/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          assert catalog['managed_provider_count'] == 11
          assert catalog['enabled_managed_provider_count'] == 11
          assert catalog['managed_operation_count'] == 104
          assert {'jina-reader', 'exa'}.issubset(providers)
          assert providers['jina-reader']['optional_secret_environment_variable_name'] == 'JINA_API_KEY'
          assert providers['exa']['required_secret_environment_variable_name'] == 'EXA_API_KEY'
          result = {
              'providers': catalog['managed_provider_count'],
              'operations': catalog['managed_operation_count'],
              'parameters': catalog['exposed_parameter_count'],
              'status': 'PASS',
          }
          Path('/tmp/web-result.json').write_text(json.dumps(result), encoding='utf-8')
          print(json.dumps(result))
          PY

      - name: Commit integrated branch
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api-center .github/workflows .integration
          git commit -m "feat: integrate Jina Reader and Exa web retrieval providers"
          git push origin HEAD:feat/jina-exa-web-retrieval
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish completion
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="STATUS=completed
SHA=${{ steps.commit.outputs.sha }}
CATALOG=$(cat /tmp/web-result.json)
JINA_OPTIONAL_SECRET=JINA_API_KEY
EXA_SECRET=EXA_API_KEY
SECRET_VALUES_READ=false"

      - name: Publish failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="STATUS=failed
RUN_ID=${GITHUB_RUN_ID}
The Jina/Exa integration branch was not declared production-ready."
