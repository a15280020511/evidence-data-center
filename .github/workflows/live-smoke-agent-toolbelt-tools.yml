name: Live Smoke Agent Toolbelt Representative Tools

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/live-smoke-agent-toolbelt-tools.yml"

permissions:
  contents: read

concurrency:
  group: live-smoke-agent-toolbelt-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_TOOLBELT_KEY: ${{ secrets.AGENT_TOOLBELT_KEY }}
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Execute representative tools
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +x
          mkdir -p agent-toolbelt-tools-artifacts
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://www.agenttoolbelt.live"
          OUT = Path("agent-toolbelt-tools-artifacts")
          KEY = os.environ.get("AGENT_TOOLBELT_KEY", "").strip()
          report = {
              "schema_version": "agent-toolbelt-representative-tools-v1",
              "tested_at": datetime.now(timezone.utc).isoformat(),
              "origin": BASE,
              "credential_present": bool(KEY),
              "credential_prefix_valid": KEY.startswith("atb_"),
              "secret_values_exposed": False,
              "tests": {},
          }

          def call(path: str, body=None, auth=True):
              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "evidence-data-center-agent-toolbelt-smoke/1.0",
              }
              if auth:
                  headers["Authorization"] = f"Bearer {KEY}"
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode("utf-8")
              method = "GET" if body is None else "POST"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read(2_000_000)
                      return response.status, json.loads(raw.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  raw = exc.read(100_000).decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"error": raw[:1000]}
                  return exc.code, payload

          failures = []
          if not KEY:
              report["status"] = "FAIL"
              report["failures"] = ["missing_secret"]
              OUT.joinpath("summary.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              sys.exit(1)

          # 1. Token counting
          status, payload = call("/api/tools/token-counter", {
              "text": "福建福州天气与商业数据证据包，需要控制上下文成本。",
              "models": ["gpt-4o", "claude-3-5-sonnet"]
          })
          result = payload.get("result", {}) if isinstance(payload, dict) else {}
          report["tests"]["token_counter"] = {
              "http_status": status,
              "success": payload.get("success") if isinstance(payload, dict) else None,
              "character_count": result.get("characterCount"),
              "word_count": result.get("wordCount"),
              "result_models": sorted((result.get("results") or {}).keys()),
          }
          if status != 200 or payload.get("success") is not True:
              failures.append("token_counter")

          # 2. Structured extraction
          status, payload = call("/api/tools/text-extractor", {
              "text": "请在2026-08-05前联系 analyst@example.com，预算为¥12,500，资料见 https://example.com/report 。",
              "extractors": ["emails", "urls", "dates", "currencies"],
              "deduplicate": True
          })
          result = payload.get("result", {}) if isinstance(payload, dict) else {}
          extracted = result.get("extracted", {}) if isinstance(result, dict) else {}
          report["tests"]["text_extractor"] = {
              "http_status": status,
              "success": payload.get("success") if isinstance(payload, dict) else None,
              "extracted": extracted,
              "summary": result.get("summary") if isinstance(result, dict) else None,
          }
          if status != 200 or payload.get("success") is not True:
              failures.append("text_extractor")

          # 3. CSV normalization
          status, payload = call("/api/tools/csv-to-json", {
              "csv": "city,temp_c,rain_mm\n福州,35.6,0\n厦门,32.1,4.2\n",
              "delimiter": "auto",
              "hasHeader": True,
              "typeCast": True,
              "limit": 10,
              "skipEmptyRows": True
          })
          result = payload.get("result", {}) if isinstance(payload, dict) else {}
          report["tests"]["csv_to_json"] = {
              "http_status": status,
              "success": payload.get("success") if isinstance(payload, dict) else None,
              "row_count": result.get("rowCount") if isinstance(result, dict) else None,
              "headers": result.get("headers") if isinstance(result, dict) else None,
              "rows": result.get("rows") if isinstance(result, dict) else None,
              "column_types": result.get("columnTypes") if isinstance(result, dict) else None,
          }
          if status != 200 or payload.get("success") is not True:
              failures.append("csv_to_json")

          # 4. OSV-backed dependency audit: intentionally old lodash version.
          status, payload = call("/api/tools/dependency-auditor", {
              "packages": [{"name": "lodash", "version": "4.17.19", "ecosystem": "npm"}],
              "minSeverity": "LOW"
          })
          result = payload.get("result", {}) if isinstance(payload, dict) else {}
          summary = result.get("summary", {}) if isinstance(result, dict) else {}
          vulnerable = result.get("vulnerable", []) if isinstance(result, dict) else []
          vulnerability_ids = []
          for package in vulnerable:
              for vulnerability in package.get("vulnerabilities", []):
                  if vulnerability.get("id"):
                      vulnerability_ids.append(vulnerability["id"])
          report["tests"]["dependency_auditor"] = {
              "http_status": status,
              "success": payload.get("success") if isinstance(payload, dict) else None,
              "summary": summary,
              "vulnerability_ids": vulnerability_ids[:20],
          }
          if status != 200 or payload.get("success") is not True:
              failures.append("dependency_auditor")

          # 5. Proves Agent Toolbelt server itself fetches an external public URL.
          status, payload = call("/api/tools/web-summarizer", {
              "url": "https://www.agenttoolbelt.live",
              "mode": "summary",
              "focus": "What services and tool categories are offered?",
              "maxContentLength": 12000,
              "timeout": 20
          })
          result = payload.get("result", {}) if isinstance(payload, dict) else {}
          summary_obj = result.get("summary", {}) if isinstance(result, dict) else {}
          report["tests"]["web_summarizer"] = {
              "http_status": status,
              "success": payload.get("success") if isinstance(payload, dict) else None,
              "final_url": result.get("finalUrl") if isinstance(result, dict) else None,
              "status_code": result.get("statusCode") if isinstance(result, dict) else None,
              "title": summary_obj.get("title") if isinstance(summary_obj, dict) else None,
              "summary": summary_obj.get("summary") if isinstance(summary_obj, dict) else None,
              "key_points": summary_obj.get("keyPoints") if isinstance(summary_obj, dict) else None,
              "truncated": result.get("truncated") if isinstance(result, dict) else None,
          }
          if status != 200 or payload.get("success") is not True:
              failures.append("web_summarizer")

          report["status"] = "PASS" if not failures else "FAIL"
          report["failures"] = failures
          OUT.joinpath("summary.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": report["status"],
              "tests": len(report["tests"]),
              "failures": failures,
              "secret_values_exposed": False,
          }))
          sys.exit(0 if not failures else 1)
          PY

      - name: Verify credential is absent from evidence
        if: always()
        shell: bash
        run: |
          set +x
          test -f agent-toolbelt-tools-artifacts/summary.json
          if [ -n "${AGENT_TOOLBELT_KEY:-}" ] && grep -Fq -- "$AGENT_TOOLBELT_KEY" agent-toolbelt-tools-artifacts/summary.json; then
            echo "Credential value found in evidence"
            exit 1
          fi

      - name: Upload representative tool evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-toolbelt-representative-tools-${{ github.run_id }}
          path: agent-toolbelt-tools-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Mark failed smoke
        if: steps.smoke.outcome != 'success'
        run: exit 1
