name: Integrate Gapup MCP Into Intelligence Center

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - ".github/workflows/gapup-mcp-discovery.yml"
      - ".github/gapup-mcp-discovery-trigger.txt"
      - ".github/scripts/integrate_gapup_mcp.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Read official tools/list without credentials
        run: |
          set -euo pipefail
          mkdir -p gapup-discovery
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://mcp.gapup.io/mcp"
          payload = json.dumps({"jsonrpc":"2.0","method":"tools/list","id":1}).encode()
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
                  "User-Agent": "intelligence-center-gapup-integration/1",
              },
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              raw = response.read(20_000_001)
              if len(raw) > 20_000_000:
                  raise SystemExit("Gapup tools/list response exceeds 20 MB")
              content_type = response.headers.get("Content-Type", "")
              status = response.status

          text = raw.decode("utf-8")
          if "text/event-stream" in content_type.lower() or text.lstrip().startswith(("event:", "data:")):
              events = []
              data_lines = []
              for line in text.splitlines() + [""]:
                  if line.startswith("data:"):
                      data_lines.append(line[5:].lstrip())
                  elif not line.strip() and data_lines:
                      data = "\n".join(data_lines)
                      data_lines = []
                      if data and data != "[DONE]":
                          events.append(json.loads(data))
              if not events:
                  raise SystemExit("empty Gapup SSE response")
              parsed = events[-1]
          else:
              parsed = json.loads(text)

          tools = parsed.get("result", {}).get("tools")
          if not isinstance(tools, list) or len(tools) != 271:
              raise SystemExit(f"expected 271 tools, received {len(tools or [])}")
          names = [str(row.get("name") or "") for row in tools]
          if any(not name for name in names) or len(names) != len(set(names)):
              raise SystemExit("empty or duplicate Gapup tool names")

          snapshot = {
              "schema_version": "gapup-mcp-discovery-v1",
              "endpoint": url,
              "http_status": status,
              "content_type": content_type,
              "tool_count": len(tools),
              "tools": tools,
              "secret_values_exposed": False,
              "business_tool_calls": 0,
          }
          Path("gapup-discovery/tools-list.json").write_text(
              json.dumps(snapshot, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": "PASS",
              "tool_count": len(tools),
              "business_tool_calls": 0,
              "secret_values_exposed": False,
          }))
          PY

      - name: Generate fixed Gapup provider and rename center
        run: |
          set -euo pipefail
          python .github/scripts/integrate_gapup_mcp.py
          python - <<'PY'
          from pathlib import Path

          path = Path("api-center/gapup-mcp/tests/test_gapup_mcp_task.py")
          text = path.read_text(encoding="utf-8")
          old = '"company_description": "public supermarket retailer"'
          new = '"company_description": "Publicly listed supermarket and omnichannel retail operator serving consumers through physical stores, supply-chain services, and digital commerce."'
          if old not in text:
              raise SystemExit("Gapup test fixture replacement anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/gapup-mcp/requirements.txt
          python -m pip check

      - name: Rebuild deterministic intelligence catalog
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py

      - name: Validate generated provider and repository contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_catalog.py \
            api-center/build_catalog_market_search.py \
            api-center/managed_provider_runtime.py \
            api-center/gapup-mcp/gapup_mcp_task.py \
            api-center/gapup-mcp/tests/*.py \
            api-center/tests/*.py
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/gapup-mcp')
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          ticket_schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(ticket_schema)
          provider = catalog['providers'][0]
          for operation in provider['operations']:
              Draft202012Validator.check_schema(operation['parameter_schema'])
          ids = {row['operation_id'] for row in provider['operations']}
          assert len(ids) == 209
          assert provider['limits']['fixed_mcp_tool_count'] == 208
          assert provider['limits']['blocked_tool_count'] == 63
          assert provider['limits']['automatic_x402_payment_allowed'] is False
          assert provider['limits']['async_jobs_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          print(json.dumps({'status':'PASS','operation_schemas':len(ids)}))
          PY
          python -m unittest discover -s api-center/gapup-mcp/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          python api-center/build_catalog_market_search.py
          git diff --check
          ! git grep -nE 'gpk_[A-Za-z0-9_-]{12,}' -- ':!api-center/gapup-mcp/tests/**' ':!.github/scripts/integrate_gapup_mcp.py'

      - name: Stage workflow templates and remove non-workflow one-shot files
        run: |
          set -euo pipefail
          mkdir -p api-center/gapup-mcp/.workflow-templates
          cp .github/workflows/api-catalog-validate.yml api-center/gapup-mcp/.workflow-templates/api-catalog-validate.yml
          cp .github/workflows/gapup-mcp-api-ticket.yml api-center/gapup-mcp/.workflow-templates/gapup-mcp-api-ticket.yml
          cp .github/workflows/gapup-mcp-provider-validate.yml api-center/gapup-mcp/.workflow-templates/gapup-mcp-provider-validate.yml
          git restore --source=HEAD -- .github/workflows/api-catalog-validate.yml
          rm -f .github/workflows/gapup-mcp-api-ticket.yml .github/workflows/gapup-mcp-provider-validate.yml
          rm -rf gapup-discovery
          rm -f .github/scripts/integrate_gapup_mcp.py .github/gapup-mcp-discovery-trigger.txt

      - name: Commit integrated intelligence provider
        run: |
          set -euo pipefail
          git config user.name "a15280020511"
          git config user.email "270211234+a15280020511@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat: add Gapup MCP and rename API center to intelligence center"
          git push origin HEAD:${{ github.head_ref }}
