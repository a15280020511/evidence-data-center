name: Sync Market Search Generated Catalog

on:
  pull_request:
    branches: [main]
    paths:
      - "api-center/market-search/**"
      - "api-center/build_catalog_market_search.py"
      - ".github/workflows/sync-market-search-catalog.yml"

permissions:
  contents: write

concurrency:
  group: sync-market-search-catalog-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync-generated-catalog:
    if: >-
      github.actor == github.repository_owner &&
      github.head_ref == 'feat/tickflow-serpapi'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Install catalog dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check

      - name: Generate deterministic catalog
        run: python api-center/build_catalog_market_search.py

      - name: Commit generated files
        run: |
          set -euo pipefail
          git add api-center/api-catalog.json api-center/api-catalog.md
          if git diff --cached --quiet; then
            echo "Generated catalog already synchronized."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(api-center): regenerate TickFlow and SerpAPI catalog"
          git push origin HEAD:${GITHUB_HEAD_REF}
