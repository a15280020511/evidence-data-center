name: Temporary fix World Bank route conflict

on:
  push:
    branches: [feat/yuandian-legal-api]

permissions:
  contents: write

concurrency:
  group: temporary-worldbank-route-fix
  cancel-in-progress: false

jobs:
  regenerate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Rebuild, test, and validate KrakenD routes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check
          python api-center/build_config.py
          python api-center/build_catalog.py
          python -m unittest discover -s api-center/tests -v
          image="$(awk 'toupper($1) == "FROM" {print $2; exit}' api-center/Dockerfile)"
          [[ "$image" =~ ^krakend:[^@]+@sha256:[0-9a-f]{64}$ ]]
          docker pull "$image"
          docker run --rm -v "$PWD/api-center:/etc/krakend:ro" "$image" check -tnc /etc/krakend/krakend.validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          validation = json.loads(Path('api-center/krakend.validation.json').read_text(encoding='utf-8'))
          paths = {row['endpoint'] for row in validation['endpoints']}
          assert '/data/worldbank/indicator-metadata/{indicator_code}' in paths
          assert '/data/worldbank/indicator/{country_code}/{indicator_code}' in paths
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          assert catalog['connector_count'] == 69
          assert catalog['managed_provider_count'] == 7
          assert catalog['managed_operation_count'] == 93
          assert catalog['exposed_parameter_count'] == 647
          assert catalog['secret_values_exposed'] is False
          print({'status': 'PASS', 'catalog_sha256': catalog['catalog_sha256']})
          PY
          git diff --check

      - name: Commit deterministic generated contracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md api-center/connector-manifest.json api-center/krakend.tmpl api-center/krakend.validation.json
          if git diff --cached --quiet; then
            echo "Generated contracts already current"
          else
            git commit -m "fix: disambiguate World Bank API routes"
            git push origin HEAD:feat/yuandian-legal-api
          fi
