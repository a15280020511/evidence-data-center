name: Unify Google credential secret migration issue trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: unify-google-credentials-secret-issue
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance] unify-google-credentials')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Migrate every Google provider to one repository Secret
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = "GOOGLE_CREDENTIALS_JSON"
          new = "GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON"
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              replaced = text.replace(old, new)
              if replaced != text:
                  path.write_text(replaced, encoding="utf-8")

          path = Path("api-center/google-cloud/unified_google_credentials.py")
          text = path.read_text(encoding="utf-8")
          old_block = '''    service_account = value.get("service_account")
    api_key = str(value.get("data_commons_api_key") or "").strip()
    if not isinstance(service_account, Mapping):
        raise RuntimeError(f"{BUNDLE_ENV}.service_account must be a JSON object")
    required = {
        "type",
        "project_id",
        "private_key_id",
        "private_key",
        "client_email",
        "token_uri",
    }
    missing = sorted(required - set(service_account))
    if missing:
        raise RuntimeError(
            f"{BUNDLE_ENV}.service_account is missing fields: {missing}"
        )
    if str(service_account.get("type") or "") != "service_account":
        raise RuntimeError(
            f"{BUNDLE_ENV}.service_account.type must be service_account"
        )
    if not api_key:
        raise RuntimeError(f"{BUNDLE_ENV}.data_commons_api_key is required")
    return dict(service_account), api_key
'''
          new_block = '''    nested_service_account = value.get("service_account")
    if isinstance(nested_service_account, Mapping):
        service_account = dict(nested_service_account)
        api_key = str(value.get("data_commons_api_key") or "").strip()
        service_account_path = f"{BUNDLE_ENV}.service_account"
    else:
        service_account = dict(value)
        api_key = str(service_account.pop("data_commons_api_key", "") or "").strip()
        service_account_path = BUNDLE_ENV
    required = {
        "type",
        "project_id",
        "private_key_id",
        "private_key",
        "client_email",
        "token_uri",
    }
    missing = sorted(required - set(service_account))
    if missing:
        raise RuntimeError(
            f"{service_account_path} is missing service-account fields: {missing}"
        )
    if str(service_account.get("type") or "") != "service_account":
        raise RuntimeError(f"{service_account_path}.type must be service_account")
    if not api_key:
        raise RuntimeError(f"{BUNDLE_ENV}.data_commons_api_key is required")
    return service_account, api_key
'''
          if old_block not in text:
              raise SystemExit("unified credential parser block did not match expected source")
          path.write_text(text.replace(old_block, new_block), encoding="utf-8")

          test_path = Path("api-center/google-cloud/tests/test_unified_google_credentials.py")
          test_text = test_path.read_text(encoding="utf-8")
          anchor = '''    def test_missing_bundle_is_rejected(self) -> None:
'''
          addition = '''    def test_parse_compact_single_secret_object(self) -> None:
        value = json.loads(self.bundle())
        compact = dict(value["service_account"])
        compact["data_commons_api_key"] = value["data_commons_api_key"]
        service_account, api_key = module.parse_bundle(json.dumps(compact))
        self.assertEqual(service_account["project_id"], "valid-project-123")
        self.assertNotIn("data_commons_api_key", service_account)
        self.assertEqual(api_key, "test-placeholder-key")

'''
          if addition not in test_text:
              if anchor not in test_text:
                  raise SystemExit("test insertion anchor not found")
              test_path.write_text(test_text.replace(anchor, addition + anchor), encoding="utf-8")
          PY

      - name: Rebuild deterministic API contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py

      - name: Run Google and API catalog regression tests
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/google-cloud/unified_google_credentials.py \
            api-center/google-cloud/google_cloud_task.py \
            api-center/data-commons/data_commons_task.py \
            api-center/build_config.py \
            api-center/build_catalog.py \
            api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/google-cloud/tests -v
          python -m unittest discover -s api-center/data-commons/tests -v
          python -m unittest discover -s api-center/tests -v
          ! git grep -n 'GOOGLE_CREDENTIALS_JSON'
          git grep -n 'GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON'

      - name: Remove bootstraps and commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/unify-google-credentials-main-bootstrap.yml \
            .github/workflows/unify-google-credentials-issue-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(api-center): unify all Google providers on one secret'
          git push origin HEAD:main
