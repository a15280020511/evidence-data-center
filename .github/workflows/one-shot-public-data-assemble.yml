name: One Shot Public Data Assembly
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: one-shot-public-data-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-public-data-assemble]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FEATURE_BRANCH: feat/public-data-geospatial-china-20260803
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/public-data-geospatial-china-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assemble and patch source
        run: python .migration/assemble_public_data.py
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/public-data-geospatial/requirements.txt
          python -m pip check
      - name: Compile and provider tests
        run: |
          python -m py_compile api-center/public-data-geospatial/public_data_geospatial_task.py
          python -m unittest discover -s api-center/public-data-geospatial/tests -p 'test_*.py'
      - name: Regenerate and verify complete catalog
        run: |
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py'
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py'
      - name: Commit feature branch
        run: |
          rm -rf .migration
          rm -f .github/workflows/public-data-geospatial-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate public data geospatial and China sources"
          git push origin HEAD:${FEATURE_BRANCH}
      - name: Report success
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "PUBLIC_DATA_ASSEMBLY_PASS"
      - name: Report failure
        if: failure()
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "PUBLIC_DATA_ASSEMBLY_FAILED run=${GITHUB_RUN_ID}"
