name: Validate Google Public Intelligence

on:
  pull_request:
    paths:
      - 'api-center/google-public-intelligence/**'
      - 'api-center/global-knowledge-archives/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/google-public-intelligence-*.yml'
      - '.github/workflows/global-knowledge-archives-*.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/google-public-intelligence/**'
      - 'api-center/global-knowledge-archives/**'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/google-public-intelligence-*.yml'
      - '.github/workflows/global-knowledge-archives-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-google-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/google-public-intelligence/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/google-public-intelligence/requirements.txt
          python -m pip check
      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/google-public-intelligence/google_public_intelligence_task.py
          PYTHONPATH=api-center/google-public-intelligence:api-center python -m unittest discover -s api-center/google-public-intelligence/tests -p 'test_*.py' -v
      - name: Verify frozen provider and aggregate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider=json.loads(Path('api-center/google-public-intelligence/provider-catalog.json').read_text())['providers'][0]
          quota=json.loads(Path('api-center/google-public-intelligence/quota-policy.json').read_text())
          aggregate=json.loads(Path('api-center/api-catalog.json').read_text())
          operations=[row['operation_id'] for row in provider['operations']]
          assert len(operations)==9
          assert len(set(operations))==9
          assert provider['required_secret_environment_variable']=='GOOGLE_PUBLIC_INTELLIGENCE_API_KEY'
          assert provider['limits']['requests_per_ticket_max']==1
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['automatic_retries_allowed'] is False
          assert provider['limits']['paid_fallback_authorized'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert quota['policy']['free_only'] is True
          assert quota['policy']['service_permanence_guaranteed'] is False
          rows={row['provider_id']:row for row in aggregate['managed_providers']}
          assert rows['google-public-intelligence']['operation_count']==9
          assert rows['google-public-intelligence']['required_secret_environment_variable_name']=='GOOGLE_PUBLIC_INTELLIGENCE_API_KEY'
          assert aggregate['managed_provider_count']==len(rows)
          assert aggregate['managed_operation_count']==sum(row['operation_count'] for row in rows.values())
          assert aggregate['secret_values_exposed'] is False
          PY
          python api-center/build_catalog_market_search.py --json-output /tmp/api-catalog.json --markdown-output /tmp/api-catalog.md
          cmp /tmp/api-catalog.json api-center/api-catalog.json
          cmp /tmp/api-catalog.md api-center/api-catalog.md
          git diff --check

  live-read-only-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOOGLE_PUBLIC_INTELLIGENCE_API_KEY: ${{ secrets.GOOGLE_PUBLIC_INTELLIGENCE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/google-public-intelligence/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/google-public-intelligence/requirements.txt
          python -m pip check
      - name: Build four bounded live tickets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          common={
            'provider':'google-public-intelligence',
            'data_policy':{'classification':'public','contains_personal_data':False,'contains_confidential_data':False},
          }
          tickets={
            'youtube':{**common,'task_id':'google-live-youtube','operation':'youtube-search-videos','objective':'Verify public YouTube search.','parameters':{'query':'中国经济','max_results':1,'order':'relevance'},'acceptance':{'timeout_seconds':60,'max_response_bytes':500000,'max_rows':1}},
            'factcheck':{**common,'task_id':'google-live-factcheck','operation':'factcheck-search','objective':'Verify public fact-check search.','parameters':{'query':'climate change','page_size':1},'acceptance':{'timeout_seconds':60,'max_response_bytes':500000,'max_rows':1}},
            'pagespeed':{**common,'task_id':'google-live-pagespeed','operation':'pagespeed-analyze','objective':'Verify PageSpeed audit.','parameters':{'url':'https://web.dev','strategy':'mobile','categories':['performance']},'acceptance':{'timeout_seconds':120,'max_response_bytes':2000000,'max_rows':5}},
            'crux':{**common,'task_id':'google-live-crux','operation':'crux-query','objective':'Verify Chrome real-user metrics.','parameters':{'origin':'https://web.dev','metrics':['largest_contentful_paint']},'acceptance':{'timeout_seconds':60,'max_response_bytes':500000,'max_rows':5}},
          }
          root=Path('google-public-live')
          for name,ticket in tickets.items():
            folder=root/name
            folder.mkdir(parents=True,exist_ok=True)
            (folder/'ticket.json').write_text(json.dumps(ticket,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Execute four official read-only calls
        run: |
          for name in youtube factcheck pagespeed crux; do
            python api-center/google-public-intelligence/google_public_intelligence_task.py execute --ticket "google-public-live/$name/ticket.json" --output-dir "google-public-live/$name"
          done
      - name: Verify live evidence and secret hygiene
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('google-public-live')
          secret=os.environ['GOOGLE_PUBLIC_INTELLIGENCE_API_KEY'].encode()
          for name in ('youtube','factcheck','pagespeed','crux'):
            folder=root/name
            diagnostics=json.loads((folder/'diagnostics.json').read_text())
            snapshot=json.loads((folder/'snapshot.json').read_text())
            assert diagnostics['status']=='INTEL_GOOGLE_PUBLIC_COMPLETED', (name, diagnostics)
            assert diagnostics['failure'] is None
            assert diagnostics['model_calls']==0
            assert diagnostics['metadata']['requests_per_ticket']==1
            assert diagnostics['metadata']['paid_fallback_authorized'] is False
            assert diagnostics['metadata']['secret_values_exposed'] is False
            assert snapshot['data'] is not None
            for path in folder.iterdir():
              if path.is_file(): assert secret not in path.read_bytes(), path
          summary={'status':'PASS','services':['YouTube Data API v3','Fact Check Tools API','PageSpeed Insights API v5','Chrome UX Report API'],'request_count':4,'model_calls':0,'secret_values_exposed':False}
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: google-public-live-${{ github.run_id }}
          path: google-public-live/
          if-no-files-found: error
          retention-days: 30
