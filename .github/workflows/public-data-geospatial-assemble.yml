name: Assemble Public Data Geospatial Provider
on:
  push:
    branches: [feat/public-data-geospatial-china-20260803]
permissions:
  contents: write
concurrency:
  group: assemble-public-data-geospatial
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assemble staged source files
        run: |
          cat .migration/public-data-geospatial/provider.part* > api-center/public-data-geospatial/provider-catalog.json
          cat .migration/public-data-geospatial/task.part* > api-center/public-data-geospatial/public_data_geospatial_task.py
      - name: Register provider, repair SerpAPI locale contract, and update invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          build = "api-center/build_catalog_market_search.py"
          replace_once(build,
              'KNOWLEDGE_TOOLS_CATALOG = HERE / "knowledge-tools/provider-catalog.json"\n',
              'KNOWLEDGE_TOOLS_CATALOG = HERE / "knowledge-tools/provider-catalog.json"\nPUBLIC_DATA_GEOSPATIAL_CATALOG = HERE / "public-data-geospatial/provider-catalog.json"\n')
          replace_once(build,
              '    "llamaparse": 3,\n}',
              '    "llamaparse": 3,\n    "public-data-geospatial": 39,\n}')
          replace_once(build,
              '    KNOWLEDGE_TOOLS_CATALOG,\n)',
              '    KNOWLEDGE_TOOLS_CATALOG,\n    PUBLIC_DATA_GEOSPATIAL_CATALOG,\n)')
          replace_once(build,
              '        "knowledge-tools/provider-catalog.json",\n    ):',
              '        "knowledge-tools/provider-catalog.json",\n        "public-data-geospatial/provider-catalog.json",\n    ):')

          test = "api-center/tests/test_api_catalog.py"
          replace_once(test,
              '    "llamaparse": 3,\n}',
              '    "llamaparse": 3,\n    "public-data-geospatial": 39,\n}')
          replace_once(test, 'catalog["managed_provider_count"], 47', 'catalog["managed_provider_count"], 48')
          replace_once(test, 'catalog["enabled_managed_provider_count"], 47', 'catalog["enabled_managed_provider_count"], 48')
          replace_once(test, 'catalog["managed_operation_count"], 487', 'catalog["managed_operation_count"], 526')

          cap = "api-center/tests/test_capability_maximization.py"
          replace_once(cap,
              '            487,\n        )',
              '            526,\n        )')
          replace_once(cap,
              '            "llamaparse": 3,\n        }',
              '            "llamaparse": 3,\n            "public-data-geospatial": 39,\n        }')

          provider_path = Path("api-center/market-search/provider-catalog.json")
          catalog = json.loads(provider_path.read_text(encoding="utf-8"))
          changed = 0
          for provider in catalog.get("providers", []):
              if provider.get("provider_id") != "serpapi":
                  continue
              for operation in provider.get("operations", []):
                  prop = operation.get("parameter_schema", {}).get("properties", {}).get("hl")
                  if isinstance(prop, dict):
                      prop["type"] = "string"
                      prop["minLength"] = 2
                      prop["maxLength"] = 5
                      prop["pattern"] = "^[a-z]{2}(?:-[a-z]{2})?$"
                      changed += 1
          if not changed:
              raise SystemExit("SerpAPI hl schema was not found")
          provider_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          validate = Path(".github/workflows/public-data-geospatial-provider-validate.yml")
          text = validate.read_text(encoding="utf-8")
          old = "      - run: python api-center/build_catalog_market_search.py --check\n"
          new = "      - run: |\n          python api-center/build_catalog_market_search.py --json-output /tmp/api-catalog.json --markdown-output /tmp/api-catalog.md\n          diff -u api-center/api-catalog.json /tmp/api-catalog.json\n          diff -u api-center/api-catalog.md /tmp/api-catalog.md\n"
          if old not in text:
              raise SystemExit("validation workflow anchor missing")
          validate.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/public-data-geospatial/requirements.txt
          python -m pip check
      - name: Compile and test provider
        run: |
          python -m py_compile api-center/public-data-geospatial/public_data_geospatial_task.py
          python -m unittest discover -s api-center/public-data-geospatial/tests -p 'test_*.py'
      - name: Regenerate and verify complete catalog
        run: |
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py'
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py'
      - name: Commit assembled implementation
        run: |
          rm -rf .migration
          rm -f .github/workflows/public-data-geospatial-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate public data geospatial and China sources"
          git push origin HEAD:feat/public-data-geospatial-china-20260803
