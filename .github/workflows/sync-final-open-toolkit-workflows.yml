name: Sync Final Open Toolkit Workflows

on:
  push:
    branches: [feat/open-intelligence-toolkit-20260804]
    paths:
      - .github/workflows/sync-final-open-toolkit-workflows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-final-open-toolkit-workflows
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/open-intelligence-toolkit-20260804
      - name: Synchronize exact counts and SEC production status
        run: |
          set -euo pipefail
          sed -i "s/managed_operation_count.*== 758/managed_operation_count'] == sum(len(row['operations']) for row in providers.values()) == 756/" .github/workflows/api-catalog-validate.yml
          sed -i "s/'open-intelligence-toolkit': 22/'open-intelligence-toolkit': 20/" .github/workflows/api-catalog-validate.yml
          grep -F "== 756" .github/workflows/api-catalog-validate.yml
          grep -F "'open-intelligence-toolkit': 20" .github/workflows/api-catalog-validate.yml
          git diff --check
      - name: Commit synchronized workflow contracts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/api-catalog-validate.yml
          if git diff --cached --quiet; then
            echo 'No workflow synchronization required'
            exit 0
          fi
          git commit -m 'test: synchronize final 20-operation toolkit counts'
          git push origin HEAD:feat/open-intelligence-toolkit-20260804
