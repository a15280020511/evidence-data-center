name: Validate Xweather Provider

on:
  pull_request:
    paths:
      - "api-center/xweather/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/xweather-provider-validate.yml"
      - ".github/workflows/xweather-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/xweather/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/xweather-provider-validate.yml"
      - ".github/workflows/xweather-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/xweather/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/xweather/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/build_catalog.py api-center/managed_provider_runtime.py api-center/xweather/xweather_task.py api-center/xweather/tests/*.py
          python -m unittest discover -s api-center/xweather/tests -p 'test_*.py' -v

      - name: Validate fixed read-only contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/xweather')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'xweather'
          assert provider['required_secret_environment_variable'] == 'XWEATHER_CLIENT_SECRET'
          assert provider['required_repository_variable'] == 'XWEATHER_CLIENT_ID'
          assert len(provider['operations']) == 10
          assert provider['limits']['fixed_api_host'] == 'data.api.xweather.com'
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['arbitrary_query_parameters_allowed'] is False
          assert provider['limits']['client_supplied_credentials_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['secret_values_exposed'] is False
          print(json.dumps({'status': 'PASS', 'operations': 10}))
          PY

      - name: Verify repository contains no credential material
        run: |
          git diff --check
