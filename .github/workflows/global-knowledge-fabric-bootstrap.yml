name: Bootstrap Global Knowledge Fabric

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-global-knowledge-fabric
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'feat/global-knowledge-fabric-wave3-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/global-knowledge-fabric-wave3-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize provider and catalog integration
        env:
          P0: ""
          P1: ""
          P2: ""
        run: |
          python - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path
          payload=os.environ['P0']+os.environ['P1']+os.environ['P2']
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          for path, content in files.items():
              target=Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          build_path=Path('api-center/build_catalog_market_search.py')
          build=build_path.read_text(encoding='utf-8')
          marker='GLOBAL_KNOWLEDGE_ARCHIVES_CATALOG = HERE / "global-knowledge-archives/provider-catalog.json"\n'
          if 'GLOBAL_KNOWLEDGE_FABRIC_CATALOG' not in build:
              build=build.replace(marker, marker+'GLOBAL_KNOWLEDGE_FABRIC_CATALOG = HERE / "global-knowledge-fabric/provider-catalog.json"\n')
          expected='    "global-knowledge-archives": 9,\n'
          if '"global-knowledge-fabric": 9' not in build:
              build=build.replace(expected, expected+'    "global-knowledge-fabric": 9,\n')
          tuple_marker='    GLOBAL_KNOWLEDGE_ARCHIVES_CATALOG,\n'
          if '    GLOBAL_KNOWLEDGE_FABRIC_CATALOG,\n' not in build:
              build=build.replace(tuple_marker, tuple_marker+'    GLOBAL_KNOWLEDGE_FABRIC_CATALOG,\n')
          reading='        "global-knowledge-archives/provider-catalog.json",\n'
          if '"global-knowledge-fabric/provider-catalog.json"' not in build:
              build=build.replace(reading, reading+'        "global-knowledge-fabric/provider-catalog.json",\n')
          build_path.write_text(build, encoding='utf-8')
          test_path=Path('api-center/tests/test_api_catalog.py')
          test=test_path.read_text(encoding='utf-8')
          if '"global-knowledge-fabric": 9' not in test:
              test=test.replace(expected, expected+'    "global-knowledge-fabric": 9,\n')
          test_path.write_text(test, encoding='utf-8')
          inventory_path=Path('api-center/global-research-intelligence/source-inventory.json')
          inventory=json.loads(inventory_path.read_text(encoding='utf-8'))
          if not any(row.get('requested_name')=='global-knowledge-fabric' for row in inventory['items']):
              inventory['items'].append({'requested_name':'global-knowledge-fabric','classification':'third-wave governed entity, scholarly-relations, dataset, government-regulation, scientific and standards knowledge layer','decision':'integrate-new','implementation':'16 fixed HTTPS sources through 9 bounded read-only operations; existing Wikidata, scholarly, legal, international-organization and first/second-wave sources are mapped rather than duplicated'})
          inventory_path.write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Rebuild authoritative catalog and test
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-fabric/requirements.txt
          python api-center/build_catalog_market_search.py
          PYTHONPATH=api-center/global-knowledge-fabric:api-center \
            python api-center/global-knowledge-fabric/validate_global_knowledge_fabric.py \
              --output /tmp/global-knowledge-fabric-registry.json
          python -m unittest discover -s api-center/tests -p 'test_*.py'
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/global-knowledge-fabric-registry.json').read_text())
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['source_count']==16
          assert receipt['operation_count']==9
          assert catalog['managed_provider_count']==61
          assert catalog['managed_operation_count']==674
          PY
          git diff --check
      - name: Commit generated provider and catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-center/global-knowledge-fabric \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/global-research-intelligence/source-inventory.json \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m 'feat: add third-wave global knowledge fabric'
          git push origin HEAD:feat/global-knowledge-fabric-wave3-20260803
