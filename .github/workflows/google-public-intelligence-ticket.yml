name: Managed Google Public Intelligence

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-google-public-global
  cancel-in-progress: false

jobs:
  execute-google-public:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-google-public]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GOOGLE_PUBLIC_INTELLIGENCE_API_KEY: ${{ secrets.GOOGLE_PUBLIC_INTELLIGENCE_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/google-public-intelligence/requirements.txt
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/google-public-intelligence/requirements.txt
          python -m pip check
      - name: Compile control plane
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/google-public-intelligence/google_public_intelligence_task.py
      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: python api-center/google-public-intelligence/google_public_intelligence_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir google-public-artifacts
      - name: Publish acceptance or rejection
        if: always()
        run: |
          phase=rejected
          if [[ "${{ steps.prepare.outputs.accepted }}" == "true" ]]; then phase=accepted; fi
          python api-center/google-public-intelligence/google_public_intelligence_task.py render --output-dir google-public-artifacts --phase "$phase" > google-public-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@google-public-comment.md
      - name: Execute one bounded read-only operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/google-public-intelligence/google_public_intelligence_task.py execute --ticket google-public-artifacts/ticket.json --output-dir google-public-artifacts
      - name: Upload verified evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: google-public-${{ github.event.issue.number }}-${{ github.run_id }}
          path: google-public-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified result
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/google-public-intelligence/google_public_intelligence_task.py render --output-dir google-public-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > google-public-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@google-public-comment.md
      - name: Fail closed
        if: always() && (steps.prepare.outputs.accepted != 'true' || steps.execute.outputs.status != 'INTEL_GOOGLE_PUBLIC_COMPLETED' || steps.upload.outcome != 'success')
        run: exit 1
