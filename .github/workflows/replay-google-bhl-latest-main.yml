name: Replay Google Books and BHL on Latest Main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/replay-google-bhl-latest-main.yml'

permissions:
  contents: write

jobs:
  replay:
    if: github.event.pull_request.number == 753
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/retain-google-books-bhl-only-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Restore exact validated files
        run: |
          git fetch origin 2521b56aa165661da12ef042d88d5183405b80f8
          for path in \
            .github/workflows/global-knowledge-archives-ticket.yml \
            .github/workflows/global-knowledge-archives-validate.yml \
            api-center/global-knowledge-archives/global_knowledge_archives_task.py \
            api-center/global-knowledge-archives/provider-catalog.json \
            api-center/global-knowledge-archives/source-access-matrix.json \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py
          do
            git show 2521b56aa165661da12ef042d88d5183405b80f8:"$path" > "$path"
          done
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-knowledge-archives/requirements.txt
      - name: Validate and regenerate latest catalogs
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python -m pip check
          python -m py_compile \
            api-center/global-knowledge-archives/global_knowledge_archives_task.py \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py
          PYTHONPATH=api-center/global-knowledge-archives:api-center \
            python api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
              --output /tmp/global-knowledge-registry.json
          python api-center/build_catalog_market_search.py
          python -m pytest -q api-center/tests/test_api_catalog.py
          git diff --check
      - name: Commit exact replay and generated catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/global-knowledge-archives-ticket.yml \
            .github/workflows/global-knowledge-archives-validate.yml \
            api-center/global-knowledge-archives/global_knowledge_archives_task.py \
            api-center/global-knowledge-archives/provider-catalog.json \
            api-center/global-knowledge-archives/source-access-matrix.json \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m 'refactor: replay Google Books and BHL reduction on latest main'
          git push origin HEAD:fix/retain-google-books-bhl-only-v2
