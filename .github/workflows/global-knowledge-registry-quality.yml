name: Global Knowledge Registry Quality

on:
  pull_request:
    paths:
      - 'api-center/information-tool-radar/global-knowledge-sources.json'
      - 'api-center/information-tool-radar/global_knowledge_registry.py'
      - 'api-center/information-tool-radar/test_global_knowledge_registry.py'
      - 'api-center/information-tool-radar/GLOBAL_KNOWLEDGE_SOURCES.md'
      - '.github/workflows/global-knowledge-registry-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile registry tools
        run: |
          python -m py_compile \
            api-center/information-tool-radar/global_knowledge_registry.py \
            api-center/information-tool-radar/test_global_knowledge_registry.py
      - name: Run deterministic registry tests
        working-directory: api-center/information-tool-radar
        run: python test_global_knowledge_registry.py
      - name: Enforce registry policy
        run: |
          python api-center/information-tool-radar/global_knowledge_registry.py \
            --registry api-center/information-tool-radar/global-knowledge-sources.json \
            --output /tmp/global-knowledge-report.json \
            --enforce
          python - <<'PY'
          import json
          r=json.load(open('/tmp/global-knowledge-report.json', encoding='utf-8'))
          assert r['source_count'] >= 50
          assert r['shadow_metadata_source_count'] >= 7
          assert r['shadow_network_access_count'] == 0
          print({k:r[k] for k in ('source_count','category_count','runtime_available_count','shadow_metadata_source_count','shadow_network_access_count')})
          PY
