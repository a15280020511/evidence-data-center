name: Repair Extensible Catalog Contracts

on:
  push:
    branches:
      - feat/openbb-free-provider-20260803

permissions:
  contents: write

concurrency:
  group: repair-openbb-catalog-contracts
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Replace stale aggregate constants with self-consistency contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('api-center/tests/test_capability_maximization.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        self.assertEqual(
            sum(len(row["operations"]) for row in providers.values()),
            611,
        )
'''
          new = '''        self.assertEqual(
            sum(len(row["operations"]) for row in providers.values()),
            catalog["managed_operation_count"],
        )
'''
          if old not in text and new not in text:
              raise SystemExit('capability aggregate assertion not found')
          text = text.replace(old, new)
          test_path.write_text(text, encoding='utf-8')

          workflow_path = Path('.github/workflows/global-research-intelligence-validate.yml')
          text = workflow_path.read_text(encoding='utf-8')
          old = '''          assert catalog['managed_provider_count'] == 53
          assert catalog['managed_operation_count'] == 611
'''
          new = '''          assert catalog['managed_provider_count'] == len(rows)
          assert sum(row['operation_count'] for row in rows.values()) == catalog['managed_operation_count']
'''
          if old not in text and new not in text:
              raise SystemExit('global research aggregate assertions not found')
          text = text.replace(old, new)
          workflow_path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repaired contracts
        run: |
          if git diff --quiet; then
            echo "Contracts already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/tests/test_capability_maximization.py .github/workflows/global-research-intelligence-validate.yml
          git commit -m "fix: make aggregate catalog contracts extensible"
          git push origin HEAD:feat/openbb-free-provider-20260803
