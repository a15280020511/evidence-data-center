name: Managed Cloudflare Intelligence Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-cloudflare-global
  cancel-in-progress: false

jobs:
  execute-cloudflare:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-cloudflare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/cloudflare/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/cloudflare/requirements.txt
          python -m pip check

      - name: Compile provider and validate storage topology
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/cloudflare/cloudflare_task.py \
            api-center/huggingface/validate_storage_topology.py
          python api-center/huggingface/validate_storage_topology.py

      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: python api-center/cloudflare/cloudflare_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir cloudflare-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/cloudflare/cloudflare_task.py render --output-dir cloudflare-artifacts --phase accepted > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/cloudflare/cloudflare_task.py render --output-dir cloudflare-artifacts --phase rejected > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md

      - name: Execute one bounded request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/cloudflare/cloudflare_task.py execute --ticket cloudflare-artifacts/ticket.json --output-dir cloudflare-artifacts

      - name: Upload immutable GitHub evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: cloudflare-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/cloudflare/cloudflare_task.py render --output-dir cloudflare-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > provider-comment.md
          {
            echo
            echo '- Private Hugging Face archive executed: `false`'
            echo '- Long-term private storage authority: `a15280020511/decision-system-governance`'
            echo '- This Artifact remains evidence-center evidence and is not automatically a compute baseline batch.'
          } >> provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md

      - name: Mark rejected, failed, or unevidenced execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_CLOUDFLARE_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
