name: Validate Company Intelligence Providers

on:
  pull_request:
    paths:
      - "api-center/company-intelligence/**"
      - "api-center/miaoxiang/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/company-intelligence-api-ticket.yml"
      - ".github/workflows/company-intelligence-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/company-intelligence/**"
      - "api-center/miaoxiang/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/company-intelligence-api-ticket.yml"
      - ".github/workflows/company-intelligence-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-company-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-company-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api-center/company-intelligence/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements-dev.txt \
            -r api-center/company-intelligence/requirements.txt
          python -m pip check

      - name: Audit provider dependencies
        run: python -m pip_audit -r api-center/company-intelligence/requirements.txt

      - name: Compile and run provider tests
        run: |
          python -m py_compile \
            api-center/company-intelligence/company_intelligence_task.py \
            api-center/company-intelligence/tests/*.py
          coverage erase
          coverage run --source=api-center/company-intelligence -m unittest discover \
            -s api-center/company-intelligence/tests -p 'test_*.py' -v
          coverage report --skip-empty
          coverage json -o company-intelligence-coverage.json

      - name: Validate schemas and provider catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/company-intelligence')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert catalog['schema_version'] == 'china-commercial-provider-catalog-v1'
          assert catalog['secret_values_exposed'] is False
          providers = {row['provider_id']: row for row in catalog['providers']}
          assert set(providers) == {'tianyancha', 'miaoxiang'}
          assert 'qichacha' not in providers
          assert all(row['enabled'] is True for row in providers.values())
          assert providers['tianyancha']['required_secret_environment_variable'] == 'TIANYANCHA_API_TOKEN'
          assert providers['miaoxiang']['required_secret_environment_variable'] == 'MX_APIKEY'
          assert len(providers['tianyancha']['operations']) == 3
          assert len(providers['miaoxiang']['operations']) == 4
          assert schema['properties']['provider'] == {'const': 'tianyancha'}
          print(json.dumps({'status': 'PASS', 'providers': 2, 'operations': 7, 'qichacha': 'removed'}))
          PY

      - name: Verify Qichacha runtime and credential material are absent
        run: |
          set -euo pipefail
          if grep --line-number --ignore-case --extended-regexp \
            'qichacha|QICHACHA_CREDENTIALS_JSON|api\.qichacha\.com' \
            api-center/company-intelligence/company_intelligence_task.py \
            api-center/company-intelligence/provider-catalog.json \
            api-center/company-intelligence/ticket.schema.json \
            .github/workflows/company-intelligence-api-ticket.yml; then
            echo "Qichacha production reference remains" >&2
            exit 1
          fi
          if grep -R --line-number --extended-regexp -- '-----BEGIN (RSA )?PRIVATE KEY-----' api-center/company-intelligence; then
            echo "private key material found" >&2
            exit 1
          fi
          if grep -R --line-number --extended-regexp 'Authorization[[:space:]]*:[[:space:]]*[A-Za-z0-9._-]{12,}' api-center/company-intelligence; then
            echo "literal authorization token found" >&2
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: company-intelligence-provider-validation-${{ github.run_id }}
          path: |
            company-intelligence-coverage.json
            api-center/company-intelligence/provider-catalog.json
            api-center/company-intelligence/ticket.schema.json
          if-no-files-found: warn
          retention-days: 30
