name: Strategic Intelligence Provider Validate

on:
  pull_request:
    paths:
      - "api-center/strategic-intelligence/**"
      - ".github/workflows/strategic-intelligence-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/strategic-intelligence/**"
      - ".github/workflows/strategic-intelligence-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/strategic-intelligence/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/strategic-intelligence/requirements.txt \
            pytest==9.0.2
          python -m pip check
      - name: Compile
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/strategic-intelligence/strategic_intelligence_task.py
      - name: Unit tests
        run: python -m pytest -q api-center/strategic-intelligence/tests
      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('api-center/strategic-intelligence').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
