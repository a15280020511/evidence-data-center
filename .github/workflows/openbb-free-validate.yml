name: Validate OpenBB Free Provider

on:
  pull_request:
    paths:
      - "api-center/openbb-free/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/**"
      - ".github/workflows/openbb-free-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/openbb-free/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/**"
      - ".github/workflows/openbb-free-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-openbb-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        operation:
          - catalog-capabilities
          - provider-access-matrix
          - package-manifest
          - ecb-currency-reference-rates
          - federal-reserve-federal-funds-rate
          - federal-reserve-sofr
          - fama-french-factors
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/openbb-free/requirements.txt
      - name: Install pinned modular OpenBB runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/openbb-free/requirements.txt
          python -m pip check
      - name: Compile and execute zero-network fixture
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/openbb-free/openbb_free_task.py \
            api-center/openbb-free/validate_openbb_free.py
          mkdir -p openbb-free-validation
          PYTHONPATH=api-center/openbb-free:api-center \
            python api-center/openbb-free/validate_openbb_free.py \
              --operation "${{ matrix.operation }}" \
              --output "openbb-free-validation/${{ matrix.operation }}.json"
      - name: Verify governance receipt
        env:
          OPERATION: ${{ matrix.operation }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          operation = os.environ['OPERATION']
          row = json.loads((Path('openbb-free-validation') / f'{operation}.json').read_text(encoding='utf-8'))
          assert row['status'] == 'PASS'
          assert row['operation'] == operation
          assert row['network_used'] is False
          assert row['fixture_mode'] is True
          assert row['model_calls'] == 0
          assert row['secret_used'] is False
          assert row['secret_values_exposed'] is False
          assert row['package_manifest']['all_pins_satisfied'] is True
          assert row['package_manifest']['openbb_monolith_installed'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openbb-free-${{ matrix.operation }}-${{ github.run_id }}
          path: openbb-free-validation/
          if-no-files-found: warn
          retention-days: 30

  catalog-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install core dependency
        run: python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
      - name: Verify provider, access matrix and aggregate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider = json.loads(Path('api-center/openbb-free/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          schema = json.loads(Path('api-center/openbb-free/ticket.schema.json').read_text(encoding='utf-8'))
          matrix = json.loads(Path('api-center/openbb-free/provider-access-matrix.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          operations = [row['operation_id'] for row in provider['operations']]
          assert provider['provider_id'] == 'openbb-free'
          assert provider['ticket_prefix'] == '[intel-openbb-free]'
          assert provider['required_secret_environment_variable'] == ''
          assert len(operations) == len(set(operations)) == 7
          assert set(operations) == set(schema['properties']['operation']['enum'])
          assert provider['limits']['paid_provider_calls_allowed'] is False
          assert provider['limits']['trading_or_order_execution_allowed'] is False
          assert matrix['governance']['install_openbb_all'] is False
          assert matrix['installed_provider_ids'] == ['ecb', 'federal_reserve', 'famafrench']
          rows = {row['provider_id']: row for row in catalog['managed_providers']}
          assert rows['openbb-free']['operation_count'] == 7
          assert catalog['managed_provider_count'] == 54
          assert catalog['managed_operation_count'] == 618
          assert catalog['direct_center_to_center_calls_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          PY
          git diff --check
