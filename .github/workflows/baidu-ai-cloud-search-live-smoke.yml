name: Baidu Search-Only Live Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/baidu-ai-cloud-search-live-smoke.yml'

permissions:
  contents: read

concurrency:
  group: baidu-search-live-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  live-search:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BAIDU_AI_CLOUD_API_KEY: ${{ secrets.BAIDU_AI_CLOUD_API_KEY }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-center/baidu-ai-cloud/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baidu-ai-cloud/requirements.txt
          python -m pip check
      - name: Execute one real free web search
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ticket = {
              'task_id': 'baidu-search-only-live-smoke',
              'provider': 'baidu-ai-cloud',
              'operation': 'web-search',
              'objective': 'verify current key and final search-only execution path',
              'parameters': {
                  'query': '福建省人民政府 公开信息',
                  'top_k': 3,
                  'edition': 'standard',
                  'recency': 'year',
              },
              'data_policy': {
                  'classification': 'public',
                  'contains_personal_data': False,
                  'contains_confidential_data': False,
              },
              'acceptance': {
                  'timeout_seconds': 45,
                  'max_response_bytes': 500000,
                  'max_rows': 10,
              },
          }
          Path('baidu-live-ticket.json').write_text(
              json.dumps(ticket, ensure_ascii=False), encoding='utf-8'
          )
          PY
          python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py execute \
            --ticket baidu-live-ticket.json \
            --output-dir baidu-live-artifacts
      - name: Verify live evidence and secret hygiene
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('baidu-live-artifacts')
          diagnostics = json.loads((root / 'diagnostics.json').read_text(encoding='utf-8'))
          assert diagnostics['status'] == 'INTEL_BAIDU_AI_COMPLETED', diagnostics
          assert diagnostics['upstream_called'] is True, diagnostics
          assert diagnostics['model_calls'] == 0, diagnostics
          assert diagnostics['http_status'] == 200, diagnostics
          assert diagnostics['requests_per_ticket'] == 1, diagnostics
          assert diagnostics['paid_fallback_authorized'] is False, diagnostics
          assert diagnostics['secret_values_exposed'] is False, diagnostics
          secret = os.environ['BAIDU_AI_CLOUD_API_KEY']
          for path in root.rglob('*'):
              if path.is_file():
                  assert secret not in path.read_text(encoding='utf-8', errors='ignore')
          PY
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baidu-search-only-live-${{ github.run_id }}
          path: baidu-live-artifacts/
          if-no-files-found: error
          retention-days: 30
