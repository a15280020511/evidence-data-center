name: Temporary Add World Bank Documents and BIS

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/add_worldbank_docs_bis.py"
      - "tools/fix_worldbank_bis_generator_order.py"
      - ".github/workflows/add-worldbank-docs-bis-migration.yml"

permissions:
  contents: write

concurrency:
  group: add-worldbank-docs-bis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/worldbank-docs-bis-wto-fix
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Align generator with current catalog ordering
        run: python tools/fix_worldbank_bis_generator_order.py
      - name: Generate providers and contracts
        run: python tools/add_worldbank_docs_bis.py
      - name: Install and validate
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/worldbank-documents/requirements.txt \
            -r api-center/bis/requirements.txt \
            -r api-center/wto/requirements.txt \
            -r api-center/imf/requirements.txt
          python -m pip check
          python -m compileall -q api-center
          python -m unittest discover -s api-center/international-statistics/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          python api-center/build_catalog_market_search.py
          git diff --check
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "feat: add World Bank Documents and BIS providers"
          git push origin HEAD:feat/worldbank-docs-bis-wto-fix
