name: One Shot Remove NBS WAF Blocked Operations
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: one-shot-remove-nbs-waf
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-remove-nbs-waf]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FEATURE_BRANCH: fix/remove-nbs-waf-blocked-direct-20260803
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/remove-nbs-waf-blocked-direct-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Remove WAF-blocked operations
        run: python .maintenance/remove_nbs_waf_blocked.py
      - name: Install provider dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/public-data-geospatial/requirements.txt
          python -m pip check
      - name: Compile and test provider
        run: |
          python -m py_compile api-center/public-data-geospatial/public_data_geospatial_task.py
          python -m unittest discover -s api-center/public-data-geospatial/tests -p 'test_*.py'
      - name: Regenerate and validate catalog
        run: |
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py'
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py'
          git diff --check
      - name: Commit cleanup branch
        run: |
          rm -rf .maintenance
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove NBS operations blocked by upstream WAF"
          git push origin HEAD:${FEATURE_BRANCH}
      - name: Report success
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "NBS_WAF_CLEANUP_PASS"
      - name: Report failure
        if: failure()
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "NBS_WAF_CLEANUP_FAILED run=${GITHUB_RUN_ID}"
