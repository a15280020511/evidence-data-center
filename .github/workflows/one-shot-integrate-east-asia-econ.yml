name: One-shot integrate East Asia Econ

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/integrate_east_asia_econ.py"
      - ".github/workflows/one-shot-integrate-east-asia-econ.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feat/east-asia-econ-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/east-asia-econ-api
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/east-asia-econ/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/east-asia-econ/requirements.txt
          python -m pip check

      - name: Integrate and validate
        run: python tools/integrate_east_asia_econ.py

      - name: Commit generated contracts and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py
          git diff --cached --check
          git commit -m "feat: expose East Asia Econ in unified API catalog"
          git push origin HEAD:feat/east-asia-econ-api
