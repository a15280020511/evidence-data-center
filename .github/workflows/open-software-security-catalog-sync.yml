name: Sync Open Software Security Catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-open-software-security-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'feat/open-software-security-knowledge-wave4-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/open-software-security-knowledge-wave4-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Register provider and source inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('api-center/build_catalog_market_search.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              'GLOBAL_KNOWLEDGE_FABRIC_CATALOG = HERE / "global-knowledge-fabric/provider-catalog.json"\n',
              'GLOBAL_KNOWLEDGE_FABRIC_CATALOG = HERE / "global-knowledge-fabric/provider-catalog.json"\nOPEN_SOFTWARE_SECURITY_KNOWLEDGE_CATALOG = HERE / "open-software-security-knowledge/provider-catalog.json"\n',
          )
          text=text.replace(
              '    "global-knowledge-fabric": 9,\n}',
              '    "global-knowledge-fabric": 9,\n    "open-software-security-knowledge": 11,\n}',
          )
          text=text.replace(
              '    GLOBAL_KNOWLEDGE_FABRIC_CATALOG,\n)',
              '    GLOBAL_KNOWLEDGE_FABRIC_CATALOG,\n    OPEN_SOFTWARE_SECURITY_KNOWLEDGE_CATALOG,\n)',
          )
          text=text.replace(
              '        "global-knowledge-archives/provider-catalog.json",\n    ):',
              '        "global-knowledge-archives/provider-catalog.json",\n        "global-knowledge-fabric/provider-catalog.json",\n        "open-software-security-knowledge/provider-catalog.json",\n    ):',
          )
          path.write_text(text,encoding='utf-8')

          path=Path('api-center/tests/test_api_catalog.py')
          text=path.read_text(encoding='utf-8').replace(
              '    "global-knowledge-fabric": 9,\n}',
              '    "global-knowledge-fabric": 9,\n    "open-software-security-knowledge": 11,\n}',
          )
          path.write_text(text,encoding='utf-8')

          inventory_path=Path('api-center/global-research-intelligence/source-inventory.json')
          inventory=json.loads(inventory_path.read_text(encoding='utf-8'))
          items=inventory.get('items') or []
          if not any(row.get('requested_name')=='open-software-security-knowledge' for row in items):
              items.append({
                  'requested_name':'open-software-security-knowledge',
                  'classification':'fourth-wave governed source-code archive, package ecosystem, dependency, license, defensive vulnerability and open-standards metadata layer',
                  'decision':'integrate-new',
                  'implementation':'18 fixed HTTPS sources through 11 bounded read-only operations; GitHub, Hugging Face and IETF capabilities are mapped rather than duplicated; package download, code execution, exploit retrieval and writes remain prohibited',
              })
              inventory['items']=items
              inventory_path.write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Rebuild authoritative catalog and run tests
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/open-software-security-knowledge/requirements.txt
          python api-center/build_catalog_market_search.py
          PYTHONPATH=api-center/open-software-security-knowledge:api-center \
            python api-center/open-software-security-knowledge/validate_open_software_security.py \
              --output /tmp/open-software-security-registry.json
          python -m unittest discover -s api-center/tests -p 'test_*.py'
          git diff --check
      - name: Commit non-workflow generated contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/global-research-intelligence/source-inventory.json
          if git diff --cached --quiet; then
            echo 'Catalog already synchronized'
            exit 0
          fi
          git commit -m 'feat: register open software security knowledge in authoritative catalog'
          git push origin HEAD:feat/open-software-security-knowledge-wave4-20260803
