name: PRC Open Intelligence Bootstrap

on:
  push:
    branches: [feat/prc-free-intelligence-suite]
    paths:
      - ".github/workflows/prc-open-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip-prc-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/prc-free-intelligence-suite

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Patch managed catalog and bounded upstream growth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          build = Path('api-center/build_catalog.py')
          text = build.read_text(encoding='utf-8')
          old = '    HERE / "company-intelligence/provider-catalog.json",\n    HERE / "web-retrieval/provider-catalog.json",'
          new = '    HERE / "company-intelligence/provider-catalog.json",\n    HERE / "prc-open-intelligence/provider-catalog.json",\n    HERE / "web-retrieval/provider-catalog.json",'
          if old not in text and 'prc-open-intelligence/provider-catalog.json' not in text:
              raise SystemExit('managed provider insertion point not found')
          text = text.replace(old, new)
          detail_old = '            "yuandian/readonly-apis.snapshot.json",\n            "catalog-metadata.json",'
          detail_new = '            "yuandian/readonly-apis.snapshot.json",\n            "prc-open-intelligence/provider-catalog.json",\n            "catalog-metadata.json",'
          if detail_old in text:
              text = text.replace(detail_old, detail_new)
          build.write_text(text, encoding='utf-8')

          task = Path('api-center/prc-open-intelligence/prc_open_intelligence_task.py')
          text = task.read_text(encoding='utf-8')
          anchor = 'SINOFacts_RECORDS_URL = "https://raw.githubusercontent.com/SinoFacts/dataset/main/companies.jsonl"\nMCP_PROTOCOL_VERSION = "2025-06-18"'
          replacement = 'SINOFacts_RECORDS_URL = "https://raw.githubusercontent.com/SinoFacts/dataset/main/companies.jsonl"\nSINOFacts_UPSTREAM_MAX_BYTES = 5_000_000\nMCP_PROTOCOL_VERSION = "2025-06-18"'
          if 'SINOFacts_UPSTREAM_MAX_BYTES' not in text:
              if anchor not in text:
                  raise SystemExit('SinoFacts constant insertion point not found')
              text = text.replace(anchor, replacement)
          old_call = 'raw, metadata = _http_bytes(SINOFacts_RECORDS_URL, timeout=timeout, max_bytes=max_bytes)'
          new_call = 'raw, metadata = _http_bytes(\n        SINOFacts_RECORDS_URL,\n        timeout=timeout,\n        max_bytes=max(max_bytes, SINOFacts_UPSTREAM_MAX_BYTES),\n    )'
          if old_call in text:
              text = text.replace(old_call, new_call)
          elif 'max(max_bytes, SINOFacts_UPSTREAM_MAX_BYTES)' not in text:
              raise SystemExit('SinoFacts profile download call not found')
          task.write_text(text, encoding='utf-8')

          catalog_path = Path('api-center/prc-open-intelligence/provider-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          for provider in catalog['providers']:
              if provider['provider_id'] == 'sinofacts':
                  provider['limits']['upstream_snapshot_max_bytes'] = 5_000_000
                  provider['limits']['max_response_bytes'] = 1_500_000
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input -r api-center/prc-open-intelligence/requirements.txt

      - name: Validate and test before generating catalog
        run: |
          python -m py_compile api-center/prc-open-intelligence/prc_open_intelligence_task.py api-center/prc-open-intelligence/validate_registry.py
          python -m unittest discover -s api-center/prc-open-intelligence/tests -p 'test_*.py' -v
          python api-center/prc-open-intelligence/validate_registry.py

      - name: Generate deterministic capability catalog
        run: python api-center/build_catalog.py

      - name: Commit bootstrap outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-center/build_catalog.py \
            api-center/prc-open-intelligence/prc_open_intelligence_task.py \
            api-center/prc-open-intelligence/provider-catalog.json \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          if git diff --cached --quiet; then
            echo "No bootstrap changes required."
            exit 0
          fi
          git commit -m "chore(prc-intel): wire free providers into catalog [skip-prc-bootstrap]"
          git push origin HEAD:feat/prc-free-intelligence-suite
