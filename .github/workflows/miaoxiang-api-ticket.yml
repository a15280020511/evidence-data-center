name: Managed Miaoxiang API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: api-mx-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-miaoxiang-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-mx]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MX_APIKEY: ${{ secrets.MX_APIKEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/miaoxiang/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/miaoxiang/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: python -m py_compile api-center/miaoxiang/miaoxiang_task.py

      - name: Parse and authorize Miaoxiang ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/miaoxiang/miaoxiang_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir miaoxiang-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/miaoxiang/miaoxiang_task.py render \
            --output-dir miaoxiang-artifacts --phase accepted > miaoxiang-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@miaoxiang-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/miaoxiang/miaoxiang_task.py render \
            --output-dir miaoxiang-artifacts --phase rejected > miaoxiang-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@miaoxiang-comment.md

      - name: Execute read-only Miaoxiang operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/miaoxiang/miaoxiang_task.py execute \
            --ticket miaoxiang-artifacts/ticket.json \
            --output-dir miaoxiang-artifacts

      - name: Upload Miaoxiang evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miaoxiang-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: miaoxiang-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/miaoxiang/miaoxiang_task.py render \
            --output-dir miaoxiang-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > miaoxiang-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@miaoxiang-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_MIAOXIANG_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Miaoxiang API ticket did not complete successfully."
          exit 1

  bootstrap-market-search:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[bootstrap-market-search]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/tickflow-serpapi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/market-search/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/market-search/requirements.txt
          python -m pip check

      - name: Integrate providers and regenerate contracts
        run: python tools/bootstrap_tickflow_serpapi.py

      - name: Commit feature integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center .github/workflows/api-catalog-validate.yml
          git diff --cached --check
          git commit -m "feat(api-center): register TickFlow and SerpAPI providers"
          git push origin HEAD:feat/tickflow-serpapi

      - name: Comment success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "MARKET_SEARCH_BOOTSTRAP_COMPLETED"
