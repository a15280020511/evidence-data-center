name: Evidence Quality Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: evidence-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate evidence quality controls
        run: |
          set -euo pipefail
          python -m compileall -q api-center
          PYTHONPATH=api-center python -m unittest api-center/tests/test_quality_control.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('api-center').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
