name: One-time Federal Register Production Recheck

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  recheck:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] recheck Federal Register endpoint 20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/open-intelligence-toolkit-20260804
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python -m pip check

      - name: Execute exactly one production request
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/federal-register-recheck
          PYTHONPATH=api-center/global-knowledge-archives:api-center \
            python api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
              --live-source federal-register \
              --output /tmp/federal-register-recheck/receipt.json \
              > /tmp/federal-register-recheck/console.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record diagnostic receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          {
            echo '## Federal Register production recheck'
            echo
            echo "- Exit code: \`${EXIT_CODE:-missing}\`"
            echo '- Request count: `1`'
            echo '- Automatic retry: `false`'
            echo '- Target branch: `feat/open-intelligence-toolkit-20260804`'
            echo
            echo '```text'
            tail -n 80 /tmp/federal-register-recheck/console.log 2>/dev/null || true
            echo '```'
            if [ -f /tmp/federal-register-recheck/live-federal-register/diagnostics.json ]; then
              echo
              echo '```json'
              cat /tmp/federal-register-recheck/live-federal-register/diagnostics.json
              echo '```'
            fi
          } > /tmp/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-comment.md
