name: Live Smoke AlphaFeed and Xweather

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/scripts/live_smoke_xweather_alphafeed.py"
      - ".github/workflows/live-smoke-xweather-alphafeed.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: live-smoke-alphafeed-xweather-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ALPHAFEED_API_KEY: ${{ secrets.ALPHAFEED_API_KEY }}
      XWEATHER_CLIENT_ID: ${{ vars.XWEATHER_CLIENT_ID }}
      XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/alphafeed/requirements.txt
            api-center/xweather/requirements.txt

      - name: Install pinned provider dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/alphafeed/requirements.txt \
            -r api-center/xweather/requirements.txt
          python -m pip check

      - name: Execute live upstream smoke matrix
        id: smoke
        continue-on-error: true
        run: python .github/scripts/live_smoke_xweather_alphafeed.py

      - name: Verify no credential value entered artifacts
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path('live-smoke-artifacts')
          for name in ('ALPHAFEED_API_KEY', 'XWEATHER_CLIENT_ID', 'XWEATHER_CLIENT_SECRET'):
              value = os.getenv(name, '')
              if not value:
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and value.encode() in path.read_bytes():
                      raise SystemExit(f'credential value leaked into {path}')
          print('credential artifact scan: PASS')
          PY

      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-smoke-alphafeed-xweather-${{ github.run_id }}
          path: live-smoke-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce required live cases
        if: always() && steps.smoke.outcome != 'success'
        run: |
          echo "One or more required live upstream tests failed; inspect summary artifact."
          exit 1
