name: Validate EODHD Provider

on:
  pull_request:
    paths:
      - "api-center/eodhd/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/**"
      - ".github/workflows/eodhd-provider-validate.yml"
      - ".github/workflows/eodhd-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/eodhd/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/**"
      - ".github/workflows/eodhd-provider-validate.yml"
      - ".github/workflows/eodhd-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-eodhd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-eodhd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/eodhd/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/eodhd/requirements.txt
          python -m pip check

      - name: Compile provider runtime and tests
        run: |
          python -m py_compile \
            api-center/eodhd/eodhd_task.py \
            api-center/eodhd/tests/test_eodhd_task.py

      - name: Run EODHD unit tests
        run: python -m unittest discover -s api-center/eodhd/tests -p 'test_*.py' -v

      - name: Validate fixed provider contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/eodhd/provider-catalog.json').read_text(encoding='utf-8'))
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'eodhd'
          assert provider['ticket_prefix'] == '[api-eodhd]'
          assert provider['required_secret_environment_variable'] == 'EODHD_API_TOKEN'
          assert len(provider['operations']) == 25
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['arbitrary_paths_allowed'] is False
          assert provider['limits']['arbitrary_headers_allowed'] is False
          assert provider['limits']['client_supplied_token_allowed'] is False
          assert provider['limits']['websocket_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['trading_or_order_execution_allowed'] is False
          assert provider['limits']['secret_values_exposed'] is False
          assert all(row['result_contract']['read_only'] is True for row in provider['operations'])
          print(json.dumps({'status': 'PASS', 'provider': 'eodhd', 'operations': 25, 'secret': 'EODHD_API_TOKEN'}))
          PY
