name: Integrate Statistics of the World Catalog

on:
  push:
    branches:
      - feat/add-overture-oecd-alphafeed
    paths:
      - ".github/workflows/statistics-of-the-world-integration.yml"
      - ".github/scripts/integrate_statistics_of_the_world.py"
      - "api-center/statistics-of-the-world/**"
      - "api-center/build_catalog_market_search.py"

permissions:
  contents: write

concurrency:
  group: integrate-statistics-of-the-world
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/add-overture-oecd-alphafeed
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/statistics-of-the-world/requirements.txt
          python -m pip check

      - name: Regenerate catalog and patch invariants
        run: python .github/scripts/integrate_statistics_of_the_world.py

      - name: Run focused regressions
        run: |
          python -m unittest discover -s api-center/statistics-of-the-world/tests -p 'test_*.py' -v
          python -m unittest api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py -v
          git diff --check

      - name: Commit deterministic integration outputs
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py api-center/README.md api-center/SECRET_ISOLATION_POLICY.md api-center/CAPABILITY_MAXIMIZATION.md
          git commit -m "feat: integrate Statistics of the World into catalog"
          git push origin HEAD:feat/add-overture-oecd-alphafeed
