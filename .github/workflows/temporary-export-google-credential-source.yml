name: Temporary publish split Google credentials

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-publish-split-google-credentials]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH_NAME: fix/split-google-credentials
      PATCH_SHA256: abf29e039814300c089fe5af2883a1fcea80bb79df10aaa1c5e71267ec58892d
    steps:
      - name: Report start
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=started\nRUN_ID=${GITHUB_RUN_ID}"

      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply SHA-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH_NAME"
          base64 --decode .maintenance/split-google-source.patch.gz.b64 \
            | gzip --decompress > /tmp/split-google-source.patch
          echo "${PATCH_SHA256}  /tmp/split-google-source.patch" | sha256sum --check --strict
          git apply --check /tmp/split-google-source.patch
          git apply /tmp/split-google-source.patch
          python api-center/build_catalog.py
          if grep -RIn --exclude-dir=__pycache__ --exclude='*.pyc' \
            'GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON' api-center; then
            echo 'shared Google credential name remains in api-center' >&2
            exit 1
          fi
          git diff --check

      - name: Install dependencies and run source tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/google-cloud/requirements.txt
          python -m pip check
          python -m compileall -q api-center
          python -m unittest discover -s api-center/google-cloud/tests -v
          python - <<'PY'
          import unittest

          discovered = unittest.defaultTestLoader.discover('api-center/tests')
          selected = unittest.TestSuite()

          def collect(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      collect(item)
                  elif 'test_api_architecture' not in item.id():
                      selected.addTest(item)

          collect(discovered)
          result = unittest.TextTestRunner(verbosity=2).run(selected)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f'SOURCE_ONLY_CORE_TESTS={result.testsRun}')
          PY
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          facts = {
              'connectors': catalog['connector_count'],
              'enabled_connectors': catalog['enabled_connector_count'],
              'providers': catalog['managed_provider_count'],
              'enabled_providers': catalog['enabled_managed_provider_count'],
              'operations': catalog['managed_operation_count'],
              'parameters': catalog['exposed_parameter_count'],
              'secret_values_exposed': catalog['secret_values_exposed'],
              'catalog_sha256': catalog['catalog_sha256'],
          }
          assert facts['connectors'] == 69
          assert facts['enabled_connectors'] == 69
          assert facts['providers'] == 7
          assert facts['enabled_providers'] == 7
          assert facts['operations'] == 93
          assert facts['parameters'] == 647
          assert facts['secret_values_exposed'] is False
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          assert providers['bigquery']['required_secret_environment_variable_name'] == 'BIGQUERY_SERVICE_ACCOUNT_JSON'
          assert providers['earth-engine']['required_secret_environment_variable_name'] == 'EARTH_ENGINE_SERVICE_ACCOUNT_JSON'
          assert providers['data-commons']['required_secret_environment_variable_name'] == 'GOOGLE_DATA_COMMONS_API_KEY'
          print(json.dumps(facts))
          PY

      - name: Publish tested source branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "refactor: split Google service credentials"
          git push --force origin "HEAD:${BRANCH_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish completion receipt
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=source_branch_completed\nBRANCH=${BRANCH_NAME}\nSHA=${{ steps.publish.outputs.sha }}\nBIGQUERY_SECRET=BIGQUERY_SERVICE_ACCOUNT_JSON\nEARTH_ENGINE_SECRET=EARTH_ENGINE_SERVICE_ACCOUNT_JSON\nDATA_COMMONS_SECRET=GOOGLE_DATA_COMMONS_API_KEY\nCAPABILITIES=69/69_connectors_7/7_providers_93_operations_647_parameters\nSECRET_VALUES_READ=false"

      - name: Publish structured failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=failed\nRUN_ID=${GITHUB_RUN_ID}\nNo feature branch was published by this failed run."
