name: Sync OpenBB Free Catalog Contracts

on:
  push:
    branches:
      - feat/openbb-free-provider-20260803

permissions:
  contents: write

concurrency:
  group: sync-openbb-free-catalog
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Synchronize builder, inventory and aggregate test contracts
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          builder = Path('api-center/build_catalog_market_search.py')
          text = builder.read_text(encoding='utf-8')
          anchor = 'GLOBAL_RESEARCH_INTELLIGENCE_CATALOG = HERE / "global-research-intelligence/provider-catalog.json"\n'
          if 'OPENBB_FREE_CATALOG' not in text:
              text = text.replace(anchor, anchor + 'OPENBB_FREE_CATALOG = HERE / "openbb-free/provider-catalog.json"\n')
          if '"openbb-free": 7' not in text:
              text = text.replace('    "global-research-intelligence": 23,\n}', '    "global-research-intelligence": 23,\n    "openbb-free": 7,\n}')
          if '    OPENBB_FREE_CATALOG,\n)' not in text:
              text = text.replace('    GLOBAL_RESEARCH_INTELLIGENCE_CATALOG,\n)', '    GLOBAL_RESEARCH_INTELLIGENCE_CATALOG,\n    OPENBB_FREE_CATALOG,\n)')
          if '        "openbb-free/provider-catalog.json",\n' not in text:
              text = text.replace('        "global-research-intelligence/provider-catalog.json",\n    ):', '        "global-research-intelligence/provider-catalog.json",\n        "openbb-free/provider-catalog.json",\n    ):')
          builder.write_text(text, encoding='utf-8')

          inventory_path = Path('api-center/global-research-intelligence/source-inventory.json')
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          for row in inventory['items']:
              if row.get('requested_name') == 'openbb':
                  row['classification'] = 'modular open-source data-provider framework; upstream data access varies by provider'
                  row['decision'] = 'install-modular-free-layer'
                  row['implementation'] = 'openbb-free managed provider with pinned openbb-core, ECB, Federal Reserve and Fama-French extensions; paid, trading, duplicate and unofficial providers remain disabled'
          summary = inventory['summary']
          packages = summary.get('analysis_or_utility_packages_not_installed_as_sources', [])
          summary['analysis_or_utility_packages_not_installed_as_sources'] = [
              item for item in packages if item != 'OpenBB monolith'
          ]
          summary['modular_frameworks_installed_with_restricted_scope'] = [
              'OpenBB Core + ECB + Federal Reserve + Fama-French free/no-key providers'
          ]
          inventory_path.write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          api_test = Path('api-center/tests/test_api_catalog.py')
          text = api_test.read_text(encoding='utf-8')
          if '"openbb-free": 7' not in text:
              text = text.replace('    "global-research-intelligence": 23,\n}', '    "global-research-intelligence": 23,\n    "openbb-free": 7,\n}')
          text = text.replace('self.assertEqual(catalog["managed_provider_count"], 53)', 'self.assertEqual(catalog["managed_provider_count"], 54)')
          text = text.replace('self.assertEqual(catalog["enabled_managed_provider_count"], 53)', 'self.assertEqual(catalog["enabled_managed_provider_count"], 54)')
          text = text.replace('self.assertEqual(catalog["managed_operation_count"], 611)', 'self.assertEqual(catalog["managed_operation_count"], 618)')
          api_test.write_text(text, encoding='utf-8')

          maximum_test = Path('api-center/tests/test_capability_maximization.py')
          text = maximum_test.read_text(encoding='utf-8')
          text = re.sub(r'(managed_operation_count"\],\s*)611(,)', r'\g<1>618\2', text)
          text = text.replace('            "global-research-intelligence": 23,\n        }', '            "global-research-intelligence": 23,\n            "openbb-free": 7,\n        }')
          maximum_test.write_text(text, encoding='utf-8')
          PY
      - name: Generate authoritative API catalog
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_catalog_market_search.py
      - name: Commit synchronized contracts
        run: |
          if git diff --quiet; then
            echo "Catalog already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-center/build_catalog_market_search.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/global-research-intelligence/source-inventory.json \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py
          git commit -m "chore: synchronize OpenBB free catalog"
          git push origin HEAD:feat/openbb-free-provider-20260803
