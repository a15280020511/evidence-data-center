name: Evidence Center Pause Controller

on:
  push:
    branches: [main]
    paths:
      - EVIDENCE_CENTER_STATUS.json
      - .github/workflows/evidence-center-pause-controller.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: evidence-center-pause-controller
  cancel-in-progress: false

jobs:
  enforce-pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout status policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate pause status
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("EVIDENCE_CENTER_STATUS.json").read_text(encoding="utf-8"))
          if status.get("schema_version") != "evidence-center-status-v1":
              raise SystemExit("invalid evidence center status schema")
          if status.get("status") != "paused-risk-review":
              raise SystemExit("pause controller only operates while status is paused-risk-review")
          required_false = (
              "data_collection_allowed",
              "provider_validation_allowed",
              "scheduled_discovery_allowed",
              "issue_ticket_execution_allowed",
              "manual_workflow_execution_allowed",
          )
          for field in required_false:
              if status.get(field) is not False:
                  raise SystemExit(f"pause policy requires {field}=false")
          print("pause policy validated")
          PY

      - name: Disable evidence-center workflows fail-closed
        id: disable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          self_path='.github/workflows/evidence-center-pause-controller.yml'
          codeql_path='.github/workflows/codeql.yml'
          disabled=0
          preserved=0
          failed=0
          mkdir -p pause-artifacts
          : > pause-artifacts/workflow-actions.tsv

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.path,.state] | @tsv' \
            > pause-artifacts/workflows-before.tsv

          while IFS=$'\t' read -r workflow_id workflow_path workflow_state; do
            if [[ -z "$workflow_id" || -z "$workflow_path" ]]; then
              continue
            fi
            if [[ "$workflow_path" == "$self_path" || "$workflow_path" == "$codeql_path" ]]; then
              printf 'preserve\t%s\t%s\t%s\n' "$workflow_id" "$workflow_path" "$workflow_state" \
                >> pause-artifacts/workflow-actions.tsv
              preserved=$((preserved + 1))
              continue
            fi
            if [[ "$workflow_state" == 'disabled_manually' ]]; then
              printf 'already-disabled\t%s\t%s\t%s\n' "$workflow_id" "$workflow_path" "$workflow_state" \
                >> pause-artifacts/workflow-actions.tsv
              continue
            fi
            if gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable" >/dev/null; then
              printf 'disabled\t%s\t%s\t%s\n' "$workflow_id" "$workflow_path" "$workflow_state" \
                >> pause-artifacts/workflow-actions.tsv
              disabled=$((disabled + 1))
            else
              printf 'disable-failed\t%s\t%s\t%s\n' "$workflow_id" "$workflow_path" "$workflow_state" \
                >> pause-artifacts/workflow-actions.tsv
              failed=$((failed + 1))
            fi
          done < pause-artifacts/workflows-before.tsv

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.path,.state] | @tsv' \
            > pause-artifacts/workflows-after.tsv

          python - <<'PY'
          import json
          from pathlib import Path

          allowed = {
              ".github/workflows/evidence-center-pause-controller.yml",
              ".github/workflows/codeql.yml",
          }
          active = []
          for line in Path("pause-artifacts/workflows-after.tsv").read_text(encoding="utf-8").splitlines():
              workflow_id, path, state = line.split("\t", 2)
              if state == "active" and path not in allowed:
                  active.append({"id": workflow_id, "path": path, "state": state})
          Path("pause-artifacts/pause-verification.json").write_text(
              json.dumps({
                  "schema_version": "evidence-center-pause-verification-v1",
                  "allowed_active_workflows": sorted(allowed),
                  "unexpected_active_workflows": active,
                  "pause_enforced": not active,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if active:
              raise SystemExit(f"pause enforcement incomplete; active workflows remain: {active}")
          PY

          echo "disabled_count=$disabled" >> "$GITHUB_OUTPUT"
          echo "preserved_count=$preserved" >> "$GITHUB_OUTPUT"
          echo "failed_count=$failed" >> "$GITHUB_OUTPUT"
          test "$failed" -eq 0

      - name: Upload pause verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-center-pause-${{ github.run_id }}
          path: pause-artifacts/
          if-no-files-found: error
          retention-days: 30
