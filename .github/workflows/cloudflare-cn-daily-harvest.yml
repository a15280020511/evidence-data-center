name: Run Cloudflare China Daily Governance Export Queue

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-cn-daily-harvest-global
  cancel-in-progress: false

jobs:
  harvest:
    if: github.repository_owner == github.actor || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/cloudflare/requirements.txt
            api-center/huggingface/requirements-numeric-baseline.txt

      - name: Install pinned harvest dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/cloudflare/requirements.txt \
            -r api-center/huggingface/requirements-numeric-baseline.txt
          python -m pip check

      - name: Validate producer-only control plane
        run: |
          set -euo pipefail
          python api-center/cloudflare/numeric-compiler/china_intelligence_controls.py \
            validate --output-dir daily-harvest-artifacts/control-validation
          python api-center/cloudflare/numeric-compiler/cloudflare_numeric_compiler_runtime.py \
            validate --output-dir daily-harvest-artifacts/compiler-validation
          python -m py_compile api-center/huggingface/build_governance_baseline_export.py

      - name: Ensure queue labels
        run: |
          set -euo pipefail
          gh label create cn-harvest-pending --color 1D76DB --description "Pending China numeric harvest task" --force
          gh label create cn-harvest-active --color FBCA04 --description "Active China numeric harvest task" --force
          gh label create cn-harvest-deferred-quota --color D4C5F9 --description "Deferred until next UTC day because free quota was exhausted" --force
          gh label create cn-harvest-deferred-rate-limit --color C5DEF5 --description "Deferred until next UTC day because platform rate limit was reached" --force
          gh label create cn-harvest-completed --color 0E8A16 --description "China numeric harvest completed and exported for governance" --force
          gh label create cn-harvest-quarantined --color B60205 --description "China numeric harvest requires review" --force
          gh label create cn-harvest-rejected --color 5319E7 --description "China numeric harvest ticket rejected" --force

      - name: Recover interrupted active tickets
        run: |
          set -euo pipefail
          mapfile -t stale_issues < <(
            gh issue list --state open --label cn-harvest-active --limit 100 \
              --search 'in:title "[queue-cn-numeric]"' --json number --jq '.[].number'
          )
          for issue_number in "${stale_issues[@]}"; do
            gh issue edit "$issue_number" --remove-label cn-harvest-active \
              --add-label cn-harvest-deferred-rate-limit >/dev/null
            gh issue comment "$issue_number" \
              --body 'Daily harvest recovery: `DEFERRED_AFTER_INTERRUPTED_RUN`; retry remains governed by the oldest-first queue.' >/dev/null
          done

      - name: Build oldest-first resumable queue
        run: |
          set -euo pipefail
          mkdir -p daily-harvest-artifacts
          gh issue list --state open --limit 100 \
            --search 'in:title "[queue-cn-numeric]"' \
            --json number,title,createdAt,labels > daily-harvest-artifacts/open-queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('daily-harvest-artifacts/open-queue.json').read_text(encoding='utf-8'))
          deferred = {'cn-harvest-deferred-quota', 'cn-harvest-deferred-rate-limit'}
          excluded = {'cn-harvest-completed', 'cn-harvest-quarantined', 'cn-harvest-rejected', 'cn-harvest-active'}
          plan = []
          for row in rows:
              if not str(row.get('title') or '').startswith('[queue-cn-numeric]'):
                  continue
              labels = {str(item.get('name') or '') for item in row.get('labels') or []}
              if labels & excluded:
                  continue
              plan.append({
                  'number': int(row['number']),
                  'created_at': str(row.get('createdAt') or ''),
                  'priority': 0 if labels & deferred else 1,
              })
          plan.sort(key=lambda item: (item['priority'], item['created_at'], item['number']))
          Path('daily-harvest-artifacts/queue-plan.json').write_text(
              json.dumps(plan, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'planned_tasks={len(plan)}')
          PY

      - name: Execute sequentially without private Dataset access
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          max_wall_seconds=570
          max_requests=50
          started=0
          completed=0
          deferred=0
          quarantined=0
          rejected=0
          stop_code=0
          stop_reason="queue-exhausted"
          mkdir -p daily-harvest-artifacts/tasks

          mapfile -t issue_numbers < <(
            python - <<'PY'
          import json
          from pathlib import Path
          for row in json.loads(Path('daily-harvest-artifacts/queue-plan.json').read_text(encoding='utf-8')):
              print(row['number'])
          PY
          )

          clear_queue_labels() {
            local issue_number="$1"
            for label in cn-harvest-pending cn-harvest-active cn-harvest-deferred-quota \
              cn-harvest-deferred-rate-limit cn-harvest-completed cn-harvest-quarantined cn-harvest-rejected; do
              gh issue edit "$issue_number" --remove-label "$label" >/dev/null 2>&1 || true
            done
          }

          post_comment() {
            local issue_number="$1"
            local output_dir="$2"
            python api-center/cloudflare/numeric-compiler/cloudflare_numeric_compiler_runtime.py \
              render --output-dir "$output_dir" > "$output_dir/comment.md" 2>/dev/null || true
            if [[ -s "$output_dir/comment.md" ]]; then
              {
                echo
                echo '- Private Hugging Face write executed: `false`'
                echo '- Storage authority: `a15280020511/decision-system-governance`'
              } >> "$output_dir/comment.md"
              gh issue comment "$issue_number" --body-file "$output_dir/comment.md" >/dev/null
            fi
          }

          for issue_number in "${issue_numbers[@]}"; do
            now_epoch="$(date +%s)"
            elapsed=$((now_epoch - start_epoch))
            if (( elapsed >= max_wall_seconds )); then
              stop_code=2
              stop_reason="estimated-browser-budget-reached"
              break
            fi
            if (( started >= max_requests )); then
              stop_code=3
              stop_reason="daily-request-cap-reached"
              break
            fi

            task_dir="daily-harvest-artifacts/tasks/${issue_number}"
            mkdir -p "$task_dir"
            gh issue view "$issue_number" --json body --jq .body > "$task_dir/ticket.json"
            if ! python -m json.tool "$task_dir/ticket.json" >/dev/null 2>&1; then
              clear_queue_labels "$issue_number"
              gh issue edit "$issue_number" --add-label cn-harvest-rejected >/dev/null
              gh issue comment "$issue_number" --body 'Daily harvest admission: `ADMISSION_REJECTED_INVALID_JSON`' >/dev/null
              gh issue close "$issue_number" --reason not-planned >/dev/null
              rejected=$((rejected + 1))
              continue
            fi

            clear_queue_labels "$issue_number"
            gh issue edit "$issue_number" --add-label cn-harvest-active >/dev/null
            started=$((started + 1))

            set +e
            python api-center/cloudflare/numeric-compiler/cloudflare_numeric_compiler_runtime.py \
              execute --ticket "$task_dir/ticket.json" --output-dir "$task_dir"
            rc=$?
            set -e

            if [[ "$rc" -eq 0 && -f "$task_dir/execution-receipt.json" ]]; then
              post_comment "$issue_number" "$task_dir"
              clear_queue_labels "$issue_number"
              gh issue edit "$issue_number" --add-label cn-harvest-completed >/dev/null
              gh issue close "$issue_number" --reason completed >/dev/null
              completed=$((completed + 1))
            else
              post_comment "$issue_number" "$task_dir"
              failure_text="$(cat "$task_dir/failure-receipt.json" 2>/dev/null || true)"
              failure_lower="$(printf '%s' "$failure_text" | tr '[:upper:]' '[:lower:]')"
              clear_queue_labels "$issue_number"
              if grep -Eq '429|quota|neuron limit|browser time limit|time limit exceeded' <<<"$failure_lower"; then
                gh issue edit "$issue_number" --add-label cn-harvest-deferred-quota >/dev/null
                deferred=$((deferred + 1))
                stop_code=4
                stop_reason="cloudflare-free-quota-exhausted"
                break
              elif grep -Eq 'rate limit|too many requests' <<<"$failure_lower"; then
                gh issue edit "$issue_number" --add-label cn-harvest-deferred-rate-limit >/dev/null
                deferred=$((deferred + 1))
                stop_code=5
                stop_reason="platform-rate-limit-reached"
                break
              else
                gh issue edit "$issue_number" --add-label cn-harvest-quarantined >/dev/null
                quarantined=$((quarantined + 1))
              fi
            fi
            sleep 10
          done

          end_epoch="$(date +%s)"
          elapsed=$((end_epoch - start_epoch))
          python - <<PY
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          next_day = (now + timedelta(days=1)).date()
          next_resume = datetime(next_day.year, next_day.month, next_day.day, 0, 15, tzinfo=timezone.utc)
          receipt = {
              'status': 'CLOUDFLARE_DAILY_HARVEST_EXPORTED_FOR_GOVERNANCE',
              'utc_date': now.date().isoformat(),
              'started_count': int('${started}'),
              'completed_count': int('${completed}'),
              'deferred_count': int('${deferred}'),
              'quarantined_count': int('${quarantined}'),
              'rejected_count': int('${rejected}'),
              'elapsed_seconds': int('${elapsed}'),
              'stop_code': int('${stop_code}'),
              'stop_reason': '${stop_reason}',
              'next_resume_epoch': int(next_resume.timestamp()),
              'paid_usage_allowed': False,
              'automatic_external_model_fallback_used': False,
              'raw_text_persisted': False,
              'direct_huggingface_write': False,
              'storage_gateway': 'a15280020511/decision-system-governance',
          }
          Path('daily-harvest-artifacts/daily-harvest-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, ensure_ascii=False, sort_keys=True))
          PY

      - name: Build merged governance baseline export
        id: export
        shell: bash
        run: |
          set -euo pipefail
          if find daily-harvest-artifacts/tasks -type f -name '*.parquet' -print -quit | grep -q .; then
            batch_date="$(date -u +%Y%m%d)"
            python api-center/huggingface/build_governance_baseline_export.py \
              --input-dir daily-harvest-artifacts/tasks \
              --output-dir governance-baseline-export \
              --source-run-id "$GITHUB_RUN_ID" \
              --batch-id "daily-${batch_date}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
              --mode append_batch
            echo "has_export=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_export=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload immutable governance baseline Artifact
        if: steps.export.outputs.has_export == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: governance-baseline-export/
          if-no-files-found: error
          retention-days: 30

      - name: Publish run summary
        if: always()
        run: |
          if [[ -f daily-harvest-artifacts/daily-harvest-receipt.json ]]; then
            {
              echo '## Cloudflare China daily harvest'
              echo
              echo '```json'
              cat daily-harvest-artifacts/daily-harvest-receipt.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f governance-baseline-export-receipt.json ]]; then
            {
              echo
              echo '## Governance baseline handoff'
              echo
              echo "- Artifact: \`${{ steps.export.outputs.artifact_name }}\`"
              echo "- Manifest SHA-256: \`${{ steps.export.outputs.manifest_sha256 }}\`"
              echo '- Next authority: `a15280020511/decision-system-governance`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload safe daily evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-cn-daily-harvest-evidence-${{ github.run_id }}
          path: |
            daily-harvest-artifacts/**/*.json
            daily-harvest-artifacts/**/*.md
            governance-baseline-export-receipt.json
          if-no-files-found: warn
          retention-days: 30
