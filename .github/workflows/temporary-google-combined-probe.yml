name: Temporary Google Combined Credential Probe

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: temporary-google-combined-probe-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-test-google-combined]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BIGQUERY_SERVICE_ACCOUNT_JSON: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT_JSON }}
      EARTH_ENGINE_SERVICE_ACCOUNT_JSON: ${{ secrets.EARTH_ENGINE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DATA_COMMONS_API_KEY: ${{ secrets.GOOGLE_DATA_COMMONS_API_KEY }}
      GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
      GOOGLE_API_CREDENTIALS_JSON: ${{ secrets.GOOGLE_API_CREDENTIALS_JSON }}
      API_CENTER_SECRETS_JSON: ${{ secrets.API_CENTER_SECRETS_JSON }}
      BIGQUERY_ALLOWED_PUBLIC_PROJECTS: ${{ vars.BIGQUERY_ALLOWED_PUBLIC_PROJECTS }},patents-public-data
    steps:
      - name: Checkout current source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/google-cloud/requirements.txt
            api-center/data-commons/requirements.txt

      - name: Install pinned Google dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/data-commons/requirements.txt
          python -m pip check

      - name: Resolve Google-only combined credentials
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import uuid
          from pathlib import Path

          def parse_object(raw: str, label: str) -> dict:
              text = (raw or '').strip()
              if not text:
                  return {}
              try:
                  value = json.loads(text)
              except json.JSONDecodeError:
                  return {}
              return value if isinstance(value, dict) else {}

          bundles = [
              ('GOOGLE_API_CREDENTIALS_JSON', parse_object(os.getenv('GOOGLE_API_CREDENTIALS_JSON', ''), 'GOOGLE_API_CREDENTIALS_JSON')),
              ('API_CENTER_SECRETS_JSON', parse_object(os.getenv('API_CENTER_SECRETS_JSON', ''), 'API_CENTER_SECRETS_JSON')),
          ]

          def normalize(value):
              if isinstance(value, dict):
                  return json.dumps(value, separators=(',', ':'), ensure_ascii=False)
              return str(value or '').strip()

          def from_bundles(*names):
              for source, bundle in bundles:
                  for name in names:
                      value = normalize(bundle.get(name))
                      if value:
                          return value, f'{source}:{name}'
              return '', ''

          shared = str(os.getenv('GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON') or '').strip()
          shared_source = 'GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON' if shared else ''
          if not shared:
              shared, shared_source = from_bundles(
                  'GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON',
                  'service_account',
                  'google_cloud_service_account',
              )

          bq = str(os.getenv('BIGQUERY_SERVICE_ACCOUNT_JSON') or '').strip()
          bq_source = 'BIGQUERY_SERVICE_ACCOUNT_JSON' if bq else ''
          if not bq:
              bq, bq_source = from_bundles(
                  'BIGQUERY_SERVICE_ACCOUNT_JSON',
                  'bigquery_service_account',
              )
          if not bq:
              bq, bq_source = shared, shared_source

          ee = str(os.getenv('EARTH_ENGINE_SERVICE_ACCOUNT_JSON') or '').strip()
          ee_source = 'EARTH_ENGINE_SERVICE_ACCOUNT_JSON' if ee else ''
          if not ee:
              ee, ee_source = from_bundles(
                  'EARTH_ENGINE_SERVICE_ACCOUNT_JSON',
                  'earth_engine_service_account',
              )
          if not ee:
              ee, ee_source = shared, shared_source

          dc = str(os.getenv('GOOGLE_DATA_COMMONS_API_KEY') or '').strip()
          dc_source = 'GOOGLE_DATA_COMMONS_API_KEY' if dc else ''
          if not dc:
              dc, dc_source = from_bundles(
                  'GOOGLE_DATA_COMMONS_API_KEY',
                  'data_commons_api_key',
              )

          def write_env(name: str, value: str) -> None:
              if not value:
                  return
              marker = f'EOF_{uuid.uuid4().hex}'
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                  handle.write(f'{name}<<{marker}\n{value}\n{marker}\n')

          write_env('BIGQUERY_SERVICE_ACCOUNT_JSON', bq)
          write_env('EARTH_ENGINE_SERVICE_ACCOUNT_JSON', ee)
          write_env('GOOGLE_DATA_COMMONS_API_KEY', dc)

          Path('google-combined-artifacts').mkdir(exist_ok=True)
          Path('google-combined-artifacts/credential-presence.json').write_text(
              json.dumps({
                  'bigquery_present': bool(bq),
                  'earth_engine_present': bool(ee),
                  'data_commons_present': bool(dc),
                  'bigquery_source': bq_source,
                  'earth_engine_source': ee_source,
                  'data_commons_source': dc_source,
                  'secret_values_included': False,
              }, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Build three read-only probe tickets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('google-combined-artifacts')
          tickets = {
              'bigquery-ticket.json': {
                  'task_id': 'combined-google-bigquery-probe',
                  'provider': 'bigquery',
                  'operation': 'query-readonly',
                  'objective': 'Test combined Google credential access to BigQuery.',
                  'parameters': {
                      'sql': 'SELECT 1 AS connectivity_test, CURRENT_TIMESTAMP() AS tested_at',
                      'location': 'US',
                      'maximum_bytes_billed': 1000000,
                      'max_rows': 1,
                      'timeout_ms': 30000,
                  },
                  'data_policy': {'classification': 'public', 'contains_personal_data': False},
                  'acceptance': {'timeout_seconds': 60, 'max_response_bytes': 100000},
              },
              'earth-engine-ticket.json': {
                  'task_id': 'combined-google-earth-engine-probe',
                  'provider': 'earth-engine',
                  'operation': 'catalog-algorithms',
                  'objective': 'Test combined Google credential access to Earth Engine.',
                  'parameters': {'search': 'Image', 'offset': 0, 'max_results': 1},
                  'data_policy': {'classification': 'public', 'contains_personal_data': False},
                  'acceptance': {'timeout_seconds': 60, 'max_response_bytes': 200000},
              },
              'data-commons-ticket.json': {
                  'task_id': 'combined-google-data-commons-probe',
                  'provider': 'data-commons',
                  'operation': 'resolve-place',
                  'objective': 'Test combined Google credential access to Data Commons.',
                  'parameters': {'nodes_json': '["Fuzhou, Fujian, China"]'},
                  'data_policy': {'classification': 'public', 'contains_personal_data': False},
                  'acceptance': {'timeout_seconds': 30, 'max_response_bytes': 500000},
              },
          }
          for name, payload in tickets.items():
              (root / name).write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Execute three real upstream probes
        id: execute
        shell: bash
        run: |
          set +e
          mkdir -p google-combined-artifacts/bigquery google-combined-artifacts/earth-engine google-combined-artifacts/data-commons
          python api-center/google-cloud/google_cloud_task.py execute \
            --ticket google-combined-artifacts/bigquery-ticket.json \
            --output-dir google-combined-artifacts/bigquery
          bq_rc=$?
          python api-center/google-cloud/google_cloud_task.py execute \
            --ticket google-combined-artifacts/earth-engine-ticket.json \
            --output-dir google-combined-artifacts/earth-engine
          ee_rc=$?
          python api-center/data-commons/data_commons_task.py execute \
            --ticket google-combined-artifacts/data-commons-ticket.json \
            --output-dir google-combined-artifacts/data-commons
          dc_rc=$?
          echo "bq_rc=$bq_rc" >> "$GITHUB_OUTPUT"
          echo "ee_rc=$ee_rc" >> "$GITHUB_OUTPUT"
          echo "dc_rc=$dc_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build safe probe report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('google-combined-artifacts')
          presence = json.loads((root / 'credential-presence.json').read_text(encoding='utf-8'))

          def load_snapshot(path, fallback_status):
              if not path.exists():
                  return {'status': fallback_status, 'failure': {'code': 'SNAPSHOT_MISSING', 'message': 'No snapshot was produced.'}}
              value = json.loads(path.read_text(encoding='utf-8'))
              return {
                  'status': value.get('status'),
                  'failure': value.get('failure'),
                  'snapshot_sha256': value.get('snapshot_sha256'),
                  'upstream_metadata': value.get('upstream_metadata'),
              }

          report = {
              'credential_presence': presence,
              'bigquery': load_snapshot(root / 'bigquery/gcp-snapshot.json', 'API_GCP_FAILED'),
              'earth_engine': load_snapshot(root / 'earth-engine/gcp-snapshot.json', 'API_GCP_FAILED'),
              'data_commons': load_snapshot(root / 'data-commons/data-commons-snapshot.json', 'API_DATA_COMMONS_FAILED'),
              'secret_values_included': False,
          }
          (root / 'probe-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')

          lines = ['## GOOGLE_COMBINED_CREDENTIAL_PROBE', '']
          for key, label in [('bigquery', 'BigQuery'), ('earth_engine', 'Earth Engine'), ('data_commons', 'Data Commons')]:
              row = report[key]
              failure = row.get('failure') or {}
              lines.append(f"- {label}: `{row.get('status')}`")
              if failure:
                  lines.append(f"  - Error: `{failure.get('code')}` — {failure.get('message')}")
          lines.extend([
              '',
              f"- BigQuery credential source: `{presence.get('bigquery_source') or 'missing'}`",
              f"- Earth Engine credential source: `{presence.get('earth_engine_source') or 'missing'}`",
              f"- Data Commons credential source: `{presence.get('data_commons_source') or 'missing'}`",
              '- Secret values exposed: `false`',
              f"- Run: `https://github.com/{__import__('os').environ['GITHUB_REPOSITORY']}/actions/runs/{__import__('os').environ['GITHUB_RUN_ID']}`",
          ])
          Path('google-combined-comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload probe evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-combined-credential-probe-${{ github.run_id }}
          path: google-combined-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Publish probe result
        if: always()
        run: |
          printf '\n- Artifact: %s\n' '${{ steps.upload.outputs.artifact-url }}' >> google-combined-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@google-combined-comment.md

      - name: Mark unsuccessful probe
        if: >-
          steps.execute.outputs.bq_rc != '0' ||
          steps.execute.outputs.ee_rc != '0' ||
          steps.execute.outputs.dc_rc != '0'
        run: exit 1
