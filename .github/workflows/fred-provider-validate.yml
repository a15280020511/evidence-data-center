name: Validate FRED Intelligence Provider

on:
  pull_request:
    paths:
      - "api-center/fred/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/fred-provider-validate.yml"
      - ".github/workflows/fred-api-ticket.yml"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/fred/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/fred-provider-validate.yml"
      - ".github/workflows/fred-api-ticket.yml"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-fred-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fred:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/fred/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/fred/requirements.txt
          python -m pip check

      - name: Compile and run FRED regressions
        run: |
          set -euo pipefail
          python -m py_compile api-center/managed_provider_runtime.py api-center/fred/fred_task.py api-center/fred/tests/test_fred.py
          python -m unittest discover -s api-center/fred/tests -p 'test_*.py' -v

      - name: Verify provider and catalog invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path('api-center/fred/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          schema = json.loads(Path('api-center/fred/ticket.schema.json').read_text(encoding='utf-8'))
          operation_ids = [row['operation_id'] for row in provider['operations']]
          assert provider['provider_id'] == 'fred'
          assert provider['ticket_prefix'] == '[intel-fred]'
          assert provider['required_secret_environment_variable'] == 'FRED_API_KEY'
          assert len(operation_ids) == len(set(operation_ids)) == 25
          assert set(operation_ids) == set(schema['properties']['operation']['enum'])
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['bulk_v2_release_download_allowed'] is False
          assert provider['limits']['maps_shapefile_download_allowed'] is False
          assert provider['limits']['arbitrary_paths_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in provider['operations'])
          print(json.dumps({'status':'PASS','provider':'fred','operations':25,'write_operations_allowed':False}))
          PY
          git diff --check
