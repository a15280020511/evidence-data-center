name: Test Tianditu WAF Fix

on:
  pull_request:
    branches: [main]
    paths:
      - "api-center/tianditu/**"
      - ".github/workflows/tianditu-api-ticket.yml"
      - ".github/workflows/apply-tianditu-waf-fix.yml"

permissions:
  contents: read

concurrency:
  group: test-tianditu-waf-fix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  live-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TIANDITU_API_KEY: ${{ secrets.TIANDITU_API_KEY }}
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/tianditu/requirements.txt
          python -m pip check

      - name: Run deterministic tests
        run: |
          python -m py_compile api-center/tianditu/tianditu_task.py
          python -m unittest discover -s api-center/tianditu/tests -v

      - name: Build minimal live ticket
        run: |
          mkdir -p tianditu-live
          cat > tianditu-live/ticket.json <<'JSON'
          {
            "task_id": "tianditu-waf-fix-live-20260801",
            "provider": "tianditu",
            "operation": "administrative-search",
            "objective": "Validate repaired Tianditu transport against the official API",
            "parameters": {
              "keyword": "小学",
              "specify": "福州市",
              "start": 0,
              "count": 1,
              "show": 1
            },
            "data_policy": {
              "classification": "public",
              "contains_personal_data": false
            },
            "acceptance": {
              "timeout_seconds": 45,
              "max_response_bytes": 1000000
            }
          }
          JSON

      - name: Execute real Tianditu request
        id: live
        continue-on-error: true
        run: |
          python api-center/tianditu/tianditu_task.py execute \
            --ticket tianditu-live/ticket.json \
            --output-dir tianditu-live

      - name: Print safe diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('tianditu-live/result.json').read_text(encoding='utf-8'))
          summary = {
              'status': result['status'],
              'metadata': result.get('metadata'),
              'failure': result.get('failure'),
              'secret_values_exposed': result['secret_values_exposed'],
              'snapshot_sha256': result['snapshot_sha256'],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload live diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tianditu-waf-live-${{ github.run_id }}
          path: tianditu-live/
          if-no-files-found: error
          retention-days: 30

      - name: Require business success
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('tianditu-live/result.json').read_text(encoding='utf-8'))
          if result['status'] != 'API_TIANDITU_COMPLETED':
              raise SystemExit(f"live probe failed: {result.get('failure')}")
          if str(result.get('metadata', {}).get('business_status')) != '1000':
              raise SystemExit('Tianditu business status is not 1000')
          PY
