name: Apply Tianditu WAF Fix

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/apply_tianditu_waf_fix.py"
      - ".github/workflows/apply-tianditu-waf-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-tianditu-waf-fix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/tianditu/requirements.txt
          python -m pip check

      - name: Apply deterministic repair
        run: |
          python tools/apply_tianditu_waf_fix.py
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('api-center/tianditu/tianditu_task.py')
          text = path.read_text(encoding='utf-8')
          pattern = r'^        config_lines = \[f\'url = .*?\n'
          replacement = (
              '        escaped_url = url.replace("\\\\", "\\\\\\\\").replace(\'"\', \'\\\\"\')\n'
              '        config_lines = [f\'url = "{escaped_url}"\']\n'
          )
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'expected one curl URL line, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY
          python api-center/build_catalog_market_search.py

      - name: Validate repaired implementation
        run: |
          python -m py_compile api-center/tianditu/tianditu_task.py
          python -m unittest discover -s api-center/tianditu/tests -v
          python -m unittest discover -s api-center/tests -v

      - name: Commit repaired contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            api-center/tianditu/tianditu_task.py \
            api-center/tianditu/tests/test_tianditu_task.py \
            api-center/tianditu/provider-catalog.json \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            .github/workflows/tianditu-api-ticket.yml
          if git diff --cached --quiet; then
            echo 'No repair changes generated'
            exit 1
          fi
          git commit -m 'fix(api-center): harden Tianditu CloudWAF transport'
          git push origin HEAD:${{ github.head_ref }}
