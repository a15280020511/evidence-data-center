name: Temporary Run Baidu Summary Migration V2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tmp-run-baidu-summary-migration-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/restore-serpapi-and-test-baidu-summary-20260804
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baidu-ai-cloud/requirements.txt
          python -m pip install --disable-pip-version-check --no-input -r api-center/market-search/requirements.txt
          python -m pip check

      - name: Apply migration and regenerate contracts
        run: |
          python tools/tmp_run_baidu_summary_migration.py
          python api-center/baidu-ai-cloud/build_free_catalog.py
          python api-center/build_catalog_market_search.py \
            --json-output api-center/api-catalog.json \
            --markdown-output api-center/api-catalog.md

      - name: Run focused regressions
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/baidu-ai-cloud/build_free_catalog.py \
            api-center/baidu-ai-cloud/baidu_ai_cloud_task.py \
            api-center/market-search/market_search_task.py
          PYTHONPATH=api-center python -m unittest discover \
            -s api-center/baidu-ai-cloud/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/market-search/tests -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          git diff --check

      - name: Commit production files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-center
          git commit -m 'feat: enable verified Baidu web summary search'
          git push origin HEAD:fix/restore-serpapi-and-test-baidu-summary-20260804
