name: Google Three Live Smoke

on:
  push:
    branches:
      - feat/add-overture-oecd-alphafeed
    paths:
      - ".github/google-three-live-smoke.once"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DATA_COMMONS_API_KEY: ${{ secrets.GOOGLE_DATA_COMMONS_API_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/data-commons/requirements.txt
          python -m pip check

      - name: Run real upstream checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p google-three-evidence
          python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          gcp_dir = root / 'api-center' / 'google-cloud'
          dc_dir = root / 'api-center' / 'data-commons'
          sys.path.insert(0, str(gcp_dir))
          sys.path.insert(0, str(dc_dir))

          import unified_google_credentials as unified
          import google_cloud_task as gcp
          import data_commons_task as dc

          results = {
              'schema_version': 'google-three-live-smoke-v1',
              'status': 'PASS',
              'secret_values_exposed': False,
              'providers': {},
          }

          def record_failure(name, exc):
              results['status'] = 'FAIL'
              results['providers'][name] = {
                  'status': 'FAIL',
                  'error_type': type(exc).__name__,
                  'error': str(exc)[:1200],
                  'secret_value_exposed': False,
              }

          raw_bundle = os.getenv('GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON', '')
          try:
              service_account = unified.parse_bundle(raw_bundle)
              encoded = json.dumps(service_account, ensure_ascii=False, separators=(',', ':'))
              os.environ['BIGQUERY_SERVICE_ACCOUNT_JSON'] = encoded
              os.environ['EARTH_ENGINE_SERVICE_ACCOUNT_JSON'] = encoded
          except Exception as exc:
              record_failure('google-cloud-bundle', exc)
              service_account = None

          if service_account is not None:
              try:
                  credentials, billing_project = gcp._credentials(gcp.BIGQUERY_SERVICE_ACCOUNT_ENV)
                  data, metadata = gcp._bigquery_query(
                      {
                          'sql': 'SELECT 1 AS connectivity_test',
                          'location': 'US',
                          'maximum_bytes_billed': 1000000,
                          'max_rows': 1,
                          'timeout_ms': 15000,
                      },
                      str(credentials.token),
                      billing_project,
                      30,
                  )
                  rows = data.get('rows') if isinstance(data, dict) else None
                  assert isinstance(rows, list) and rows and rows[0].get('connectivity_test') == 1
                  results['providers']['bigquery'] = {
                      'status': 'PASS',
                      'http_status': metadata.get('http_status'),
                      'dry_run_http_status': metadata.get('dry_run_http_status'),
                      'returned_rows': data.get('returned_rows'),
                      'total_bytes_billed': data.get('total_bytes_billed'),
                      'query_result': 1,
                      'oauth_token_refreshed': True,
                      'secret_value_exposed': False,
                  }
              except Exception as exc:
                  record_failure('bigquery', exc)

              try:
                  credentials, billing_project = gcp._credentials(gcp.EARTH_ENGINE_SERVICE_ACCOUNT_ENV)
                  data, metadata = gcp._earth_engine_algorithms(
                      {'offset': 0, 'max_results': 1},
                      str(credentials.token),
                      billing_project,
                      30,
                  )
                  assert isinstance(data, dict)
                  assert int(data.get('total_matching') or 0) > 0
                  assert int(data.get('returned') or 0) == 1
                  results['providers']['earth-engine'] = {
                      'status': 'PASS',
                      'http_status': metadata.get('http_status'),
                      'total_algorithms': data.get('total_matching'),
                      'returned_algorithms': data.get('returned'),
                      'oauth_token_refreshed': True,
                      'secret_value_exposed': False,
                  }
              except Exception as exc:
                  record_failure('earth-engine', exc)

          try:
              api_key = dc._validate_api_key(os.getenv(dc.API_KEY_ENV))
              payload, metadata = dc._request_json(
                  '/resolve',
                  api_key=api_key,
                  body={'nodes': ['China'], 'resolver': 'place'},
                  timeout=30,
                  max_bytes=1000000,
              )
              assert isinstance(payload, dict) and payload
              results['providers']['data-commons'] = {
                  'status': 'PASS',
                  'http_status': metadata.get('http_status'),
                  'endpoint': '/resolve',
                  'nonempty_payload': True,
                  'api_key_configured': True,
                  'secret_value_exposed': False,
              }
          except Exception as exc:
              record_failure('data-commons', exc)

          target = Path('google-three-evidence/summary.json')
          target.write_text(json.dumps(results, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(results, ensure_ascii=False))
          if results['status'] != 'PASS':
              raise SystemExit(1)
          PY

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-three-live-smoke-${{ github.run_id }}
          path: google-three-evidence/summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify no credential material was written
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f google-three-evidence/summary.json
          if [ -n "${GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON:-}" ]; then
            ! grep -R --fixed-strings -- "${GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON}" google-three-evidence
          fi
          if [ -n "${GOOGLE_DATA_COMMONS_API_KEY:-}" ]; then
            ! grep -R --fixed-strings -- "${GOOGLE_DATA_COMMONS_API_KEY}" google-three-evidence
          fi
          ! grep -R --extended-regexp -- '-----BEGIN (RSA )?PRIVATE KEY-----|ya29\.[A-Za-z0-9._-]+' google-three-evidence
          git diff --check
