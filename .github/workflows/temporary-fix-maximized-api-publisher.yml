name: Temporary fix maximized API publisher

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-fix-maximized-api-publisher]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Replace brittle matcher with version migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temporary-publish-maximized-api-capabilities.yml')
          text = path.read_text(encoding='utf-8')
          old = '''("assert catalog['schema_version'] == 'api-catalog-v2'", "assert catalog['schema_version'] == 'api-catalog-v3'"),'''
          new = '''('api-catalog-v2', 'api-catalog-v3'),'''
          if old not in text:
              raise SystemExit('brittle matcher not found')
          text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('version migration matcher was not installed')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-fix-maximized-api-publisher.yml
          git diff --check

      - name: Commit publisher correction
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: make capability publisher version migration robust"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger corrected gated release
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title='[maintenance-publish-maximized-api-capabilities] corrected final gated release' \
            -f body='Corrected deterministic contract migration matcher. Re-run SHA-verified archive recovery, all locked dependencies, complete tests, Wind real smoke, and AKShare real smoke. Publish only after every gate passes.' >/tmp/retry-issue.json
          retry_number="$(python -c 'import json; print(json.load(open("/tmp/retry-issue.json"))["number"])')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=completed\nPUBLISHER_FIX_SHA=${{ steps.commit.outputs.sha }}\nRETRY_ISSUE=${retry_number}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" \
            -f state=closed -f state_reason=completed >/dev/null

      - name: Report structured failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=failed\nRUN_ID=${GITHUB_RUN_ID}"
