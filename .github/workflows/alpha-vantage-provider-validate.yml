name: Validate Alpha Vantage Provider

on:
  pull_request:
    paths:
      - "api-center/alpha-vantage/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/alpha-vantage-provider-validate.yml"
      - ".github/workflows/alpha-vantage-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/alpha-vantage/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/alpha-vantage-provider-validate.yml"
      - ".github/workflows/alpha-vantage-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/alpha-vantage/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/alpha-vantage/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/alpha-vantage/alpha_vantage_task.py api-center/alpha-vantage/tests/*.py
          python -m unittest discover -s api-center/alpha-vantage/tests -p 'test_*.py' -v

      - name: Validate fixed read-only contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/alpha-vantage')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'alpha-vantage'
          assert provider['ticket_prefix'] == '[api-alpha-vantage]'
          assert provider['required_secret_environment_variable'] == 'ALPHA_VANTAGE_API_KEY'
          assert provider['limits']['fixed_api_host'] == 'www.alphavantage.co'
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['provider_concurrency_max'] == 1
          assert len(provider['operations']) == 66
          operation_ids = {row['operation_id'] for row in provider['operations']}
          assert {
              'catalog-capabilities', 'stock-daily', 'company-overview',
              'news-sentiment', 'fx-daily', 'digital-currency-daily',
              'wti', 'real-gdp', 'sma'
          }.issubset(operation_ids)
          for key in (
              'arbitrary_functions_allowed',
              'arbitrary_urls_allowed',
              'arbitrary_headers_allowed',
              'client_supplied_api_key_allowed',
              'redirects_allowed',
              'csv_allowed',
              'write_operations_allowed',
              'trading_or_order_execution_allowed',
          ):
              assert provider['limits'][key] is False
          serialized = json.dumps(catalog, ensure_ascii=False)
          assert 'apikey=' not in serialized
          assert 'demo' not in serialized
          print(json.dumps({'status': 'PASS', 'operations': 66}))
          PY

      - name: Verify repository contains no credential material
        run: |
          ! grep -RInE 'ALPHA_VANTAGE_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9]{8,}' api-center/alpha-vantage .github/workflows/alpha-vantage-*.yml
          git diff --check
