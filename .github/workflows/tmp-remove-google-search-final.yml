name: Temporary Final Google Search Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tmp-remove-google-search-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/remove-all-google-search
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-center/market-search/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/market-search/requirements.txt
          python -m pip check

      - name: Execute deterministic cleanup and recover normalized tests
        run: |
          python - <<'PY'
          from pathlib import Path

          staged = Path('.github/workflows/tmp-remove-google-search.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Regenerate authoritative catalogs"
          start = staged.index(start_marker) + len(start_marker)
          end = staged.index(end_marker, start)
          lines = staged[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/remove_google_search.py').write_text(script, encoding='utf-8')

          runner = Path('.github/workflows/tmp-remove-google-search-pr.yml').read_text(encoding='utf-8')
          test_start_marker = "          cat > api-center/market-search/tests/test_market_search_task.py <<'PYTEST'\n"
          test_end_marker = "\n          PYTEST\n\n      - name: Harden future residue validation"
          test_start = runner.index(test_start_marker) + len(test_start_marker)
          test_end = runner.index(test_end_marker, test_start)
          test_lines = runner[test_start:test_end].splitlines()
          tests = "\n".join(line[10:] if line.startswith("          ") else line for line in test_lines) + "\n"
          Path('/tmp/test_market_search_task.py').write_text(tests, encoding='utf-8')
          PY
          python /tmp/remove_google_search.py
          cp /tmp/test_market_search_task.py api-center/market-search/tests/test_market_search_task.py

      - name: Install TickFlow-only validation workflow
        run: |
          cat > .github/workflows/market-search-provider-validate.yml <<'VALIDATE'
          name: Validate TickFlow Provider

          on:
            pull_request:
              paths:
                - "api-center/market-search/**"
                - "api-center/build_catalog.py"
                - "api-center/build_catalog_market_search.py"
                - "api-center/api-catalog.json"
                - "api-center/api-catalog.md"
                - ".github/workflows/tickflow-api-ticket.yml"
                - ".github/workflows/market-search-provider-validate.yml"
                - ".github/workflows/api-catalog-validate.yml"
            push:
              branches: [main]
              paths:
                - "api-center/market-search/**"
                - "api-center/build_catalog.py"
                - "api-center/build_catalog_market_search.py"
                - "api-center/api-catalog.json"
                - "api-center/api-catalog.md"
                - ".github/workflows/tickflow-api-ticket.yml"
                - ".github/workflows/market-search-provider-validate.yml"
                - ".github/workflows/api-catalog-validate.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate-market-search:
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - name: Checkout pinned source
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    persist-credentials: false

                - name: Set up isolated Python
                  uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: api-center/market-search/requirements.txt

                - name: Install pinned dependencies
                  run: |
                    python -m pip install --disable-pip-version-check --no-input -r api-center/market-search/requirements.txt
                    python -m pip check

                - name: Compile and run unit tests
                  run: |
                    python -m py_compile api-center/market-search/market_search_task.py api-center/market-search/tests/*.py
                    python -m unittest discover -s api-center/market-search/tests -v

                - name: Validate TickFlow-only catalog and schema
                  run: |
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    from jsonschema import Draft202012Validator

                    root = Path('api-center/market-search')
                    schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
                    catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
                    Draft202012Validator.check_schema(schema)
                    assert catalog['schema_version'] == 'market-search-provider-catalog-v2'
                    assert catalog['secret_values_exposed'] is False
                    providers = {row['provider_id']: row for row in catalog['providers']}
                    assert set(providers) == {'tickflow'}
                    assert providers['tickflow']['required_secret_environment_variable'] == 'TICKFLOW_API_KEY'
                    assert providers['tickflow']['ticket_prefix'] == '[api-tickflow]'
                    assert {row['operation_id'] for row in providers['tickflow']['operations']} == {
                        'catalog-capabilities', 'quotes', 'klines', 'intraday-klines', 'instruments'
                    }
                    assert schema['properties']['provider']['enum'] == ['tickflow']
                    print(json.dumps({'status': 'PASS', 'providers': 1, 'operations': 5}))
                    PY

                - name: Verify credential and unsafe-operation exclusions
                  run: |
                    set -euo pipefail
                    if grep -R --line-number --exclude-dir=tests --exclude-dir=__pycache__ --extended-regexp \
                      '(tickflow-secret|TICKFLOW_API_KEY[[:space:]]*=)' api-center/market-search; then
                      echo "literal credential material found" >&2
                      exit 1
                    fi
                    if grep -R --line-number --exclude-dir=tests --exclude-dir=__pycache__ --ignore-case --extended-regexp \
                      '(place[_ -]?order|cancel[_ -]?order|account balance|trade execution|websocket connect|arbitrary endpoint)' \
                      api-center/market-search/market_search_task.py; then
                      echo "unsafe TickFlow operation implementation found" >&2
                      exit 1
                    fi

                - name: Upload deterministic contracts
                  if: always()
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: tickflow-provider-validation-${{ github.run_id }}
                    path: |
                      api-center/market-search/provider-catalog.json
                      api-center/market-search/ticket.schema.json
                    if-no-files-found: error
                    retention-days: 30
          VALIDATE

      - name: Regenerate catalogs and run regressions
        run: |
          python api-center/build_catalog_market_search.py \
            --json-output api-center/api-catalog.json \
            --markdown-output api-center/api-catalog.md
          python -m py_compile api-center/market-search/market_search_task.py api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/market-search/tests -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          if git grep -nEi 'serpapi|google-search|google_news|google-scholar|SERPAPI_API_KEY' -- \
            ':!.github/workflows/tmp-remove-google-search.yml' \
            ':!.github/workflows/tmp-remove-google-search-pr.yml' \
            ':!.github/workflows/tmp-remove-google-search-final.yml'; then
            echo "Google search residue remains" >&2
            exit 1
          fi
          git diff --check

      - name: Delete temporary runners and commit final cleanup
        run: |
          rm .github/workflows/tmp-remove-google-search.yml
          rm .github/workflows/tmp-remove-google-search-pr.yml
          rm .github/workflows/tmp-remove-google-search-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove all Google search integrations'
          git push origin HEAD:chore/remove-all-google-search
