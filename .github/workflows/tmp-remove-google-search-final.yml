name: Temporary Final Google Search Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tmp-remove-google-search-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/remove-all-google-search
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-center/market-search/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/market-search/requirements.txt
          python -m pip check

      - name: Execute deterministic cleanup and recover normalized tests
        run: |
          python - <<'PY'
          from pathlib import Path

          staged = Path('.github/workflows/tmp-remove-google-search.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Regenerate authoritative catalogs"
          start = staged.index(start_marker) + len(start_marker)
          end = staged.index(end_marker, start)
          lines = staged[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/remove_google_search.py').write_text(script, encoding='utf-8')

          runner = Path('.github/workflows/tmp-remove-google-search-pr.yml').read_text(encoding='utf-8')
          test_start_marker = "          cat > api-center/market-search/tests/test_market_search_task.py <<'PYTEST'\n"
          test_end_marker = "\n          PYTEST\n\n      - name: Harden future residue validation"
          test_start = runner.index(test_start_marker) + len(test_start_marker)
          test_end = runner.index(test_end_marker, test_start)
          test_lines = runner[test_start:test_end].splitlines()
          tests = "\n".join(line[10:] if line.startswith("          ") else line for line in test_lines) + "\n"
          Path('/tmp/test_market_search_task.py').write_text(tests, encoding='utf-8')
          PY
          python /tmp/remove_google_search.py
          cp /tmp/test_market_search_task.py api-center/market-search/tests/test_market_search_task.py

      - name: Replace self-matching production guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/market-search-provider-validate.yml')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"          if git grep -nEi 'serpapi\|google-search\|google_news\|google-scholar\|SERPAPI_API_KEY'.*?          fi\n",
              re.S,
          )
          replacement_lines = [
              "          python - <<'PYSCAN'",
              "          from pathlib import Path",
              "",
              "          removed_terms = (",
              "              'ser' + 'papi',",
              "              'google-' + 'search',",
              "              'google_' + 'news',",
              "              'google-' + 'scholar',",
              "              'SERPAPI_' + 'API_KEY',",
              "          )",
              "          for candidate in Path('.').rglob('*'):",
              "              if not candidate.is_file() or '.git' in candidate.parts:",
              "                  continue",
              "              try:",
              "                  content = candidate.read_text(encoding='utf-8')",
              "              except (UnicodeDecodeError, OSError):",
              "                  continue",
              "              if any(term.casefold() in content.casefold() for term in removed_terms):",
              "                  raise SystemExit(f'removed search integration residue: {candidate}')",
              "          PYSCAN",
          ]
          replacement = "\n".join(replacement_lines) + "\n"
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('unable to replace self-matching production guard')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Regenerate catalogs and run regressions
        run: |
          python api-center/build_catalog_market_search.py \
            --json-output api-center/api-catalog.json \
            --markdown-output api-center/api-catalog.md
          python -m py_compile api-center/market-search/market_search_task.py api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/market-search/tests -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          if git grep -nEi 'serpapi|google-search|google_news|google-scholar|SERPAPI_API_KEY' -- \
            ':!.github/workflows/tmp-remove-google-search.yml' \
            ':!.github/workflows/tmp-remove-google-search-pr.yml' \
            ':!.github/workflows/tmp-remove-google-search-final.yml'; then
            echo "Google search residue remains" >&2
            exit 1
          fi
          git diff --check

      - name: Delete temporary runners and commit final cleanup
        run: |
          rm .github/workflows/tmp-remove-google-search.yml
          rm .github/workflows/tmp-remove-google-search-pr.yml
          rm .github/workflows/tmp-remove-google-search-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove all Google search integrations'
          git push origin HEAD:chore/remove-all-google-search
