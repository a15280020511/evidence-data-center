name: One-time DOAB OAI Downgrade

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  downgrade:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] downgrade DOAB OAI endpoint 20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/open-intelligence-toolkit-20260804
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded catalog dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python -m pip check

      - name: Downgrade unstable endpoint and rebuild catalogs
        id: repair
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/doab-downgrade.log 2>&1
          import json
          from pathlib import Path

          root = Path('api-center/global-knowledge-archives')
          matrix_path = root / 'source-access-matrix.json'
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          removed = [row for row in matrix['sources'] if row.get('source_id') == 'doab-oai']
          if len(removed) != 1:
              raise RuntimeError(f'expected exactly one active doab-oai source, found {len(removed)}')
          matrix['sources'] = [row for row in matrix['sources'] if row.get('source_id') != 'doab-oai']
          matrix['active_source_count'] = len(matrix['sources'])
          if matrix['active_source_count'] != 15:
              raise RuntimeError(f'unexpected active source count {matrix["active_source_count"]}')
          if not any(row.get('source_id') == 'doab-oai' for row in matrix['not_enabled']):
              matrix['not_enabled'].append({
                  'source_id': 'doab-oai',
                  'reason': 'The official DOAB OAI-PMH Identify endpoint returned HTTP 520 in repeated bounded GitHub Actions production probes on 2026-08-04. The connector remains registered as a conditional capability; existing OpenAlex, Crossref, DataCite, Open Library and other literature sources cover production discovery until the endpoint is reliable.'
              })
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          catalog_path = root / 'provider-catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          provider = catalog['providers'][0]
          provider['catalog_policy'] = provider['catalog_policy'].replace('16个固定HTTPS来源', '15个固定HTTPS来源')
          provider['limits']['source_count'] = 15
          for operation_id in ('oai-identify', 'oai-list-records', 'oai-get-record'):
              operation = next(row for row in provider['operations'] if row['operation_id'] == operation_id)
              enum = operation['parameter_schema']['properties']['source_id']['enum']
              operation['parameter_schema']['properties']['source_id']['enum'] = [item for item in enum if item != 'doab-oai']
              if operation['parameter_schema']['properties']['source_id']['enum'] != ['hal-oai', 'rijksmuseum-oai']:
                  raise RuntimeError(f'unexpected {operation_id} source enum')
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator_path = root / 'validate_global_knowledge_archives.py'
          text = validator_path.read_text(encoding='utf-8')
          text = text.replace(
              'assert len(sources) == matrix["active_source_count"] == provider["limits"]["source_count"] == 16',
              'assert len(sources) == matrix["active_source_count"] == provider["limits"]["source_count"] == 15',
              1,
          )
          live_line = '    "doab-oai": ("oai-identify", {"source_id": "doab-oai"}),\n'
          if live_line not in text:
              raise RuntimeError('expected DOAB live case not found')
          text = text.replace(live_line, '', 1)
          validator_path.write_text(text, encoding='utf-8')
          PY
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python api-center/build_catalog_market_search.py >> /tmp/doab-downgrade.log 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python -m py_compile \
              api-center/global-knowledge-archives/global_knowledge_archives_task.py \
              api-center/global-knowledge-archives/validate_global_knowledge_archives.py >> /tmp/doab-downgrade.log 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            PYTHONPATH=api-center/global-knowledge-archives:api-center \
              python api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
                --output /tmp/global-knowledge-archives-registry.json >> /tmp/doab-downgrade.log 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            git diff --check >> /tmp/doab-downgrade.log 2>&1 || rc=$?
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit ordinary production contracts
        if: steps.repair.outputs.exit_code == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            api-center/global-knowledge-archives/source-access-matrix.json \
            api-center/global-knowledge-archives/provider-catalog.json \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m 'fix: downgrade unstable DOAB OAI endpoint'
          git push origin HEAD:feat/open-intelligence-toolkit-20260804
          echo 'commit_and_push=success' >> /tmp/doab-downgrade.log

      - name: Record diagnostic receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXIT_CODE: ${{ steps.repair.outputs.exit_code }}
        run: |
          {
            echo '## DOAB OAI downgrade receipt'
            echo
            echo "- Exit code: \`${EXIT_CODE:-missing}\`"
            echo '- Target branch: `feat/open-intelligence-toolkit-20260804`'
            echo
            echo '```text'
            tail -n 100 /tmp/doab-downgrade.log 2>/dev/null || true
            echo '```'
          } > /tmp/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-comment.md
          test "${EXIT_CODE:-missing}" = '0'
