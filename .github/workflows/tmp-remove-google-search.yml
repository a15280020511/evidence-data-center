name: Temporary Remove Google Search

on:
  push:
    branches:
      - chore/remove-all-google-search
    paths:
      - .github/workflows/tmp-remove-google-search.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/remove-all-google-search
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-center/market-search/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/market-search/requirements.txt
          python -m pip check

      - name: Remove all Google search capability
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def write_json(path: Path, value: object) -> None:
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\n", encoding="utf-8")

          root = Path('.')
          market = root / 'api-center/market-search'

          # Remove the entire SerpAPI provider. It exposed only Google Search,
          # Google News, and Google Scholar proxy operations.
          catalog_path = market / 'provider-catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          catalog['schema_version'] = 'market-search-provider-catalog-v2'
          catalog['providers'] = [
              row for row in catalog['providers'] if row.get('provider_id') != 'serpapi'
          ]
          if [row.get('provider_id') for row in catalog['providers']] != ['tickflow']:
              raise SystemExit('unexpected provider catalog after SerpAPI removal')
          write_json(catalog_path, catalog)

          schema_path = market / 'ticket.schema.json'
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          schema['title'] = 'Managed TickFlow ticket'
          schema['properties']['provider']['enum'] = ['tickflow']
          schema['properties']['operation']['enum'] = [
              'catalog-capabilities', 'quotes', 'klines', 'intraday-klines', 'instruments'
          ]
          write_json(schema_path, schema)

          task_path = market / 'market_search_task.py'
          text = task_path.read_text(encoding='utf-8')
          text = text.replace(
              '"""Bounded, read-only TickFlow and SerpAPI execution control plane."""',
              '"""Bounded, read-only TickFlow execution control plane."""',
          )
          text = text.replace('SERPAPI_API_KEY_ENV = "SERPAPI_API_KEY"\n', '')
          text = re.sub(
              r'PROVIDER_OPERATIONS = \{\n.*?\n\}\n',
              'PROVIDER_OPERATIONS = {\n'
              '    "tickflow": {"catalog-capabilities", "quotes", "klines", "intraday-klines", "instruments"},\n'
              '}\n',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(r'^TIME_RANGES = .*?\n', '', text, count=1, flags=re.M)
          text = re.sub(
              r'def expected_prefix\(provider: str\) -> str:\n.*?\n\n',
              'def expected_prefix(provider: str) -> str:\n'
              '    if provider != "tickflow":\n'
              '        raise ValueError(f"unsupported provider: {provider}")\n'
              '    return "[api-tickflow]"\n\n',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'def optional_code\(.*?\n\n(?=def symbols)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'def provider_key\(provider: str\).*?\n\n(?=def scrub)',
              'def provider_key(provider: str) -> tuple[str, str]:\n'
              '    if provider != "tickflow":\n'
              '        raise ValueError(f"unsupported provider: {provider}")\n'
              '    name = TICKFLOW_API_KEY_ENV\n'
              '    key = str(os.getenv(name) or "").strip()\n'
              '    if not key:\n'
              '        raise RuntimeError(f"missing repository Secret {name}")\n'
              '    return name, key\n\n',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'def serpapi_query\(.*?\n\n(?=def execute)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              '        elif provider == "tickflow":\n'
              '            data, metadata, credential_secret_name = tickflow_query(operation, parameters, timeout, max_bytes)\n'
              '        else:\n'
              '            data, metadata, credential_secret_name = serpapi_query(operation, parameters, timeout, max_bytes)\n',
              '        elif provider == "tickflow":\n'
              '            data, metadata, credential_secret_name = tickflow_query(operation, parameters, timeout, max_bytes)\n'
              '        else:\n'
              '            raise ValueError(f"unsupported provider: {provider}")\n',
          )
          banned = ('serpapi', 'google-search', 'google-news', 'google-scholar', 'SERPAPI_API_KEY')
          lowered = text.casefold()
          if any(item.casefold() in lowered for item in banned):
              raise SystemExit('Google search residue remains in market_search_task.py')
          task_path.write_text(text, encoding='utf-8')

          tests_path = market / 'tests/test_market_search_task.py'
          tests_path.write_text('''from __future__ import annotations

import importlib.util
import json
import os
import tempfile
import unittest
from pathlib import Path
from unittest.mock import patch

ROOT = Path(__file__).resolve().parents[1]
SPEC = importlib.util.spec_from_file_location("market_search_task", ROOT / "market_search_task.py")
assert SPEC and SPEC.loader
MODULE = importlib.util.module_from_spec(SPEC)
SPEC.loader.exec_module(MODULE)


class FakeResponse:
    def __init__(self, payload: dict, status: int = 200):
        self.status = status
        self.raw = json.dumps(payload).encode("utf-8")
        self.headers = {"Content-Type": "application/json"}

    def __enter__(self):
        return self

    def __exit__(self, exc_type, exc, tb):
        return False

    def read(self, amount: int) -> bytes:
        return self.raw[:amount]


def ticket(operation: str, parameters: dict) -> dict:
    return {
        "task_id": f"test-tickflow-{operation}",
        "provider": "tickflow",
        "operation": operation,
        "objective": "deterministic validation",
        "parameters": parameters,
        "data_policy": {"classification": "public", "contains_personal_data": False},
        "acceptance": {"timeout_seconds": 30, "max_response_bytes": 1000000},
    }


class MarketSearchTaskTests(unittest.TestCase):
    def test_catalog_contract(self):
        catalog = MODULE.load_json(ROOT / "provider-catalog.json")
        providers = {row["provider_id"]: row for row in catalog["providers"]}
        self.assertEqual(set(providers), {"tickflow"})
        self.assertEqual(providers["tickflow"]["required_secret_environment_variable"], "TICKFLOW_API_KEY")
        self.assertEqual(len(providers["tickflow"]["operations"]), 5)

    def test_rejects_removed_provider(self):
        removed = ticket("quotes", {"symbols": ["600000.SH"]})
        removed["provider"] = "ser" + "papi"
        with self.assertRaises(ValueError):
            MODULE.validate_ticket(removed)

    def test_prepare_requires_tickflow_prefix(self):
        with tempfile.TemporaryDirectory() as tmp:
            event = Path(tmp) / "event.json"
            out = Path(tmp) / "out"
            event.write_text(json.dumps({"issue": {"title": "[api-removed] wrong", "body": json.dumps(ticket("quotes", {"symbols": ["600000.SH"]}))}}), encoding="utf-8")
            self.assertEqual(MODULE.prepare(event, out), 1)
            status = MODULE.load_json(out / "ticket-status.json")
            self.assertFalse(status["accepted"])
            self.assertIn("[api-tickflow]", status["reason"])

    def test_tickflow_quotes_uses_header_and_fixed_endpoint(self):
        captured = {}

        def fake_urlopen(request, timeout):
            captured["url"] = request.full_url
            captured["key"] = request.headers.get("X-api-key")
            return FakeResponse({"data": [{"symbol": "600000.SH", "last_price": 10.0}]})

        with patch.dict(os.environ, {"TICKFLOW_API_KEY": "tickflow-secret"}, clear=False), patch.object(MODULE.urllib.request, "urlopen", side_effect=fake_urlopen):
            data, metadata, secret_name = MODULE.tickflow_query("quotes", {"symbols": ["600000.SH"]}, 30, 1000000)
        self.assertEqual(secret_name, "TICKFLOW_API_KEY")
        self.assertEqual(captured["key"], "tickflow-secret")
        self.assertTrue(captured["url"].startswith("https://api.tickflow.org/v1/quotes?"))
        self.assertNotIn("tickflow-secret", json.dumps(data))
        self.assertEqual(metadata["request_path"], "/v1/quotes")

    def test_execute_missing_tickflow_secret_is_structured_failure(self):
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            ticket_path = root / "ticket.json"
            ticket_path.write_text(json.dumps(ticket("quotes", {"symbols": ["600000.SH"]})), encoding="utf-8")
            with patch.dict(os.environ, {}, clear=True):
                self.assertEqual(MODULE.execute(ticket_path, root), 1)
            status = MODULE.load_json(root / "execution-status.json")
            self.assertEqual(status["status"], "API_MARKET_SEARCH_FAILED")
            self.assertIn("TICKFLOW_API_KEY", status["failure"]["message"])
            self.assertFalse(status["secret_values_exposed"])


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          build_path = root / 'api-center/build_catalog_market_search.py'
          build_text = build_path.read_text(encoding='utf-8')
          build_text = build_text.replace('    "serpapi": 4,\n', '')
          build_path.write_text(build_text, encoding='utf-8')

          catalog_test_path = root / 'api-center/tests/test_api_catalog.py'
          catalog_test = catalog_test_path.read_text(encoding='utf-8')
          catalog_test = catalog_test.replace('    "serpapi": 4,\n', '')
          catalog_test = catalog_test.replace('            "serpapi": "SERPAPI_API_KEY",\n', '')
          catalog_test_path.write_text(catalog_test, encoding='utf-8')

          capability_path = root / 'api-center/tests/test_capability_maximization.py'
          capability = capability_path.read_text(encoding='utf-8')
          capability = capability.replace('            "serpapi": 4,\n', '')
          capability = capability.replace('        serpapi_limits = market_providers["serpapi"]["limits"]\n', '')
          capability = capability.replace('        self.assertFalse(serpapi_limits["async_allowed"])\n', '')
          capability = capability.replace('        self.assertFalse(serpapi_limits["html_output_allowed"])\n', '')
          capability = capability.replace('        self.assertFalse(serpapi_limits["arbitrary_engine_allowed"])\n', '')
          capability_path.write_text(capability, encoding='utf-8')

          validation_path = root / '.github/workflows/market-search-provider-validate.yml'
          validation_path.write_text('''name: Validate TickFlow Provider

on:
  pull_request:
    paths:
      - "api-center/market-search/**"
      - "api-center/build_catalog.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/tickflow-api-ticket.yml"
      - ".github/workflows/market-search-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/market-search/**"
      - "api-center/build_catalog.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/tickflow-api-ticket.yml"
      - ".github/workflows/market-search-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-market-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/market-search/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/market-search/requirements.txt
          python -m pip check

      - name: Compile and run unit tests
        run: |
          python -m py_compile api-center/market-search/market_search_task.py api-center/market-search/tests/*.py
          python -m unittest discover -s api-center/market-search/tests -v

      - name: Validate TickFlow-only catalog and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/market-search')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert catalog['schema_version'] == 'market-search-provider-catalog-v2'
          assert catalog['secret_values_exposed'] is False
          providers = {row['provider_id']: row for row in catalog['providers']}
          assert set(providers) == {'tickflow'}
          assert providers['tickflow']['required_secret_environment_variable'] == 'TICKFLOW_API_KEY'
          assert providers['tickflow']['ticket_prefix'] == '[api-tickflow]'
          assert {row['operation_id'] for row in providers['tickflow']['operations']} == {
              'catalog-capabilities', 'quotes', 'klines', 'intraday-klines', 'instruments'
          }
          assert schema['properties']['provider']['enum'] == ['tickflow']
          print(json.dumps({'status': 'PASS', 'providers': 1, 'operations': 5}))
          PY

      - name: Verify Google search removal and safety
        run: |
          set -euo pipefail
          if git grep -nEi 'serpapi|google-search|google_news|google-scholar|SERPAPI_API_KEY' -- ':!*.md'; then
            echo "Google search implementation residue found" >&2
            exit 1
          fi
          if grep -R --line-number --exclude-dir=tests --exclude-dir=__pycache__ --extended-regexp \
            '(tickflow-secret|TICKFLOW_API_KEY[[:space:]]*=)' api-center/market-search; then
            echo "literal credential material found" >&2
            exit 1
          fi

      - name: Upload deterministic contracts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tickflow-provider-validation-${{ github.run_id }}
          path: |
            api-center/market-search/provider-catalog.json
            api-center/market-search/ticket.schema.json
          if-no-files-found: error
          retention-days: 30
''', encoding='utf-8')

          serp_workflow = root / '.github/workflows/serpapi-api-ticket.yml'
          if serp_workflow.exists():
              serp_workflow.unlink()
          PY

      - name: Regenerate authoritative catalogs
        run: |
          python api-center/build_catalog_market_search.py \
            --json-output api-center/api-catalog.json \
            --markdown-output api-center/api-catalog.md

      - name: Validate removal and regressions
        run: |
          python -m py_compile api-center/market-search/market_search_task.py api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/market-search/tests -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          if git grep -nEi 'serpapi|google-search|google_news|google-scholar|SERPAPI_API_KEY'; then
            echo "Google search residue remains" >&2
            exit 1
          fi
          git diff --check

      - name: Remove temporary workflow and commit cleanup
        run: |
          rm .github/workflows/tmp-remove-google-search.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove all Google search integrations'
          git push origin HEAD:chore/remove-all-google-search
