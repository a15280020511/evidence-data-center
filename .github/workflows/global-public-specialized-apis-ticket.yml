name: Managed Global Public Specialized APIs

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ${{ startsWith(github.event.issue.title, '[intel-public-specialized]') && 'intel-global-public-specialized' || format('intel-global-public-specialized-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  execute-public-specialized:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-public-specialized]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      KOREA_DATA_GO_KR_SERVICE_KEY: ${{ secrets.KOREA_DATA_GO_KR_SERVICE_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-public-specialized-apis/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-public-specialized-apis/requirements.txt
          python -m pip check

      - name: Compile provider
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-public-specialized-apis/global_public_specialized_task.py

      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/global-public-specialized-apis/global_public_specialized_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir public-specialized-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/global-public-specialized-apis/global_public_specialized_task.py render \
            --output-dir public-specialized-artifacts --phase accepted > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/global-public-specialized-apis/global_public_specialized_task.py render \
            --output-dir public-specialized-artifacts --phase rejected > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Execute one bounded request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/global-public-specialized-apis/global_public_specialized_task.py execute \
            --ticket public-specialized-artifacts/ticket.json \
            --output-dir public-specialized-artifacts

      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-specialized-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: public-specialized-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/global-public-specialized-apis/global_public_specialized_task.py render \
            --output-dir public-specialized-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_PUBLIC_SPECIALIZED_APIS_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
