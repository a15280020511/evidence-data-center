name: Temporary export capability transfer sources

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  LEGACY_SOURCE_ISSUE: 31
  CLEAN_SOURCE_ISSUE: 34

jobs:
  export:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-export-capability-sources]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Export original GitHub comment payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capability-transfer-sources
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${LEGACY_SOURCE_ISSUE}/comments?per_page=100" \
            > capability-transfer-sources/issue-31-comments.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${CLEAN_SOURCE_ISSUE}/comments?per_page=100" \
            > capability-transfer-sources/issue-34-comments.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('capability-transfer-sources')
          manifest = {'schema_version': 'capability-transfer-export-v1', 'files': []}
          for path in sorted(root.glob('*.json')):
              raw = path.read_bytes()
              rows = json.loads(raw)
              manifest['files'].append({
                  'name': path.name,
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'comment_count': len(rows),
                  'comment_ids': [row.get('id') for row in rows],
                  'body_lengths': [len(str(row.get('body') or '')) for row in rows],
              })
          (root / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, ensure_ascii=False))
          PY

      - name: Upload exact transfer-source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-transfer-sources-${{ github.run_id }}
          path: capability-transfer-sources/
          if-no-files-found: error
          retention-days: 3

      - name: Publish export receipt
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="CAPABILITY_SOURCE_EXPORT_STATUS=completed\nRUN_ID=${GITHUB_RUN_ID}\nARTIFACT_NAME=capability-transfer-sources-${GITHUB_RUN_ID}\nSOURCE_ISSUES=31,34"
          gh issue close "${{ github.event.issue.number }}" --reason completed >/dev/null

      - name: Publish structured failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="CAPABILITY_SOURCE_EXPORT_STATUS=failed\nRUN_ID=${GITHUB_RUN_ID}"
