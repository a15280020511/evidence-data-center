name: Repair Global Knowledge Fabric Acceptance

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-global-knowledge-fabric-acceptance
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'feat/global-knowledge-fabric-wave3-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/global-knowledge-fabric-wave3-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply live-acceptance findings
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path

          root=Path('api-center/global-knowledge-fabric')

          matrix_path=root/'source-access-matrix.json'
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          sources=[]
          for row in matrix['sources']:
              sid=row['source_id']
              if sid=='crossref-events':
                  continue
              if sid=='data-gov':
                  row.update({
                      'name':'Data.gov Catalog API v4',
                      'protocol':'api-data-gov-v4',
                      'base_url':'https://api.gsa.gov/technology/datagov/v4',
                      'credential_mode':'required_free_key',
                      'credential_env':'DATA_GOV_API_KEY',
                      'cost':'free api.data.gov key required',
                  })
              sources.append(row)
          matrix['sources']=sources
          matrix['active_source_count']=15
          if not any(row.get('source_id')=='crossref-events' for row in matrix.get('not_enabled',[])):
              matrix.setdefault('not_enabled',[]).append({
                  'source_id':'crossref-events',
                  'reason':'The documented public Event Data API host failed a bounded 45-second production connection acceptance on 2026-08-03. Core Crossref Works metadata, DataCite, OpenCitations and existing citation providers remain active; Event Data is deferred until the endpoint is reliably reachable.'
              })
          matrix_path.write_text(json.dumps(matrix,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          catalog_path=root/'provider-catalog.json'
          doc=json.loads(catalog_path.read_text(encoding='utf-8'))
          provider=doc['providers'][0]
          provider['limits']['source_count']=15
          provider['catalog_policy']=provider['catalog_policy'].replace('16个固定HTTPS来源','15个固定HTTPS来源')
          optional=provider['optional_secret_environment_variables']
          if 'DATA_GOV_API_KEY' not in optional:
              optional.insert(2,'DATA_GOV_API_KEY')
          for op in provider['operations']:
              if op['operation_id']=='scholarly-search':
                  op['description']='检索计算机科学文献或学术场馆。'
                  op['parameters']=[x for x in op['parameters'] if x!='relation_type']
                  op['parameter_schema']['properties'].pop('relation_type',None)
                  enum=op['parameter_schema']['properties']['source_id']['enum']
                  op['parameter_schema']['properties']['source_id']['enum']=[x for x in enum if x!='crossref-events']
          catalog_path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          runtime_path=root/'global_knowledge_fabric_task.py'
          runtime=runtime_path.read_text(encoding='utf-8')
          runtime=runtime.replace(
              '    elif source_id == "regulations-gov":\n        headers["X-Api-Key"] = value\n',
              '    elif source_id in {"regulations-gov", "data-gov"}:\n        headers["X-Api-Key"] = value\n',
          )
          runtime=runtime.replace(
              '    elif source_id == "crossref-events":\n        url = "https://api.eventdata.crossref.org/v1/events"\n        query += [("obj-id", term), ("rows", str(limit))]\n        relation = str(parameters.get("relation_type") or "").strip()\n        if relation:\n            if not re.fullmatch(r"[A-Za-z0-9._:-]{1,80}", relation):\n                raise ValueError("relation_type is invalid")\n            query.append(("relation-type", relation))\n',
              '',
          )
          runtime=runtime.replace(
              '    if source_id == "data-gov":\n        return "GET", "https://catalog.data.gov/api/3/action/package_search", headers, [\n            ("q", term), ("rows", str(limit)), ("start", "0"),\n        ], None, []\n',
              '    if source_id == "data-gov":\n        return "GET", "https://api.gsa.gov/technology/datagov/v4/search", headers, [\n            ("q", term), ("per_page", str(limit)), ("sort", "relevance"),\n        ], None, credentials\n',
          )
          runtime=runtime.replace(
              '        "data-gov": r"^[A-Za-z0-9._-]{1,200}$",\n',
              '        "data-gov": r"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",\n',
          )
          runtime=runtime.replace(
              '    elif source_id == "data-gov":\n        url = "https://catalog.data.gov/api/3/action/package_show"\n        query += [("id", record_id)]\n',
              '    elif source_id == "data-gov":\n        url = f"https://api.gsa.gov/technology/datagov/v4/harvest_record/{record_id}"\n',
          )
          runtime_path.write_text(runtime,encoding='utf-8')

          validator_path=root/'validate_global_knowledge_fabric.py'
          validator=validator_path.read_text(encoding='utf-8')
          validator=validator.replace(
              '    "REGULATIONS_GOV_API_KEY": "fixture-regulations-key",\n',
              '    "REGULATIONS_GOV_API_KEY": "fixture-regulations-key",\n    "DATA_GOV_API_KEY": "fixture-data-gov-key",\n',
          )
          validator=validator.replace('    "data-gov": "consumer-complaint-database",\n','    "data-gov": "6f011de5-22bf-4c88-a4aa-e61fc29a4a67",\n')
          validator=validator.replace(
              '    if source_id != "crossref-events" and operation == "scholarly-search":\n        row["query"] = "graph neural networks"\n',
              '    if operation == "scholarly-search":\n        row["query"] = "graph neural networks"\n',
          )
          validator=validator.replace('== 16\n','== 15\n')
          validator=validator.replace('    "crossref-events": ("scholarly-search", {"source_id": "crossref-events", "query": "10.1038/s41586-020-2649-2", "limit": 2}),\n','')
          validator=validator.replace(
              'KEY_CASES = {\n',
              'KEY_CASES = {\n    "data-gov": ("DATA_GOV_API_KEY", "government-search", {"source_id": "data-gov", "query": "climate", "limit": 2}),\n',
          )
          validator_path.write_text(validator,encoding='utf-8')

          readme_path=root/'README.md'
          readme=readme_path.read_text(encoding='utf-8').replace('16个固定来源','15个固定来源')
          readme=readme.replace('- `REGULATIONS_GOV_API_KEY`：免费 api.data.gov Key。','- `REGULATIONS_GOV_API_KEY`、`DATA_GOV_API_KEY`：免费 api.data.gov Key。')
          if 'Crossref Event Data：' not in readme:
              readme += '\n## 实测暂缓\n\n- Crossref Event Data：官方主机在受控45秒连接验收中超时；现有 Crossref Works、DataCite、OpenCitations 与引用来源继续承担核心能力。\n'
          readme_path.write_text(readme,encoding='utf-8')
          PY2
      - name: Rebuild catalog and validate repaired provider
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-fabric/requirements.txt
          python api-center/build_catalog_market_search.py
          PYTHONPATH=api-center/global-knowledge-fabric:api-center \
            python api-center/global-knowledge-fabric/validate_global_knowledge_fabric.py \
              --output /tmp/global-knowledge-fabric-registry.json
          python -m unittest discover -s api-center/tests -p 'test_*.py'
          python - <<'PY2'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/global-knowledge-fabric-registry.json').read_text())
          matrix=json.loads(Path('api-center/global-knowledge-fabric/source-access-matrix.json').read_text())
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          assert receipt['source_count']==15
          assert receipt['operation_count']==9
          assert matrix['active_source_count']==15
          assert any(row['source_id']=='crossref-events' for row in matrix['not_enabled'])
          data_gov=next(row for row in matrix['sources'] if row['source_id']=='data-gov')
          assert data_gov['credential_env']=='DATA_GOV_API_KEY'
          assert catalog['managed_provider_count']==61
          assert catalog['managed_operation_count']==674
          PY2
          git diff --check
      - name: Commit repaired non-workflow contracts
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/global-knowledge-fabric/source-access-matrix.json \
            api-center/global-knowledge-fabric/provider-catalog.json \
            api-center/global-knowledge-fabric/global_knowledge_fabric_task.py \
            api-center/global-knowledge-fabric/validate_global_knowledge_fabric.py \
            api-center/global-knowledge-fabric/README.md \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m 'fix: migrate Data.gov v4 and defer unstable Event Data'
          git push origin HEAD:feat/global-knowledge-fabric-wave3-20260803
