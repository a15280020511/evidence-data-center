name: Managed Copernicus Marine Intelligence Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-copernicus-marine-global
  cancel-in-progress: false

jobs:
  execute-copernicus-marine:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-copernicus-marine]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/copernicus-marine/requirements.txt

      - name: Install pinned provider
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/copernicus-marine/requirements.txt
          python -m pip check

      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/copernicus-marine/copernicus_marine_task.py

      - name: Reject duplicate accepted task ID on the same issue
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          task_id="$(jq -r '.issue.body | fromjson | .task_id // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          if [[ -z "$task_id" ]]; then
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments_file="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --jq '.[].body' > "$comments_file"
          if grep -Fq "Copernicus Marine API ticket accepted: \`${task_id}\` /" "$comments_file" || grep -Fq 'Copernicus Marine API result: `INTEL_COPERNICUS_MARINE_COMPLETED`' "$comments_file"; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            {
              echo 'Copernicus Marine API admission: `ADMISSION_REJECTED_DUPLICATE`'
              echo
              echo "- Task ID: \`${task_id}\`"
              echo '- New upstream operation executed: `false`'
              echo '- Secret values exposed: `false`'
            } > duplicate-comment.md
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@duplicate-comment.md
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse and authorize ticket
        id: prepare
        if: steps.admission.outputs.duplicate != 'true'
        continue-on-error: true
        run: python api-center/copernicus-marine/copernicus_marine_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir copernicus-marine-artifacts

      - name: Comment accepted ticket
        if: steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/copernicus-marine/copernicus_marine_task.py render --output-dir copernicus-marine-artifacts --phase accepted > comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@comment.md

      - name: Comment rejected ticket
        if: steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/copernicus-marine/copernicus_marine_task.py render --output-dir copernicus-marine-artifacts --phase rejected > comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@comment.md

      - name: Execute one bounded Toolbox operation
        id: execute
        if: steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/copernicus-marine/copernicus_marine_task.py execute --ticket copernicus-marine-artifacts/ticket.json --output-dir copernicus-marine-artifacts

      - name: Upload evidence
        id: upload
        if: always() && steps.admission.outputs.duplicate != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copernicus-marine-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: copernicus-marine-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish result
        if: always() && steps.admission.outputs.duplicate != 'true' && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/copernicus-marine/copernicus_marine_task.py render --output-dir copernicus-marine-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@comment.md

      - name: Mark duplicate or failed execution
        if: >-
          always() &&
          (steps.admission.outputs.duplicate == 'true' ||
           steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_COPERNICUS_MARINE_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
