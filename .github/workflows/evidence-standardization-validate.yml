name: Validate Evidence Standardization Provider

on:
  pull_request:
    paths:
      - "api-center/evidence-standardization/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "CENTER_CAPABILITY_OWNERSHIP.json"
      - ".github/workflows/evidence-standardization-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/evidence-standardization/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "CENTER_CAPABILITY_OWNERSHIP.json"
      - ".github/workflows/evidence-standardization-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-evidence-standardization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        operation:
          - normalize-evidence-records
          - content-fingerprint
          - provenance-lineage
          - timeline-version-diff
          - stix-bundle-validate
          - transfer-package-manifest
          - source-quality-profile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check
      - name: Compile and execute fixture
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/evidence-standardization/evidence_standardization_task.py \
            api-center/evidence-standardization/validate_evidence_standardization.py
          mkdir -p evidence-standardization-validation
          PYTHONPATH=api-center/evidence-standardization:api-center \
            python api-center/evidence-standardization/validate_evidence_standardization.py \
              --operation "${{ matrix.operation }}" \
              --output "evidence-standardization-validation/${{ matrix.operation }}.json"
      - name: Verify zero-network receipt
        env:
          OPERATION: ${{ matrix.operation }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          operation = os.environ['OPERATION']
          row = json.loads((Path('evidence-standardization-validation') / f'{operation}.json').read_text(encoding='utf-8'))
          assert row['status'] == 'PASS'
          assert row['operation'] == operation
          assert row['network_used'] is False
          assert row['model_calls'] == 0
          assert row['secret_used'] is False
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: evidence-standardization-${{ matrix.operation }}-${{ github.run_id }}
          path: evidence-standardization-validation/
          if-no-files-found: warn
          retention-days: 30

  catalog-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
      - name: Verify provider, catalog and ownership contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider = json.loads(Path('api-center/evidence-standardization/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          schema = json.loads(Path('api-center/evidence-standardization/ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          ownership = json.loads(Path('CENTER_CAPABILITY_OWNERSHIP.json').read_text(encoding='utf-8'))
          operations = [row['operation_id'] for row in provider['operations']]
          assert provider['provider_id'] == 'evidence-standardization'
          assert provider['required_secret_environment_variable'] == ''
          assert provider['limits']['network_allowed'] is False
          assert provider['limits']['personal_data_allowed'] is False
          assert len(operations) == len(set(operations)) == 8
          assert set(operations) == set(schema['properties']['operation']['enum'])
          rows = {row['provider_id']: row for row in catalog['managed_providers']}
          assert rows['evidence-standardization']['operation_count'] == 8
          assert catalog['managed_provider_count'] >= 52
          assert catalog['managed_operation_count'] >= 588
          assert sum(row['operation_count'] for row in rows.values()) == catalog['managed_operation_count']
          assert ownership['direct_center_to_center_calls_allowed'] is False
          PY
          git diff --check
