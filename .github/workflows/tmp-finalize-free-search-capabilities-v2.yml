name: One-shot Finalize Free Search Capabilities V2

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-finalize-free-search-capabilities-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply deterministic production patch
        run: |
          python .github/scripts/tmp_complete_free_search.py
          python .github/scripts/tmp_fix_baidu_invariant.py
      - name: Regenerate authoritative contracts
        run: |
          python api-center/baidu-ai-cloud/build_free_catalog.py
          python api-center/build_catalog_market_search.py
      - name: Install targeted dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baidu-ai-cloud/requirements.txt
          python -m pip install --disable-pip-version-check --no-input -r api-center/market-search/requirements.txt
          python -m pip check
      - name: Run targeted regression and safety gates
        run: |
          python -m py_compile api-center/baidu-ai-cloud/baidu_ai_cloud_task.py api-center/market-search/market_search_task.py api-center/build_catalog_market_search.py
          PYTHONPATH=api-center python -m unittest discover -s api-center/baidu-ai-cloud/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/market-search/tests -p 'test_*.py' -v
          PYTHONPATH=api-center python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          PYTHONPATH=api-center python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          git diff --check
      - name: Commit validated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/baidu-ai-cloud api-center/market-search api-center/build_catalog_market_search.py api-center/api-catalog.json api-center/api-catalog.md api-center/tests
          git commit -m "feat: complete verified free Baidu knowledge and SerpAPI Chinese search"
          git push origin HEAD:${{ github.head_ref }}
