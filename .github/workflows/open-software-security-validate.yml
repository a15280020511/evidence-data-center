name: Validate Open Software Security Knowledge

on:
  pull_request:
    paths:
      - 'api-center/open-software-security-knowledge/**'
      - 'api-center/managed_provider_runtime.py'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/open-software-security-*.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/open-software-security-knowledge/**'
      - 'api-center/managed_provider_runtime.py'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/open-software-security-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-open-software-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-and-builders:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/open-software-security-knowledge/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/open-software-security-knowledge/requirements.txt
          python -m pip check
      - name: Compile and validate all fixed builders
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/open-software-security-knowledge/open_software_security_task.py api-center/open-software-security-knowledge/validate_open_software_security.py
          mkdir -p open-software-security-validation
          PYTHONPATH=api-center/open-software-security-knowledge:api-center python api-center/open-software-security-knowledge/validate_open_software_security.py --output open-software-security-validation/registry.json
      - name: Verify registry and aggregate catalog boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('open-software-security-validation/registry.json').read_text())
          provider=json.loads(Path('api-center/open-software-security-knowledge/provider-catalog.json').read_text())['providers'][0]
          matrix=json.loads(Path('api-center/open-software-security-knowledge/source-access-matrix.json').read_text())
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['source_count']==18
          assert receipt['operation_count']==11
          assert receipt['builder_cases']>=30
          assert receipt['network_used'] is False
          assert receipt['model_calls']==0
          assert receipt['secret_values_exposed'] is False
          assert provider['limits']['requests_per_ticket_max']==1
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['package_download_allowed'] is False
          assert provider['limits']['source_code_execution_allowed'] is False
          assert provider['limits']['exploit_code_retrieval_allowed'] is False
          assert len(matrix['not_enabled'])>=8
          rows={row['provider_id']:row for row in catalog['managed_providers']}
          assert rows['open-software-security-knowledge']['operation_count']==11
          assert catalog['managed_provider_count']==len(rows)==63
          assert catalog['managed_operation_count']==sum(row['operation_count'] for row in rows.values())==688
          assert catalog['direct_center_to_center_calls_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          PY
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-software-security-registry-${{ github.run_id }}
          path: open-software-security-validation/
          if-no-files-found: error
          retention-days: 30

  live-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source:
          - software-heritage
          - deps-dev
          - clearlydefined
          - pypi
          - npm
          - crates-io
          - rubygems
          - packagist
          - pub-dev
          - osv
          - nvd
          - cisa-kev
          - first-epss
          - openssf-scorecard
          - mitre-cve
          - spdx-license-list
          - rfc-editor
          - iana-registries
    env:
      SWH_API_TOKEN: ${{ secrets.SWH_API_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/open-software-security-knowledge/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/open-software-security-knowledge/requirements.txt
          python -m pip check
      - name: Execute one real bounded upstream request
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: |
          mkdir -p open-software-security-live
          PYTHONPATH=api-center/open-software-security-knowledge:api-center python api-center/open-software-security-knowledge/validate_open_software_security.py --live-source "$SOURCE_ID" --output "open-software-security-live/$SOURCE_ID.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=os.environ['SOURCE_ID']
          row=json.loads((Path('open-software-security-live')/f'{source}.json').read_text())
          assert row['status']=='PASS'
          assert row['source_id']==source
          assert row['network_used'] is True
          assert row['request_count']==1
          assert row['model_calls']==0
          assert row['secret_values_exposed'] is False
          assert row['package_downloaded'] is False
          assert row['package_installed'] is False
          assert row['source_code_executed'] is False
          assert row['exploit_code_retrieved'] is False
          assert 200 <= row['http_status'] < 300
          assert row['response_bytes'] > 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: open-software-security-live-${{ matrix.source }}-${{ github.run_id }}
          path: open-software-security-live/
          if-no-files-found: warn
          retention-days: 30
