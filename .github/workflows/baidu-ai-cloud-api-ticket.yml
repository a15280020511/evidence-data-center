name: Managed Baidu AI Cloud Intelligence

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-baidu-ai-global
  cancel-in-progress: false

jobs:
  execute-baidu-ai:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-baidu-ai]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BAIDU_AI_CLOUD_API_KEY: ${{ secrets.BAIDU_AI_CLOUD_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/baidu-ai-cloud/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/baidu-ai-cloud/requirements.txt
          python -m pip check
      - name: Compile Baidu control plane
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/baidu-ai-cloud/baidu_ai_cloud_task.py
      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir baidu-ai-artifacts
      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py render --output-dir baidu-ai-artifacts --phase accepted > baidu-ai-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@baidu-ai-comment.md
      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py render --output-dir baidu-ai-artifacts --phase rejected > baidu-ai-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@baidu-ai-comment.md
      - name: Execute one bounded read-only operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py execute --ticket baidu-ai-artifacts/ticket.json --output-dir baidu-ai-artifacts
      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baidu-ai-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: baidu-ai-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/baidu-ai-cloud/baidu_ai_cloud_task.py render --output-dir baidu-ai-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > baidu-ai-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@baidu-ai-comment.md
      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_BAIDU_AI_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
