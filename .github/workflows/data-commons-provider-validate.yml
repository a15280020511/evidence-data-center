name: Validate Data Commons REST V2 Provider

on:
  pull_request:
    paths:
      - "api-center/data-commons/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/data-commons-api-ticket.yml"
      - ".github/workflows/data-commons-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/data-commons/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/data-commons-api-ticket.yml"
      - ".github/workflows/data-commons-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-commons-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/data-commons/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/data-commons/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/data-commons/data_commons_task.py \
            api-center/data-commons/tests/*.py
          python -m unittest discover -s api-center/data-commons/tests -p 'test_*.py' -v

      - name: Validate fixed REST V2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/data-commons')
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          starter = json.loads((root / 'china-starter-pack.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)

          assert catalog['schema_version'] == 'data-commons-provider-catalog-v3'
          assert catalog['secret_values_exposed'] is False
          assert len(catalog['providers']) == 1
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'data-commons'
          assert provider['ticket_prefix'] == '[api-dc]'
          assert provider['required_secret_environment_variable'] == 'GOOGLE_DATA_COMMONS_API_KEY'
          assert provider['allowed_endpoints'] == ['/resolve', '/node', '/observation']
          assert len(provider['operations']) == 5
          assert {row['operation_id'] for row in provider['operations']} == {
              'catalog-capabilities', 'resolve-place', 'resolve-indicator',
              'node-properties', 'observations',
          }
          limits = provider['limits']
          for key in (
              'arbitrary_urls_allowed', 'arbitrary_endpoints_allowed',
              'arbitrary_headers_allowed', 'client_supplied_api_key_allowed',
              'sparql_allowed', 'natural_language_api_allowed', 'mcp_allowed',
              'write_operations_allowed', 'personal_data_allowed',
              'secret_values_exposed',
          ):
              assert limits[key] is False, key
          assert limits['requests_per_ticket_max'] == 1
          assert limits['max_nodes'] == 20
          assert limits['max_variables'] == 20
          assert limits['max_response_bytes'] == 1_000_000
          assert starter['country_dcid'] == 'country/CHN'
          serialized = json.dumps(catalog, ensure_ascii=False)
          assert 'GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON' not in serialized
          assert 'data_commons_api_key' not in serialized
          print(json.dumps({
              'status': 'PASS',
              'provider': 'data-commons',
              'operations': 5,
              'secret': 'GOOGLE_DATA_COMMONS_API_KEY',
              'auth': 'X-API-Key',
          }))
          PY
          git diff --check
