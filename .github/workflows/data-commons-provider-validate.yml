name: Validate Data Commons and China Google Packs

on:
  pull_request:
    paths:
      - "api-center/data-commons/**"
      - "api-center/google-cloud/**"
      - "api-center/build_catalog.py"
      - ".github/workflows/data-commons-provider-validate.yml"
      - ".github/workflows/data-commons-api-ticket.yml"
      - ".github/workflows/google-cloud-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/data-commons/**"
      - "api-center/google-cloud/**"
      - "api-center/build_catalog.py"
      - ".github/workflows/data-commons-provider-validate.yml"
      - ".github/workflows/data-commons-api-ticket.yml"
      - ".github/workflows/google-cloud-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-commons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data-commons:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/data-commons/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/data-commons/requirements.txt
          python -m pip check

      - name: Compile provider runtime
        run: |
          python -m py_compile \
            api-center/data-commons/data_commons_task.py \
            api-center/data-commons/duplicate_guard.py \
            api-center/google-cloud/unified_google_credentials.py \
            api-center/data-commons/tests/test_data_commons_task.py

      - name: Run Data Commons tests
        run: python -m unittest discover -s api-center/data-commons/tests -v

      - name: Validate provider and China pack contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dc = json.loads(Path('api-center/data-commons/provider-catalog.json').read_text())
          starter = json.loads(Path('api-center/data-commons/china-starter-pack.json').read_text())
          google = json.loads(Path('api-center/google-cloud/provider-catalog.json').read_text())
          packs = json.loads(Path('api-center/google-cloud/china-topic-packs.json').read_text())

          assert dc['schema_version'] == 'data-commons-provider-catalog-v2'
          assert dc['required_secret_environment_variable'] == 'GOOGLE_CREDENTIALS_JSON'
          assert dc['credential_bundle_field'] == 'data_commons_api_key'
          assert dc['secret_values_exposed'] is False
          assert set(dc['allowed_endpoints']) == {'/resolve', '/node', '/observation'}
          assert dc['security']['sparql_allowed'] is False
          assert dc['security']['arbitrary_url_allowed'] is False
          assert starter['country_dcid'] == 'country/CHN'

          providers = {row['provider_id']: row for row in google['providers']}
          assert {'bigquery', 'earth-engine', 'data-commons'} <= set(providers)
          assert providers['data-commons']['ticket_prefix'] == '[api-dc]'
          assert providers['data-commons']['required_secret_environment_variable'] == 'GOOGLE_CREDENTIALS_JSON'
          assert all(row['required_secret_environment_variable'] == 'GOOGLE_CREDENTIALS_JSON' for row in providers.values())
          assert 'patents-public-data' in providers['bigquery']['default_public_projects']

          assert packs['schema_version'] == 'google-china-topic-packs-v2'
          pack_ids = {row['pack_id'] for row in packs['packs']}
          expected = {
              'china-patent-intelligence', 'china-news-events-risk', 'china-population-grid',
              'china-nighttime-activity', 'china-urban-expansion-land-use',
              'china-climate-extreme-weather', 'china-urban-heat',
              'china-air-quality-emissions', 'china-water-flood-drought',
              'china-settlement-topography',
          }
          assert pack_ids == expected
          assert len(packs['packs']) == 10
          assert packs['direct_compute_or_expert_dispatch_allowed'] is False

          by_id = {row['pack_id']: row for row in packs['packs']}
          assert 'COPERNICUS/S5P/OFFL/L3_NO2' in by_id['china-air-quality-emissions']['dataset_ids']
          assert 'JRC/CEMS_GLOFAS/FloodHazard/v2_1' in by_id['china-water-flood-drought']['dataset_ids']
          assert 'JRC/GHSL/P2023A/GHS_BUILT_H' in by_id['china-settlement-topography']['dataset_ids']
          print(json.dumps({'status': 'PASS', 'google_secret_count': 1, 'china_packs': sorted(pack_ids)}))
          PY

      - name: Regenerate API catalog in temporary paths
        run: |
          python api-center/build_catalog.py \
            --json-output /tmp/api-catalog.json \
            --markdown-output /tmp/api-catalog.md
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('/tmp/api-catalog.json').read_text())
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          assert 'data-commons' in providers
          assert providers['data-commons']['enabled'] is True
          assert providers['data-commons']['ticket_prefix'] == '[api-dc]'
          assert providers['data-commons']['required_secret_environment_variable_name'] == 'GOOGLE_CREDENTIALS_JSON'
          assert providers['data-commons']['secret_value_exposed'] is False
          print(json.dumps({'status': 'PASS', 'managed_provider_count': catalog['managed_provider_count']}))
          PY
