name: Validate GNews Provider

on:
  pull_request:
    paths:
      - "api-center/gnews/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/gnews-provider-validate.yml"
      - ".github/workflows/gnews-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/gnews/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/gnews-provider-validate.yml"
      - ".github/workflows/gnews-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/gnews/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/gnews/requirements.txt
          python -m pip check
      - name: Compile and run zero-network tests
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/gnews/gnews_task.py api-center/gnews/tests/test_gnews_task.py
          python api-center/gnews/tests/test_gnews_task.py
      - name: Verify deterministic aggregate catalog
        run: |
          python api-center/tests/test_api_catalog.py
          python api-center/build_catalog_market_search.py --json-output /tmp/api-catalog.json --markdown-output /tmp/api-catalog.md
          cmp /tmp/api-catalog.json api-center/api-catalog.json
          cmp /tmp/api-catalog.md api-center/api-catalog.md
          git diff --check
