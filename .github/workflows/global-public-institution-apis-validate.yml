name: Global Public Institution APIs Validate

on:
  pull_request:
    paths:
      - "api-center/global-public-institution-apis/**"
      - ".github/workflows/global-public-institution-apis-validate.yml"
      - ".github/workflows/global-public-institution-apis-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/global-public-institution-apis/**"
      - ".github/workflows/global-public-institution-apis-validate.yml"
      - ".github/workflows/global-public-institution-apis-ticket.yml"

permissions:
  contents: read

concurrency:
  group: global-public-institution-apis-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-public-institution-apis/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-public-institution-apis/requirements.txt
          python -m pip check

      - name: Compile
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-public-institution-apis/global_public_institution_task.py

      - name: Unit tests
        run: python -m unittest discover -s api-center/global-public-institution-apis/tests -p 'test_*.py' -v

      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/global-public-institution-apis')
          for path in sorted(root.glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8')))
          print('global public institution API validation passed')
          PY
