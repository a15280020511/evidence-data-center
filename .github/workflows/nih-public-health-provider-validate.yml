name: Validate NIH Public Health Provider

on:
  pull_request:
    paths:
      - "api-center/nih-public-health/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/nih-public-health-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/nih-public-health/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/nih-public-health-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-nih-public-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/nih-public-health/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/nih-public-health/requirements.txt
          python -m pip check
      - name: Compile and run zero-network tests
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/nih-public-health/nih_public_health_task.py
          python api-center/nih-public-health/tests/test_nih_public_health_task.py
      - name: Verify deterministic aggregate catalog
        run: |
          python api-center/build_catalog_market_search.py \
            --json-output /tmp/api-catalog.json \
            --markdown-output /tmp/api-catalog.md
          cmp /tmp/api-catalog.json api-center/api-catalog.json
          cmp /tmp/api-catalog.md api-center/api-catalog.md
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("api-center/api-catalog.json").read_text(encoding="utf-8"))
          providers = {row["provider_id"]: row for row in catalog["managed_providers"]}
          assert providers["nih-public-health"]["operation_count"] == 6
          assert providers["nih-public-health"]["secret_value_exposed"] is False
          assert catalog["managed_provider_count"] == len(providers)
          assert catalog["managed_operation_count"] == sum(row["operation_count"] for row in providers.values())
          assert catalog["direct_center_to_center_calls_allowed"] is False
          assert catalog["secret_values_exposed"] is False
          PY
          python api-center/tests/test_api_catalog.py
          git diff --check
