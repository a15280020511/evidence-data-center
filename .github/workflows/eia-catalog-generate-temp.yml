name: Temporary EIA Catalog Generator

on:
  push:
    branches: [feat/eia-api-provider]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/eia-api-provider
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
      - name: Generate deterministic catalog
        run: |
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md api-center/connector-manifest.json api-center/krakend.validation.json api-center/krakend.tmpl
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: regenerate intelligence catalog for EIA"
            git push origin HEAD:feat/eia-api-provider
          fi
