name: Validate NOAA CDO Provider

on:
  pull_request:
    paths:
      - "api-center/noaa-cdo/**"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/noaa-cdo-provider-validate.yml"
      - ".github/workflows/noaa-cdo-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/noaa-cdo/**"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/noaa-cdo-provider-validate.yml"
      - ".github/workflows/noaa-cdo-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-noaa-cdo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-noaa-cdo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/noaa-cdo/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/noaa-cdo/requirements.txt
          python -m pip check

      - name: Compile and run regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/noaa-cdo/noaa_cdo_task.py \
            api-center/noaa-cdo/tests/test_noaa_cdo.py
          python -m unittest discover -s api-center/noaa-cdo/tests -p 'test_*.py' -v

      - name: Verify provider invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider = json.loads(Path('api-center/noaa-cdo/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          schema = json.loads(Path('api-center/noaa-cdo/ticket.schema.json').read_text(encoding='utf-8'))
          ids = [row['operation_id'] for row in provider['operations']]
          assert provider['provider_id'] == 'noaa-cdo'
          assert provider['ticket_prefix'] == '[intel-noaa-cdo]'
          assert provider['required_secret_environment_variable'] == 'NOAA_CDO_TOKEN'
          assert len(ids) == len(set(ids)) == 5
          assert set(ids) == set(schema['properties']['operation']['enum'])
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['rows_per_request_max'] == 1000
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['arbitrary_headers_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in provider['operations'])
          print(json.dumps({'status':'PASS','provider':'noaa-cdo','operations':5}))
          PY
          git diff --check
