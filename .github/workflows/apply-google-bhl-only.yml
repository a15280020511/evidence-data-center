name: Apply Google Books and BHL Source Reduction

on:
  push:
    branches:
      - fix/retain-google-books-bhl-only
    paths:
      - '.github/workflows/apply-google-bhl-only.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/retain-google-books-bhl-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Remove four unneeded keyed sources
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          REMOVED_IDS = {"trove", "nara", "smithsonian", "govinfo"}
          REMOVED_SECRETS = {
              "TROVE_API_KEY",
              "NARA_CATALOG_API_KEY",
              "SMITHSONIAN_API_KEY",
              "GOVINFO_API_KEY",
          }
          KEEP_SECRETS = ["GOOGLE_API_KEY", "BHL_API_KEY"]

          root = Path('.')
          provider_dir = root / 'api-center/global-knowledge-archives'

          def load(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path: Path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = provider_dir / 'source-access-matrix.json'
          matrix = load(matrix_path)
          matrix['sources'] = [row for row in matrix['sources'] if row['source_id'] not in REMOVED_IDS]
          matrix['active_source_count'] = len(matrix['sources'])
          for row in matrix['sources']:
              if row['source_id'] == 'federal-register':
                  row['license_policy'] = (
                      'FederalRegister.gov metadata is a discovery layer; authoritative legal reliance '
                      'should use the linked official publication edition.'
                  )
          dump(matrix_path, matrix)

          catalog_path = provider_dir / 'provider-catalog.json'
          catalog = load(catalog_path)
          provider = catalog['providers'][0]
          provider['description'] = (
              '固定接入教育研究、开放专著、国家图书馆目录、博物馆开放馆藏、科研资助、临床试验、'
              '地学报告、监管文件和经济工作论文元数据；需要Key的来源仅Google Books与BHL。'
          )
          provider['optional_secret_environment_variables'] = KEEP_SECRETS
          provider['catalog_policy'] = (
              '仅开放9项固定只读操作和16个固定HTTPS来源；禁止任意URL、主机、路径、Header、'
              '客户端Key、动态Provider、付费墙绕过和未授权全文复制。'
          )
          provider['limits']['source_count'] = len(matrix['sources'])
          for operation in provider['operations']:
              source_schema = operation.get('parameter_schema', {}).get('properties', {}).get('source_id')
              if isinstance(source_schema, dict) and isinstance(source_schema.get('enum'), list):
                  source_schema['enum'] = [item for item in source_schema['enum'] if item not in REMOVED_IDS]
              if operation['operation_id'] == 'knowledge-record':
                  operation['description'] = '从一个固定来源读取单条公开元数据记录。'
          dump(catalog_path, catalog)

          task_path = provider_dir / 'global_knowledge_archives_task.py'
          task = task_path.read_text(encoding='utf-8')
          for source_id in sorted(REMOVED_IDS):
              task, count = re.subn(
                  rf'\n    elif source_id == "{re.escape(source_id)}":\n(?:        [^\n]*\n)+',
                  '\n',
                  task,
              )
              if count == 0:
                  raise RuntimeError(f'missing runtime branch for {source_id}')
          task, count = re.subn(r'^        "govinfo": r"[^\n]+\n', '', task, flags=re.MULTILINE)
          if count != 1:
              raise RuntimeError('missing govinfo record-id pattern')
          task_path.write_text(task, encoding='utf-8')

          validator_path = provider_dir / 'validate_global_knowledge_archives.py'
          validator = validator_path.read_text(encoding='utf-8')
          for secret in sorted(REMOVED_SECRETS):
              validator, count = re.subn(
                  rf'^    "{re.escape(secret)}": "[^\n]+\n',
                  '',
                  validator,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError(f'missing dummy secret {secret}')
          validator, count = re.subn(r'^            "govinfo": "[^\n]+\n', '', validator, flags=re.MULTILINE)
          if count != 1:
              raise RuntimeError('missing govinfo validator record')
          validator = validator.replace(
              'assert len(sources) == matrix["active_source_count"] == provider["limits"]["source_count"] == 20',
              'assert len(sources) == matrix["active_source_count"] == provider["limits"]["source_count"] == 16',
          )
          for source_id in sorted(REMOVED_IDS):
              validator, count = re.subn(
                  rf'^    "{re.escape(source_id)}": \([^\n]+\n',
                  '',
                  validator,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError(f'missing key validation case for {source_id}')
          validator_path.write_text(validator, encoding='utf-8')

          ticket_workflow = root / '.github/workflows/global-knowledge-archives-ticket.yml'
          ticket_text = ticket_workflow.read_text(encoding='utf-8')
          for secret in sorted(REMOVED_SECRETS):
              ticket_text, count = re.subn(
                  rf'^      {re.escape(secret)}: .*\n',
                  '',
                  ticket_text,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError(f'missing ticket secret {secret}')
          ticket_workflow.write_text(ticket_text, encoding='utf-8')

          validate_workflow = root / '.github/workflows/global-knowledge-archives-validate.yml'
          workflow = validate_workflow.read_text(encoding='utf-8')
          workflow = workflow.replace("assert receipt['source_count']==20", "assert receipt['source_count']==16")
          old = """          trove=next(row for row in matrix['sources'] if row['source_id']=='trove')
          assert trove['credential_mode']=='required_free_key'
"""
          new = """          key_sources={row['source_id'] for row in matrix['sources'] if row['credential_mode']=='required_free_key'}
          assert key_sources=={'google-books','bhl'}
          assert provider['optional_secret_environment_variables']==['GOOGLE_API_KEY','BHL_API_KEY']
          assert not ({'trove','nara','smithsonian','govinfo'} & {row['source_id'] for row in matrix['sources']})
"""
          if old not in workflow:
              raise RuntimeError('missing keyed-source registry assertion')
          workflow = workflow.replace(old, new)
          for source_id in sorted(REMOVED_IDS):
              workflow, count = re.subn(
                  rf'^          - {re.escape(source_id)}\n',
                  '',
                  workflow,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError(f'missing key matrix source {source_id}')
          for secret in sorted(REMOVED_SECRETS):
              workflow, count = re.subn(
                  rf'^      {re.escape(secret)}: .*\n',
                  '',
                  workflow,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError(f'missing validation secret {secret}')
          validate_workflow.write_text(workflow, encoding='utf-8')

          matrix = load(matrix_path)
          catalog = load(catalog_path)
          provider = catalog['providers'][0]
          active_ids = {row['source_id'] for row in matrix['sources']}
          assert len(active_ids) == matrix['active_source_count'] == 16
          assert not (active_ids & REMOVED_IDS)
          assert {row['source_id'] for row in matrix['sources'] if row['credential_mode'] == 'required_free_key'} == {
              'google-books', 'bhl'
          }
          assert provider['optional_secret_environment_variables'] == KEEP_SECRETS
          assert provider['limits']['source_count'] == 16
          for operation in provider['operations']:
              enum = operation.get('parameter_schema', {}).get('properties', {}).get('source_id', {}).get('enum', [])
              assert not (set(enum) & REMOVED_IDS)

          inspected = [
              catalog_path,
              matrix_path,
              task_path,
              validator_path,
              ticket_workflow,
              validate_workflow,
          ]
          combined = '\n'.join(path.read_text(encoding='utf-8') for path in inspected)
          for secret in REMOVED_SECRETS:
              assert secret not in combined
          for source_id in REMOVED_IDS:
              assert f'"source_id": "{source_id}"' not in combined
              assert f'source_id == "{source_id}"' not in combined

          Path('.github/workflows/apply-google-bhl-only.yml').unlink()
          PY

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python -m pip check

      - name: Regenerate catalogs and validate
        run: |
          python -m py_compile \
            api-center/global-knowledge-archives/global_knowledge_archives_task.py \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py
          PYTHONPATH=api-center/global-knowledge-archives:api-center \
            python api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
              --output /tmp/global-knowledge-registry.json
          python api-center/build_catalog_market_search.py
          python -m pytest -q api-center/tests/test_api_catalog.py
          git diff --check

      - name: Commit audited reduction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retain only Google Books and BHL keyed sources'
          git push origin HEAD:fix/retain-google-books-bhl-only
