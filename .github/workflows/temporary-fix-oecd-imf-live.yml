name: Temporary Fix OECD IMF Live Connectivity

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/temporary_fix_oecd_imf_live.py"
      - ".github/workflows/temporary-fix-oecd-imf-live.yml"

permissions:
  contents: write

concurrency:
  group: temporary-fix-oecd-imf-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/oecd-imf-live-connectivity
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply deterministic fixes
        run: python tools/temporary_fix_oecd_imf_live.py
      - name: Install and validate
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/oecd/requirements.txt \
            -r api-center/imf/requirements.txt \
            -r api-center/wto/requirements.txt \
            -r api-center/faostat/requirements.txt
          python -m pip check
          python -m py_compile \
            api-center/oecd/oecd_task.py \
            api-center/international-statistics/provider_task.py \
            api-center/oecd/tests/test_oecd_task.py \
            api-center/international-statistics/tests/test_international_statistics.py
          python -m unittest discover -s api-center/oecd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/international-statistics/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          python api-center/build_catalog_market_search.py
          git diff --check
      - name: Commit non-workflow fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          git commit -m "fix: repair OECD and IMF live connectivity"
          git push origin HEAD:fix/oecd-imf-live-connectivity

# rerun after preserving IMF SDMX plus wildcard
