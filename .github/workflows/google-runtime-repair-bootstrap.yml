name: Repair Google provider runtimes

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-google-provider-runtimes
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] repair-google-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: fix/google-provider-runtime-reliability-20260801
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/google-cloud/requirements.txt
            api-center/data-commons/requirements.txt

      - name: Apply deterministic runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          gcp = Path("api-center/google-cloud/google_cloud_task.py")
          old_query = '''    result, exec_meta = _http_json(
              "POST",
              url,
              token=token,
              body={
                  **common,
                  "dryRun": False,
                  "maxResults": max_rows,
                  "timeoutMs": timeout_ms,
                  "useQueryCache": True,
                  "jobTimeoutMs": str(timeout_ms),
                  "requestId": hashlib.sha256(sql.encode("utf-8")).hexdigest()[:32],
              },
              timeout=max(timeout, (timeout_ms // 1000) + 5),
          )
          if not result.get("jobComplete", False):
              raise RuntimeError("BigQuery job did not complete within the allowed synchronous timeout")
          return {
          '''
          new_query = '''    result, exec_meta = _http_json(
              "POST",
              url,
              token=token,
              body={
                  **common,
                  "dryRun": False,
                  "maxResults": max_rows,
                  "timeoutMs": timeout_ms,
                  "useQueryCache": True,
                  "jobTimeoutMs": str(timeout_ms),
                  "requestId": hashlib.sha256(sql.encode("utf-8")).hexdigest()[:32],
              },
              timeout=max(timeout, (timeout_ms // 1000) + 5),
          )
          poll_count = 0
          if not result.get("jobComplete", False):
              job_reference = result.get("jobReference")
              if not isinstance(job_reference, Mapping):
                  raise RuntimeError(
                      "BigQuery returned an incomplete job without jobReference"
                  )
              job_project = str(job_reference.get("projectId") or billing_project)
              job_id = str(job_reference.get("jobId") or "")
              job_location = str(job_reference.get("location") or location)
              if not PROJECT_ID_RE.fullmatch(job_project) or not job_id:
                  raise RuntimeError("BigQuery returned an invalid jobReference")
              poll_url = (
                  "https://bigquery.googleapis.com/bigquery/v2/projects/"
                  f"{quote(job_project)}/queries/{quote(job_id)}"
              )
              deadline = time.monotonic() + max(
                  1.0,
                  min(float(timeout), timeout_ms / 1000.0 + 5.0),
              )
              while not result.get("jobComplete", False):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise RuntimeError(
                          "BigQuery job did not complete before the polling deadline"
                      )
                  poll_timeout_ms = max(
                      1000,
                      min(10_000, int(remaining * 1000)),
                  )
                  result, poll_meta = _http_json(
                      "GET",
                      poll_url,
                      token=token,
                      params={
                          "location": job_location,
                          "maxResults": max_rows,
                          "timeoutMs": poll_timeout_ms,
                      },
                      timeout=max(5, min(timeout, (poll_timeout_ms // 1000) + 5)),
                  )
                  exec_meta = poll_meta
                  poll_count += 1
                  if not result.get("jobComplete", False):
                      time.sleep(min(1.0, max(0.05, remaining / 10.0)))
          return {
          '''
          replace_once(gcp, old_query, new_query)
          replace_once(
              gcp,
              '''    }, {**exec_meta, "dry_run_http_status": dry_meta["http_status"]}\n''',
              '''    }, {\n        **exec_meta,\n        "dry_run_http_status": dry_meta["http_status"],\n        "poll_count": poll_count,\n    }\n''',
          )
          replace_once(
              gcp,
              'raise RuntimeError(f"missing repository Secret {SERVICE_ACCOUNT_ENV}")',
              'raise RuntimeError(f"missing repository Secret {EARTH_ENGINE_SERVICE_ACCOUNT_ENV}")',
          )

          gcp_tests = Path("api-center/google-cloud/tests/test_google_cloud_task.py")
          gcp_anchor = '''    def test_bigquery_query_stops_when_dry_run_exceeds_budget(self) -> None:\n'''
          gcp_addition = '''    def test_bigquery_query_polls_until_job_completes(self) -> None:
              responses = [
                  ({"totalBytesProcessed": "0"}, {"http_status": 200}),
                  (
                      {
                          "jobComplete": False,
                          "jobReference": {
                              "projectId": "billing-project",
                              "jobId": "job_123",
                              "location": "US",
                          },
                      },
                      {"http_status": 200},
                  ),
                  (
                      {"jobComplete": False},
                      {"http_status": 200},
                  ),
                  (
                      {
                          "jobComplete": True,
                          "totalRows": "1",
                          "totalBytesProcessed": "0",
                          "totalBytesBilled": "0",
                          "schema": {"fields": [{"name": "value", "type": "INTEGER"}]},
                          "rows": [{"f": [{"v": "1"}]}],
                      },
                      {"http_status": 200},
                  ),
              ]
              with mock.patch.object(module, "_http_json", side_effect=responses) as mocked, mock.patch.object(
                  module.time, "sleep", return_value=None
              ):
                  result, metadata = module._bigquery_query(
                      {
                          "sql": "SELECT 1 AS value",
                          "maximum_bytes_billed": 1000000,
                          "max_rows": 1,
                          "timeout_ms": 30000,
                      },
                      "token",
                      "billing-project",
                      30,
                  )
              self.assertEqual(mocked.call_count, 4)
              self.assertEqual(result["rows"], [{"value": 1}])
              self.assertEqual(metadata["poll_count"], 2)
              poll_call = mocked.call_args_list[2]
              self.assertEqual(poll_call.args[0], "GET")
              self.assertIn("/projects/billing-project/queries/job_123", poll_call.args[1])
              self.assertEqual(poll_call.kwargs["params"]["location"], "US")

          '''
          gcp_text = gcp_tests.read_text(encoding="utf-8")
          if gcp_addition not in gcp_text:
              if gcp_anchor not in gcp_text:
                  raise SystemExit("BigQuery test insertion anchor not found")
              gcp_tests.write_text(
                  gcp_text.replace(gcp_anchor, gcp_addition + gcp_anchor),
                  encoding="utf-8",
              )

          dc = Path("api-center/data-commons/data_commons_task.py")
          replace_once(
              dc,
              '''def _request_json(endpoint: str, *, api_key: str, body: Mapping[str, Any], timeout: int, max_bytes: int) -> tuple[dict[str, Any], dict[str, Any]]:\n''',
              '''def _validate_api_key(value: Any) -> str:
              text = str(value or "").strip()
              if not text:
                  raise RuntimeError(f"missing repository Secret {API_KEY_ENV}")
              if not 8 <= len(text) <= 512:
                  raise RuntimeError(
                      f"invalid repository Secret {API_KEY_ENV}: expected 8 to 512 visible ASCII characters"
                  )
              if any(ord(character) < 0x21 or ord(character) > 0x7E for character in text):
                  raise RuntimeError(
                      f"invalid repository Secret {API_KEY_ENV}: only visible ASCII characters are allowed"
                  )
              return text


          def _request_json(endpoint: str, *, api_key: str, body: Mapping[str, Any], timeout: int, max_bytes: int) -> tuple[dict[str, Any], dict[str, Any]]:
          ''',
          )
          replace_once(
              dc,
              '''            api_key = str(os.getenv(API_KEY_ENV) or "").strip()
                      if not api_key:
                          raise RuntimeError(f"missing repository Secret {API_KEY_ENV}")
          ''',
              '''            api_key = _validate_api_key(os.getenv(API_KEY_ENV))
          ''',
          )
          replace_once(
              dc,
              '''        blocked = text.startswith("missing repository Secret")
                  status = "API_DATA_COMMONS_BLOCKED" if blocked else "API_DATA_COMMONS_FAILED"
                  failure = {
                      "code": "DATA_COMMONS_API_KEY_MISSING" if blocked else "DATA_COMMONS_UPSTREAM_ERROR",
                      "message": text,
                      "retryable": not blocked,
                  }
          ''',
              '''        missing = text.startswith("missing repository Secret")
                  invalid = text.startswith("invalid repository Secret")
                  blocked = missing or invalid
                  status = "API_DATA_COMMONS_BLOCKED" if blocked else "API_DATA_COMMONS_FAILED"
                  if missing:
                      code = "DATA_COMMONS_API_KEY_MISSING"
                  elif invalid:
                      code = "DATA_COMMONS_API_KEY_INVALID"
                  else:
                      code = "DATA_COMMONS_UPSTREAM_ERROR"
                  failure = {
                      "code": code,
                      "message": text,
                      "retryable": not blocked,
                  }
          ''',
          )

          dc_tests = Path("api-center/data-commons/tests/test_data_commons_task.py")
          dc_anchor = '''    def test_catalog_executes_without_secret_and_live_operation_blocks_without_key(self) -> None:\n'''
          dc_addition = '''    def test_api_key_validation_rejects_non_ascii_placeholders(self) -> None:
              self.assertEqual(module._validate_api_key("AIza_valid-key_123"), "AIza_valid-key_123")
              with self.assertRaisesRegex(RuntimeError, "visible ASCII"):
                  module._validate_api_key("你的Data Commons API Key")
              with self.assertRaisesRegex(RuntimeError, "8 to 512"):
                  module._validate_api_key("short")

              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  ticket = self.ticket("resolve-place")
                  ticket["parameters"] = {"nodes_json": '["Fuzhou"]'}
                  ticket_path = root / "ticket.json"
                  output_dir = root / "out"
                  ticket_path.write_text(json.dumps(ticket), encoding="utf-8")
                  with mock.patch.dict(
                      os.environ,
                      {module.API_KEY_ENV: "你的Data Commons API Key"},
                      clear=True,
                  ):
                      rc = module.execute(ticket_path, output_dir)
                  self.assertEqual(rc, 1)
                  snapshot = json.loads(
                      (output_dir / "data-commons-snapshot.json").read_text(encoding="utf-8")
                  )
                  self.assertEqual(snapshot["status"], "API_DATA_COMMONS_BLOCKED")
                  self.assertEqual(snapshot["failure"]["code"], "DATA_COMMONS_API_KEY_INVALID")
                  self.assertFalse(snapshot["failure"]["retryable"])

          '''
          dc_text = dc_tests.read_text(encoding="utf-8")
          if dc_addition not in dc_text:
              if dc_anchor not in dc_text:
                  raise SystemExit("Data Commons test insertion anchor not found")
              dc_tests.write_text(
                  dc_text.replace(dc_anchor, dc_addition + dc_anchor),
                  encoding="utf-8",
              )
          PY

      - name: Install and validate repaired runtimes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/data-commons/requirements.txt
          python -m pip check
          python -m py_compile \
            api-center/google-cloud/google_cloud_task.py \
            api-center/data-commons/data_commons_task.py \
            api-center/google-cloud/tests/test_google_cloud_task.py \
            api-center/data-commons/tests/test_data_commons_task.py
          python -m unittest discover -s api-center/google-cloud/tests -v
          python -m unittest discover -s api-center/data-commons/tests -v

      - name: Commit repair branch
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/google-cloud/google_cloud_task.py \
            api-center/google-cloud/tests/test_google_cloud_task.py \
            api-center/data-commons/data_commons_task.py \
            api-center/data-commons/tests/test_data_commons_task.py
          git diff --cached --check
          git commit -m 'fix(api-center): harden Google provider runtimes'
          git push origin HEAD:${TARGET_BRANCH}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish repair receipt
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Google runtime repair committed to ${TARGET_BRANCH} at ${{ steps.commit.outputs.sha }}. BigQuery now polls incomplete jobs; Data Commons rejects malformed non-ASCII keys before HTTP dispatch. Unit tests passed. Model calls: 0."
