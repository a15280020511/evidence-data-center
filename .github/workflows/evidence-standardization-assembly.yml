name: Assemble Evidence Standardization Branch

on:
  push:
    branches:
      - feat/evidence-standardization-boundary-20260803
    paths:
      - ".assemble-evidence-standardization-trigger"

permissions:
  contents: write

concurrency:
  group: assemble-evidence-standardization
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/evidence-standardization-boundary-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Generate provider contracts and aggregate catalog
        run: python api-center/assemble_evidence_standardization.py
      - name: Remove one-shot assembly entrypoints
        run: |
          rm -f \
            api-center/assemble_evidence_standardization.py \
            .github/workflows/evidence-standardization-assembly.yml \
            .assemble-evidence-standardization-trigger
      - name: Commit deterministic result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: register evidence standardization and center boundaries"
          git push origin HEAD:feat/evidence-standardization-boundary-20260803
