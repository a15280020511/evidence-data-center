name: Validate China Policy Intelligence Controls

on:
  pull_request:
    paths:
      - "api-center/huggingface/numeric-baseline-library/china-policy-intelligence-domain-requirements.json"
      - "api-center/huggingface/numeric-baseline-library/china-public-source-priority-registry.json"
      - "api-center/cloudflare/numeric-compiler/cloudflare-ai-routing-policy.json"
      - "api-center/cloudflare/numeric-compiler/validate_china_policy_controls.py"
      - ".github/workflows/china-policy-intelligence-control-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/numeric-baseline-library/china-policy-intelligence-domain-requirements.json"
      - "api-center/huggingface/numeric-baseline-library/china-public-source-priority-registry.json"
      - "api-center/cloudflare/numeric-compiler/cloudflare-ai-routing-policy.json"
      - "api-center/cloudflare/numeric-compiler/validate_china_policy_controls.py"
      - ".github/workflows/china-policy-intelligence-control-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-policy-intelligence-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate policy, source and AI routing controls
        run: |
          set -euo pipefail
          python -m py_compile api-center/cloudflare/numeric-compiler/validate_china_policy_controls.py
          python api-center/cloudflare/numeric-compiler/validate_china_policy_controls.py \
            --output-dir china-policy-control-validation
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(
              Path('china-policy-control-validation/policy-control-validation-receipt.json').read_text(encoding='utf-8')
          )
          assert receipt['status'] == 'CHINA_POLICY_INTELLIGENCE_CONTROLS_VALIDATED'
          assert receipt['policy_domain_count'] == 24
          assert receipt['source_class_count'] == 24
          assert receipt['default_strategy'] == 'deterministic_first'
          assert receipt['external_model_enabled_by_default'] is False
          assert receipt['automatic_paid_fallback_allowed'] is False
          assert receipt['numeric_hf_payload_only'] is True
          assert receipt['raw_content_persisted'] is False
          assert receipt['direct_center_connection_allowed'] is False
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: china-policy-intelligence-control-${{ github.run_id }}
          path: china-policy-control-validation/
          if-no-files-found: error
          retention-days: 30
