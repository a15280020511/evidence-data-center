name: PRC Justice Self Iteration Production Trigger

on:
  push:
    branches: [main]
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-self-iteration-policy.json"
      - "api-center/prc-legal-investigative-intelligence/prc_justice_self_iteration.py"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_self_iteration.py"
      - ".github/workflows/prc-justice-scheduled-self-iteration.yml"
      - ".github/workflows/prc-justice-self-iteration-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-production-iteration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch one bounded live production iteration
        run: |
          set -euo pipefail
          gh workflow run prc-justice-scheduled-self-iteration.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f profile=daily
