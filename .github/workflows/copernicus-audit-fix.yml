name: Fix Copernicus Audit False Positive

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "api-center/copernicus/copernicus_task.py"
      - ".github/workflows/copernicus-audit-fix.yml"

permissions:
  contents: write

concurrency:
  group: copernicus-audit-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Rename public OAuth endpoint constant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api-center/copernicus/copernicus_task.py')
          text = path.read_text(encoding='utf-8')
          assert text.count('TOKEN_PATH') == 2
          text = text.replace('TOKEN_PATH', 'OAUTH_ENDPOINT_PATH')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile api-center/copernicus/copernicus_task.py
          python tools/repository_audit.py --root . --output-dir audit-artifacts --fail-on high
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/copernicus/copernicus_task.py
          git commit -m "fix: avoid OAuth endpoint audit false positive"
          git push origin HEAD:${{ github.head_ref }}
