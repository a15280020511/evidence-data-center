name: PRC Justice Cloudflare Derived Intelligence

on:
  schedule:
    - cron: "25 4 * * *"
  push:
    branches: [main]
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-derived-intelligence-record.schema.json"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-intelligence-mesh.json"
      - "api-center/prc-legal-investigative-intelligence/transform_prc_justice_with_cloudflare_v2.py"
      - "api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_derived_intelligence.py"
      - ".github/workflows/prc-justice-cloudflare-derived-intelligence.yml"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum recent PRIMARY_VERIFIED pages to transform"
        required: false
        default: "6"
  pull_request:
    branches: [main]
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-derived-intelligence-record.schema.json"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-intelligence-mesh.json"
      - "api-center/prc-legal-investigative-intelligence/transform_prc_justice_with_cloudflare_v2.py"
      - "api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_derived_intelligence.py"
      - ".github/workflows/prc-justice-cloudflare-derived-intelligence.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: prc-justice-cloudflare-derived-${{ github.event_name == 'pull_request' && github.ref || 'scheduled-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  transform:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      MAX_PAGES: ${{ inputs.max_pages || '6' }}
      OUT_DIR: prc-justice-derived-intelligence
      ENCRYPTED_DIR: prc-justice-encrypted-handoffs
      LEDGER: api-center/prc-legal-investigative-intelligence/prc-justice-verified-signal-ledger.json
      RECENT_HOURS: "30"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'requests==2.32.5' 'jsonschema==4.25.1' 'cryptography==45.0.6'
          python -m pip check

      - name: Validate derived intelligence and encrypted-handoff contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/prc-legal-investigative-intelligence/transform_prc_justice_with_cloudflare_v2.py \
            api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py \
            api-center/prc-legal-investigative-intelligence/validate_prc_justice_derived_intelligence.py
          python api-center/prc-legal-investigative-intelligence/validate_prc_justice_derived_intelligence.py | tee prc-justice-derived-validation.json
          python api-center/prc-legal-investigative-intelligence/transform_prc_justice_with_cloudflare_v2.py \
            --validate-only --output-dir "$OUT_DIR" | tee prc-justice-cloudflare-transform-validation.json
          python api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py validate | tee prc-justice-encrypted-handoff-validation.json
          git diff --check

      - name: Stop after zero-source-network PR validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test ! -e "$OUT_DIR/derived-intelligence.jsonl"
          test ! -e "$ENCRYPTED_DIR/handoff-001.json"
          git diff --quiet

      - name: Build recent PRIMARY_VERIFIED input JSONL
        id: recent
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          ledger = json.loads(Path(os.environ['LEDGER']).read_text(encoding='utf-8'))
          cutoff = datetime.now(timezone.utc) - timedelta(hours=int(os.environ['RECENT_HOURS']))
          rows = []
          for row in ledger.get('events', []):
              if row.get('review_status') != 'PRIMARY_VERIFIED':
                  continue
              retrieved = str(((row.get('source') or {}).get('retrieved_at')) or '')
              try:
                  stamp = datetime.fromisoformat(retrieved.replace('Z', '+00:00'))
              except ValueError:
                  continue
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=timezone.utc)
              if stamp >= cutoff:
                  rows.append(row)
          Path('/tmp/prc-justice-primary.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in rows),
              encoding='utf-8',
          )
          print('recent_count=' + str(len(rows)))
          PY

      - name: Transform recent verified public pages with Cloudflare managed AI
        if: github.event_name != 'pull_request' && steps.recent.outputs.recent_count != '0'
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python api-center/prc-legal-investigative-intelligence/transform_prc_justice_with_cloudflare_v2.py \
            --input /tmp/prc-justice-primary.jsonl \
            --output-dir "$OUT_DIR" \
            --max-pages "$MAX_PAGES" | tee prc-justice-cloudflare-transform-run.json
          python -m json.tool "$OUT_DIR/transform-receipt.json" >/dev/null
          python -m json.tool "$OUT_DIR/governance-hf-justice-export.json" >/dev/null

      - name: Create empty-cycle receipt when no recent verified signals exist
        if: github.event_name != 'pull_request' && steps.recent.outputs.recent_count == '0'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python - <<'PY'
          import json
          from pathlib import Path
          row = {
              'status': 'PRC_JUSTICE_DERIVED_NO_NEW_PRIMARY_SIGNALS',
              'eligible_event_count': 0,
              'selected_page_count': 0,
              'record_count': 0,
              'failure_count': 0,
              'quota_exhausted': False,
              'network_used': False,
              'model_calls': 0,
              'raw_html_persisted': False,
              'raw_source_text_persisted': False,
              'raw_source_url_in_hf_export': False,
              'raw_model_response_persisted': False,
              'direct_huggingface_write': False,
          }
          Path('prc-justice-derived-intelligence/transform-receipt.json').write_text(json.dumps(row, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Read transform metadata
        id: handoff
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          receipt = json.loads(Path('prc-justice-derived-intelligence/transform-receipt.json').read_text(encoding='utf-8'))
          print('record_count=' + str(receipt.get('record_count', 0)))
          print('model_calls=' + str(receipt.get('model_calls', 0)))
          print('cloudflare_requests=' + str(receipt.get('cloudflare_requests', 0)))
          print('fallback_count=' + str(receipt.get('in_memory_html_fallback_count', 0)))
          print('quota_exhausted=' + ('true' if receipt.get('quota_exhausted') else 'false'))
          PY

      - name: Fetch current Governance transport public key
        if: github.event_name != 'pull_request' && steps.handoff.outputs.record_count != '0'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          url = 'https://api.github.com/repos/a15280020511/decision-system-governance/issues?state=open&per_page=100'
          request = urllib.request.Request(url, headers={
              'Accept':'application/vnd.github+json',
              'User-Agent':'prc-justice-evidence-public-key-reader/1',
              'X-GitHub-Api-Version':'2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              rows = json.loads(response.read(1024 * 1024))
          matches = [row for row in rows if row.get('title') == '[hf-justice-transport-key]' and 'pull_request' not in row]
          if len(matches) != 1:
              raise SystemExit('exactly one open Governance transport-key Issue is required')
          body = json.loads(matches[0].get('body') or '')
          if body.get('schema_version') != 'governance-prc-justice-transport-public-key-v1':
              raise SystemExit('Governance transport public-key schema mismatch')
          Path('/tmp/governance-hf-justice-public-key.json').write_text(json.dumps(body, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(json.dumps({'key_id':body.get('key_id'),'issue_number':matches[0].get('number')}, ensure_ascii=False))
          PY

      - name: Encrypt sanitized HF handoffs
        id: encrypted
        if: github.event_name != 'pull_request' && steps.handoff.outputs.record_count != '0'
        run: |
          set -euo pipefail
          rm -rf "$ENCRYPTED_DIR"
          python api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py build \
            --export "$OUT_DIR/governance-hf-justice-export.json" \
            --public-key /tmp/governance-hf-justice-public-key.json \
            --output-dir "$ENCRYPTED_DIR" | tee prc-justice-encrypted-handoff-run.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          row = json.loads(Path('prc-justice-encrypted-handoffs/manifest.json').read_text(encoding='utf-8'))
          print('chunk_count=' + str(row['chunk_count']))
          print('key_id=' + str(row['key_id']))
          PY

      - name: Create local encrypted handoff Issues for Governance polling
        id: issue_handoff
        if: github.event_name != 'pull_request' && steps.handoff.outputs.record_count != '0'
        run: |
          set -euo pipefail
          count=0
          for path in "$ENCRYPTED_DIR"/handoff-*.json; do
            test -f "$path"
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[hf-justice-handoff]" \
              --body-file "$path"
            count=$((count + 1))
          done
          test "$count" -eq "${{ steps.encrypted.outputs.chunk_count }}"
          echo "created_count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload safe encrypted transport evidence
        if: github.event_name != 'pull_request' && steps.handoff.outputs.record_count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prc-justice-encrypted-handoff-${{ github.run_id }}
          path: |
            prc-justice-derived-intelligence/transform-receipt.json
            prc-justice-cloudflare-transform-run.json
            prc-justice-encrypted-handoffs/manifest.json
            prc-justice-encrypted-handoffs/handoff-*.json
            prc-justice-encrypted-handoff-run.json
          if-no-files-found: error
          retention-days: 30

      - name: Delete plaintext derived files before workflow completion
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -f \
            "$OUT_DIR/derived-intelligence.jsonl" \
            "$OUT_DIR/governance-hf-justice-export.json" \
            /tmp/prc-justice-primary.jsonl \
            /tmp/governance-hf-justice-public-key.json

      - name: Write safe summary
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo '## PRC Justice Cloudflare Derived Intelligence'
            echo "- Recent PRIMARY_VERIFIED inputs: ${{ steps.recent.outputs.recent_count || '0' }}"
            echo "- Derived records: ${{ steps.handoff.outputs.record_count || '0' }}"
            echo "- Successful Cloudflare model calls: ${{ steps.handoff.outputs.model_calls || '0' }}"
            echo "- Cloudflare requests: ${{ steps.handoff.outputs.cloudflare_requests || '0' }}"
            echo "- In-memory HTML fallbacks: ${{ steps.handoff.outputs.fallback_count || '0' }}"
            echo "- Quota exhausted: ${{ steps.handoff.outputs.quota_exhausted || 'false' }}"
            echo "- Encrypted handoff chunks: ${{ steps.issue_handoff.outputs.created_count || '0' }}"
            echo '- Handoff transport: X25519 + HKDF-SHA256 + ChaCha20-Poly1305'
            echo '- GitHub cross-repo Actions permission required: false'
            echo '- GitHub cross-repo Contents permission required: false'
            echo '- Plaintext Issue transport: false'
            echo '- Reprocess window: last 30 hours only'
            echo '- Raw HTML persisted: false'
            echo '- Raw source text persisted: false'
            echo '- Raw source URL exported to HF: false'
            echo '- Raw model response persisted: false'
            echo '- Direct Hugging Face write: false'
            echo '- Storage gateway: decision-system-governance'
          } >> "$GITHUB_STEP_SUMMARY"
