name: Remove Erroneous HF Knowledge Graph

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: remove-erroneous-hf-knowledge-graph
  cancel-in-progress: false

jobs:
  remove:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[remove-erroneous-hf-knowledge-graph]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_NUMERIC_BASELINE_DATASET_REPO: ${{ vars.HF_NUMERIC_BASELINE_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned Hugging Face client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.24.0
          python -m pip check

      - name: Delete only the erroneous knowledge graph Dataset
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          from huggingface_hub.errors import RepositoryNotFoundError

          token = os.environ['HF_TOKEN']
          api = HfApi()
          identity = api.whoami(token=token)
          owner = identity['name']
          erroneous = f'{owner}/global-knowledge-graph'
          baseline = os.environ.get('HF_NUMERIC_BASELINE_DATASET_REPO', '').strip() or f'{owner}/compute-numeric-baselines'

          if erroneous == baseline:
              raise RuntimeError('cleanup target collides with compute baseline repository')

          baseline_before = api.repo_info(repo_id=baseline, repo_type='dataset', token=token)
          if not bool(getattr(baseline_before, 'private', False)):
              raise RuntimeError('compute numeric baseline Dataset is missing or not private')

          removed = False
          try:
              api.repo_info(repo_id=erroneous, repo_type='dataset', token=token)
          except RepositoryNotFoundError:
              pass
          else:
              api.delete_repo(repo_id=erroneous, repo_type='dataset', token=token)
              removed = True

          try:
              api.repo_info(repo_id=erroneous, repo_type='dataset', token=token)
          except RepositoryNotFoundError:
              deleted = True
          else:
              deleted = False

          baseline_after = api.repo_info(repo_id=baseline, repo_type='dataset', token=token)
          baseline_preserved = bool(getattr(baseline_after, 'private', False))
          if not deleted or not baseline_preserved:
              raise RuntimeError('cleanup verification failed')

          receipt = {
              'status': 'ERRONEOUS_HF_KNOWLEDGE_GRAPH_REMOVED',
              'erroneous_dataset': erroneous,
              'removed_in_this_run': removed,
              'erroneous_dataset_absent': deleted,
              'compute_baseline_dataset': baseline,
              'compute_baseline_preserved': baseline_preserved,
              'compute_baseline_role': 'compute-center-baseline-library',
              'knowledge_graph_storage_allowed_in_baseline': False,
              'secret_values_exposed': False,
              'model_calls': 0,
          }
          Path('cleanup-receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish cleanup receipt
        if: always()
        run: |
          python - <<'PY' > cleanup-comment.md
          import json
          from pathlib import Path
          path = Path('cleanup-receipt.json')
          if not path.exists():
              print('## Hugging Face 错误操作撤销回执\n\n- Status: `FAILED_BEFORE_RECEIPT`')
          else:
              row = json.loads(path.read_text(encoding='utf-8'))
              print('## Hugging Face 错误操作撤销回执')
              print()
              print(f"- Status: `{row['status']}`")
              print(f"- Erroneous Dataset absent: `{str(row['erroneous_dataset_absent']).lower()}`")
              print(f"- Compute baseline preserved: `{str(row['compute_baseline_preserved']).lower()}`")
              print(f"- Compute baseline role: `{row['compute_baseline_role']}`")
              print('- Secret values exposed: `false`')
              print('- Model calls: `0`')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@cleanup-comment.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remove-erroneous-hf-knowledge-graph-${{ github.run_id }}
          path: cleanup-receipt.json
          if-no-files-found: warn
          retention-days: 90
