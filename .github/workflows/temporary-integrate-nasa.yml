name: Temporary Integrate NASA

on:
  pull_request:
    branches: [main]
    paths:
      - "api-center/nasa/**"
      - ".github/workflows/temporary-integrate-nasa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-integrate-nasa
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/add-nasa-open-apis
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/nasa/requirements.txt

      - name: Install integration dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/nasa/requirements.txt
          python -m pip check

      - name: Apply deterministic integration and run regressions
        run: python api-center/nasa/integrate_nasa.py

      - name: Commit validated non-workflow files
        run: |
          set -euo pipefail
          git rm api-center/nasa/integrate_nasa.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api-center
          git diff --cached --check
          git commit -m "feat: register NASA Open APIs and Earthdata GIBS"
          git push origin HEAD:feat/add-nasa-open-apis
