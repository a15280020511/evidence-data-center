name: Managed Open Data Aggregators

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-open-data-global
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-open-data]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      MOBILITY_DATABASE_ACCESS_TOKEN: ${{ secrets.MOBILITY_DATABASE_ACCESS_TOKEN }}
      TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
      OPENCITATIONS_TOKEN: ${{ secrets.OPENCITATIONS_TOKEN }}
      UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/open-data-aggregators/requirements.txt
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/open-data-aggregators/requirements.txt
          python -m pip check
      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/open-data-aggregators/open_data_aggregators_task.py
      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: python api-center/open-data-aggregators/open_data_aggregators_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir open-data-artifacts
      - name: Publish acceptance or rejection
        if: always()
        run: |
          phase=rejected
          if [[ "${{ steps.prepare.outputs.accepted }}" == "true" ]]; then phase=accepted; fi
          python api-center/open-data-aggregators/open_data_aggregators_task.py render --output-dir open-data-artifacts --phase "$phase" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Execute one bounded operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/open-data-aggregators/open_data_aggregators_task.py execute --ticket open-data-artifacts/ticket.json --output-dir open-data-artifacts
      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-data-${{ github.event.issue.number }}-${{ github.run_id }}
          path: open-data-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish result
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/open-data-aggregators/open_data_aggregators_task.py render --output-dir open-data-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Fail closed
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_OPEN_DATA_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
