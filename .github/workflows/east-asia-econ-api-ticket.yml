name: Managed East Asia Econ API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-east-asia-econ-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-east-asia-econ-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-east-asia-econ]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      EAST_ASIA_ECON_API_KEY: ${{ secrets.EAST_ASIA_ECON_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/east-asia-econ/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/east-asia-econ/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: python -m py_compile api-center/east-asia-econ/east_asia_econ_task.py

      - name: Parse and authorize East Asia Econ ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/east-asia-econ/east_asia_econ_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir east-asia-econ-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/east-asia-econ/east_asia_econ_task.py render --output-dir east-asia-econ-artifacts --phase accepted > east-asia-econ-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@east-asia-econ-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/east-asia-econ/east_asia_econ_task.py render --output-dir east-asia-econ-artifacts --phase rejected > east-asia-econ-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@east-asia-econ-comment.md

      - name: Execute bounded read-only East Asia Econ operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/east-asia-econ/east_asia_econ_task.py execute --ticket east-asia-econ-artifacts/ticket.json --output-dir east-asia-econ-artifacts

      - name: Upload East Asia Econ evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: east-asia-econ-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: east-asia-econ-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/east-asia-econ/east_asia_econ_task.py render --output-dir east-asia-econ-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > east-asia-econ-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@east-asia-econ-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_EAST_ASIA_ECON_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "East Asia Econ API ticket did not complete successfully."
          exit 1
