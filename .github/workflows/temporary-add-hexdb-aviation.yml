name: Temporary Add HexDB Aviation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/temporary_add_hexdb_aviation.py"
      - ".github/workflows/temporary-add-hexdb-aviation.yml"

permissions:
  contents: read

concurrency:
  group: temporary-add-hexdb-aviation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/opensky-network/requirements.txt
          python -m pip check

      - name: Build integration
        run: python tools/temporary_add_hexdb_aviation.py

      - name: Validate integration
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/hexdb-aviation/requirements.txt
          python -m pip check
          python -m py_compile api-center/managed_provider_runtime.py api-center/hexdb-aviation/hexdb_aviation_task.py api-center/hexdb-aviation/tests/*.py
          python -m unittest discover -s api-center/hexdb-aviation/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          python api-center/build_catalog_market_search.py
          git diff --check

      - name: Package generated integration
        run: |
          mkdir -p integration-output/api-center/hexdb-aviation/tests integration-output/.github/workflows integration-output/api-center/tests integration-output/api-center/opensky-network
          cp api-center/hexdb-aviation/provider-catalog.json integration-output/api-center/hexdb-aviation/
          cp api-center/hexdb-aviation/ticket.schema.json integration-output/api-center/hexdb-aviation/
          cp api-center/hexdb-aviation/requirements.txt integration-output/api-center/hexdb-aviation/
          cp api-center/hexdb-aviation/README.md integration-output/api-center/hexdb-aviation/
          cp api-center/hexdb-aviation/hexdb_aviation_task.py integration-output/api-center/hexdb-aviation/
          cp api-center/hexdb-aviation/tests/test_hexdb_aviation_task.py integration-output/api-center/hexdb-aviation/tests/
          cp .github/workflows/hexdb-aviation-api-ticket.yml integration-output/.github/workflows/
          cp .github/workflows/hexdb-aviation-provider-validate.yml integration-output/.github/workflows/
          cp .github/workflows/api-catalog-validate.yml integration-output/.github/workflows/
          cp api-center/build_catalog_market_search.py integration-output/api-center/
          cp api-center/api-catalog.json integration-output/api-center/
          cp api-center/api-catalog.md integration-output/api-center/
          cp api-center/tests/test_api_catalog.py integration-output/api-center/tests/
          cp api-center/tests/test_capability_maximization.py integration-output/api-center/tests/
          cp api-center/opensky-network/README.md integration-output/api-center/opensky-network/

      - name: Upload generated integration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hexdb-aviation-integration-${{ github.run_id }}
          path: integration-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
