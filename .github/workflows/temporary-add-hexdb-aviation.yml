name: Temporary Add HexDB Aviation

on:
  push:
    branches:
      - feat/aviation-metadata-enrichment
    paths:
      - "tools/temporary_add_hexdb_aviation.py"
      - ".github/workflows/temporary-add-hexdb-aviation.yml"

permissions:
  contents: write

concurrency:
  group: temporary-add-hexdb-aviation
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/aviation-metadata-enrichment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/opensky-network/requirements.txt
          python -m pip check

      - name: Build integration
        run: python tools/temporary_add_hexdb_aviation.py

      - name: Validate integration
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/hexdb-aviation/requirements.txt
          python -m pip check
          python -m py_compile api-center/managed_provider_runtime.py api-center/hexdb-aviation/hexdb_aviation_task.py api-center/hexdb-aviation/tests/*.py
          python -m unittest discover -s api-center/hexdb-aviation/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          python api-center/build_catalog_market_search.py
          git diff --check

      - name: Remove temporary integration files
        run: |
          rm -f tools/temporary_add_hexdb_aviation.py
          rm -f .github/workflows/temporary-add-hexdb-aviation.yml

      - name: Commit generated provider and catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add aviation metadata enrichment provider"
          git push origin HEAD:feat/aviation-metadata-enrichment
