name: PRC Justice Encrypted Handoff Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py"
      - "api-center/prc-legal-investigative-intelligence/test_encrypt_prc_justice_hf_handoff.py"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-intelligence-mesh.json"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_derived_intelligence.py"
      - ".github/workflows/prc-justice-encrypted-handoff-validate.yml"
      - ".github/workflows/prc-justice-cloudflare-derived-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py"
      - "api-center/prc-legal-investigative-intelligence/test_encrypt_prc_justice_hf_handoff.py"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-intelligence-mesh.json"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_derived_intelligence.py"
      - ".github/workflows/prc-justice-encrypted-handoff-validate.yml"
      - ".github/workflows/prc-justice-cloudflare-derived-intelligence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned crypto dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'cryptography==45.0.6' 'jsonschema==4.25.1'
          python -m pip check

      - name: Run encrypted transport regression tests
        env:
          HF_TOKEN: ""
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py \
            api-center/prc-legal-investigative-intelligence/test_encrypt_prc_justice_hf_handoff.py
          python api-center/prc-legal-investigative-intelligence/test_encrypt_prc_justice_hf_handoff.py -v
          python api-center/prc-legal-investigative-intelligence/encrypt_prc_justice_hf_handoff.py validate | tee encrypted-handoff-validation.json
          python api-center/prc-legal-investigative-intelligence/validate_prc_justice_derived_intelligence.py | tee derived-intelligence-validation.json
          git diff --check
          git diff --quiet
