name: Validate Copernicus Provider

on:
  pull_request:
    paths:
      - "api-center/copernicus/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/copernicus-provider-validate.yml"
      - ".github/workflows/copernicus-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/copernicus/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/copernicus-provider-validate.yml"
      - ".github/workflows/copernicus-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/copernicus/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/copernicus/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/copernicus/copernicus_task.py api-center/copernicus/tests/*.py
          python -m unittest discover -s api-center/copernicus/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/copernicus')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'copernicus-cdse'
          assert provider['ticket_prefix'] == '[intel-copernicus]'
          assert provider['required_secret_environment_variable'] == 'COPERNICUS_CLIENT_SECRET'
          assert provider['required_repository_variable'] == 'COPERNICUS_CLIENT_ID'
          assert len(ids) == 7
          assert provider['limits']['requests_per_ticket_max'] == 2
          assert provider['limits']['fixed_stac_host'] == 'stac.dataspace.copernicus.eu'
          assert provider['limits']['fixed_processing_host'] == 'sh.dataspace.copernicus.eu'
          assert provider['limits']['bulk_download_allowed'] is False
          assert provider['limits']['arbitrary_evalscripts_allowed'] is False
          assert provider['limits']['oauth_token_persistence_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert {'catalog-capabilities','stac-list-collections','stac-search-items','stac-get-item','render-true-color-png','render-false-color-png','render-ndvi-png'} == ids
          print(json.dumps({'status':'PASS','operations':len(ids),'oauth_rendering':True}))
          PY
          git diff --check
