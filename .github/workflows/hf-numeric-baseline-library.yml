name: Validate Governance Baseline Export Contract

on:
  pull_request:
    paths:
      - "api-center/huggingface/numeric_baseline_store.py"
      - "api-center/huggingface/build_governance_baseline_export.py"
      - "api-center/huggingface/numeric-baseline-library/**"
      - "api-center/huggingface/tests/test_numeric_baseline_store.py"
      - "api-center/huggingface/tests/test_governance_baseline_export.py"
      - "api-center/huggingface/requirements-numeric-baseline.txt"
      - ".github/workflows/hf-numeric-baseline-library.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/numeric_baseline_store.py"
      - "api-center/huggingface/build_governance_baseline_export.py"
      - "api-center/huggingface/numeric-baseline-library/**"
      - "api-center/huggingface/tests/test_numeric_baseline_store.py"
      - "api-center/huggingface/tests/test_governance_baseline_export.py"
      - "api-center/huggingface/requirements-numeric-baseline.txt"
      - ".github/workflows/hf-numeric-baseline-library.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-governance-baseline-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-export-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ""
      HF_NUMERIC_BASELINE_DATASET_REPO: ""
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements-numeric-baseline.txt

      - name: Install pinned numeric dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/huggingface/requirements-numeric-baseline.txt
          python -m pip check

      - name: Compile and validate producer-only control plane
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/huggingface/numeric_baseline_store.py \
            api-center/huggingface/build_governance_baseline_export.py
          python -m unittest \
            api-center/huggingface/tests/test_numeric_baseline_store.py \
            api-center/huggingface/tests/test_governance_baseline_export.py -v
          python api-center/huggingface/numeric_baseline_store.py validate \
            --output-dir numeric-baseline-validation
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('numeric-baseline-validation/validation-receipt.json').read_text(encoding='utf-8'))
          role = json.loads(Path('api-center/huggingface/numeric-baseline-library/library-role.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'NUMERIC_BASELINE_BOOTSTRAP_VALIDATED'
          assert receipt['table_count'] == 31
          assert receipt['operation_count'] == 29
          assert receipt['managed_mode_count'] == 185
          assert receipt['huggingface_payloads_numeric_only'] is True
          assert role['schema_version'] == 'compute-center-baseline-library-role-v2'
          assert role['storage_gateway_owner'] == 'a15280020511/decision-system-governance'
          assert role['data_producer'] == 'a15280020511/evidence-data-center'
          assert role['intelligence_center_private_dataset_credentials_allowed'] is False
          assert role['intelligence_center_direct_dataset_read_allowed'] is False
          assert role['intelligence_center_direct_dataset_write_allowed'] is False
          assert role['compute_center_direct_dataset_access_allowed'] is False
          assert role['knowledge_base_storage_allowed'] is False
          assert role['knowledge_graph_storage_allowed'] is False
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-baseline-export-validation-${{ github.run_id }}
          path: numeric-baseline-validation/
          if-no-files-found: error
          retention-days: 30
