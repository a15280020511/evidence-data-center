name: Bootstrap BaoStock quota policy

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-baostock-quota-policy
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] apply-baostock-quota-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: fix/baostock-quota-serial-blacklist-20260801
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply deterministic BaoStock quota policy
        run: python maintenance/apply_baostock_quota_policy.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/baostock/requirements.txt
          python -m pip check

      - name: Generate deterministic API catalog
        run: python api-center/build_catalog_market_search.py

      - name: Run static and unit validation
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/baostock/baostock_task.py \
            api-center/baostock/baostock_quota.py \
            api-center/baostock/tests/test_baostock_task.py \
            api-center/baostock/tests/test_baostock_quota.py \
            api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path('api-center/baostock/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          limits = provider['limits']
          assert limits['daily_request_limit'] == 50000
          assert limits['daily_quota_timezone'] == 'Asia/Shanghai'
          assert limits['max_parallel_connections'] == 1
          assert limits['global_serial_connection_required'] is True
          assert limits['concurrency_group'] == 'api-baostock-global-single-connection'
          assert limits['local_blacklist_at_daily_limit'] is True
          assert limits['quota_ledger_fail_closed'] is True
          assert limits['quota_ledger_issue_number'] == 297
          assert limits['catalog_operations_consume_quota'] is False
          global_catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          normalized = {row['provider_id']: row for row in global_catalog['managed_providers']}['baostock']
          assert normalized['limits']['daily_request_limit'] == 50000
          assert normalized['limits']['max_parallel_connections'] == 1
          assert normalized['limits']['global_serial_connection_required'] is True
          assert normalized['limits']['local_blacklist_at_daily_limit'] is True
          print(json.dumps({'status': 'PASS', 'daily_limit': 50000, 'max_parallel_connections': 1, 'model_calls': 0}))
          PY
          test ! -e maintenance/apply_baostock_quota_policy.py
          git diff --check

      - name: Commit generated integration
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(baostock): enforce daily quota serial access and blacklist'
          git push origin HEAD:${TARGET_BRANCH}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish integration receipt
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="BAOSTOCK_QUOTA_POLICY_COMPLETED branch=${TARGET_BRANCH} commit=${{ steps.commit.outputs.sha }} daily_limit=50000 max_parallel_connections=1 blacklist=true fail_closed=true tests=passed model_calls=0"

      - name: Publish failure receipt
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="BAOSTOCK_QUOTA_POLICY_FAILED branch=${TARGET_BRANCH} run=${GITHUB_RUN_ID} model_calls=0"
