name: Validate Miaoxiang Provider

on:
  pull_request:
    paths:
      - "api-center/miaoxiang/**"
      - "api-center/company-intelligence/provider-catalog.json"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/miaoxiang-api-ticket.yml"
      - ".github/workflows/miaoxiang-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/miaoxiang/**"
      - "api-center/company-intelligence/provider-catalog.json"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/miaoxiang-api-ticket.yml"
      - ".github/workflows/miaoxiang-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-miaoxiang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-miaoxiang:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api-center/miaoxiang/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements-dev.txt \
            -r api-center/miaoxiang/requirements.txt
          python -m pip check

      - name: Audit provider dependencies
        run: python -m pip_audit -r api-center/miaoxiang/requirements.txt

      - name: Compile and run provider tests
        run: |
          python -m py_compile api-center/miaoxiang/miaoxiang_task.py api-center/miaoxiang/tests/*.py
          coverage erase
          coverage run --source=api-center/miaoxiang -m unittest discover \
            -s api-center/miaoxiang/tests -p 'test_*.py' -v
          coverage report --skip-empty
          coverage json -o miaoxiang-coverage.json

      - name: Validate schema, endpoint allowlist and global registration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          local_root = Path('api-center/miaoxiang')
          schema = json.loads((local_root / 'ticket.schema.json').read_text(encoding='utf-8'))
          local_catalog = json.loads((local_root / 'provider-catalog.json').read_text(encoding='utf-8'))
          global_catalog = json.loads(Path('api-center/company-intelligence/provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert local_catalog['schema_version'] == 'miaoxiang-provider-catalog-v1'
          local = local_catalog['providers'][0]
          registered = next(row for row in global_catalog['providers'] if row['provider_id'] == 'miaoxiang')
          assert local == registered
          assert local['required_secret_environment_variable'] == 'MX_APIKEY'
          assert len(local['operations']) == 4
          operation_ids = {row['operation_id'] for row in local['operations']}
          assert operation_ids == {'catalog-capabilities', 'financial-search', 'financial-data', 'stock-screen'}
          forbidden = {'trade', 'order', 'cancel', 'watchlist-add', 'watchlist-delete', 'account-funds'}
          assert not (operation_ids & forbidden)
          endpoints = {
              row.get('result_contract', {}).get('official_endpoint')
              for row in local['operations']
              if row['operation_id'] != 'catalog-capabilities'
          }
          assert endpoints == {
              'https://mkapi2.dfcfs.com/finskillshub/api/claw/news-search',
              'https://mkapi2.dfcfs.com/finskillshub/api/claw/query',
              'https://mkapi2.dfcfs.com/finskillshub/api/claw/stock-screen',
          }
          print(json.dumps({'status': 'PASS', 'provider': 'miaoxiang', 'operations': 4}))
          PY

      - name: Verify no key material or write operations enter repository files
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=tests --extended-regexp 'MX_APIKEY[[:space:]]*=[[:space:]]*[A-Za-z0-9._-]{8,}' api-center/miaoxiang; then
            echo "literal Miaoxiang key found" >&2
            exit 1
          fi
          if grep -R --line-number --exclude-dir=tests --ignore-case --extended-regexp '(submit[_ -]?order|cancel[_ -]?order|simulated[_ -]?trade|watchlist[_ -]?(add|delete))' api-center/miaoxiang/miaoxiang_task.py; then
            echo "write operation implementation found" >&2
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miaoxiang-provider-validation-${{ github.run_id }}
          path: |
            miaoxiang-coverage.json
            api-center/miaoxiang/provider-catalog.json
            api-center/miaoxiang/ticket.schema.json
          if-no-files-found: warn
          retention-days: 30
