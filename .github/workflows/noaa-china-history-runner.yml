name: Run NOAA China Historical Migration

on:
  push:
    branches: [fix/noaa-china-history-only]

permissions:
  contents: write

jobs:
  run-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/noaa-china-history-only
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Execute migration definition
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          text = Path('.github/workflows/noaa-china-history-migration.yml').read_text(encoding='utf-8')
          marker = '- name: Replace US NOAA connectors with China historical connectors'
          section = text.index(marker)
          start = text.index('          from __future__ import annotations\n', section)
          end = text.index('\n          PY\n', start)
          code = dedent(text[start:end])
          exec(compile(code, '<noaa-china-migration>', 'exec'), {})
          PY

      - name: Build deterministic contracts and run tests
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -v
          git diff --check

      - name: Live-test China historical datasets
        run: |
          set -euo pipefail
          ua='IntelligenceCenter/1.0 (github.com/a15280020511/evidence-data-center)'
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/search/v1/data?dataset=daily-summaries&startDate=2024-01-01&endDate=2024-01-02&bbox=53.56,73.50,18.10,134.77&limit=2' \
            -o /tmp/noaa-search.json
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/data/v1?dataset=daily-summaries&stations=CHM00054511&startDate=2024-01-01&endDate=2024-01-03&dataTypes=TAVG,TMAX,TMIN,PRCP&format=json&units=metric&includeStationName=true&includeStationLocation=true' \
            -o /tmp/noaa-daily.json
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-summary-of-the-month&stations=CHM00054511&startDate=2023-01-01&endDate=2023-03-31&dataTypes=TAVG,TMAX,TMIN,PRCP&format=json&units=metric&includeStationName=true&includeStationLocation=true' \
            -o /tmp/noaa-monthly.json
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-summary-of-the-year&stations=CHM00054511&startDate=2020-01-01&endDate=2023-12-31&dataTypes=TAVG,TMAX,TMIN,PRCP&format=json&units=metric&includeStationName=true&includeStationLocation=true' \
            -o /tmp/noaa-yearly.json
          python - <<'PY'
          import json
          from pathlib import Path

          search = json.loads(Path('/tmp/noaa-search.json').read_text(encoding='utf-8'))
          assert isinstance(search, dict)
          assert search.get('results') or search.get('stations') or search.get('totalCount')
          counts = {}
          for name in ('daily', 'monthly', 'yearly'):
              rows = json.loads(Path(f'/tmp/noaa-{name}.json').read_text(encoding='utf-8'))
              assert isinstance(rows, list) and rows, (name, rows)
              assert all(str(row.get('STATION', '')).startswith('CH') for row in rows)
              counts[name] = len(rows)
          print(json.dumps({'status': 'PASS', 'station': 'CHM00054511', **counts}))
          PY

      - name: Validate KrakenD configuration
        run: |
          image="$(awk 'toupper($1) == "FROM" {print $2; exit}' api-center/Dockerfile)"
          docker pull "$image"
          docker run --rm \
            -v "$PWD/api-center:/etc/krakend:ro" \
            "$image" check -tnc /etc/krakend/krakend.validation.json

      - name: Commit migration output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center .github/workflows/api-catalog-validate.yml
          if git diff --cached --quiet; then
            echo 'Migration output already committed.'
          else
            git commit -m 'fix: replace US NOAA weather with China historical climate data'
            git push origin HEAD:fix/noaa-china-history-only
          fi
