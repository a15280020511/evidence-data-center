name: Probe Consensus Browser OAuth Bridge

on:
  pull_request:
    paths:
      - "api-center/consensus-mcp/oauth_browser_probe.py"
      - ".github/workflows/consensus-oauth-browser-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.4

      - name: Compile probe
        run: python -m py_compile api-center/consensus-mcp/oauth_browser_probe.py

      - name: Probe official OAuth browser feasibility
        run: |
          set -euo pipefail
          python api-center/consensus-mcp/oauth_browser_probe.py \
            --output consensus-oauth-browser-probe.json | tee consensus-oauth-browser-probe-summary.json
          python -m json.tool consensus-oauth-browser-probe.json >/dev/null
          python -m json.tool consensus-oauth-browser-probe-summary.json >/dev/null

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consensus-oauth-browser-probe-${{ github.run_id }}
          path: |
            consensus-oauth-browser-probe.json
            consensus-oauth-browser-probe-summary.json
          if-no-files-found: error
          retention-days: 7
