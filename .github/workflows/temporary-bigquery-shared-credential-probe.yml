name: Temporary BigQuery Shared Credential Probe

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-test-bigquery-shared]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BIGQUERY_SERVICE_ACCOUNT_JSON: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
      BIGQUERY_ALLOWED_PUBLIC_PROJECTS: ${{ vars.BIGQUERY_ALLOWED_PUBLIC_PROJECTS }},patents-public-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/google-cloud/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/google-cloud/requirements.txt
          python -m pip check
      - name: Resolve shared credential and build ticket
        run: |
          python - <<'PY'
          import json, os, uuid
          from pathlib import Path
          value = (os.getenv('BIGQUERY_SERVICE_ACCOUNT_JSON') or '').strip() or (os.getenv('GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON') or '').strip()
          if value:
              marker = 'EOF_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write(f'BIGQUERY_SERVICE_ACCOUNT_JSON<<{marker}\n{value}\n{marker}\n')
          ticket = {
              'task_id': 'bigquery-shared-catalog-probe',
              'provider': 'bigquery',
              'operation': 'catalog-datasets',
              'objective': 'Verify shared Google credential with a real BigQuery datasets API request.',
              'parameters': {'project_id': 'bigquery-public-data', 'max_results': 1},
              'data_policy': {'classification': 'public', 'contains_personal_data': False},
              'acceptance': {'timeout_seconds': 60, 'max_response_bytes': 500000},
          }
          Path('bq-probe').mkdir(exist_ok=True)
          Path('bq-probe/ticket.json').write_text(json.dumps(ticket, indent=2), encoding='utf-8')
          Path('bq-probe/credential-presence.json').write_text(json.dumps({'present': bool(value), 'source': 'BIGQUERY_SERVICE_ACCOUNT_JSON' if (os.getenv('BIGQUERY_SERVICE_ACCOUNT_JSON') or '').strip() else ('GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON' if value else 'missing'), 'secret_values_included': False}, indent=2), encoding='utf-8')
          PY
      - name: Execute real BigQuery catalog request
        id: execute
        continue-on-error: true
        run: |
          python api-center/google-cloud/google_cloud_task.py execute --ticket bq-probe/ticket.json --output-dir bq-probe/result
      - name: Build report
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          presence = json.loads(Path('bq-probe/credential-presence.json').read_text())
          path = Path('bq-probe/result/gcp-snapshot.json')
          if path.exists():
              snap = json.loads(path.read_text())
              status = snap.get('status')
              failure = snap.get('failure') or {}
              metadata = snap.get('upstream_metadata') or {}
          else:
              status = 'SNAPSHOT_MISSING'; failure = {'code':'SNAPSHOT_MISSING','message':'No snapshot produced'}; metadata = {}
          lines = ['## BIGQUERY_SHARED_CREDENTIAL_PROBE','',f'- Status: `{status}`',f"- Credential source: `{presence.get('source')}`",f"- HTTP status: `{metadata.get('http_status','none')}`",'- Secret values exposed: `false`',f"- Run: `https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}`"]
          if failure:
              lines.append(f"- Error: `{failure.get('code')}` — {failure.get('message')}")
          Path('bq-comment.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Upload evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bigquery-shared-credential-probe-${{ github.run_id }}
          path: bq-probe/
          if-no-files-found: error
          retention-days: 7
      - name: Publish result
        if: always()
        run: |
          printf '\n- Artifact: %s\n' '${{ steps.upload.outputs.artifact-url }}' >> bq-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@bq-comment.md
      - name: Fail unsuccessful probe
        if: steps.execute.outcome != 'success'
        run: exit 1
