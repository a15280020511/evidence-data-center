name: Validate GPTs API Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/baostock/requirements.txt
            api-center/eodhd/requirements.txt
            api-center/data-commons/requirements.txt
            api-center/qweather/requirements.txt
            api-center/xweather/requirements.txt
            api-center/miaoxiang-mcp/requirements.txt
            api-center/browserless/requirements.txt
            api-center/east-asia-econ/requirements.txt
            api-center/alpha-vantage/requirements.txt
            api-center/overture-maps/requirements.txt
            api-center/oecd/requirements.txt
            api-center/alphafeed/requirements.txt
            api-center/agent-toolbelt/requirements.txt

      - name: Install isolated API dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/baostock/requirements.txt \
            -r api-center/eodhd/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/qweather/requirements.txt \
            -r api-center/xweather/requirements.txt \
            -r api-center/miaoxiang-mcp/requirements.txt \
            -r api-center/browserless/requirements.txt \
            -r api-center/east-asia-econ/requirements.txt \
            -r api-center/alpha-vantage/requirements.txt \
            -r api-center/overture-maps/requirements.txt \
            -r api-center/oecd/requirements.txt \
            -r api-center/alphafeed/requirements.txt \
            -r api-center/agent-toolbelt/requirements.txt
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Compile and run provider regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_config.py \
            api-center/build_catalog.py \
            api-center/build_catalog_market_search.py \
            api-center/managed_provider_runtime.py \
            api-center/baostock/baostock_task.py \
            api-center/eodhd/eodhd_task.py \
            api-center/data-commons/data_commons_task.py \
            api-center/qweather/qweather_task.py \
            api-center/xweather/xweather_task.py \
            api-center/miaoxiang-mcp/miaoxiang_mcp_task.py \
            api-center/browserless/browserless_task.py \
            api-center/east-asia-econ/east_asia_econ_task.py \
            api-center/alpha-vantage/alpha_vantage_task.py \
            api-center/overture-maps/overture_maps_task.py \
            api-center/oecd/oecd_task.py \
            api-center/alphafeed/alphafeed_task.py \
            api-center/agent-toolbelt/agent_toolbelt_task.py \
            api-center/tests/*.py \
            api-center/browserless/tests/*.py \
            api-center/east-asia-econ/tests/*.py \
            api-center/alpha-vantage/tests/*.py \
            api-center/overture-maps/tests/*.py \
            api-center/oecd/tests/*.py \
            api-center/alphafeed/tests/*.py \
            api-center/xweather/tests/*.py \
            api-center/agent-toolbelt/tests/*.py
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/eodhd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/data-commons/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/qweather/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/xweather/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/miaoxiang-mcp/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/browserless/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/east-asia-econ/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/alpha-vantage/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/overture-maps/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/oecd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/alphafeed/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/agent-toolbelt/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v

      - name: Rebuild deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          cmp /tmp/committed-api-catalog.json api-center/api-catalog.json
          cmp /tmp/committed-api-catalog.md api-center/api-catalog.md
          cmp /tmp/committed-connector-manifest.json api-center/connector-manifest.json
          cmp /tmp/committed-krakend.validation.json api-center/krakend.validation.json
          cmp /tmp/committed-krakend.tmpl api-center/krakend.tmpl

      - name: Verify provider and World Bank invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          connectors = manifest['connectors']

          assert manifest['connector_count'] == manifest['enabled_connector_count'] == 68
          assert sum(row['id'].startswith('worldbank-') for row in connectors) == 9
          assert catalog['managed_provider_count'] == len(providers) == 30
          assert catalog['enabled_managed_provider_count'] == 30
          assert catalog['managed_operation_count'] == sum(
              len(row['operations']) for row in providers.values()
          ) == 368
          assert catalog['secret_values_exposed'] is False
          assert all(row['enabled'] is True for row in providers.values())
          assert all(row['secret_value_exposed'] is False for row in providers.values())

          overture = providers['overture-maps']
          assert overture['ticket_prefix'] == '[api-overture]'
          assert overture['required_secret_environment_variable_name'] == ''
          assert len(overture['operations']) == 7
          assert overture['limits']['whole_world_download_allowed'] is False
          assert overture['limits']['arbitrary_s3_paths_allowed'] is False

          oecd = providers['oecd']
          assert oecd['ticket_prefix'] == '[api-oecd]'
          assert oecd['required_secret_environment_variable_name'] == ''
          assert len(oecd['operations']) == 6
          assert oecd['limits']['fixed_api_host'] == 'sdmx.oecd.org'
          assert oecd['limits']['arbitrary_sdmx_resource_types_allowed'] is False

          alphafeed = providers['alphafeed']
          assert alphafeed['ticket_prefix'] == '[api-alphafeed]'
          assert alphafeed['required_secret_environment_variable_name'] == 'ALPHAFEED_API_KEY'
          assert len(alphafeed['operations']) == 10
          assert alphafeed['limits']['fixed_api_host'] == 'api.alphafeed.org'
          assert alphafeed['limits']['arbitrary_sdk_methods_allowed'] is False
          assert alphafeed['limits']['client_supplied_api_key_allowed'] is False
          assert alphafeed['limits']['trading_or_order_execution_allowed'] is False

          xweather = providers['xweather']
          assert xweather['ticket_prefix'] == '[api-xweather]'
          assert xweather['required_secret_environment_variable_name'] == 'XWEATHER_CLIENT_SECRET'
          assert xweather['required_repository_variable'] == 'XWEATHER_CLIENT_ID'
          assert len(xweather['operations']) == 10
          assert xweather['limits']['fixed_api_host'] == 'data.api.xweather.com'
          assert xweather['limits']['arbitrary_query_parameters_allowed'] is False
          assert xweather['limits']['client_supplied_credentials_allowed'] is False
          assert xweather['limits']['write_operations_allowed'] is False

          agent_toolbelt = providers['agent-toolbelt']
          assert agent_toolbelt['ticket_prefix'] == '[api-agent-toolbelt]'
          assert agent_toolbelt['required_secret_environment_variable_name'] == 'AGENT_TOOLBELT_KEY'
          assert len(agent_toolbelt['operations']) == 29
          assert agent_toolbelt['limits']['fixed_api_host'] == 'www.agenttoolbelt.live'
          assert agent_toolbelt['limits']['arbitrary_tool_names_allowed'] is False
          assert agent_toolbelt['limits']['watchlist_crud_allowed'] is False
          assert agent_toolbelt['limits']['write_operations_allowed'] is False
          assert agent_toolbelt['limits']['trading_or_order_execution_allowed'] is False

          print(json.dumps({
              'status': 'PASS',
              'connectors': 68,
              'worldbank_connectors': 9,
              'managed_providers': 30,
              'managed_operations': 368,
              'overture_maps_operations': 7,
              'oecd_operations': 6,
              'alphafeed_operations': 10,
              'xweather_operations': 10,
              'agent_toolbelt_operations': 29,
          }))
          PY
          git diff --check

      - name: Upload safe catalog and generated gateway evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpts-api-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/catalog-metadata.json
            api-center/connector-manifest.json
            api-center/krakend.tmpl
            api-center/krakend.validation.json
            api-center/overture-maps/provider-catalog.json
            api-center/overture-maps/ticket.schema.json
            api-center/oecd/provider-catalog.json
            api-center/oecd/ticket.schema.json
            api-center/alphafeed/provider-catalog.json
            api-center/alphafeed/ticket.schema.json
            api-center/xweather/provider-catalog.json
            api-center/xweather/ticket.schema.json
            api-center/agent-toolbelt/provider-catalog.json
            api-center/agent-toolbelt/ticket.schema.json
          if-no-files-found: error
          retention-days: 30
