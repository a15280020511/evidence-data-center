name: Validate GPTs Intelligence Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/baostock/requirements.txt
            api-center/eodhd/requirements.txt
            api-center/data-commons/requirements.txt
            api-center/qweather/requirements.txt
            api-center/xweather/requirements.txt
            api-center/miaoxiang-mcp/requirements.txt
            api-center/browserless/requirements.txt
            api-center/east-asia-econ/requirements.txt
            api-center/alpha-vantage/requirements.txt
            api-center/overture-maps/requirements.txt
            api-center/oecd/requirements.txt
            api-center/alphafeed/requirements.txt
            api-center/who-gho/requirements.txt
            api-center/mediastack/requirements.txt
            api-center/statistics-of-the-world/requirements.txt
            api-center/aisstream/requirements.txt
            api-center/internet-archive/requirements.txt
            api-center/marketstack/requirements.txt
            api-center/nasa/requirements.txt
            api-center/metno-geosatellite/requirements.txt
            api-center/copernicus/requirements.txt
            api-center/eia/requirements.txt
            api-center/un-comtrade/requirements.txt

      - name: Install isolated intelligence dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/baostock/requirements.txt \
            -r api-center/eodhd/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/qweather/requirements.txt \
            -r api-center/xweather/requirements.txt \
            -r api-center/miaoxiang-mcp/requirements.txt \
            -r api-center/browserless/requirements.txt \
            -r api-center/east-asia-econ/requirements.txt \
            -r api-center/alpha-vantage/requirements.txt \
            -r api-center/overture-maps/requirements.txt \
            -r api-center/oecd/requirements.txt \
            -r api-center/alphafeed/requirements.txt \
            -r api-center/who-gho/requirements.txt \
            -r api-center/mediastack/requirements.txt \
            -r api-center/statistics-of-the-world/requirements.txt \
            -r api-center/aisstream/requirements.txt \
            -r api-center/internet-archive/requirements.txt \
            -r api-center/marketstack/requirements.txt \
            -r api-center/nasa/requirements.txt \
            -r api-center/metno-geosatellite/requirements.txt \
            -r api-center/copernicus/requirements.txt \
            -r api-center/eia/requirements.txt \
            -r api-center/un-comtrade/requirements.txt
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Compile and run provider regressions
        run: |
          set -euo pipefail
          python -m compileall -q api-center
          for test_dir in \
            api-center/baostock/tests \
            api-center/eodhd/tests \
            api-center/data-commons/tests \
            api-center/qweather/tests \
            api-center/xweather/tests \
            api-center/miaoxiang-mcp/tests \
            api-center/browserless/tests \
            api-center/east-asia-econ/tests \
            api-center/alpha-vantage/tests \
            api-center/overture-maps/tests \
            api-center/oecd/tests \
            api-center/alphafeed/tests \
            api-center/who-gho/tests \
            api-center/mediastack/tests \
            api-center/statistics-of-the-world/tests \
            api-center/aisstream/tests \
            api-center/internet-archive/tests \
            api-center/marketstack/tests \
            api-center/nasa/tests \
            api-center/metno-geosatellite/tests \
            api-center/copernicus/tests \
            api-center/eia/tests \
            api-center/un-comtrade/tests \
            api-center/tests
          do
            python -m unittest discover -s "$test_dir" -p 'test_*.py' -v
          done

      - name: Rebuild deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          cmp /tmp/committed-api-catalog.json api-center/api-catalog.json
          cmp /tmp/committed-api-catalog.md api-center/api-catalog.md
          cmp /tmp/committed-connector-manifest.json api-center/connector-manifest.json
          cmp /tmp/committed-krakend.validation.json api-center/krakend.validation.json
          cmp /tmp/committed-krakend.tmpl api-center/krakend.tmpl

      - name: Verify unified provider invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          expected_operations = {
              'bigquery': 7,
              'earth-engine': 6,
              'data-commons': 5,
              'qweather': 18,
              'xweather': 10,
              'akshare': 17,
              'ashare': 1,
              'aifin-market': 17,
              'yuandian-law': 40,
              'tianyancha': 3,
              'miaoxiang': 4,
              'miaoxiang-mcp': 13,
              'jina-reader': 2,
              'exa': 3,
              'tavily': 5,
              'firecrawl': 4,
              'browserless': 8,
              'tickflow': 5,
              'serpapi': 4,
              'tushare': 20,
              'baostock': 20,
              'eodhd': 25,
              'east-asia-econ': 6,
              'alpha-vantage': 66,
              'overture-maps': 7,
              'oecd': 6,
              'alphafeed': 10,
              'who-gho-odata': 8,
              'mediastack': 5,
              'statistics-of-the-world': 11,
              'aisstream': 4,
              'internet-archive': 6,
              'marketstack': 11,
              'nasa': 25,
              'metno-geosatellite': 4,
              'copernicus-cdse': 7,
              'eia': 6,
              'un-comtrade': 10,
              'wolfram-alpha': 4,
              'llamaparse': 3,
          }

          assert manifest['connector_count'] == manifest['enabled_connector_count'] == 68
          assert sum(row['id'].startswith('worldbank-') for row in manifest['connectors']) == 9
          assert set(providers) == set(expected_operations)
          assert catalog['managed_provider_count'] == len(providers) == 40
          assert catalog['enabled_managed_provider_count'] == 40
          assert catalog['managed_operation_count'] == sum(expected_operations.values()) == 436
          assert catalog['managed_operation_count'] == sum(
              len(row['operations']) for row in providers.values()
          )
          assert catalog['center_display_name_zh'] == '情报中心'
          assert catalog['center_display_name_en'] == 'Intelligence Center'
          assert catalog['secret_values_exposed'] is False
          assert all(row['enabled'] is True for row in providers.values())
          assert all(row['secret_value_exposed'] is False for row in providers.values())
          assert all(
              len(providers[provider_id]['operations']) == count
              for provider_id, count in expected_operations.items()
          )
          assert all(
              operation.get('result_contract', {}).get('read_only') is True
              for provider in providers.values()
              for operation in provider['operations']
          )
          assert 'agent-toolbelt' not in providers
          assert 'gapup-mcp' not in providers

          un_comtrade = providers['un-comtrade']
          assert un_comtrade['ticket_prefix'] == '[intel-un-comtrade]'
          assert un_comtrade['required_secret_environment_variable_name'] == 'UN_COMTRADE_API_KEY'
          assert un_comtrade['limits']['requests_per_ticket_max'] == 1
          assert un_comtrade['limits']['preview_records_max'] == 500
          assert un_comtrade['limits']['records_per_request_max'] == 5000
          assert un_comtrade['limits']['free_api_calls_per_day'] == 500
          assert un_comtrade['limits']['fixed_api_host'] == 'comtradeapi.un.org'
          assert un_comtrade['limits']['automatic_pagination_allowed'] is False
          assert un_comtrade['limits']['bulk_api_allowed'] is False
          assert un_comtrade['limits']['async_api_allowed'] is False
          assert un_comtrade['limits']['file_downloads_allowed'] is False
          assert un_comtrade['limits']['write_operations_allowed'] is False

          print(json.dumps({
              'status': 'PASS',
              'connectors': 68,
              'worldbank_connectors': 9,
              'managed_providers': 40,
              'managed_operations': 436,
              'un_comtrade_operations': 10,
              'removed_providers': ['agent-toolbelt', 'gapup-mcp'],
          }))
          PY
          git diff --check

      - name: Upload safe intelligence catalog evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpts-intelligence-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/catalog-metadata.json
            api-center/connector-manifest.json
            api-center/krakend.validation.json
            api-center/krakend.tmpl
          if-no-files-found: error
          retention-days: 30
