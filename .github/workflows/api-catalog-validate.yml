name: Validate GPTs Intelligence Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install isolated intelligence dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/google-cloud/requirements.txt \
            -r api-center/baostock/requirements.txt \
            -r api-center/eodhd/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/qweather/requirements.txt \
            -r api-center/xweather/requirements.txt \
            -r api-center/miaoxiang-mcp/requirements.txt \
            -r api-center/browserless/requirements.txt \
            -r api-center/east-asia-econ/requirements.txt \
            -r api-center/alpha-vantage/requirements.txt \
            -r api-center/overture-maps/requirements.txt \
            -r api-center/oecd/requirements.txt \
            -r api-center/alphafeed/requirements.txt \
            -r api-center/who-gho/requirements.txt \
            -r api-center/mediastack/requirements.txt \
            -r api-center/statistics-of-the-world/requirements.txt \
            -r api-center/aisstream/requirements.txt \
            -r api-center/internet-archive/requirements.txt \
            -r api-center/marketstack/requirements.txt \
            -r api-center/nasa/requirements.txt \
            -r api-center/metno-geosatellite/requirements.txt \
            -r api-center/copernicus/requirements.txt \
            -r api-center/eia/requirements.txt \
            -r api-center/un-comtrade/requirements.txt \
            -r api-center/opensky-network/requirements.txt \
            -r api-center/hexdb-aviation/requirements.txt \
            -r api-center/wto/requirements.txt \
            -r api-center/imf/requirements.txt \
            -r api-center/adb/requirements.txt
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Compile and run all provider regressions
        run: |
          set -euo pipefail
          python -m compileall -q api-center
          while IFS= read -r -d '' test_dir; do
            python -m unittest discover -s "$test_dir" -p 'test_*.py' -v
          done < <(find api-center -mindepth 2 -maxdepth 2 -type d -name tests -print0 | sort -z)
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v

      - name: Rebuild deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          cmp /tmp/committed-api-catalog.json api-center/api-catalog.json
          cmp /tmp/committed-api-catalog.md api-center/api-catalog.md
          cmp /tmp/committed-connector-manifest.json api-center/connector-manifest.json
          cmp /tmp/committed-krakend.validation.json api-center/krakend.validation.json
          cmp /tmp/committed-krakend.tmpl api-center/krakend.tmpl

      - name: Verify unified provider invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}

          assert manifest['connector_count'] == manifest['enabled_connector_count'] == 68
          assert sum(row['id'].startswith('worldbank-') for row in manifest['connectors']) == 9
          assert catalog['managed_provider_count'] == len(providers) == 45
          assert catalog['enabled_managed_provider_count'] == 45
          assert catalog['managed_operation_count'] == 472
          assert catalog['managed_operation_count'] == sum(len(row['operations']) for row in providers.values())
          assert catalog['center_display_name_zh'] == '情报中心'
          assert catalog['center_display_name_en'] == 'Intelligence Center'
          assert catalog['secret_values_exposed'] is False
          assert all(row['enabled'] is True for row in providers.values())
          assert all(row['secret_value_exposed'] is False for row in providers.values())
          assert 'agent-toolbelt' not in providers
          assert 'gapup-mcp' not in providers

          opensky = providers['opensky-network']
          assert opensky['ticket_prefix'] == '[intel-opensky]'
          assert opensky['required_secret_environment_variable_name'] == 'OPEN_SKY_CLIENT_SECRET'
          assert opensky['required_repository_variable'] == 'OPEN_SKY_CLIENT_ID'
          assert len(opensky['operations']) == 9
          assert opensky['limits']['network_requests_per_ticket_max'] == 2
          assert opensky['limits']['state_bbox_area_square_degrees_max'] == 400
          assert opensky['limits']['state_history_seconds_max'] == 3600
          assert opensky['limits']['flight_interval_seconds_max'] == 7200
          assert opensky['limits']['track_history_days_max'] == 30
          assert opensky['limits']['fixed_api_host'] == 'opensky-network.org'
          assert opensky['limits']['fixed_auth_host'] == 'auth.opensky-network.org'
          assert opensky['limits']['global_state_query_allowed'] is False
          assert opensky['limits']['trino_historical_access_allowed'] is False
          assert opensky['limits']['bulk_download_allowed'] is False
          assert opensky['limits']['oauth_token_persistence_allowed'] is False
          assert opensky['limits']['write_operations_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in opensky['operations'])

          hexdb = providers['hexdb-aviation']
          assert hexdb['ticket_prefix'] == '[intel-hexdb]'
          assert hexdb['required_secret_environment_variable_name'] == ''
          assert len(hexdb['operations']) == 6
          assert hexdb['limits']['requests_per_ticket_max'] == 1
          assert hexdb['limits']['fixed_api_host'] == 'hexdb.io'
          assert hexdb['limits']['bulk_lookup_allowed'] is False
          assert hexdb['limits']['image_retrieval_allowed'] is False
          assert hexdb['limits']['automatic_retry_allowed'] is False
          assert hexdb['limits']['write_operations_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in hexdb['operations'])

          wto = providers['wto']
          assert wto['ticket_prefix'] == '[intel-wto]'
          assert wto['required_secret_environment_variable_name'] == 'WTO_API_KEY'
          assert len(wto['operations']) == 7
          assert wto['limits']['requests_per_ticket_max'] == 1
          assert wto['limits']['fixed_api_host'] == 'api.wto.org'
          assert wto['limits']['records_per_ticket_max'] == 500
          assert wto['limits']['automatic_pagination_allowed'] is False
          assert wto['limits']['write_operations_allowed'] is False

          imf = providers['imf']
          assert imf['ticket_prefix'] == '[intel-imf]'
          assert imf['required_secret_environment_variable_name'] == 'IMF_API_KEY'
          assert len(imf['operations']) == 6
          assert imf['limits']['fixed_api_host'] == 'api.imf.org'
          assert imf['limits']['fixed_api_prefix'] == '/external/sdmx/3.0'
          assert imf['limits']['subscription_key_header'] == 'Ocp-Apim-Subscription-Key'
          assert imf['limits']['authentication_required'] is True
          assert imf['limits']['arbitrary_sdmx_resource_types_allowed'] is False
          assert imf['limits']['automatic_pagination_allowed'] is False
          assert imf['limits']['write_operations_allowed'] is False

          oecd = providers['oecd']
          assert len(oecd['operations']) == 6
          assert oecd['limits']['fixed_api_host'] == 'sdmx.oecd.org'
          assert oecd['limits']['write_operations_allowed'] is False

          adb = providers['adb']
          assert adb['ticket_prefix'] == '[intel-adb]'
          assert adb['required_secret_environment_variable_name'] == ''
          assert len(adb['operations']) == 8
          assert adb['limits']['fixed_api_host'] == 'kidb.adb.org'
          assert adb['limits']['fixed_api_prefix'] == '/api/v4/sdmx'
          assert adb['limits']['official_rate_limit_queries_per_minute'] == 20
          assert adb['limits']['requests_per_ticket_max'] == 1
          assert adb['limits']['empty_dimension_bulk_queries_allowed'] is False
          assert adb['limits']['automatic_retry_allowed'] is False
          assert adb['limits']['automatic_pagination_allowed'] is False
          assert adb['limits']['write_operations_allowed'] is False

          print(json.dumps({
              'status': 'PASS',
              'connectors': 68,
              'managed_providers': 45,
              'managed_operations': 472,
              'opensky_operations': 9,
              'hexdb_operations': 6,
              'wto_operations': 7,
              'imf_operations': 6,
              'oecd_operations': 6,
              'adb_operations': 8,
          }))
          PY
          git diff --check

      - name: Upload safe intelligence catalog evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpts-intelligence-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/catalog-metadata.json
            api-center/connector-manifest.json
            api-center/krakend.validation.json
            api-center/krakend.tmpl
          if-no-files-found: error
          retention-days: 30
