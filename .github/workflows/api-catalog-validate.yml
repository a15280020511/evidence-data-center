name: Validate GPTs API Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Install isolated API dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Rebuild registry and GPTs capability catalog
        run: |
          set -euo pipefail
          python -m py_compile api-center/build_config.py api-center/build_catalog.py api-center/tests/test_api_catalog.py
          python api-center/build_config.py
          python api-center/build_catalog.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v

      - name: Verify generated contracts are semantically identical
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def load_json(path: str):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          secret_pattern = re.compile(r'\{\{ env "([A-Z][A-Z0-9_]*)" \| quote \}\}')

          def load_template(path: str):
              text = Path(path).read_text(encoding='utf-8')
              rendered = secret_pattern.sub(
                  lambda match: json.dumps(f'__ENV_{match.group(1)}__'),
                  text,
              )
              return json.loads(rendered)

          assert load_json('/tmp/committed-api-catalog.json') == load_json('api-center/api-catalog.json')
          assert load_json('/tmp/committed-connector-manifest.json') == load_json('api-center/connector-manifest.json')
          assert load_json('/tmp/committed-krakend.validation.json') == load_json('api-center/krakend.validation.json')
          assert load_template('/tmp/committed-krakend.tmpl') == load_template('api-center/krakend.tmpl')
          assert Path('/tmp/committed-api-catalog.md').read_text(encoding='utf-8') == Path('api-center/api-catalog.md').read_text(encoding='utf-8')

          manifest = load_json('api-center/connector-manifest.json')
          catalog = load_json('api-center/api-catalog.json')
          google_providers = load_json('api-center/google-cloud/provider-catalog.json')
          commercial_providers = load_json('api-center/company-intelligence/provider-catalog.json')
          miaoxiang_local = load_json('api-center/miaoxiang/provider-catalog.json')
          web_providers = load_json('api-center/web-retrieval/provider-catalog.json')
          validation = load_json('api-center/krakend.validation.json')
          rows = manifest['connectors']
          enabled_rows = [row for row in rows if row['enabled']]
          expected_secrets = sorted({
              row['secret_environment_variable']
              for row in enabled_rows
              if row.get('secret_environment_variable')
          })
          connector_ids = {row['id'] for row in rows}
          managed_provider_ids = {row['provider_id'] for row in catalog['managed_providers']}
          assert manifest['connector_count'] == len(rows)
          assert manifest['enabled_connector_count'] == len(enabled_rows)
          assert manifest['required_secret_environment_variables'] == expected_secrets
          assert catalog['schema_version'] == 'api-catalog-v3'
          assert catalog['connector_count'] == manifest['connector_count']
          assert catalog['enabled_connector_count'] == manifest['enabled_connector_count']
          assert catalog['managed_provider_count'] == 13
          assert catalog['enabled_managed_provider_count'] == 13
          assert managed_provider_ids == {
              'bigquery', 'earth-engine', 'data-commons', 'akshare', 'ashare',
              'aifin-market', 'yuandian-law', 'tianyancha', 'miaoxiang',
              'jina-reader', 'exa', 'tavily', 'firecrawl'
          }
          assert 'qichacha' not in managed_provider_ids
          assert sum(len(row['operations']) for row in catalog['managed_providers']) == 114
          assert catalog['exposed_parameter_count'] == 714
          assert google_providers['required_secret_environment_variables'] == ['GOOGLE_CREDENTIALS_JSON']
          assert google_providers['secret_values_exposed'] is False
          assert {row['provider_id'] for row in google_providers['providers']} == {
              'bigquery', 'earth-engine', 'data-commons'
          }
          assert all(
              row['required_secret_environment_variable'] == 'GOOGLE_CREDENTIALS_JSON'
              for row in google_providers['providers']
          )
          assert commercial_providers['secret_values_exposed'] is False
          commercial_map = {row['provider_id']: row for row in commercial_providers['providers']}
          assert set(commercial_map) == {'tianyancha', 'miaoxiang'}
          assert commercial_map['miaoxiang'] == miaoxiang_local['providers'][0]
          assert web_providers['secret_values_exposed'] is False
          web_map = {row['provider_id']: row for row in web_providers['providers']}
          assert set(web_map) == {'jina-reader', 'exa', 'tavily', 'firecrawl'}
          assert web_map['tavily']['required_secret_environment_variable'] == 'TAVILY_API_KEY'
          assert web_map['firecrawl']['required_secret_environment_variable'] == 'FIRECRAWL_API_KEY'
          assert len(validation['endpoints']) == len(enabled_rows)
          assert {
              'newsapi-everything', 'newsapi-top-headlines', 'newsapi-sources',
              'openmeteo-forecast', 'baidu-geocode', 'baidu-place-search',
              'baidu-direction-driving',
          }.issubset(connector_ids)
          print(json.dumps({
              'status': 'PASS',
              'connectors': manifest['connector_count'],
              'enabled': manifest['enabled_connector_count'],
              'routes': len(validation['endpoints']),
              'managed_providers': 13,
              'managed_operations': 114,
              'exposed_parameters': catalog['exposed_parameter_count'],
          }))
          PY

      - name: Upload safe catalog and generated gateway evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpts-api-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/catalog-metadata.json
            api-center/connector-manifest.json
            api-center/krakend.tmpl
            api-center/krakend.validation.json
            api-center/google-cloud/provider-catalog.json
            api-center/google-cloud/china-topic-packs.json
            api-center/data-commons/provider-catalog.json
            api-center/data-commons/china-starter-pack.json
            api-center/akshare/provider-catalog.json
            api-center/aifin-market/provider-catalog.json
            api-center/yuandian/provider-catalog.json
            api-center/yuandian/readonly-apis.snapshot.json
            api-center/company-intelligence/provider-catalog.json
            api-center/company-intelligence/ticket.schema.json
            api-center/miaoxiang/provider-catalog.json
            api-center/miaoxiang/ticket.schema.json
            api-center/web-retrieval/provider-catalog.json
            api-center/web-retrieval/ticket.schema.json
            api-center/web-retrieval/context-ticket.schema.json
          if-no-files-found: error
          retention-days: 30
