name: Validate GPTs Intelligence Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "api-center/**/requirements.txt"

      - name: Install every managed-provider dependency set
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          requirements = sorted(Path('api-center').glob('**/requirements.txt'))
          command = [
              sys.executable, '-m', 'pip', 'install',
              '--disable-pip-version-check', '--no-input',
          ]
          for path in requirements:
              command.extend(['-r', str(path)])
          subprocess.run(command, check=True)
          PY
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Compile and run every provider regression suite
        run: |
          set -euo pipefail
          python -m compileall -q api-center
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          test_roots = [Path('api-center/tests')]
          test_roots.extend(sorted(Path('api-center').glob('*/tests')))
          seen = set()
          for root in test_roots:
              key = str(root.resolve())
              if key in seen or not root.is_dir():
                  continue
              seen.add(key)
              subprocess.run(
                  [sys.executable, '-m', 'unittest', 'discover', '-s', str(root), '-p', 'test_*.py', '-v'],
                  check=True,
              )
          PY

      - name: Rebuild deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          cmp /tmp/committed-api-catalog.json api-center/api-catalog.json
          cmp /tmp/committed-api-catalog.md api-center/api-catalog.md
          cmp /tmp/committed-connector-manifest.json api-center/connector-manifest.json
          cmp /tmp/committed-krakend.validation.json api-center/krakend.validation.json
          cmp /tmp/committed-krakend.tmpl api-center/krakend.tmpl

      - name: Verify catalog and GBIF safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}

          assert manifest['connector_count'] == manifest['enabled_connector_count'] == 68
          assert sum(row['id'].startswith('worldbank-') for row in manifest['connectors']) == 9
          assert catalog['managed_provider_count'] == len(providers) == 39
          assert catalog['enabled_managed_provider_count'] == 39
          assert catalog['managed_operation_count'] == sum(len(row['operations']) for row in providers.values()) == 430
          assert catalog['center_display_name_zh'] == '情报中心'
          assert catalog['center_display_name_en'] == 'Intelligence Center'
          assert catalog['secret_values_exposed'] is False
          assert all(row['enabled'] is True for row in providers.values())
          assert all(row['secret_value_exposed'] is False for row in providers.values())
          assert 'agent-toolbelt' not in providers
          assert 'gapup-mcp' not in providers

          gbif = providers['gbif']
          assert gbif['ticket_prefix'] == '[intel-gbif]'
          assert gbif['required_secret_environment_variable_name'] == ''
          assert len(gbif['operations']) == 10
          assert gbif['limits']['fixed_api_host'] == 'api.gbif.org'
          assert gbif['limits']['requests_per_ticket_max'] == 1
          assert gbif['limits']['occurrence_page_size_max'] == 300
          assert gbif['limits']['search_offset_plus_limit_max'] == 100000
          assert gbif['limits']['automatic_pagination_allowed'] is False
          assert gbif['limits']['authenticated_occurrence_downloads_allowed'] is False
          assert gbif['limits']['bulk_download_allowed'] is False
          assert gbif['limits']['experimental_endpoints_allowed'] is False
          assert gbif['limits']['write_operations_allowed'] is False

          print(json.dumps({
              'status': 'PASS',
              'connectors': 68,
              'managed_providers': 39,
              'managed_operations': 430,
              'gbif_operations': 10,
          }))
          PY
          git diff --check

      - name: Upload validated catalog evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/connector-manifest.json
          if-no-files-found: error
          retention-days: 30
