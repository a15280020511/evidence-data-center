name: Validate GPTs Intelligence Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/baostock/requirements.txt
            api-center/eodhd/requirements.txt
            api-center/data-commons/requirements.txt
            api-center/qweather/requirements.txt
            api-center/xweather/requirements.txt
            api-center/miaoxiang-mcp/requirements.txt
            api-center/browserless/requirements.txt
            api-center/east-asia-econ/requirements.txt
            api-center/alpha-vantage/requirements.txt
            api-center/overture-maps/requirements.txt
            api-center/oecd/requirements.txt
            api-center/alphafeed/requirements.txt
            api-center/who-gho/requirements.txt
            api-center/mediastack/requirements.txt
            api-center/statistics-of-the-world/requirements.txt
            api-center/aisstream/requirements.txt
            api-center/internet-archive/requirements.txt
            api-center/marketstack/requirements.txt
            api-center/nasa/requirements.txt
            api-center/metno-geosatellite/requirements.txt

      - name: Install isolated intelligence dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/baostock/requirements.txt \
            -r api-center/eodhd/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/qweather/requirements.txt \
            -r api-center/xweather/requirements.txt \
            -r api-center/miaoxiang-mcp/requirements.txt \
            -r api-center/browserless/requirements.txt \
            -r api-center/east-asia-econ/requirements.txt \
            -r api-center/alpha-vantage/requirements.txt \
            -r api-center/overture-maps/requirements.txt \
            -r api-center/oecd/requirements.txt \
            -r api-center/alphafeed/requirements.txt \
            -r api-center/who-gho/requirements.txt \
            -r api-center/mediastack/requirements.txt \
            -r api-center/statistics-of-the-world/requirements.txt \
            -r api-center/aisstream/requirements.txt \
            -r api-center/internet-archive/requirements.txt \
            -r api-center/marketstack/requirements.txt \
            -r api-center/nasa/requirements.txt \
            -r api-center/metno-geosatellite/requirements.txt
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Compile and run provider regressions
        run: |
          set -euo pipefail
          python -m compileall -q api-center
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/eodhd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/data-commons/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/qweather/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/xweather/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/miaoxiang-mcp/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/browserless/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/east-asia-econ/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/alpha-vantage/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/overture-maps/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/oecd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/alphafeed/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/who-gho/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/mediastack/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/statistics-of-the-world/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/aisstream/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/internet-archive/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/marketstack/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/nasa/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/metno-geosatellite/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v

      - name: Rebuild deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          cmp /tmp/committed-api-catalog.json api-center/api-catalog.json
          cmp /tmp/committed-api-catalog.md api-center/api-catalog.md
          cmp /tmp/committed-connector-manifest.json api-center/connector-manifest.json
          cmp /tmp/committed-krakend.validation.json api-center/krakend.validation.json
          cmp /tmp/committed-krakend.tmpl api-center/krakend.tmpl

      - name: Verify provider and World Bank invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          connectors = manifest['connectors']

          assert manifest['connector_count'] == manifest['enabled_connector_count'] == 68
          assert sum(row['id'].startswith('worldbank-') for row in connectors) == 9
          assert catalog['managed_provider_count'] == len(providers) == 37
          assert catalog['enabled_managed_provider_count'] == 37
          assert catalog['managed_operation_count'] == sum(
              len(row['operations']) for row in providers.values()
          ) == 413
          assert catalog['center_display_name_zh'] == '情报中心'
          assert catalog['center_display_name_en'] == 'Intelligence Center'
          assert catalog['secret_values_exposed'] is False
          assert all(row['enabled'] is True for row in providers.values())
          assert all(row['secret_value_exposed'] is False for row in providers.values())
          assert 'agent-toolbelt' not in providers
          assert 'gapup-mcp' not in providers

          overture = providers['overture-maps']
          assert overture['ticket_prefix'] == '[api-overture]'
          assert overture['required_secret_environment_variable_name'] == ''
          assert len(overture['operations']) == 7
          assert overture['limits']['whole_world_download_allowed'] is False

          oecd = providers['oecd']
          assert oecd['ticket_prefix'] == '[api-oecd]'
          assert oecd['required_secret_environment_variable_name'] == ''
          assert len(oecd['operations']) == 6
          assert oecd['limits']['fixed_api_host'] == 'sdmx.oecd.org'

          alphafeed = providers['alphafeed']
          assert alphafeed['ticket_prefix'] == '[api-alphafeed]'
          assert alphafeed['required_secret_environment_variable_name'] == 'ALPHAFEED_API_KEY'
          assert len(alphafeed['operations']) == 10
          assert alphafeed['limits']['trading_or_order_execution_allowed'] is False

          xweather = providers['xweather']
          assert xweather['ticket_prefix'] == '[api-xweather]'
          assert xweather['required_secret_environment_variable_name'] == 'XWEATHER_CLIENT_SECRET'
          assert xweather['required_repository_variable'] == 'XWEATHER_CLIENT_ID'
          assert len(xweather['operations']) == 10
          assert xweather['limits']['write_operations_allowed'] is False

          who = providers['who-gho-odata']
          assert who['ticket_prefix'] == '[intel-who-gho]'
          assert who['required_secret_environment_variable_name'] == ''
          assert len(who['operations']) == 8
          assert who['limits']['legacy_endpoint_migration_watch_required'] is True

          mediastack = providers['mediastack']
          assert mediastack['ticket_prefix'] == '[intel-mediastack]'
          assert mediastack['required_secret_environment_variable_name'] == 'MEDIASTACK_API_KEY'
          assert len(mediastack['operations']) == 5
          assert mediastack['limits']['write_operations_allowed'] is False

          sotw = providers['statistics-of-the-world']
          assert sotw['ticket_prefix'] == '[intel-sotw]'
          assert sotw['required_secret_environment_variable_name'] == ''
          assert len(sotw['operations']) == 11
          assert sotw['limits']['bulk_download_allowed'] is False
          assert sotw['limits']['write_operations_allowed'] is False

          marketstack = providers['marketstack']
          assert marketstack['ticket_prefix'] == '[intel-marketstack]'
          assert marketstack['required_secret_environment_variable_name'] == 'MARKETSTACK_ACCESS_KEY'
          assert len(marketstack['operations']) == 11
          assert marketstack['limits']['requests_per_ticket_max'] == 1
          assert marketstack['limits']['free_plan_requests_per_month'] == 100
          assert marketstack['limits']['historical_span_days_max'] == 366
          assert marketstack['limits']['automatic_pagination_allowed'] is False
          assert marketstack['limits']['intraday_or_realtime_operations_allowed'] is False
          assert marketstack['limits']['write_operations_allowed'] is False

          nasa = providers['nasa']
          assert nasa['ticket_prefix'] == '[intel-nasa]'
          assert nasa['required_secret_environment_variable_name'] == 'NASA_API_KEY'
          assert len(nasa['operations']) == 25
          assert nasa['limits']['requests_per_ticket_max'] == 1
          assert nasa['limits']['neo_feed_span_days_max'] == 7
          assert nasa['limits']['donki_date_span_days_max'] == 31
          assert nasa['limits']['gibs_tiles_per_ticket_max'] == 1
          assert nasa['limits']['bulk_download_allowed'] is False
          assert nasa['limits']['archived_earth_api_allowed'] is False
          assert nasa['limits']['archived_mars_rover_api_allowed'] is False
          assert nasa['limits']['write_operations_allowed'] is False

          metno = providers['metno-geosatellite']
          assert metno['ticket_prefix'] == '[intel-metno-geosatellite]'
          assert metno['required_secret_environment_variable_name'] == ''
          assert len(metno['operations']) == 4
          assert metno['limits']['requests_per_ticket_max'] == 1
          assert metno['limits']['fixed_api_host'] == 'api.met.no'
          assert metno['limits']['small_size_images_allowed'] is False
          assert metno['limits']['unfiltered_availability_listing_allowed'] is False
          assert metno['limits']['bulk_download_allowed'] is False
          assert metno['limits']['write_operations_allowed'] is False

          aisstream = providers['aisstream']
          assert aisstream['ticket_prefix'] == '[intel-aisstream]'
          assert aisstream['required_secret_environment_variable_name'] == 'AISSTREAM_API_KEY'
          assert len(aisstream['operations']) == 4
          assert aisstream['limits']['connections_per_ticket_max'] == 1
          assert aisstream['limits']['worldwide_subscription_allowed'] is False
          assert aisstream['limits']['background_streaming_allowed'] is False
          assert aisstream['limits']['write_operations_allowed'] is False

          internet_archive = providers['internet-archive']
          assert internet_archive['ticket_prefix'] == '[intel-internet-archive]'
          assert internet_archive['required_secret_environment_variable_name'] == ''
          assert len(internet_archive['operations']) == 6
          assert internet_archive['limits']['file_downloads_allowed'] is False
          assert internet_archive['limits']['archived_page_body_fetching_allowed'] is False
          assert internet_archive['limits']['uploads_allowed'] is False
          assert internet_archive['limits']['write_operations_allowed'] is False

          print(json.dumps({
              'status': 'PASS',
              'connectors': 68,
              'worldbank_connectors': 9,
              'managed_providers': 37,
              'managed_operations': 413,
              'overture_maps_operations': 7,
              'oecd_operations': 6,
              'alphafeed_operations': 10,
              'xweather_operations': 10,
              'who_gho_operations': 8,
              'mediastack_operations': 5,
              'statistics_of_the_world_operations': 11,
              'aisstream_operations': 4,
              'internet_archive_operations': 6,
              'marketstack_operations': 11,
              'nasa_operations': 25,
              'metno_geosatellite_operations': 4,
              'removed_providers': ['agent-toolbelt', 'gapup-mcp'],
          }))
          PY
          git diff --check

      - name: Upload safe intelligence catalog evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpts-intelligence-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/catalog-metadata.json
            api-center/connector-manifest.json
            api-center/krakend.validation.json
            api-center/krakend.tmpl
          if-no-files-found: error
          retention-days: 30
