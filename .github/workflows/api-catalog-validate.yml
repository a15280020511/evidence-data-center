name: Validate GPTs API Catalog

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/baostock/requirements.txt
            api-center/eodhd/requirements.txt
            api-center/data-commons/requirements.txt
            api-center/qweather/requirements.txt
            api-center/miaoxiang-mcp/requirements.txt
            api-center/browserless/requirements.txt

      - name: Install isolated API dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/baostock/requirements.txt \
            -r api-center/eodhd/requirements.txt \
            -r api-center/data-commons/requirements.txt \
            -r api-center/qweather/requirements.txt \
            -r api-center/miaoxiang-mcp/requirements.txt \
            -r api-center/browserless/requirements.txt
          python -m pip check

      - name: Preserve committed generated contracts
        run: |
          cp api-center/api-catalog.json /tmp/committed-api-catalog.json
          cp api-center/api-catalog.md /tmp/committed-api-catalog.md
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl

      - name: Rebuild and run API-center tests
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_config.py \
            api-center/build_catalog.py \
            api-center/build_catalog_market_search.py \
            api-center/baostock/baostock_task.py \
            api-center/baostock/tests/*.py \
            api-center/eodhd/eodhd_task.py \
            api-center/eodhd/tests/*.py \
            api-center/data-commons/data_commons_task.py \
            api-center/data-commons/tests/*.py \
            api-center/qweather/qweather_task.py \
            api-center/qweather/tests/*.py \
            api-center/miaoxiang-mcp/miaoxiang_mcp_task.py \
            api-center/miaoxiang-mcp/tests/*.py \
            api-center/browserless/browserless_task.py \
            api-center/browserless/tests/*.py \
            api-center/tests/*.py
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/baostock/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/eodhd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/data-commons/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/qweather/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/miaoxiang-mcp/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/browserless/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v

      - name: Verify deterministic contracts and provider invariants
        run: |
          set -euo pipefail
          cmp /tmp/committed-api-catalog.json api-center/api-catalog.json
          cmp /tmp/committed-api-catalog.md api-center/api-catalog.md
          cmp /tmp/committed-connector-manifest.json api-center/connector-manifest.json
          cmp /tmp/committed-krakend.validation.json api-center/krakend.validation.json
          cmp /tmp/committed-krakend.tmpl api-center/krakend.tmpl
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('api-center/connector-manifest.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          expected_counts = {
              'bigquery': 7,
              'earth-engine': 6,
              'data-commons': 5,
              'qweather': 18,
              'akshare': 17,
              'ashare': 1,
              'aifin-market': 17,
              'yuandian-law': 40,
              'tianyancha': 3,
              'miaoxiang': 4,
              'miaoxiang-mcp': 13,
              'jina-reader': 2,
              'exa': 3,
              'tavily': 5,
              'firecrawl': 4,
              'browserless': 8,
              'tickflow': 5,
              'serpapi': 4,
              'tushare': 20,
              'baostock': 20,
              'eodhd': 25,
              'wolfram-alpha': 4,
              'llamaparse': 3,
          }
          assert manifest['connector_count'] == 68
          assert manifest['enabled_connector_count'] == 68
          assert catalog['schema_version'] == 'api-catalog-v3'
          assert catalog['managed_provider_count'] == 23
          assert catalog['enabled_managed_provider_count'] == 23
          assert catalog['managed_operation_count'] == 234
          assert catalog['secret_values_exposed'] is False
          assert set(providers) == set(expected_counts)
          assert sum(len(row['operations']) for row in providers.values()) == 234
          for provider_id, count in expected_counts.items():
              assert len(providers[provider_id]['operations']) == count
              assert providers[provider_id]['secret_value_exposed'] is False

          data_commons = providers['data-commons']
          assert data_commons['ticket_prefix'] == '[api-dc]'
          assert data_commons['required_secret_environment_variable_name'] == 'GOOGLE_DATA_COMMONS_API_KEY'
          assert data_commons['limits']['requests_per_ticket_max'] == 1
          assert data_commons['limits']['arbitrary_urls_allowed'] is False
          assert data_commons['limits']['arbitrary_endpoints_allowed'] is False
          assert data_commons['limits']['arbitrary_headers_allowed'] is False
          assert data_commons['limits']['client_supplied_api_key_allowed'] is False
          assert data_commons['limits']['sparql_allowed'] is False
          assert data_commons['limits']['natural_language_api_allowed'] is False
          assert data_commons['limits']['mcp_allowed'] is False
          assert data_commons['limits']['write_operations_allowed'] is False
          assert data_commons['limits']['personal_data_allowed'] is False

          qweather = providers['qweather']
          assert qweather['ticket_prefix'] == '[api-qweather]'
          assert qweather['required_secret_environment_variable_name'] == 'QWEATHER_API_KEY'
          assert qweather['limits']['fixed_api_host'] == 'ka6r72kcc3.re.qweatherapi.com'
          assert qweather['limits']['arbitrary_urls_allowed'] is False
          assert qweather['limits']['arbitrary_hosts_allowed'] is False
          assert qweather['limits']['arbitrary_paths_allowed'] is False
          assert qweather['limits']['arbitrary_headers_allowed'] is False
          assert qweather['limits']['client_supplied_api_key_allowed'] is False
          assert qweather['limits']['redirects_allowed'] is False
          assert qweather['limits']['write_operations_allowed'] is False

          miaoxiang_mcp = providers['miaoxiang-mcp']
          assert miaoxiang_mcp['ticket_prefix'] == '[api-mx-mcp]'
          assert miaoxiang_mcp['required_secret_environment_variable_name'] == 'EM_API_KEY'
          assert miaoxiang_mcp['limits']['fixed_mcp_host'] == 'mxapi.eastmoney.com'
          assert miaoxiang_mcp['limits']['fixed_mcp_path'] == '/mxds/mcp'
          assert miaoxiang_mcp['limits']['fixed_mcp_tool_count'] == 11
          assert miaoxiang_mcp['limits']['arbitrary_urls_allowed'] is False
          assert miaoxiang_mcp['limits']['arbitrary_hosts_allowed'] is False
          assert miaoxiang_mcp['limits']['arbitrary_headers_allowed'] is False
          assert miaoxiang_mcp['limits']['client_supplied_api_key_allowed'] is False
          assert miaoxiang_mcp['limits']['arbitrary_jsonrpc_methods_allowed'] is False
          assert miaoxiang_mcp['limits']['arbitrary_mcp_tool_names_allowed'] is False
          assert miaoxiang_mcp['limits']['resources_allowed'] is False
          assert miaoxiang_mcp['limits']['prompts_allowed'] is False
          assert miaoxiang_mcp['limits']['write_operations_allowed'] is False
          assert miaoxiang_mcp['limits']['trading_or_order_execution_allowed'] is False

          browserless = providers['browserless']
          assert browserless['ticket_prefix'] == '[api-browserless]'
          assert browserless['required_secret_environment_variable_name'] == 'BROWSERLESS_TOKEN'
          assert browserless['limits']['fixed_api_host'] == 'production-sfo.browserless.io'
          assert browserless['limits']['arbitrary_api_hosts_allowed'] is False
          assert browserless['limits']['arbitrary_code_allowed'] is False
          assert browserless['limits']['websocket_sessions_allowed'] is False
          assert browserless['limits']['profiles_allowed'] is False
          assert browserless['limits']['custom_headers_allowed'] is False
          assert browserless['limits']['cookies_allowed'] is False
          assert browserless['limits']['proxy_configuration_allowed'] is False
          assert browserless['limits']['captcha_or_unblock_allowed'] is False
          assert browserless['limits']['write_operations_allowed'] is False

          baostock = providers['baostock']
          assert baostock['ticket_prefix'] == '[api-baostock]'
          assert baostock['required_secret_environment_variable_name'] == ''
          assert baostock['limits']['credentials_required'] is False
          assert baostock['limits']['arbitrary_functions_allowed'] is False
          assert baostock['limits']['arbitrary_hosts_allowed'] is False
          assert baostock['limits']['write_operations_allowed'] is False
          assert baostock['limits']['trading_or_order_execution_allowed'] is False

          eodhd = providers['eodhd']
          assert eodhd['ticket_prefix'] == '[api-eodhd]'
          assert eodhd['required_secret_environment_variable_name'] == 'EODHD_API_TOKEN'
          assert eodhd['limits']['arbitrary_urls_allowed'] is False
          assert eodhd['limits']['arbitrary_paths_allowed'] is False
          assert eodhd['limits']['arbitrary_headers_allowed'] is False
          assert eodhd['limits']['client_supplied_token_allowed'] is False
          assert eodhd['limits']['websocket_allowed'] is False
          assert eodhd['limits']['write_operations_allowed'] is False
          assert eodhd['limits']['trading_or_order_execution_allowed'] is False

          for path in (
              'baostock/provider-catalog.json',
              'eodhd/provider-catalog.json',
              'data-commons/provider-catalog.json',
              'qweather/provider-catalog.json',
              'miaoxiang-mcp/provider-catalog.json',
              'web-retrieval/provider-catalog.json',
          ):
              assert path in catalog['managed_provider_catalog_files']
              assert path in catalog['detail_reading_order']

          serialized_dc = json.dumps(data_commons, ensure_ascii=False)
          assert 'GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON' not in serialized_dc
          assert 'data_commons_api_key' not in serialized_dc
          serialized_mcp = json.dumps(miaoxiang_mcp, ensure_ascii=False)
          assert 'MX_APIKEY' not in serialized_mcp
          assert 'mkt_' not in serialized_mcp
          serialized_browserless = json.dumps(browserless, ensure_ascii=False)
          assert 'browserless_token' not in serialized_browserless.lower()
          print(json.dumps({
              'status': 'PASS',
              'connectors': 68,
              'managed_providers': 23,
              'managed_operations': 234,
              'browserless_operations': 8,
              'qweather_operations': 18,
              'miaoxiang_mcp_operations': 13,
              'miaoxiang_mcp_tools': 11,
              'miaoxiang_mcp_secret': 'EM_API_KEY',
          }))
          PY
          git diff --check

      - name: Upload safe catalog and generated gateway evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpts-api-catalog-${{ github.run_id }}
          path: |
            api-center/api-catalog.json
            api-center/api-catalog.md
            api-center/catalog-metadata.json
            api-center/connector-manifest.json
            api-center/krakend.tmpl
            api-center/krakend.validation.json
            api-center/google-cloud/provider-catalog.json
            api-center/data-commons/provider-catalog.json
            api-center/data-commons/ticket.schema.json
            api-center/data-commons/china-starter-pack.json
            api-center/qweather/provider-catalog.json
            api-center/qweather/ticket.schema.json
            api-center/miaoxiang-mcp/provider-catalog.json
            api-center/miaoxiang-mcp/ticket.schema.json
            api-center/miaoxiang-mcp/tool-discovery-snapshot.json
            api-center/browserless/ticket.schema.json
            api-center/akshare/provider-catalog.json
            api-center/aifin-market/provider-catalog.json
            api-center/yuandian/provider-catalog.json
            api-center/company-intelligence/provider-catalog.json
            api-center/miaoxiang/provider-catalog.json
            api-center/web-retrieval/provider-catalog.json
            api-center/market-search/provider-catalog.json
            api-center/tushare/provider-catalog.json
            api-center/baostock/provider-catalog.json
            api-center/baostock/ticket.schema.json
            api-center/eodhd/provider-catalog.json
            api-center/eodhd/ticket.schema.json
            api-center/knowledge-tools/provider-catalog.json
            api-center/knowledge-tools/ticket.schema.json
          if-no-files-found: error
          retention-days: 30
