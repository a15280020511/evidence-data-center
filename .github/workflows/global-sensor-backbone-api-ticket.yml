name: Global Sensor Backbone Intelligence Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-global-sensor-global
  cancel-in-progress: false

jobs:
  execute-global-sensor:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-global-sensor]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-sensor-backbone/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-sensor-backbone/requirements.txt
          python -m pip check

      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/global-sensor-backbone/global_sensor_backbone_task.py

      - name: Parse and authorize global sensor ticket
        id: prepare
        continue-on-error: true
        run: python api-center/global-sensor-backbone/global_sensor_backbone_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir global-sensor-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/global-sensor-backbone/global_sensor_backbone_task.py render --output-dir global-sensor-artifacts --phase accepted > global-sensor-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@global-sensor-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/global-sensor-backbone/global_sensor_backbone_task.py render --output-dir global-sensor-artifacts --phase rejected > global-sensor-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@global-sensor-comment.md

      - name: Execute one bounded global sensor request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/global-sensor-backbone/global_sensor_backbone_task.py execute --ticket global-sensor-artifacts/ticket.json --output-dir global-sensor-artifacts

      - name: Upload global sensor evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-sensor-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: global-sensor-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/global-sensor-backbone/global_sensor_backbone_task.py render --output-dir global-sensor-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > global-sensor-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@global-sensor-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_GLOBAL_SENSOR_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
