name: Bootstrap Alpha Vantage Integration

on:
  push:
    branches:
      - feat/alpha-vantage-api-center
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.head_commit.message != 'chore: regenerate Alpha Vantage integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore verified one-shot integrator
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          chunks = sorted(Path('tools/alpha-vantage-bootstrap').glob('chunk-*.txt'))
          assert len(chunks) == 5, chunks
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          content = zlib.decompress(base64.b64decode(encoded))
          expected = '74e04e0b4abcac7aa30842c9a94217775284a09e3cb8b39e7baa94470b535bbe'
          assert hashlib.sha256(content).hexdigest() == expected
          Path('tools/integrate_alpha_vantage.py').write_bytes(content)
          PY

      - name: Install catalog and provider dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            requests==2.34.2
          python -m pip check

      - name: Generate provider, tests, workflows, and unified catalog
        run: python tools/integrate_alpha_vantage.py

      - name: Stage generated workflow definitions outside protected path
        run: |
          mkdir -p api-center/alpha-vantage/workflow-staging
          cp .github/workflows/api-catalog-validate.yml api-center/alpha-vantage/workflow-staging/api-catalog-validate.yml
          cp .github/workflows/alpha-vantage-api-ticket.yml api-center/alpha-vantage/workflow-staging/alpha-vantage-api-ticket.yml
          cp .github/workflows/alpha-vantage-provider-validate.yml api-center/alpha-vantage/workflow-staging/alpha-vantage-provider-validate.yml
          git checkout -- .github/workflows

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center
          if git diff --cached --quiet; then
            echo "Integration already generated."
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: regenerate Alpha Vantage integration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
