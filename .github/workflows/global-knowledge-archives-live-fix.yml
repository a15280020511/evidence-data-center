name: Repair Global Knowledge Live Acceptance

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-global-knowledge-live-acceptance
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'feat/global-knowledge-archives-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/global-knowledge-archives-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply live acceptance findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          matrix_path=Path('api-center/global-knowledge-archives/source-access-matrix.json')
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          sources=[]
          for row in matrix['sources']:
              source_id=row.get('source_id')
              if source_id in {'theses-fr','oapen-oai'}:
                  continue
              if source_id=='trove':
                  row['credential_mode']='required_free_key'
                  row['cost']='free registration key required by the current production endpoint'
              sources.append(row)
          matrix['sources']=sources
          matrix['active_source_count']=len(sources)
          deferred={row.get('source_id') for row in matrix['not_enabled']}
          if 'theses-fr' not in deferred:
              matrix['not_enabled'].append({
                  'source_id':'theses-fr',
                  'reason':'The official service and API documentation were confirmed, but the HTTPS API endpoint failed a bounded 60-second production connect acceptance on 2026-08-03. Direct activation is deferred until the endpoint is reliably reachable from the execution platform.',
              })
          if 'oapen-oai' not in deferred:
              matrix['not_enabled'].append({
                  'source_id':'oapen-oai',
                  'reason':'The documented OAI endpoint closed the connection without returning an Identify response during the bounded production acceptance on 2026-08-03. DOAB remains active for open-book discovery; OAPEN is deferred until a current stable endpoint is verified.',
              })
          matrix_path.write_text(json.dumps(matrix,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          provider_path=Path('api-center/global-knowledge-archives/provider-catalog.json')
          provider_doc=json.loads(provider_path.read_text(encoding='utf-8'))
          provider=provider_doc['providers'][0]
          provider['limits']['source_count']=20
          provider['catalog_policy']=provider['catalog_policy'].replace('22个固定HTTPS来源','20个固定HTTPS来源')
          for operation in provider['operations']:
              operation_id=operation['operation_id']
              if operation_id=='knowledge-search':
                  enum=operation['parameter_schema']['properties']['source_id']['enum']
                  operation['parameter_schema']['properties']['source_id']['enum']=[x for x in enum if x!='theses-fr']
              if operation_id in {'oai-identify','oai-list-records','oai-get-record'}:
                  enum=operation['parameter_schema']['properties']['source_id']['enum']
                  operation['parameter_schema']['properties']['source_id']['enum']=[x for x in enum if x!='oapen-oai']
          provider_path.write_text(json.dumps(provider_doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          runtime_path=Path('api-center/global-knowledge-archives/global_knowledge_archives_task.py')
          runtime=runtime_path.read_text(encoding='utf-8')
          runtime=runtime.replace(
              '    if source_id == "theses-fr":\n        url = "https://theses.fr/api/v1/recherche/"\n        query += [("q", query_text), ("debut", "0"), ("nombre", str(limit))]\n    elif source_id == "eric":\n',
              '    if source_id == "eric":\n',
          )
          runtime_path.write_text(runtime,encoding='utf-8')

          validator_path=Path('api-center/global-knowledge-archives/validate_global_knowledge_archives.py')
          validator=validator_path.read_text(encoding='utf-8')
          validator=validator.replace('== 22\n', '== 20\n')
          validator=validator.replace('    "theses-fr": ("knowledge-search", {"source_id": "theses-fr", "query": "intelligence artificielle", "limit": 2}),\n', '')
          validator=validator.replace('    "trove": ("knowledge-search", {"source_id": "trove", "query": "economic history", "limit": 2}),\n', '')
          validator=validator.replace('    "oapen-oai": ("oai-identify", {"source_id": "oapen-oai"}),\n', '')
          marker='KEY_CASES = {\n'
          validator=validator.replace(
              marker,
              marker+'    "trove": ("TROVE_API_KEY", "knowledge-search", {"source_id": "trove", "query": "economic history", "limit": 2}),\n',
          )
          validator_path.write_text(validator,encoding='utf-8')

          workflow_path=Path('.github/workflows/global-knowledge-archives-validate.yml')
          workflow=workflow_path.read_text(encoding='utf-8')
          workflow=workflow.replace("          assert receipt['source_count']==22\n", "          assert receipt['source_count']==20\n")
          workflow=workflow.replace('          - theses-fr\n', '')
          workflow=workflow.replace('          - trove\n', '')
          workflow=workflow.replace('          - oapen-oai\n', '')
          workflow=workflow.replace(
              '        source:\n          - google-books\n',
              '        source:\n          - trove\n          - google-books\n',
          )
          workflow=workflow.replace(
              '      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}\n',
              '      TROVE_API_KEY: ${{ secrets.TROVE_API_KEY }}\n      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}\n',
          )
          workflow_path.write_text(workflow,encoding='utf-8')
          PY
      - name: Rebuild catalog and validate repaired registry
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python api-center/build_catalog_market_search.py
          PYTHONPATH=api-center/global-knowledge-archives:api-center \
            python api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
              --output /tmp/global-knowledge-registry.json
          python -m unittest discover -s api-center/tests -p 'test_*.py'
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/global-knowledge-registry.json').read_text())
          matrix=json.loads(Path('api-center/global-knowledge-archives/source-access-matrix.json').read_text())
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          assert receipt['source_count']==20
          assert receipt['operation_count']==9
          assert matrix['active_source_count']==20
          assert any(row['source_id']=='theses-fr' for row in matrix['not_enabled'])
          assert any(row['source_id']=='oapen-oai' for row in matrix['not_enabled'])
          trove=next(row for row in matrix['sources'] if row['source_id']=='trove')
          assert trove['credential_mode']=='required_free_key'
          assert catalog['managed_provider_count']==60
          assert catalog['managed_operation_count']==665
          PY
          git diff --check
      - name: Commit repaired contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/global-knowledge-archives/source-access-matrix.json \
            api-center/global-knowledge-archives/provider-catalog.json \
            api-center/global-knowledge-archives/global_knowledge_archives_task.py \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
            .github/workflows/global-knowledge-archives-validate.yml \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m 'fix: require Trove key and defer unstable endpoints'
          git push origin HEAD:feat/global-knowledge-archives-20260803
