name: One-shot rebuild East Asia Econ catalog

on:
  pull_request:
    branches: [main]
    paths:
      - "api-center/east-asia-econ/provider-catalog.json"
      - ".github/workflows/one-shot-rebuild-east-asia-econ-catalog.yml"

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.ref == 'fix/east-asia-econ-region-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/east-asia-econ-region-code
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/east-asia-econ/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/east-asia-econ/requirements.txt
          python -m pip check

      - name: Rebuild deterministic catalog and test
        run: |
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/east-asia-econ/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          git diff --check

      - name: Commit regenerated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md
          git diff --cached --check
          git commit -m "fix: regenerate East Asia Econ region contract"
          git push origin HEAD:fix/east-asia-econ-region-code
