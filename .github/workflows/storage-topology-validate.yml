name: Validate Governance-Owned Storage Topology

on:
  pull_request:
    paths:
      - "api-center/huggingface/**"
      - "api-center/cloudflare/**"
      - ".github/workflows/hf-*.yml"
      - ".github/workflows/cloudflare-*.yml"
      - ".github/workflows/compute-material-packager.yml"
      - ".github/workflows/storage-topology-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/**"
      - "api-center/cloudflare/**"
      - ".github/workflows/hf-*.yml"
      - ".github/workflows/cloudflare-*.yml"
      - ".github/workflows/compute-material-packager.yml"
      - ".github/workflows/storage-topology-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-storage-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
      HF_NUMERIC_BASELINE_DATASET_REPO: ""
      HF_DOMAIN_BENCHMARK_DATASET_REPO: ""
      HF_EXTERNAL_REALITY_DATASET_REPO: ""
      HF_CLOUDFLARE_DATASET_REPO: ""
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/cloudflare/requirements.txt
            api-center/huggingface/requirements-numeric-baseline.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/cloudflare/requirements.txt \
            -r api-center/huggingface/requirements-numeric-baseline.txt
          python -m pip check

      - name: Validate topology and fail-closed compiler entry
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/huggingface/validate_storage_topology.py \
            api-center/huggingface/build_governance_baseline_export.py \
            api-center/cloudflare/numeric-compiler/cloudflare_numeric_compiler_runtime.py
          python api-center/huggingface/validate_storage_topology.py \
            | tee storage-topology-receipt.json
          python -m unittest \
            api-center/huggingface/tests/test_governance_baseline_export.py \
            api-center/cloudflare/numeric-compiler/tests/test_governance_storage_boundary.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('storage-topology-receipt.json').read_text(encoding='utf-8'))
          assert row['status'] == 'EVIDENCE_STORAGE_TOPOLOGY_VALIDATED'
          assert row['private_huggingface_storage_in_evidence_center'] is False
          assert row['storage_gateway_owner'] == 'a15280020511/decision-system-governance'
          assert row['compute_direct_huggingface_access'] is False
          assert row['public_huggingface_provider_retained'] is True
          assert row['public_huggingface_authentication_used'] is False
          assert row['secret_values_exposed'] is False
          assert row['model_calls'] == 0
          PY
          git diff --check

      - name: Upload topology evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-storage-topology-${{ github.run_id }}
          path: storage-topology-receipt.json
          if-no-files-found: error
          retention-days: 30
