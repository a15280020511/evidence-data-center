name: PRC Justice Scheduled Self Iteration

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Iteration profile"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - daily
          - weekly
  pull_request:
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-self-iteration-policy.json"
      - "api-center/prc-legal-investigative-intelligence/prc_justice_self_iteration.py"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_self_iteration.py"
      - "api-center/prc-legal-investigative-intelligence/investigative-technology-intelligence-matrix.json"
      - "api-center/prc-legal-investigative-intelligence/case-derived-investigative-capability-ledger.json"
      - ".github/workflows/prc-justice-scheduled-self-iteration.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: prc-justice-self-iteration-${{ github.event_name == 'pull_request' && github.ref || 'scheduled-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  iterate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      GH_TOKEN: ${{ secrets.PRC_JUSTICE_AUTOMATION_TOKEN || github.token }}
      PROFILE: ${{ github.event.inputs.profile || 'auto' }}
      LEDGER: api-center/prc-legal-investigative-intelligence/case-derived-investigative-capability-ledger.json
      ITERATION_DIR: prc-justice-self-iteration-artifact
    steps:
      - name: Checkout current ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile and validate self-iteration contract
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/prc-legal-investigative-intelligence/prc_justice_self_iteration.py \
            api-center/prc-legal-investigative-intelligence/validate_prc_justice_self_iteration.py
          python api-center/prc-legal-investigative-intelligence/validate_prc_justice_self_iteration.py | tee prc-justice-self-iteration-validation.json
          python api-center/prc-legal-investigative-intelligence/prc_justice_self_iteration.py \
            --mode validate \
            --output-dir "$ITERATION_DIR"

      - name: Stop after zero-network validation on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python -m json.tool api-center/prc-legal-investigative-intelligence/prc-justice-self-iteration-policy.json >/dev/null
          python -m json.tool "$ITERATION_DIR/contract-validation.json" >/dev/null
          git diff --check

      - name: Run bounded live case learning
        id: live
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf "$ITERATION_DIR"
          python api-center/prc-legal-investigative-intelligence/prc_justice_self_iteration.py \
            --mode live \
            --profile "$PROFILE" \
            --write-ledger \
            --output-dir "$ITERATION_DIR" | tee prc-justice-self-iteration-run.json

      - name: Validate proposed ledger update
        if: github.event_name != 'pull_request' && steps.live.outcome == 'success'
        run: |
          set -euo pipefail
          python api-center/prc-legal-investigative-intelligence/validate_prc_justice_self_iteration.py
          python api-center/prc-legal-investigative-intelligence/validate_investigative_technology_learning.py
          (
            cd api-center/prc-legal-investigative-intelligence
            python validate_prc_legal_investigative.py
            python validate_prc_justice_complete_coverage.py
          )
          python api-center/validate_prc_compliance_policy.py
          python -m json.tool "$ITERATION_DIR/self-iteration-report.json" >/dev/null
          python -m json.tool "$ITERATION_DIR/new-observations.json" >/dev/null
          git diff --check

      - name: Read iteration gate
        id: gate
        if: github.event_name != 'pull_request' && steps.live.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path("prc-justice-self-iteration-artifact/self-iteration-report.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          print(f"changed={'true' if r.get('ledger_changed') else 'false'}")
          print(f"eligible={'true' if r.get('auto_merge_eligible') else 'false'}")
          print(f"review_count={int(r.get('review_candidate_count') or 0)}")
          print(f"new_count={int(r.get('new_observation_count') or 0)}")
          print(f"status={r.get('status')}")
          PY
          if git diff --quiet -- "$LEDGER"; then
            echo "git_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "git_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce ledger-only automatic write
        if: github.event_name != 'pull_request' && steps.live.outcome == 'success' && steps.gate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LEDGER"
          test "${{ steps.gate.outputs.git_changed }}" = "true"

      - name: Create auditable iteration PR
        id: pr
        if: github.event_name != 'pull_request' && steps.live.outcome == 'success' && steps.gate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/prc-justice-self-iteration-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$LEDGER"
          git commit -m "chore: absorb verified public PRC justice case observations"
          git push origin "$branch"
          cat > /tmp/pr-body.md <<EOF
          Automated bounded PRC justice self-iteration.

          - New public primary-source observations: ${{ steps.gate.outputs.new_count }}
          - Review-only candidates: ${{ steps.gate.outputs.review_count }}
          - Automatic merge eligible: ${{ steps.gate.outputs.eligible }}
          - Source policy: public/authorized primary sources only
          - No login, CAPTCHA/WAF bypass, hidden API reverse engineering, proxy rotation, secret operational detail, investigation evasion, anti-forensics, or personal targeting
          - Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This PR only changes the append-only case-derived capability ledger.
          EOF
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore: PRC justice case-learning iteration ${GITHUB_RUN_ID}" \
            --body-file /tmp/pr-body.md)"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch required validation checks on automation branch
        if: github.event_name != 'pull_request' && steps.pr.outputs.number != '' && steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.pr.outputs.branch }}"
          workflows=(
            prc-investigative-technology-learning-validate.yml
            prc-legal-investigative-validate.yml
            prc-compliance-policy-validate.yml
            repository-line-audit.yml
            evidence-standardization-validate.yml
            governance-topology-validate.yml
            api-center-validate.yml
            api-catalog-validate.yml
            codeql.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done
          printf '%s\n' "${workflows[@]}" > /tmp/dispatched-workflows.txt

      - name: Wait for dispatched validation checks
        if: github.event_name != 'pull_request' && steps.pr.outputs.number != '' && steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.pr.outputs.branch }}"
          head_sha="${{ steps.pr.outputs.head_sha }}"
          mapfile -t workflows < /tmp/dispatched-workflows.txt
          for workflow in "${workflows[@]}"; do
            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$branch" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,headSha,createdAt \
                --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 4
            done
            if [[ -z "$run_id" ]]; then
              echo "No dispatched run found for $workflow"
              exit 1
            fi
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          done

      - name: Merge verified iteration without branch-protection bypass
        if: github.event_name != 'pull_request' && steps.pr.outputs.number != '' && steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch

      - name: Record review-only candidates
        if: github.event_name != 'pull_request' && steps.live.outcome == 'success' && steps.gate.outputs.review_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          title="[prc-justice-self-iteration-review] public case candidates require review"
          body="Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} produced ${{ steps.gate.outputs.review_count }} review-only candidates. They were not auto-absorbed because they failed a deterministic primary-source, conflict, safety, date, or known-capability gate. Review the run artifact; do not bypass login/CAPTCHA/WAF or collect secret operational details."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Record live discovery failure
        if: github.event_name != 'pull_request' && steps.live.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          title="[prc-justice-self-iteration] scheduled discovery failed"
          body="Scheduled PRC justice self-iteration failed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The system did not modify the ledger. Check whether at least one of EXA_API_KEY/TAVILY_API_KEY is configured and whether the bounded public-source routes are healthy."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          exit 1

      - name: Upload self-iteration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prc-justice-self-iteration-${{ github.run_id }}
          path: |
            prc-justice-self-iteration-validation.json
            prc-justice-self-iteration-run.json
            prc-justice-self-iteration-artifact/
          if-no-files-found: warn
          retention-days: 45
