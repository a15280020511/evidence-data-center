name: PRC Justice Primary Signal Validate

on:
  pull_request:
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-primary-verification-policy.json"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-verified-signal-ledger.json"
      - "api-center/prc-legal-investigative-intelligence/verify_prc_justice_trend_signals.py"
      - "api-center/prc-legal-investigative-intelligence/build_prc_justice_trend_packets.py"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_primary_signal_verification.py"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-trend-source-plan.json"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-trend-storage-contract.json"
      - ".github/workflows/prc-justice-primary-signal-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate primary verification and append-only ledger
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/prc-legal-investigative-intelligence/verify_prc_justice_trend_signals.py \
            api-center/prc-legal-investigative-intelligence/build_prc_justice_trend_packets.py \
            api-center/prc-legal-investigative-intelligence/validate_prc_justice_primary_signal_verification.py
          python api-center/prc-legal-investigative-intelligence/validate_prc_justice_primary_signal_verification.py | tee prc-justice-primary-signal-validation.json
          python -m json.tool api-center/prc-legal-investigative-intelligence/prc-justice-primary-verification-policy.json >/dev/null
          python -m json.tool api-center/prc-legal-investigative-intelligence/prc-justice-verified-signal-ledger.json >/dev/null
          rm -rf prc-justice-primary-packet-validation
          python api-center/prc-legal-investigative-intelligence/build_prc_justice_trend_packets.py \
            --output-dir prc-justice-primary-packet-validation \
            --as-of 2026-08-07 | tee prc-justice-primary-packet-validation.json
          python -m json.tool prc-justice-primary-packet-validation/build-receipt.json >/dev/null
          git diff --check

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prc-justice-primary-signal-${{ github.run_id }}
          path: |
            prc-justice-primary-signal-validation.json
            prc-justice-primary-packet-validation.json
            prc-justice-primary-packet-validation/
          if-no-files-found: warn
          retention-days: 45
