name: One-shot Add Global Data Sources

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/scripts/add_global_data_sources.py"
      - ".github/workflows/temp-add-global-data-sources.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-add-global-data-sources-pr
  cancel-in-progress: true

jobs:
  migrate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/add-overture-oecd-alphafeed
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply deterministic migration
        run: python .github/scripts/add_global_data_sources.py

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/overture-maps/requirements.txt \
            -r api-center/oecd/requirements.txt \
            -r api-center/alphafeed/requirements.txt
          python -m pip check

      - name: Compile and run targeted tests
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/overture-maps/overture_maps_task.py \
            api-center/oecd/oecd_task.py \
            api-center/alphafeed/alphafeed_task.py \
            api-center/overture-maps/tests/*.py \
            api-center/oecd/tests/*.py \
            api-center/alphafeed/tests/*.py
          python -m unittest discover -s api-center/overture-maps/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/oecd/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/alphafeed/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_worldbank*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_osm_worldbank_connectors.py' -v

      - name: Rebuild deterministic API contracts
        run: |
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python -m unittest discover -s api-center/tests -p 'test_capability_maximization.py' -v
          git diff --check

      - name: Defer workflow writes to GitHub connector
        run: |
          rm -f \
            .github/workflows/alphafeed-api-ticket.yml \
            .github/workflows/alphafeed-provider-validate.yml \
            .github/workflows/oecd-api-ticket.yml \
            .github/workflows/oecd-provider-validate.yml \
            .github/workflows/overture-maps-api-ticket.yml \
            .github/workflows/overture-maps-provider-validate.yml
          git restore --source=HEAD -- .github/workflows/api-catalog-validate.yml
          git restore --source=HEAD -- .github/scripts/add_global_data_sources.py

      - name: Commit verified non-workflow implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Overture Maps, OECD and AlphaFeed"
          git push origin HEAD:feat/add-overture-oecd-alphafeed
