name: PRC Justice Capability Trend Validate

on:
  pull_request:
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-capability-trend-system.json"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-signal-event.schema.json"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-trend-analysis-contract.json"
      - "api-center/prc-legal-investigative-intelligence/validate_prc_justice_capability_trend_system.py"
      - "api-center/prc-legal-investigative-intelligence/investigative-technology-intelligence-matrix.json"
      - "api-center/prc-legal-investigative-intelligence/case-derived-investigative-capability-ledger.json"
      - "api-center/prc-legal-investigative-intelligence/prc-justice-self-iteration-policy.json"
      - ".github/workflows/prc-justice-capability-trend-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate capability and trend intelligence contracts
        run: |
          set -euo pipefail
          python -m py_compile api-center/prc-legal-investigative-intelligence/validate_prc_justice_capability_trend_system.py
          python api-center/prc-legal-investigative-intelligence/validate_prc_justice_capability_trend_system.py | tee prc-justice-capability-trend-validation.json
          python -m json.tool api-center/prc-legal-investigative-intelligence/prc-justice-capability-trend-system.json >/dev/null
          python -m json.tool api-center/prc-legal-investigative-intelligence/prc-justice-signal-event.schema.json >/dev/null
          python -m json.tool api-center/prc-legal-investigative-intelligence/prc-justice-trend-analysis-contract.json >/dev/null
          git diff --check

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prc-justice-capability-trend-${{ github.run_id }}
          path: prc-justice-capability-trend-validation.json
          if-no-files-found: warn
          retention-days: 45
