name: Live Yonghui Agent Toolbelt and Gapup Matrix PR

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/live-yonghui-agent-toolbelt-gapup-matrix.yml
      - .github/workflows/live-yonghui-agent-toolbelt-gapup-matrix-pr.yml

permissions:
  contents: read

concurrency:
  group: live-yonghui-agent-toolbelt-gapup-matrix-pr
  cancel-in-progress: false

jobs:
  live-matrix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AGENT_TOOLBELT_KEY: ${{ secrets.AGENT_TOOLBELT_KEY }}
      GAPUP_API_KEY: ${{ secrets.GAPUP_API_KEY }}
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned provider dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/agent-toolbelt/requirements.txt \
            -r api-center/gapup-mcp/requirements.txt
          python -m pip check

      - name: Extract and execute matrix script
        shell: bash
        run: |
          set +x
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/live-yonghui-agent-toolbelt-gapup-matrix.yml').read_text(encoding='utf-8')
          begin = "          python - <<'PY'\n"
          end = "\n          PY\n"
          start = source.index(begin) + len(begin)
          stop = source.index(end, start)
          script = textwrap.dedent(source[start:stop])
          Path('/tmp/yonghui_matrix.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/yonghui_matrix.py

      - name: Verify credentials are absent from evidence
        if: always()
        shell: bash
        run: |
          set +x
          test -f yonghui-provider-matrix/summary.json
          for secret in "${AGENT_TOOLBELT_KEY:-}" "${GAPUP_API_KEY:-}"; do
            if [ -n "$secret" ] && grep -R -Fq -- "$secret" yonghui-provider-matrix; then
              echo "credential leak detected"
              exit 1
            fi
          done

      - name: Upload Yonghui matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yonghui-agent-toolbelt-gapup-matrix-${{ github.run_id }}
          path: yonghui-provider-matrix/
          if-no-files-found: error
          retention-days: 7
