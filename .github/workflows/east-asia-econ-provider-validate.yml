name: Validate East Asia Econ Provider

on:
  pull_request:
    paths:
      - "api-center/east-asia-econ/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/east-asia-econ-provider-validate.yml"
      - ".github/workflows/east-asia-econ-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/east-asia-econ/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/east-asia-econ-provider-validate.yml"
      - ".github/workflows/east-asia-econ-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/east-asia-econ/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/east-asia-econ/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/east-asia-econ/east_asia_econ_task.py api-center/east-asia-econ/tests/*.py
          python -m unittest discover -s api-center/east-asia-econ/tests -p 'test_*.py' -v

      - name: Validate fixed read-only contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/east-asia-econ')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'east-asia-econ'
          assert provider['ticket_prefix'] == '[api-east-asia-econ]'
          assert provider['required_secret_environment_variable'] == 'EAST_ASIA_ECON_API_KEY'
          assert provider['limits']['fixed_api_host'] == 'data-api.eastasiaecon.com'
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['arbitrary_headers_allowed'] is False
          assert provider['limits']['client_supplied_api_key_allowed'] is False
          assert provider['limits']['redirects_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert {row['operation_id'] for row in provider['operations']} == {
              'catalog-capabilities', 'search-series', 'series-info',
              'database-stats', 'series-data', 'usage'
          }
          serialized = json.dumps(catalog, ensure_ascii=False)
          assert 'eae_' not in serialized
          assert 'X-API-Key: ' not in serialized
          print(json.dumps({'status': 'PASS', 'operations': 6}))
          PY

      - name: Verify repository contains no credential material
        run: |
          ! grep -RInE 'eae_[A-Za-z0-9_-]{8,}' api-center/east-asia-econ .github/workflows/east-asia-econ-*.yml
          git diff --check
