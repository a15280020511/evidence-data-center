name: Validate OpenSky Network Provider

on:
  pull_request:
    paths:
      - "api-center/opensky-network/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/opensky-network-provider-validate.yml"
      - ".github/workflows/opensky-network-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/opensky-network/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/opensky-network-provider-validate.yml"
      - ".github/workflows/opensky-network-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/opensky-network/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/opensky-network/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/opensky-network/opensky_network_task.py api-center/opensky-network/tests/*.py
          python -m unittest discover -s api-center/opensky-network/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/opensky-network')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'opensky-network'
          assert provider['ticket_prefix'] == '[intel-opensky]'
          assert provider['required_secret_environment_variable'] == 'OPEN_SKY_CLIENT_SECRET'
          assert provider['required_repository_variable'] == 'OPEN_SKY_CLIENT_ID'
          assert len(ids) == 9
          assert provider['limits']['network_requests_per_ticket_max'] == 2
          assert provider['limits']['business_requests_per_ticket_max'] == 1
          assert provider['limits']['state_bbox_area_square_degrees_max'] == 400
          assert provider['limits']['state_history_seconds_max'] == 3600
          assert provider['limits']['flight_interval_seconds_max'] == 7200
          assert provider['limits']['track_history_days_max'] == 30
          assert provider['limits']['fixed_api_host'] == 'opensky-network.org'
          assert provider['limits']['fixed_auth_host'] == 'auth.opensky-network.org'
          assert provider['limits']['global_state_query_allowed'] is False
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['trino_historical_access_allowed'] is False
          assert provider['limits']['bulk_download_allowed'] is False
          assert provider['limits']['oauth_token_persistence_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in provider['operations'])
          print(json.dumps({'status':'PASS','operations':len(ids),'api_version':'REST 1.4'}))
          PY
          git diff --check
