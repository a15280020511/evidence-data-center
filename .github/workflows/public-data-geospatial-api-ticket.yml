name: Managed Public Data Geospatial Intelligence Center
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: intel-public-data-global
  cancel-in-progress: false
jobs:
  execute-public-data:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-public-data]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
      GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
      HDX_HAPI_APP_IDENTIFIER: ${{ secrets.HDX_HAPI_APP_IDENTIFIER }}
      IATI_API_KEY: ${{ secrets.IATI_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
      OPENTOPOGRAPHY_API_KEY: ${{ secrets.OPENTOPOGRAPHY_API_KEY }}
      OPENCHARGEMAP_API_KEY: ${{ secrets.OPENCHARGEMAP_API_KEY }}
      TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/public-data-geospatial/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/public-data-geospatial/requirements.txt
          python -m pip check
      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/public-data-geospatial/public_data_geospatial_task.py
      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: python api-center/public-data-geospatial/public_data_geospatial_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir public-data-artifacts
      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/public-data-geospatial/public_data_geospatial_task.py render --output-dir public-data-artifacts --phase accepted > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/public-data-geospatial/public_data_geospatial_task.py render --output-dir public-data-artifacts --phase rejected > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Execute one bounded request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/public-data-geospatial/public_data_geospatial_task.py execute --ticket public-data-artifacts/ticket.json --output-dir public-data-artifacts
      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-data-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: public-data-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env: {ARTIFACT_URL: "${{ steps.upload.outputs.artifact-url }}"}
        run: |
          python api-center/public-data-geospatial/public_data_geospatial_task.py render --output-dir public-data-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_PUBLIC_DATA_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
