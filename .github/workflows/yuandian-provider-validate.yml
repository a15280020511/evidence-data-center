name: Validate YuanDian Legal Provider

on:
  pull_request:
    paths:
      - "api-center/yuandian/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/yuandian-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/yuandian/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/yuandian-provider-validate.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: read

concurrency:
  group: validate-yuandian-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-yuandian-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/yuandian/requirements.txt

      - name: Install pinned adapter dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/yuandian/requirements.txt
          python -m pip check

      - name: Compile and run adapter tests
        run: |
          set -euo pipefail
          python -m py_compile api-center/yuandian/*.py
          python -m unittest discover -s api-center/yuandian/tests -v

      - name: Execute no-network capability probe
        run: |
          set -euo pipefail
          rm -rf yuandian-validation && mkdir -p yuandian-validation
          cat > yuandian-validation/ticket.json <<'JSON'
          {
            "task_id": "yuandian-provider-validation-0001",
            "provider": "yuandian-law",
            "operation": "catalog-capabilities",
            "objective": "Validate the frozen YuanDian legal API catalog without a paid business call.",
            "parameters": {},
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "acceptance": {"timeout_seconds": 30, "max_response_bytes": 500000}
          }
          JSON
          python api-center/yuandian/yuandian_task.py execute \
            --ticket yuandian-validation/ticket.json \
            --output-dir yuandian-validation/output
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("yuandian-validation/output")
          snapshot = json.loads((root / "yuandian-snapshot.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "artifact-manifest.json").read_text(encoding="utf-8"))
          assert snapshot["status"] == "API_YUANDIAN_COMPLETED", snapshot
          assert snapshot["data"]["readonly_api_snapshot"]["documented_api_count"] == 37
          assert snapshot["security"]["arbitrary_urls_allowed"] is False
          assert snapshot["security"]["write_operations_allowed"] is False
          assert manifest["files"]
          print({"status": snapshot["status"], "frozen_apis": 37})
          PY

      - name: Probe official public live catalog on schedule or manual run
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          cat > yuandian-validation/live-ticket.json <<'JSON'
          {
            "task_id": "yuandian-live-catalog-probe-0001",
            "provider": "yuandian-law",
            "operation": "catalog-live",
            "objective": "Verify current official YuanDian public catalog discovery.",
            "parameters": {"page_size": 200},
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "acceptance": {"timeout_seconds": 60, "max_response_bytes": 5000000}
          }
          JSON
          ok=false
          for attempt in 1 2 3; do
            rm -rf yuandian-validation/live-output
            if python api-center/yuandian/yuandian_task.py execute \
              --ticket yuandian-validation/live-ticket.json \
              --output-dir yuandian-validation/live-output; then
              ok=true
              break
            fi
            sleep $((attempt * 5))
          done
          [[ "$ok" == true ]]
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("yuandian-validation/live-output/yuandian-snapshot.json").read_text(encoding="utf-8"))
          rows = snapshot["data"]["rows"]
          assert snapshot["status"] == "API_YUANDIAN_COMPLETED", snapshot
          assert len(rows) >= 30, len(rows)
          assert all(row["http_method"] in {"GET", "POST"} and row["read_only"] is True for row in rows)
          print({"live_api_count": len(rows)})
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yuandian-provider-validation-${{ github.run_id }}
          path: yuandian-validation/
          if-no-files-found: warn
          retention-days: 30
