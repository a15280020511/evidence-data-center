name: Validate PRC Mainland Compliance Policy

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/prc-compliance-policy-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/prc-compliance-policy-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prc-compliance-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prc-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate China mainland legal baseline and dangerous capabilities
        run: |
          set -euo pipefail
          python api-center/validate_prc_compliance_policy.py | tee prc-compliance-validation.json
          git diff --check

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prc-compliance-policy-${{ github.run_id }}
          path: |
            prc-compliance-validation.json
            api-center/CHINA_MAINLAND_COMPLIANCE_BASELINE.md
            api-center/TOOL_ADMISSION_AND_CONTAINMENT_STANDARD.md
            api-center/tool-admission-policy.json
          if-no-files-found: error
          retention-days: 30
