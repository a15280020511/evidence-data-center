name: PRC Justice Public Source Watch

on:
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-watch-targets.json"
      - "api-center/prc-legal-investigative-intelligence/prc_justice_public_source_watch.py"
      - ".github/workflows/prc-justice-public-source-watch.yml"
  push:
    branches: [main]
    paths:
      - "api-center/prc-legal-investigative-intelligence/prc-justice-watch-targets.json"
      - "api-center/prc-legal-investigative-intelligence/prc_justice_public_source_watch.py"
      - ".github/workflows/prc-justice-public-source-watch.yml"

permissions:
  contents: read

concurrency:
  group: prc-justice-public-source-watch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-or-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install bounded watcher dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Compile watcher
        run: python -m py_compile api-center/prc-legal-investigative-intelligence/prc_justice_public_source_watch.py

      - name: Validate targets without network on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python api-center/prc-legal-investigative-intelligence/prc_justice_public_source_watch.py \
            --targets api-center/prc-legal-investigative-intelligence/prc-justice-watch-targets.json \
            --mode validate \
            --output prc-justice-source-watch.json

      - name: Run live bounded public-source watch
        if: github.event_name != 'pull_request'
        run: |
          python api-center/prc-legal-investigative-intelligence/prc_justice_public_source_watch.py \
            --targets api-center/prc-legal-investigative-intelligence/prc-justice-watch-targets.json \
            --mode live \
            --output prc-justice-source-watch.json

      - name: Validate report
        run: |
          python -m json.tool api-center/prc-legal-investigative-intelligence/prc-justice-watch-targets.json >/dev/null
          python -m json.tool prc-justice-source-watch.json >/dev/null

      - name: Upload watch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prc-justice-public-source-watch-${{ github.run_id }}
          path: prc-justice-source-watch.json
          if-no-files-found: warn
          retention-days: 30
