name: Temporary export current main for separate secrets

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-export-current-main-separate-secrets]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build deterministic source archive
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > MAIN_SHA.txt
          tar --exclude=.git --exclude=MAIN_SHA.txt --exclude=current-main-source.tar.gz \
            -czf current-main-source.tar.gz .
          sha256sum current-main-source.tar.gz > SHA256SUMS

      - name: Upload source artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-main-separate-secrets-${{ github.run_id }}
          path: |
            MAIN_SHA.txt
            SHA256SUMS
            current-main-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish receipt
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="STATUS=completed\nRUN_ID=${GITHUB_RUN_ID}\nARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}\nMAIN_SHA=${GITHUB_SHA}\nSECRET_VALUES_INCLUDED=false"
