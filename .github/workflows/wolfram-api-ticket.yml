name: Managed Wolfram Alpha Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-wolfram-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-wolfram:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-wolfram]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      WOLFRAM_ALPHA_APP_ID: ${{ secrets.WOLFRAM_ALPHA_APP_ID }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/knowledge-tools/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/knowledge-tools/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: python -m py_compile api-center/knowledge-tools/knowledge_tools_task.py

      - name: Parse and authorize Wolfram ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/knowledge-tools/knowledge_tools_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir knowledge-tools-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/knowledge-tools/knowledge_tools_task.py render \
            --output-dir knowledge-tools-artifacts --phase accepted > knowledge-tools-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@knowledge-tools-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/knowledge-tools/knowledge_tools_task.py render \
            --output-dir knowledge-tools-artifacts --phase rejected > knowledge-tools-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@knowledge-tools-comment.md

      - name: Execute bounded Wolfram operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/knowledge-tools/knowledge_tools_task.py execute \
            --ticket knowledge-tools-artifacts/ticket.json \
            --output-dir knowledge-tools-artifacts

      - name: Upload Wolfram evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wolfram-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: knowledge-tools-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/knowledge-tools/knowledge_tools_task.py render \
            --output-dir knowledge-tools-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > knowledge-tools-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@knowledge-tools-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_KNOWLEDGE_TOOLS_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Wolfram ticket did not complete successfully."
          exit 1
