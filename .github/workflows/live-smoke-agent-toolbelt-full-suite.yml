name: Live Smoke Agent Toolbelt Full Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/live-smoke-agent-toolbelt-full-suite.yml"

permissions:
  contents: read

concurrency:
  group: live-smoke-agent-toolbelt-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AGENT_TOOLBELT_KEY: ${{ secrets.AGENT_TOOLBELT_KEY }}
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Execute all 28 allowlisted upstream tools
        id: suite
        continue-on-error: true
        shell: bash
        run: |
          set +x
          mkdir -p agent-toolbelt-full-suite
          python - <<'PY'
          from __future__ import annotations

          import base64
          import copy
          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://www.agenttoolbelt.live"
          OUT = Path("agent-toolbelt-full-suite")
          KEY = os.environ.get("AGENT_TOOLBELT_KEY", "").strip()
          PROVIDER = json.loads(Path("api-center/agent-toolbelt/provider-catalog.json").read_text(encoding="utf-8"))["providers"][0]
          ALLOWLIST = [
              row["operation_id"]
              for row in PROVIDER["operations"]
              if row["operation_id"] != "catalog-capabilities"
          ]
          STOCK_TOOLS = {
              "stock-thesis", "earnings-analysis", "insider-signal",
              "valuation-snapshot", "bear-vs-bull", "compare-stocks",
              "moat-analysis", "watchlist-scan",
          }

          TINY_PNG = base64.b64encode(base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z6uQAAAAASUVORK5CYII="
          )).decode("ascii")

          SAFE_OVERRIDES = {
              "schema-generator": {
                  "description": "A public weather observation with city, observed_at, temperature_c, humidity_percent, and source_url.",
                  "format": "json_schema",
                  "strict": True,
              },
              "text-extractor": {
                  "text": "Public test: report@example.com, https://example.com/report, 2026-08-01, USD 125.00.",
                  "extractors": ["emails", "urls", "dates", "currencies"],
                  "deduplicate": True,
              },
              "token-counter": {
                  "text": "Public evidence package for Fuzhou weather and economic data.",
                  "models": ["gpt-4o", "claude-3-5-sonnet"],
              },
              "csv-to-json": {
                  "csv": "city,temp_c,rain_mm\nFuzhou,35.6,0\nXiamen,32.1,4.2\n",
                  "delimiter": "auto",
                  "hasHeader": True,
                  "typeCast": True,
                  "limit": 10,
                  "skipEmptyRows": True,
              },
              "url-metadata": {"url": "https://example.com", "timeout": 20000},
              "web-summarizer": {
                  "url": "https://example.com",
                  "mode": "both",
                  "focus": "Explain the purpose of the page.",
                  "maxContentLength": 5000,
                  "timeout": 20000,
              },
              "dependency-auditor": {
                  "packages": [{"name": "lodash", "version": "4.17.19", "ecosystem": "npm"}],
                  "minSeverity": "LOW",
              },
              "image-metadata-stripper": {
                  "imageBase64": TINY_PNG,
                  "fileName": "public-test.png",
                  "preserveColorProfile": True,
              },
              "document-comparator": {
                  "documentA": "Public policy draft v1. Reporting is monthly. Retention is 30 days.",
                  "documentB": "Public policy draft v2. Reporting is weekly. Retention is 60 days.",
                  "mode": "semantic",
              },
              "contract-clause-extractor": {
                  "contractText": "PUBLIC SYNTHETIC AGREEMENT. Payment is due within 30 days. Either party may terminate with 14 days notice. Liability is capped at USD 1,000. No personal information is included.",
                  "clauseTypes": ["payment", "termination", "liability"],
              },
              "meeting-action-items": {
                  "transcript": "Public synthetic meeting. Team Alpha will publish the weather data dictionary by 2026-08-10. Team Beta will validate the API schema by 2026-08-12. Decision: use JSON Schema 2020-12.",
              },
              "prompt-optimizer": {
                  "prompt": "Summarize this public report.",
                  "goal": "Produce a concise evidence-grounded summary with citations and explicit uncertainty.",
              },
              "stock-thesis": {"ticker": "AAPL"},
              "earnings-analysis": {"ticker": "AAPL"},
              "insider-signal": {"ticker": "AAPL"},
              "valuation-snapshot": {"ticker": "AAPL"},
              "bear-vs-bull": {"ticker": "AAPL"},
              "moat-analysis": {"ticker": "AAPL"},
              "compare-stocks": {"tickers": ["AAPL", "MSFT"]},
              "watchlist-scan": {"tickers": ["AAPL", "MSFT"], "strategy": "quality"},
          }

          def request(path: str, *, body=None, auth=False, timeout=120):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "evidence-data-center-agent-toolbelt-full-suite/1.0",
              }
              data = None
              method = "GET"
              if body is not None:
                  data = json.dumps(body, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                  headers["Content-Type"] = "application/json"
                  method = "POST"
              if auth:
                  headers["Authorization"] = f"Bearer {KEY}"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read(20_000_000)
                      return response.status, json.loads(raw.decode("utf-8")), len(raw)
              except urllib.error.HTTPError as exc:
                  raw = exc.read(1_000_000)
                  try:
                      payload = json.loads(raw.decode("utf-8", errors="replace"))
                  except Exception:
                      payload = {"error": raw.decode("utf-8", errors="replace")[:1000]}
                  return exc.code, payload, len(raw)
              except Exception as exc:
                  return 0, {"error": type(exc).__name__, "message": str(exc)[:500]}, 0

          def safe_shape(value, depth=0):
              if depth > 3:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {str(k): safe_shape(v, depth + 1) for k, v in list(value.items())[:30]}
              if isinstance(value, list):
                  return {"type": "array", "length": len(value), "sample_shape": safe_shape(value[0], depth + 1) if value else None}
              if isinstance(value, str):
                  return {"type": "string", "length": len(value)}
              if value is None:
                  return "null"
              return type(value).__name__

          report = {
              "schema_version": "agent-toolbelt-full-suite-live-v1",
              "tested_at": datetime.now(timezone.utc).isoformat(),
              "origin": BASE,
              "credential_present": bool(KEY),
              "credential_prefix_valid": KEY.startswith("atb_"),
              "secret_values_exposed": False,
              "allowlisted_tool_count": len(ALLOWLIST),
              "results": [],
          }

          if not KEY:
              report.update({"status": "FAIL", "failure_reason": "missing AGENT_TOOLBELT_KEY"})
              OUT.joinpath("summary.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              sys.exit(1)

          catalog_status, catalog_payload, _ = request("/api/tools/catalog")
          catalog_rows = catalog_payload.get("tools", []) if isinstance(catalog_payload, dict) else []
          catalog = {row.get("name"): row for row in catalog_rows if isinstance(row, dict) and row.get("name")}
          report["catalog"] = {
              "http_status": catalog_status,
              "reported_count": catalog_payload.get("count") if isinstance(catalog_payload, dict) else None,
              "parsed_count": len(catalog),
              "allowlist_matches": set(ALLOWLIST) == set(catalog),
              "missing_from_upstream": sorted(set(ALLOWLIST) - set(catalog)),
              "unexpected_upstream": sorted(set(catalog) - set(ALLOWLIST)),
          }

          for index, tool in enumerate(ALLOWLIST, 1):
              row = catalog.get(tool, {})
              metadata = row.get("metadata", {}) if isinstance(row, dict) else {}
              example = metadata.get("exampleInput") if isinstance(metadata, dict) else None
              payload = copy.deepcopy(SAFE_OVERRIDES.get(tool, example))
              if not isinstance(payload, dict):
                  payload = {}

              started = time.monotonic()
              status, response, response_bytes = request(f"/api/tools/{tool}", body=payload, auth=True)
              # One bounded retry for transient failures only.
              retried = False
              if status in {429, 500, 502, 503, 504}:
                  retried = True
                  time.sleep(3)
                  status, response, response_bytes = request(f"/api/tools/{tool}", body=payload, auth=True)
              elapsed_ms = round((time.monotonic() - started) * 1000)

              success = status == 200 and isinstance(response, dict) and response.get("success") is True
              result = response.get("result") if isinstance(response, dict) else None
              safe_error = None
              if not success and isinstance(response, dict):
                  safe_error = str(response.get("message") or response.get("error") or response.get("details") or "request failed")[:1000]
              record = {
                  "index": index,
                  "tool": tool,
                  "category": "stock" if tool in STOCK_TOOLS else "utility",
                  "input_source": "safe_override" if tool in SAFE_OVERRIDES else "upstream_catalog_example",
                  "input_sha256": hashlib.sha256(json.dumps(payload, sort_keys=True, ensure_ascii=False).encode("utf-8")).hexdigest(),
                  "http_status": status,
                  "success": success,
                  "retried": retried,
                  "elapsed_ms": elapsed_ms,
                  "reported_duration_ms": response.get("durationMs") if isinstance(response, dict) else None,
                  "cached": response.get("cached") if isinstance(response, dict) else None,
                  "version": response.get("version") if isinstance(response, dict) else None,
                  "response_bytes": response_bytes,
                  "result_shape": safe_shape(result),
                  "safe_error": safe_error,
              }
              report["results"].append(record)
              print(json.dumps({k: record[k] for k in ("index", "tool", "http_status", "success", "elapsed_ms", "cached", "safe_error")}, ensure_ascii=False))

              # Avoid stock-rate bursts and upstream daily-cap spikes.
              if tool in STOCK_TOOLS:
                  time.sleep(2)
              else:
                  time.sleep(0.25)

          passed = [row for row in report["results"] if row["success"]]
          failed = [row for row in report["results"] if not row["success"]]
          by_category = {}
          for category in ("utility", "stock"):
              rows = [row for row in report["results"] if row["category"] == category]
              by_category[category] = {
                  "total": len(rows),
                  "passed": sum(1 for row in rows if row["success"]),
                  "failed": sum(1 for row in rows if not row["success"]),
              }
          report["summary"] = {
              "total": len(report["results"]),
              "passed": len(passed),
              "failed": len(failed),
              "failed_tools": [row["tool"] for row in failed],
              "by_category": by_category,
              "total_elapsed_ms": sum(row["elapsed_ms"] for row in report["results"]),
              "cache_hits": sum(1 for row in report["results"] if row["cached"] is True),
          }
          report["status"] = "PASS" if not failed and report["catalog"]["allowlist_matches"] else "FAIL"
          OUT.joinpath("summary.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          OUT.joinpath("results.tsv").write_text(
              "tool\tcategory\thttp_status\tsuccess\telapsed_ms\tcached\tsafe_error\n" +
              "\n".join(
                  f"{row['tool']}\t{row['category']}\t{row['http_status']}\t{str(row['success']).lower()}\t{row['elapsed_ms']}\t{row['cached']}\t{(row['safe_error'] or '').replace(chr(9), ' ').replace(chr(10), ' ')}"
                  for row in report["results"]
              ) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"status": report["status"], **report["summary"], "secret_values_exposed": False}, ensure_ascii=False))
          sys.exit(0 if report["status"] == "PASS" else 1)
          PY

      - name: Verify no credential entered evidence
        if: always()
        shell: bash
        run: |
          set +x
          test -f agent-toolbelt-full-suite/summary.json
          test -f agent-toolbelt-full-suite/results.tsv
          if [ -n "${AGENT_TOOLBELT_KEY:-}" ] && grep -R -Fq -- "$AGENT_TOOLBELT_KEY" agent-toolbelt-full-suite; then
            echo "Credential value found in evidence"
            exit 1
          fi

      - name: Upload full-suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-toolbelt-full-suite-${{ github.run_id }}
          path: agent-toolbelt-full-suite/
          if-no-files-found: error
          retention-days: 7

      - name: Mark failed suite
        if: steps.suite.outcome != 'success'
        run: exit 1
