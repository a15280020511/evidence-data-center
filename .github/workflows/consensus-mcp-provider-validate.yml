name: Validate Consensus MCP Provider

on:
  pull_request:
    paths:
      - "api-center/consensus-mcp/**"
      - ".github/workflows/consensus-mcp-api-ticket.yml"
      - ".github/workflows/consensus-mcp-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/consensus-mcp/**"
      - ".github/workflows/consensus-mcp-api-ticket.yml"
      - ".github/workflows/consensus-mcp-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-consensus-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONSENSUS_MCP_BEARER_TOKEN: ${{ secrets.CONSENSUS_MCP_BEARER_TOKEN }}
      CONSENSUS_MCP_REFRESH_TOKEN: ${{ secrets.CONSENSUS_MCP_REFRESH_TOKEN }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/consensus-mcp/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/consensus-mcp/requirements.txt
          python -m pip check

      - name: Compile and run deterministic tests
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/consensus-mcp/consensus_mcp_task.py \
            api-center/consensus-mcp/oauth_probe.py \
            api-center/consensus-mcp/oauth_bootstrap.py \
            api-center/consensus-mcp/oauth_refresh.py \
            api-center/consensus-mcp/oauth_browser_probe.py \
            api-center/consensus-mcp/tests/test_consensus_mcp_task.py \
            api-center/consensus-mcp/tests/test_consensus_oauth_bridge.py
          python -m unittest discover \
            -s api-center/consensus-mcp/tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('api-center/consensus-mcp')
          provider = json.loads((root / 'provider-catalog.json').read_text())['providers'][0]
          snapshot = json.loads((root / 'tool-discovery-snapshot.json').read_text())
          client = json.loads((root / 'oauth-client.json').read_text())
          assert provider['provider_id'] == 'consensus-mcp'
          assert provider['official_endpoint'] == 'https://mcp.consensus.app/mcp'
          assert provider['runtime_status'] == 'oauth-bridge-ready-awaiting-secret'
          assert provider['authentication']['public_client_id'] == client['client_id']
          assert provider['authentication']['refresh_secret'] == 'CONSENSUS_MCP_REFRESH_TOKEN'
          assert client['token_endpoint_auth_method'] == 'none'
          assert client['pkce_method'] == 'S256'
          assert client['contains_secret'] is False
          assert provider['limits']['fixed_mcp_tool_count'] == 1
          assert provider['limits']['arbitrary_jsonrpc_methods_allowed'] is False
          assert provider['limits']['arbitrary_mcp_tool_names_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['web_scraping_allowed'] is False
          assert snapshot['tool_count'] == 1
          assert snapshot['tools'][0]['name'] == 'search'
          print(json.dumps({'status': 'PASS', 'operations': 3, 'mcp_tools': 1, 'oauth_bridge': True, 'model_calls': 0}))
          PY
          git diff --check

      - name: Discover official MCP OAuth metadata
        id: oauth
        continue-on-error: true
        run: |
          set -o pipefail
          python api-center/consensus-mcp/oauth_probe.py \
            --output consensus-mcp-oauth-probe.json | tee consensus-mcp-oauth-probe-summary.json

      - name: Resolve Free-account refresh token for canary
        id: refresh
        if: env.CONSENSUS_MCP_BEARER_TOKEN == '' && env.CONSENSUS_MCP_REFRESH_TOKEN != ''
        continue-on-error: true
        run: python api-center/consensus-mcp/oauth_refresh.py --timeout 20

      - name: Run real MCP canary
        id: canary
        continue-on-error: true
        run: |
          set -o pipefail
          python api-center/consensus-mcp/consensus_mcp_task.py canary \
            --output consensus-mcp-canary.json | tee consensus-mcp-canary-summary.json

      - name: Validate live evidence envelope
        run: |
          python -m json.tool consensus-mcp-oauth-probe.json >/dev/null
          python -m json.tool consensus-mcp-oauth-probe-summary.json >/dev/null
          python -m json.tool consensus-mcp-canary.json >/dev/null
          python -m json.tool consensus-mcp-canary-summary.json >/dev/null
          python - <<'PY'
          import json
          oauth = json.load(open('consensus-mcp-oauth-probe.json'))
          canary = json.load(open('consensus-mcp-canary.json'))
          assert oauth['mcp_status_without_token'] in (200, 401)
          assert oauth['supports_authorization_code'] is True
          assert oauth['supports_client_credentials'] is False
          assert oauth['registration_endpoint_present'] is True
          if canary['status'] != 'pass':
              assert oauth['mcp_status_without_token'] == 401
              assert oauth['resource_metadata']
              assert oauth['authorization_metadata']
          print(json.dumps({
              'canary_status': canary['status'],
              'oauth_discovered': bool(oauth['authorization_metadata']),
              'client_credentials': oauth['supports_client_credentials'],
              'authorization_code': oauth['supports_authorization_code'],
          }))
          PY

      - name: Upload safe validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consensus-mcp-validation-${{ github.run_id }}
          path: |
            api-center/consensus-mcp/provider-catalog.json
            api-center/consensus-mcp/ticket.schema.json
            api-center/consensus-mcp/tool-discovery-snapshot.json
            api-center/consensus-mcp/oauth-client.json
            consensus-mcp-oauth-probe.json
            consensus-mcp-oauth-probe-summary.json
            consensus-mcp-canary.json
            consensus-mcp-canary-summary.json
          if-no-files-found: warn
          retention-days: 30
