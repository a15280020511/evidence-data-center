name: Validate EIA Provider

on:
  pull_request:
    paths:
      - "api-center/eia/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/eia-provider-validate.yml"
      - ".github/workflows/eia-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/eia/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/eia-provider-validate.yml"
      - ".github/workflows/eia-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/eia/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/eia/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/eia/eia_task.py api-center/eia/tests/*.py
          python -m unittest discover -s api-center/eia/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/eia')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'eia'
          assert provider['ticket_prefix'] == '[intel-eia]'
          assert provider['required_secret_environment_variable'] == 'EIA_API_KEY'
          assert len(ids) == 6
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['transient_retry_max'] == 0
          assert provider['limits']['rows_per_response_max'] == 5000
          assert provider['limits']['route_segments_max'] == 8
          assert provider['limits']['fixed_api_host'] == 'api.eia.gov'
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['bulk_download_allowed'] is False
          assert provider['limits']['xml_output_allowed'] is False
          assert provider['limits']['path_traversal_allowed'] is False
          assert provider['limits']['background_crawling_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert {'catalog-capabilities','api-root','route-metadata','facet-values','route-data','series-by-id'} == ids
          print(json.dumps({'status':'PASS','operations':len(ids),'api_version':'v2'}))
          PY
          git diff --check
