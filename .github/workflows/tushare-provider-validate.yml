name: Validate Tushare Provider

on:
  pull_request:
    paths:
      - "api-center/tushare/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/tests/**"
      - ".github/workflows/tushare-*.yml"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/tushare/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/tests/**"
      - ".github/workflows/tushare-*.yml"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tushare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tushare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/tushare/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/tushare/requirements.txt
          python -m pip check

      - name: Compile and run unit tests
        run: |
          python -m py_compile api-center/tushare/tushare_task.py api-center/tushare/tests/*.py
          python -m unittest discover -s api-center/tushare/tests -v

      - name: Validate provider catalog and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          catalog = json.loads(Path('api-center/tushare/provider-catalog.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('api-center/tushare/ticket.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          operations = provider['operations']
          assert provider['provider_id'] == 'tushare'
          assert provider['required_secret_environment_variable'] == 'TUSHARE_API_TOKEN'
          assert len(operations) == 20
          assert len({row['operation_id'] for row in operations}) == 20
          for row in operations:
              Draft202012Validator.check_schema(row['parameter_schema'])
          limits = provider['limits']
          assert limits['arbitrary_api_names_allowed'] is False
          assert limits['arbitrary_urls_allowed'] is False
          assert limits['arbitrary_headers_allowed'] is False
          assert limits['write_operations_allowed'] is False
          assert limits['trading_or_order_execution_allowed'] is False
          assert limits['secret_values_exposed'] is False
          PY

      - name: Verify no credential material or unsafe escape hatch
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'secret-token-value' api-center/tushare \
            --exclude='test_tushare_task.py'
          ! grep -R --line-number -E 'http://api\.tushare\.pro|arbitrary_url|execute_order|place_order' \
            api-center/tushare/tushare_task.py api-center/tushare/provider-catalog.json
          grep -F 'https://api.tushare.pro' api-center/tushare/tushare_task.py
          grep -F 'TUSHARE_API_TOKEN' .github/workflows/tushare-api-ticket.yml

      - name: Upload deterministic contracts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tushare-provider-contracts-${{ github.run_id }}
          path: |
            api-center/tushare/provider-catalog.json
            api-center/tushare/ticket.schema.json
          if-no-files-found: error
          retention-days: 30
