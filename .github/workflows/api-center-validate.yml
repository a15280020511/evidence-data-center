name: Validate API Center

on:
  pull_request:
    paths:
      - "api-center/**"
      - ".github/workflows/api-center-validate.yml"
      - ".github/workflows/api-center-image.yml"
      - ".github/dependabot.yml"
      - ".github/workflows/dependabot-auto-merge.yml"
  push:
    branches: [main]
    paths:
      - "api-center/**"
      - ".github/workflows/api-center-validate.yml"
      - ".github/workflows/api-center-image.yml"
      - ".github/dependabot.yml"
      - ".github/workflows/dependabot-auto-merge.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: write
  issues: write

concurrency:
  group: validate-api-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-api-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/requirements.txt

      - name: Apply NOAA China historical migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/noaa-china-history-only'
        shell: bash
        run: |
          set -euo pipefail
          python api-center/noaa/migrate_to_china_history.py
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -v
          git diff --check

          ua='IntelligenceCenter/1.0 (github.com/a15280020511/evidence-data-center)'
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/search/v1/data?dataset=daily-summaries&startDate=2024-01-01&endDate=2024-01-02&bbox=53.56,73.50,18.10,134.77&limit=2' \
            -o /tmp/noaa-search.json
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/data/v1?dataset=daily-summaries&stations=CHM00054511&startDate=2024-01-01&endDate=2024-01-03&dataTypes=TAVG,TMAX,TMIN,PRCP&format=json&units=metric&includeStationName=true&includeStationLocation=true' \
            -o /tmp/noaa-daily.json
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-summary-of-the-month&stations=CHM00054511&startDate=2023-01-01&endDate=2023-03-31&dataTypes=TAVG,TMAX,TMIN,PRCP&format=json&units=metric&includeStationName=true&includeStationLocation=true' \
            -o /tmp/noaa-monthly.json
          curl --fail --silent --show-error --retry 2 -A "$ua" \
            'https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-summary-of-the-year&stations=CHM00054511&startDate=2020-01-01&endDate=2023-12-31&dataTypes=TAVG,TMAX,TMIN,PRCP&format=json&units=metric&includeStationName=true&includeStationLocation=true' \
            -o /tmp/noaa-yearly.json
          python - <<'PY'
          import json
          from pathlib import Path

          search = json.loads(Path('/tmp/noaa-search.json').read_text(encoding='utf-8'))
          assert isinstance(search, dict)
          assert search.get('results') or search.get('stations') or search.get('totalCount')
          counts = {}
          for name in ('daily', 'monthly', 'yearly'):
              rows = json.loads(Path(f'/tmp/noaa-{name}.json').read_text(encoding='utf-8'))
              assert isinstance(rows, list) and rows, (name, rows)
              assert all(str(row.get('STATION', '')).startswith('CH') for row in rows)
              counts[name] = len(rows)
          print(json.dumps({'status': 'PASS', 'station': 'CHM00054511', **counts}))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center .github/workflows/api-catalog-validate.yml
          if git diff --cached --quiet; then
            echo 'NOAA China migration outputs already committed.'
          else
            git commit -m 'fix: replace US NOAA weather with China historical climate data'
            git push origin HEAD:fix/noaa-china-history-only
          fi

      - name: Preserve committed generated gateway contracts
        run: |
          cp api-center/krakend.tmpl /tmp/committed-krakend.tmpl
          cp api-center/krakend.validation.json /tmp/committed-krakend.validation.json
          cp api-center/connector-manifest.json /tmp/committed-connector-manifest.json

      - name: Compile, test, build, and compare connector registry
        id: registry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m pip check
          python -m py_compile api-center/build_config.py api-center/runtime_diagnostics.py api-center/tests/*.py
          python -m unittest discover -s api-center/tests -v 2>&1 | tee api-center-unit-tests.log
          python api-center/build_config.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def load_json(path: str):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          pattern = re.compile(r'\{\{ env "([A-Z][A-Z0-9_]*)" \| quote \}\}')

          def load_template(path: str):
              text = Path(path).read_text(encoding='utf-8')
              rendered = pattern.sub(
                  lambda match: json.dumps(f'__ENV_{match.group(1)}__'),
                  text,
              )
              return json.loads(rendered)

          committed_manifest = load_json('/tmp/committed-connector-manifest.json')
          generated_manifest = load_json('api-center/connector-manifest.json')
          committed_validation = load_json('/tmp/committed-krakend.validation.json')
          generated_validation = load_json('api-center/krakend.validation.json')
          committed_template = load_template('/tmp/committed-krakend.tmpl')
          generated_template = load_template('api-center/krakend.tmpl')

          assert committed_manifest == generated_manifest
          assert committed_validation == generated_validation
          assert committed_template == generated_template
          rows = generated_manifest['connectors']
          enabled_rows = [row for row in rows if row['enabled']]
          expected_secrets = sorted({
              row['secret_environment_variable']
              for row in enabled_rows
              if row.get('secret_environment_variable')
          })
          assert generated_manifest['connector_count'] == len(rows)
          assert generated_manifest['enabled_connector_count'] == len(enabled_rows)
          assert generated_manifest['required_secret_environment_variables'] == expected_secrets
          assert len(generated_validation['endpoints']) == len(enabled_rows)
          assert {row['endpoint'] for row in generated_validation['endpoints']} == {
              row['endpoint'] for row in generated_template['endpoints']
          }
          ids = {row['id'] for row in rows}
          assert {
              'gdelt-doc-articles',
              'nasa-black-marble-granules',
              'worldpop-population-stats',
              'example-api',
          }.isdisjoint(ids)
          assert {
              'newsapi-everything',
              'newsapi-top-headlines',
              'newsapi-sources',
              'openmeteo-forecast',
              'baidu-geocode',
              'baidu-place-search',
              'baidu-direction-driving',
          }.issubset(ids)
          print(json.dumps({
              'status': 'PASS',
              'connectors': generated_manifest['connector_count'],
              'enabled': generated_manifest['enabled_connector_count'],
              'routes': len(generated_validation['endpoints']),
          }))
          PY

      - name: Resolve and record reviewed KrakenD base image
        id: base_image
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          image="$(awk 'toupper($1) == "FROM" {print $2; exit}' api-center/Dockerfile)"
          [[ "$image" =~ ^krakend:[^@]+@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image" > api-center-base-image-requested.txt
          docker pull "$image"
          docker inspect --format='{{index .RepoDigests 0}}' "$image" | tee api-center-base-image-resolved.txt
          expected_digest="${image##*@}"
          grep -F "@${expected_digest}" api-center-base-image-resolved.txt

      - name: Validate KrakenD configuration offline
        id: config
        if: always() && steps.registry.outcome == 'success' && steps.base_image.outcome == 'success'
        continue-on-error: true
        env:
          KRAKEND_IMAGE: ${{ steps.base_image.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/api-center:/etc/krakend:ro" \
            "$KRAKEND_IMAGE" \
            check -tnc /etc/krakend/krakend.validation.json

      - name: Build immutable API center image
        id: image
        if: always() && steps.registry.outcome == 'success' && steps.base_image.outcome == 'success' && steps.config.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          docker build --pull --tag "independent-api-center:${GITHUB_SHA}" api-center

      - name: Start image and verify health
        id: runtime
        if: always() && steps.image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 127.0.0.1:18080:8080 \
            --health-interval=1s --health-timeout=3s --health-start-period=1s --health-retries=3 \
            "independent-api-center:${GITHUB_SHA}")"
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
          health=starting
          for _ in $(seq 1 45); do
            health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" 2>/dev/null || echo inspect-failed)"
            if [[ "$health" == healthy ]] && curl --fail --silent --show-error "http://127.0.0.1:18080/__health" > api-center-health.json; then
              break
            fi
            sleep 1
          done
          docker inspect "$container_id" > api-center-container-inspect.json 2>&1 || true
          docker logs "$container_id" > api-center-runtime.log 2>&1 || true
          echo "health=$health" >> "$GITHUB_OUTPUT"
          test "$health" = healthy
          test -s api-center-health.json

      - name: Capture failed runtime evidence
        if: always() && steps.runtime.outcome != 'success' && steps.runtime.outputs.container_id != ''
        run: |
          docker inspect "${{ steps.runtime.outputs.container_id }}" > api-center-container-inspect.json 2>&1 || true
          docker logs "${{ steps.runtime.outputs.container_id }}" > api-center-runtime.log 2>&1 || true

      - name: Stop validation container
        if: always() && steps.runtime.outputs.container_id != ''
        run: docker rm -f "${{ steps.runtime.outputs.container_id }}" || true

      - name: Write API center diagnostics and audit
        id: diagnostics
        if: always()
        run: |
          python api-center/runtime_diagnostics.py \
            --root . \
            --registry-outcome "${{ steps.registry.outcome }}" \
            --base-image-outcome "${{ steps.base_image.outcome }}" \
            --config-outcome "${{ steps.config.outcome }}" \
            --image-outcome "${{ steps.image.outcome }}" \
            --runtime-outcome "${{ steps.runtime.outcome }}" \
            --health "${{ steps.runtime.outputs.health }}" \
            --container-id "${{ steps.runtime.outputs.container_id }}"

      - name: Upload API center validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-center-validation-${{ github.run_id }}
          path: |
            api-center-audit.json
            api-center-diagnostics.json
            api-center-health.json
            api-center-runtime.log
            api-center-container-inspect.json
            api-center-unit-tests.log
            api-center-base-image-requested.txt
            api-center-base-image-resolved.txt
            api-center/api-catalog.json
            api-center/connector-manifest.json
            api-center/krakend.validation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open or resolve scheduled API center incident
        if: always() && github.event_name == 'schedule'
        env:
          VALIDATION_STATUS: ${{ steps.diagnostics.outputs.status }}
          ERROR_CODE: ${{ steps.diagnostics.outputs.error_code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title='[api-maintenance] API center health failed'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "API center health failed in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ "$VALIDATION_STATUS" != PASS ]]; then
            body="Scheduled API center validation failed with ${ERROR_CODE:-unknown} in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "API center health recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Mark API center validation failed
        if: always() && steps.diagnostics.outputs.status != 'PASS'
        run: |
          echo "API center validation failed: ${{ steps.diagnostics.outputs.error_code }}"
          exit 1
