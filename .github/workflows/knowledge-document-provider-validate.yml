name: Validate WolframAlpha and LlamaParse Providers

on:
  pull_request:
    paths:
      - "api-center/knowledge-document/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/knowledge-document-api-ticket.yml"
      - ".github/workflows/knowledge-document-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/knowledge-document/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/knowledge-document-api-ticket.yml"
      - ".github/workflows/knowledge-document-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-document-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/knowledge-document/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/knowledge-document/requirements.txt
          python -m pip check

      - name: Compile and test providers
        run: |
          set -euo pipefail
          python -m py_compile api-center/knowledge-document/provider_task.py
          python -m unittest discover \
            -s api-center/knowledge-document/tests \
            -p 'test_*.py' -v

      - name: Verify catalog security invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(
              Path('api-center/knowledge-document/provider-catalog.json').read_text(encoding='utf-8')
          )
          providers = {row['provider_id']: row for row in catalog['providers']}
          assert set(providers) == {'wolframalpha', 'llamaparse'}
          assert len(providers['wolframalpha']['operations']) == 5
          assert len(providers['llamaparse']['operations']) == 4
          assert providers['wolframalpha']['required_secret_environment_variable'] == 'WOLFRAMALPHA_APP_ID'
          assert providers['llamaparse']['required_secret_environment_variable'] == 'LLAMA_CLOUD_API_KEY'
          assert providers['wolframalpha']['limits']['arbitrary_urls_allowed'] is False
          assert providers['llamaparse']['limits']['private_or_loopback_sources_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          serialized = json.dumps(catalog, ensure_ascii=False)
          assert 'WOLFRAMALPHA_APP_ID=' not in serialized
          assert 'LLAMA_CLOUD_API_KEY=' not in serialized
          print(json.dumps({'status': 'PASS', 'providers': 2, 'operations': 9}))
          PY
