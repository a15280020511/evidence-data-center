name: Global Public Specialized APIs Validate

on:
  push:
    paths:
      - "api-center/global-public-specialized-apis/**"
      - ".github/workflows/global-public-specialized-apis-*.yml"
      - "api-center/managed_provider_runtime.py"
  pull_request:
    paths:
      - "api-center/global-public-specialized-apis/**"
      - ".github/workflows/global-public-specialized-apis-*.yml"
      - "api-center/managed_provider_runtime.py"

permissions:
  contents: read

concurrency:
  group: global-public-specialized-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-public-specialized-apis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-public-specialized-apis/requirements.txt
          python -m pip check

      - name: Compile and validate JSON
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-public-specialized-apis/global_public_specialized_task.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('api-center/global-public-specialized-apis')
          for path in root.glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY

      - name: Run provider tests
        run: |
          python -m unittest discover \
            -s api-center/global-public-specialized-apis/tests \
            -p 'test_*.py' \
            -v
