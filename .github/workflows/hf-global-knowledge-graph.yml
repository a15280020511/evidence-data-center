name: Validate and Sync HF Global Knowledge Graph

on:
  pull_request:
    paths:
      - "api-center/global-knowledge-registry/**"
      - "api-center/huggingface/knowledge_graph_store.py"
      - "api-center/huggingface/global-knowledge-graph/**"
      - "api-center/huggingface/tests/test_knowledge_graph_store.py"
      - "api-center/huggingface/requirements-knowledge-graph.txt"
      - ".github/workflows/hf-global-knowledge-graph.yml"
  push:
    branches: [main]
    paths:
      - "api-center/global-knowledge-registry/**"
      - "api-center/huggingface/knowledge_graph_store.py"
      - "api-center/huggingface/global-knowledge-graph/**"
      - "api-center/huggingface/tests/test_knowledge_graph_store.py"
      - "api-center/huggingface/requirements-knowledge-graph.txt"
      - ".github/workflows/hf-global-knowledge-graph.yml"
  schedule:
    - cron: "17 3 * * *"
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hf-global-knowledge-graph-${{ github.event_name }}-${{ github.ref }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-control-plane:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, '[sync-hf-global-knowledge-graph]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements-knowledge-graph.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/huggingface/requirements-knowledge-graph.txt
          python -m pip check

      - name: Compile, test and validate graph bootstrap
        run: |
          set -euo pipefail
          python -m py_compile api-center/huggingface/knowledge_graph_store.py
          python -m unittest api-center/huggingface/tests/test_knowledge_graph_store.py -v
          python api-center/huggingface/knowledge_graph_store.py validate --output-dir global-knowledge-graph-validation
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('global-knowledge-graph-validation/validation-receipt.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'GLOBAL_KNOWLEDGE_GRAPH_BOOTSTRAP_VALIDATED'
          assert receipt['registered_source_node_count'] == 249
          assert receipt['edge_count'] == 0
          assert receipt['active_backbone_source_count'] == 5
          assert receipt['node_type_count'] == 32
          assert receipt['edge_type_count'] == 31
          assert receipt['public_metadata_only'] is True
          assert receipt['full_text_copied'] is False
          assert receipt['patient_level_data_included'] is False
          assert receipt['secret_values_exposed'] is False
          assert receipt['network_used'] is False
          assert receipt['model_calls'] == 0
          assert len(list(Path('global-knowledge-graph-validation').glob('*.parquet'))) == 3
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-global-knowledge-graph-validation-${{ github.run_id }}
          path: global-knowledge-graph-validation/
          if-no-files-found: error
          retention-days: 30

  sync-public-knowledge-graph:
    if: >-
      always() &&
      needs.validate-control-plane.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.actor == github.repository_owner &&
        startsWith(github.event.issue.title, '[sync-hf-global-knowledge-graph]')))
    needs: [validate-control-plane]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_GLOBAL_KNOWLEDGE_GRAPH_DATASET_REPO: ${{ vars.HF_GLOBAL_KNOWLEDGE_GRAPH_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements-knowledge-graph.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/huggingface/requirements-knowledge-graph.txt
          python -m pip check

      - name: Synchronize public metadata graph
        id: sync
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python api-center/huggingface/knowledge_graph_store.py sync --output-dir hf-global-knowledge-graph-receipt

      - name: Render synchronization receipt
        if: always()
        run: |
          python api-center/huggingface/knowledge_graph_store.py render --output-dir hf-global-knowledge-graph-receipt > hf-global-knowledge-graph-comment.md || true
          cat hf-global-knowledge-graph-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish issue receipt
        if: always() && github.event_name == 'issues'
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@hf-global-knowledge-graph-comment.md

      - name: Upload synchronization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-global-knowledge-graph-sync-${{ github.run_id }}
          path: hf-global-knowledge-graph-receipt/
          if-no-files-found: error
          retention-days: 90

      - name: Mark synchronization failure
        if: always() && steps.sync.outcome != 'success'
        run: exit 1
