name: Remove Agent Toolbelt Stock Tools

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/temp-remove-agent-toolbelt-stock-tools.yml"

permissions:
  contents: write

concurrency:
  group: remove-agent-toolbelt-stock-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remove-stock-tools:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Remove all Agent Toolbelt stock operations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path("api-center")
          provider_root = root / "agent-toolbelt"
          removed = {
              "stock-thesis",
              "earnings-analysis",
              "insider-signal",
              "valuation-snapshot",
              "bear-vs-bull",
              "compare-stocks",
              "moat-analysis",
              "watchlist-scan",
          }

          catalog_path = provider_root / "provider-catalog.json"
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          provider = catalog["providers"][0]
          before = {row["operation_id"] for row in provider["operations"]}
          assert removed <= before, sorted(removed - before)
          provider["operations"] = [
              row for row in provider["operations"]
              if row["operation_id"] not in removed
          ]
          after = {row["operation_id"] for row in provider["operations"]}
          assert len(before) == 29
          assert len(after) == 21
          assert not (after & removed)
          provider["display_name"] = "Agent Toolbelt 通用代理工具"
          provider["description"] = (
              "通过 Agent Toolbelt 官方 API 调用 20 项通用代理工具；"
              "已移除仅支持美国交易所、不能服务 A 股的 8 项股票研究工具。"
          )
          provider["catalog_policy"] = (
              "固定开放 21 项能力：1 项本地目录和 20 项官方通用工具；"
              "每个票据最多一次受限请求，参数、正文、数组、文本、图片、URL、"
              "超时和响应体积均受硬上限约束。"
          )
          provider["execution_policy"] = (
              "API Key 仅由 GitHub Repository Secret 注入；不接受客户端凭据、"
              "任意工具名、任意路径、股票研究工具、Watchlist CRUD、交易、下单、"
              "Webhook 或后台监控。URL 型工具仅接受公开 HTTPS 地址并拒绝本机、"
              "私网和保留地址字面量。"
          )
          limits = provider["limits"]
          limits["fixed_upstream_tool_count"] = 20
          limits["stock_research_tools_allowed"] = False
          limits["us_equities_only_tools_allowed"] = False
          limits["a_share_research_via_agent_toolbelt_allowed"] = False
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          schema_path = provider_root / "ticket.schema.json"
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          enum = schema["properties"]["operation"]["enum"]
          assert removed <= set(enum)
          schema["properties"]["operation"]["enum"] = [
              operation for operation in enum if operation not in removed
          ]
          assert len(schema["properties"]["operation"]["enum"]) == 21
          schema_path.write_text(
              json.dumps(schema, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          readme = """# Agent Toolbelt 通用代理工具

正式票据前缀：

```text
[api-agent-toolbelt]
```

正式凭据：

```text
GitHub Repository Secret: AGENT_TOOLBELT_KEY
```

Provider 固定访问：

```text
https://www.agenttoolbelt.live
```

固定开放 **21 项能力**：

- 1 项本地能力目录；
- 20 项通用工具：文本提取、Token 计算、Schema 生成、CSV 转 JSON、Markdown 转换、公开网页元数据与摘要、正则、Cron、地址标准化、色板、品牌包、图片元数据清理、会议行动项、提示词优化、文档比较、合同条款提取、模拟 API 响应、依赖漏洞审计和上下文打包。

以下 8 项仅限美国交易所的股票研究工具已经从 Provider 目录、票据 Schema 和运行时白名单中删除：

```text
stock-thesis
earnings-analysis
insider-signal
valuation-snapshot
bear-vs-bull
compare-stocks
moat-analysis
watchlist-scan
```

删除原因：这些工具只接受 NYSE、NASDAQ、AMEX 股票代码，不能分析 A 股；保留会造成错误路由和无效额度消耗。A 股行情与财务数据应由 AlphaFeed、Tushare、AKShare、BaoStock 等中国市场 Provider 提供。

安全边界：

- 每个票据最多一次上游请求；
- 仅允许固定 `/api/tools/<allowlisted-tool>` 路径；
- 不开放任何股票研究工具、Watchlist、交易、下单、Webhook、任意工具名、任意主机或客户端凭据；
- URL 工具只接受公开 HTTPS 地址，拒绝本机、私网、保留地址字面量和带账号密码的 URL；
- 票据只允许公开、非个人数据。合同、会议记录和其他文本不得包含个人信息或机密材料；
- 合同分析不构成法律意见；
- 上游调用会消耗免费额度或产生费用，API 中心不会自动循环或后台监控。

Agent Toolbelt 官方 API 使用 Bearer Key。未配置 `AGENT_TOOLBELT_KEY` 时，本地能力目录仍可读取，但真实上游调用会返回结构化缺失凭据错误。
"""
          (provider_root / "README.md").write_text(readme, encoding="utf-8")

          test_file = provider_root / "tests" / "test_agent_toolbelt_task.py"
          tests = test_file.read_text(encoding="utf-8")
          tests = tests.replace(
              'self.assertEqual(len(provider["operations"]), 29)',
              'self.assertEqual(len(provider["operations"]), 21)',
          )
          tests = tests.replace(
              '        self.assertIn("stock-thesis", operation_ids)\n'
              '        self.assertIn("watchlist-scan", operation_ids)\n',
              '        self.assertNotIn("stock-thesis", operation_ids)\n'
              '        self.assertNotIn("watchlist-scan", operation_ids)\n'
              '        self.assertNotIn("valuation-snapshot", operation_ids)\n',
          )
          tests = tests.replace(
              '        self.assertIn("context-window-packer", operation_ids)\n',
              '        self.assertIn("context-window-packer", operation_ids)\n'
              '        self.assertEqual(provider["limits"]["fixed_upstream_tool_count"], 20)\n'
              '        self.assertFalse(provider["limits"]["stock_research_tools_allowed"])\n'
              '        self.assertFalse(provider["limits"]["a_share_research_via_agent_toolbelt_allowed"])\n',
          )
          tests = tests.replace(
              '            "stock-thesis",\n'
              '            {"ticker": "NVDA", "timeHorizon": "3-5 years"},\n',
              '            "token-counter",\n'
              '            {"text": "公开证据包", "models": ["gpt-4o"]},\n',
          )
          tests = tests.replace(
              '            "https://www.agenttoolbelt.live/api/tools/stock-thesis",',
              '            "https://www.agenttoolbelt.live/api/tools/token-counter",',
          )
          tests = tests.replace(
              '{"ticker": "NVDA", "timeHorizon": "3-5 years"},',
              '{"text": "公开证据包", "models": ["gpt-4o"]},',
          )
          tests = tests.replace(
              '    def test_ticket_schema_rejects_arbitrary_operation_and_bad_ticker(self):\n'
              '        bad = self.ticket("stock-thesis", {"ticker": "../etc/passwd"})\n',
              '    def test_ticket_schema_rejects_removed_stock_and_arbitrary_operation(self):\n'
              '        bad = self.ticket("stock-thesis", {"ticker": "NVDA"})\n',
          )
          tests = tests.replace(
              '            "tool": "stock-thesis",\n'
              '            "result": {"ticker": "NVDA", "verdict": "bullish"},',
              '            "tool": "token-counter",\n'
              '            "result": {"characterCount": 5, "results": {"gpt-4o": 3}},',
          )
          tests = tests.replace(
              '                        "stock-thesis",\n'
              '                        {"ticker": "NVDA"},',
              '                        "token-counter",\n'
              '                        {"text": "公开文本", "models": ["gpt-4o"]},',
          )
          test_file.write_text(tests, encoding="utf-8")

          validate_path = Path(".github/workflows/agent-toolbelt-provider-validate.yml")
          validate = validate_path.read_text(encoding="utf-8")
          validate = validate.replace("assert len(operation_ids) == 29", "assert len(operation_ids) == 21")
          validate = validate.replace("assert 'stock-thesis' in operation_ids", "assert 'stock-thesis' not in operation_ids")
          validate = validate.replace("assert 'watchlist-scan' in operation_ids", "assert 'watchlist-scan' not in operation_ids")
          validate = validate.replace(
              "          assert 'context-window-packer' in operation_ids\n",
              "          assert 'context-window-packer' in operation_ids\n"
              "          assert provider['limits']['fixed_upstream_tool_count'] == 20\n"
              "          assert provider['limits']['stock_research_tools_allowed'] is False\n"
              "          assert provider['limits']['a_share_research_via_agent_toolbelt_allowed'] is False\n",
          )
          validate_path.write_text(validate, encoding="utf-8")

          api_validate_path = Path(".github/workflows/api-catalog-validate.yml")
          api_validate = api_validate_path.read_text(encoding="utf-8")
          api_validate = api_validate.replace("== 368", "== 360")
          api_validate = api_validate.replace("'managed_operations': 368", "'managed_operations': 360")
          api_validate = api_validate.replace("len(agent_toolbelt['operations']) == 29", "len(agent_toolbelt['operations']) == 21")
          api_validate = api_validate.replace("'agent_toolbelt_operations': 29", "'agent_toolbelt_operations': 21")
          api_validate = api_validate.replace(
              "          assert agent_toolbelt['limits']['fixed_api_host'] == 'www.agenttoolbelt.live'\n",
              "          assert agent_toolbelt['limits']['fixed_api_host'] == 'www.agenttoolbelt.live'\n"
              "          agent_toolbelt_ops = {row['operation_id'] for row in agent_toolbelt['operations']}\n"
              "          assert 'stock-thesis' not in agent_toolbelt_ops\n"
              "          assert 'valuation-snapshot' not in agent_toolbelt_ops\n"
              "          assert agent_toolbelt['limits']['fixed_upstream_tool_count'] == 20\n"
              "          assert agent_toolbelt['limits']['stock_research_tools_allowed'] is False\n",
          )
          api_validate_path.write_text(api_validate, encoding="utf-8")

          catalog_test_path = root / "tests" / "test_api_catalog.py"
          catalog_test = catalog_test_path.read_text(encoding="utf-8")
          catalog_test = catalog_test.replace('"agent-toolbelt": 29', '"agent-toolbelt": 21')
          catalog_test = catalog_test.replace('catalog["managed_operation_count"], 368', 'catalog["managed_operation_count"], 360')
          catalog_test = catalog_test.replace('len(agent_toolbelt["operations"]), 29', 'len(agent_toolbelt["operations"]), 21')
          catalog_test = catalog_test.replace(
              '        self.assertEqual(\n            agent_toolbelt["limits"]["fixed_api_host"],\n            "www.agenttoolbelt.live",\n        )\n',
              '        self.assertEqual(\n            agent_toolbelt["limits"]["fixed_api_host"],\n            "www.agenttoolbelt.live",\n        )\n'
              '        agent_toolbelt_ops = {row["operation_id"] for row in agent_toolbelt["operations"]}\n'
              '        self.assertNotIn("stock-thesis", agent_toolbelt_ops)\n'
              '        self.assertNotIn("valuation-snapshot", agent_toolbelt_ops)\n'
              '        self.assertEqual(agent_toolbelt["limits"]["fixed_upstream_tool_count"], 20)\n'
              '        self.assertFalse(agent_toolbelt["limits"]["stock_research_tools_allowed"])\n',
          )
          catalog_test_path.write_text(catalog_test, encoding="utf-8")

          capability_path = root / "tests" / "test_capability_maximization.py"
          capability = capability_path.read_text(encoding="utf-8")
          capability = capability.replace("            368,", "            360,")
          capability = capability.replace('"agent-toolbelt": 29', '"agent-toolbelt": 21')
          capability_path.write_text(capability, encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/agent-toolbelt/requirements.txt
          python -m pip check

      - name: Rebuild and validate catalogs
        run: |
          set -euo pipefail
          python api-center/build_catalog_market_search.py
          python -m py_compile \
            api-center/agent-toolbelt/agent_toolbelt_task.py \
            api-center/agent-toolbelt/tests/test_agent_toolbelt_task.py \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py
          python -m unittest discover -s api-center/agent-toolbelt/tests -p 'test_*.py' -v
          python -m unittest api-center.tests.test_api_catalog -v
          python -m unittest api-center.tests.test_capability_maximization -v
          python - <<'PY'
          import json
          from pathlib import Path

          removed = {
              "stock-thesis", "earnings-analysis", "insider-signal",
              "valuation-snapshot", "bear-vs-bull", "compare-stocks",
              "moat-analysis", "watchlist-scan",
          }
          provider = json.loads(Path("api-center/agent-toolbelt/provider-catalog.json").read_text())["providers"][0]
          schema = json.loads(Path("api-center/agent-toolbelt/ticket.schema.json").read_text())
          unified = json.loads(Path("api-center/api-catalog.json").read_text())
          operation_ids = {row["operation_id"] for row in provider["operations"]}
          schema_ids = set(schema["properties"]["operation"]["enum"])
          unified_provider = next(row for row in unified["managed_providers"] if row["provider_id"] == "agent-toolbelt")
          unified_ids = {row["operation_id"] for row in unified_provider["operations"]}
          assert len(operation_ids) == len(schema_ids) == len(unified_ids) == 21
          assert not (removed & operation_ids)
          assert not (removed & schema_ids)
          assert not (removed & unified_ids)
          assert provider["limits"]["fixed_upstream_tool_count"] == 20
          assert provider["limits"]["stock_research_tools_allowed"] is False
          assert unified["managed_operation_count"] == 360
          print(json.dumps({
              "status": "PASS",
              "agent_toolbelt_operations": 21,
              "agent_toolbelt_upstream_tools": 20,
              "removed_stock_tools": sorted(removed),
              "managed_operations": 360,
          }))
          PY
          git diff --check

      - name: Commit removal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-center/agent-toolbelt \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/tests/test_api_catalog.py \
            api-center/tests/test_capability_maximization.py \
            .github/workflows/agent-toolbelt-provider-validate.yml \
            .github/workflows/api-catalog-validate.yml
          git commit -m "refactor: remove Agent Toolbelt stock tools"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
