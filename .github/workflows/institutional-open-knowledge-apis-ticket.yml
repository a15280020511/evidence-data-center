name: Managed Institutional Open Knowledge APIs

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-institutional-open-knowledge
  cancel-in-progress: false

jobs:
  execute:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[intel-institutional-knowledge]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/institutional-open-knowledge-apis/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/institutional-open-knowledge-apis/requirements.txt
          python -m pip check
      - name: Compile
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/institutional-open-knowledge-apis/institutional_open_knowledge_task.py
      - name: Prepare ticket
        id: prepare
        continue-on-error: true
        run: python api-center/institutional-open-knowledge-apis/institutional_open_knowledge_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir institutional-knowledge-artifacts
      - name: Comment accepted
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/institutional-open-knowledge-apis/institutional_open_knowledge_task.py render --output-dir institutional-knowledge-artifacts --phase accepted > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Comment rejected
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/institutional-open-knowledge-apis/institutional_open_knowledge_task.py render --output-dir institutional-knowledge-artifacts --phase rejected > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Execute one request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: python api-center/institutional-open-knowledge-apis/institutional_open_knowledge_task.py execute --ticket institutional-knowledge-artifacts/ticket.json --output-dir institutional-knowledge-artifacts
      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: institutional-knowledge-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: institutional-knowledge-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish result
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/institutional-open-knowledge-apis/institutional_open_knowledge_task.py render --output-dir institutional-knowledge-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Mark failure
        if: always() && (steps.prepare.outputs.accepted != 'true' || steps.execute.outputs.status != 'INTEL_INSTITUTIONAL_KNOWLEDGE_COMPLETED' || steps.upload.outcome != 'success')
        run: exit 1
