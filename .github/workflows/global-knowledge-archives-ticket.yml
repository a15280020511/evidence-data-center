name: Managed Global Knowledge Archives

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-knowledge-global
  cancel-in-progress: false

jobs:
  execute-knowledge:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-knowledge]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GOOGLE_PUBLIC_INTELLIGENCE_API_KEY: ${{ secrets.GOOGLE_PUBLIC_INTELLIGENCE_API_KEY }}
      BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-knowledge-archives/requirements.txt
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python -m pip check
      - name: Compile knowledge control plane
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-knowledge-archives/global_knowledge_archives_task.py
      - name: Parse and authorize knowledge ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/global-knowledge-archives/global_knowledge_archives_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir knowledge-artifacts
      - name: Publish acceptance or rejection
        if: always()
        run: |
          phase=rejected
          if [[ "${{ steps.prepare.outputs.accepted }}" == "true" ]]; then phase=accepted; fi
          python api-center/global-knowledge-archives/global_knowledge_archives_task.py render \
            --output-dir knowledge-artifacts --phase "$phase" > knowledge-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@knowledge-comment.md
      - name: Execute one bounded read-only operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/global-knowledge-archives/global_knowledge_archives_task.py execute \
            --ticket knowledge-artifacts/ticket.json \
            --output-dir knowledge-artifacts
      - name: Upload verified evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-knowledge-${{ github.event.issue.number }}-${{ github.run_id }}
          path: knowledge-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified result
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/global-knowledge-archives/global_knowledge_archives_task.py render \
            --output-dir knowledge-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > knowledge-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@knowledge-comment.md
      - name: Fail closed
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_KNOWLEDGE_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
