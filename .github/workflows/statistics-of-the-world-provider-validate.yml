name: Validate Statistics of the World Provider

on:
  pull_request:
    paths:
      - "api-center/statistics-of-the-world/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/statistics-of-the-world-provider-validate.yml"
      - ".github/workflows/statistics-of-the-world-api-ticket.yml"
      - ".github/statistics-of-the-world-live-smoke.once"
  push:
    branches: [main]
    paths:
      - "api-center/statistics-of-the-world/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/statistics-of-the-world-provider-validate.yml"
      - ".github/workflows/statistics-of-the-world-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/statistics-of-the-world/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/statistics-of-the-world/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/statistics-of-the-world/statistics_of_the_world_task.py api-center/statistics-of-the-world/tests/*.py
          python -m unittest discover -s api-center/statistics-of-the-world/tests -p 'test_*.py' -v

      - name: Validate fixed read-only contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/statistics-of-the-world')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'statistics-of-the-world'
          assert provider['optional_secret_environment_variable'] == 'SOTW_API_KEY'
          assert len(provider['operations']) == 11
          limits = provider['limits']
          assert limits['fixed_api_host'] == 'statisticsoftheworld.com'
          assert limits['requests_per_ticket_max'] == 1
          assert limits['bulk_download_allowed'] is False
          assert limits['natural_language_chat_allowed'] is False
          assert limits['write_operations_allowed'] is False
          assert limits['secret_values_exposed'] is False
          print(json.dumps({'status': 'PASS', 'operations': 11}))
          PY

      - name: Execute one-shot anonymous live probe
        if: hashFiles('.github/statistics-of-the-world-live-smoke.once') != ''
        run: |
          set -euo pipefail
          mkdir -p sotw-live-evidence
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          provider_dir = Path('api-center/statistics-of-the-world').resolve()
          sys.path.insert(0, str(provider_dir))
          import statistics_of_the_world_task as task
          payload, metadata = task.query_sotw(
              'list-countries', {}, timeout=20, max_bytes=2000000, max_rows=500
          )
          data = payload.get('data') if isinstance(payload, dict) else None
          summary = {
              'provider': 'statistics-of-the-world',
              'operation': 'list-countries',
              'status': 'PASS',
              'real_upstream_request_attempted': True,
              'authentication_mode': 'anonymous',
              'returned_rows': len(data) if isinstance(data, list) else metadata.get('row_count'),
              'request_origin': metadata.get('request_origin'),
              'http_status': metadata.get('http_status'),
              'rate_limit_limit': metadata.get('rate_limit_limit'),
              'rate_limit_remaining': metadata.get('rate_limit_remaining'),
              'rate_limit_tier': metadata.get('rate_limit_tier'),
              'secret_value_exposed': False,
          }
          Path('sotw-live-evidence/summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False))
          assert summary['http_status'] == 200
          assert isinstance(summary['returned_rows'], int) and summary['returned_rows'] >= 200
          PY

      - name: Upload one-shot live evidence
        if: always() && hashFiles('.github/statistics-of-the-world-live-smoke.once') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statistics-of-the-world-live-smoke-${{ github.run_id }}
          path: sotw-live-evidence/summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify repository contains no credential material
        run: git diff --check
