name: Validate Statistics of the World Provider

on:
  pull_request:
    paths:
      - "api-center/statistics-of-the-world/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/statistics-of-the-world-provider-validate.yml"
      - ".github/workflows/statistics-of-the-world-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/statistics-of-the-world/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - "api-center/tests/test_capability_maximization.py"
      - ".github/workflows/statistics-of-the-world-provider-validate.yml"
      - ".github/workflows/statistics-of-the-world-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/statistics-of-the-world/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/statistics-of-the-world/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/statistics-of-the-world/statistics_of_the_world_task.py api-center/statistics-of-the-world/tests/*.py
          python -m unittest discover -s api-center/statistics-of-the-world/tests -p 'test_*.py' -v

      - name: Validate fixed read-only contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/statistics-of-the-world')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'statistics-of-the-world'
          assert provider['optional_secret_environment_variable'] == 'SOTW_API_KEY'
          assert len(provider['operations']) == 11
          limits = provider['limits']
          assert limits['fixed_api_host'] == 'statisticsoftheworld.com'
          assert limits['requests_per_ticket_max'] == 1
          assert limits['bulk_download_allowed'] is False
          assert limits['natural_language_chat_allowed'] is False
          assert limits['write_operations_allowed'] is False
          assert limits['secret_values_exposed'] is False
          print(json.dumps({'status': 'PASS', 'operations': 11}))
          PY

      - name: Verify repository contains no credential material
        run: git diff --check
