name: Integrate WHO GHO OData Into Intelligence Center

on:
  push:
    branches:
      - feat/add-overture-oecd-alphafeed
    paths:
      - ".github/workflows/who-gho-integration.yml"
      - ".github/scripts/integrate_who_gho.py"
      - ".github/who-gho-integration-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-who-gho-intelligence-center
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/add-overture-oecd-alphafeed
          fetch-depth: 0

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Probe current WHO GHO OData compatibility endpoint
        run: |
          set -euo pipefail
          mkdir -p who-gho-probe
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          urls = {
              "indicator": "https://ghoapi.azureedge.net/api/Indicator?%24top=1&%24format=json",
              "dimension": "https://ghoapi.azureedge.net/api/Dimension?%24top=1&%24format=json",
              "china_life_expectancy": "https://ghoapi.azureedge.net/api/WHOSIS_000001?%24filter=SpatialDim%20eq%20%27CHN%27&%24top=1&%24format=json",
          }
          results = {}
          for name, url in urls.items():
              request = urllib.request.Request(
                  url,
                  method="GET",
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "intelligence-center-who-gho-integration/1",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(5_000_001)
                  if len(raw) > 5_000_000:
                      raise SystemExit(f"{name} response exceeds 5 MB")
                  status = response.status
                  content_type = response.headers.get("Content-Type", "")
              data = json.loads(raw.decode("utf-8"))
              values = data.get("value")
              if status != 200 or not isinstance(values, list) or not values:
                  raise SystemExit(f"WHO GHO probe failed for {name}: status={status}, rows={len(values or [])}")
              results[name] = {
                  "http_status": status,
                  "content_type": content_type,
                  "row_count": len(values),
                  "sample_keys": sorted(values[0])[:20] if isinstance(values[0], dict) else [],
                  "authorization_sent": False,
                  "secret_values_exposed": False,
              }
          summary = {
              "schema_version": "who-gho-live-probe-v1",
              "status": "PASS",
              "official_origin": "https://ghoapi.azureedge.net/api",
              "authentication": "none",
              "requests": results,
              "secret_values_exposed": False,
          }
          Path("who-gho-probe/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Generate bounded WHO GHO provider
        run: |
          set -euo pipefail
          python .github/scripts/integrate_who_gho.py

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/who-gho/requirements.txt
          python -m pip check

      - name: Rebuild deterministic Intelligence Center catalog
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py

      - name: Validate WHO provider and repository contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_catalog.py \
            api-center/build_catalog_market_search.py \
            api-center/managed_provider_runtime.py \
            api-center/who-gho/who_gho_task.py \
            api-center/who-gho/tests/*.py \
            api-center/tests/*.py
          python -m unittest discover -s api-center/who-gho/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/who-gho')
          provider_catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          ticket_schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(ticket_schema)
          provider = provider_catalog['providers'][0]
          for operation in provider['operations']:
              Draft202012Validator.check_schema(operation['parameter_schema'])
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          who = providers['who-gho-odata']
          assert provider['required_secret_environment_variable'] == ''
          assert len(provider['operations']) == 8
          assert who['operation_count'] == 8
          assert catalog['managed_provider_count'] == 32
          assert catalog['enabled_managed_provider_count'] == 32
          assert catalog['managed_operation_count'] == 577
          assert who['limits']['fixed_api_host'] == 'ghoapi.azureedge.net'
          assert who['limits']['arbitrary_odata_filters_allowed'] is False
          assert who['limits']['automatic_pagination_allowed'] is False
          assert who['limits']['whole_database_download_allowed'] is False
          assert who['limits']['write_operations_allowed'] is False
          assert who['limits']['legacy_endpoint_migration_watch_required'] is True
          assert catalog['secret_values_exposed'] is False
          print(json.dumps({
              'status': 'PASS',
              'managed_providers': catalog['managed_provider_count'],
              'managed_operations': catalog['managed_operation_count'],
              'who_gho_operations': who['operation_count'],
              'who_gho_authentication': 'none',
          }))
          PY
          python api-center/build_catalog_market_search.py
          git diff --check

      - name: Upload live probe and generated evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: who-gho-integration-${{ github.run_id }}
          path: |
            who-gho-probe/summary.json
            api-center/who-gho/provider-catalog.json
            api-center/who-gho/ticket.schema.json
            api-center/api-catalog.json
            api-center/api-catalog.md
          if-no-files-found: error
          retention-days: 30

      - name: Stage workflow templates and remove non-workflow one-shot files
        run: |
          set -euo pipefail
          mkdir -p api-center/who-gho/.workflow-templates
          cp .github/workflows/api-catalog-validate.yml api-center/who-gho/.workflow-templates/api-catalog-validate.yml
          cp .github/workflows/who-gho-api-ticket.yml api-center/who-gho/.workflow-templates/who-gho-api-ticket.yml
          cp .github/workflows/who-gho-provider-validate.yml api-center/who-gho/.workflow-templates/who-gho-provider-validate.yml
          git restore --source=HEAD -- .github/workflows/api-catalog-validate.yml
          rm -f .github/workflows/who-gho-api-ticket.yml .github/workflows/who-gho-provider-validate.yml
          rm -rf who-gho-probe
          rm -f .github/scripts/integrate_who_gho.py .github/who-gho-integration-trigger.txt

      - name: Commit generated provider and catalog
        run: |
          set -euo pipefail
          git config user.name "a15280020511"
          git config user.email "270211234+a15280020511@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat: add WHO GHO OData to Intelligence Center"
          git push origin HEAD:feat/add-overture-oecd-alphafeed
