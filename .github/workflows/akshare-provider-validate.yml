name: Validate AKShare Provider

on:
  pull_request:
    paths:
      - "api-center/akshare/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - ".github/workflows/akshare-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/akshare/**"
      - "api-center/build_catalog.py"
      - "api-center/api-catalog.json"
      - ".github/workflows/akshare-provider-validate.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 0"

permissions:
  contents: read

concurrency:
  group: validate-akshare-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-akshare-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/akshare/requirements.txt

      - name: Install pinned adapter dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/akshare/requirements.txt
          python -m pip check
          python - <<'PY'
          import akshare
          assert akshare.__version__ == "1.18.74", akshare.__version__
          print({"akshare_version": akshare.__version__})
          PY

      - name: Compile and run adapter tests
        run: |
          set -euo pipefail
          python -m py_compile api-center/akshare/*.py
          python -m unittest discover -s api-center/akshare/tests -v

      - name: Execute no-network capability probe
        run: |
          set -euo pipefail
          mkdir -p akshare-validation
          cat > akshare-validation/ticket.json <<'JSON'
          {
            "task_id": "akshare-provider-validation-0001",
            "provider": "akshare",
            "operation": "catalog-capabilities",
            "objective": "Validate the fixed AKShare capability catalog without calling an upstream market-data site.",
            "parameters": {},
            "data_policy": {
              "classification": "public",
              "contains_personal_data": false
            },
            "acceptance": {
              "timeout_seconds": 30,
              "max_response_bytes": 500000
            }
          }
          JSON
          python api-center/akshare/akshare_task.py execute \
            --ticket akshare-validation/ticket.json \
            --output-dir akshare-validation/output
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("akshare-validation/output")
          snapshot = json.loads((root / "akshare-snapshot.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "artifact-manifest.json").read_text(encoding="utf-8"))
          assert snapshot["status"] == "API_AKSHARE_COMPLETED", snapshot
          assert snapshot["security"]["arbitrary_functions_allowed"] is False
          assert snapshot["security"]["arbitrary_urls_allowed"] is False
          assert snapshot["security"]["brokerage_execution_allowed"] is False
          assert manifest["files"]
          print({"status": snapshot["status"], "artifact_files": len(manifest["files"])})
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: akshare-provider-validation-${{ github.run_id }}
          path: akshare-validation/
          if-no-files-found: warn
          retention-days: 30
