name: NOAA CDO PR Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/noaa-cdo-token'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Build catalog and run provider tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/noaa-cdo/requirements.txt
          python - <<'PY'
          from pathlib import Path
          path = Path('api-center/tests/test_api_catalog.py')
          text = path.read_text(encoding='utf-8')
          if '"noaa-cdo": 5,' not in text:
              marker = '    "google-public-intelligence": 9,\n'
              if marker not in text:
                  raise SystemExit('catalog insertion marker missing')
              text = text.replace(marker, marker + '    "noaa-cdo": 5,\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/noaa-cdo/tests -p 'test_*.py' -v
          python -m unittest api-center.tests.test_api_catalog -v
          git diff --check

      - name: Validate token and discover Fuzhou stations
        env:
          NOAA_CDO_TOKEN: ${{ secrets.NOAA_CDO_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          token = (os.environ.get('NOAA_CDO_TOKEN') or '').strip()
          result = {'secret_name':'NOAA_CDO_TOKEN','configured':bool(token),'token_exposed':False}
          if token:
              headers = {'token':token,'Accept':'application/json','User-Agent':'evidence-data-center-noaa-cdo/1'}
              base = 'https://www.ncei.noaa.gov/cdo-web/api/v2'
              r1 = requests.get(base + '/datasets', params={'limit':1}, headers=headers, timeout=30, allow_redirects=False)
              r1.raise_for_status()
              r2 = requests.get(base + '/stations', params={'datasetid':'GHCND','extent':'25.9,119.0,26.2,119.5','limit':25}, headers=headers, timeout=30, allow_redirects=False)
              r2.raise_for_status()
              rows = r2.json().get('results') or []
              result.update({'status':'PASS','datasets_http_status':r1.status_code,'stations_http_status':r2.status_code,'station_count':len(rows),'station_ids':[row.get('id') for row in rows]})
          else:
              result['status'] = 'SECRET_NOT_CONFIGURED'
          Path('/tmp/noaa-cdo-token-test.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Analyze Fuzhou 2015-2024 daily climate
        run: |
          python - <<'PY'
          import calendar, json, math, statistics
          from collections import defaultdict
          from datetime import date
          from pathlib import Path
          import requests

          params = {
              'dataset':'daily-summaries','stations':'CHM00058847',
              'startDate':'2015-01-01','endDate':'2024-12-31',
              'dataTypes':'TAVG,TMAX,TMIN,PRCP','format':'json','units':'metric',
              'includeStationName':'true','includeStationLocation':'true'
          }
          response = requests.get('https://www.ncei.noaa.gov/access/services/data/v1', params=params, timeout=120, allow_redirects=False, headers={'User-Agent':'evidence-data-center-fuzhou-analysis/1'})
          response.raise_for_status()
          raw = response.json()
          if not isinstance(raw, list) or len(raw) < 2500:
              raise SystemExit(f'insufficient Fuzhou observations: {len(raw) if isinstance(raw,list) else 0}')

          def num(row, key):
              value = row.get(key)
              if value in (None, ''): return None
              try: value = float(value)
              except (TypeError, ValueError): return None
              return value if math.isfinite(value) else None

          rows = []
          for item in raw:
              rows.append({'date':date.fromisoformat(str(item['DATE'])[:10]),'tavg':num(item,'TAVG'),'tmax':num(item,'TMAX'),'tmin':num(item,'TMIN'),'prcp':num(item,'PRCP')})
          tavg = [r for r in rows if r['tavg'] is not None]
          tmax = [r for r in rows if r['tmax'] is not None]
          prcp = [r for r in rows if r['prcp'] is not None]
          by_month = defaultdict(list)
          for row in rows: by_month[row['date'].month].append(row)
          monthly = []
          for month in range(1,13):
              group = by_month[month]
              a = [r['tavg'] for r in group if r['tavg'] is not None]
              x = [r['tmax'] for r in group if r['tmax'] is not None]
              p = [r['prcp'] for r in group if r['prcp'] is not None]
              years = len({r['date'].year for r in group}) or 1
              monthly.append({
                  'month':month,'name':calendar.month_abbr[month],
                  'mean_tavg_c':round(statistics.fmean(a),2) if a else None,
                  'mean_tmax_c':round(statistics.fmean(x),2) if x else None,
                  'mean_monthly_precip_mm':round(sum(p)/years,1) if p else None,
                  'share_tavg_le_20':round(sum(1 for r in group if r['tavg'] is not None and r['tavg'] <= 20)/max(1,len(a)),3),
                  'share_tavg_le_15':round(sum(1 for r in group if r['tavg'] is not None and r['tavg'] <= 15)/max(1,len(a)),3),
                  'share_tmax_ge_30':round(sum(1 for r in group if r['tmax'] is not None and r['tmax'] >= 30)/max(1,len(x)),3),
                  'share_rain_ge_1mm':round(sum(1 for r in group if r['prcp'] is not None and r['prcp'] >= 1)/max(1,len(p)),3),
                  'share_rain_ge_10mm':round(sum(1 for r in group if r['prcp'] is not None and r['prcp'] >= 10)/max(1,len(p)),3)
              })
          annual = []
          for year in sorted({r['date'].year for r in rows}):
              values = [r['prcp'] for r in rows if r['date'].year == year and r['prcp'] is not None]
              if values: annual.append(sum(values))
          result = {
              'source':'NOAA/NCEI','station':'CHM00058847','period':'2015-2024','row_count':len(raw),
              'mean_tavg_c':round(statistics.fmean(r['tavg'] for r in tavg),2),
              'share_days_tavg_le_20':round(sum(r['tavg'] <= 20 for r in tavg)/len(tavg),3),
              'share_days_tavg_le_15':round(sum(r['tavg'] <= 15 for r in tavg)/len(tavg),3),
              'share_days_tmax_ge_30':round(sum(r['tmax'] >= 30 for r in tmax)/len(tmax),3),
              'share_days_tmax_ge_35':round(sum(r['tmax'] >= 35 for r in tmax)/len(tmax),3),
              'share_rain_days_ge_1mm':round(sum(r['prcp'] >= 1 for r in prcp)/len(prcp),3),
              'share_heavy_rain_days_ge_10mm':round(sum(r['prcp'] >= 10 for r in prcp)/len(prcp),3),
              'mean_annual_precip_mm':round(statistics.fmean(annual),1),
              'coverage':{'tavg':round(len(tavg)/len(rows),3),'tmax':round(len(tmax)/len(rows),3),'prcp':round(len(prcp)/len(rows),3)},
              'monthly':monthly
          }
          Path('/tmp/fuzhou-hotpot-climate.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Commit generated catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center/api-catalog.json api-center/api-catalog.md api-center/tests/test_api_catalog.py
          if git diff --cached --quiet; then
            echo 'Generated catalog already current.'
          else
            git commit -m 'feat: register NOAA CDO provider in intelligence catalog'
            git push origin HEAD:feat/noaa-cdo-token
          fi

      - name: Upload climate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzhou-hotpot-climate-${{ github.run_id }}
          path: |
            /tmp/noaa-cdo-token-test.json
            /tmp/fuzhou-hotpot-climate.json
          if-no-files-found: warn
          retention-days: 30
