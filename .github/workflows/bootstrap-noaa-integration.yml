name: Bootstrap NOAA Integration

on:
  push:
    branches: [feat/noaa-official-data]
    paths:
      - ".github/workflows/bootstrap-noaa-integration.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/noaa-official-data
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Write NOAA connectors, metadata, tests, and docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("api-center")
          connectors_dir = root / "connectors"
          connectors_dir.mkdir(parents=True, exist_ok=True)

          common_nws_backend = {
              "host": "https://api.weather.gov",
              "method": "GET",
              "encoding": "json",
              "allow": ["@context", "id", "type", "geometry", "properties", "features", "pagination", "title", "status", "detail", "instance", "correlationId"],
              "resilience": {
                  "circuit_breaker": {"interval": 60, "timeout": 20, "max_errors": 3, "log_status_change": True},
                  "rate_limit": {"max_rate": 2, "every": "1s", "capacity": 2}
              }
          }

          def nws_connector(identifier, endpoint, backend_path, *, path_parameters=None, query=None, rules=None, data_paths=None, timeout="20s"):
              backend = dict(common_nws_backend)
              backend["url_pattern"] = backend_path
              item = {
                  "id": identifier,
                  "enabled": True,
                  "endpoint": endpoint,
                  "method": "GET",
                  "output_encoding": "json",
                  "timeout": timeout,
                  "response_contract": {
                      "success_when_data_present": True,
                      "any_data_paths": data_paths or ["properties"]
                  },
                  "backend": backend
              }
              if path_parameters:
                  item["path_parameters"] = path_parameters
              if query:
                  item["input_query_strings"] = query
              if rules:
                  item["parameter_rules"] = rules
              return item

          coordinate_specs = {
              "latitude": {"pattern": "^-?[0-9]{1,2}(?:\\.[0-9]{1,6})?$", "max_length": 10},
              "longitude": {"pattern": "^-?[0-9]{1,3}(?:\\.[0-9]{1,6})?$", "max_length": 11}
          }
          grid_specs = {
              "office": {"pattern": "^[A-Z]{3}$", "max_length": 3},
              "grid_x": {"pattern": "^[0-9]{1,3}$", "max_length": 3},
              "grid_y": {"pattern": "^[0-9]{1,3}$", "max_length": 3}
          }
          station_specs = {
              "station_id": {"pattern": "^[A-Z0-9-]{3,16}$", "max_length": 16}
          }

          connectors = {
              "noaa-nws-points": nws_connector(
                  "noaa-nws-points",
                  "/data/noaa/nws/points/{latitude},{longitude}",
                  "/points/{latitude},{longitude}",
                  path_parameters=coordinate_specs,
                  data_paths=["properties"]
              ),
              "noaa-nws-forecast": nws_connector(
                  "noaa-nws-forecast",
                  "/data/noaa/nws/gridpoints/{office}/{grid_x},{grid_y}/forecast",
                  "/gridpoints/{office}/{grid_x},{grid_y}/forecast",
                  path_parameters=grid_specs,
                  query=["units"],
                  rules={"properties": {"units": {"type": "string", "enum": ["us", "si"]}}},
                  data_paths=["properties.periods"]
              ),
              "noaa-nws-forecast-hourly": nws_connector(
                  "noaa-nws-forecast-hourly",
                  "/data/noaa/nws/gridpoints/{office}/{grid_x},{grid_y}/forecast/hourly",
                  "/gridpoints/{office}/{grid_x},{grid_y}/forecast/hourly",
                  path_parameters=grid_specs,
                  query=["units"],
                  rules={"properties": {"units": {"type": "string", "enum": ["us", "si"]}}},
                  data_paths=["properties.periods"]
              ),
              "noaa-nws-gridpoint-stations": nws_connector(
                  "noaa-nws-gridpoint-stations",
                  "/data/noaa/nws/gridpoints/{office}/{grid_x},{grid_y}/stations",
                  "/gridpoints/{office}/{grid_x},{grid_y}/stations",
                  path_parameters=grid_specs,
                  query=["limit", "cursor"],
                  rules={"properties": {"limit": {"type": "integer", "minimum": 1, "maximum": 100}, "cursor": {"type": "string", "max_length": 256}}},
                  data_paths=["features"]
              ),
              "noaa-nws-station-latest": nws_connector(
                  "noaa-nws-station-latest",
                  "/data/noaa/nws/stations/{station_id}/observations/latest",
                  "/stations/{station_id}/observations/latest",
                  path_parameters=station_specs,
                  query=["require_qc"],
                  rules={"properties": {"require_qc": {"type": "boolean"}}},
                  data_paths=["properties"]
              ),
              "noaa-nws-alerts-active": nws_connector(
                  "noaa-nws-alerts-active",
                  "/data/noaa/nws/alerts/active",
                  "/alerts/active",
                  query=["area", "point", "region", "zone", "urgency", "severity", "certainty", "status", "message_type", "event", "code", "limit", "cursor", "start", "end"],
                  rules={
                      "properties": {
                          "area": {"type": "string", "pattern": "^[A-Z]{2}(?:,[A-Z]{2})*$", "max_length": 80},
                          "point": {"type": "string", "pattern": "^-?[0-9]{1,2}(?:\\.[0-9]{1,6})?,-?[0-9]{1,3}(?:\\.[0-9]{1,6})?$", "max_length": 24},
                          "region": {"type": "string", "pattern": "^[A-Z]{2,8}$", "max_length": 8},
                          "zone": {"type": "string", "pattern": "^[A-Z0-9-]{3,20}(?:,[A-Z0-9-]{3,20})*$", "max_length": 220},
                          "urgency": {"type": "string", "max_length": 100},
                          "severity": {"type": "string", "max_length": 100},
                          "certainty": {"type": "string", "max_length": 100},
                          "status": {"type": "string", "max_length": 100},
                          "message_type": {"type": "string", "max_length": 100},
                          "event": {"type": "string", "max_length": 200},
                          "code": {"type": "string", "max_length": 100},
                          "limit": {"type": "integer", "minimum": 1, "maximum": 500},
                          "cursor": {"type": "string", "max_length": 256},
                          "start": {"type": "string", "max_length": 40},
                          "end": {"type": "string", "max_length": 40}
                      },
                      "required_any_of": [["area", "point", "region", "zone", "event", "code"]]
                  },
                  data_paths=["features"]
              ),
              "noaa-ncei-data-search": {
                  "id": "noaa-ncei-data-search",
                  "enabled": True,
                  "endpoint": "/data/noaa/ncei/search",
                  "method": "GET",
                  "output_encoding": "json",
                  "timeout": "30s",
                  "input_query_strings": ["dataset", "startDate", "endDate", "boundingBox", "stations", "dataTypes", "limit", "offset", "sortfield", "sortorder"],
                  "response_contract": {"success_when_data_present": True, "any_data_paths": ["results"]},
                  "backend": {
                      "host": "https://www.ncei.noaa.gov",
                      "url_pattern": "/access/services/search/v1/data",
                      "method": "GET",
                      "encoding": "json",
                      "allow": ["results", "totalCount", "formats", "errorMessage", "errorCode", "errors"],
                      "resilience": {
                          "circuit_breaker": {"interval": 60, "timeout": 30, "max_errors": 3, "log_status_change": True},
                          "rate_limit": {"max_rate": 1, "every": "1s", "capacity": 1}
                      }
                  },
                  "parameter_rules": {
                      "properties": {
                          "dataset": {"type": "string", "pattern": "^[a-z0-9-]{3,80}$", "max_length": 80},
                          "startDate": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$", "max_length": 10},
                          "endDate": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$", "max_length": 10},
                          "boundingBox": {"type": "string", "pattern": "^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$", "max_length": 80},
                          "stations": {"type": "string", "pattern": "^[A-Za-z0-9,_-]{1,1000}$", "max_length": 1000},
                          "dataTypes": {"type": "string", "pattern": "^[A-Za-z0-9,_-]{1,1000}$", "max_length": 1000},
                          "limit": {"type": "integer", "minimum": 1, "maximum": 1000},
                          "offset": {"type": "integer", "minimum": 0, "maximum": 1000000},
                          "sortfield": {"type": "string", "max_length": 80},
                          "sortorder": {"type": "string", "enum": ["asc", "desc"]}
                      },
                      "required_any_of": [["dataset"], ["startDate"], ["endDate"]]
                  },
                  "response_quality": {
                      "collection_path": "results",
                      "hard_limit": 1000,
                      "recommended_action": "Use a narrow dataset, date interval, station list or bounding box; do not use this connector for bulk archive mirroring."
                  }
              }
          }

          for identifier, connector in connectors.items():
              path = connectors_dir / f"{identifier}.connector.json"
              path.write_text(json.dumps(connector, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          metadata_path = root / "catalog-metadata.json"
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata["version"] = max(int(metadata.get("version", 0)), 6)
          entries = {
              "noaa-nws-points": {
                  "display_name": "NOAA/NWS 坐标网格解析",
                  "description": "把美国境内经纬度解析为 NWS 预报办公室、网格坐标、预报端点和观测站入口。",
                  "data_category": "weather-location-resolution",
                  "use_cases": ["美国地点预报准备", "确定 NWS 办公室与网格", "衔接官方预报和观测"],
                  "geographic_coverage": "美国及 NWS 服务区域",
                  "freshness": "请求时实时返回服务元数据",
                  "cost_class": "free-public-no-key",
                  "parameter_notes": {"latitude": "必填；十进制度纬度", "longitude": "必填；十进制度经度"},
                  "example_parameters": {"latitude": "38.8977", "longitude": "-77.0365"},
                  "limitations": ["主要面向美国及 NWS 服务区域", "先调用本连接器取得 office、gridX 和 gridY，再调用预报连接器", "NWS 要求合理限速并使用可识别的 User-Agent；网关采用保守限速"]
              },
              "noaa-nws-forecast": {
                  "display_name": "NOAA/NWS 官方分时预报",
                  "description": "按 NWS 办公室和网格坐标取得约 12 小时时段的官方文字与要素预报。",
                  "data_category": "weather-forecast",
                  "use_cases": ["美国天气决策", "风险与运营计划", "官方预报交叉核验"],
                  "geographic_coverage": "美国及 NWS 服务区域",
                  "freshness": "随对应 NWS 预报办公室更新",
                  "cost_class": "free-public-no-key",
                  "parameter_notes": {"office": "必填；三位 NWS 办公室代码", "grid_x": "必填；网格 X", "grid_y": "必填；网格 Y", "units": "可选；us 或 si"},
                  "example_parameters": {"office": "LWX", "grid_x": "97", "grid_y": "71", "units": "si"},
                  "limitations": ["网格参数必须先由 NOAA/NWS points 解析", "预报存在不确定性，不能视为观测事实"]
              },
              "noaa-nws-forecast-hourly": {
                  "display_name": "NOAA/NWS 官方逐小时预报",
                  "description": "按 NWS 网格取得逐小时官方天气预报。",
                  "data_category": "weather-hourly-forecast",
                  "use_cases": ["逐小时运营安排", "短时天气风险", "出行和活动计划"],
                  "geographic_coverage": "美国及 NWS 服务区域",
                  "freshness": "随对应 NWS 预报办公室更新",
                  "cost_class": "free-public-no-key",
                  "parameter_notes": {"office": "必填；三位 NWS 办公室代码", "grid_x": "必填；网格 X", "grid_y": "必填；网格 Y", "units": "可选；us 或 si"},
                  "example_parameters": {"office": "LWX", "grid_x": "97", "grid_y": "71", "units": "si"},
                  "limitations": ["只覆盖 NWS 服务区域", "逐小时预报仍需结合官方警报和现场观测"]
              },
              "noaa-nws-gridpoint-stations": {
                  "display_name": "NOAA/NWS 网格观测站列表",
                  "description": "取得指定 NWS 网格附近可用的官方观测站。",
                  "data_category": "weather-stations",
                  "use_cases": ["查找附近观测站", "为最新观测准备站点 ID", "观测覆盖核验"],
                  "geographic_coverage": "美国及 NWS 服务区域",
                  "freshness": "请求时返回站点目录",
                  "cost_class": "free-public-no-key",
                  "parameter_notes": {"office": "必填；NWS 办公室代码", "grid_x": "必填", "grid_y": "必填", "limit": "可选；最多 100", "cursor": "可选；分页游标"},
                  "example_parameters": {"office": "LWX", "grid_x": "97", "grid_y": "71", "limit": 20},
                  "limitations": ["站点可用性和报告频率不一致", "站点目录不等同于该站点当前有有效观测"]
              },
              "noaa-nws-station-latest": {
                  "display_name": "NOAA/NWS 站点最新观测",
                  "description": "按官方观测站 ID 取得最新天气观测及质量控制字段。",
                  "data_category": "weather-observations",
                  "use_cases": ["当前天气观测", "预报与实况比较", "短时风险核验"],
                  "geographic_coverage": "NWS/MADIS 可用站点",
                  "freshness": "取决于站点最新报告时间",
                  "cost_class": "free-public-no-key",
                  "parameter_notes": {"station_id": "必填；官方站点 ID", "require_qc": "可选；是否要求质量控制通过"},
                  "example_parameters": {"station_id": "KDCA", "require_qc": True},
                  "limitations": ["部分字段可能为空", "官方文档记录部分非中部时区站点的 24 小时最高/最低温字段存在上游缺失问题"]
              },
              "noaa-nws-alerts-active": {
                  "display_name": "NOAA/NWS 活动天气警报",
                  "description": "按州、坐标、区域、预警区或事件筛选当前有效的官方天气警报。",
                  "data_category": "weather-alerts",
                  "use_cases": ["灾害天气预警", "运营和出行风险", "应急态势核验"],
                  "geographic_coverage": "美国及 NWS 服务区域",
                  "freshness": "活动警报实时更新；以响应 sent、effective、expires 字段为准",
                  "cost_class": "free-public-no-key",
                  "parameter_notes": {"area": "州或领地两位代码，可逗号分隔", "point": "纬度,经度", "zone": "预警区代码", "event": "事件名称", "limit": "可选；1 至 500"},
                  "example_parameters": {"area": "DC", "limit": 20},
                  "limitations": ["必须至少提供一个地域或事件过滤条件，禁止无界拉取全部警报", "警报正文应结合发布时间和失效时间解释", "该端点不包含部分 SPC Tornado Watch 的 SEL 产品原文"]
              },
              "noaa-ncei-data-search": {
                  "display_name": "NOAA/NCEI 历史气象数据检索",
                  "description": "通过 NCEI Common Access Search Service 按数据集、日期、站点、数据类型或范围发现历史气象与气候数据记录。",
                  "data_category": "historical-weather-climate-discovery",
                  "use_cases": ["历史气象数据发现", "气候数据集与文件检索", "站点和日期范围核验"],
                  "geographic_coverage": "全球；具体范围取决于所选 NCEI 数据集",
                  "freshness": "随 NCEI 数据集更新；不同数据集延迟不同",
                  "cost_class": "free-public-no-key",
                  "parameter_notes": {"dataset": "必填；例如 daily-summaries", "startDate": "必填；YYYY-MM-DD", "endDate": "必填；YYYY-MM-DD", "stations": "可选；站点 ID 列表", "dataTypes": "可选；数据类型列表", "boundingBox": "可选；北,西,南,东", "limit": "可选；最多 1000"},
                  "example_parameters": {"dataset": "daily-summaries", "startDate": "2024-01-01", "endDate": "2024-01-07", "stations": "USW00094728", "limit": 20},
                  "limitations": ["这是数据发现接口，不是无界整库镜像工具", "结果中的数据集、时间、单位、站点和质量标识必须保留", "具体记录下载和格式能力依数据集而异", "大范围或长期批量任务应拆分并遵守公平使用"]
              }
          }
          metadata["connectors"].update(entries)
          metadata_path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          validation_path = Path(".github/workflows/api-catalog-validate.yml")
          validation = validation_path.read_text(encoding="utf-8")
          old = "manifest['connector_count'] == manifest['enabled_connector_count'] == 68"
          new = "manifest['connector_count'] == manifest['enabled_connector_count'] == 75"
          if old not in validation:
              raise SystemExit("expected connector-count invariant not found")
          validation_path.write_text(validation.replace(old, new, 1), encoding="utf-8")

          noaa_dir = root / "noaa"
          noaa_dir.mkdir(exist_ok=True)
          (noaa_dir / "README.md").write_text("""# NOAA official-data integration\n\nThis package exposes seven read-only NOAA capabilities through the Intelligence Center gateway.\n\n- NWS point-to-grid resolution\n- NWS period forecast\n- NWS hourly forecast\n- NWS gridpoint station discovery\n- NWS latest station observation\n- NWS active alerts\n- NCEI historical weather/climate data discovery\n\nNo NOAA secret is required. All endpoints are fixed to official HTTPS hosts, use conservative gateway rate limits, forbid arbitrary URLs, and remain isolated from the compute and expert repositories.\n\nOfficial references:\n\n- `https://www.weather.gov/documentation/services-web-api`\n- `https://api.weather.gov/openapi.json`\n- `https://www.ncei.noaa.gov/support/access-search-service-api-user-documentation`\n\nThe NWS API primarily covers the United States and NWS service areas. NCEI coverage depends on the selected dataset and can be global.\n""", encoding="utf-8")

          test_path = root / "tests" / "test_noaa_connectors.py"
          test_path.write_text('''import json\nimport unittest\nfrom pathlib import Path\n\nfrom jsonschema import Draft202012Validator\n\nROOT = Path(__file__).resolve().parents[1]\nCONNECTORS = ROOT / "connectors"\nSCHEMA = json.loads((ROOT / "connector.schema.json").read_text(encoding="utf-8"))\nNOAA_IDS = {\n    "noaa-nws-points",\n    "noaa-nws-forecast",\n    "noaa-nws-forecast-hourly",\n    "noaa-nws-gridpoint-stations",\n    "noaa-nws-station-latest",\n    "noaa-nws-alerts-active",\n    "noaa-ncei-data-search",\n}\n\nclass NoaaConnectorTests(unittest.TestCase):\n    def load(self, connector_id):\n        return json.loads((CONNECTORS / f"{connector_id}.connector.json").read_text(encoding="utf-8"))\n\n    def test_all_noaa_connectors_validate(self):\n        validator = Draft202012Validator(SCHEMA)\n        for connector_id in NOAA_IDS:\n            connector = self.load(connector_id)\n            self.assertEqual(connector_id, connector["id"])\n            self.assertTrue(connector["enabled"])\n            self.assertEqual("GET", connector["method"])\n            self.assertFalse(list(validator.iter_errors(connector)), connector_id)\n\n    def test_only_official_fixed_hosts_and_no_secrets(self):\n        expected = {"https://api.weather.gov", "https://www.ncei.noaa.gov"}\n        for connector_id in NOAA_IDS:\n            connector = self.load(connector_id)\n            self.assertIn(connector["backend"]["host"], expected)\n            self.assertNotIn("secret_header", connector)\n            self.assertNotIn("secret_query", connector)\n            self.assertIn("qos", "qos")\n\n    def test_alerts_require_a_bounded_filter(self):\n        connector = self.load("noaa-nws-alerts-active")\n        self.assertEqual([["area", "point", "region", "zone", "event", "code"]], connector["parameter_rules"]["required_any_of"])
\n    def test_ncei_requires_dataset_and_date_bounds(self):\n        connector = self.load("noaa-ncei-data-search")\n        self.assertEqual([["dataset"], ["startDate"], ["endDate"]], connector["parameter_rules"]["required_any_of"])
\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

      - name: Rebuild deterministic gateway and GPTs catalog
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest api-center.tests.test_noaa_connectors -v
          git diff --check

      - name: Run zero-cost official endpoint smoke checks
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/noaa-smoke
          ua='decision-system-intelligence-center/1.0 (github.com/a15280020511/evidence-data-center)'
          points_code=$(curl -L --max-time 30 -A "$ua" -H 'Accept: application/geo+json' -sS -o /tmp/noaa-smoke/points.json -w '%{http_code}' 'https://api.weather.gov/points/38.8977,-77.0365' || true)
          alerts_code=$(curl -L --max-time 30 -A "$ua" -H 'Accept: application/geo+json' -sS -o /tmp/noaa-smoke/alerts.json -w '%{http_code}' 'https://api.weather.gov/alerts/active?area=DC&limit=1' || true)
          ncei_code=$(curl -L --max-time 30 -A "$ua" -H 'Accept: application/json' -sS -o /tmp/noaa-smoke/ncei.json -w '%{http_code}' 'https://www.ncei.noaa.gov/access/services/search/v1/data?dataset=daily-summaries&startDate=2024-01-01&endDate=2024-01-02&stations=USW00094728&limit=1' || true)
          python - "$points_code" "$alerts_code" "$ncei_code" <<'PY'
          import json, pathlib, sys
          names = ["points", "alerts", "ncei"]
          codes = sys.argv[1:]
          result = {"status": "PASS" if all(code == "200" for code in codes) else "DEGRADED", "checks": {}}
          for name, code in zip(names, codes):
              path = pathlib.Path(f"/tmp/noaa-smoke/{name}.json")
              valid_json = False
              nonempty = path.exists() and path.stat().st_size > 0
              if nonempty:
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                      valid_json = True
                  except Exception:
                      pass
              result["checks"][name] = {"http_status": code, "nonempty": nonempty, "valid_json": valid_json}
          pathlib.Path("noaa-smoke-result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result))
          if result["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Upload NOAA smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noaa-smoke-${{ github.run_id }}
          path: noaa-smoke-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated integration and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-noaa-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add official NOAA weather and climate connectors"
          git push origin HEAD:feat/noaa-official-data
