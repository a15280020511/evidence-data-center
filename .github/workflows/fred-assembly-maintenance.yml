name: One-shot FRED Provider Assembly

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-fred-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-fred-assemble]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: feat/fred-official-provider-20260803
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/fred/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/fred/requirements.txt
          python -m pip check

      - name: Patch deterministic global invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('api-center/tests/test_api_catalog.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    "cloudflare": 22,\n}', '    "cloudflare": 22,\n    "fred": 25,\n}', 1)
          text = text.replace('self.assertEqual(catalog["managed_provider_count"], 49)', 'self.assertEqual(catalog["managed_provider_count"], 50)', 1)
          text = text.replace('self.assertEqual(catalog["enabled_managed_provider_count"], 49)', 'self.assertEqual(catalog["enabled_managed_provider_count"], 50)', 1)
          text = text.replace('self.assertEqual(catalog["managed_operation_count"], 544)', 'self.assertEqual(catalog["managed_operation_count"], 569)', 1)
          text = text.replace('            "cloudflare": "CLOUDFLARE_API_TOKEN",\n', '            "cloudflare": "CLOUDFLARE_API_TOKEN",\n            "fred": "FRED_API_KEY",\n', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/tests/test_capability_maximization.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('            544,\n', '            569,\n', 1)
          text = text.replace('            "cloudflare": 22,\n', '            "cloudflare": 22,\n            "fred": 25,\n', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('api-center/README.md')
          text = path.read_text(encoding='utf-8')
          if 'FRED_API_KEY' not in text:
              marker = 'MARKETSTACK_ACCESS_KEY\n'
              if marker in text:
                  text = text.replace(marker, marker + 'FRED_API_KEY\n', 1)
              text += '''\n## FRED 官方经济与金融时间序列\n\n`api-center/fred/` 固定访问圣路易斯联邦储备银行官方 FRED API v1：\n\n```text\n[intel-fred]\nFRED_API_KEY\n```\n\n固定开放 25 项只读能力，覆盖分类、发布、序列、观测值、修订日期、来源和标签。每张票据最多一次 HTTPS GET，强制 JSON、最多 1,000 条、不自动重试或翻页；不开放 API v2 批量发布下载、Maps shape 文件、任意 URL、路径、请求头或写操作。\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate deterministic catalogs
        run: |
          set -euo pipefail
          python api-center/build_catalog_market_search.py

      - name: Run provider and global regressions
        run: |
          set -euo pipefail
          python -m py_compile api-center/managed_provider_runtime.py api-center/fred/fred_task.py api-center/fred/tests/test_fred.py
          python -m unittest discover -s api-center/fred/tests -p 'test_*.py' -v
          python -m unittest api-center/tests/test_api_catalog.py -v
          python -m unittest api-center/tests/test_capability_maximization.py -v
          git diff --check

      - name: Commit assembled provider
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-center
          if git diff --cached --quiet; then
            echo 'No assembly changes to commit'
          else
            git commit -m 'feat(fred): integrate official provider catalog'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Publish PASS
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'FRED_PROVIDER_ASSEMBLY_PASS: official FRED provider assembled on `feat/fred-official-provider-20260803`; deterministic catalog regenerated to 50 providers / 569 operations; provider and global catalog regressions passed.'
