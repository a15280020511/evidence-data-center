name: PR-bound Federal Register Downgrade

on:
  pull_request:
    paths:
      - '.github/workflows/pr-federal-register-downgrade.yml'
      - 'api-center/global-knowledge-archives/**'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'

permissions:
  contents: write

concurrency:
  group: federal-register-downgrade-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event.pull_request.number == 950
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/open-intelligence-toolkit-20260804
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded catalog dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python -m pip check

      - name: Converge Federal Register production boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('api-center/global-knowledge-archives')
          matrix_path = root / 'source-access-matrix.json'
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          active = [row for row in matrix['sources'] if row.get('source_id') == 'federal-register']
          if len(active) > 1:
              raise RuntimeError('duplicate active federal-register source')
          if active:
              matrix['sources'] = [row for row in matrix['sources'] if row.get('source_id') != 'federal-register']
          matrix['active_source_count'] = len(matrix['sources'])
          if matrix['active_source_count'] != 14:
              raise RuntimeError(f'unexpected active source count {matrix["active_source_count"]}')
          if not any(row.get('source_id') == 'federal-register' for row in matrix['not_enabled']):
              matrix['not_enabled'].append({
                  'source_id': 'federal-register',
                  'reason': 'The official FederalRegister.gov API returned HTTP 403 from the GitHub Actions production execution platform during a bounded single-request acceptance on 2026-08-04. The connector remains a conditional capability; authoritative regulatory discovery can use existing Congress.gov, GovInfo, legal and general web evidence providers until this endpoint is reliably reachable.'
              })
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          catalog_path = root / 'provider-catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          provider = catalog['providers'][0]
          provider['catalog_policy'] = provider['catalog_policy'].replace('15个固定HTTPS来源', '14个固定HTTPS来源')
          provider['limits']['source_count'] = 14
          for operation_id in ('knowledge-search', 'knowledge-record'):
              operation = next(row for row in provider['operations'] if row['operation_id'] == operation_id)
              enum = operation['parameter_schema']['properties']['source_id']['enum']
              operation['parameter_schema']['properties']['source_id']['enum'] = [item for item in enum if item != 'federal-register']
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator_path = root / 'validate_global_knowledge_archives.py'
          text = validator_path.read_text(encoding='utf-8')
          text = text.replace(
              'assert len(sources) == matrix["active_source_count"] == provider["limits"]["source_count"] == 15',
              'assert len(sources) == matrix["active_source_count"] == provider["limits"]["source_count"] == 14',
          )
          live_line = '    "federal-register": ("knowledge-search", {"source_id": "federal-register", "query": "artificial intelligence", "limit": 2}),\n'
          text = text.replace(live_line, '')
          validator_path.write_text(text, encoding='utf-8')
          PY
          python api-center/build_catalog_market_search.py
          python -m py_compile \
            api-center/global-knowledge-archives/global_knowledge_archives_task.py \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py
          PYTHONPATH=api-center/global-knowledge-archives:api-center \
            python api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
              --output /tmp/global-knowledge-archives-registry.json
          git diff --check

      - name: Commit ordinary contracts when changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            api-center/global-knowledge-archives/source-access-matrix.json \
            api-center/global-knowledge-archives/provider-catalog.json \
            api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          if git diff --cached --quiet; then
            echo 'Contracts already converged.'
            exit 0
          fi
          git commit -m 'fix: downgrade blocked Federal Register endpoint'
          git push origin HEAD:feat/open-intelligence-toolkit-20260804
