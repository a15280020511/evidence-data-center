name: Integrate WHO GHO OData PR

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - ".github/workflows/who-gho-integration-pr.yml"
      - ".github/scripts/integrate_who_gho.py"
      - ".github/who-gho-integration-trigger.txt"

permissions:
  contents: write

concurrency:
  group: integrate-who-gho-pr
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Probe WHO GHO public OData
        run: |
          set -euo pipefail
          mkdir -p who-gho-probe
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          urls = {
              'indicator': 'https://ghoapi.azureedge.net/api/Indicator?%24top=1&%24format=json',
              'dimension': 'https://ghoapi.azureedge.net/api/Dimension?%24top=1&%24format=json',
              'china_life_expectancy': 'https://ghoapi.azureedge.net/api/WHOSIS_000001?%24filter=SpatialDim%20eq%20%27CHN%27&%24top=1&%24format=json',
          }
          results = {}
          for name, url in urls.items():
              request = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'intelligence-center-who-gho/1'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(5_000_001)
                  status = response.status
                  content_type = response.headers.get('Content-Type','')
              data = json.loads(raw.decode('utf-8'))
              values = data.get('value')
              if status != 200 or not isinstance(values, list) or not values:
                  raise SystemExit(f'{name} failed: status={status}, rows={len(values or [])}')
              results[name] = {'http_status':status,'content_type':content_type,'row_count':len(values),'sample_keys':sorted(values[0])[:20],'authorization_sent':False}
          summary = {'status':'PASS','official_origin':'https://ghoapi.azureedge.net/api','authentication':'none','requests':results,'secret_values_exposed':False}
          Path('who-gho-probe/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Generate provider
        run: python .github/scripts/integrate_who_gho.py

      - name: Install and validate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/who-gho/requirements.txt
          python -m pip check
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m py_compile api-center/build_catalog.py api-center/build_catalog_market_search.py api-center/managed_provider_runtime.py api-center/who-gho/who_gho_task.py api-center/who-gho/tests/*.py api-center/tests/*.py
          python -m unittest discover -s api-center/who-gho/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          who = providers['who-gho-odata']
          assert catalog['managed_provider_count'] == 32
          assert catalog['managed_operation_count'] == 577
          assert who['operation_count'] == 8
          assert who['required_secret_environment_variable_name'] == ''
          assert who['limits']['fixed_api_host'] == 'ghoapi.azureedge.net'
          assert who['limits']['arbitrary_odata_filters_allowed'] is False
          assert who['limits']['automatic_pagination_allowed'] is False
          assert who['limits']['write_operations_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          print(json.dumps({'status':'PASS','providers':32,'operations':577,'who_gho_operations':8}))
          PY
          git diff --check

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: who-gho-integration-${{ github.run_id }}
          path: |
            who-gho-probe/summary.json
            api-center/who-gho/provider-catalog.json
            api-center/who-gho/ticket.schema.json
            api-center/api-catalog.json
            api-center/api-catalog.md
          if-no-files-found: error
          retention-days: 30

      - name: Stage workflow templates
        run: |
          set -euo pipefail
          mkdir -p api-center/who-gho/.workflow-templates
          cp .github/workflows/api-catalog-validate.yml api-center/who-gho/.workflow-templates/api-catalog-validate.yml
          cp .github/workflows/who-gho-api-ticket.yml api-center/who-gho/.workflow-templates/who-gho-api-ticket.yml
          cp .github/workflows/who-gho-provider-validate.yml api-center/who-gho/.workflow-templates/who-gho-provider-validate.yml
          git restore --source=HEAD -- .github/workflows/api-catalog-validate.yml
          rm -f .github/workflows/who-gho-api-ticket.yml .github/workflows/who-gho-provider-validate.yml
          rm -rf who-gho-probe
          rm -f .github/scripts/integrate_who_gho.py .github/who-gho-integration-trigger.txt

      - name: Commit generated integration
        run: |
          set -euo pipefail
          git config user.name "a15280020511"
          git config user.email "270211234+a15280020511@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add WHO GHO OData to Intelligence Center"
          git push origin HEAD:${{ github.head_ref }}
