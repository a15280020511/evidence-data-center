name: Managed Global Research Intelligence

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-global-research-global
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-global-research]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
      SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-research-intelligence/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-research-intelligence/requirements.txt
          python -m pip check
      - name: Compile provider
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-research-intelligence/global_research_intelligence_task.py
      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/global-research-intelligence/global_research_intelligence_task.py \
            prepare --event-path "$GITHUB_EVENT_PATH" --output-dir global-research-artifacts
      - name: Publish acceptance or rejection
        if: always()
        run: |
          phase=rejected
          if [[ "${{ steps.prepare.outputs.accepted }}" == "true" ]]; then phase=accepted; fi
          python api-center/global-research-intelligence/global_research_intelligence_task.py \
            render --output-dir global-research-artifacts --phase "$phase" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Execute one bounded operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/global-research-intelligence/global_research_intelligence_task.py \
            execute --ticket global-research-artifacts/ticket.json --output-dir global-research-artifacts
      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-research-${{ github.event.issue.number }}-${{ github.run_id }}
          path: global-research-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified result
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/global-research-intelligence/global_research_intelligence_task.py \
            render --output-dir global-research-artifacts --phase completed \
            --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@provider-comment.md
      - name: Fail closed
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_GLOBAL_RESEARCH_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
