name: Search Query Compiler Validate

on:
  pull_request:
    paths:
      - "api-center/search-query-compiler/**"
      - ".github/workflows/search-query-compiler-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/search-query-compiler/**"
      - ".github/workflows/search-query-compiler-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest==9.0.2
      - name: Compile
        run: python -m py_compile api-center/search-query-compiler/query_compiler.py
      - name: Unit tests
        run: python -m pytest -q api-center/search-query-compiler/tests
