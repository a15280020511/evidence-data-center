name: PRC Investigative Technology Learning Validate

on:
  pull_request:
    paths:
      - 'api-center/prc-legal-investigative-intelligence/investigative-technology-intelligence-matrix.json'
      - 'api-center/prc-legal-investigative-intelligence/case-derived-investigative-capability-ledger.json'
      - 'api-center/prc-legal-investigative-intelligence/validate_investigative_technology_learning.py'
      - '.github/workflows/prc-investigative-technology-learning-validate.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/prc-legal-investigative-intelligence/investigative-technology-intelligence-matrix.json'
      - 'api-center/prc-legal-investigative-intelligence/case-derived-investigative-capability-ledger.json'
      - 'api-center/prc-legal-investigative-intelligence/validate_investigative_technology_learning.py'
      - '.github/workflows/prc-investigative-technology-learning-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile api-center/prc-legal-investigative-intelligence/validate_investigative_technology_learning.py
      - name: Validate learning matrix and case ledger
        run: python api-center/prc-legal-investigative-intelligence/validate_investigative_technology_learning.py
