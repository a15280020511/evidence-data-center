name: Demote SEC and Rebuild Toolkit

on:
  push:
    branches: [feat/open-intelligence-toolkit-20260804]
    paths:
      - maintenance/demote_sec_and_rebuild_toolkit.py
      - .github/workflows/demote-sec-and-rebuild-toolkit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demote-sec-and-rebuild-toolkit
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/open-intelligence-toolkit-20260804
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install catalog generator dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
      - name: Demote inaccessible SEC operations and rebuild contracts
        run: python maintenance/demote_sec_and_rebuild_toolkit.py
      - name: Validate rebuilt toolkit
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/open-intelligence-toolkit/requirements.txt
          python -m py_compile api-center/open-intelligence-toolkit/open_intelligence_toolkit_task.py api-center/open-intelligence-toolkit/validate_open_intelligence_toolkit.py
          python -m unittest discover -s api-center/open-intelligence-toolkit/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          git diff --check
      - name: Commit formal production contracts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center
          if git diff --cached --quiet; then
            echo 'No production changes generated'
            exit 1
          fi
          git commit -m 'fix: demote SEC EDGAR after production egress rejection'
          git push origin HEAD:feat/open-intelligence-toolkit-20260804
