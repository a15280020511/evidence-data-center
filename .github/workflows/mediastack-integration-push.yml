name: Integrate Mediastack Push

on:
  push:
    branches:
      - feat/add-overture-oecd-alphafeed
    paths:
      - ".github/workflows/mediastack-integration-push.yml"
      - ".github/scripts/integrate_mediastack.py"
      - "api-center/mediastack/**"

permissions:
  contents: write

concurrency:
  group: integrate-mediastack-push
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/add-overture-oecd-alphafeed
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply deterministic integration
        run: python .github/scripts/integrate_mediastack.py

      - name: Install and validate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/mediastack/requirements.txt
          python -m pip check
          python -m py_compile api-center/managed_provider_runtime.py api-center/build_catalog.py api-center/build_catalog_market_search.py api-center/mediastack/mediastack_task.py api-center/mediastack/tests/*.py api-center/tests/test_api_catalog.py
          python -m unittest discover -s api-center/mediastack/tests -p 'test_*.py' -v
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          mediastack = providers['mediastack']
          assert catalog['managed_provider_count'] == 33
          assert catalog['managed_operation_count'] == 582
          assert mediastack['operation_count'] == 5
          assert mediastack['required_secret_environment_variable_name'] == 'MEDIASTACK_API_KEY'
          assert mediastack['limits']['fixed_api_host'] == 'api.mediastack.com'
          assert mediastack['limits']['requests_per_ticket_max'] == 1
          assert mediastack['limits']['automatic_pagination_allowed'] is False
          assert mediastack['limits']['write_operations_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          print(json.dumps({'status':'PASS','providers':33,'operations':582,'mediastack_operations':5}))
          PY
          git diff --check

      - name: Remove one-shot integration files
        run: |
          rm -f .github/workflows/mediastack-integration-pr.yml
          rm -f .github/workflows/mediastack-integration-push.yml
          rm -f .github/scripts/integrate_mediastack.py

      - name: Commit completed integration
        run: |
          set -euo pipefail
          git config user.name "a15280020511"
          git config user.email "270211234+a15280020511@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Mediastack to Intelligence Center"
          git push origin HEAD:feat/add-overture-oecd-alphafeed
