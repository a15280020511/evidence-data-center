name: Validate WTO IMF FAOSTAT Providers

on:
  pull_request:
    paths:
      - "api-center/international-statistics/**"
      - "api-center/wto/**"
      - "api-center/imf/**"
      - "api-center/faostat/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/wto-api-ticket.yml"
      - ".github/workflows/imf-api-ticket.yml"
      - ".github/workflows/faostat-api-ticket.yml"
      - ".github/workflows/international-statistics-provider-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/international-statistics/**"
      - "api-center/wto/**"
      - "api-center/imf/**"
      - "api-center/faostat/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/wto-api-ticket.yml"
      - ".github/workflows/imf-api-ticket.yml"
      - ".github/workflows/faostat-api-ticket.yml"
      - ".github/workflows/international-statistics-provider-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/wto/requirements.txt \
            -r api-center/imf/requirements.txt \
            -r api-center/faostat/requirements.txt
          python -m pip check
      - name: Compile and test providers
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/international-statistics/provider_task.py \
            api-center/international-statistics/tests/test_international_statistics.py \
            api-center/wto/wto_task.py \
            api-center/imf/imf_task.py \
            api-center/faostat/faostat_task.py
          python -m unittest discover -s api-center/international-statistics/tests -p 'test_*.py' -v
      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          expected = {'wto': 7, 'imf': 6, 'faostat': 7}
          for provider, count in expected.items():
              root = Path('api-center') / provider
              schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
              row = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
              Draft202012Validator.check_schema(schema)
              assert row['provider_id'] == provider
              assert len(row['operations']) == count
              assert row['limits']['automatic_retry_allowed'] is False
              assert row['limits']['automatic_pagination_allowed'] is False
              assert row['limits']['write_operations_allowed'] is False
              assert all(op['result_contract']['read_only'] is True for op in row['operations'])
          assert json.loads(Path('api-center/wto/provider-catalog.json').read_text())['providers'][0]['required_secret_environment_variable'] == 'WTO_API_KEY'
          fao = json.loads(Path('api-center/faostat/provider-catalog.json').read_text())['providers'][0]
          assert fao['required_secret_environment_variable'] == 'FAOSTAT_PASSWORD'
          assert fao['required_repository_variable'] == 'FAOSTAT_USERNAME'
          assert fao['limits']['oauth_token_persistence_allowed'] is False
          print(json.dumps({'status':'PASS','providers':3,'operations':20}))
          PY
          git diff --check
