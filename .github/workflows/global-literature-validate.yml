name: Validate Global Literature and Libraries

on:
  pull_request:
    paths:
      - 'api-center/global-literature-libraries/**'
      - 'api-center/managed_provider_runtime.py'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/global-literature-*.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/global-literature-libraries/**'
      - 'api-center/managed_provider_runtime.py'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/global-literature-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-global-literature-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-and-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-literature-libraries/requirements.txt
      - name: Install fixed dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-literature-libraries/requirements.txt
          python -m pip check
      - name: Compile and validate all fixed source builders
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-literature-libraries/global_literature_task.py \
            api-center/global-literature-libraries/validate_global_literature.py
          mkdir -p global-literature-validation
          PYTHONPATH=api-center/global-literature-libraries:api-center \
            python api-center/global-literature-libraries/validate_global_literature.py \
              --output global-literature-validation/registry.json
      - name: Verify registry receipt and aggregate catalog boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('global-literature-validation/registry.json').read_text())
          provider=json.loads(Path('api-center/global-literature-libraries/provider-catalog.json').read_text())['providers'][0]
          matrix=json.loads(Path('api-center/global-literature-libraries/source-access-matrix.json').read_text())
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['source_count']==25
          assert receipt['operation_count']==10
          assert receipt['network_used'] is False
          assert receipt['model_calls']==0
          assert receipt['secret_values_exposed'] is False
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['paywall_bypass_allowed'] is False
          assert len(matrix['not_enabled']) >= 10
          assert any(row['source_id']=='fraser-oai' for row in matrix['not_enabled'])
          rows={row['provider_id']:row for row in catalog['managed_providers']}
          assert rows['global-literature-libraries']['operation_count']==10
          assert catalog['managed_provider_count']==len(rows)
          assert catalog['managed_operation_count']==sum(row['operation_count'] for row in rows.values())
          assert catalog['direct_center_to_center_calls_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          PY
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-literature-registry-${{ github.run_id }}
          path: global-literature-validation/
          if-no-files-found: error
          retention-days: 30

  live-no-key-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source:
          - openaire
          - europe-pmc
          - econbiz
          - osti
          - library-of-congress
          - econstor-oai
          - ndl-sru
          - epo-publication-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-literature-libraries/requirements.txt
      - name: Install fixed dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-literature-libraries/requirements.txt
          python -m pip check
      - name: Execute one bounded real upstream request
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: |
          mkdir -p global-literature-live
          PYTHONPATH=api-center/global-literature-libraries:api-center \
            python api-center/global-literature-libraries/validate_global_literature.py \
              --live-source "$SOURCE_ID" \
              --output "global-literature-live/$SOURCE_ID.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=os.environ['SOURCE_ID']
          row=json.loads((Path('global-literature-live')/f'{source}.json').read_text())
          assert row['status']=='PASS'
          assert row['source_id']==source
          assert row['network_used'] is True
          assert row['request_count']==1
          assert row['model_calls']==0
          assert row['secret_values_exposed'] is False
          assert 200 <= row['http_status'] < 300
          assert row['response_bytes'] > 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-literature-live-${{ matrix.source }}-${{ github.run_id }}
          path: global-literature-live/
          if-no-files-found: warn
          retention-days: 30
