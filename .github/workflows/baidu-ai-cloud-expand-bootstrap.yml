name: Bootstrap Expanded Baidu Free Capabilities

on:
  pull_request:
    paths:
      - '.github/workflows/baidu-ai-cloud-expand-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: baidu-ai-cloud-expand-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  expand:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout expansion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1

      - name: Verify, extract, and integrate reviewed expansion bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path('.')
          parts = sorted((root / '.bootstrap' / 'baidu').glob('part-*'))
          if len(parts) != 8:
              raise SystemExit(f'expected 8 bundle parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected_digest = 'af59a26397ad1500d6630d17cb887f407f310819c53e58db3d587f8cb392593f'
          if digest != expected_digest:
              raise SystemExit(f'bundle digest mismatch: {digest}')

          allowed = {
              'api-center/baidu-ai-cloud/build_free_catalog.py',
              'api-center/baidu-ai-cloud/baidu_ai_cloud_task.py',
              'api-center/baidu-ai-cloud/provider-catalog.json',
              'api-center/baidu-ai-cloud/ticket.schema.json',
              'api-center/baidu-ai-cloud/free-quota-policy.json',
              'api-center/baidu-ai-cloud/tests/test_baidu_ai_cloud_task.py',
              'api-center/baidu-ai-cloud/README.md',
              '.github/workflows/baidu-ai-cloud-provider-validate.yml',
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f'unexpected bundle paths: {sorted(names ^ allowed)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if member.issym() or member.islnk() or path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe bundle member: {member.name}')
                  if not member.isfile():
                      raise SystemExit(f'non-file bundle member: {member.name}')
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable bundle member: {member.name}')
                  destination = root / member.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

          builder = root / 'api-center/build_catalog_market_search.py'
          text = builder.read_text(encoding='utf-8')
          constant = 'BAIDU_AI_CLOUD_CATALOG = HERE / "baidu-ai-cloud/provider-catalog.json"\n'
          if constant not in text:
              marker = 'GLOBAL_KNOWLEDGE_FABRIC_CATALOG = HERE / "global-knowledge-fabric/provider-catalog.json"\n'
              if marker not in text:
                  raise SystemExit('Baidu catalog constant marker missing')
              text = text.replace(marker, marker + constant, 1)
          if '    "baidu-ai-cloud": 41,\n' not in text:
              marker = '    "global-knowledge-fabric": 9,\n'
              if marker not in text:
                  raise SystemExit('Baidu expected-count marker missing')
              text = text.replace(marker, marker + '    "baidu-ai-cloud": 41,\n', 1)
          if '    BAIDU_AI_CLOUD_CATALOG,\n' not in text:
              marker = '    GLOBAL_KNOWLEDGE_FABRIC_CATALOG,\n'
              if marker not in text:
                  raise SystemExit('Baidu managed-path marker missing')
              text = text.replace(marker, marker + '    BAIDU_AI_CLOUD_CATALOG,\n', 1)
          builder.write_text(text, encoding='utf-8')

          aggregate_test = root / 'api-center/tests/test_api_catalog.py'
          text = aggregate_test.read_text(encoding='utf-8')
          if '    "baidu-ai-cloud": 41,\n' not in text:
              marker = '    "global-knowledge-fabric": 9,\n'
              if marker not in text:
                  raise SystemExit('aggregate Baidu count marker missing')
              text = text.replace(marker, marker + '    "baidu-ai-cloud": 41,\n', 1)
          aggregate_test.write_text(text, encoding='utf-8')

          validate = root / '.github/workflows/baidu-ai-cloud-provider-validate.yml'
          text = validate.read_text(encoding='utf-8')
          text = text.replace("catalog['managed_provider_count']==61", "catalog['managed_provider_count']==62")
          text = text.replace("catalog['managed_operation_count']==706", "catalog['managed_operation_count']==715")
          validate.write_text(text, encoding='utf-8')

          requirements = root / 'api-center/baidu-ai-cloud/requirements.txt'
          requirements.write_text('jsonschema==4.26.0\nrequests==2.34.2\n', encoding='utf-8')
          PY

      - name: Compile, regenerate, and verify provider contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/build_catalog_market_search.py \
            api-center/baidu-ai-cloud/build_free_catalog.py \
            api-center/baidu-ai-cloud/baidu_ai_cloud_task.py \
            api-center/baidu-ai-cloud/tests/test_baidu_ai_cloud_task.py
          python api-center/baidu-ai-cloud/build_free_catalog.py
          PYTHONPATH=api-center python -m unittest discover -s api-center/baidu-ai-cloud/tests -p 'test_*.py'
          git diff --check

      - name: Commit expanded free capability surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/baidu-ai-cloud \
            .github/workflows/baidu-ai-cloud-provider-validate.yml
          git commit -m 'feat(baidu): add free search research NLP OCR and image tools'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
