name: Validate Global Knowledge Fabric

on:
  pull_request:
    paths:
      - 'api-center/global-knowledge-fabric/**'
      - 'api-center/managed_provider_runtime.py'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/global-knowledge-fabric-*.yml'
  push:
    branches: [main]
    paths:
      - 'api-center/global-knowledge-fabric/**'
      - 'api-center/managed_provider_runtime.py'
      - 'api-center/build_catalog_market_search.py'
      - 'api-center/api-catalog.json'
      - 'api-center/api-catalog.md'
      - 'api-center/tests/test_api_catalog.py'
      - '.github/workflows/global-knowledge-fabric-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-global-knowledge-fabric-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-and-builders:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-knowledge-fabric/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-fabric/requirements.txt
          python -m pip check
      - name: Compile and validate builders
        run: |
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/global-knowledge-fabric/global_knowledge_fabric_task.py \
            api-center/global-knowledge-fabric/validate_global_knowledge_fabric.py
          mkdir -p global-knowledge-fabric-validation
          PYTHONPATH=api-center/global-knowledge-fabric:api-center \
            python api-center/global-knowledge-fabric/validate_global_knowledge_fabric.py \
              --output global-knowledge-fabric-validation/registry.json
      - name: Verify registry and aggregate catalog boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('global-knowledge-fabric-validation/registry.json').read_text())
          provider=json.loads(Path('api-center/global-knowledge-fabric/provider-catalog.json').read_text())['providers'][0]
          matrix=json.loads(Path('api-center/global-knowledge-fabric/source-access-matrix.json').read_text())
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['source_count']==14
          assert receipt['operation_count']==9
          assert receipt['network_used'] is False
          assert receipt['model_calls']==0
          assert receipt['secret_values_exposed'] is False
          assert provider['limits']['requests_per_ticket_max']==1
          assert provider['limits']['max_response_bytes']==5000000
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['arbitrary_sparql_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert len(matrix['not_enabled']) >= 10
          assert any(row['source_id']=='dblp-publication' for row in matrix['not_enabled'])
          rows={row['provider_id']:row for row in catalog['managed_providers']}
          assert rows['global-knowledge-fabric']['operation_count']==9
          assert catalog['managed_provider_count']==len(rows)
          assert catalog['managed_operation_count']==sum(row['operation_count'] for row in rows.values())
          assert catalog['direct_center_to_center_calls_allowed'] is False
          assert catalog['secret_values_exposed'] is False
          PY
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-knowledge-fabric-registry-${{ github.run_id }}
          path: global-knowledge-fabric-validation/
          if-no-files-found: error
          retention-days: 30

  live-no-key-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source:
          - ror
          - dblp-author
          - dblp-venue
          - harvard-dataverse
          - openml
          - grants-gov
          - eu-cellar
          - rcsb-pdb
          - uniprot
          - chembl
          - ietf-datatracker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-knowledge-fabric/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-fabric/requirements.txt
          python -m pip check
      - name: Execute one real bounded upstream request
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: |
          mkdir -p global-knowledge-fabric-live
          PYTHONPATH=api-center/global-knowledge-fabric:api-center \
            python api-center/global-knowledge-fabric/validate_global_knowledge_fabric.py \
              --live-source "$SOURCE_ID" \
              --output "global-knowledge-fabric-live/$SOURCE_ID.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=os.environ['SOURCE_ID']
          row=json.loads((Path('global-knowledge-fabric-live')/f'{source}.json').read_text())
          assert row['status']=='PASS'
          assert row['source_id']==source
          assert row['network_used'] is True
          assert row['request_count']==1
          assert row['model_calls']==0
          assert row['secret_values_exposed'] is False
          assert 200 <= row['http_status'] < 300
          assert row['response_bytes'] > 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-knowledge-fabric-live-${{ matrix.source }}-${{ github.run_id }}
          path: global-knowledge-fabric-live/
          if-no-files-found: warn
          retention-days: 30

  live-free-key-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source:
          - orcid
          - regulations-gov
          - data-gov
    env:
      ORCID_PUBLIC_API_TOKEN: ${{ secrets.ORCID_PUBLIC_API_TOKEN }}
      REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/global-knowledge-fabric/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-fabric/requirements.txt
          python -m pip check
      - name: Execute configured free-key source or record explicit skip
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: |
          mkdir -p global-knowledge-fabric-key-live
          PYTHONPATH=api-center/global-knowledge-fabric:api-center \
            python api-center/global-knowledge-fabric/validate_global_knowledge_fabric.py \
              --live-key-source "$SOURCE_ID" \
              --output "global-knowledge-fabric-key-live/$SOURCE_ID.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=os.environ['SOURCE_ID']
          row=json.loads((Path('global-knowledge-fabric-key-live')/f'{source}.json').read_text())
          assert row['status'] in {'PASS','SKIP_NOT_CONFIGURED'}
          assert row['source_id']==source
          assert row['model_calls']==0
          assert row['secret_values_exposed'] is False
          if row['status']=='PASS':
              assert row['network_used'] is True
              assert row['request_count']==1
              assert 200 <= row['http_status'] < 300
              assert row['response_bytes'] > 0
          else:
              assert row['network_used'] is False
              assert row['request_count']==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-knowledge-fabric-key-${{ matrix.source }}-${{ github.run_id }}
          path: global-knowledge-fabric-key-live/
          if-no-files-found: warn
          retention-days: 30
