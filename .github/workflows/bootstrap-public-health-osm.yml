# bootstrap-trigger: 2026-08-03
name: Bootstrap Public Health and OSM Providers

on:
  push:
    branches:
      - feat/public-health-osm-providers
    paths:
      - ".github/workflows/bootstrap-public-health-osm.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-public-health-osm
  cancel-in-progress: false

jobs:
  install-and-register:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/public-health-osm-providers
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Materialize governed provider files
        run: |
          cat .bootstrap/public-health-osm.bundle.* > /tmp/provider-bundle.b64
          base64 --decode /tmp/provider-bundle.b64 > /tmp/provider-bundle.tar.gz
          python - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('/tmp/provider-bundle.tar.gz', 'r:gz') as archive:
              for member in archive.getmembers():
                  if member.name.startswith('/') or '..' in member.name.split('/'):
                      raise SystemExit('unsafe archive path')
              archive.extractall('.')
          PY
          python _bootstrap/patch_catalog.py
          rm -rf _bootstrap
      - name: Install validation runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/nih-public-health/requirements.txt -r api-center/openstreetmap/requirements.txt
          python -m pip check
      - name: Rebuild deterministic aggregate catalog
        run: python api-center/build_catalog_market_search.py
      - name: Validate providers and aggregate invariants
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/nih-public-health/nih_public_health_task.py api-center/openstreetmap/openstreetmap_task.py
          python api-center/nih-public-health/tests/test_nih_public_health_task.py
          python api-center/openstreetmap/tests/test_openstreetmap_task.py
          python api-center/tests/test_api_catalog.py
          git diff --check
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center .github/workflows/nih-public-health-api-ticket.yml .github/workflows/nih-public-health-provider-validate.yml .github/workflows/openstreetmap-api-ticket.yml .github/workflows/openstreetmap-provider-validate.yml
          git commit -m "feat: add public health and OpenStreetMap providers"
          git push origin HEAD:feat/public-health-osm-providers
