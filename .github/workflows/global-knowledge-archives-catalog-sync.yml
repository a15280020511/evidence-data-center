name: Sync Global Knowledge Archives Catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-global-knowledge-archives-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'feat/global-knowledge-archives-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/global-knowledge-archives-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Register provider and source inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('api-center/build_catalog_market_search.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              'GLOBAL_LITERATURE_LIBRARIES_CATALOG = HERE / "global-literature-libraries/provider-catalog.json"\n',
              'GLOBAL_LITERATURE_LIBRARIES_CATALOG = HERE / "global-literature-libraries/provider-catalog.json"\nGLOBAL_KNOWLEDGE_ARCHIVES_CATALOG = HERE / "global-knowledge-archives/provider-catalog.json"\n',
          )
          text=text.replace(
              '    "global-literature-libraries": 10,\n}',
              '    "global-literature-libraries": 10,\n    "global-knowledge-archives": 9,\n}',
          )
          text=text.replace(
              '    GLOBAL_LITERATURE_LIBRARIES_CATALOG,\n)',
              '    GLOBAL_LITERATURE_LIBRARIES_CATALOG,\n    GLOBAL_KNOWLEDGE_ARCHIVES_CATALOG,\n)',
          )
          text=text.replace(
              '        "global-literature-libraries/provider-catalog.json",\n    ):',
              '        "global-literature-libraries/provider-catalog.json",\n        "global-knowledge-archives/provider-catalog.json",\n    ):',
          )
          path.write_text(text, encoding='utf-8')

          path=Path('api-center/tests/test_api_catalog.py')
          text=path.read_text(encoding='utf-8').replace(
              '    "global-literature-libraries": 10,\n}',
              '    "global-literature-libraries": 10,\n    "global-knowledge-archives": 9,\n}',
          )
          path.write_text(text, encoding='utf-8')

          inventory_path=Path('api-center/global-research-intelligence/source-inventory.json')
          inventory=json.loads(inventory_path.read_text(encoding='utf-8'))
          items=inventory.get('items') or []
          if not any(row.get('requested_name')=='global-knowledge-archives' for row in items):
              items.append({
                  'requested_name':'global-knowledge-archives',
                  'classification':'second-wave governed global theses, books, grants, trials, national catalogs, archives, museums, government publications and research metadata layer',
                  'decision':'integrate-new',
                  'implementation':'22 fixed HTTPS sources through 9 bounded read-only operations; existing scholarly, legal, international-organization and first-wave literature providers are mapped rather than duplicated',
              })
              inventory['items']=items
              inventory_path.write_text(json.dumps(inventory, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Rebuild and verify authoritative catalog
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-knowledge-archives/requirements.txt
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_*.py'
          PYTHONPATH=api-center/global-knowledge-archives:api-center \
            python api-center/global-knowledge-archives/validate_global_knowledge_archives.py \
              --output /tmp/global-knowledge-registry.json
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('api-center/api-catalog.json').read_text())
          rows={row['provider_id']:row for row in catalog['managed_providers']}
          assert catalog['managed_provider_count']==60
          assert catalog['managed_operation_count']==665
          assert rows['global-knowledge-archives']['operation_count']==9
          PY
          git diff --check
      - name: Commit generated contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/build_catalog_market_search.py \
            api-center/tests/test_api_catalog.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/global-research-intelligence/source-inventory.json
          if git diff --cached --quiet; then
            echo 'Catalog already synchronized'
            exit 0
          fi
          git commit -m 'feat: register global knowledge archives in authoritative catalog'
          git push origin HEAD:feat/global-knowledge-archives-20260803
