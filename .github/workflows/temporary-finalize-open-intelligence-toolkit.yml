name: Temporary Finalize Open Intelligence Toolkit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-finalize-open-intelligence-toolkit
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] finalize open intelligence toolkit 20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/open-intelligence-toolkit-20260804
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply final production contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python maintenance/demote_sec_and_rebuild_toolkit.py
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/api-catalog-validate.yml')
          text=path.read_text(encoding='utf-8')
          text=text.replace('== 758','== 756').replace("'open-intelligence-toolkit': 22","'open-intelligence-toolkit': 20")
          if '== 758' in text or "'open-intelligence-toolkit': 22" in text:
              raise SystemExit('frozen toolkit counts were not synchronized')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Remove migration-only branch files
        run: |
          rm -f \
            maintenance/apply_open_intelligence_toolkit.py \
            maintenance/sync_open_intelligence_contracts.py \
            maintenance/demote_sec_and_rebuild_toolkit.py \
            maintenance/open-toolkit-rebuild-diagnostics.txt \
            .github/workflows/apply-open-intelligence-toolkit.yml \
            .github/workflows/sync-open-intelligence-contracts.yml \
            .github/workflows/demote-sec-and-rebuild-toolkit.yml \
            .github/workflows/finalize-open-intelligence-toolkit.yml \
            .github/workflows/sync-final-open-toolkit-workflows.yml \
            .github/workflows/finalize-open-toolkit-contract-counts.yml \
            .github/workflows/finalize-open-intelligence-toolkit.yml
      - name: Validate final branch surface
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/open-intelligence-toolkit/requirements.txt
          python -m pip check
          python -m py_compile api-center/open-intelligence-toolkit/open_intelligence_toolkit_task.py api-center/open-intelligence-toolkit/validate_open_intelligence_toolkit.py
          python -m unittest discover -s api-center/open-intelligence-toolkit/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python - <<'PY'
          import json
          catalog=json.load(open('api-center/api-catalog.json'))
          providers={row['provider_id']:row for row in catalog['managed_providers']}
          toolkit=providers['open-intelligence-toolkit']
          assert catalog['managed_provider_count']==68
          assert catalog['managed_operation_count']==756
          assert len(toolkit['operations'])==20
          assert toolkit['required_secret_environment_variable_name']==''
          assert toolkit['limits']['write_operations_allowed'] is False
          matrix=json.load(open('api-center/open-intelligence-toolkit/source-access-matrix.json'))
          assert any(row['id']=='sec-edgar' for row in matrix['conditional_not_directly_invokable'])
          assert not any(row['operation_id'].startswith('sec-') for row in toolkit['operations'])
          PY
          git diff --check
      - name: Commit clean final feature branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes found'
            exit 1
          fi
          git commit -m 'feat: finalize clean 20-operation open intelligence toolkit'
          git push origin HEAD:feat/open-intelligence-toolkit-20260804
      - name: Close maintenance issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$GITHUB_EVENT_ISSUE_NUMBER" --body "One-shot finalizer outcome: ${{ job.status }}."
          gh issue close "$GITHUB_EVENT_ISSUE_NUMBER" --reason completed
        continue-on-error: true
