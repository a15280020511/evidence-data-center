name: Temporary Finalize Open Intelligence Toolkit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-finalize-open-intelligence-toolkit
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] finalize toolkit ordinary files v2 20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/open-intelligence-toolkit-20260804
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate and commit ordinary files
        id: finalize
        continue-on-error: true
        run: |
          set +e
          exec > >(tee /tmp/open-toolkit-finalizer.log) 2>&1
          echo 'STAGE=cleanup_non_workflow'
          rm -f \
            maintenance/apply_open_intelligence_toolkit.py \
            maintenance/sync_open_intelligence_contracts.py \
            maintenance/demote_sec_and_rebuild_toolkit.py \
            maintenance/open-toolkit-rebuild-diagnostics.txt

          echo 'STAGE=install'
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/open-intelligence-toolkit/requirements.txt || exit $?
          python -m pip check || exit $?

          echo 'STAGE=validation'
          python -m py_compile api-center/open-intelligence-toolkit/open_intelligence_toolkit_task.py api-center/open-intelligence-toolkit/validate_open_intelligence_toolkit.py || exit $?
          python -m unittest discover -s api-center/open-intelligence-toolkit/tests -p 'test_*.py' -v || exit $?
          python -m unittest discover -s api-center/tests -p 'test_api_catalog.py' -v || exit $?
          cp api-center/api-catalog.json /tmp/api-catalog.json
          cp api-center/api-catalog.md /tmp/api-catalog.md
          python api-center/build_config.py || exit $?
          python api-center/build_catalog_market_search.py || exit $?
          cmp /tmp/api-catalog.json api-center/api-catalog.json || exit $?
          cmp /tmp/api-catalog.md api-center/api-catalog.md || exit $?
          python - <<'PY'
          import json
          catalog=json.load(open('api-center/api-catalog.json'))
          providers={row['provider_id']:row for row in catalog['managed_providers']}
          toolkit=providers['open-intelligence-toolkit']
          assert catalog['managed_provider_count']==68
          assert catalog['managed_operation_count']==756
          assert len(toolkit['operations'])==20
          assert toolkit['required_secret_environment_variable_name']==''
          assert toolkit['limits']['write_operations_allowed'] is False
          matrix=json.load(open('api-center/open-intelligence-toolkit/source-access-matrix.json'))
          assert any(row['id']=='sec-edgar' for row in matrix['conditional_not_directly_invokable'])
          assert not any(row['operation_id'].startswith('sec-') for row in toolkit['operations'])
          PY
          git diff --check || exit $?

          echo 'STAGE=commit_non_workflow'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center maintenance
          git diff --cached --quiet && { echo 'No ordinary-file changes found'; exit 41; }
          git commit -m 'chore: remove toolkit migration-only ordinary files' || exit $?
          git push origin HEAD:feat/open-intelligence-toolkit-20260804 || exit $?
          exit 0
      - name: Publish diagnostic outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.finalize.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Finalizer outcome: $OUTCOME"
            echo "Run: $RUN_URL"
            echo
            echo '```text'
            tail -n 160 /tmp/open-toolkit-finalizer.log 2>/dev/null || true
            echo '```'
          } > /tmp/comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
          if [[ "$OUTCOME" == "success" ]]; then
            gh issue close "${{ github.event.issue.number }}" --reason completed
          fi
      - name: Fail closed
        if: steps.finalize.outcome != 'success'
        run: exit 1
