name: Validate Tianditu Provider

on:
  pull_request:
    paths:
      - "api-center/tianditu/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/tests/**"
      - ".github/workflows/tianditu-api-ticket.yml"
      - ".github/workflows/tianditu-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/tianditu/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/tests/**"
      - ".github/workflows/tianditu-api-ticket.yml"
      - ".github/workflows/tianditu-provider-validate.yml"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tianditu-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tianditu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/tianditu/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/tianditu/requirements.txt
          python -m pip check

      - name: Compile and run unit tests
        run: |
          python -m py_compile \
            api-center/tianditu/tianditu_task.py \
            api-center/tianditu/tests/test_tianditu_task.py
          python -m unittest discover -s api-center/tianditu/tests -v

      - name: Validate provider catalog and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/tianditu')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert catalog['schema_version'] == 'tianditu-provider-catalog-v1'
          assert catalog['secret_values_exposed'] is False
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'tianditu'
          assert provider['required_secret_environment_variable'] == 'TIANDITU_TOKEN'
          assert provider['ticket_prefix'] == '[api-tianditu]'
          assert len(provider['operations']) == 8
          assert {row['operation_id'] for row in provider['operations']} == {
              'catalog-capabilities', 'normal-search', 'viewport-search',
              'nearby-search', 'polygon-search', 'administrative-search',
              'category-search', 'statistics-search'
          }
          limits = provider['limits']
          assert limits['nearby_radius_meters_max'] == 10000
          assert limits['polygon_points_max'] == 20
          assert limits['arbitrary_urls_allowed'] is False
          assert limits['arbitrary_headers_allowed'] is False
          assert limits['tile_bulk_download_allowed'] is False
          assert limits['write_operations_allowed'] is False
          assert limits['direct_phone_fields_redacted'] is True
          print(json.dumps({'status': 'PASS', 'provider': 'tianditu', 'operations': 8}))
          PY

      - name: Verify no credential material or unsafe escape hatch
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=tests --exclude-dir=__pycache__ \
            --extended-regexp 'TIANDITU_TOKEN[[:space:]]*=[[:space:]]*[A-Za-z0-9._-]{8,}|tk=[A-Za-z0-9._-]{8,}' \
            api-center/tianditu; then
            echo "literal Tianditu token found" >&2
            exit 1
          fi
          if grep -R --line-number --exclude-dir=tests --exclude-dir=__pycache__ --ignore-case \
            --extended-regexp '(arbitrary url|arbitrary headers|bulk tile|write operation|account operation)' \
            api-center/tianditu/tianditu_task.py; then
            echo "unsafe Tianditu implementation found" >&2
            exit 1
          fi

      - name: Upload deterministic contracts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tianditu-provider-contracts-${{ github.run_id }}
          path: |
            api-center/tianditu/provider-catalog.json
            api-center/tianditu/ticket.schema.json
          if-no-files-found: error
          retention-days: 30
