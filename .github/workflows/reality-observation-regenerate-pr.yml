name: Regenerate Reality Observation PR Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/reality-observation-regenerate-pr.yml"
      - "api-center/reality-observation/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/tests/test_api_catalog.py"

permissions:
  contents: write

concurrency:
  group: reality-observation-regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install catalog and provider dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/reality-observation/requirements.txt
          python -m pip check

      - name: Register provider in catalog regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api-center/tests/test_api_catalog.py')
          text = path.read_text(encoding='utf-8')
          marker = '    "google-public-intelligence": 9,\n'
          insertion = marker + '    "reality-observation": 25,\n'
          if '    "reality-observation": 25,\n' not in text:
              if marker not in text:
                  raise SystemExit('catalog count insertion marker not found')
              text = text.replace(marker, insertion, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild deterministic contracts
        run: |
          set -euo pipefail
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/reality-observation/tests -p 'test_*.py' -v
          python -m unittest api-center.tests.test_api_catalog -v

      - name: Commit generated contracts to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-center/tests/test_api_catalog.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/catalog-metadata.json \
            api-center/connector-manifest.json \
            api-center/krakend.validation.json \
            api-center/krakend.tmpl
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: regenerate reality observation contracts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
