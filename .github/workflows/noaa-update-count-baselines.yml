name: Update NOAA Connector Count Baselines

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-and-test:
    if: github.head_ref == 'feat/noaa-official-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Replace exact connector-count assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('api-center/tests/test_api_catalog.py'): [
                  ('self.assertEqual(catalog["connector_count"], 68)',
                   'self.assertEqual(catalog["connector_count"], 75)'),
              ],
              Path('api-center/tests/test_capability_maximization.py'): [
                  ('self.assertEqual(manifest["connector_count"], 68)',
                   'self.assertEqual(manifest["connector_count"], 75)'),
                  ('self.assertEqual(manifest["enabled_connector_count"], 68)',
                   'self.assertEqual(manifest["enabled_connector_count"], 75)'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'expected baseline not found in {path}: {old}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify no stale production baseline remains
        run: |
          if grep -R -n -E 'connector_count[^\n]*68|enabled_connector_count[^\n]*68' \
            api-center/tests .github/workflows/api-catalog-validate.yml; then
            echo 'Stale connector-count baseline remains.' >&2
            exit 1
          fi

      - name: Run shared catalog regressions
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt
          python -m unittest api-center.tests.test_api_catalog -v
          python -m unittest api-center.tests.test_capability_maximization -v
          python -m unittest discover -s api-center/tests -p 'test_noaa_connectors.py' -v
          git diff --check

      - name: Commit corrected baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api-center/tests/test_api_catalog.py api-center/tests/test_capability_maximization.py
          if git diff --cached --quiet; then
            echo 'Baselines already current.'
          else
            git commit -m 'test: update connector count for NOAA integration'
            git push origin HEAD:feat/noaa-official-data
          fi
