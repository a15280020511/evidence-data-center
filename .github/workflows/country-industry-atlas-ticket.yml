name: Managed Country Industry Atlas

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: intel-country-industry-atlas
  cancel-in-progress: false

jobs:
  execute-country-atlas:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[intel-country-atlas]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/country-industry-atlas/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/country-industry-atlas/requirements.txt
          python -m pip check

      - name: Compile provider
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/country-industry-atlas/country_industry_atlas_task.py

      - name: Parse and authorize ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/country-industry-atlas/country_industry_atlas_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir country-atlas-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/country-industry-atlas/country_industry_atlas_task.py render \
            --output-dir country-atlas-artifacts --phase accepted > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/country-industry-atlas/country_industry_atlas_task.py render \
            --output-dir country-atlas-artifacts --phase rejected > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Execute one bounded request
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/country-industry-atlas/country_industry_atlas_task.py execute \
            --ticket country-atlas-artifacts/ticket.json \
            --output-dir country-atlas-artifacts

      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: country-atlas-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: country-atlas-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/country-industry-atlas/country_industry_atlas_task.py render \
            --output-dir country-atlas-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > provider-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@provider-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'INTEL_COUNTRY_INDUSTRY_ATLAS_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: exit 1
