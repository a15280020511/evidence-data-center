name: Managed Agent Toolbelt API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-agent-toolbelt-global
  cancel-in-progress: false

jobs:
  execute-agent-toolbelt-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-agent-toolbelt]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      AGENT_TOOLBELT_KEY: ${{ secrets.AGENT_TOOLBELT_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/agent-toolbelt/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/agent-toolbelt/requirements.txt
          python -m pip check

      - name: Compile managed provider control plane
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/agent-toolbelt/agent_toolbelt_task.py

      - name: Parse and authorize Agent Toolbelt ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/agent-toolbelt/agent_toolbelt_task.py prepare --event-path "$GITHUB_EVENT_PATH" --output-dir agent-toolbelt-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/agent-toolbelt/agent_toolbelt_task.py render --output-dir agent-toolbelt-artifacts --phase accepted > agent-toolbelt-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@agent-toolbelt-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/agent-toolbelt/agent_toolbelt_task.py render --output-dir agent-toolbelt-artifacts --phase rejected > agent-toolbelt-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@agent-toolbelt-comment.md

      - name: Execute one bounded Agent Toolbelt operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/agent-toolbelt/agent_toolbelt_task.py execute --ticket agent-toolbelt-artifacts/ticket.json --output-dir agent-toolbelt-artifacts

      - name: Upload Agent Toolbelt evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-toolbelt-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: agent-toolbelt-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/agent-toolbelt/agent_toolbelt_task.py render --output-dir agent-toolbelt-artifacts --phase completed --artifact-url "$ARTIFACT_URL" > agent-toolbelt-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@agent-toolbelt-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_AGENT_TOOLBELT_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Agent Toolbelt API ticket did not complete successfully."
          exit 1
