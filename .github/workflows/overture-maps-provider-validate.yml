name: Validate Overture Maps Provider

on:
  pull_request:
    paths:
      - "api-center/overture-maps/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/overture-maps-provider-validate.yml"
      - ".github/workflows/overture-maps-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/overture-maps/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/overture-maps-provider-validate.yml"
      - ".github/workflows/overture-maps-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/overture-maps/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/overture-maps/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/overture-maps/overture_maps_task.py api-center/overture-maps/tests/*.py
          python -m unittest discover -s api-center/overture-maps/tests -p 'test_*.py' -v

      - name: Validate fixed read-only contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('api-center/overture-maps')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          assert provider['provider_id'] == 'overture-maps'
          assert provider['required_secret_environment_variable'] == ''
          assert len(provider['operations']) == 7
          assert provider['limits']['arbitrary_urls_allowed'] is False
          assert provider['limits']['arbitrary_headers_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['secret_values_exposed'] is False
          print(json.dumps({'status': 'PASS', 'operations': 7}))
          PY

      - name: Verify repository contains no credential material
        run: |
          git diff --check
