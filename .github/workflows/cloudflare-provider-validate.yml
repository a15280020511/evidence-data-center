name: Validate Cloudflare Intelligence Provider

on:
  pull_request:
    paths:
      - "api-center/cloudflare/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/cloudflare-provider-validate.yml"
      - ".github/workflows/cloudflare-api-ticket.yml"
      - ".github/workflows/api-catalog-validate.yml"
  push:
    branches: [main]
    paths:
      - "api-center/cloudflare/**"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - "api-center/tests/test_api_catalog.py"
      - ".github/workflows/cloudflare-provider-validate.yml"
      - ".github/workflows/cloudflare-api-ticket.yml"
      - ".github/workflows/api-catalog-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cloudflare-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ""
      HF_CLOUDFLARE_DATASET_REPO: ""
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/cloudflare/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/cloudflare/requirements.txt
          python -m pip check

      - name: Compile and run Cloudflare regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/managed_provider_runtime.py \
            api-center/cloudflare/cloudflare_task.py \
            api-center/cloudflare/tests/test_cloudflare.py
          python -m unittest discover -s api-center/cloudflare/tests -p 'test_*.py' -v

      - name: Verify provider and governance storage boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          provider = json.loads(Path('api-center/cloudflare/provider-catalog.json').read_text(encoding='utf-8'))['providers'][0]
          schema = json.loads(Path('api-center/cloudflare/ticket.schema.json').read_text(encoding='utf-8'))
          operation_ids = [row['operation_id'] for row in provider['operations']]
          workflow = Path('.github/workflows/cloudflare-api-ticket.yml').read_text(encoding='utf-8')
          assert provider['provider_id'] == 'cloudflare'
          assert provider['ticket_prefix'] == '[intel-cloudflare]'
          assert provider['required_secret_environment_variable'] == 'CLOUDFLARE_API_TOKEN'
          assert len(operation_ids) == len(set(operation_ids)) == 22
          assert set(operation_ids) == set(schema['properties']['operation']['enum'])
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['write_operations_allowed'] is False
          assert provider['limits']['urlscanner_submission_allowed'] is False
          assert provider['limits']['arbitrary_cloudflare_paths_allowed'] is False
          assert provider['limits']['custom_cookies_allowed'] is False
          assert provider['limits']['custom_browser_scripts_allowed'] is False
          assert all(row['result_contract']['read_only'] is True for row in provider['operations'])
          assert not Path('api-center/cloudflare/hf_archive.py').exists()
          assert not Path('api-center/cloudflare/tests/test_hf_archive.py').exists()
          assert 'Private Hugging Face archive executed: `false`' in workflow
          assert 'Long-term private storage authority: `a15280020511/decision-system-governance`' in workflow
          print(json.dumps({
              'status':'PASS',
              'provider':'cloudflare',
              'operations':22,
              'cloudflare_write_operations_allowed':False,
              'private_hf_archive_enabled':False,
              'storage_gateway':'a15280020511/decision-system-governance',
          }))
          PY
          git diff --check
