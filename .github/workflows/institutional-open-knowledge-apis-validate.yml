name: Institutional Open Knowledge APIs Validate

on:
  pull_request:
    paths:
      - "api-center/institutional-open-knowledge-apis/**"
      - ".github/workflows/institutional-open-knowledge-apis-validate.yml"
      - ".github/workflows/institutional-open-knowledge-apis-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/institutional-open-knowledge-apis/**"
      - ".github/workflows/institutional-open-knowledge-apis-validate.yml"
      - ".github/workflows/institutional-open-knowledge-apis-ticket.yml"

permissions:
  contents: read

concurrency:
  group: institutional-open-knowledge-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/institutional-open-knowledge-apis/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/institutional-open-knowledge-apis/requirements.txt
          python -m pip check
      - name: Compile and test
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/institutional-open-knowledge-apis/institutional_open_knowledge_task.py
          python -m unittest discover -s api-center/institutional-open-knowledge-apis/tests -p 'test_*.py' -v
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path('api-center/institutional-open-knowledge-apis')
          for path in root.glob('*.json'): json.loads(path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(json.loads((root/'ticket.schema.json').read_text(encoding='utf-8')))
          print('institutional open knowledge validation passed')
          PY
