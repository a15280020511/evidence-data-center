name: Temporary Web Retrieval Integrator V2

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[maintenance-web-v2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH_NAME: feat/jina-exa-web-retrieval
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          persist-credentials: true
          fetch-depth: 0

      - name: Publish started receipt
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="STATUS=started
RUN_ID=${GITHUB_RUN_ID}"

      - name: Decode fixed bundle and patch registry
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path

          parts = sorted(Path('.integration').glob('web-retrieval.bundle.part*'))
          expected = [f'web-retrieval.bundle.part{i:02d}' for i in range(6)]
          if [item.name for item in parts] != expected:
              raise SystemExit('bundle parts are incomplete')
          encoded = ''.join(item.read_text(encoding='utf-8').strip() for item in parts)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected_digest = '656b7868284471c501d221abcef14ef73fc561e3b5df85808b929b102700388f'
          if digest != expected_digest:
              raise SystemExit('bundle digest mismatch')
          target = Path('/tmp/web-retrieval-bundle.zip')
          target.write_bytes(raw)
          with zipfile.ZipFile(target) as archive:
              for member in archive.infolist():
                  path = Path(member.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('unsafe archive path')
              archive.extractall('.')
          PY
          python integrate.py
          rm -f integrate.py
          rm -rf .integration

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r api-center/requirements.txt -r api-center/web-retrieval/requirements.txt
          python -m pip check

      - name: Validate implementation
        run: |
          set -euo pipefail
          python api-center/build_catalog.py
          python -m compileall -q api-center
          python -m unittest discover -s api-center/web-retrieval/tests -p 'test_*.py' -v
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('api-center/api-catalog.json').read_text(encoding='utf-8'))
          providers = {row['provider_id']: row for row in catalog['managed_providers']}
          assert catalog['managed_provider_count'] == 11
          assert catalog['enabled_managed_provider_count'] == 11
          assert catalog['managed_operation_count'] == 104
          assert providers['jina-reader']['optional_secret_environment_variable_name'] == 'JINA_API_KEY'
          assert providers['exa']['required_secret_environment_variable_name'] == 'EXA_API_KEY'
          Path('/tmp/catalog-result.txt').write_text(
              f"PROVIDERS={catalog['managed_provider_count']}\nOPERATIONS={catalog['managed_operation_count']}\nPARAMETERS={catalog['exposed_parameter_count']}\n",
              encoding='utf-8',
          )
          PY

      - name: Commit feature branch
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Jina Reader and Exa web retrieval providers"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish completed receipt
        run: |
          result=$(cat /tmp/catalog-result.txt)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="STATUS=completed
SHA=${{ steps.commit.outputs.sha }}
${result}
JINA_OPTIONAL_SECRET=JINA_API_KEY
EXA_SECRET=EXA_API_KEY
SECRET_VALUES_READ=false"

      - name: Publish failed receipt
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="STATUS=failed
RUN_ID=${GITHUB_RUN_ID}"
