name: Defer Unverified FRASER OAI

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'feat/global-literature-libraries-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/global-literature-libraries-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Move FRASER from active registry to deferred evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          matrix_path=Path('api-center/global-literature-libraries/source-access-matrix.json')
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['sources']=[row for row in matrix['sources'] if row.get('source_id')!='fraser-oai']
          matrix['active_source_count']=len(matrix['sources'])
          if not any(row.get('source_id')=='fraser-oai' for row in matrix['not_enabled']):
              matrix['not_enabled'].append({
                  'source_id':'fraser-oai',
                  'reason':'Official HTTPS OAI endpoint timed out during a bounded 60-second live acceptance on 2026-08-03. Official FRASER terms require an API key, but a current verifiable OAI-PMH key-injection contract was not documented. Coverage remains available indirectly through DPLA; direct activation is deferred until the official authentication contract is confirmed.',
              })
          matrix_path.write_text(json.dumps(matrix,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          provider_path=Path('api-center/global-literature-libraries/provider-catalog.json')
          provider_doc=json.loads(provider_path.read_text(encoding='utf-8'))
          provider=provider_doc['providers'][0]
          provider['limits']['source_count']=matrix['active_source_count']
          provider['catalog_policy']=provider['catalog_policy'].replace('26个固定HTTPS来源','25个固定HTTPS来源')
          for operation in provider['operations']:
              if operation['operation_id'] in {'oai-identify','oai-list-records','oai-get-record'}:
                  enum=operation['parameter_schema']['properties']['source_id']['enum']
                  operation['parameter_schema']['properties']['source_id']['enum']=[value for value in enum if value!='fraser-oai']
          provider_path.write_text(json.dumps(provider_doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          validate_path=Path('api-center/global-literature-libraries/validate_global_literature.py')
          text=validate_path.read_text(encoding='utf-8')
          text=text.replace('== 26\n', '== 25\n')
          text=text.replace('"fraser-oai": ("oai-identify", {"source_id": "fraser-oai"}),\n', '"econstor-oai": ("oai-identify", {"source_id": "econstor-oai"}),\n')
          validate_path.write_text(text,encoding='utf-8')
          PY
      - name: Rebuild catalog and validate registry
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/global-literature-libraries/requirements.txt
          python api-center/build_catalog_market_search.py
          PYTHONPATH=api-center/global-literature-libraries:api-center \
            python api-center/global-literature-libraries/validate_global_literature.py \
              --output /tmp/global-literature-registry.json
          python api-center/tests/test_api_catalog.py
          git diff --check
      - name: Commit non-workflow registry changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api-center/global-literature-libraries/source-access-matrix.json \
            api-center/global-literature-libraries/provider-catalog.json \
            api-center/global-literature-libraries/validate_global_literature.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md
          git commit -m 'fix: defer unverified FRASER OAI and validate EconStor'
          git push origin HEAD:feat/global-literature-libraries-20260803
