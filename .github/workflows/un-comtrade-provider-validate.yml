name: Validate UN Comtrade Provider

on:
  pull_request:
    paths:
      - "api-center/un-comtrade/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/un-comtrade-provider-validate.yml"
      - ".github/workflows/un-comtrade-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/un-comtrade/**"
      - "api-center/managed_provider_runtime.py"
      - "api-center/build_catalog_market_search.py"
      - "api-center/api-catalog.json"
      - "api-center/api-catalog.md"
      - ".github/workflows/un-comtrade-provider-validate.yml"
      - ".github/workflows/un-comtrade-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/un-comtrade/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/un-comtrade/requirements.txt
          python -m pip check

      - name: Compile and test provider
        run: |
          python -m py_compile api-center/managed_provider_runtime.py api-center/un-comtrade/un_comtrade_task.py api-center/un-comtrade/tests/*.py
          python -m unittest discover -s api-center/un-comtrade/tests -p 'test_*.py' -v

      - name: Validate fixed safe contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('api-center/un-comtrade')
          schema = json.loads((root / 'ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'provider-catalog.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          provider = catalog['providers'][0]
          ids = {row['operation_id'] for row in provider['operations']}
          assert provider['provider_id'] == 'un-comtrade'
          assert provider['ticket_prefix'] == '[intel-un-comtrade]'
          assert provider['required_secret_environment_variable'] == 'UN_COMTRADE_API_KEY'
          assert len(ids) == 10
          assert provider['limits']['requests_per_ticket_max'] == 1
          assert provider['limits']['preview_records_max'] == 500
          assert provider['limits']['records_per_request_max'] == 5000
          assert provider['limits']['free_api_calls_per_day'] == 500
          assert provider['limits']['fixed_api_host'] == 'comtradeapi.un.org'
          assert provider['limits']['automatic_pagination_allowed'] is False
          assert provider['limits']['bulk_api_allowed'] is False
          assert provider['limits']['async_api_allowed'] is False
          assert provider['limits']['file_downloads_allowed'] is False
          assert provider['limits']['background_crawling_allowed'] is False
          assert provider['limits']['write_operations_allowed'] is False
          assert {
              'catalog-capabilities','preview-trade','final-trade','tariffline-trade',
              'data-availability','live-updates','metadata','trade-balance',
              'reporters-reference','partners-reference'
          } == ids
          print(json.dumps({'status':'PASS','operations':len(ids),'api_version':'v1'}))
          PY
          git diff --check
