name: One-shot fix Browserless catalog status

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/one_shot_fix_browserless_catalog_status.py"
      - ".github/workflows/one-shot-fix-browserless-catalog-status.yml"
      - "api-center/browserless/**"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Materialize and validate fix
        run: |
          python tools/one_shot_fix_browserless_catalog_status.py
          python -m pip install --disable-pip-version-check --no-input -r api-center/browserless/requirements.txt
          python -m pip check
          python -m py_compile api-center/browserless/browserless_task.py
          python -m unittest discover -s api-center/browserless/tests -p 'test_*.py' -v

      - name: Commit fixed runtime files
        run: |
          git add api-center/browserless/browserless_task.py api-center/browserless/tests/test_browserless_task.py
          if git diff --cached --quiet; then
            echo "Fix already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete Browserless catalog operation"
          git push origin "HEAD:${{ github.head_ref }}"
