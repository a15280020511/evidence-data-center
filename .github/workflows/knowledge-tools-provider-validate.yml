name: Validate Wolfram and LlamaParse Providers

# This workflow validates contracts without calling either paid upstream service.
on:
  pull_request:
    paths:
      - "api-center/knowledge-tools/**"
      - "api-center/build_catalog_market_search.py"
      - ".github/workflows/knowledge-tools-provider-validate.yml"
      - ".github/workflows/wolfram-api-ticket.yml"
      - ".github/workflows/llamaparse-api-ticket.yml"
  push:
    branches: [main]
    paths:
      - "api-center/knowledge-tools/**"
      - "api-center/build_catalog_market_search.py"
      - ".github/workflows/knowledge-tools-provider-validate.yml"
      - ".github/workflows/wolfram-api-ticket.yml"
      - ".github/workflows/llamaparse-api-ticket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/knowledge-tools/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/knowledge-tools/requirements.txt
          python -m pip check

      - name: Compile and test provider control plane
        run: |
          set -euo pipefail
          python -m py_compile \
            api-center/knowledge-tools/knowledge_tools_task.py \
            api-center/knowledge-tools/tests/test_knowledge_tools_task.py
          python -m unittest discover -s api-center/knowledge-tools/tests -v

      - name: Verify catalog and workflow invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('api-center/knowledge-tools/provider-catalog.json').read_text(encoding='utf-8'))
          assert catalog['secret_values_exposed'] is False
          providers = {row['provider_id']: row for row in catalog['providers']}
          assert set(providers) == {'wolfram-alpha', 'llamaparse'}
          assert len(providers['wolfram-alpha']['operations']) == 4
          assert len(providers['llamaparse']['operations']) == 3
          assert providers['wolfram-alpha']['required_secret_environment_variable'] == 'WOLFRAM_ALPHA_APP_ID'
          assert providers['llamaparse']['required_secret_environment_variable'] == 'LLAMA_CLOUD_API_KEY'
          assert providers['wolfram-alpha']['ticket_prefix'] == '[api-wolfram]'
          assert providers['llamaparse']['ticket_prefix'] == '[api-llamaparse]'
          assert providers['llamaparse']['limits']['arbitrary_urls_allowed'] is False
          assert providers['llamaparse']['limits']['presigned_urls_exposed'] is False
          serialized = json.dumps(catalog, ensure_ascii=False)
          assert 'WOLFRAM_ALPHA_APP_ID' in serialized
          assert 'LLAMA_CLOUD_API_KEY' in serialized
          assert 'Bearer llx-' not in serialized
          assert 'appid=' not in serialized
          for workflow, secret in (
              ('.github/workflows/wolfram-api-ticket.yml', 'WOLFRAM_ALPHA_APP_ID'),
              ('.github/workflows/llamaparse-api-ticket.yml', 'LLAMA_CLOUD_API_KEY'),
          ):
              text = Path(workflow).read_text(encoding='utf-8')
              assert f'secrets.{secret}' in text
              assert 'persist-credentials: false' in text
              assert 'API_KNOWLEDGE_TOOLS_COMPLETED' in text
          print(json.dumps({'status': 'PASS', 'providers': 2, 'operations': 7}))
          PY

      - name: Upload safe provider contracts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-tools-provider-contracts-${{ github.run_id }}
          path: |
            api-center/knowledge-tools/provider-catalog.json
            api-center/knowledge-tools/ticket.schema.json
          if-no-files-found: error
          retention-days: 30
