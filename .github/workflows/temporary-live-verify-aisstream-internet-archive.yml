name: Temporary Live Verify AISstream And Internet Archive

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temporary-live-verify-aisstream-internet-archive.yml

permissions:
  contents: read

concurrency:
  group: temporary-live-verify-aisstream-internet-archive
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/aisstream/requirements.txt
            api-center/internet-archive/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/aisstream/requirements.txt \
            -r api-center/internet-archive/requirements.txt
          python -m pip check

      - name: Live verify Internet Archive search
        run: |
          mkdir -p live-evidence/internet-archive-search
          cat > /tmp/internet-archive-search.json <<'JSON'
          {
            "task_id": "internet-archive-live-search-20260802-r2",
            "provider": "internet-archive",
            "operation": "search-items",
            "objective": "Verify the public Internet Archive advanced search endpoint.",
            "parameters": {
              "query": "collection:opensource_movies",
              "rows": 1,
              "page": 1,
              "fields": ["identifier", "title", "mediatype"],
              "sort": "downloads desc"
            },
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "acceptance": {"timeout_seconds": 30, "max_response_bytes": 2000000}
          }
          JSON
          python api-center/internet-archive/internet_archive_task.py execute --ticket /tmp/internet-archive-search.json --output-dir live-evidence/internet-archive-search

      - name: Live verify Internet Archive Wayback availability
        run: |
          mkdir -p live-evidence/internet-archive-wayback
          cat > /tmp/internet-archive-wayback.json <<'JSON'
          {
            "task_id": "internet-archive-live-wayback-20260802-r2",
            "provider": "internet-archive",
            "operation": "wayback-availability",
            "objective": "Verify the public Wayback availability endpoint.",
            "parameters": {"url": "https://example.com", "timestamp": "20200101"},
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "acceptance": {"timeout_seconds": 30, "max_response_bytes": 2000000}
          }
          JSON
          python api-center/internet-archive/internet_archive_task.py execute --ticket /tmp/internet-archive-wayback.json --output-dir live-evidence/internet-archive-wayback

      - name: Live verify AISstream when configured
        id: aisstream
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          mkdir -p live-evidence/aisstream
          if [ -z "${AISSTREAM_API_KEY:-}" ]; then
            printf '%s\n' '{"status":"SKIPPED_SECRET_NOT_CONFIGURED","secret_name":"AISSTREAM_API_KEY"}' > live-evidence/aisstream/live-status.json
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          cat > /tmp/aisstream-live.json <<'JSON'
          {
            "task_id": "aisstream-live-fuzhou-coast-20260802-r2",
            "provider": "aisstream",
            "operation": "collect-vessel-positions",
            "objective": "Verify bounded AISstream connectivity near the Fuzhou coast.",
            "parameters": {
              "bounding_boxes": [[[25.7, 118.9], [26.3, 119.8]]],
              "duration_seconds": 5,
              "max_messages": 10
            },
            "data_policy": {"classification": "public", "contains_personal_data": false},
            "acceptance": {"timeout_seconds": 20, "max_response_bytes": 2000000}
          }
          JSON
          python api-center/aisstream/aisstream_task.py execute --ticket /tmp/aisstream-live.json --output-dir live-evidence/aisstream

      - name: Enforce configured AISstream success
        if: steps.aisstream.outputs.configured == 'true' && steps.aisstream.outcome != 'success'
        run: exit 1

      - name: Verify credential value is absent from evidence
        if: always()
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          if grep -R -n '"APIKey"' live-evidence; then
            echo "subscription credential field found in evidence"
            exit 1
          fi
          if [ -n "${AISSTREAM_API_KEY:-}" ] && grep -R -F -n -- "${AISSTREAM_API_KEY}" live-evidence; then
            echo "credential value found in evidence"
            exit 1
          fi

      - name: Upload safe live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aisstream-internet-archive-live-${{ github.run_id }}
          path: live-evidence/
          if-no-files-found: error
          retention-days: 30
