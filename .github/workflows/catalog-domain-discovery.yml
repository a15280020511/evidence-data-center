name: Catalog Domain Discovery

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "api-center/information-tool-radar/catalog-domains.json"
      - "api-center/information-tool-radar/catalog_domain_discovery.py"
      - "api-center/information-tool-radar/test_catalog_domain_discovery.py"
      - ".github/workflows/catalog-domain-discovery.yml"
  push:
    branches: [main]
    paths:
      - "api-center/information-tool-radar/catalog-domains.json"
      - "api-center/information-tool-radar/catalog_domain_discovery.py"
      - "api-center/information-tool-radar/test_catalog_domain_discovery.py"
      - ".github/workflows/catalog-domain-discovery.yml"

permissions:
  contents: read

concurrency:
  group: catalog-domain-discovery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile and test
        working-directory: api-center/information-tool-radar
        run: |
          set -o pipefail
          python -m py_compile catalog_domain_discovery.py test_catalog_domain_discovery.py
          python test_catalog_domain_discovery.py | tee ../../catalog-domain-discovery-unit.json

      - name: Discover candidates through Wikimedia
        run: |
          set -o pipefail
          mkdir -p catalog-domain-discovery-artifact
          python api-center/information-tool-radar/catalog_domain_discovery.py \
            --registry api-center/information-tool-radar/catalog-domains.json \
            --output catalog-domain-discovery-artifact/catalog-domain-discovery-report.json \
            --enforce-policy | tee catalog-domain-discovery-run.json

      - name: Validate evidence
        run: |
          python -m json.tool api-center/information-tool-radar/catalog-domains.json >/dev/null
          python -m json.tool catalog-domain-discovery-unit.json >/dev/null
          python -m json.tool catalog-domain-discovery-run.json >/dev/null
          python -m json.tool catalog-domain-discovery-artifact/catalog-domain-discovery-report.json >/dev/null
          test -s catalog-domain-discovery-artifact/catalog-domain-discovery-report.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-domain-discovery-${{ github.run_id }}
          path: |
            catalog-domain-discovery-unit.json
            catalog-domain-discovery-run.json
            catalog-domain-discovery-artifact/
          if-no-files-found: warn
          retention-days: 30
