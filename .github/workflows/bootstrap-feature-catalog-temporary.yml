name: Temporary feature catalog bootstrap

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-feature-catalog-bootstrap
  cancel-in-progress: false

jobs:
  regenerate:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[bootstrap-knowledge-document] regenerate catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/api-center-wolframalpha-llamaparse
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install and validate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/knowledge-document/requirements.txt
          python -m pip check
          python -m py_compile api-center/knowledge-document/provider_task.py
          python -m unittest discover -s api-center/knowledge-document/tests -p 'test_*.py' -v
          python api-center/build_catalog_market_search.py

      - name: Commit generated contracts to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-center/api-catalog.json api-center/api-catalog.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(api-center): regenerate WolframAlpha and LlamaParse catalog"
            git push origin HEAD:feat/api-center-wolframalpha-llamaparse
          fi

      - name: Publish bootstrap result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body='Catalog bootstrap completed and feature branch contracts were regenerated.'
