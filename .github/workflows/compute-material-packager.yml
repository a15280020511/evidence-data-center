name: Validate Compute Material Packaging Contract

on:
  pull_request:
    paths:
      - "api-center/huggingface/compute_material_packager.py"
      - "api-center/huggingface/compute-material-packaging/**"
      - "api-center/huggingface/tests/test_compute_material_packager.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/compute-material-packager.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/compute_material_packager.py"
      - "api-center/huggingface/compute-material-packaging/**"
      - "api-center/huggingface/tests/test_compute_material_packager.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/compute-material-packager.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-compute-material-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-packager-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ""
      HF_DOMAIN_BENCHMARK_DATASET_REPO: ""
      HF_CLOUDFLARE_DATASET_REPO: ""
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/huggingface/requirements.txt
          python -m pip check

      - name: Compile and test deterministic packaging contract
        run: |
          set -euo pipefail
          python -m py_compile api-center/huggingface/compute_material_packager.py
          python -m unittest api-center/huggingface/tests/test_compute_material_packager.py -v
          git diff --check

      - name: Record migration boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Compute material packaging boundary

          - Evidence center runtime packaging: `disabled`
          - Private Hugging Face access: `disabled`
          - Future package owner: `a15280020511/decision-system-governance`
          - Compute direct Dataset access: `forbidden`
          EOF
