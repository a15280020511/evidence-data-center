name: Build Compute Material Package

on:
  pull_request:
    paths:
      - "api-center/huggingface/compute_material_packager.py"
      - "api-center/huggingface/compute-material-packaging/**"
      - "api-center/huggingface/tests/test_compute_material_packager.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/compute-material-packager.yml"
  push:
    branches: [main]
    paths:
      - "api-center/huggingface/compute_material_packager.py"
      - "api-center/huggingface/compute-material-packaging/**"
      - "api-center/huggingface/tests/test_compute_material_packager.py"
      - "api-center/huggingface/requirements.txt"
      - ".github/workflows/compute-material-packager.yml"
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: compute-material-packager-${{ github.event_name }}-${{ github.ref }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-packager:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, '[build-compute-material-package]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements.txt
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/huggingface/requirements.txt
          python -m pip check
      - name: Compile and test deterministic packager
        run: |
          set -euo pipefail
          python -m py_compile api-center/huggingface/compute_material_packager.py
          python -m unittest api-center/huggingface/tests/test_compute_material_packager.py -v

  build-private-package:
    if: >-
      always() &&
      needs.validate-packager.result == 'success' &&
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[build-compute-material-package]')
    needs: [validate-packager]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DOMAIN_BENCHMARK_DATASET_REPO: ${{ vars.HF_DOMAIN_BENCHMARK_DATASET_REPO }}
      HF_CLOUDFLARE_DATASET_REPO: ${{ vars.HF_CLOUDFLARE_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/huggingface/requirements.txt
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r api-center/huggingface/requirements.txt
          python -m pip check
      - name: Build immutable compute material package
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python api-center/huggingface/compute_material_packager.py build-hf \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir compute-material-package
      - name: Render package receipt
        if: always()
        run: |
          python api-center/huggingface/compute_material_packager.py render \
            --output-dir compute-material-package > compute-material-package-comment.md || true
          cat compute-material-package-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish package receipt
        if: always()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@compute-material-package-comment.md
      - name: Upload complete package Artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compute-material-package-${{ github.event.issue.number }}-${{ github.run_id }}
          path: compute-material-package/
          if-no-files-found: error
          retention-days: 30
      - name: Mark packaging failure
        if: always() && steps.build.outcome != 'success'
        run: exit 1
