name: One-shot Hugging Face Token Full Acceptance

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-hf-token-full-acceptance
  cancel-in-progress: false

jobs:
  accept-token:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-hf-token-full-acceptance]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HOME: /tmp/hf-token-full-acceptance
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned Hugging Face client
        run: |
          python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.24.0
          python -m pip check

      - name: Run reversible authenticated acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import tempfile
          from pathlib import Path
          from typing import Any, Callable

          from huggingface_hub import HfApi, InferenceClient, hf_hub_download

          token = os.environ.get("HF_TOKEN", "").strip()
          run_id = os.environ.get("GITHUB_RUN_ID", "unknown")
          api = HfApi(endpoint="https://huggingface.co", token=False)
          tests: dict[str, dict[str, Any]] = {}
          cleanup: dict[str, dict[str, Any]] = {}
          created: list[tuple[str, str]] = []
          state: dict[str, Any] = {
              "account": None,
              "token_role": None,
              "permission_summary": {},
          }

          def safe_error(exc: BaseException) -> str:
              message = str(exc)
              if token:
                  message = message.replace(token, "[REDACTED]")
              return message.replace("\n", " ")[:700]

          def record(name: str, fn: Callable[[], dict[str, Any] | None]) -> bool:
              try:
                  detail = fn() or {}
                  tests[name] = {"status": "PASS", **detail}
                  return True
              except Exception as exc:
                  tests[name] = {
                      "status": "FAIL",
                      "error_type": type(exc).__name__,
                      "error": safe_error(exc),
                  }
                  return False

          try:
              if not token:
                  tests["identity_authentication"] = {
                      "status": "FAIL",
                      "error_type": "RuntimeError",
                      "error": "HF_TOKEN is not configured",
                  }
              else:
                  def identity() -> dict[str, Any]:
                      info = api.whoami(token=token)
                      if not isinstance(info, dict) or not info.get("name"):
                          raise RuntimeError("official whoami response did not contain an account name")
                      state["account"] = str(info["name"])
                      auth = info.get("auth") if isinstance(info.get("auth"), dict) else {}
                      access = auth.get("accessToken") if isinstance(auth.get("accessToken"), dict) else {}
                      state["token_role"] = str(access.get("role") or "not-reported")
                      fine = access.get("fineGrained") if isinstance(access.get("fineGrained"), dict) else {}
                      global_permissions = [
                          str(item) for item in (fine.get("global") or [])
                          if isinstance(item, str) and 0 < len(item) <= 120
                      ]
                      scoped = []
                      for item in fine.get("scoped") or []:
                          if not isinstance(item, dict):
                              continue
                          entity = item.get("entity") if isinstance(item.get("entity"), dict) else {}
                          permissions = [
                              str(value) for value in (item.get("permissions") or [])
                              if isinstance(value, str) and 0 < len(value) <= 120
                          ]
                          scoped.append({
                              "entity_type": entity.get("type"),
                              "entity_name": entity.get("name"),
                              "permissions": permissions,
                          })
                      state["permission_summary"] = {
                          "can_read_gated_repos": bool(fine.get("canReadGatedRepos", False)),
                          "global": global_permissions,
                          "scoped": scoped,
                      }
                      return {
                          "account": state["account"],
                          "account_type": info.get("type"),
                          "token_role": state["token_role"],
                      }

                  identity_ok = record("identity_authentication", identity)
                  if identity_ok:
                      account = str(state["account"])
                      record(
                          "authenticated_public_model_read",
                          lambda: {
                              "repo": api.model_info(
                                  "google-bert/bert-base-uncased",
                                  token=token,
                                  timeout=30,
                              ).id
                          },
                      )
                      record(
                          "authenticated_public_dataset_read",
                          lambda: {
                              "repo": api.dataset_info(
                                  "ylecun/mnist",
                                  token=token,
                                  timeout=30,
                              ).id
                          },
                      )

                      dataset_repo = f"{account}/hf-token-e2e-dataset-{run_id}"
                      model_repo = f"{account}/hf-token-e2e-model-{run_id}"

                      def create_dataset() -> dict[str, Any]:
                          api.create_repo(
                              repo_id=dataset_repo,
                              repo_type="dataset",
                              private=True,
                              token=token,
                              exist_ok=False,
                          )
                          created.append((dataset_repo, "dataset"))
                          info = api.dataset_info(dataset_repo, token=token, timeout=30)
                          if getattr(info, "private", None) is not True:
                              raise RuntimeError("temporary dataset repository was not private")
                          return {"repo_type": "dataset", "private": True}

                      dataset_created = record("private_dataset_create", create_dataset)
                      if dataset_created:
                          payload_v1 = (
                              b"HF_TOKEN_FULL_ACCEPTANCE_V1\n" + bytes(range(256)) * 4096
                          )[:1_048_576]
                          payload_v2 = (
                              b"HF_TOKEN_FULL_ACCEPTANCE_V2\n" + bytes(reversed(range(256))) * 4096
                          )[:1_048_576]
                          sha_v1 = hashlib.sha256(payload_v1).hexdigest()
                          sha_v2 = hashlib.sha256(payload_v2).hexdigest()

                          def upload_dataset(payload: bytes, digest: str, message: str) -> dict[str, Any]:
                              api.upload_file(
                                  path_or_fileobj=payload,
                                  path_in_repo="acceptance/probe.bin",
                                  repo_id=dataset_repo,
                                  repo_type="dataset",
                                  token=token,
                                  commit_message=message,
                              )
                              return {"bytes": len(payload), "sha256": digest}

                          record(
                              "private_dataset_upload",
                              lambda: upload_dataset(
                                  payload_v1,
                                  sha_v1,
                                  "HF token reversible acceptance upload",
                              ),
                          )

                          def list_dataset_tree() -> dict[str, Any]:
                              rows = list(api.list_repo_tree(
                                  dataset_repo,
                                  repo_type="dataset",
                                  path_in_repo="acceptance",
                                  recursive=False,
                                  expand=True,
                                  token=token,
                              ))
                              paths = [str(getattr(row, "path", "")) for row in rows]
                              if "acceptance/probe.bin" not in paths:
                                  raise RuntimeError("uploaded file was not visible in private repository tree")
                              return {"entries": len(rows), "probe_visible": True}

                          record("private_dataset_tree_read", list_dataset_tree)

                          def download_dataset(expected: bytes, digest: str, suffix: str) -> dict[str, Any]:
                              with tempfile.TemporaryDirectory(prefix=f"hf-{suffix}-") as cache:
                                  local = hf_hub_download(
                                      repo_id=dataset_repo,
                                      filename="acceptance/probe.bin",
                                      repo_type="dataset",
                                      token=token,
                                      cache_dir=cache,
                                      force_download=True,
                                  )
                                  actual = Path(local).read_bytes()
                              actual_sha = hashlib.sha256(actual).hexdigest()
                              if actual != expected or actual_sha != digest:
                                  raise RuntimeError("private dataset download checksum mismatch")
                              return {"bytes": len(actual), "sha256": actual_sha}

                          record(
                              "private_dataset_download_checksum",
                              lambda: download_dataset(payload_v1, sha_v1, "dataset-v1"),
                          )
                          record(
                              "private_dataset_update",
                              lambda: upload_dataset(
                                  payload_v2,
                                  sha_v2,
                                  "HF token reversible acceptance update",
                              ),
                          )
                          record(
                              "private_dataset_updated_download_checksum",
                              lambda: download_dataset(payload_v2, sha_v2, "dataset-v2"),
                          )

                          def delete_dataset_file() -> dict[str, Any]:
                              api.delete_file(
                                  path_in_repo="acceptance/probe.bin",
                                  repo_id=dataset_repo,
                                  repo_type="dataset",
                                  token=token,
                                  commit_message="HF token reversible acceptance cleanup",
                              )
                              rows = list(api.list_repo_tree(
                                  dataset_repo,
                                  repo_type="dataset",
                                  recursive=True,
                                  expand=False,
                                  token=token,
                              ))
                              paths = [str(getattr(row, "path", "")) for row in rows]
                              if "acceptance/probe.bin" in paths:
                                  raise RuntimeError("deleted file remained visible")
                              return {"deleted": True}

                          record("private_dataset_file_delete", delete_dataset_file)

                      def create_model() -> dict[str, Any]:
                          api.create_repo(
                              repo_id=model_repo,
                              repo_type="model",
                              private=True,
                              token=token,
                              exist_ok=False,
                          )
                          created.append((model_repo, "model"))
                          info = api.model_info(model_repo, token=token, timeout=30)
                          if getattr(info, "private", None) is not True:
                              raise RuntimeError("temporary model repository was not private")
                          return {"repo_type": "model", "private": True}

                      model_created = record("private_model_create", create_model)
                      if model_created:
                          model_payload = json.dumps(
                              {"model_type": "hf-token-acceptance", "temporary": True},
                              sort_keys=True,
                          ).encode("utf-8")
                          model_sha = hashlib.sha256(model_payload).hexdigest()

                          def upload_model() -> dict[str, Any]:
                              api.upload_file(
                                  path_or_fileobj=model_payload,
                                  path_in_repo="config.json",
                                  repo_id=model_repo,
                                  repo_type="model",
                                  token=token,
                                  commit_message="HF token reversible model acceptance",
                              )
                              return {"bytes": len(model_payload), "sha256": model_sha}

                          record("private_model_upload", upload_model)

                          def download_model() -> dict[str, Any]:
                              with tempfile.TemporaryDirectory(prefix="hf-model-") as cache:
                                  local = hf_hub_download(
                                      repo_id=model_repo,
                                      filename="config.json",
                                      repo_type="model",
                                      token=token,
                                      cache_dir=cache,
                                      force_download=True,
                                  )
                                  actual = Path(local).read_bytes()
                              actual_sha = hashlib.sha256(actual).hexdigest()
                              if actual_sha != model_sha:
                                  raise RuntimeError("private model download checksum mismatch")
                              return {"bytes": len(actual), "sha256": actual_sha}

                          record("private_model_download_checksum", download_model)

                      def inference_probe() -> dict[str, Any]:
                          client = InferenceClient(
                              provider="hf-inference",
                              api_key=token,
                              timeout=45,
                          )
                          output = client.fill_mask(
                              "Paris is the [MASK] of France.",
                              model="google-bert/bert-base-uncased",
                          )
                          if not output:
                              raise RuntimeError("HF Inference returned an empty result")
                          return {
                              "provider": "hf-inference",
                              "task": "fill-mask",
                              "result_count": len(output),
                          }

                      record("inference_provider_call", inference_probe)
          except Exception as exc:
              tests["test_harness"] = {
                  "status": "FAIL",
                  "error_type": type(exc).__name__,
                  "error": safe_error(exc),
              }
          finally:
              for repo_name, repo_type in reversed(created):
                  try:
                      api.delete_repo(
                          repo_id=repo_name,
                          repo_type=repo_type,
                          token=token,
                          missing_ok=True,
                      )
                      cleanup[repo_type] = {
                          "status": "PASS",
                          "temporary_repo_deleted": True,
                      }
                  except Exception as exc:
                      cleanup[repo_type] = {
                          "status": "FAIL",
                          "temporary_repo_deleted": False,
                          "error_type": type(exc).__name__,
                          "error": safe_error(exc),
                      }

              failed = [name for name, row in tests.items() if row.get("status") == "FAIL"]
              cleanup_failed = [name for name, row in cleanup.items() if row.get("status") == "FAIL"]
              overall = (
                  "HF_TOKEN_FULL_ACCEPTANCE_PASS"
                  if tests and not failed and not cleanup_failed
                  else "HF_TOKEN_FULL_ACCEPTANCE_PARTIAL"
              )
              result = {
                  "overall": overall,
                  "account": state.get("account"),
                  "token_role": state.get("token_role"),
                  "permission_summary": state.get("permission_summary", {}),
                  "tests": tests,
                  "cleanup": cleanup,
                  "failed_tests": failed,
                  "cleanup_failures": cleanup_failed,
                  "secret_value_exposed": False,
              }
              Path("/tmp/hf-token-full-result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
          PY

      - name: Publish redacted result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/hf-token-full-comment.md
          import json
          from pathlib import Path

          path = Path('/tmp/hf-token-full-result.json')
          if not path.exists():
              print('Hugging Face token full acceptance: `HF_TOKEN_FULL_ACCEPTANCE_FAILED`')
              print()
              print('- Failure: test process did not produce a safe result document')
              print('- Secret values exposed: `false`')
          else:
              data = json.loads(path.read_text(encoding='utf-8'))
              print(f"Hugging Face token full acceptance: `{data.get('overall')}`")
              print()
              print(f"- Account: `{data.get('account') or 'unknown'}`")
              print(f"- Token role: `{data.get('token_role') or 'unknown'}`")
              print(f"- Gated repositories scope: `{data.get('permission_summary', {}).get('can_read_gated_repos', False)}`")
              print(f"- Secret values exposed: `{str(data.get('secret_value_exposed', False)).lower()}`")
              print()
              print('| Test | Result | Detail |')
              print('|---|---|---|')
              for name, row in data.get('tests', {}).items():
                  detail = row.get('error') or row.get('repo_type') or row.get('task') or row.get('repo') or ''
                  detail = str(detail).replace('|', '/').replace('\n', ' ')[:180]
                  print(f"| `{name}` | `{row.get('status')}` | {detail} |")
              for name, row in data.get('cleanup', {}).items():
                  detail = 'temporary repository deleted' if row.get('temporary_repo_deleted') else row.get('error', '')
                  detail = str(detail).replace('|', '/').replace('\n', ' ')[:180]
                  print(f"| `cleanup_{name}` | `{row.get('status')}` | {detail} |")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@/tmp/hf-token-full-comment.md

      - name: Enforce acceptance verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/hf-token-full-result.json')
          if not path.exists():
              raise SystemExit(1)
          result = json.loads(path.read_text(encoding='utf-8'))
          raise SystemExit(0 if result.get('overall') == 'HF_TOKEN_FULL_ACCEPTANCE_PASS' else 1)
          PY
