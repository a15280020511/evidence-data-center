name: Validate re3data Provider

on:
  pull_request:
    paths:
      - "api-center/research-data-registry/**"
      - ".github/workflows/re3data-*.yml"
  push:
    branches: [main]
    paths:
      - "api-center/research-data-registry/**"
      - ".github/workflows/re3data-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-center/requirements.txt
            api-center/research-data-registry/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/research-data-registry/requirements.txt
          python -m pip check
      - name: Compile
        run: python -m py_compile api-center/managed_provider_runtime.py api-center/research-data-registry/re3data_task.py
      - name: Unit tests
        run: python -m unittest discover -s api-center/research-data-registry/tests -p 'test_*.py' -v
      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('api-center/research-data-registry').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
