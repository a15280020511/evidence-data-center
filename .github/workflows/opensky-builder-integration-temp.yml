name: Temporary OpenSky Builder Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "api-center/opensky-network/**"
      - ".github/workflows/opensky-builder-integration-temp.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/opensky-network-provider

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/requirements.txt \
            -r api-center/opensky-network/requirements.txt
          python -m pip check

      - name: Patch builder and regenerate catalogs
        run: |
          python api-center/opensky-network/integrate_builder_temp.py
          python -m py_compile api-center/build_catalog_market_search.py api-center/opensky-network/opensky_network_task.py
          python -m unittest discover -s api-center/opensky-network/tests -p 'test_*.py' -v
          python api-center/build_config.py
          python api-center/build_catalog_market_search.py
          python -m unittest discover -s api-center/tests -p 'test_*.py' -v
          git diff --check

      - name: Commit builder and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-center/build_catalog_market_search.py \
            api-center/api-catalog.json \
            api-center/api-catalog.md \
            api-center/connector-manifest.json \
            api-center/krakend.validation.json \
            api-center/krakend.tmpl
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "fix: register OpenSky in catalog generator"
            git push origin HEAD:feat/opensky-network-provider
          fi
