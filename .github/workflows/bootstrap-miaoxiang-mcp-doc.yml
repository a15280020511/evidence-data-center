name: Fetch official Miaoxiang MCP documentation

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: fetch-miaoxiang-mcp-doc
  cancel-in-progress: false

jobs:
  fetch-doc:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] fetch-miaoxiang-mcp-doc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Fetch official installation document
        run: |
          set -euo pipefail
          mkdir -p miaoxiang-mcp-doc
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            'https://mxapi.eastmoney.com/mxds/doc/mcp-install.md' \
            --output miaoxiang-mcp-doc/mcp-install.md
          test -s miaoxiang-mcp-doc/mcp-install.md
          sha256sum miaoxiang-mcp-doc/mcp-install.md > miaoxiang-mcp-doc/SHA256SUMS
          wc -c miaoxiang-mcp-doc/mcp-install.md

      - name: Upload official documentation evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miaoxiang-mcp-official-doc-${{ github.run_id }}
          path: miaoxiang-mcp-doc/
          if-no-files-found: error
          retention-days: 30

      - name: Publish receipt
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="MIAOXIANG_MCP_DOC_FETCHED source=https://mxapi.eastmoney.com/mxds/doc/mcp-install.md artifact=${ARTIFACT_URL} model_calls=0"
