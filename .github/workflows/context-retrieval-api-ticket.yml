name: Managed Tavily and Firecrawl API Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: api-context-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-context-api:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[api-context]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-center/web-retrieval/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r api-center/web-retrieval/requirements.txt
          python -m pip check

      - name: Compile context retrieval control plane
        run: python -m py_compile api-center/web-retrieval/context_retrieval_task.py

      - name: Parse and authorize context ticket
        id: prepare
        continue-on-error: true
        run: |
          python api-center/web-retrieval/context_retrieval_task.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir context-artifacts

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python api-center/web-retrieval/context_retrieval_task.py render \
            --output-dir context-artifacts --phase accepted > context-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@context-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python api-center/web-retrieval/context_retrieval_task.py render \
            --output-dir context-artifacts --phase rejected > context-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@context-comment.md

      - name: Execute bounded read-only context operation
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          python api-center/web-retrieval/context_retrieval_task.py execute \
            --ticket context-artifacts/ticket.json \
            --output-dir context-artifacts

      - name: Upload context retrieval evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: context-retrieval-api-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: context-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified result or structured failure
        if: always() && steps.prepare.outputs.accepted == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python api-center/web-retrieval/context_retrieval_task.py render \
            --output-dir context-artifacts \
            --phase completed \
            --artifact-url "$ARTIFACT_URL" > context-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@context-comment.md

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outputs.status != 'API_CONTEXT_COMPLETED' ||
           steps.upload.outcome != 'success')
        run: |
          echo "Context retrieval API ticket did not complete successfully."
          exit 1
